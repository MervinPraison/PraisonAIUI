<p>Reference for <code>import praisonaiui as aiui</code>.</p>
<h2>Server Configuration</h2>
<p>These functions configure the server. Call them at module level in your <code>app.py</code>, before the server starts.</p>
<h3>`aiui.set_style(style)`</h3>
<p>Set the UI style.</p>
<p>| Parameter | Type | Values |</p>
<p>|-----------|------|--------|</p>
<p>| <code>style</code> | <code>str</code> | <code>"app"</code> (the React app shell), <code>"chat"</code> (the classic chat), <code>"dashboard"</code>, <code>"agents"</code>, <code>"playground"</code>, <code>"docs"</code>, <code>"custom"</code> |</p>
<p>Priority under <code>aiui run</code>: CLI <code>--style</code>, then <code>set_style()</code>, then</p>
<p>auto-detection (a plain chat app gets <code>app</code>). See</p>
<p>UI Styles.</p>
<p>---</p>
<h3>`aiui.set_pages(page_ids)`</h3>
<p>Whitelist which built-in sidebar pages to show (dashboard mode). Custom pages registered via <code>@aiui.page()</code> always appear.</p>
<p>Use <code>aiui pages ids</code> to see all available page IDs.</p>
<p>---</p>
<h3>`aiui.set_branding(title, logo)`</h3>
<p>Configure the sidebar branding (title text and logo).</p>
<p>| Parameter | Type | Default |</p>
<p>|-----------|------|---------|</p>
<p>| <code>title</code> | <code>str</code> | <code>"PraisonAI"</code> |</p>
<p>| <code>logo</code> | <code>str</code> | <code>""</code> (no logo: the PraisonAI brand glyph) |</p>
<p><code>logo</code> is an image URL or path (<code>/static/logo.svg</code>, <code>https://…</code>, <code>data:image/…</code>)</p>
<p>or a short text mark. Left empty, every UI draws the PraisonAI glyph on the</p>
<p>accent tile.</p>
<p>Also configurable via <code>config.yaml</code>:</p>
<p>---</p>
<h3>`aiui.set_datastore(store)`</h3>
<p>Set the persistence backend for sessions and messages.</p>
<p>Without a call, the server uses the SDK store shared with PraisonAI Agents</p>
<p>(<code>SDKFileDataStore</code>, from <code>praisonaiui.datastore_sdk</code>), falling back to</p>
<p><code>JSONFileDataStore</code>. <code>aiui run --datastore</code> sets the same thing from the</p>
<p>command line.</p>
<p>---</p>
<h3>`aiui.set_provider(provider)`</h3>
<p>Set the AI provider for chat completions.</p>
<p>---</p>
<h3>`aiui.register_agent(name, agent)`</h3>
<p>Register an agent object (for example a PraisonAI Agents <code>Agent</code>) under a</p>
<p>name. Together with an <code>@aiui.profiles</code> callback, registered agents make</p>
<p><code>aiui run</code> pick the <code>agents</code> style.</p>
<p>Agents created in the dashboard's Agents page are a separate store</p>
<p>(<code>/api/agents/definitions</code>).</p>
<p>---</p>
<h3>`aiui.remove_page(page_id)`</h3>
<p>Remove a page from the sidebar.</p>
<p>---</p>
<h3>`aiui.set_chat_mode(mode, *, position, size, resizable, minimized)`</h3>
<p>Configure chat window display mode — full page, floating window, or sidebar panel.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>mode</code> | <code>str</code> | <code>"fullpage"</code> | <code>"fullpage"</code>, <code>"floating"</code>, or <code>"sidebar"</code> |</p>
<p>| <code>position</code> | <code>tuple[int, int]</code> | <code>(20, 20)</code> | (bottom, right) pixel offset for floating mode |</p>
<p>| <code>size</code> | <code>tuple[int, int]</code> | <code>(400, 500)</code> | (width, height) initial size for floating mode |</p>
<p>| <code>resizable</code> | <code>bool</code> | <code>True</code> | Allow resizing the floating window |</p>
<p>| <code>minimized</code> | <code>bool</code> | <code>False</code> | Start minimized (floating mode only) |</p>
<p>---</p>
<h3>`aiui.set_sidebar_config(*, collapsible, default_collapsed, width, min_width, max_width)`</h3>
<p>Configure sidebar behavior and dimensions.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>collapsible</code> | <code>bool</code> | <code>True</code> | Allow sidebar to be collapsed |</p>
<p>| <code>default_collapsed</code> | <code>bool</code> | <code>False</code> | Start with sidebar collapsed |</p>
<p>| <code>width</code> | <code>int</code> | <code>260</code> | Default sidebar width in pixels |</p>
<p>| <code>min_width</code> | <code>int</code> | <code>200</code> | Minimum width when resizing |</p>
<p>| <code>max_width</code> | <code>int</code> | <code>360</code> | Maximum width when resizing |</p>
<p>---</p>
<h3>`aiui.set_brand_color(color)`</h3>
<p>Set the brand/primary accent color. Overrides the theme's default accent.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>color</code> | <code>str</code> | Hex color (e.g. <code>"#6366f1"</code>) or CSS color value |</p>
<p>---</p>
<h3>`aiui.set_chat_features(*, history, streaming, file_upload, audio, reasoning, tools, multimedia, feedback)`</h3>
<p>Configure which chat features are enabled in the UI.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>history</code> | <code>bool</code> | <code>True</code> | Show session history sidebar |</p>
<p>| <code>streaming</code> | <code>bool</code> | <code>True</code> | Enable streaming responses |</p>
<p>| <code>file_upload</code> | <code>bool</code> | <code>False</code> | Show file upload button |</p>
<p>| <code>audio</code> | <code>bool</code> | <code>False</code> | Show audio input button |</p>
<p>| <code>reasoning</code> | <code>bool</code> | <code>True</code> | Show reasoning/thinking steps |</p>
<p>| <code>tools</code> | <code>bool</code> | <code>True</code> | Show tool call displays |</p>
<p>| <code>multimedia</code> | <code>bool</code> | <code>True</code> | Enable multimedia rendering |</p>
<p>| <code>feedback</code> | <code>bool</code> | <code>False</code> | Show feedback buttons |</p>
<p>---</p>
<h3>`aiui.set_dashboard(*, sidebar, page_header, modules, plugin_dirs, plugins, groups)`</h3>
<p>Configure dashboard layout options.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>sidebar</code> | <code>bool</code> | <code>True</code> | Show the left sidebar navigation |</p>
<p>| <code>page_header</code> | <code>bool</code> | <code>True</code> | Show the page title/description header |</p>
<p>| <code>modules</code> | <code>list[str] \| None</code> | <code>None</code> | Optional dashboard JS modules (<code>jobs</code>, <code>auth</code>, <code>api</code>) |</p>
<p>| <code>plugin_dirs</code> | <code>list[str] \| None</code> | <code>None</code> | Extra directories to scan for dashboard plugins |</p>
<p>| <code>plugins</code> | <code>list[str] \| None</code> | <code>None</code> | Allowlist of dashboard plugin names. <code>None</code> = all discovered (bundled, <code>~/.praisonai/dashboard-plugins</code>, <code>plugin_dirs</code>); <code>[]</code> = none |</p>
<p>| <code>groups</code> | <code>dict \| None</code> | <code>None</code> | Sidebar group order and folding in the app shell (YAML <code>dashboard.groups</code>) |</p>
<p><code>plugins</code> filters both the sidebar pages (<code>/api/pages</code>) and the browser plugin</p>
<p>manifest (<code>/api/dashboard/plugins</code>), so disabled plugin scripts are never loaded.</p>
<p>It scopes navigation only — it is <strong>not</strong> an authorization boundary for API routes.</p>
<p>---</p>
<h3>`aiui.set_chat_preview(enabled, *, surface_id, width)`</h3>
<p>Configure the <strong>chat + canvas</strong> split preview (<code>chat-canvas</code> page). The vanilla <code>chat</code> page is unchanged.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>enabled</code> | <code>bool</code> | <code>True</code> | Expose preview settings in <code>/ui-config.json</code> |</p>
<p>| <code>surface_id</code> | <code>str</code> | <code>"main"</code> | Default A2UI surface id for the preview panel |</p>
<p>| <code>width</code> | <code>str</code> | <code>"40%"</code> | CSS width of the preview column (e.g. <code>"38%"</code>, <code>"420px"</code>) |</p>
<p>See A2UI canvas.</p>
<p>---</p>
<h3>`aiui.set_theme(preset="zinc", dark_mode=True, radius="md")`</h3>
<p>Set the colour palette, colour mode and corner radius. Takes priority over</p>
<p>YAML <code>site.theme</code>.</p>
<p>| Parameter | Type | Values |</p>
<p>|-----------|------|--------|</p>
<p>| <code>preset</code> | <code>str</code> | <code>zinc</code>, <code>slate</code>, <code>stone</code>, <code>gray</code>, <code>neutral</code>, <code>red</code>, <code>orange</code>, <code>amber</code>, <code>yellow</code>, <code>lime</code>, <code>green</code>, <code>emerald</code>, <code>teal</code>, <code>cyan</code>, <code>sky</code>, <code>blue</code>, <code>indigo</code>, <code>violet</code>, <code>purple</code>, <code>fuchsia</code>, <code>pink</code>, <code>rose</code>, or a name from <code>register_theme()</code> |</p>
<p>| <code>dark_mode</code> | <code>bool \| None</code> | <code>True</code> dark, <code>False</code> light, <code>None</code> leaves it to YAML or the viewer and the OS |</p>
<p>| <code>radius</code> | <code>str</code> | <code>none</code>, <code>sm</code>, <code>md</code>, <code>lg</code>, <code>xl</code> |</p>
<p>See Theming.</p>
<p>---</p>
<h3>`aiui.set_custom_css(css)`</h3>
<p>Add a CSS string to the page as an inline <code>&lt;style&gt;</code> tag.</p>
<p>---</p>
<h3>`aiui.set_layout(default=None, *, available=None, user_choice=None, primary=None, options=None)`</h3>
<p>Choose the React app shell's layout (<code>style: app</code>). See</p>
<p>Layouts.</p>
<p>---</p>
<h3>`aiui.register_theme(name, variables)`</h3>
<p>Register a custom theme preset. The theme becomes available in the theme picker UI and via <code>/api/theme</code>.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>name</code> | <code>str</code> | Unique theme name (e.g. <code>"ocean"</code>, <code>"sunset"</code>) |</p>
<p>| <code>variables</code> | <code>dict[str, str]</code> | Dict with at least <code>{"accent": "#hexcolor"}</code> |</p>
<p>See CSS Architecture for all available CSS variables.</p>
<p>---</p>
<h3>`aiui.set_custom_js(path)`</h3>
<p>Inject a local JavaScript file into the UI. Reads the file at <code>path</code> and</p>
<p>serves it at <code>/custom.js</code>. A <code>&lt;script src="/custom.js"&gt;</code> tag is injected</p>
<p>into the host HTML <strong>after</strong> the plugin loader, so <code>window.aiui</code> and all</p>
<p>registry APIs (<code>registerView</code>, <code>registerComponent</code>) are ready when your</p>
<p>code runs.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>path</code> | <code>str \| Path</code> | Local filesystem path to a <code>.js</code> file |</p>
<p>Raises <code>FileNotFoundError</code> if the path does not exist.</p>
<p>Where <code>plugin.js</code> uses the client-side extension APIs:</p>
<p>---</p>
<h3>`aiui.register_component_schema(component_type, schema)`</h3>
<p>Register a JSON Schema contract for a component dict. Built-in schemas</p>
<p>are auto-derived from every <code>aiui.ui.*</code> builder at startup; user schemas</p>
<p>take priority and are merged on top.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>component_type</code> | <code>str</code> | Component type string (e.g. <code>"timeline"</code>) |</p>
<p>| <code>schema</code> | <code>dict</code> | JSON Schema dict (Draft 2020-12 compatible) |</p>
<h3>`aiui.get_component_schemas()`</h3>
<p>Returns the merged registry as a <code>dict[str, dict]</code>. Also available as a</p>
<p>JSON endpoint: <code>GET /api/components/schemas</code>.</p>
<p>---</p>
<h3>`aiui.prompt(question, *, options=None, timeout=300.0)`</h3>
<p>Pause the agent and wait for the user to answer. Preferred entry point</p>
<p>for interactive agent flows — supersedes the legacy <code>AskUserMessage</code></p>
<p>class.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>question</code> | <code>str</code> | Text shown to the user. |</p>
<p>| <code>options</code>  | <code>list[str] \| None</code> | Optional list of choices. When given, the user picks one; otherwise they type free text. |</p>
<p>| <code>timeout</code>  | <code>float</code> | Seconds to wait before giving up. Default 300 (5 min). |</p>
<p>Returns a <code>PromptResult</code> dataclass (<code>text</code>, <code>choice</code>, <code>message_id</code>).</p>
<p>The result is truthy when the user answered, falsy on timeout.</p>
<p>The answer comes back over the chat WebSocket (<code>ask_response</code>), so a</p>
<p>question needs the WebSocket transport; the HTTP fallback (<code>POST /run</code>) can</p>
<p>show it but not answer it. Time spent waiting for the answer does not count</p>
<p>against the <code>@reply</code> inactivity timeout (<code>AIUI_REPLY_IDLE_TIMEOUT</code>).</p>
<p><code>aiui.ask</code> and <code>AskUserMessage</code> work the same way.</p>
<p>---</p>
<h3>`aiui.error(content, *, details=None)`</h3>
<p>Emit an error message to the chat. A thin helper around <code>Message</code> with</p>
<p><code>metadata={"kind": "error"}</code> — keeps the public surface small.</p>
<p>---</p>
<h3>`aiui.configure(*, datastore=None, branding=None, theme=None, chat=None, custom_css=None, custom_js=None, style=None)`</h3>
<p>One call for the common setters. Every keyword is optional; each one is</p>
<p>forwarded to the matching <code>set_*</code> function, which you can still call directly.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>datastore</code> | <code>str</code> | Storage backend: <code>"memory"</code>, <code>"json"</code>, <code>"json:/path"</code>, <code>"sdk"</code>, <code>"sdk:/path"</code>. |</p>
<p>| <code>branding</code>  | <code>dict</code> | Forwarded to <code>set_branding(...)</code>. Keys: <code>title</code>, <code>logo</code> (any other key raises <code>TypeError</code>). |</p>
<p>| <code>theme</code>     | <code>dict</code> | Forwarded to <code>set_theme(...)</code>. Keys: <code>preset</code>, <code>dark</code>/<code>dark_mode</code>, <code>radius</code>; <code>brand_color</code> goes to <code>set_brand_color()</code>. |</p>
<p>| <code>chat</code>      | <code>dict</code> | <code>feedback</code> goes to <code>set_feedback_enabled()</code>, <code>mode</code> to <code>set_chat_mode()</code>, other keys to <code>set_chat_features()</code>. |</p>
<p>| <code>custom_css</code>| <code>str</code> | CSS text, passed to <code>set_custom_css()</code> unchanged. It is not read from a file: pass <code>Path("styles.css").read_text()</code> to use one. |</p>
<p>| <code>custom_js</code> | <code>str \| Path</code> | Path to a JS file; same as <code>set_custom_js</code>. |</p>
<p>| <code>style</code>     | <code>str</code> | UI style — <code>"chat"</code>, <code>"dashboard"</code>, etc. |</p>
<p>---</p>
<h2>Callback Decorators</h2>
<h3>`@aiui.reply`</h3>
<p>Handle incoming chat messages. This is the core callback.</p>
<p>Annotate the parameter as <code>str</code> (<code>async def on_reply(message: str)</code>) to get</p>
<p>the text only. Otherwise the callback gets a <code>MessageContext</code> with:</p>
<li><code>message.text</code> (alias <code>message.content</code>): the user's text</li>
<li><code>message.session_id</code>: the session id</li>
<li><code>message.agent_name</code>: the selected agent, if any</li>
<li><code>message.attachments</code>: the files sent with the message,</li>
<p><code>[{id, name, content_type, path}]</code> (see Attachments)</p>
<p>How a reply ends:</p>
<li>If the callback raises, the run ends with one <code>run_error</code> frame carrying the</li>
<p>exception text. The chat shows the error under whatever was streamed, the</p>
<p>reply is saved with <code>status: "error"</code> (so it is still there after a</p>
<p>reload), the run ledger counts it as failed, and the traceback is logged.</p>
<li>Stop (<code>chat_abort</code>, <code>POST /api/chat/abort</code>, <code>POST /cancel</code>) cancels the</li>
<p>callback task: the callback gets <code>asyncio.CancelledError</code> at its next</p>
<p><code>await</code>, so an LLM call or tool it is waiting on stops too.</p>
<li>A callback that sends nothing (no token, message, step or tool event) for</li>
<p><code>AIUI_REPLY_IDLE_TIMEOUT</code> seconds (default 600) is cancelled and the run</p>
<p>fails with a timeout. Set <code>AIUI_REPLY_IDLE_TIMEOUT=0</code> for no limit.</p>
<p>---</p>
<h3>`@aiui.welcome`</h3>
<p>The greeting on a new, empty chat.</p>
<p>The chat runs it through <code>POST /welcome</code> once per page load and shows what</p>
<p>it says (<code>aiui.say</code>, or streamed tokens) as plain text on the empty thread:</p>
<p>in the app shell's chat and every layout, the <code>chat</code> style and the</p>
<p>dashboard's chat. In a layout's new-chat hero (the site's mark and name)</p>
<p>the greeting takes the place of the generic "Ask anything…" line, with the</p>
<p>starters below it. It is not saved to the conversation. A chat YAML's</p>
<p><code>welcome:</code> key registers one for you.</p>
<p>---</p>
<h3>`@aiui.goodbye` / `@aiui.on_chat_end`</h3>
<p>Runs when a chat's last browser connection closes, after any reply still</p>
<p>running there finishes, as that chat (<code>aiui.user_session</code> is readable): use it</p>
<p>for clean-up. Nobody is listening any more, so what it sends is dropped.</p>
<p>---</p>
<h3>Chat lifecycle</h3>
<p>Each moment of a chat has a handler. The names are aliases: <code>@aiui.on_message</code></p>
<p>and <code>@aiui.reply</code> register the same handler (the last one registered wins).</p>
<p>| Decorator | Runs | Same as |</p>
<p>|---|---|---|</p>
<p>| <code>@aiui.on_message</code> | For each message the user sends; gets the <code>MessageContext</code> (<code>message.content</code>). | <code>@aiui.reply</code> |</p>
<p>| <code>@aiui.on_chat_start</code> | Once per chat, right before its first reply (again after <code>on_chat_end</code> ran for it). | |</p>
<p>| <code>@aiui.on_stop</code> | When the user presses Stop, as the stopped chat. | <code>@aiui.cancel</code> |</p>
<p>| <code>@aiui.on_chat_end</code> | When the chat ends (above). | <code>@aiui.goodbye</code> |</p>
<p>| <code>@aiui.author_rename</code> | Maps an author (agent) name to the name the chat shows. | |</p>
<p>| <code>@aiui.welcome</code> | The greeting on an empty chat, once per page load (no chat yet). | |</p>
<p>Every handler may be <code>async def</code> or a plain <code>def</code>.</p>
<p><code>on_chat_start</code> runs in the reply's task (so <code>aiui.say</code> and <code>aiui.Message</code></p>
<p>work) and needs a reply handler; if it raises, that turn fails with the error</p>
<p>and the next turn runs it again. <code>author_rename</code> is called once per name per</p>
<p>reply (a failing handler keeps the name); the display name goes on every frame</p>
<p>of the reply (<code>agent_name</code>) and the saved reply, never on the agent the user</p>
<p>picked. <code>@aiui.resume</code> is not called yet (below).</p>
<p>---</p>
<h3>`@aiui.starters`</h3>
<p>Define conversation starters shown to new users.</p>
<p>---</p>
<h3>`@aiui.profiles`</h3>
<p>Define chat profiles (agent personas users can choose).</p>
<p>---</p>
<h3>`@aiui.page(id, *, title, icon="📄", group="Custom", description="", order=100)`</h3>
<p>Register a custom dashboard page. The callback's return value is the page</p>
<p>data (<code>GET /api/pages/&lt;id&gt;/data</code>); return UI components to render them. An app</p>
<p>with pages opens in the <code>dashboard</code> style.</p>
<p><code>aiui.register_page(id, *, title, ...)</code> registers a page without a decorator.</p>
<p>---</p>
<h3>`@aiui.on(event)`</h3>
<p>Register a handler for a named event. The server dispatches <code>feedback</code></p>
<p>(a thumbs up or down on a message) to it:</p>
<p>---</p>
<h3>`@aiui.login`, `@aiui.settings`, `@aiui.resume`</h3>
<p>These decorators register a handler, but the server does not call them yet,</p>
<p>so do not rely on them. Sign-in is configured with YAML <code>auth:</code> or</p>
<p><code>create_app(require_auth=...)</code>; see Deployment.</p>
<p>---</p>
<h3>`@aiui.surface_action(surface_id)`</h3>
<p>Handle user actions from an A2UI surface (button clicks, form submits).</p>
<p>---</p>
<h2>Message Functions</h2>
<p>Async functions for sending messages to the user. Call inside callback handlers.</p>
<p>| Function | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>await aiui.say(content)</code> | Send a complete message |</p>
<p>| <code>await aiui.stream_token(token)</code> | Append a token to the streaming reply |</p>
<p>| <code>await aiui.stream(token)</code> | Same as <code>stream_token</code> |</p>
<p>| <code>await aiui.think(step)</code> | Show a reasoning step |</p>
<p>| <code>await aiui.ask(question, options=None, timeout=300.0)</code> | Ask the user and wait; returns the answer text |</p>
<p>| <code>await aiui.image(url, alt="")</code> | Send an image |</p>
<p>| <code>await aiui.audio(url)</code> | Send audio |</p>
<p>| <code>await aiui.video(url)</code> | Send video |</p>
<p>| <code>await aiui.file(url, name="")</code> | Send a file |</p>
<p>| <code>await aiui.action_buttons(buttons)</code> | Show buttons; handle clicks with <code>@aiui.button(name)</code> |</p>
<p>| <code>await aiui.tool(name, args=None, result=None)</code> | Show a tool call and its result |</p>
<p>---</p>
<h2>UI Components</h2>
<p>Build custom page layouts with UI components.</p>
<p>| Component | Usage |</p>
<p>|-----------|-------|</p>
<p>| <code>aiui.layout(children)</code> | Root container for a page |</p>
<p>| <code>aiui.card(title, *, value=None, footer=None)</code> | Metric card |</p>
<p>| <code>aiui.columns(children)</code> | Horizontal column layout |</p>
<p>| <code>aiui.chart(title, *, data=None, chart_type="bar")</code> | Chart; <code>data</code> is a list of dicts |</p>
<p>| <code>aiui.table(*, headers, rows, row_ids=None, actions=None)</code> | Data table |</p>
<p>| <code>aiui.text(content)</code> | Text block |</p>
<p>See the Component API Reference for the other builders</p>
<p>(metrics, alerts, tabs, forms and more).</p>
<p>---</p>
<h2>Data Classes</h2>
<p>| Class | Purpose |</p>
<p>|-------|---------|</p>
<p>| <code>aiui.Message</code> | Outgoing message with elements and actions |</p>
<p>| <code>aiui.AskUserMessage</code> | Ask the user for text (older form of <code>aiui.prompt</code>) |</p>
<p>| <code>aiui.Step</code>, <code>@aiui.step</code> | A named step of the reply (tool, LLM call, sub-run), nested and timed: see Steps |</p>
<p>| <code>aiui.BaseDataStore</code> | Abstract datastore interface |</p>
<p>| <code>aiui.MemoryDataStore</code> | In-memory store |</p>
<p>| <code>aiui.JSONFileDataStore</code> | Persistent JSON file store |</p>
<p>| <code>aiui.SQLAlchemyDataStore</code> | SQL store (<code>pip install "aiui[sql]"</code>) |</p>
<p>| <code>aiui.BaseProvider</code> | Abstract AI provider interface |</p>
<p>| <code>aiui.PraisonAIProvider</code> | PraisonAI provider implementation |</p>
<p>| <code>aiui.RunEvent</code> | Streaming event |</p>
<p>| <code>aiui.RunEventType</code> | Event type enum |</p>
<p>---</p>
<h2>Feature Protocol</h2>
<p>Register custom features that appear in the dashboard.</p>
<p>| Function | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>aiui.register_feature(feature)</code> | Register a feature |</p>
<p>| <code>aiui.get_features()</code> | List all features |</p>
<p>| <code>aiui.get_feature(name)</code> | Get a specific feature |</p>
<p>| <code>aiui.auto_register_defaults()</code> | Auto-register built-in features |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/api/python.source.md", "text": "---\nnav_title: Python API\n---\n\n# Python SDK API\n\nReference for `import praisonaiui as aiui`.\n\n## Server Configuration\n\nThese functions configure the server. Call them at module level in your `app.py`, before the server starts.\n\n### `aiui.set_style(style)`\n\nSet the UI style.\n\n| Parameter | Type | Values |\n|-----------|------|--------|\n| `style` | `str` | `\"app\"` (the React app shell), `\"chat\"` (the classic chat), `\"dashboard\"`, `\"agents\"`, `\"playground\"`, `\"docs\"`, `\"custom\"` |\n\n```python\naiui.set_style(\"dashboard\")\n```\n\nPriority under `aiui run`: CLI `--style`, then `set_style()`, then\nauto-detection (a plain chat app gets `app`). See\n[UI Styles](../features/styles.md).\n\n---\n\n### `aiui.set_pages(page_ids)`\n\nWhitelist which built-in sidebar pages to show (dashboard mode). Custom pages registered via `@aiui.page()` always appear.\n\n```python\naiui.set_pages([\n    \"chat\", \"agents\", \"memory\", \"knowledge\",\n    \"skills\", \"sessions\", \"usage\", \"config\", \"logs\",\n])\n```\n\nUse `aiui pages ids` to see all available page IDs.\n\n---\n\n### `aiui.set_branding(title, logo)`\n\nConfigure the sidebar branding (title text and logo).\n\n| Parameter | Type | Default |\n|-----------|------|---------|\n| `title` | `str` | `\"PraisonAI\"` |\n| `logo` | `str` | `\"\"` (no logo: the PraisonAI brand glyph) |\n\n`logo` is an image URL or path (`/static/logo.svg`, `https://…`, `data:image/…`)\nor a short text mark. Left empty, every UI draws the PraisonAI glyph on the\naccent tile.\n\n```python\naiui.set_branding(title=\"MyApp\", logo=\"/static/logo.svg\")\n```\n\nAlso configurable via `config.yaml`:\n```yaml\nsite:\n  title: MyApp\n  logo: /static/logo.svg\n```\n\n---\n\n### `aiui.set_datastore(store)`\n\nSet the persistence backend for sessions and messages.\n\n```python\n# JSON files under ~/.praisonaiui (or AIUI_DATA_DIR)\naiui.set_datastore(aiui.JSONFileDataStore())\n\n# In-memory (no persistence)\naiui.set_datastore(aiui.MemoryDataStore())\n```\n\nWithout a call, the server uses the SDK store shared with PraisonAI Agents\n(`SDKFileDataStore`, from `praisonaiui.datastore_sdk`), falling back to\n`JSONFileDataStore`. `aiui run --datastore` sets the same thing from the\ncommand line.\n\n---\n\n### `aiui.set_provider(provider)`\n\nSet the AI provider for chat completions.\n\n```python\naiui.set_provider(aiui.PraisonAIProvider())\n```\n\n---\n\n### `aiui.register_agent(name, agent)`\n\nRegister an agent object (for example a PraisonAI Agents `Agent`) under a\nname. Together with an `@aiui.profiles` callback, registered agents make\n`aiui run` pick the `agents` style.\n\n```python\nfrom praisonaiagents import Agent\n\naiui.register_agent(\"researcher\", Agent(name=\"Researcher\", instructions=\"You research topics.\"))\n```\n\nAgents created in the dashboard's Agents page are a separate store\n(`/api/agents/definitions`).\n\n---\n\n### `aiui.remove_page(page_id)`\n\nRemove a page from the sidebar.\n\n```python\naiui.remove_page(\"debug\")\n```\n\n---\n\n### `aiui.set_chat_mode(mode, *, position, size, resizable, minimized)`\n\nConfigure chat window display mode — full page, floating window, or sidebar panel.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `mode` | `str` | `\"fullpage\"` | `\"fullpage\"`, `\"floating\"`, or `\"sidebar\"` |\n| `position` | `tuple[int, int]` | `(20, 20)` | (bottom, right) pixel offset for floating mode |\n| `size` | `tuple[int, int]` | `(400, 500)` | (width, height) initial size for floating mode |\n| `resizable` | `bool` | `True` | Allow resizing the floating window |\n| `minimized` | `bool` | `False` | Start minimized (floating mode only) |\n\n```python\nimport praisonaiui as aiui\n\n# Full page chat (default)\naiui.set_chat_mode(\"fullpage\")\n\n# Floating chat window\naiui.set_chat_mode(\"floating\", position=(20, 20), size=(420, 550))\n\n# Sidebar panel\naiui.set_chat_mode(\"sidebar\")\n```\n\n---\n\n### `aiui.set_sidebar_config(*, collapsible, default_collapsed, width, min_width, max_width)`\n\nConfigure sidebar behavior and dimensions.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `collapsible` | `bool` | `True` | Allow sidebar to be collapsed |\n| `default_collapsed` | `bool` | `False` | Start with sidebar collapsed |\n| `width` | `int` | `260` | Default sidebar width in pixels |\n| `min_width` | `int` | `200` | Minimum width when resizing |\n| `max_width` | `int` | `360` | Maximum width when resizing |\n\n```python\nimport praisonaiui as aiui\n\naiui.set_sidebar_config(collapsible=True, width=280)\naiui.set_sidebar_config(default_collapsed=True)  # Start collapsed\n```\n\n---\n\n### `aiui.set_brand_color(color)`\n\nSet the brand/primary accent color. Overrides the theme's default accent.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `color` | `str` | Hex color (e.g. `\"#6366f1\"`) or CSS color value |\n\n```python\nimport praisonaiui as aiui\n\naiui.set_brand_color(\"#818cf8\")  # Indigo-400\naiui.set_brand_color(\"#22c55e\")  # Green-500\n```\n\n---\n\n### `aiui.set_chat_features(*, history, streaming, file_upload, audio, reasoning, tools, multimedia, feedback)`\n\nConfigure which chat features are enabled in the UI.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `history` | `bool` | `True` | Show session history sidebar |\n| `streaming` | `bool` | `True` | Enable streaming responses |\n| `file_upload` | `bool` | `False` | Show file upload button |\n| `audio` | `bool` | `False` | Show audio input button |\n| `reasoning` | `bool` | `True` | Show reasoning/thinking steps |\n| `tools` | `bool` | `True` | Show tool call displays |\n| `multimedia` | `bool` | `True` | Enable multimedia rendering |\n| `feedback` | `bool` | `False` | Show feedback buttons |\n\n```python\nimport praisonaiui as aiui\n\n# Minimal chat — no history sidebar, no file upload\naiui.set_chat_features(history=False, file_upload=False)\n\n# Full-featured chat\naiui.set_chat_features(\n    history=True,\n    streaming=True,\n    file_upload=True,\n    audio=True,\n    feedback=True,\n)\n```\n\n---\n\n### `aiui.set_dashboard(*, sidebar, page_header, modules, plugin_dirs, plugins, groups)`\n\nConfigure dashboard layout options.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `sidebar` | `bool` | `True` | Show the left sidebar navigation |\n| `page_header` | `bool` | `True` | Show the page title/description header |\n| `modules` | `list[str] \\| None` | `None` | Optional dashboard JS modules (`jobs`, `auth`, `api`) |\n| `plugin_dirs` | `list[str] \\| None` | `None` | Extra directories to scan for dashboard plugins |\n| `plugins` | `list[str] \\| None` | `None` | Allowlist of dashboard plugin names. `None` = all discovered (bundled, `~/.praisonai/dashboard-plugins`, `plugin_dirs`); `[]` = none |\n| `groups` | `dict \\| None` | `None` | Sidebar group order and folding in the app shell (YAML `dashboard.groups`) |\n\n```python\nimport praisonaiui as aiui\n\naiui.set_style(\"dashboard\")\naiui.set_dashboard(sidebar=False)       # Chat-only dashboard, no sidebar\naiui.set_dashboard(page_header=False)   # Hide page titles\naiui.set_dashboard(plugins=[])          # No auto-discovered dashboard plugins\n```\n\n`plugins` filters both the sidebar pages (`/api/pages`) and the browser plugin\nmanifest (`/api/dashboard/plugins`), so disabled plugin scripts are never loaded.\nIt scopes navigation only — it is **not** an authorization boundary for API routes.\n\n---\n\n### `aiui.set_chat_preview(enabled, *, surface_id, width)`\n\nConfigure the **chat + canvas** split preview (`chat-canvas` page). The vanilla `chat` page is unchanged.\n\n| Parameter | Type | Default | Description |\n|-----------|------|---------|-------------|\n| `enabled` | `bool` | `True` | Expose preview settings in `/ui-config.json` |\n| `surface_id` | `str` | `\"main\"` | Default A2UI surface id for the preview panel |\n| `width` | `str` | `\"40%\"` | CSS width of the preview column (e.g. `\"38%\"`, `\"420px\"`) |\n\n```python\naiui.set_chat_preview(enabled=True, surface_id=\"main\", width=\"38%\")\naiui.set_pages([\"chat-canvas\", \"chat\", \"canvas\"])\n```\n\nSee [A2UI canvas](../features/a2ui-canvas.md).\n\n---\n\n### `aiui.set_theme(preset=\"zinc\", dark_mode=True, radius=\"md\")`\n\nSet the colour palette, colour mode and corner radius. Takes priority over\nYAML `site.theme`.\n\n| Parameter | Type | Values |\n|-----------|------|--------|\n| `preset` | `str` | `zinc`, `slate`, `stone`, `gray`, `neutral`, `red`, `orange`, `amber`, `yellow`, `lime`, `green`, `emerald`, `teal`, `cyan`, `sky`, `blue`, `indigo`, `violet`, `purple`, `fuchsia`, `pink`, `rose`, or a name from `register_theme()` |\n| `dark_mode` | `bool \\| None` | `True` dark, `False` light, `None` leaves it to YAML or the viewer and the OS |\n| `radius` | `str` | `none`, `sm`, `md`, `lg`, `xl` |\n\n```python\naiui.set_theme(preset=\"blue\", dark_mode=None, radius=\"lg\")\n```\n\nSee [Theming](../features/theming.md).\n\n---\n\n### `aiui.set_custom_css(css)`\n\nAdd a CSS string to the page as an inline `\u003cstyle\u003e` tag.\n\n```python\naiui.set_custom_css(\":root { --db-accent: #22c55e; }\")\n```\n\n---\n\n### `aiui.set_layout(default=None, *, available=None, user_choice=None, primary=None, options=None)`\n\nChoose the React app shell's layout (`style: app`). See\n[Layouts](../features/layouts.md).\n\n---\n\n### `aiui.register_theme(name, variables)`\n\nRegister a custom theme preset. The theme becomes available in the theme picker UI and via `/api/theme`.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `name` | `str` | Unique theme name (e.g. `\"ocean\"`, `\"sunset\"`) |\n| `variables` | `dict[str, str]` | Dict with at least `{\"accent\": \"#hexcolor\"}` |\n\n```python\nimport praisonaiui as aiui\n\n# Register a custom theme\naiui.register_theme(\"ocean\", {\"accent\": \"#0077b6\"})\n\n# With explicit RGB (auto-derived if omitted)\naiui.register_theme(\"sunset\", {\n    \"accent\": \"#ff6b35\",\n    \"accentRgb\": \"255,107,53\",\n})\n\n# Apply the custom theme\naiui.set_theme(preset=\"ocean\")\n```\n\nSee [CSS Architecture](../features/css-architecture.md) for all available CSS variables.\n\n---\n\n### `aiui.set_custom_js(path)`\n\nInject a local JavaScript file into the UI. Reads the file at `path` and\nserves it at `/custom.js`. A `\u003cscript src=\"/custom.js\"\u003e` tag is injected\ninto the host HTML **after** the plugin loader, so `window.aiui` and all\nregistry APIs (`registerView`, `registerComponent`) are ready when your\ncode runs.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `path` | `str \\| Path` | Local filesystem path to a `.js` file |\n\nRaises `FileNotFoundError` if the path does not exist.\n\n```python\nimport praisonaiui as aiui\n\naiui.set_custom_js(\"plugin.js\")\n```\n\nWhere `plugin.js` uses the client-side extension APIs:\n\n```javascript\n// plugin.js\nwindow.aiui.registerComponent('timeline', function(comp) {\n    const el = document.createElement('div');\n    (comp.events || []).forEach(ev =\u003e {\n        const row = document.createElement('div');\n        row.textContent = `${ev.time} — ${ev.label}`;\n        el.appendChild(row);\n    });\n    return el;\n});\n```\n\n---\n\n### `aiui.register_component_schema(component_type, schema)`\n\nRegister a JSON Schema contract for a component dict. Built-in schemas\nare auto-derived from every `aiui.ui.*` builder at startup; user schemas\ntake priority and are merged on top.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `component_type` | `str` | Component type string (e.g. `\"timeline\"`) |\n| `schema` | `dict` | JSON Schema dict (Draft 2020-12 compatible) |\n\n```python\nimport praisonaiui as aiui\n\naiui.register_component_schema(\"timeline\", {\n    \"type\": \"object\",\n    \"required\": [\"type\", \"events\"],\n    \"properties\": {\n        \"type\": {\"const\": \"timeline\"},\n        \"events\": {\"type\": \"array\"},\n    },\n})\n```\n\n### `aiui.get_component_schemas()`\n\nReturns the merged registry as a `dict[str, dict]`. Also available as a\nJSON endpoint: `GET /api/components/schemas`.\n\n```python\nschemas = aiui.get_component_schemas()\nprint(sorted(schemas))   # ['accordion', 'alert', ..., 'timeline', ...]\n```\n\n---\n\n### `aiui.prompt(question, *, options=None, timeout=300.0)`\n\nPause the agent and wait for the user to answer. Preferred entry point\nfor interactive agent flows — supersedes the legacy `AskUserMessage`\nclass.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `question` | `str` | Text shown to the user. |\n| `options`  | `list[str] \\| None` | Optional list of choices. When given, the user picks one; otherwise they type free text. |\n| `timeout`  | `float` | Seconds to wait before giving up. Default 300 (5 min). |\n\nReturns a `PromptResult` dataclass (`text`, `choice`, `message_id`).\nThe result is truthy when the user answered, falsy on timeout.\n\nThe answer comes back over the chat WebSocket (`ask_response`), so a\nquestion needs the WebSocket transport; the HTTP fallback (`POST /run`) can\nshow it but not answer it. Time spent waiting for the answer does not count\nagainst the `@reply` inactivity timeout (`AIUI_REPLY_IDLE_TIMEOUT`).\n`aiui.ask` and `AskUserMessage` work the same way.\n\n```python\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(msg: str):\n    name = await aiui.prompt(\"What's your name?\")\n    if name:\n        await aiui.say(f\"Hi {name.text}!\")\n\n    pick = await aiui.prompt(\"Pick a colour\", options=[\"red\", \"blue\"])\n    if pick:\n        await aiui.say(f\"You picked {pick.choice}\")\n```\n\n---\n\n### `aiui.error(content, *, details=None)`\n\nEmit an error message to the chat. A thin helper around `Message` with\n`metadata={\"kind\": \"error\"}` — keeps the public surface small.\n\n```python\ntry:\n    data = await fetch()\nexcept Exception as exc:\n    await aiui.error(\"Couldn't load data\", details=str(exc))\n```\n\n---\n\n### `aiui.configure(*, datastore=None, branding=None, theme=None, chat=None, custom_css=None, custom_js=None, style=None)`\n\nOne call for the common setters. Every keyword is optional; each one is\nforwarded to the matching `set_*` function, which you can still call directly.\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `datastore` | `str` | Storage backend: `\"memory\"`, `\"json\"`, `\"json:/path\"`, `\"sdk\"`, `\"sdk:/path\"`. |\n| `branding`  | `dict` | Forwarded to `set_branding(...)`. Keys: `title`, `logo` (any other key raises `TypeError`). |\n| `theme`     | `dict` | Forwarded to `set_theme(...)`. Keys: `preset`, `dark`/`dark_mode`, `radius`; `brand_color` goes to `set_brand_color()`. |\n| `chat`      | `dict` | `feedback` goes to `set_feedback_enabled()`, `mode` to `set_chat_mode()`, other keys to `set_chat_features()`. |\n| `custom_css`| `str` | CSS text, passed to `set_custom_css()` unchanged. It is not read from a file: pass `Path(\"styles.css\").read_text()` to use one. |\n| `custom_js` | `str \\| Path` | Path to a JS file; same as `set_custom_js`. |\n| `style`     | `str` | UI style — `\"chat\"`, `\"dashboard\"`, etc. |\n\n```python\nimport praisonaiui as aiui\n\nfrom pathlib import Path\n\naiui.configure(\n    branding={\"title\": \"My App\", \"logo\": \"🎨\"},\n    theme={\"preset\": \"blue\", \"dark\": True, \"radius\": \"md\"},\n    chat={\"feedback\": True, \"mode\": \"floating\"},\n    datastore=\"json\",\n    custom_css=Path(\"styles.css\").read_text(),\n    custom_js=\"plugin.js\",\n)\n```\n\n```python\nimport praisonaiui as aiui\n\n# In-memory (volatile)\naiui.configure(datastore=\"memory\")\n\n# JSON files at ~/.praisonaiui/sessions/\naiui.configure(datastore=\"json\")\n\n# JSON files at custom path\naiui.configure(datastore=\"json:/tmp/my-sessions\")\n\n# SDK-backed store shared with PraisonAI Agents (the default)\naiui.configure(datastore=\"sdk\")\n```\n\n---\n\n## Callback Decorators\n\n### `@aiui.reply`\n\nHandle incoming chat messages. This is the core callback.\n\n```python\n@aiui.reply\nasync def on_reply(message):\n    await aiui.think(\"Thinking...\")\n    await aiui.say(f\"You said: {message.text}\")\n```\n\nAnnotate the parameter as `str` (`async def on_reply(message: str)`) to get\nthe text only. Otherwise the callback gets a `MessageContext` with:\n\n- `message.text` (alias `message.content`): the user's text\n- `message.session_id`: the session id\n- `message.agent_name`: the selected agent, if any\n- `message.attachments`: the files sent with the message,\n  `[{id, name, content_type, path}]` (see [Attachments](../features/attachments.md))\n\nHow a reply ends:\n\n- If the callback raises, the run ends with one `run_error` frame carrying the\n  exception text. The chat shows the error under whatever was streamed, the\n  reply is saved with `status: \"error\"` (so it is still there after a\n  reload), the run ledger counts it as failed, and the traceback is logged.\n- Stop (`chat_abort`, `POST /api/chat/abort`, `POST /cancel`) cancels the\n  callback task: the callback gets `asyncio.CancelledError` at its next\n  `await`, so an LLM call or tool it is waiting on stops too.\n- A callback that sends nothing (no token, message, step or tool event) for\n  `AIUI_REPLY_IDLE_TIMEOUT` seconds (default 600) is cancelled and the run\n  fails with a timeout. Set `AIUI_REPLY_IDLE_TIMEOUT=0` for no limit.\n\n---\n\n### `@aiui.welcome`\n\nThe greeting on a new, empty chat.\n\n```python\n@aiui.welcome\nasync def on_welcome():\n    await aiui.say(\"Welcome! How can I help you today?\")\n```\n\nThe chat runs it through `POST /welcome` once per page load and shows what\nit says (`aiui.say`, or streamed tokens) as plain text on the empty thread:\nin the app shell's chat and every layout, the `chat` style and the\ndashboard's chat. In a layout's new-chat hero (the site's mark and name)\nthe greeting takes the place of the generic \"Ask anything…\" line, with the\nstarters below it. It is not saved to the conversation. A chat YAML's\n`welcome:` key registers one for you.\n\n---\n\n### `@aiui.goodbye` / `@aiui.on_chat_end`\n\nRuns when a chat's last browser connection closes, after any reply still\nrunning there finishes, as that chat (`aiui.user_session` is readable): use it\nfor clean-up. Nobody is listening any more, so what it sends is dropped.\n\n```python\n@aiui.on_chat_end\nasync def end():\n    await close_connection(aiui.user_session.get(\"db\"))\n```\n\n---\n\n### Chat lifecycle\n\nEach moment of a chat has a handler. The names are aliases: `@aiui.on_message`\nand `@aiui.reply` register the same handler (the last one registered wins).\n\n| Decorator | Runs | Same as |\n|---|---|---|\n| `@aiui.on_message` | For each message the user sends; gets the `MessageContext` (`message.content`). | `@aiui.reply` |\n| `@aiui.on_chat_start` | Once per chat, right before its first reply (again after `on_chat_end` ran for it). | |\n| `@aiui.on_stop` | When the user presses Stop, as the stopped chat. | `@aiui.cancel` |\n| `@aiui.on_chat_end` | When the chat ends (above). | `@aiui.goodbye` |\n| `@aiui.author_rename` | Maps an author (agent) name to the name the chat shows. | |\n| `@aiui.welcome` | The greeting on an empty chat, once per page load (no chat yet). | |\n\nEvery handler may be `async def` or a plain `def`.\n\n```python\n@aiui.on_chat_start\nasync def start():\n    aiui.user_session[\"agent\"] = build_agent()   # per-chat setup\n    await aiui.say(\"Ready when you are.\")         # opens the first reply\n\n@aiui.on_message\nasync def main(message):\n    await aiui.say(await aiui.user_session[\"agent\"].run(message.content))\n\n@aiui.author_rename\ndef rename(name: str) -\u003e str:\n    return {\"researcher\": \"Research assistant\"}.get(name, name)\n```\n\n`on_chat_start` runs in the reply's task (so `aiui.say` and `aiui.Message`\nwork) and needs a reply handler; if it raises, that turn fails with the error\nand the next turn runs it again. `author_rename` is called once per name per\nreply (a failing handler keeps the name); the display name goes on every frame\nof the reply (`agent_name`) and the saved reply, never on the agent the user\npicked. `@aiui.resume` is not called yet (below).\n\n---\n\n### `@aiui.starters`\n\nDefine conversation starters shown to new users.\n\n```python\n@aiui.starters\nasync def on_starters():\n    return [\n        {\"label\": \"What can you do?\", \"message\": \"Tell me about your capabilities\"},\n        {\"label\": \"Help me write\", \"message\": \"Help me draft an email\"},\n    ]\n```\n\n---\n\n### `@aiui.profiles`\n\nDefine chat profiles (agent personas users can choose).\n\n```python\n@aiui.profiles\nasync def on_profiles():\n    return [\n        {\"name\": \"Expert\", \"description\": \"Expert mode\", \"icon\": \"🎓\"},\n        {\"name\": \"Creative\", \"description\": \"Creative writer\", \"icon\": \"✍️\"},\n    ]\n```\n\n---\n\n### `@aiui.page(id, *, title, icon=\"📄\", group=\"Custom\", description=\"\", order=100)`\n\nRegister a custom dashboard page. The callback's return value is the page\ndata (`GET /api/pages/\u003cid\u003e/data`); return UI components to render them. An app\nwith pages opens in the `dashboard` style.\n\n```python\n@aiui.page(\"analytics\", title=\"Analytics\", icon=\"📊\", group=\"Control\", order=60)\nasync def analytics_page():\n    return aiui.layout([\n        aiui.card(\"Revenue\", value=\"$12,345\"),\n        aiui.chart(\"Signups\", data=[{\"name\": \"Mon\", \"value\": 4}, {\"name\": \"Tue\", \"value\": 7}], chart_type=\"line\"),\n    ])\n```\n\n`aiui.register_page(id, *, title, ...)` registers a page without a decorator.\n\n---\n\n### `@aiui.on(event)`\n\nRegister a handler for a named event. The server dispatches `feedback`\n(a thumbs up or down on a message) to it:\n\n```python\n@aiui.on(\"feedback\")\nasync def on_feedback(event):\n    print(event[\"session_id\"], event[\"message_id\"], event[\"value\"], event[\"comment\"])\n```\n\n---\n\n### `@aiui.login`, `@aiui.settings`, `@aiui.resume`\n\nThese decorators register a handler, but the server does not call them yet,\nso do not rely on them. Sign-in is configured with YAML `auth:` or\n`create_app(require_auth=...)`; see [Deployment](../features/deployment.md).\n\n---\n\n### `@aiui.surface_action(surface_id)`\n\nHandle user actions from an A2UI surface (button clicks, form submits).\n\n```python\n@aiui.surface_action(\"main\")\nasync def on_surface_action(action: dict):\n    # action includes component_id, action name, data, session_id\n    return {\"status\": \"ok\"}\n```\n\n---\n\n## Message Functions\n\nAsync functions for sending messages to the user. Call inside callback handlers.\n\n| Function | Purpose |\n|----------|---------|\n| `await aiui.say(content)` | Send a complete message |\n| `await aiui.stream_token(token)` | Append a token to the streaming reply |\n| `await aiui.stream(token)` | Same as `stream_token` |\n| `await aiui.think(step)` | Show a reasoning step |\n| `await aiui.ask(question, options=None, timeout=300.0)` | Ask the user and wait; returns the answer text |\n| `await aiui.image(url, alt=\"\")` | Send an image |\n| `await aiui.audio(url)` | Send audio |\n| `await aiui.video(url)` | Send video |\n| `await aiui.file(url, name=\"\")` | Send a file |\n| `await aiui.action_buttons(buttons)` | Show buttons; handle clicks with `@aiui.button(name)` |\n| `await aiui.tool(name, args=None, result=None)` | Show a tool call and its result |\n\n---\n\n## UI Components\n\nBuild custom page layouts with UI components.\n\n```python\n@aiui.page(\"my-dashboard\", title=\"My Dashboard\", icon=\"📊\")\nasync def my_dashboard():\n    return aiui.layout([\n        aiui.columns([\n            aiui.card(\"Metric A\", value=\"42\"),\n            aiui.card(\"Metric B\", value=\"98%\", footer=\"+5% this week\"),\n        ]),\n        aiui.table(headers=[\"Name\", \"Value\"], rows=[[\"Alpha\", 100], [\"Beta\", 200]]),\n        aiui.chart(\"Trend\", data=[{\"name\": \"Q1\", \"value\": 10}, {\"name\": \"Q2\", \"value\": 30}], chart_type=\"line\"),\n    ])\n```\n\n| Component | Usage |\n|-----------|-------|\n| `aiui.layout(children)` | Root container for a page |\n| `aiui.card(title, *, value=None, footer=None)` | Metric card |\n| `aiui.columns(children)` | Horizontal column layout |\n| `aiui.chart(title, *, data=None, chart_type=\"bar\")` | Chart; `data` is a list of dicts |\n| `aiui.table(*, headers, rows, row_ids=None, actions=None)` | Data table |\n| `aiui.text(content)` | Text block |\n\nSee the [Component API Reference](components.md) for the other builders\n(metrics, alerts, tabs, forms and more).\n\n---\n\n## Data Classes\n\n| Class | Purpose |\n|-------|---------|\n| `aiui.Message` | Outgoing message with elements and actions |\n| `aiui.AskUserMessage` | Ask the user for text (older form of `aiui.prompt`) |\n| `aiui.Step`, `@aiui.step` | A named step of the reply (tool, LLM call, sub-run), nested and timed: see [Steps](../features/steps.md) |\n| `aiui.BaseDataStore` | Abstract datastore interface |\n| `aiui.MemoryDataStore` | In-memory store |\n| `aiui.JSONFileDataStore` | Persistent JSON file store |\n| `aiui.SQLAlchemyDataStore` | SQL store (`pip install \"aiui[sql]\"`) |\n| `aiui.BaseProvider` | Abstract AI provider interface |\n| `aiui.PraisonAIProvider` | PraisonAI provider implementation |\n| `aiui.RunEvent` | Streaming event |\n| `aiui.RunEventType` | Event type enum |\n\n---\n\n## Feature Protocol\n\nRegister custom features that appear in the dashboard.\n\n```python\nfrom praisonaiui import BaseFeatureProtocol, register_feature\n\nclass MyFeature(BaseFeatureProtocol):\n    name = \"my_feature\"\n    # ... implement protocol methods\n\nregister_feature(MyFeature())\n```\n\n| Function | Purpose |\n|----------|---------|\n| `aiui.register_feature(feature)` | Register a feature |\n| `aiui.get_features()` | List all features |\n| `aiui.get_feature(name)` | Get a specific feature |\n| `aiui.auto_register_defaults()` | Auto-register built-in features |\n"}</script>
