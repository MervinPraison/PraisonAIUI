<p>Python functions for building app and dashboard UIs. Each function returns a plain dict that the frontend renders as a real UI block — <strong>81 builders</strong> organized by category (usable on <code>@aiui.page</code>, in zero-code YAML, and inline inside chat via <code>await aiui.send_block(...)</code>). Looking for visual examples in both Python and zero-code YAML? Browse the UI Components gallery.</p>
<p>---</p>
<h2>Core Components</h2>
<h3>`aiui.layout(children)`</h3>
<p>Wrap components in a renderable container.</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>children</code> | <code>Sequence[dict]</code> | ✅ | List of component dicts |</p>
<p>| <code>refresh_every</code> | <code>float</code> | ❌ | App shell: re-fetch the page every N seconds while visible (<code>_refresh_every</code>) |</p>

<p><strong>Returns:</strong> <code>dict</code> with <code>_components</code> key — triggers structured rendering in the frontend.</p>

<h3>`aiui.table(*, headers, rows, columns=None, ...)`</h3>
<p>A data table. In the app shell it sorts by header click, formats typed</p>
<p>columns, and can search, page, link rows and open a row in a side panel. The</p>
<p>old call shape keeps working unchanged.</p>
<p>A larger table with typed columns, dict rows and search:</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>headers</code> | <code>Sequence[str]</code> | ✅ unless <code>columns</code> | Column header labels |</p>
<p>| <code>rows</code> | <code>Sequence[Sequence \| dict]</code> | ✅ | Row arrays in column order, or dicts keyed by column <code>key</code> (sent as arrays) |</p>
<p>| <code>columns</code> | <code>Sequence[str \| dict]</code> | — | Column config (below). Gives the headers when <code>headers</code> is not set |</p>
<p>| <code>row_ids</code> | <code>Sequence[str]</code> | — | Stable unique ID per row. Makes rows selectable by click, Enter or Space |</p>
<p>| <code>actions</code> | <code>Sequence[str]</code> | — | Row action button labels (requires <code>row_ids</code>) |</p>
<p>| <code>searchable</code> | <code>bool</code> | — | A search box that keeps the rows holding every typed word (in the browser) |</p>
<p>| <code>page_size</code> | <code>int</code> | — | Rows per page; <code>0</code> shows every row. Unset: 50 per page once there are more than 100 rows |</p>
<p>| <code>sortable</code> | <code>bool</code> | — | <code>False</code> turns header sorting off. Default on |</p>
<p>| <code>row_href_key</code> | <code>str</code> | — | Key (in dict rows, or a column key) holding each row's link. The first cell becomes the link and a click on the row opens it |</p>
<p>| <code>row_detail</code> | <code>bool</code> | — | A click (or Enter) on a row opens a side panel listing the row's fields |</p>
<p>| <code>detail_key</code> | <code>str</code> | — | Key in dict rows holding a list of block dicts the side panel renders instead of the fields (implies <code>row_detail</code>) |</p>
<p>| <code>detail_load_key</code> | <code>str</code> | — | Key in dict rows holding a lazy section key loaded via <code>POST /api/pages/{id}/action</code> (<code>{"_lazy": key, "_params": ...}</code>) when that row's side panel opens (implies <code>row_detail</code>) |</p>
<p>| <code>detail_load</code> | <code>str</code> | — | Prefix for lazy row detail keys (<code>f"{detail_load}{row_id_or_index}"</code>; implies <code>row_detail</code>) |</p>
<p>| <code>max_height</code> | <code>int \| str</code> | — | Height of the scrolling body (px or CSS length, <code>0</code> for none). Default <code>70vh</code>, so the header stays in view |</p>
<p>| <code>caption</code> | <code>str</code> | — | Accessible name of the table and its search box |</p>
<p>Column dict keys: <code>key</code>, <code>label</code>, <code>type</code>, <code>format</code>, <code>decimals</code>, <code>tones</code>,</p>
<p><code>tone_above</code>, <code>tone_below</code>, <code>thresholds</code>, <code>href_key</code>, <code>width</code> (px or CSS length),</p>
<p><code>align</code> (<code>left</code>, <code>center</code>, <code>right</code>) and <code>sortable</code> (<code>False</code> for one column). A</p>
<p>plain string is a column whose key and label are that string.</p>
<p>| <code>type</code> | Cell value | Shows |</p>
<p>|--------|-----------|-------|</p>
<p>| <code>auto</code> (default) | anything | Text as sent; a column of numbers lines up at the end; <code>{"text", "href"}</code> is a link and <code>{"src", "alt"}</code> an image |</p>
<p>| <code>text</code> | any | The value as text |</p>
<p>| <code>number</code> | number (or <code>{"value", "tone"}</code>) | Right-aligned, tabular figures. <code>format</code>: <code>compact</code> (1.2k, 3.4M), <code>percent</code> (a fraction: 0.123 → 12.3%), <code>multiplier</code> or <code>x</code> (2.3x), <code>fixed</code> (exactly <code>decimals</code>, default 2); none groups digits. <code>decimals</code> sets the fraction digits. Optional threshold colouring: <code>tone_above</code> (number or <code>[n, tone]</code>, default <code>success</code>), <code>tone_below</code> (number or <code>[n, tone]</code>, default <code>error</code>), or ordered <code>thresholds: [{"gte": 1, "tone": "success"}, {"lt": 0.5, "tone": "error"}]</code> |</p>
<p>| <code>link</code> | <code>{"text", "href", "external"}</code> or a URL; or text with the column's <code>href_key</code> | A link. Only http(s), mailto, tel and relative URLs are kept |</p>
<p>| <code>badge</code> | text, or <code>{"text", "tone"}</code> | A badge; <code>tones</code> maps a value to <code>success</code>, <code>warning</code>, <code>error</code> or <code>info</code> |</p>
<p>| <code>tag</code> | a list (or comma-separated text) | One badge per item, toned like <code>badge</code> |</p>
<p>| <code>image</code> | URL, or <code>{"src", "alt"}</code> | A small rounded thumbnail (<code>format: "wide"</code> for 16:9); <code>alt</code> defaults to the column label |</p>
<p>| <code>progress</code> | 0..1 | A bar and its percent |</p>
<p>| <code>date</code> | ISO text, or epoch seconds or ms | <code>Nov 22, 2026</code> in UTC; <code>format: "datetime"</code> adds the time, <code>"iso"</code> gives <code>2026-11-22</code>. Sorts by time |</p>
<p>| <code>sparkline</code> | a list of numbers | A small trend line (no axes); sorts by the last point |</p>
<p>A header click sorts ascending, descending, then back to the server's order:</p>
<p>stable, numeric-aware (<code>1,234</code>, <code>1.2k</code>, <code>12%</code>, <code>2.5x</code>), empty cells last;</p>
<p>headers are buttons with <code>aria-sort</code>. On a phone the table scrolls sideways.</p>
<p>The legacy <code>dashboard</code> style draws the dict as a plain text table.</p>
<p>With <code>row_ids</code>, the dashboard renderer emits bubbling DOM events from the table, so</p>
<p>a custom view can own query state (search, filters, page, sort) and react to rows:</p>
<p>| Event | <code>detail</code> |</p>
<p>|-------|----------|</p>
<p>| <code>aiui:table-select</code> | <code>{rowId, index}</code> |</p>
<p>| <code>aiui:table-action</code> | <code>{action, rowId}</code> |</p>
<p>Because events carry the stable <code>rowId</code>, selection stays correct after the server</p>
<p>re-sorts or filters rows. Loading, empty and error states compose from existing</p>
<p>components (<code>aiui.skeleton()</code>, <code>aiui.empty()</code>, <code>aiui.alert()</code>):</p>
<h3>`aiui.text(content)`</h3>
<p>A text block.</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>content</code> | <code>str</code> | ✅ | Text content |</p>
<h3>`aiui.chart(title, *, data, chart_type, x, y, ...)`</h3>
<p>A chart with tooltips, colours from the theme's <code>--chart-1..5</code> tokens (light</p>
<p>and dark) and the full width of its column, down to a phone. The chart</p>
<p>library loads in its own chunk the first time a page shows a chart.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>title</code> | <code>str</code> | <code>""</code> | Chart title |</p>
<p>| <code>data</code> | <code>list[dict]</code> | <code>[]</code> | Rows, e.g. <code>[{"month": "Jan", "views": 1200}]</code>. A histogram also takes plain numbers |</p>
<p>| <code>chart_type</code> | <code>str</code> | <code>"bar"</code> | <code>bar</code> (columns), <code>barh</code> (horizontal bars), <code>line</code>, <code>area</code>, <code>scatter</code>, <code>pie</code>, <code>donut</code>, <code>histogram</code>, <code>heatmap</code>, <code>sparkline</code> |</p>
<p>| <code>kind</code> | <code>str</code> | — | Alias of <code>chart_type</code> |</p>
<p>| <code>x</code> | <code>str</code> | first text column | Category key. Scatter: the x value (default: first numeric column). Histogram: the measured value |</p>
<p>| <code>y</code> | <code>str \| list[str]</code> | every numeric column | Series key, or keys for several series |</p>
<p>| <code>y2</code> | <code>str</code> | — | A secondary series drawn as faint bars on its own scale (<code>bar</code>, <code>barh</code>, <code>line</code>, <code>area</code>) |</p>
<p>| <code>labels</code> | <code>dict[str, str]</code> | — | Display names for keys in the legend and tooltip |</p>
<p>| <code>label</code> | <code>str</code> | — | Scatter: key naming each point in the tooltip |</p>
<p>| <code>tooltip</code> | <code>list[str \| dict]</code> | — | Extra row keys (or <code>{"key", "label", "format"}</code> dicts) shown in the tooltip (including scatter &amp; heatmap) |</p>
<p>| <code>stacked</code> | <code>bool</code> | <code>False</code> | Stack the series (<code>bar</code>, <code>barh</code>, <code>area</code>) |</p>
<p>| <code>reference</code> | number, list of numbers, <code>{value, label}</code> or a list of them | — | Dashed reference lines (a vertical line on <code>barh</code>) |</p>
<p>| <code>color_by_reference</code> | <code>bool</code> | <code>False</code> | Bars at or above the first reference keep the series colour; bars below it are muted |</p>
<p>| <code>x_format</code>, <code>y_format</code> | <code>str</code> | — | <code>number</code> (1,234.5), <code>compact</code> (1.2k, 3.4M), <code>percent</code> (0.25 → 25%), <code>multiplier</code> (1.5x), <code>duration</code> (seconds → 1:05). Axis ticks default to <code>compact</code>, tooltips to <code>number</code> |</p>
<p>| <code>x_domain</code>, <code>y_domain</code> | <code>[min, max]</code> | auto | X / value axis range, e.g. <code>x_domain=[1e3, 1e7]</code> on scatter or <code>y_domain=[0, 1]</code> with <code>y_format="percent"</code> |</p>
<p>| <code>x_scale</code>, <code>y_scale</code> | <code>str</code> | <code>"linear"</code> | <code>"linear"</code> or <code>"log"</code> (non-positive values are omitted safely) |</p>
<p>| <code>clip</code> | <code>bool \| number \| [min, max]</code> | — | Clamp outliers to <code>x_domain</code>/<code>y_domain</code> (<code>True</code>), an upper cap (number), or <code>[min, max]</code> (histogram edge bins show <code>≤</code>/<code>+</code>; heatmap colour scale clamps to bounds) |</p>
<p>| <code>bins</code> | <code>int</code> | Sturges' rule (max 30) | Histogram bin count |</p>
<p>| <code>height</code> | <code>int</code> | 240 | Plot height in px; <code>barh</code> grows with its rows, pie and donut are 260 |</p>
<p>| <code>caption</code> | <code>str</code> | — | A line of muted text under the chart |</p>
<p>| <code>legend</code> | <code>bool</code> | more than one series | Show the legend |</p>
<p>| <code>value</code> | <code>str</code> | <code>"value"</code> | Heatmap: the cell value key. <code>x</code> is the column key and <code>y</code> the row key (defaults <code>x</code> and <code>y</code>) |</p>
<p>| <code>facet</code> | <code>str</code> | — | Key whose values split the rows into small charts in a responsive grid (at most 24 panels) |</p>
<p>| <code>facet_scales</code> | <code>str</code> | <code>"shared"</code> | <code>"shared"</code> (one value scale across all panels) or <code>"free"</code> (each panel scales to its own data) |</p>
<p><strong>Heatmap.</strong> Columns and rows keep the order they first appear in <code>data</code>,</p>
<p>so sort the rows (Mon..Sun, 0..23) before passing them; a repeated cell</p>
<p>sums. Cells are coloured on a sequential scale from the theme's first chart</p>
<p>colour (light and dark), empty cells are outlined, <code>y_format</code> formats the</p>
<p>values in the tooltip and the colour scale under the grid, and <code>y_domain</code></p>
<p>fixes the scale. Cells keep a minimum width, so a wide grid scrolls sideways</p>
<p>inside the chart on a phone.</p>
<p><strong>Sparkline.</strong> One series, no axes, the last value printed beside it;</p>
<p><code>height</code> defaults to 48 px. A number list under a metric is</p>
<p><code>aiui.metric(..., sparkline=[...])</code>.</p>
<p><strong>Small multiples.</strong> With <code>facet</code>, each panel is 160 px high (48 for a</p>
<p>sparkline) unless <code>height</code> is set, panels follow first-seen order, and the</p>
<p>legend is shown once. <code>y_domain</code> overrides the shared scale.</p>
<p>An unknown <code>chart_type</code> or format raises <code>ValueError</code>. A dict written by hand</p>
<p>(<code>{"type": "chart", "data": [...], "chart_type": "line"}</code>) works too: missing</p>
<p>keys are inferred from the first row, and <code>column</code>, <code>hbar</code> and <code>doughnut</code> are</p>
<p>accepted as kind names. At most 5,000 rows are drawn. The legacy <code>dashboard</code></p>
<p>style shows a summary card instead of the chart.</p>
<p>---</p>
<h2>Essential Components</h2>
<h3>`aiui.metric(label, *, value, delta, delta_color, caption, sparkline, benchmark, benchmark_label)`</h3>
<p>A metric card with optional delta indicator and caption.</p>
<p><code>benchmark</code> compares a numeric <code>value</code> with a reference: a ratio of 2 or</p>
<p>more reads as a multiple ("17x below median"), a smaller one as a percentage</p>
<p>("25% above median"), and it is coloured like a delta (<code>delta_color</code></p>
<p>applies, so <code>"inverse"</code> makes "above" the loss). <code>sparkline</code> draws the</p>
<p>numbers as a tiny trend line under the value.</p>
<p>A <code>delta</code> that starts with <code>+</code>/<code>↑</code> or <code>-</code>/<code>↓</code> (or a signed number) is coloured</p>
<p>as a gain or a loss. Use <code>caption</code> for a neutral note under the value, so a</p>
<p>subtitle such as "-2 from plan" is not coloured by accident.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>label</code> | <code>str</code> | ✅ | — | Metric label |</p>
<p>| <code>value</code> | <code>Any</code> | ✅ | — | Main metric value |</p>
<p>| <code>delta</code> | <code>str</code> | ❌ | <code>None</code> | Change indicator (e.g. "+5%") |</p>
<p>| <code>delta_color</code> | <code>str</code> | ❌ | <code>"normal"</code> | <code>"normal"</code> (rise is good), <code>"inverse"</code> (fall is good, e.g. <code>"-3 days"</code>), or <code>"off"</code> (never coloured) |</p>
<p>| <code>caption</code> | <code>str</code> | ❌ | <code>None</code> | Neutral note under the value, never coloured. <code>help</code> is an alias |</p>
<p>| <code>sparkline</code> | <code>list[float]</code> | ❌ | <code>None</code> | Numbers drawn as a tiny trend line under the value |</p>
<p>| <code>benchmark</code> | <code>float</code> | ❌ | <code>None</code> | Reference the value is compared with ("17x below median") |</p>
<p>| <code>benchmark_label</code> | <code>str</code> | ❌ | <code>"benchmark"</code> | Name of the benchmark in that line |</p>

<p>| <code>value</code> | <code>str</code> | ❌ | <code>""</code> | Default selected |</p>
<p>| <code>name</code> | <code>str</code> | ❌ | <code>None</code> | Submit key in a form (else <code>label</code>) |</p>
<p>| <code>searchable</code> | <code>bool</code> | ❌ | <code>None</code> | <code>True</code>: a type-to-search list (combobox). <code>None</code>: searchable when there are more than 20 options or <code>options_url</code> is set. <code>False</code>: always a plain dropdown |</p>
<p>| <code>auto_submit</code> | <code>bool</code> | ❌ | <code>False</code> | Submit the enclosing form when the value changes |</p>
<p>| <code>options_url</code> | <code>str</code> | ❌ | <code>None</code> | Endpoint queried with <code>?q=&lt;text&gt;</code> (debounced 200 ms) returning <code>[{"value", "label"}]</code>, <code>["str"]</code>, or <code>{"options": [...]}</code> |</p>
<p>| <code>placeholder</code> | <code>str</code> | ❌ | <code>None</code> | Placeholder text shown when no value is selected |</p>
<p>| <code>selected_label</code> | <code>str</code> | ❌ | <code>None</code> | Display label for the initial <code>value</code> when <code>options_url</code> is used and <code>options</code> is omitted |</p>
<p>In the app shell the searchable list filters as you type (names that start</p>
<p>with the text first) and renders at most 100 rows, with a "N more: type to</p>
<p>narrow" line, so a list of a thousand options opens instantly. When</p>
<p><code>options_url</code> is set, typing queries the server endpoint with <code>?q=...</code> and</p>
<p>remembers chosen labels across searches. Arrow keys, Enter and Escape work as</p>
<p>in any listbox; the value posts by <code>name</code> like a plain select.</p>
<p><code>auto_submit=True</code> is also accepted by <code>text_input</code> (debounced 400 ms),</p>
<p><code>number_input</code>, <code>slider_input</code>, <code>textarea_input</code>, <code>checkbox_input</code>,</p>
<p><code>switch_input</code>, <code>radio_input</code>, <code>date_input</code>, <code>time_input</code> and</p>
<p><code>color_picker_input</code>.</p>

<h3>`aiui.tags_input(label, *, value, name, placeholder, auto_submit)`</h3>
<p>Free-text tags: Enter or a comma turns the typed text into a chip (pasted</p>

<p>Blank and duplicate tags are dropped. Posts a <strong>list</strong> of strings.</p>
<h3>`aiui.date_range_input(name, *, label, start, end, presets, auto_submit)`</h3>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>name</code> | <code>str</code> | ✅ | — | Submit-key prefix |</p>
<p>| <code>label</code> | <code>str</code> | ❌ | <code>None</code> | Label above the control |</p>
<p>| <code>start</code> / <code>end</code> | <code>str</code> | ❌ | <code>None</code> | Default ISO dates |</p>
<p>| <code>presets</code> | <code>Sequence[int\|dict]</code> | ❌ | <code>(7, 30, 90, 365)</code> | Day counts, or <code>{"days": 14, "label": "2 weeks"}</code>; <code>()</code> hides them |</p>
<p>| <code>auto_submit</code> | <code>bool</code> | ❌ | <code>False</code> | Submit the form when the range changes |</p>
<p>Preset buttons and two native date fields. It posts <strong><code>&lt;name&gt;_start</code></strong> and</p>
<p><strong><code>&lt;name&gt;_end</code></strong> (<code>"2026-01-31"</code>, or <code>""</code> for an open side). A preset sets</p>
<p>the end to today and the start that many days earlier, in the browser's local</p>
<p>date; the preset whose range matches is shown as pressed.</p>

<p>The app shell renders sanitised Markdown: <code>&lt;svg&gt;</code>, <code>&lt;script&gt;</code>, <code>&lt;style&gt;</code>,</p>
<p><code>style</code> attributes and event handlers are removed. Put raw HTML and SVG in</p>
<p><code>aiui.html</code> instead.</p>
<h3>`aiui.link(text, *, href, external)`</h3>

<h3>`aiui.link_button(label, href, *, variant, external)` and `aiui.page_link(page_id, label, *, variant, params)`</h3>
<p><code>link_button</code> is a link drawn as a button (<code>variant</code>: <code>"outline"</code> default,</p>
<p><code>"primary"</code>, <code>"secondary"</code>, <code>"ghost"</code>, <code>"link"</code>). <code>page_link</code> links to another</p>
<p>page of the app by id; in the app shell a click opens it in place (no reload),</p>
<p>Ctrl/Cmd-click still opens a new tab, <code>params</code> appends query parameters to the</p>
<p>target URL, and <code>variant</code> draws it as a button. Both return a <code>link</code> dict, so</p>
<p>the legacy dashboard shows a plain link. Gallery items, <code>card_grid</code> cards,</p>
<p>breadcrumbs, table <code>link</code> cells and <code>button_group</code> items also accept <code>page</code></p>
<p>with optional <code>params</code> (and same-origin <code>/page?k=v</code> hrefs navigate in place in</p>
<p>the app shell).</p>

<p>An image/media gallery grid.</p>
<p>| Parameter | Type | Required | Description |</p>

<p>| <code>items</code> | <code>Sequence[dict]</code> | ✅ | List of <code>{"src": str, "alt": str, "caption": str}</code> |</p>
<p>Optional per item: <code>title</code>, <code>subtitle</code>, <code>tag</code>, <code>description</code>, and a link that</p>
<p>makes the whole tile clickable and keyboard focusable: <code>href</code> (+ <code>target</code>, e.g.</p>

<p>unless <code>target</code> is set). When both <code>title</code> and <code>caption</code> are given, <code>caption</code></p>

<h3>`aiui.card_grid(items, *, columns)`</h3>
<p>A responsive grid of entity cards (a person, channel, product, ...). It shows</p>
<p><code>columns</code> cards per row on a wide page, two at medium width and one on a phone.</p>
<p><code>columns</code> (1-6, default 3) is the number per row on a wide page. Item keys: <code>title</code> (required), <code>subtitle</code>, <code>description</code> (two lines),</p>
<p><code>image</code> (cover image), <code>avatar</code> (round image URL; <code>True</code> shows the title's</p>
<p>initials), <code>badges</code> (strings or <code>{"text", "variant"}</code>), <code>stats</code></p>
<p>(<code>[{"label", "value"}]</code>), and <code>href</code> (+ <code>target</code>) or <code>page</code> to make the whole</p>
<p>card a link.</p>
<h3>`aiui.list_detail(*, rows, columns, title, page_size, search, empty)`</h3>
<p>A list with a detail panel beside it (below it on a phone): a dense table with</p>
<p>a sticky header, a search box, keyboard selection (Up and Down move, Enter</p>
<p>opens, Escape closes) and pages. Selecting a row shows its other columns and</p>
<p>its <code>detail</code> dict as key facts.</p>
<p>| Key | Type | Description |</p>
<p>|-----|------|-------------|</p>
<p>| <code>title</code> (or <code>label</code>) | <code>str</code> | Accessible name, also used in the search label. Default <code>Items</code> |</p>
<p>| <code>columns</code> | <code>list[str \| dict]</code> | <code>{"key", "label", "align"}</code> (<code>align</code>: <code>end</code> or <code>right</code> for numbers), or plain keys. Unset: the keys of the first row except <code>id</code> and <code>detail</code> |</p>
<p>| <code>rows</code> | <code>list[dict]</code> | One dict per row: <code>id</code> (default: its index), a value per column key, and an optional <code>detail</code> dict shown in the panel |</p>
<p>| <code>page_size</code> | <code>int</code> | Rows per page. Default 25 |</p>
<p>| <code>search</code> | <code>bool</code> | Show the search box even when every row fits on one page (it shows by itself past one page) |</p>
<p>| <code>empty</code> | <code>str</code> | Text shown when there are no rows |</p>
<p>Use <code>aiui.table(...)</code> instead when the list needs typed cells or header</p>
<p>sorting (<code>row_detail=True</code> or <code>detail_key</code> give it a side panel).</p>

<h3>`aiui.html(content, *, height, csp, trusted, title)`</h3>
<p>App HTML or SVG (a chart, a styled box, a small interactive widget), isolated</p>
<p>from the page.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>content</code> | <code>str</code> | ✅ | — | HTML string; may hold <code>&lt;svg&gt;</code>, <code>&lt;style&gt;</code> and <code>&lt;script&gt;</code> |</p>
<p>| <code>height</code> | <code>int\|str</code> | ❌ | <code>None</code> | Fixed height (pixels or a CSS length such as <code>"20rem"</code>). Default: fit the content |</p>
<p>| <code>csp</code> | <code>str</code> | ❌ | <code>None</code> | Content-Security-Policy for the frame, replacing the default below |</p>
<p>| <code>trusted</code> | <code>bool</code> | ❌ | <code>False</code> | Render inline in the page instead of in a frame, sanitised (see below) |</p>
<p>| <code>title</code> | <code>str</code> | ❌ | <code>None</code> | Accessible name of the frame (default "Embedded content") |</p>
<p>!!! danger "Security model"</p>
<p><strong>Default (sandboxed frame).</strong> In the app shell the content renders in an</p>
<p><code>&lt;iframe sandbox="allow-scripts"&gt;</code> built from <code>srcdoc</code>, without</p>
<p><code>allow-same-origin</code>. Its scripts run in an opaque origin: they cannot read</p>
<p>or change the app's page, cookies, <code>localStorage</code> or session, cannot call</p>
<p><code>/api/*</code> as the signed-in user, cannot open pop-ups, submit forms or</p>
<p>navigate the top window. A <code>&lt;meta http-equiv="Content-Security-Policy"&gt;</code></p>
<p>also blocks network access. The default policy is</p>
<p><code>default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; base-uri 'none'; form-action 'none'</code>.</p>
<p>Pass <code>csp=</code> to tighten or loosen it; the frame sizes itself with a small</p>
<p>inline script, so a policy without <code>script-src 'unsafe-inline'</code> needs a</p>
<p>fixed <code>height</code>.</p>
<p><strong><code>trusted=True</code> (inline).</strong> The content is placed in the page through</p>
<p>the sanitised Markdown pipeline (<code>rehype-sanitize</code>): scripts, event</p>
<p>handlers, <code>style</code>, <code>&lt;iframe&gt;</code> and <code>&lt;svg&gt;</code> are removed. Use it for simple</p>
<p>markup (tables, lists, links) that should flow with the page text; use</p>
<p>the default frame for SVG and anything with scripts.</p>
<p><strong>Never put untrusted text into raw HTML yourself.</strong> Escape values you</p>
<p>interpolate (<code>html.escape(...)</code>) even inside the frame: an injected</p>
<p>script cannot reach the app, but it can still change what the frame shows.</p>
<p><strong>Legacy <code>dashboard</code> style.</strong> <code>html</code> renders in the same sandboxed frame</p>
<p>(fixed height, default 320 px). <code>html_embed</code> there still sets the HTML</p>
<p>directly on the page, where scripts and inline handlers run: pass only</p>
<p>content you wrote.</p>
<h4>Theme variables</h4>
<p>These CSS custom properties are defined on the page in both themes and copied</p>
<p>into every <code>html</code> frame, where they follow light/dark changes live:</p>
<p>| Variable | Meaning |</p>
<p>|----------|---------|</p>
<p>| <code>--aiui-fg</code> | Body text |</p>
<p>| <code>--aiui-muted</code> | Secondary text, axis labels |</p>
<p>| <code>--aiui-border</code> | Hairlines, grid lines |</p>
<p>| <code>--aiui-bg</code> | Page background |</p>
<p>| <code>--aiui-surface</code> | Card / panel background |</p>
<p>| <code>--aiui-accent</code> | Brand accent (follows the theme preset) |</p>
<p>| <code>--aiui-success</code> / <code>--aiui-warning</code> / <code>--aiui-danger</code> / <code>--aiui-info</code> | Status colours |</p>
<p>| <code>--aiui-font</code> / <code>--aiui-font-mono</code> | Font stacks |</p>
<p>The frame's body already uses <code>--aiui-fg</code> and <code>--aiui-font</code> and has a</p>
<p>transparent background, so plain HTML matches the page.</p>

<h2>Composition</h2>
<p>Components are designed to compose. Use <code>columns()</code> for horizontal layout within a <code>layout()</code>:</p>
<h2>Forms and filters</h2>
<h3>`aiui.form(action, *, children, submit_label, submit_on_change)`</h3>
<p>On submit the form POSTs every input by <code>name</code> (else <code>label</code>) as JSON to</p>
<p><code>/api/pages/{page}/action</code>, handled by <code>@aiui.register_page_action(action)</code>;</p>
<p><code>action</code> is normally the page id. If the handler returns a block tree</p>
<p>(<code>aiui.layout([...])</code>, i.e. <code>{"_components": [...]}</code>) the page re-renders with</p>
<p>it; a reply with <code>message</code> shows a toast instead.</p>
<p><code>submit_on_change=True</code> submits whenever an input changes: right away for</p>
<p>selects, pills, chips, checkboxes and dates, 400 ms after the last keystroke</p>
<p>for text. A submit with the same values as the last one is skipped, and a</p>
<p>change made while one is in flight posts once more when it returns. Leave it</p>
<p>off for a form whose button starts a job; mark single inputs with</p>
<p><code>auto_submit=True</code> instead.</p>
<h3>`aiui.filter_bar(action, *, inputs, chips, defaults, reset_label, method, update_url)`</h3>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>action</code> | <code>str</code> | ❌ | <code>""</code> | Action id (normally the page id; optional with <code>method="get"</code>) |</p>
<p>| <code>inputs</code> | <code>Sequence[dict]</code> | ✅ | — | Input components |</p>
<p>| <code>chips</code> | <code>bool</code> | ❌ | <code>True</code> | Show active filters as removable chips |</p>
<p>| <code>defaults</code> | <code>dict</code> | ❌ | <code>None</code> | Reset value per input name (<code>{"start", "end"}</code> for a date range) |</p>
<p>| <code>reset_label</code> | <code>str</code> | ❌ | <code>"Reset"</code> | Label of the control that clears all filters |</p>
<p>| <code>method</code> | <code>str</code> | ❌ | <code>"post"</code> | <code>"get"</code> writes filter values into the page URL and re-fetches page data (no action handler needed) |</p>
<p>| <code>update_url</code> | <code>bool</code> | ❌ | <code>False</code> | With <code>method="post"</code>, also write submitted values into the page URL after a successful action |</p>
<p>A compact wrapping row (a <code>search</code> landmark) that posts like <code>form</code> with</p>
<p><code>submit_on_change</code>. Under it, each active filter is a chip ("Channel: Ann ×",</p>
<p>one chip per value of a list); the × posts the form with that filter reset,</p>
<p>and Reset posts all of them reset. A filter is active when its value differs</p>
<p>from its reset value: <code>defaults[name]</code>, else the first option of a select,</p>
<p>radio or single segmented input, else empty; number and slider inputs only</p>
<p>when <code>defaults</code> names them. Chips are read from the values the server sent,</p>
<p>so the handler must return the page rebuilt from the posted values.</p>
<p>A full example: <code>examples/python/32-filter-page/app.py</code>.</p>
<p><code>tags_input</code>, <code>date_range_input</code>, <code>segmented_input</code> and <code>filter_bar</code> render</p>
<p>in the app shell (the default style); the legacy <code>dashboard</code> style shows them</p>
<p>as JSON.</p>

<p>The <code>dashboard.js</code> renderer supports any dict with a <code>type</code> key. Unknown types render as formatted JSON, making it safe to experiment:</p>
<p>---</p>
<h2>Component Render Protocol</h2>
<p>Understanding how components flow from Python to the browser.</p>
<h3>Data Flow</h3>
<h3>Step-by-Step</h3>
<p>1. <strong>Python</strong>: Call <code>aiui.card("Revenue", value="$1,500")</code> — returns a dict:</p>
<p>2. <strong>Server</strong>: <code>@aiui.page()</code> handler returns <code>aiui.layout([...])</code>:</p>
<p>3. <strong>API</strong>: <code>GET /api/pages/{id}/data</code> returns the JSON</p>
<p>4. <strong>Frontend</strong>: <code>dashboard.js</code> detects <code>_components</code> key and calls <code>renderComponents()</code>:</p>
<p>5. <strong>Renderer</strong>: <code>renderComponent(comp)</code> dispatches on <code>comp.type</code>:</p>
<p>6. <strong>DOM</strong>: Each renderer creates HTML elements with <code>db-*</code> CSS classes</p>
<h3>The `_components` Key</h3>
<p>The magic key that triggers structured rendering:</p>
<p><code>aiui.layout(children)</code> automatically wraps children in <code>{"_components": [...]}</code>.</p>
<h3>Component Dict Protocol</h3>
<p>Every component function returns a dict with:</p>
<p>| Key | Required | Description |</p>
<p>|-----|----------|-------------|</p>
<p>| <code>type</code> | ✅ | Component type name (e.g. <code>"card"</code>, <code>"table"</code>) |</p>
<p>| Other keys | Varies | Component-specific properties |</p>
<h3>CSS Classes</h3>
<p>All components use <code>db-*</code> prefixed CSS classes:</p>
<p>| Component | CSS Class |</p>
<p>|-----------|-----------|</p>
<p>| Card | <code>.db-card</code>, <code>.db-card-title</code>, <code>.db-card-value</code>, <code>.db-card-footer</code> |</p>
<p>| Table | <code>.db-viewer table</code> |</p>
<p>| Alert | <code>.db-alert</code>, <code>.db-alert-info</code>, <code>.db-alert-success</code>, etc. |</p>
<p>| Badge | <code>.db-badge</code>, <code>.db-badge-secondary</code>, <code>.db-badge-destructive</code> |</p>
<p>| Tabs | <code>.db-tabs</code>, <code>.db-tab-list</code>, <code>.db-tab-btn</code>, <code>.db-tab-panel</code> |</p>

<h3>`aiui.whiteboard(items, *, title="Whiteboard", id=None)`</h3>
<p>Interactive whiteboard canvas with draggable stickies, shapes, groups, connected arrows, zoom controls, and SVG/JSON export.</p>
<h3>`aiui.plotly_chart(fig, title="", *, height=None, caption=None)`</h3>
<p>Convert a standard Plotly figure (or figure dict) into a native Recharts <code>chart</code> block (<code>bar</code>, <code>barh</code>, <code>line</code>, <code>area</code>, <code>scatter</code>, <code>pie</code>, <code>donut</code>, <code>histogram</code>, <code>heatmap</code>) without bundling <code>plotly.js</code>. Unsupported trace types degrade cleanly to an alert + <code>json_view</code>.</p>
<h3>`aiui.file_upload(label="Upload file", *, name="files", accept=None, multiple=False, max_size_mb=10, help_text=None, auto_submit=False)`</h3>
<p>Drag-and-drop file uploader that posts files to the authenticated <code>POST /api/chat/attachments</code> endpoint and submits safe handles (<code>{id, filename, content_type, size}</code>). Resolve handles server-side with <code>aiui.get_uploaded_file()</code>.</p>
<h3>`aiui.chat_panel(*, title="Agent Chat", agent=None, height=520, session_id=None, welcome=None)`</h3>
<p>Embed a compact, streaming Agent Chat panel inside any <code>@aiui.page</code> layout (for example, beside a table, chart, or document viewer inside <code>aiui.columns([...])</code>).</p>
<h3>`aiui.form_action(action, *, children, submit_label="Submit")`</h3>
<p>Deprecated alias for <code>aiui.form()</code>. Prefer <code>aiui.form(...)</code> in new code.</p>
