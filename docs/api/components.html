<p>Python functions for building dashboard UIs. Each function returns a dict that the frontend renders as a real UI element — <strong>36 components</strong> organized into tiers.</p>
<h2>Essential Components</h2>
<h3>`aiui.metric(label, *, value, delta, delta_color)`</h3>
<p>A metric card with optional delta indicator.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>label</code> | <code>str</code> | ✅ | — | Metric label |</p>
<p>| <code>value</code> | <code>Any</code> | ✅ | — | Main metric value |</p>
<p>| <code>delta</code> | <code>str</code> | ❌ | <code>None</code> | Change indicator (e.g. "+5%") |</p>
<p>| <code>delta_color</code> | <code>str</code> | ❌ | <code>"normal"</code> | <code>"normal"</code>, <code>"inverse"</code>, or <code>"off"</code> |</p>
<h3>`aiui.progress_bar(label, *, value, max_value)`</h3>
<p>A progress bar.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>label</code> | <code>str</code> | ✅ | — | Label above the bar |</p>
<p>| <code>value</code> | <code>int\|float</code> | ✅ | — | Current value |</p>
<p>| <code>max_value</code> | <code>int\|float</code> | ❌ | <code>100</code> | Maximum value |</p>
<h3>`aiui.alert(message, *, variant, title)`</h3>
<p>An alert/notification box.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>message</code> | <code>str</code> | ✅ | — | Alert body text |</p>
<p>| <code>variant</code> | <code>str</code> | ❌ | <code>"info"</code> | <code>"info"</code>, <code>"success"</code>, <code>"warning"</code>, <code>"error"</code> |</p>
<p>| <code>title</code> | <code>str</code> | ❌ | <code>None</code> | Optional bold title |</p>
<h3>`aiui.badge(text, *, variant)`</h3>
<p>An inline badge/tag.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>text</code> | <code>str</code> | ✅ | — | Badge label |</p>
<p>| <code>variant</code> | <code>str</code> | ❌ | <code>"default"</code> | <code>"default"</code>, <code>"secondary"</code>, <code>"destructive"</code>, <code>"outline"</code> |</p>
<h3>`aiui.separator()`</h3>
<p>A horizontal separator line. No parameters.</p>
<h3>`aiui.tabs(items)`</h3>
<p>A tabbed container.</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>items</code> | <code>Sequence[dict]</code> | ✅ | List of <code>{"label": str, "children": [comp_dicts]}</code> |</p>
<h3>`aiui.accordion(items)`</h3>
<p>A collapsible accordion.</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>items</code> | <code>Sequence[dict]</code> | ✅ | List of <code>{"title": str, "content": str_or_comp}</code> |</p>
<h3>`aiui.image_display(src, *, alt, caption, width)`</h3>
<p>An image with optional caption.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>src</code> | <code>str</code> | ✅ | — | Image URL or path |</p>
<p>| <code>alt</code> | <code>str</code> | ❌ | <code>""</code> | Alt text |</p>
<p>| <code>caption</code> | <code>str</code> | ❌ | <code>None</code> | Caption below image |</p>
<p>| <code>width</code> | <code>str</code> | ❌ | <code>None</code> | CSS width (e.g. <code>"300px"</code>, <code>"50%"</code>) |</p>
<h3>`aiui.code_block(code, *, language)`</h3>
<p>A code block with syntax highlighting.</p>
<p>| Parameter | Type | Required | Default | Description |</p>
<p>|-----------|------|----------|---------|-------------|</p>
<p>| <code>code</code> | <code>str</code> | ✅ | — | Source code text |</p>
<p>| <code>language</code> | <code>str</code> | ❌ | <code>"text"</code> | Language for highlighting |</p>
<h3>`aiui.json_view(data)`</h3>
<p>A formatted JSON viewer.</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>data</code> | <code>Any</code> | ✅ | Any JSON-serializable data |</p>

<h2>Custom Component Types</h2>
<p>The <code>dashboard.js</code> renderer supports any dict with a <code>type</code> key. Unknown types render as formatted JSON, making it safe to experiment:</p>
<p>---</p>
<h2>Component Render Protocol</h2>
<p>Understanding how components flow from Python to the browser.</p>
<h3>Data Flow</h3>
<h3>Step-by-Step</h3>
<p>1. <strong>Python</strong>: Call <code>aiui.card("Revenue", value="$1,500")</code> — returns a dict:</p>
<p>2. <strong>Server</strong>: <code>@aiui.page()</code> handler returns <code>aiui.layout([...])</code>:</p>
<p>3. <strong>API</strong>: <code>GET /api/pages/{id}/data</code> returns the JSON</p>
<p>4. <strong>Frontend</strong>: <code>dashboard.js</code> detects <code>_components</code> key and calls <code>renderComponents()</code>:</p>
<p>5. <strong>Renderer</strong>: <code>renderComponent(comp)</code> dispatches on <code>comp.type</code>:</p>
<p>6. <strong>DOM</strong>: Each renderer creates HTML elements with <code>db-*</code> CSS classes</p>
<h3>The `_components` Key</h3>
<p>The magic key that triggers structured rendering:</p>
<p><code>aiui.layout(children)</code> automatically wraps children in <code>{"_components": [...]}</code>.</p>
<h3>Component Dict Protocol</h3>
<p>Every component function returns a dict with:</p>
<p>| Key | Required | Description |</p>
<p>|-----|----------|-------------|</p>
<p>| <code>type</code> | ✅ | Component type name (e.g. <code>"card"</code>, <code>"table"</code>) |</p>
<p>| Other keys | Varies | Component-specific properties |</p>
<h3>CSS Classes</h3>
<p>All components use <code>db-*</code> prefixed CSS classes:</p>
<p>| Component | CSS Class |</p>
<p>|-----------|-----------|</p>
<p>| Card | <code>.db-card</code>, <code>.db-card-title</code>, <code>.db-card-value</code>, <code>.db-card-footer</code> |</p>
<p>| Table | <code>.db-viewer table</code> |</p>
<p>| Alert | <code>.db-alert</code>, <code>.db-alert-info</code>, <code>.db-alert-success</code>, etc. |</p>
<p>| Badge | <code>.db-badge</code>, <code>.db-badge-secondary</code>, <code>.db-badge-destructive</code> |</p>
<p>| Tabs | <code>.db-tabs</code>, <code>.db-tab-list</code>, <code>.db-tab-btn</code>, <code>.db-tab-panel</code> |</p>
<h3>Extending with Custom Components</h3>
<p>To add a new component type:</p>
<p>1. <strong>Python</strong>: Add function to <code>ui.py</code>:</p>
<p>2. <strong>Frontend</strong>: Add renderer to <code>dashboard.js</code>:</p>
<p>3. <strong>CSS</strong>: Add styles for <code>.db-timeline</code></p>
<p>Until the frontend renderer is added, unknown types render as formatted JSON.</p></noscript></div>
