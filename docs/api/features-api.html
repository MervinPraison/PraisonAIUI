ckend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/health-endpoints">Health Endpoints Guide</a></li><li><a href="https://ui.praison.ai/docs/api">Reference</a></li><li><a href="https://ui.praison.ai/docs/api/cli">CLI Reference</a></li><li><a href="https://ui.praison.ai/docs/api/python">Python SDK API</a></li><li><a href="https://ui.praison.ai/docs/concepts/configuration">YAML Configuration</a></li><li><a href="https://ui.praison.ai/docs/api/components">Component API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/features-api">Features REST API Reference</a></li><li><a href="https://ui.praison.ai/docs/features/api-reference">API Reference page and OpenAPI document</a></li><li><a href="https://ui.praison.ai/docs/api/sessions">Sessions API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/health">Health API Reference</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/api/typescript">TypeScript SDK Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocols">Feature Protocols</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-architecture">Protocol Architecture Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-versioning">Protocol Versioning</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp">Application Design Protocol (ADP)</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Features REST API Reference</h1>
<p>Complete API reference for all <strong>36</strong> PraisonAIUI feature protocol endpoints.</p>
<p>A running server describes every route it answers, plugins included, at</p>
<p><code>GET /api/openapi.json</code>, and the app shell's API Reference page lets you try them: see</p>
<p>API Reference page and OpenAPI document.</p>
<h2>Feature Registry</h2>
<h3>GET /api/features</h3>
<p>List all registered features with health status.</p>
<p><strong>Response:</strong></p>
<p>---</p>
<h2>Approvals</h2>
<p>Tool-execution approval management with policies, history, and SSE streaming.</p>
<h3>GET /api/approvals</h3>
<p>List all approvals.</p>
<h3>POST /api/approvals</h3>
<p>Create an approval request.</p>
<h3>GET /api/approvals/pending</h3>
<p>List pending approvals only.</p>
<h3>GET /api/approvals/history</h3>
<p>List resolved approvals.</p>
<h3>GET /api/approvals/policies</h3>
<p>Get auto-approve/deny policies.</p>
<h3>PUT /api/approvals/policies</h3>
<p>Update policies.</p>
<h3>GET /api/approvals/stream</h3>
<p>SSE stream for real-time approval notifications.</p>
<h3>GET /api/approvals/{id}</h3>
<p>Get single approval by ID.</p>
<h3>POST /api/approvals/{id}/approve</h3>
<p>Approve a pending request. Body: <code>{"reason": "...", "always": false}</code></p>
<h3>POST /api/approvals/{id}/deny</h3>
<p>Deny a pending request. Body: <code>{"reason": "...", "always": false}</code></p>
<p>---</p>
<h2>Channels</h2>
<h3>GET /api/channels</h3>
<p>List all configured channels with live gateway status.</p>
<h3>POST /api/channels</h3>
<p>Add a channel.</p>
<h3>GET /api/channels/platforms</h3>
<p>List supported platforms.</p>
<h3>GET /api/channels/{id}</h3>
<p>Get channel details.</p>
<h3>PUT /api/channels/{id}</h3>
<p>Update channel configuration. Body fields: <code>name</code>, <code>platform</code>, <code>enabled</code>, <code>config</code>.</p>
<h3>DELETE /api/channels/{id}</h3>
<p>Remove a channel.</p>
<h3>POST /api/channels/{id}/toggle</h3>
<p>Toggle channel enabled/disabled.</p>
<h3>GET /api/channels/{id}/status</h3>
<p>Get live channel status (enriched via gateway).</p>
<h3>POST /api/channels/{id}/restart</h3>
<p>Restart a channel bot via the gateway. Returns status of restart attempt.</p>
<p>---</p>
<h2>Schedules</h2>
<h3>POST /api/schedules</h3>
<p>Add a scheduled job.</p>
<h3>GET /api/schedules</h3>
<p>List all scheduled jobs: <code>schedules</code>, <code>count</code>, and <code>cron_available</code> (false when the server lacks <code>croniter</code>, so cron schedules never run).</p>
<h3>GET /api/schedules/{id}</h3>
<p>Get job details.</p>
<h3>PUT /api/schedules/{id}</h3>
<p>Update schedule configuration. Body fields: <code>name</code>, <code>message</code>, <code>schedule</code>, <code>agent_name</code>, <code>enabled</code>.</p>
<h3>DELETE /api/schedules/{id}</h3>
<p>Remove a job.</p>
<h3>POST /api/schedules/{id}/toggle</h3>
<p>Toggle job enabled/disabled.</p>
<h3>POST /api/schedules/{id}/run</h3>
<p>Trigger job immediately; the job keeps <code>last_run_at</code>, <code>run_count</code> and <code>last_status</code>, and <code>GET /api/schedules/history</code> lists recent runs (in memory).</p>
<h3>POST /api/schedules/{id}/stop</h3>
<p>Stop a running scheduled job: it is disabled (kept on disk) and the reply carries <code>stopped_at</code>. Attempts to cancel via <code>AgentScheduler</code> if available.</p>
<h3>GET /api/schedules/{id}/stats</h3>
<p>Get execution statistics for a schedule.</p>
<p>---</p>
<h2>Jobs</h2>
<h3>POST /api/jobs</h3>
<p>Submit a new async job. Returns 202 Accepted.</p>
<h3>GET /api/jobs</h3>
<p>List jobs with optional filters. Query: <code>?status=running</code>, <code>?limit=50</code>, <code>?offset=0</code></p>
<h3>GET /api/jobs/stats</h3>
<p>Get executor statistics.</p>
<h3>GET /api/jobs/{id}</h3>
<p>Get full job details.</p>
<h3>GET /api/jobs/{id}/status</h3>
<p>Get job status with progress info.</p>
<h3>GET /api/jobs/{id}/result</h3>
<p>Get job result. Returns 409 if not yet complete.</p>
<h3>POST /api/jobs/{id}/cancel</h3>
<p>Cancel a running or queued job. Returns 409 if already complete.</p>
<h3>DELETE /api/jobs/{id}</h3>
<p>Delete a completed job. Returns 409 if still running.</p>
<h3>GET /api/jobs/{id}/stream</h3>
<p>SSE stream for real-time job updates. Events: <code>status</code>, <code>progress</code>, <code>result</code>, <code>error</code>, <code>done</code>.</p>
<p>---</p>
<h2>Usage</h2>
<h3>GET /api/usage</h3>
<p>Usage summary with totals and averages.</p>
<h3>POST /api/usage/track</h3>
<p>Track a usage event.</p>
<h3>GET /api/usage/details</h3>
<p>Detailed usage records. Query: <code>?limit=100</code>, <code>?offset=0</code></p>
<h3>GET /api/usage/models</h3>
<p>Per-model breakdown (tokens, cost, request count).</p>
<h3>GET /api/usage/sessions</h3>
<p>Per-session breakdown.</p>
<h3>GET /api/usage/agents</h3>
<p>Per-agent breakdown.</p>
<h3>GET /api/usage/timeseries</h3>
<p>Time-series data for charts. Query: <code>?hours=24</code>, <code>?bucket_minutes=60</code></p>
<h3>GET /api/usage/costs</h3>
<p>Get the model cost table (per-1K token rates for 21 models).</p>
<p>---</p>
<h2>Memory</h2>
<h3>POST /api/memory</h3>
<p>Add a memory entry.</p>
<h3>POST /api/memory/search</h3>
<p>Search memories.</p>
<h3>GET /api/memory</h3>
<p>List all memories. Query: <code>?type=short|long|entity|all</code></p>
<h3>GET /api/memory/{id}</h3>
<p>Get single memory.</p>
<h3>DELETE /api/memory/{id}</h3>
<p>Delete single memory.</p>
<h3>DELETE /api/memory</h3>
<p>Clear memories. Query: <code>?type=all</code></p>
<h3>POST /api/memory/context</h3>
<p>Get memory context for prompt injection.</p>
<p>---</p>
<h2>Extended Sessions</h2>
<h3>GET /api/sessions</h3>
<p>Sessions, newest first. Optional paging: <code>?limit=20&amp;offset=40</code>. Without</p>
<p><code>limit</code> every session is returned (as before). <code>count</code> is the number in this</p>
<p>response, <code>total</code> the number of sessions. <code>GET /sessions</code> takes the same</p>
<p>parameters and also reports <code>total</code>.</p>
<p>The file stores (<code>JSONFileDataStore</code>, <code>SDKFileDataStore</code>) keep each session's</p>
<p>row until its file changes, so a list re-reads only the sessions written</p>
<p>since the last one.</p>
<h3>GET /api/sessions/{session_id}/state</h3>
<p>Get session state.</p>
<h3>POST /api/sessions/{session_id}/state</h3>
<p>Save session state.</p>
<h3>POST /api/sessions/{session_id}/context</h3>
<p>Build context from session state + memory.</p>
<h3>POST /api/sessions/{session_id}/compact</h3>
<p>Compact session data. Returns before/after stats.</p>
<h3>POST /api/sessions/{session_id}/reset</h3>
<p>Reset session. Body: <code>{"mode": "clear"}</code></p>
<h3>GET /api/sessions/{session_id}/preview</h3>
<p>Formatted session preview without full history.</p>
<h3>GET/POST /api/sessions/{session_id}/labels</h3>
<p>Get or set session labels.</p>
<h3>GET /api/sessions/{session_id}/usage</h3>
<p>Get session usage statistics.</p>
<p>---</p>
<h2>Skills</h2>
<p>Tool catalog with 18 built-in tools across 7 categories (search, crawl, file, code, shell, skills, schedule).</p>
<h3>GET /api/skills</h3>
<p>List all tools. Query: <code>?category=search</code>, <code>?enabled=true</code>, <code>?search=web</code></p>
<h3>GET /api/skills/categories</h3>
<p>List tool categories.</p>
<h3>POST /api/skills</h3>
<p>Register a custom skill.</p>
<h3>GET /api/skills/{id}</h3>
<p>Get tool details including required API keys.</p>
<h3>PUT /api/skills/{id}</h3>
<p>Update a custom skill.</p>
<h3>DELETE /api/skills/{id}</h3>
<p>Remove a custom skill (builtin tools cannot be deleted).</p>
<h3>POST /api/skills/{id}/toggle</h3>
<p>Toggle tool enabled/disabled.</p>
<h3>PUT /api/skills/{id}/config</h3>
<p>Set tool configuration or API keys.</p>
<p>---</p>
<h2>Hooks</h2>
<h3>POST /api/hooks</h3>
<p>Register a hook.</p>
<h3>GET /api/hooks</h3>
<p>List all hooks.</p>
<h3>GET /api/hooks/log</h3>
<p>View hook execution log. Query: <code>?limit=20</code></p>
<h3>GET /api/hooks/{id}</h3>
<p>Get hook details.</p>
<h3>POST /api/hooks/{id}/trigger</h3>
<p>Trigger a hook manually.</p>
<h3>DELETE /api/hooks/{id}</h3>
<p>Remove hook.</p>
<p>---</p>
<h2>Workflows</h2>
<h3>POST /api/workflows</h3>
<p>Create a workflow.</p>

<p>Get security configuration.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/api/features-api.source.md", "text": "---\nnav_title: Features REST API\n---\n\n# Features REST API Reference\n\nComplete API reference for all **36** PraisonAIUI feature protocol endpoints.\n\nA running server describes every route it answers, plugins included, at\n`GET /api/openapi.json`, and the app shell's API Reference page lets you try them: see\n[API Reference page and OpenAPI document](../features/api-reference.md).\n\n## Feature Registry\n\n### GET /api/features\n\nList all registered features with health status.\n\n**Response:**\n```json\n{\n  \"features\": [\n    {\n      \"name\": \"approvals\",\n      \"description\": \"Tool-execution approval management\",\n      \"health\": {\"status\": \"ok\", \"feature\": \"approvals\"},\n      \"routes\": [\"/api/approvals\", \"/api/approvals/{id}\", ...]\n    }\n  ],\n  \"count\": 36\n}\n```\n\n---\n\n## Approvals\n\nTool-execution approval management with policies, history, and SSE streaming.\n\n### GET /api/approvals\nList all approvals.\n\n### POST /api/approvals\nCreate an approval request.\n\n```json\n// Request\n{\"tool_name\": \"execute_command\", \"arguments\": {\"command\": \"rm -rf /tmp/test\"}, \"risk_level\": \"high\", \"agent_name\": \"SystemAgent\"}\n\n// Response (201)\n{\"id\": \"abc123\", \"tool_name\": \"execute_command\", \"status\": \"pending\", \"risk_level\": \"high\", \"risk_icon\": \"🟠\", \"created_at\": 1709000000.0}\n```\n\n### GET /api/approvals/pending\nList pending approvals only.\n\n### GET /api/approvals/history\nList resolved approvals.\n\n### GET /api/approvals/policies\nGet auto-approve/deny policies.\n\n```json\n// Response\n{\"auto_approve_tools\": [\"read_file\"], \"always_deny_tools\": [], \"auto_approve_agents\": [], \"risk_threshold\": \"high\"}\n```\n\n### PUT /api/approvals/policies\nUpdate policies.\n\n### GET /api/approvals/stream\nSSE stream for real-time approval notifications.\n\n### GET /api/approvals/{id}\nGet single approval by ID.\n\n### POST /api/approvals/{id}/approve\nApprove a pending request. Body: `{\"reason\": \"...\", \"always\": false}`\n\n```json\n// Response\n{\"id\": \"abc123\", \"status\": \"approved\", \"resolved_at\": 1709000001.0, \"resolved_by\": \"admin\"}\n```\n\n### POST /api/approvals/{id}/deny\nDeny a pending request. Body: `{\"reason\": \"...\", \"always\": false}`\n\n---\n\n## Channels\n\n### GET /api/channels\nList all configured channels with live gateway status.\n\n```json\n// Response\n{\n  \"channels\": [\n    {\"id\": \"tg1\", \"name\": \"Support Bot\", \"platform\": \"telegram\", \"enabled\": true, \"running\": true, \"last_activity\": 1709000000.0}\n  ],\n  \"count\": 1\n}\n```\n\n### POST /api/channels\nAdd a channel.\n\n```json\n// Request\n{\"name\": \"Discord Bot\", \"platform\": \"discord\", \"enabled\": true, \"config\": {\"token\": \"...\"}}\n\n// Response (201)\n{\"id\": \"abc123\", \"name\": \"Discord Bot\", \"platform\": \"discord\", \"enabled\": true, \"running\": false, \"created_at\": 1709000000.0}\n```\n\n### GET /api/channels/platforms\nList supported platforms.\n\n```json\n// Response\n{\"platforms\": [\"discord\", \"slack\", \"telegram\", \"whatsapp\", \"imessage\", \"signal\", \"googlechat\", \"nostr\"]}\n```\n\n### GET /api/channels/{id}\nGet channel details.\n\n### PUT /api/channels/{id}\nUpdate channel configuration. Body fields: `name`, `platform`, `enabled`, `config`.\n\n### DELETE /api/channels/{id}\nRemove a channel.\n\n### POST /api/channels/{id}/toggle\nToggle channel enabled/disabled.\n\n### GET /api/channels/{id}/status\nGet live channel status (enriched via gateway).\n\n```json\n// Response\n{\"id\": \"tg1\", \"name\": \"Support Bot\", \"platform\": \"telegram\", \"enabled\": true, \"running\": true, \"last_activity\": 1709000000.0}\n```\n\n### POST /api/channels/{id}/restart\nRestart a channel bot via the gateway. Returns status of restart attempt.\n\n```json\n// Response (gateway connected)\n{\"id\": \"tg1\", \"status\": \"restarted\", \"running\": true, \"message\": \"Channel 'tg1' restarted successfully\"}\n\n// Response (no gateway)\n{\"id\": \"tg1\", \"status\": \"pending\", \"running\": false, \"message\": \"Channel marked for restart (no gateway connected)\"}\n```\n\n---\n\n## Schedules\n\n### POST /api/schedules\nAdd a scheduled job.\n\n```json\n// Request\n{\"name\": \"hourly-check\", \"message\": \"Run health check\", \"schedule\": {\"kind\": \"every\", \"every_seconds\": 3600}}\n\n// Response (201)\n{\"id\": \"job123\", \"name\": \"hourly-check\", \"schedule\": {\"kind\": \"every\", \"every_seconds\": 3600}, \"enabled\": true}\n```\n\n### GET /api/schedules\nList all scheduled jobs: `schedules`, `count`, and `cron_available` (false when the server lacks `croniter`, so cron schedules never run).\n\n### GET /api/schedules/{id}\nGet job details.\n\n### PUT /api/schedules/{id}\nUpdate schedule configuration. Body fields: `name`, `message`, `schedule`, `agent_name`, `enabled`.\n\n### DELETE /api/schedules/{id}\nRemove a job.\n\n### POST /api/schedules/{id}/toggle\nToggle job enabled/disabled.\n\n### POST /api/schedules/{id}/run\nTrigger job immediately; the job keeps `last_run_at`, `run_count` and `last_status`, and `GET /api/schedules/history` lists recent runs (in memory).\n\n### POST /api/schedules/{id}/stop\nStop a running scheduled job: it is disabled (kept on disk) and the reply carries `stopped_at`. Attempts to cancel via `AgentScheduler` if available.\n\n```json\n// Response\n{\"id\": \"job123\", \"status\": \"stopped\", \"message\": \"Schedule 'hourly-check' stopped\"}\n```\n\n### GET /api/schedules/{id}/stats\nGet execution statistics for a schedule.\n\n```json\n// Response\n{\"id\": \"job123\", \"name\": \"hourly-check\", \"total_runs\": 24, \"successful_runs\": 23, \"failed_runs\": 1, \"total_cost\": 0.045, \"last_run\": 1709000000.0, \"next_run\": 1709003600.0}\n```\n\n---\n\n## Jobs\n\n### POST /api/jobs\nSubmit a new async job. Returns 202 Accepted.\n\n```json\n// Request\n{\"prompt\": \"Analyze sales data\", \"agent\": \"analyst\", \"config\": {\"model\": \"gpt-4o\", \"timeout\": 300}}\n\n// Response (202)\n{\"id\": \"job_abc123\", \"status\": \"queued\", \"prompt\": \"Analyze sales data\", \"created_at\": 1709000000.0}\n```\n\n### GET /api/jobs\nList jobs with optional filters. Query: `?status=running`, `?limit=50`, `?offset=0`\n\n```json\n// Response\n{\"jobs\": [...], \"total\": 5, \"offset\": 0, \"limit\": 50}\n```\n\n### GET /api/jobs/stats\nGet executor statistics.\n\n```json\n// Response\n{\"total_jobs\": 100, \"queued\": 2, \"running\": 1, \"succeeded\": 90, \"failed\": 5, \"cancelled\": 2}\n```\n\n### GET /api/jobs/{id}\nGet full job details.\n\n### GET /api/jobs/{id}/status\nGet job status with progress info.\n\n```json\n// Response\n{\"id\": \"job_abc123\", \"status\": \"running\", \"progress\": 45, \"started_at\": 1709000001.0, \"elapsed\": 30.5}\n```\n\n### GET /api/jobs/{id}/result\nGet job result. Returns 409 if not yet complete.\n\n```json\n// Response (completed)\n{\"id\": \"job_abc123\", \"status\": \"succeeded\", \"result\": \"Analysis complete: revenue up 15%...\"}\n\n// Response (not complete, 409)\n{\"error\": \"Job not yet complete\", \"status\": \"running\"}\n```\n\n### POST /api/jobs/{id}/cancel\nCancel a running or queued job. Returns 409 if already complete.\n\n### DELETE /api/jobs/{id}\nDelete a completed job. Returns 409 if still running.\n\n### GET /api/jobs/{id}/stream\nSSE stream for real-time job updates. Events: `status`, `progress`, `result`, `error`, `done`.\n\n```\nevent: status\ndata: {\"status\": \"running\"}\n\nevent: progress\ndata: {\"progress\": 45}\n\nevent: result\ndata: {\"result\": \"Analysis complete...\"}\n\nevent: done\ndata: {\"status\": \"succeeded\"}\n```\n\n---\n\n## Usage\n\n### GET /api/usage\nUsage summary with totals and averages.\n\n```json\n// Response\n{\"total_requests\": 50, \"total_input_tokens\": 25000, \"total_output_tokens\": 12000, \"total_cost_usd\": 0.45, \"avg_cost_per_request\": 0.009}\n```\n\n### POST /api/usage/track\nTrack a usage event.\n\n```json\n// Request\n{\"model\": \"gpt-4o\", \"input_tokens\": 500, \"output_tokens\": 200, \"session_id\": \"s1\", \"agent_name\": \"analyst\"}\n\n// Response (201)\n{\"id\": \"u_abc123\", \"model\": \"gpt-4o\", \"cost_usd\": 0.00325, \"timestamp\": 1709000000.0}\n```\n\n### GET /api/usage/details\nDetailed usage records. Query: `?limit=100`, `?offset=0`\n\n### GET /api/usage/models\nPer-model breakdown (tokens, cost, request count).\n\n### GET /api/usage/sessions\nPer-session breakdown.\n\n### GET /api/usage/agents\nPer-agent breakdown.\n\n### GET /api/usage/timeseries\nTime-series data for charts. Query: `?hours=24`, `?bucket_minutes=60`\n\n```json\n// Response\n{\"buckets\": [{\"timestamp\": 1709000000.0, \"requests\": 5, \"tokens\": 3000, \"cost\": 0.02}, ...]}\n```\n\n### GET /api/usage/costs\nGet the model cost table (per-1K token rates for 21 models).\n\n---\n\n## Memory\n\n### POST /api/memory\nAdd a memory entry.\n\n```json\n// Request\n{\"text\": \"User prefers dark mode\", \"memory_type\": \"long\"}\n\n// Response (201)\n{\"id\": \"mem123\", \"text\": \"User prefers dark mode\", \"memory_type\": \"long\", \"created_at\": 1709000000.0}\n```\n\n### POST /api/memory/search\nSearch memories.\n\n```json\n// Request\n{\"query\": \"dark mode\", \"limit\": 10, \"memory_type\": \"all\"}\n\n// Response\n{\"results\": [...], \"count\": 1}\n```\n\n### GET /api/memory\nList all memories. Query: `?type=short|long|entity|all`\n\n### GET /api/memory/{id}\nGet single memory.\n\n### DELETE /api/memory/{id}\nDelete single memory.\n\n### DELETE /api/memory\nClear memories. Query: `?type=all`\n\n### POST /api/memory/context\nGet memory context for prompt injection.\n\n```json\n// Request\n{\"query\": \"user preferences\", \"limit\": 5}\n\n// Response\n{\"context\": \"Relevant memories:\\n- The user prefers dark mode\\n- User likes Python\"}\n```\n\n---\n\n## Extended Sessions\n\n### GET /api/sessions\nSessions, newest first. Optional paging: `?limit=20\u0026offset=40`. Without\n`limit` every session is returned (as before). `count` is the number in this\nresponse, `total` the number of sessions. `GET /sessions` takes the same\nparameters and also reports `total`.\n\n```json\n{\"sessions\": [{\"id\": \"...\", \"title\": \"...\", \"message_count\": 4, \"updated_at\": \"...\"}], \"count\": 20, \"total\": 312}\n```\n\nThe file stores (`JSONFileDataStore`, `SDKFileDataStore`) keep each session's\nrow until its file changes, so a list re-reads only the sessions written\nsince the last one.\n\n### GET /api/sessions/{session_id}/state\nGet session state.\n\n### POST /api/sessions/{session_id}/state\nSave session state.\n\n```json\n// Request\n{\"state\": {\"mood\": \"happy\", \"level\": 5}}\n```\n\n### POST /api/sessions/{session_id}/context\nBuild context from session state + memory.\n\n```json\n// Request\n{\"query\": \"What's the user mood?\"}\n```\n\n### POST /api/sessions/{session_id}/compact\nCompact session data. Returns before/after stats.\n\n### POST /api/sessions/{session_id}/reset\nReset session. Body: `{\"mode\": \"clear\"}`\n\n### GET /api/sessions/{session_id}/preview\nFormatted session preview without full history.\n\n### GET/POST /api/sessions/{session_id}/labels\nGet or set session labels.\n\n### GET /api/sessions/{session_id}/usage\nGet session usage statistics.\n\n---\n\n## Skills\n\nTool catalog with 18 built-in tools across 7 categories (search, crawl, file, code, shell, skills, schedule).\n\n### GET /api/skills\nList all tools. Query: `?category=search`, `?enabled=true`, `?search=web`\n\n```json\n// Response\n{\"skills\": [{\"id\": \"internet_search\", \"name\": \"internet_search\", \"category\": \"search\", \"enabled\": true, \"builtin\": true, \"required_keys\": []}], \"total\": 18}\n```\n\n### GET /api/skills/categories\nList tool categories.\n\n```json\n// Response\n{\"categories\": [\"search\", \"crawl\", \"file\", \"code\", \"shell\", \"skills\", \"schedule\"]}\n```\n\n### POST /api/skills\nRegister a custom skill.\n\n```json\n// Request\n{\"name\": \"my_tool\", \"description\": \"Does something\", \"category\": \"custom\"}\n\n// Response (201)\n{\"id\": \"my_tool\", \"name\": \"my_tool\", \"category\": \"custom\", \"enabled\": true, \"builtin\": false}\n```\n\n### GET /api/skills/{id}\nGet tool details including required API keys.\n\n### PUT /api/skills/{id}\nUpdate a custom skill.\n\n### DELETE /api/skills/{id}\nRemove a custom skill (builtin tools cannot be deleted).\n\n### POST /api/skills/{id}/toggle\nToggle tool enabled/disabled.\n\n### PUT /api/skills/{id}/config\nSet tool configuration or API keys.\n\n```json\n// Request\n{\"TAVILY_API_KEY\": \"tvly-xxx\"}\n```\n\n---\n\n## Hooks\n\n### POST /api/hooks\nRegister a hook.\n\n```json\n// Request\n{\"name\": \"on_tool_call\", \"event\": \"tool_call\", \"type\": \"pre\"}\n\n// Response (201)\n{\"id\": \"hook123\", \"name\": \"on_tool_call\", \"event\": \"tool_call\", \"type\": \"pre\"}\n```\n\n### GET /api/hooks\nList all hooks.\n\n### GET /api/hooks/log\nView hook execution log. Query: `?limit=20`\n\n### GET /api/hooks/{id}\nGet hook details.\n\n### POST /api/hooks/{id}/trigger\nTrigger a hook manually.\n\n```json\n// Request\n{\"data\": {\"tool\": \"test\"}}\n\n// Response\n{\"hook_id\": \"hook123\", \"result\": \"triggered\"}\n```\n\n### DELETE /api/hooks/{id}\nRemove hook.\n\n---\n\n## Workflows\n\n### POST /api/workflows\nCreate a workflow.\n\n```json\n// Request\n{\"name\": \"deploy-pipeline\", \"description\": \"Build, test, deploy\", \"pattern\": \"pipeline\", \"steps\": [\"build\", \"test\", \"deploy\"]}\n\n// Response (201)\n{\"id\": \"wf123\", \"name\": \"deploy-pipeline\", \"pattern\": \"pipeline\", \"steps\": [\"build\", \"test\", \"deploy\"]}\n```\n\n### GET /api/workflows\nList all workflows.\n\n### GET /api/workflows/runs\nList all workflow runs.\n\n### GET /api/workflows/runs/{run_id}\nGet run details.\n\n### GET /api/workflows/{id}\nGet workflow details.\n\n### POST /api/workflows/{id}/run\nExecute a workflow.\n\n```json\n// Request\n{\"input\": {\"env\": \"staging\"}}\n\n// Response\n{\"id\": \"run123\", \"status\": \"completed\", \"output\": {\"message\": \"Workflow 'deploy-pipeline' executed successfully\"}}\n```\n\n### GET /api/workflows/{id}/status\nGet workflow status (total runs, last run).\n\n### DELETE /api/workflows/{id}\nDelete workflow.\n\n---\n\n## Config Runtime\n\n### GET /api/config/runtime\nGet all runtime config.\n\n### PATCH /api/config/runtime\nMerge config values.\n\n```json\n// Request\n{\"model\": \"gpt-4o\", \"temperature\": \"0.7\"}\n\n// Response\n{\"config\": {\"model\": \"gpt-4o\", \"temperature\": \"0.7\"}, \"applied\": 2}\n```\n\n### PUT /api/config/runtime\nReplace entire config.\n\n### GET /api/config/runtime/history\nConfig change history. Query: `?limit=50`\n\n### GET /api/config/runtime/{key}\nGet single config key.\n\n### PUT /api/config/runtime/{key}\nSet single config key.\n\n```json\n// Request\n{\"value\": \"0.9\"}\n```\n\n### DELETE /api/config/runtime/{key}\nDelete config key.\n\n### GET /api/config/schema\nJSON Schema for schema-driven form rendering.\n\n```json\n// Response\n{\"sections\": {\"provider\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\", \"enum\": [\"openai\", \"anthropic\", \"google\"]}}}, ...}}\n```\n\n### POST /api/config/validate\nValidate config without applying.\n\n```json\n// Request\n{\"provider\": \"openai\", \"model\": \"gpt-4o\"}\n\n// Response\n{\"valid\": true, \"errors\": []}\n```\n\n### POST /api/config/apply\nValidate and apply config changes.\n\n### GET /api/config/defaults\nGet default values from schema.\n\n---\n\n## Agents\n\nAgent definition CRUD with model selection, system prompts, and duplication.\n\n### GET /api/agents/definitions\nList all agent definitions.\n\n```json\n// Response\n{\"agents\": [{\"id\": \"agent_abc\", \"name\": \"Research Assistant\", \"model\": \"gpt-4o\", \"icon\": \"🔬\", \"status\": \"active\"}], \"count\": 1}\n```\n\n### POST /api/agents/definitions\nCreate a new agent.\n\n```json\n// Request\n{\"name\": \"Research Assistant\", \"description\": \"Helps with research\", \"model\": \"gpt-4o\", \"temperature\": 0.7, \"system_prompt\": \"You are...\", \"instructions\": \"...\", \"tools\": [], \"icon\": \"🔬\"}\n\n// Response (201)\n{\"id\": \"agent_abc\", \"name\": \"Research Assistant\", \"model\": \"gpt-4o\", \"status\": \"active\", \"created_at\": 1709000000.0}\n```\n\n### GET /api/agents/definitions/{id}\nGet agent details.\n\n### PUT /api/agents/definitions/{id}\nUpdate agent. Body fields: `name`, `description`, `model`, `temperature`, `system_prompt`, `instructions`, `tools`, `icon`.\n\n### DELETE /api/agents/definitions/{id}\nDelete agent.\n\n### GET /api/agents/models\nList available models (13 models across OpenAI, Anthropic, Google).\n\n```json\n// Response\n{\"models\": [{\"id\": \"gpt-4o\", \"name\": \"GPT-4o\", \"provider\": \"openai\"}, ...], \"count\": 13}\n```\n\n### POST /api/agents/run/{id}\nExecute an agent via `praisonaiagents.Agent.start()`.\n\n```json\n// Request\n{\"prompt\": \"Research the latest AI trends\"}\n\n// Response\n{\"result\": \"...\", \"model\": \"gpt-4o\", \"agent_id\": \"agent_abc\"}\n```\n\n### POST /api/agents/duplicate/{id}\nDuplicate an existing agent.\n\n```json\n// Response (201)\n{\"id\": \"agent_xyz\", \"name\": \"Research Assistant (copy)\", \"model\": \"gpt-4o\", \"status\": \"active\"}\n```\n\n---\n\n## OpenAI-Compatible API\n\nDrop-in replacement for OpenAI SDK. Use `base_url=\"http://localhost:8000/v1\"`.\n\n### GET /v1\nAPI info with available endpoint list.\n\n### POST /v1/chat/completions\nChat completions (OpenAI-compatible).\n\n```json\n// Request\n{\"model\": \"gpt-4o-mini\", \"messages\": [{\"role\": \"user\", \"content\": \"Hello!\"}]}\n\n// Response\n{\"id\": \"chatcmpl-xxx\", \"object\": \"chat.completion\", \"model\": \"gpt-4o-mini\", \"choices\": [{\"message\": {\"role\": \"assistant\", \"content\": \"...\"}}]}\n```\n\n### POST /v1/completions\nLegacy text completions.\n\n### POST /v1/embeddings\nCreate embeddings.\n\n```json\n// Request\n{\"model\": \"text-embedding-3-small\", \"input\": \"Hello world\"}\n```\n\n### POST /v1/images/generations\nGenerate images (DALL-E).\n\n### POST /v1/audio/transcriptions\nTranscribe audio (Whisper).\n\n### POST /v1/audio/speech\nText to speech.\n\n### POST /v1/moderations\nContent moderation.\n\n### GET /v1/models\nList available models (13 models).\n\n### GET /v1/models/{id}\nGet model info.\n\n### POST /v1/responses\nOpenAI Responses API.\n\n### GET/POST /v1/files\nFile management.\n\n### GET/DELETE /v1/files/{id}\nFile operations.\n\n### GET/POST /v1/assistants\nAssistants API.\n\n---\n\n## Logs\n\nReal-time log streaming via WebSocket. Every logs route reads one in-memory\nbuffer (500 entries), so a clear empties what `GET /api/logs` returns too.\n\n### GET /api/logs\nRecent entries, newest last. Query: `?level=ERROR`, `?limit=100`.\n\n```json\n{\"logs\": [{\"timestamp\": \"...\", \"level\": \"ERROR\", \"logger\": \"...\", \"message\": \"...\"}], \"total\": 42}\n```\n\n### WS /api/logs/stream\nWebSocket for real-time log streaming. Query: `?level=INFO`, `?search=agent`\n\n```json\n// Messages received\n{\"type\": \"initial\", \"data\": [...], \"total\": 100}\n{\"type\": \"log\", \"data\": {\"timestamp\": \"...\", \"level\": \"INFO\", \"logger\": \"...\", \"message\": \"...\"}}\n\n// Send filter update\n{\"type\": \"filter\", \"level\": \"ERROR\", \"search\": \"error\"}\n```\n\n### GET /api/logs/levels\nAvailable log levels with colors.\n\n```json\n// Response\n{\"levels\": [{\"name\": \"DEBUG\", \"color\": \"#6b7280\", \"priority\": 10}, {\"name\": \"INFO\", \"color\": \"#3b82f6\", \"priority\": 20}, ...]}\n```\n\n### GET /api/logs/stats\nLog buffer statistics.\n\n### POST /api/logs/clear\nClear the log buffer.\n\n---\n\n## Auth\n\nMulti-mode authentication (none, api_key, session, password).\n\n### GET /api/auth/status\nCheck current auth status.\n\n```json\n// Response\n{\"authenticated\": true, \"mode\": \"api_key\", \"user\": \"admin\"}\n```\n\n### GET /api/auth/config\nGet auth configuration.\n\n```json\n// Response\n{\"mode\": \"api_key\", \"session_timeout_hours\": 24, \"max_api_keys\": 10}\n```\n\n### PUT /api/auth/config\nSet auth configuration. Body: `{\"mode\": \"session\", \"session_timeout_hours\": 48}`\n\n### GET /api/auth/keys\nList API keys.\n\n### POST /api/auth/keys\nCreate API key.\n\n```json\n// Request\n{\"name\": \"CI/CD Key\", \"expires_days\": 90}\n\n// Response (201)\n{\"id\": \"key_abc\", \"name\": \"CI/CD Key\", \"key\": \"sk-xxx\", \"created_at\": 1709000000.0}\n```\n\n### DELETE /api/auth/keys/{id}\nRevoke API key.\n\n### POST /api/auth/login\nLogin with password.\n\n```json\n// Request\n{\"password\": \"...\"}\n\n// Response\n{\"token\": \"sess_xxx\", \"expires_at\": 1709086400.0}\n```\n\n### POST /api/auth/logout\nLogout current session.\n\n### GET /api/auth/sessions\nList active sessions.\n\n### POST /api/auth/password\nSet or change password.\n\n---\n\n## TTS (Text-to-Speech)\n\n### GET /api/tts/voices\nList available voices.\n\n```json\n// Response\n{\"voices\": [\n    {\"id\": \"default\", \"name\": \"Default\", \"lang\": \"en-US\"},\n    {\"id\": \"google-us\", \"name\": \"Google US English\", \"lang\": \"en-US\"},\n    {\"id\": \"google-uk\", \"name\": \"Google UK English\", \"lang\": \"en-GB\"}\n], \"count\": 3}\n```\n\n### POST /api/tts/synthesize\nSynthesize speech from text.\n\n```json\n// Request\n{\"text\": \"Hello from PraisonAI\", \"voice\": \"default\"}\n\n// Response (browser)\n{\"type\": \"browser_speech\", \"text\": \"Hello from PraisonAI\", \"voice\": \"default\",\n \"instruction\": \"Use window.speechSynthesis.speak(new SpeechSynthesisUtterance(text))\"}\n```\n\n---\n\n## Marketplace\n\nPlugin discovery, search, install, and management.\n\n### GET /api/marketplace/plugins\nList all available plugins.\n\n```json\n// Response\n{\"plugins\": [\n    {\"id\": \"web_search\", \"name\": \"Web Search\", \"category\": \"tools\", \"version\": \"1.0.0\", \"installed\": false},\n    {\"id\": \"code_executor\", \"name\": \"Code Executor\", \"category\": \"tools\", \"version\": \"1.0.0\", \"installed\": false},\n    {\"id\": \"file_manager\", \"name\": \"File Manager\", \"category\": \"tools\", \"version\": \"1.0.0\", \"installed\": false},\n    {\"id\": \"memory_plugin\", \"name\": \"Memory Plugin\", \"category\": \"memory\", \"version\": \"1.0.0\", \"installed\": false}\n], \"count\": 4}\n```\n\n### POST /api/marketplace/search\nSearch plugins by query.\n\n```json\n// Request\n{\"query\": \"search\", \"limit\": 20}\n\n// Response\n{\"results\": [{\"id\": \"web_search\", \"name\": \"Web Search\", ...}], \"count\": 1}\n```\n\n### POST /api/marketplace/install\nInstall a plugin.\n\n```json\n// Request\n{\"plugin_id\": \"web_search\"}\n\n// Response\n{\"status\": \"installed\", \"plugin\": \"web_search\"}\n```\n\n### POST /api/marketplace/uninstall\nUninstall a plugin.\n\n```json\n// Request\n{\"plugin_id\": \"web_search\"}\n\n// Response\n{\"status\": \"uninstalled\", \"plugin\": \"web_search\"}\n```\n\n### GET /api/marketplace/plugins/{id}\nGet plugin details.\n\n```json\n// Response\n{\"id\": \"web_search\", \"name\": \"Web Search\", \"category\": \"tools\",\n \"version\": \"1.0.0\", \"description\": \"Search the web using DuckDuckGo\", \"installed\": true}\n```\n\n---\n\n## Code Execution\n\nSandboxed code execution with language allowlists.\n\n### GET /api/code/languages\nList supported languages.\n\n```json\n// Response\n{\"languages\": [\n    {\"id\": \"python\", \"name\": \"Python\", \"version\": \"3.x\"},\n    {\"id\": \"javascript\", \"name\": \"JavaScript\", \"version\": \"ES2020\"},\n    {\"id\": \"bash\", \"name\": \"Bash\", \"version\": \"5.x\"}\n], \"count\": 3}\n```\n\n### POST /api/code/execute\nExecute Python code in the SDK sandbox after a human approves it. The request waits while a pending `execute_code` approval (risk `critical`) sits in `/api/approvals/pending`; see [Code Execution](../features/code-execution.md) for the opt-outs.\n\n```json\n// Request\n{\"code\": \"print('hello')\", \"language\": \"python\", \"timeout\": 30}\n\n// Response (approved → 200)\n{\"language\": \"python\", \"status\": \"success\", \"output\": \"hello\\n\", \"error\": \"\",\n \"result\": null, \"sandbox\": true}\n\n// Response (denied or approval timed out → 403)\n{\"status\": \"denied\", \"language\": \"python\", \"error\": \"Not run: ...\"}\n\n// Response (praisonaiagents not installed → 503, nothing runs)\n{\"language\": \"python\", \"status\": \"degraded\", \"error\": \"Code execution needs the praisonaiagents package ...\", \"sandbox\": true}\n\n// Response (disallowed language → 400)\n{\"status\": \"error\", \"error\": \"Language 'ruby' not allowed\",\n \"allowed\": [\"python\", \"bash\", \"javascript\"]}\n```\n\n---\n\n## PWA\n\nProgressive Web App support — manifest, service worker, and installability.\n\n### GET /manifest.json\nWeb Application Manifest for installability.\n\n```json\n// Response\n{\"name\": \"PraisonAI\", \"short_name\": \"AI\", \"start_url\": \"/\",\n \"display\": \"standalone\", \"theme_color\": \"#1a1a2e\", \"background_color\": \"#16213e\",\n \"icons\": [{\"src\": \"/api/pwa/icon/192\", \"sizes\": \"192x192\", \"type\": \"image/png\"}, ...],\n \"orientation\": \"portrait-primary\", \"scope\": \"/\"}\n```\n\n### GET /sw.js\nService Worker JavaScript with cache-first strategy.\n\n### GET /api/pwa/config\nPWA configuration details.\n\n```json\n// Response\n{\"manifest\": {...}, \"has_sw\": true}\n```\n\n---\n\n## i18n\n\nInternationalization with locale switching and string lookup.\n\n### GET /api/i18n/locales\nList available locales.\n\n```json\n// Response\n{\"locales\": [\n    {\"code\": \"en\", \"name\": \"English\", \"native\": \"English\"},\n    {\"code\": \"es\", \"name\": \"Spanish\", \"native\": \"Español\"},\n    {\"code\": \"fr\", \"name\": \"French\", \"native\": \"Français\"}\n], \"count\": 3}\n```\n\n### GET /api/i18n/strings/{locale}\nGet all strings for a locale.\n\n```json\n// Response\n{\"locale\": \"es\", \"strings\": {\n    \"app.title\": \"PraisonAI\", \"app.welcome\": \"Bienvenido a PraisonAI\",\n    \"chat.send\": \"Enviar\", \"nav.dashboard\": \"Panel\", ...\n}, \"count\": 11}\n```\n\n### POST /api/i18n/translate\nTranslate a key with optional variables.\n\n```json\n// Request\n{\"key\": \"app.welcome\", \"locale\": \"fr\"}\n\n// Response\n{\"key\": \"app.welcome\", \"text\": \"Bienvenue sur PraisonAI\"}\n```\n\n### GET /api/i18n/locale\nGet current default locale.\n\n```json\n// Response\n{\"locale\": \"en\"}\n```\n\n### POST /api/i18n/locale\nSet default locale.\n\n```json\n// Request\n{\"locale\": \"fr\"}\n\n// Response\n{\"locale\": \"fr\"}\n```\n\n---\n\n## Device Pairing\n\nPair devices to sessions using short hex codes.\n\n### POST /api/pairing/create\nGenerate a pairing code.\n\n```json\n// Request\n{\"session_id\": \"my-session\"}\n\n// Response (201)\n{\"code\": \"723BE2\", \"session_id\": \"my-session\",\n \"created_at\": 1772834103.42, \"expires_at\": 1772834403.42, \"used\": false}\n```\n\n### POST /api/pairing/validate\nValidate and consume a pairing code.\n\n```json\n// Request\n{\"code\": \"723BE2\"}\n\n// Response (valid)\n{\"valid\": true, \"device_id\": \"f408fdebd954d8da\", \"session_id\": \"my-session\"}\n\n// Response (reused → 400)\n{\"valid\": false, \"error\": \"Code already used\"}\n\n// Response (expired → 400)\n{\"valid\": false, \"error\": \"Code expired\"}\n```\n\n### GET /api/pairing/devices\nList paired devices. Query: `?session_id=my-session`\n\n```json\n// Response\n{\"devices\": [{\"device_id\": \"f408fdebd954d8da\", \"session_id\": \"my-session\",\n  \"paired_at\": 1772834103.56, \"user_agent\": \"unknown\"}], \"count\": 1}\n```\n\n### DELETE /api/pairing/devices/{id}\nRemove a paired device.\n\n```json\n// Response\n{\"deleted\": \"f408fdebd954d8da\"}\n\n// Response (not found → 404)\n{\"error\": \"Device not found\"}\n```\n\n---\n\n## Media Analysis\n\nImage understanding, OCR, and object detection via VisionAgent.\n\n### GET /api/media/capabilities\nList analysis capabilities.\n\n```json\n// Response\n{\"capabilities\": [\"image_description\", \"ocr\", \"object_detection\", \"image_qa\"], \"count\": 4}\n```\n\n### POST /api/media/analyze\nAnalyze an image.\n\n```json\n// Request\n{\"url\": \"https://example.com/photo.jpg\", \"prompt\": \"What is in this image?\"}\n// or\n{\"base64_data\": \"iVBORw0KGgo...\", \"mime_type\": \"image/png\"}\n\n// Response (SDK available)\n{\"analysis\": \"The image shows a sunset...\", \"status\": \"success\", \"provider\": \"sdk\"}\n\n// Response (simulated)\n{\"analysis\": \"[Simulated] Image analysis for: ...\",\n \"status\": \"simulated\", \"provider\": \"fallback\",\n \"note\": \"Install praisonaiagents for real analysis\"}\n\n// Response (no image → 400)\n{\"error\": \"No image provided\", \"status\": \"error\"}\n```\n\n### POST /api/media/ocr\nExtract text from an image.\n\n```json\n// Request\n{\"url\": \"https://example.com/document.png\"}\n\n// Response\n{\"text\": \"Extracted text from the document...\", \"status\": \"success\", \"provider\": \"sdk\"}\n```\n\n---\n\n## Guardrails\n\nInput/output safety guardrails — validation rules, violation tracking, and registration.\n\n### GET /api/guardrails\nList all registered guardrails.\n\n```json\n// Response\n{\"guardrails\": [], \"total\": 0, \"gateway_connected\": true}\n```\n\n### GET /api/guardrails/status\nGuardrails feature health.\n\n```json\n// Response\n{\"status\": \"ok\", \"feature\": \"guardrails\", \"gateway_connected\": true, \"gateway_agent_count\": 2}\n```\n\n### GET /api/guardrails/violations\nList guardrail violations.\n\n```json\n// Response\n{\"violations\": [], \"total\": 0, \"time_window\": \"24h\"}\n```\n\n### POST /api/guardrails/register\nRegister a guardrail rule.\n\n```json\n// Request\n{\"name\": \"no-pii\", \"type\": \"output\", \"pattern\": \"\\\\b\\\\d{3}-\\\\d{2}-\\\\d{4}\\\\b\", \"action\": \"block\"}\n\n// Response (201)\n{\"id\": \"gr_abc\", \"name\": \"no-pii\", \"type\": \"output\", \"status\": \"active\"}\n```\n\n---\n\n## Eval\n\nAgent evaluation — accuracy scoring, judge models, and evaluation runs.\n\n### GET /api/eval\nOverview of evaluation state.\n\n```json\n// Response\n{\"evaluations\": [], \"total\": 0, \"gateway_connected\": true}\n```\n\n### GET /api/eval/status\nEval feature health.\n\n```json\n// Response\n{\"status\": \"ok\", \"feature\": \"eval\", \"gateway_connected\": true, \"gateway_agent_count\": 2}\n```\n\n### GET /api/eval/scores\nGet evaluation scores.\n\n```json\n// Response\n{\"scores\": [], \"total\": 0, \"avg_score\": null}\n```\n\n### GET /api/eval/judges\nList configured judge models.\n\n```json\n// Response\n{\"judges\": [\"gpt-4o\", \"claude-3-5-sonnet\"], \"total\": 2}\n```\n\n### POST /api/eval/run\nRun an evaluation.\n\n```json\n// Request\n{\"agent_name\": \"assistant\", \"test_cases\": [{\"input\": \"What is 2+2?\", \"expected\": \"4\"}]}\n\n// Response\n{\"run_id\": \"eval_abc\", \"status\": \"completed\", \"scores\": [{\"accuracy\": 1.0}]}\n```\n\n---\n\n## Telemetry\n\nPerformance monitoring — metrics collection, performance stats, and profiling.\n\n### GET /api/telemetry\nTelemetry overview.\n\n```json\n// Response\n{\"metrics\": [], \"total\": 0, \"collection_active\": true, \"gateway_connected\": true}\n```\n\n### GET /api/telemetry/status\nTelemetry feature health.\n\n```json\n// Response\n{\"status\": \"ok\", \"feature\": \"telemetry\", \"gateway_connected\": true, \"gateway_agent_count\": 2}\n```\n\n### GET /api/telemetry/metrics\nGet collected metrics.\n\n```json\n// Response\n{\"metrics\": [], \"total\": 0, \"types\": [\"counter\", \"gauge\", \"histogram\"]}\n```\n\n### GET /api/telemetry/performance\nGet performance statistics.\n\n```json\n// Response\n{\"performance\": {\"avg_response_time_ms\": null, \"p95_response_time_ms\": null, \"total_requests\": 0}}\n```\n\n### GET /api/telemetry/profiling\nGet profiling data.\n\n```json\n// Response\n{\"profiles\": [], \"total\": 0, \"profiling_enabled\": false}\n```\n\n### POST /api/telemetry/record\nRecord a telemetry event.\n\n```json\n// Request\n{\"metric\": \"response_time\", \"value\": 150, \"tags\": {\"agent\": \"assistant\"}}\n\n// Response (201)\n{\"id\": \"tel_abc\", \"metric\": \"response_time\", \"recorded_at\": 1709000000.0}\n```\n\n---\n\n## Traces\n\nDistributed tracing and observability — span recording, trace lookup, and span details.\n\n### GET /api/traces\nList recent traces.\n\n```json\n// Response\n{\"traces\": [], \"total\": 0, \"gateway_connected\": true}\n```\n\n### GET /api/traces/status\nTracing feature health.\n\n```json\n// Response\n{\"status\": \"ok\", \"feature\": \"tracing\", \"gateway_connected\": true, \"gateway_agent_count\": 2}\n```\n\n### GET /api/traces/spans\nList trace spans.\n\n```json\n// Response\n{\"spans\": [], \"total\": 0, \"filters\": [\"agent_name\", \"status\", \"duration\"]}\n```\n\n### POST /api/traces/record\nRecord a trace span.\n\n```json\n// Request\n{\"trace_id\": \"tr_abc\", \"span_name\": \"agent.chat\", \"duration_ms\": 250, \"status\": \"ok\"}\n\n// Response (201)\n{\"id\": \"span_abc\", \"trace_id\": \"tr_abc\", \"recorded_at\": 1709000000.0}\n```\n\n### GET /api/traces/{trace_id}\nGet full trace details.\n\n```json\n// Response\n{\"trace_id\": \"tr_abc\", \"spans\": [{\"id\": \"span_abc\", \"name\": \"agent.chat\", \"duration_ms\": 250}], \"total_duration_ms\": 250}\n```\n\n---\n\n## Security\n\nSecurity monitoring — audit logging, configuration review, and access control.\n\n### GET /api/security\nSecurity overview.\n\n```json\n// Response\n{\"audit_events\": [], \"total\": 0, \"security_level\": \"standard\", \"gateway_connected\": true}\n```\n\n### GET /api/security/status\nSecurity feature health.\n\n```json\n// Response\n{\"status\": \"ok\", \"feature\": \"security\", \"gateway_connected\": true, \"gateway_agent_count\": 2}\n```\n\n### GET /api/security/audit\nGet audit log entries.\n\n```json\n// Response\n{\"events\": [], \"total\": 0, \"filters\": [\"severity\", \"actor\", \"action\", \"timestamp\"]}\n```\n\n### GET /api/security/config\nGet security configuration.\n\n```json\n// Response\n{\"config\": {\"auth_mode\": \"none\", \"rate_limiting\": false, \"cors_origins\": [\"*\"]}, \"recommendations\": []}\n"}</script>
