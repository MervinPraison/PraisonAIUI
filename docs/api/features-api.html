-host">Agent UI host — modular dashboard shell</a></li><li><a href="https://ui.praison.ai/docs/features/attachments">Chat Attachments</a></li><li><a href="https://ui.praison.ai/docs/features/backend-integration">Backend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/browser-automation">Browser Automation</a></li><li><a href="https://ui.praison.ai/docs/features/channel-chat-bridge">Channel-to-Chat Bridge</a></li><li><a href="https://ui.praison.ai/docs/features/code-execution">Code Execution</a></li><li><a href="https://ui.praison.ai/docs/features/comparison-openclaw">Feature Comparison: PraisonAIUI vs OpenClaw</a></li><li><a href="https://ui.praison.ai/docs/features/config-hot-reload">Config Hot-Reload</a></li><li><a href="https://ui.praison.ai/docs/features/content-sources">Content Sources</a></li><li><a href="https://ui.praison.ai/docs/features/css-architecture">How the UI Looks Are Built</a></li><li><a href="https://ui.praison.ai/docs/features/dark-mode">Dark Mode</a></li><li><a href="https://ui.praison.ai/docs/features/dashboard">Dashboard</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/features/device-pairing">Device Pairing</a></li><li><a href="https://ui.praison.ai/docs/features/differentiation">What Makes PraisonAIUI Different</a></li><li><a href="https://ui.praison.ai/docs/features/feature-inventory">Feature Inventory</a></li><li><a href="https://ui.praison.ai/docs/features/gap-analysis">Gap Analysis — Validated Against praisonai SDK</a></li><li><a href="https://ui.praison.ai/docs/features/gateway-chat">Gateway Chat</a></li><li><a href="https://ui.praison.ai/docs/features/hot-reload">Hot Reload</a></li><li><a href="https://ui.praison.ai/docs/features/how-to-add-a-feature">How to Add a Feature to PraisonAIUI</a></li><li><a href="https://ui.praison.ai/docs/features/i18n">Internationalization (i18n)</a></li><li><a href="https://ui.praison.ai/docs <p>Complete API reference for all <strong>36</strong> PraisonAIUI feature protocol endpoints.</p>
<h2>Feature Registry</h2>
<h3>GET /api/features</h3>
<p>List all registered features with health status.</p>
<p><strong>Response:</strong></p>
<h2>Channels</h2>
<h3>GET /api/channels</h3>
<p>List all configured channels with live gateway status.</p>
<h3>POST /api/channels</h3>
<p>Add a channel.</p>
<h3>GET /api/channels/platforms</h3>
<p>List supported platforms.</p>
<h3>GET /api/channels/{id}</h3>
<p>Get channel details.</p>
<h3>PUT /api/channels/{id}</h3>
<p>Update channel configuration. Body fields: <code>name</code>, <code>platform</code>, <code>enabled</code>, <code>config</code>.</p>
<h3>DELETE /api/channels/{id}</h3>
<p>Remove a channel.</p>
<h3>POST /api/channels/{id}/toggle</h3>
<p>Toggle channel enabled/disabled.</p>
<h3>GET /api/channels/{id}/status</h3>
<p>Get live channel status (enriched via gateway).</p>
<h3>POST /api/channels/{id}/restart</h3>
<p>Restart a channel bot via the gateway. Returns status of restart attempt.</p>
<p>---</p>
<h2>Schedules</h2>
<h3>POST /api/schedules</h3>
<p>Add a scheduled job.</p>
<h3>GET /api/schedules</h3>
<p>List all scheduled jobs.</p>
<h3>GET /api/schedules/{id}</h3>
<p>Get job details.</p>
<h3>PUT /api/schedules/{id}</h3>
<p>Update schedule configuration. Body fields: <code>name</code>, <code>message</code>, <code>schedule</code>, <code>enabled</code>.</p>
<h3>DELETE /api/schedules/{id}</h3>
<p>Remove a job.</p>
<h3>POST /api/schedules/{id}/toggle</h3>
<p>Toggle job enabled/disabled.</p>
<h3>POST /api/schedules/{id}/run</h3>
<p>Trigger job immediately.</p>
<h3>POST /api/schedules/{id}/stop</h3>
<p>Stop a running scheduled job. Attempts to cancel via <code>AgentScheduler</code> if available.</p>
<h3>GET /api/schedules/{id}/stats</h3>
<p>Get execution statistics for a schedule.</p>
<p>---</p>
<h2>Jobs</h2>
<h3>POST /api/jobs</h3>
<p>Submit a new async job. Returns 202 Accepted.</p>
<h3>GET /api/jobs</h3>
<p>List jobs with optional filters. Query: <code>?status=running</code>, <code>?limit=50</code>, <code>?offset=0</code></p>
<h3>GET /api/jobs/stats</h3>
<p>Get executor statistics.</p>
<h3>GET /api/jobs/{id}</h3>
<p>Get full job details.</p>
<h3>GET /api/jobs/{id}/status</h3>
<p>Get job status with progress info.</p>
<h3>GET /api/jobs/{id}/result</h3>
<p>Get job result. Returns 409 if not yet complete.</p>
<h3>POST /api/jobs/{id}/cancel</h3>
<p>Cancel a running or queued job. Returns 409 if already complete.</p>
<h3>DELETE /api/jobs/{id}</h3>
<p>Delete a completed job. Returns 409 if still running.</p>
<h3>GET /api/jobs/{id}/stream</h3>
<p>SSE stream for real-time job updates. Events: <code>status</code>, <code>progress</code>, <code>result</code>, <code>error</code>, <code>done</code>.</p>
<p>---</p>
<h2>Usage</h2>
<h3>GET /api/usage</h3>
<p>Usage summary with totals and averages.</p>
<h3>POST /api/usage/track</h3>
<p>Track a usage event.</p>
<h3>GET /api/usage/details</h3>
<p>Detailed usage records. Query: <code>?limit=100</code>, <code>?offset=0</code></p>
<h3>GET /api/usage/models</h3>
<p>Per-model breakdown (tokens, cost, request count).</p>
<h3>GET /api/usage/sessions</h3>
<p>Per-session breakdown.</p>
<h3>GET /api/usage/agents</h3>
<p>Per-agent breakdown.</p>
<h3>GET /api/usage/timeseries</h3>
<p>Time-series data for charts. Query: <code>?hours=24</code>, <code>?bucket_minutes=60</code></p>
<h3>GET /api/usage/costs</h3>
<p>Get the model cost table (per-1K token rates for 21 models).</p>
<p>---</p>
<h2>Memory</h2>
<h3>POST /api/memory</h3>
<p>Add a memory entry.</p>
<h3>POST /api/memory/search</h3>
<p>Search memories.</p>
<h3>GET /api/memory</h3>
<p>List all memories. Query: <code>?type=short|long|entity|all</code></p>
<h3>GET /api/memory/{id}</h3>
<p>Get single memory.</p>
<h3>DELETE /api/memory/{id}</h3>
<p>Delete single memory.</p>
<h3>DELETE /api/memory</h3>
<p>Clear memories. Query: <code>?type=all</code></p>
<h3>POST /api/memory/context</h3>
<p>Get memory context for prompt injection.</p>
<p>---</p>
<h2>Extended Sessions</h2>
<h3>GET /api/sessions/{session_id}/state</h3>
<p>Get session state.</p>
<h3>POST /api/sessions/{session_id}/state</h3>
<p>Save session state.</p>
<h3>POST /api/sessions/{session_id}/context</h3>
<p>Build context from session state + memory.</p>
<h3>POST /api/sessions/{session_id}/compact</h3>
<p>Compact session data. Returns before/after stats.</p>
<h3>POST /api/sessions/{session_id}/reset</h3>
<p>Reset session. Body: <code>{"mode": "clear"}</code></p>
<h3>GET /api/sessions/{session_id}/preview</h3>
<p>Formatted session preview without full history.</p>
<h3>GET/POST /api/sessions/{session_id}/labels</h3>
<p>Get or set session labels.</p>
<h3>GET /api/sessions/{session_id}/usage</h3>
<p>Get session usage statistics.</p>
<p>---</p>
<h2>Skills</h2>
<p>Tool catalog with 18 built-in tools across 7 categories (search, crawl, file, code, shell, skills, schedule).</p>
<h3>GET /api/skills</h3>
<p>List all tools. Query: <code>?category=search</code>, <code>?enabled=true</code>, <code>?search=web</code></p>
<h3>GET /api/skills/categories</h3>
<p>List tool categories.</p>
<h3>POST /api/skills</h3>
<p>Register a custom skill.</p>
<h3>GET /api/skills/{id}</h3>
<p>Get tool details including required API keys.</p>
<h3>PUT /api/skills/{id}</h3>
<p>Update a custom skill.</p>
<h3>DELETE /api/skills/{id}</h3>
<p>Remove a custom skill (builtin tools cannot be deleted).</p>
<h3>POST /api/skills/{id}/toggle</h3>
<p>Toggle tool enabled/disabled.</p>
<h3>PUT /api/skills/{id}/config</h3>
<p>Set tool configuration or API keys.</p>
<p>---</p>
<h2>Hooks</h2>
<h3>POST /api/hooks</h3>
<p>Register a hook.</p>
<h3>GET /api/hooks</h3>
<p>List all hooks.</p>
<h3>GET /api/hooks/log</h3>
<p>View hook execution log. Query: <code>?limit=20</code></p>
<h3>GET /api/hooks/{id}</h3>
<p>Get hook details.</p>
<h3>POST /api/hooks/{id}/trigger</h3>
<p>Trigger a hook manually.</p>
<h3>DELETE /api/hooks/{id}</h3>
<p>Remove hook.</p>
<p>---</p>
<h2>Workflows</h2>
<h3>POST /api/workflows</h3>
<p>Create a workflow.</p>
<h3>GET /api/workflows</h3>
<p>List all workflows.</p>
<h3>GET /api/workflows/runs</h3>
<p>List all workflow runs.</p>
<h3>GET /api/workflows/runs/{run_id}</h3>
<p>Get run details.</p>
<h3>GET /api/workflows/{id}</h3>
<p>Get workflow details.</p>
<h3>POST /api/workflows/{id}/run</h3>
<p>Execute a workflow.</p>
<h3>GET /api/workflows/{id}/status</h3>
<p>Get workflow status (total runs, last run).</p>
<h3>DELETE /api/workflows/{id}</h3>
<p>Delete workflow.</p>
<p>---</p>
<h2>Config Runtime</h2>
<h3>GET /api/config/runtime</h3>
<p>Get all runtime config.</p>
<h3>PATCH /api/config/runtime</h3>
<p>Merge config values.</p>
<h3>PUT /api/config/runtime</h3>
<p>Replace entire config.</p>
<h3>GET /api/config/runtime/history</h3>
<p>Config change history. Query: <code>?limit=50</code></p>
<h3>GET /api/config/runtime/{key}</h3>
<p>Get single config key.</p>
<h3>PUT /api/config/runtime/{key}</h3>
<p>Set single config key.</p>
<h3>DELETE /api/config/runtime/{key}</h3>
<p>Delete config key.</p>
<h3>GET /api/config/schema</h3>
<p>JSON Schema for schema-driven form rendering.</p>
<h3>POST /api/config/validate</h3>
<p>Validate config without applying.</p>
<h3>POST /api/config/apply</h3>
<p>Validate and apply config changes.</p>
<h3>GET /api/config/defaults</h3>
<p>Get default values from schema.</p>
<p>---</p>
<h2>Agents</h2>
<p>Agent definition CRUD with model selection, system prompts, and duplication.</p>
<h3>GET /api/agents/definitions</h3>
<p>List all agent definitions.</p>
<h3>POST /api/agents/definitions</h3>
<p>Create a new agent.</p>
<h3>GET /api/agents/definitions/{id}</h3>
<p>Get agent details.</p>
<h3>PUT /api/agents/definitions/{id}</h3>
<p>Update agent. Body fields: <code>name</code>, <code>description</code>, <code>model</code>, <code>temperature</code>, <code>system_prompt</code>, <code>instructions</code>, <code>tools</code>, <code>icon</code>.</p>
<h3>DELETE /api/agents/definitions/{id}</h3>
<p>Delete agent.</p>
<h3>GET /api/agents/models</h3>
<p>List available models (13 models across OpenAI, Anthropic, Google).</p>
<h3>POST /api/agents/run/{id}</h3>
<p>Execute an agent via <code>praisonaiagents.Agent.start()</code>.</p>
<h3>POST /api/agents/duplicate/{id}</h3>
<p>Duplicate an existing agent.</p>
<p>---</p>
<h2>OpenAI-Compatible API</h2>
<p>Drop-in replacement for OpenAI SDK. Use <code>base_url="http://localhost:8000/v1"</code>.</p>
<h3>GET /v1</h3>
<p>API info with available endpoint list.</p>
<h3>POST /v1/chat/completions</h3>
<p>Chat completions (OpenAI-compatible).</p>
<h3>POST /v1/completions</h3>
<p>Legacy text completions.</p>
<h3>POST /v1/embeddings</h3>
<p>Create embeddings.</p>
<h3>POST /v1/images/generations</h3>
<p>Generate images (DALL-E).</p>
<h3>POST /v1/audio/transcriptions</h3>
<p>Transcribe audio (Whisper).</p>
<h3>POST /v1/audio/speech</h3>
<p>Text to speech.</p>
<h3>POST /v1/moderations</h3>
<p>Content moderation.</p>
<h3>GET /v1/models</h3>
<p>List available models (13 models).</p>
<h3>GET /v1/models/{id}</h3>
<p>Get model info.</p>
<h3>POST /v1/responses</h3>
<p>OpenAI Responses API.</p>
<h3>GET/POST /v1/files</h3>
<p>File management.</p>
<h3>GET/DELETE /v1/files/{id}</h3>
<p>File operations.</p>
<h3>GET/POST /v1/assistants</h3>
<p>Assistants API.</p>
<p>---</p>
<h2>Logs</h2>
<p>Real-time log streaming via WebSocket.</p>
<h3>WS /api/logs/stream</h3>
<p>WebSocket for real-time log streaming. Query: <code>?level=INFO</code>, <code>?search=agent</code></p>
<h3>GET /api/logs/levels</h3>
<p>Available log levels with colors.</p>
<h3>GET /api/logs/stats</h3>
<p>Log buffer statistics.</p>
<h3>POST /api/logs/clear</h3>
<p>Clear the log buffer.</p>
<p>---</p>
<h2>Auth</h2>
<p>Multi-mode authentication (none, api_key, session, password).</p>
<h3>GET /api/auth/status</h3>
<p>Check current auth status.</p>
<h3>GET /api/auth/config</h3>
<p>Get auth configuration.</p>
<h3>PUT /api/auth/config</h3>
<p>Set auth configuration. Body: <code>{"mode": "session", "session_timeout_hours": 48}</code></p>
<h3>GET /api/auth/keys</h3>
<p>List API keys.</p>
<h3>POST /api/auth/keys</h3>
<p>Create API key.</p>
<h3>DELETE /api/auth/keys/{id}</h3>
<p>Revoke API key.</p>
<h3>POST /api/auth/login</h3>
<p>Login with password.</p>
<h3>POST /api/auth/logout</h3>
