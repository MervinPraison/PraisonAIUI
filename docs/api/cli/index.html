></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>CLI Reference</h1>
<p>Every <code>aiui</code> command and option. <code>aiui &lt;command&gt; --help</code> prints the same</p>
<p>information from the installed version. The wheel also installs the command</p>
<p>as <code>praisonaiui</code>.</p>
<p>For a short tour of the commands you will use most, see</p>
<p>CLI Usage.</p>
<h2>Run and build</h2>
<h3>`aiui run`</h3>
<p>Run the server for a Python app (<code>app.py</code>) or a YAML chat agent (<code>chat.yaml</code>).</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>APP_FILE</code> | required | A Python file that registers callbacks, or a <code>.yaml</code>/<code>.yml</code> chat config |</p>
<p>| <code>--port, -p</code> | <code>8000</code> | Port. If it is taken, the next free port (up to 10 further) is used and printed |</p>
<p>| <code>--host</code> | <code>127.0.0.1</code> | Address to bind to |</p>
<p>| <code>--reload, -r</code> | off | Restart when files change |</p>
<p>| <code>--style, -s</code> | detected | <code>app</code> (the React app shell), <code>chat</code> (the classic chat), <code>docs</code>, <code>agents</code>, <code>playground</code>, <code>dashboard</code> or <code>custom</code> |</p>
<p>| <code>--backend, -b</code> | <code>standalone</code> | <code>standalone</code>, or <code>praisonai</code> to use the PraisonAI WebSocket gateway |</p>
<p>| <code>--datastore, -d</code> | <code>sdk</code> | Session storage: <code>sdk</code> (shared with PraisonAI Agents), <code>sdk:/path</code>, <code>json</code>, <code>json:/path</code> or <code>memory</code>. Without the flag, a chat YAML's <code>datastore:</code> key is used |</p>
<p>| <code>--config, -c</code> | none | A docs-site YAML to build before serving (optional) |</p>
<p>| <code>--output, -o</code> | <code>aiui</code> | Folder the UI files are written to; by default next to <code>APP_FILE</code> |</p>
<p>Style: for a Python app <code>--style</code> wins, then <code>aiui.set_style()</code>; for a YAML</p>
<p>app its <code>style:</code> key wins over <code>--style</code>. Without any of them <code>aiui run</code></p>
<p>detects one: <code>@aiui.profiles</code> plus</p>
<p>registered agents gives <code>agents</code>, <code>@aiui.page</code> gives <code>dashboard</code>, anything else</p>
<p><code>app</code>. In <code>app</code>, <code>aiui run</code> opens the <code>chat</code> layout (the chat without a</p>
<p>canvas) unless <code>AIUI_LAYOUT</code>, <code>aiui.set_layout()</code> or YAML <code>layout:</code> picks</p>
<p>another. See UI Styles and</p>
<p>Layouts.</p>
<p>A chat YAML's top-level keys: <code>name</code>, <code>instructions</code>, <code>model</code>, <code>welcome</code>,</p>
<p><code>goodbye</code>, <code>starters</code>, <code>profiles</code>, <code>tools</code>, <code>features</code>, <code>datastore</code>, <code>style</code>,</p>
<p><code>theme</code>, <code>branding</code>, <code>dashboard</code>, <code>pages</code>, <code>layout</code> and <code>extensions</code>.</p>
<p><code>layout:</code> takes a layout id (<code>layout: command</code>) or the same block as</p>
<p><code>aiui.yaml</code> (<code>default</code>, <code>available</code>, <code>user_choice</code>, <code>primary</code>, <code>options</code>);</p>
<p><code>extensions:</code> takes <code>enabled:</code> / <code>disabled:</code> lists, as in <code>aiui.yaml</code>. Any</p>
<p>other key prints a warning naming it, since it would otherwise be ignored</p>
<p>without a word.</p>
<p><code>aiui run</code> loads <code>~/.praisonai/.env</code> and then <code>./.env</code> before starting,</p>
<p>without overriding variables that are already set.</p>
<h3>`aiui init`</h3>
<p>Write a starter <code>aiui.yaml</code> in the current folder. It refuses to overwrite an</p>
<p>existing <code>aiui.yaml</code> or <code>aiui.template.yaml</code> unless <code>--force</code> is given.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--template, -t</code> | <code>minimal</code> | <code>minimal</code>, <code>docs</code> or <code>marketing</code> |</p>
<p>| <code>--force, -f</code> | off | Overwrite existing files |</p>
<p>| <code>--frontend</code> | off | Also scaffold a Vite + React + shadcn frontend project |</p>
<p>The file's first line, <code># yaml-language-server: $schema=https://ui.praison.ai/aiui.schema.json</code>,</p>
<p>gives autocomplete and hover docs in editors (Editor setup).</p>
<p><code>init</code> writes only the YAML file. Create the folder it points to (for the</p>
<p><code>docs</code> template, <code>./docs</code> with at least one <code>.md</code> file) before <code>aiui build</code>.</p>
<h3>`aiui validate`</h3>
<p>Check a docs-site configuration and its pages.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--config, -c</code> | <code>aiui.yaml</code> | Configuration file (lookup) |</p>
<p>| <code>--strict</code> | off | Unknown keys, broken links, nav entries without a page and content issues (7xxx) become errors (exit 1) |</p>
<p>| <code>--format</code> | <code>text</code> | <code>json</code> prints <code>{valid, errors, warnings}</code>, each with <code>code</code>, <code>file</code>, <code>line</code>, <code>message</code>, <code>suggestion</code> |</p>
<p>Each finding prints as <code>[category] code file:line: message</code> with a fix hint</p>
<p>under it:</p>
<p>| Code | Finding |</p>
<p>|------|---------|</p>
<p>| 1003 | unknown key (ignored); in a <code>$ref</code> file the file is named |</p>
<p>| 1004 | key accepted but has no effect; unknown component tag in a page |</p>
<p>| 2101 | a nav entry names no docs page |</p>
<p>| 2102 | a navigation tab, menu item, anchor or dropdown with no pages, groups or <code>href</code> |</p>
<p>| 5001, 51xx, 5201 | theme, layout and search settings that are ignored |</p>
<p>| 6001, 6002 | broken link or missing image (<code>aiui docs check-links</code>); OpenAPI spec problems |</p>
<p>| 7000 | page front matter is not valid YAML (the page loses its title) |</p>
<p>| 7001 | front matter key has the wrong type (keys) |</p>
<p>| 7002 | image without alt text (<code>![](x.png)</code>, <code>&lt;img&gt;</code> with no <code>alt</code>; <code>alt=""</code> marks a decorative image) |</p>
<p>| 7003 | two files publish the same page URL (<code>intro.md</code> and <code>01-intro.md</code>) |</p>
<p>| 7004 | two sidebar entries in one folder have the same title |</p>
<p>| 7005 | heading skips a level (<code>##</code> then <code>####</code>) |</p>
<p>| 7006 | page has nothing beyond its headings |</p>
<p>| 7007 | <code>{{name}}</code> with no value under <code>variables:</code> (variables) |</p>
<p>| 7008 | snippet not found, outside the project folder, or including itself (fails <code>aiui build</code>) |</p>
<p>| 7009 | <code>icon</code> (front matter, navigation, a component's <code>icon="…"</code>) that is not a <a href="https://lucide.dev/icons">lucide</a> name, an emoji or an image URL, with the nearest name |</p>
<p>| 7010 | a redirect loops, or ends at a docs path with no page (redirects) |</p>
<p>| 7011 | a page is published at a redirect's source, so the redirect never runs |</p>
<p>| 7012 | front matter <code>openapi:</code> / <code>api:</code> or a navigation <code>METHOD /path</code> entry that names no operation in the loaded specs (OpenAPI) |</p>
<p>| 7013 | front matter <code>related</code> names a page that does not exist (related pages) |</p>
<p>| 7014 | a <code>site.customCss</code>, <code>site.customJs</code>, <code>site.theme.fonts</code> or <code>site.theme.codeLanguages</code> file that is not in the project folder (fonts and custom files) |</p>
<p>| 7015 | <code>site.theme.code</code> names a theme that is not bundled (with the nearest name), or a <code>site.theme.codeLanguages</code> file is not a TextMate grammar (code blocks) |</p>
<p>| 7016 | a <code>::: module</code> block names no module or member, or has an unknown option (fails <code>aiui build</code>; Python API reference) |</p>
<p>| 7017 | <code>content.docs.auth</code> is set, and only <code>aiui serve</code> / <code>aiui dev</code> enforce it (<code>aiui build</code>); front matter <code>public</code> / <code>groups</code> without <code>content.docs.auth</code>, or a group no reader is in (docs sign-in) |</p>
<p>| 7018 | two <code>navigation.versions</code> with the same name, more than one marked <code>default: true</code>, or a version that lists a page of another version's folder (versions) |</p>
<p>| 7019 | raw HTML a page shows differently than written: an <code>&lt;iframe&gt;</code> that is not a YouTube, Vimeo or Loom video (shown as a link; the host is named), or <code>&lt;script&gt;</code>, <code>&lt;style&gt;</code>, <code>&lt;link&gt;</code>, <code>&lt;form&gt;</code>, <code>&lt;audio&gt;</code>, <code>&lt;object&gt;</code>, <code>&lt;embed&gt;</code> (removed). Also an <code>aiui build</code> warning (raw HTML) |</p>
<p>| 7020 | two <code>navigation.languages</code> with the same code, more than one marked <code>default: true</code>, or a version folder inside a language folder (<code>docs/fr/v1/</code>; languages) |</p>
<p>| 7021 | <code>site.components</code> is not a <code>.js</code> / <code>.mjs</code> file in the project folder, or the build finds no component tag in it (your own components) |</p>
<p>| 7022 | a class on a component tag or raw HTML that docs pages drop (not a docs utility class; the nearest allowed one is suggested), or a <code>style</code> attribute (always removed). Also an <code>aiui build</code> warning (styling with classes) |</p>
<p>| 7101 | <code>site.theme.accent</code> under WCAG AA 3:1 contrast on the light or dark background, with a shade that passes |</p>
<p>| 7102 | <code>logo</code>, <code>favicon</code> or <code>site.theme.background</code> image that is not a file in the project folder (branding) |</p>
<p>Without <code>--config</code>, <code>validate</code>, <code>build</code> and <code>serve</code> read <code>./aiui.yaml</code>. The</p>
<p>old name <code>aiui.template.yaml</code> still works: when it is the only one there it is</p>
<p>used, with a one-line hint on stderr to rename it, and the exit code is</p>
<p>unchanged. When both files exist, <code>aiui.yaml</code> wins. An explicit <code>--config</code></p>
<p>always wins and prints no hint. See</p>
<p>Config file name.</p>
<h3>`aiui schema`</h3>
<p>Print the JSON Schema of <code>aiui.yaml</code>, generated from the <code>Config</code> model of the</p>
<p>installed version; <code>--output, -o &lt;file&gt;</code> writes it to a file. The schema is</p>
<p>also published at <code>https://ui.praison.ai/aiui.schema.json</code>; see</p>
<p>Editor setup.</p>
<h3>`aiui build`</h3>
<p>Build a static docs site from the configuration.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--config, -c</code> | <code>aiui.yaml</code> | Configuration file (lookup) |</p>
<p>| <code>--output, -o</code> | <code>aiui</code> | Output folder |</p>
<p>| <code>--minify</code> | off | Minify the JSON manifests |</p>
<p>| <code>--strict</code> | off | Stop with exit code 1 on a broken link (without it, broken links are warnings) |</p>
<p>The output holds <code>index.html</code>, <code>404.html</code>, the UI bundle (<code>assets/</code>,</p>
<p><code>aiui-manifest.json</code>), the manifests (<code>ui-config.json</code>, <code>docs-nav.json</code>,</p>
<p><code>route-manifest.json</code>), one HTML file and the Markdown source per page,</p>
<p><code>robots.txt</code> and <code>.nojekyll</code>. <code>sitemap.xml</code>, <code>llms.txt</code> and <code>llms-full.txt</code></p>
<p>are added when the site URL is known (<code>seo.siteUrl</code>, or a <code>CNAME</code> file next to</p>
<p>the configuration or in <code>docs/</code>).</p>
<h3>`aiui docs check-links`</h3>
<p>Find broken page links, <code>#anchor</code>s, images, component <code>href</code>s and nav entries</p>
<p>before you deploy. Prints <code>file:line: target: reason (did you mean X?)</code> and</p>
<p>exits <code>1</code> when a link is broken. See</p>
<p>Writing docs pages → Check links.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--config, -c</code> | <code>aiui.yaml</code> | Configuration file |</p>
<p>| <code>--external</code> | off | Also request every <code>http(s)</code> URL (HEAD, then GET; 16 at a time) |</p>
<p>| <code>--timeout</code> | <code>10</code> | Seconds to wait for each external URL |</p>
<p>| <code>--json</code> | off | Print <code>{"checked", "pages", "broken": [{file, line, target, reason, suggestion}]}</code> |</p>
<h3>`aiui serve`</h3>
<p>Build (unless <code>--no-build</code>) and serve a docs site.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--config, -c</code> | <code>aiui.yaml</code> | Configuration file (lookup) |</p>
<p>| <code>--output, -o</code> | <code>aiui</code> | Folder to serve |</p>
<p>| <code>--port, -p</code> | <code>8000</code> | Port (next free port if taken) |</p>
<p>| <code>--host</code> | <code>127.0.0.1</code> | Address to bind to |</p>
<p>| <code>--no-build</code> | off | Serve the existing output without building |</p>
<p>| <code>--watch, -w</code> | off | Rebuild when a file in the configuration's folder changes (reload the page yourself; <code>aiui dev</code> reloads it for you) |</p>
<p>| <code>--cors-origins</code> | empty | Comma-separated allowed origins; empty means same-origin only |</p>
<p>| <code>--ssl-certfile</code> | none | Certificate file for HTTPS |</p>
<p>| <code>--ssl-keyfile</code> | none | Private key file for HTTPS |</p>
<p>| <code>--open / --no-open</code> | auto | Open the site in a browser. Auto opens it only when run from a terminal; never in CI, under a test runner or from a script (when a browser opens) |</p>
<p>Paths without a file extension fall back to the single-page app. Paths that</p>
<p>try to leave the output folder are refused. Every response carries the <code>/*</code></p>
<p>headers of the build's <code>_headers</code> file, which holds the site's</p>
<p>Content Security Policy.</p>
<h4>When a browser opens</h4>
<p><code>aiui serve</code>, <code>aiui dev</code> and <code>aiui dev --examples</code> open a browser tab only for a</p>
<p>person at a terminal. With neither flag, the tab opens when standard output is a</p>
<p>terminal and no CI or test runner is detected (<code>CI</code>, <code>GITHUB_ACTIONS</code>,</p>
<p><code>GITLAB_CI</code>, <code>BUILDKITE</code>, <code>PYTEST_CURRENT_TEST</code>). <code>--open</code> forces it,</p>
<p><code>--no-open</code> skips it, and <code>AIUI_NO_BROWSER=1</code> turns it off everywhere, for</p>
<p>scripts and coding agents that start these servers.</p>
<h3>`aiui dev`</h3>
<p>Preview the docs site while you write it: build, serve, and reload the open</p>
<p>browser tab on every save. A failed build is shown in the terminal and over</p>
<p>the page while the last good build stays up. Run it in the folder that holds</p>
<p><code>aiui.yaml</code>, or in a folder with only a <code>docs/</code> folder. See</p>
<p>Hot Reload.</p>
<p>| Option | Default | Description |</p>
<p>|--------|---------|-------------|</p>
<p>| <code>--config, -c</code> | <code>aiui.yaml</code> | Configuration file (lookup) |</p>
<p>| <code>--port, -p</code> | <code>8000</code> | Port (next free port if taken) |</p>
<p>| <code>--host</code> | <code>127.0.0.1</code> | Address to bind to |</p>
<p>| <code>--open / --no-open</code> | auto | Open the preview in a browser; auto as for <code>aiui serve</code> (when a browser opens) |</p>
<p>| <code>--base-path</code> | as <code>aiui build</code> | URL path to preview the site under |</p>
<p>| <code>--examples, -e</code> | none | Run the examples dashboard for this folder instead (default port <code>9000</code>) |</p>
<p><code>aiui dev --examples examples</code> is the older dashboard that lists the example</p>
<p>projects in a folder and switches between them. In a folder with no</p>
<p>configuration and no <code>docs/</code> but an <code>examples/</code> folder, plain <code>aiui dev</code> still</p>
<p>opens it.</p>
<h2>Diagnostics</h2>
<p>| Command | Options | Description |</p>
<p>|---------|---------|-------------|</p>
<p>| <code>aiui doctor</code> | <code>--server, -s</code> (default <code>http://127.0.0.1:8000</code>), <code>--json</code> | Structured diagnostics against a running server |</p>
<p>| <code>aiui health-check</code> | <code>--server, -s</code>, <code>--detailed, -d</code> | Server health; <code>--detailed</code> shows each feature |</p>
<p>| <code>aiui health</code> | same | Alias of <code>health-check</code> |</p>
<p>| <code>aiui test &lt;suite&gt;</code> | <code>--server, -s</code> (default <code>http://127.0.0.1:8082</code>) | Integration tests against a running server: <code>chat</code>, <code>memory</code>, <code>sessions</code>, <code>endpoints</code>, <code>features</code>, <code>all</code>. See API Testing |</p>
<h2>Plugins</h2>
<p><code>--config</code> applies the <code>extensions:</code> policy from that YAML. <code>doctor</code> checks the</p>
<p>entry point, the SDK version gate, <code>static_dir</code> and SRI hashes, and (unless</p>
<p><code>--no-builtin</code>) page ids that a built-in page shadows. A plugin's own commands</p>
<p>run as <code>aiui &lt;plugin&gt; ...</code> or <code>aiui plugins &lt;plugin&gt; ...</code>;</p>
<p><code>AIUI_DISABLE_PLUGIN_AUTOLOAD=1</code> turns that lookup off. See</p>
<p>UI plugins.</p>
<h2>Management commands</h2>
<p>These talk to a running server over HTTP. Every one takes</p>
<p><code>--server, -s URL</code> (default <code>http://127.0.0.1:8000</code>).</p>
<h3>`sessions`</h3>
<h3>`session-ext`</h3>
<h3>`memory`</h3>
<h3>`provider`</h3>
<h3>`features` and `pages`</h3>
<h3>`config`</h3>
<p>Runtime configuration (stored in <code>config.yaml</code> under the data directory).</p>
<h3>`approval`</h3>
<h3>`schedule`</h3>
<h3>`skills`, `hooks`, `workflows`</h3>
<h3>`eval` and `traces`</h3>
<h3>`surface`</h3>
<p>A2UI surfaces for the agent canvas; see A2UI canvas.</p>
<h3>`auth`</h3>
<p><code>aiui auth create-secret</code> prints a new session secret (offline; see</p>
<p>Sessions); <code>aiui auth create-key --name my-app</code> creates an</p>
<p>API key on the running server and prints it once.</p>
<h2>Exit codes</h2>
<p>| Code | Meaning |</p>
<p>|------|---------|</p>
<p>| <code>0</code> | Success |</p>
<p>| <code>1</code> | Invalid configuration, failed request or other error |</p>
<p>| <code>2</code> | File or folder not found, or an unknown <code>--style</code> |</p>
<p>| <code>3</code> | Build failed |</p>
<p>| <code>4</code> | No free port near the requested one |</p>
<h2>Environment variables</h2>
<p>| Variable | Effect |</p>
<p>|----------|--------|</p>
<p>| <code>AIUI_DATA_DIR</code> | Data directory (default <code>~/.praisonaiui</code>): sessions, runtime <code>config.yaml</code>, plugin state |</p>
<p>| <code>AIUI_SHELL</code> | <code>app</code> turns the <code>dashboard</code> style into the React app shell; <code>legacy</code> turns <code>app</code> back into <code>dashboard</code> |</p>
<p>| <code>AIUI_LAYOUT</code> | Default app-shell layout id; see Layouts |</p>
<p>| <code>AIUI_TEMPLATES_DIR</code> | Serve or build with another frontend bundle folder |</p>
<p>| <code>AIUI_ALLOWED_ORIGINS</code> | Origins allowed for cross-site requests and WebSockets (comma-separated, or <code>*</code>) |</p>
<p>| <code>AIUI_ALLOWED_HOSTS</code> | Extra host names a loopback or private-address server answers |</p>
<p>| <code>AIUI_REQUIRE_TOKEN</code> | Require the URL token on every request |</p>
<p>| <code>AUTH_ENFORCE</code> | <code>true</code> gates every route and WebSocket behind auth |</p>
<p>| <code>AIUI_AUTH_SECRET</code> | Session signing secret (comma-separated to rotate: first signs, all verify); default a generated <code>&lt;data dir&gt;/auth_secret</code> |</p>
<p>| <code>AIUI_SESSION_LIFETIME</code> | How long a sign-in lasts while unused (<code>14d</code> default, <code>12h</code>, <code>3600</code>); overrides YAML <code>auth.sessionLifetime</code> |</p>
<p>| <code>AIUI_DISABLE_PLUGIN_AUTOLOAD</code> | <code>1</code> stops loading plugin CLI commands |</p>
<p>| <code>PRAISONAI_MODEL</code> | Default model for built-in agent features (default <code>gpt-4o-mini</code>) |</p>
<p>| <code>OPENAI_API_KEY</code> | Used by agent features and examples that call OpenAI |</p>
<p>The security variables are described in</p>
<p>Deployment.</p>
<h2>Python equivalent of `aiui build`</h2></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/api/cli.source.md", "text": "---\nnav_title: CLI\n---\n\n# CLI Reference\n\nEvery `aiui` command and option. `aiui \u003ccommand\u003e --help` prints the same\ninformation from the installed version. The wheel also installs the command\nas `praisonaiui`.\n\nFor a short tour of the commands you will use most, see\n[CLI Usage](../getting-started/cli.md).\n\n## Run and build\n\n### `aiui run`\n\nRun the server for a Python app (`app.py`) or a YAML chat agent (`chat.yaml`).\n\n```bash\naiui run APP_FILE [OPTIONS]\n```\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `APP_FILE` | required | A Python file that registers callbacks, or a `.yaml`/`.yml` chat config |\n| `--port, -p` | `8000` | Port. If it is taken, the next free port (up to 10 further) is used and printed |\n| `--host` | `127.0.0.1` | Address to bind to |\n| `--reload, -r` | off | Restart when files change |\n| `--style, -s` | detected | `app` (the React app shell), `chat` (the classic chat), `docs`, `agents`, `playground`, `dashboard` or `custom` |\n| `--backend, -b` | `standalone` | `standalone`, or `praisonai` to use the PraisonAI WebSocket gateway |\n| `--datastore, -d` | `sdk` | Session storage: `sdk` (shared with PraisonAI Agents), `sdk:/path`, `json`, `json:/path` or `memory`. Without the flag, a chat YAML's `datastore:` key is used |\n| `--config, -c` | none | A docs-site YAML to build before serving (optional) |\n| `--output, -o` | `aiui` | Folder the UI files are written to; by default next to `APP_FILE` |\n\nStyle: for a Python app `--style` wins, then `aiui.set_style()`; for a YAML\napp its `style:` key wins over `--style`. Without any of them `aiui run`\ndetects one: `@aiui.profiles` plus\nregistered agents gives `agents`, `@aiui.page` gives `dashboard`, anything else\n`app`. In `app`, `aiui run` opens the `chat` layout (the chat without a\ncanvas) unless `AIUI_LAYOUT`, `aiui.set_layout()` or YAML `layout:` picks\nanother. See [UI Styles](../features/styles.md) and\n[Layouts](../features/layouts.md).\n\nA chat YAML's top-level keys: `name`, `instructions`, `model`, `welcome`,\n`goodbye`, `starters`, `profiles`, `tools`, `features`, `datastore`, `style`,\n`theme`, `branding`, `dashboard`, `pages`, `layout` and `extensions`.\n`layout:` takes a layout id (`layout: command`) or the same block as\n`aiui.yaml` (`default`, `available`, `user_choice`, `primary`, `options`);\n`extensions:` takes `enabled:` / `disabled:` lists, as in `aiui.yaml`. Any\nother key prints a warning naming it, since it would otherwise be ignored\nwithout a word.\n\n`aiui run` loads `~/.praisonai/.env` and then `./.env` before starting,\nwithout overriding variables that are already set.\n\n```bash\naiui run app.py                         # style detected; a chat app opens the app shell\naiui run app.py --style chat            # the classic chat style\naiui run app.py --port 3000 --reload\naiui run app.py --datastore json        # sessions under ~/.praisonaiui\naiui run chat.yaml                      # YAML-defined agent (needs praisonaiagents)\naiui run app.py --backend praisonai\n```\n\n### `aiui init`\n\nWrite a starter `aiui.yaml` in the current folder. It refuses to overwrite an\nexisting `aiui.yaml` or `aiui.template.yaml` unless `--force` is given.\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--template, -t` | `minimal` | `minimal`, `docs` or `marketing` |\n| `--force, -f` | off | Overwrite existing files |\n| `--frontend` | off | Also scaffold a Vite + React + shadcn frontend project |\n\nThe file's first line, `# yaml-language-server: $schema=https://ui.praison.ai/aiui.schema.json`,\ngives autocomplete and hover docs in editors ([Editor setup](../concepts/configuration.md#editor-setup)).\n`init` writes only the YAML file. Create the folder it points to (for the\n`docs` template, `./docs` with at least one `.md` file) before `aiui build`.\n\n### `aiui validate`\n\nCheck a docs-site configuration and its pages.\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--config, -c` | `aiui.yaml` | Configuration file ([lookup](../concepts/configuration.md#config-file-name)) |\n| `--strict` | off | Unknown keys, broken links, nav entries without a page and content issues (7xxx) become errors (exit 1) |\n| `--format` | `text` | `json` prints `{valid, errors, warnings}`, each with `code`, `file`, `line`, `message`, `suggestion` |\n\nEach finding prints as `[category] code file:line: message` with a fix hint\nunder it:\n\n```text\n  [content] 7005 docs/guide/setup.md:14: heading jumps from h2 to h4\n    💡 Use ### here; screen readers navigate by heading level\n```\n\n| Code | Finding |\n|------|---------|\n| 1003 | unknown key (ignored); in a `$ref` file the file is named |\n| 1004 | key accepted but has no effect; unknown component tag in a page |\n| 2101 | a nav entry names no docs page |\n| 2102 | a navigation tab, menu item, anchor or dropdown with no pages, groups or `href` |\n| 5001, 51xx, 5201 | theme, layout and search settings that are ignored |\n| 6001, 6002 | broken link or missing image (`aiui docs check-links`); OpenAPI spec problems |\n| 7000 | page front matter is not valid YAML (the page loses its title) |\n| 7001 | front matter key has the wrong type ([keys](../features/writing-docs.md#front-matter)) |\n| 7002 | image without alt text (`![](x.png)`, `\u003cimg\u003e` with no `alt`; `alt=\"\"` marks a decorative image) |\n| 7003 | two files publish the same page URL (`intro.md` and `01-intro.md`) |\n| 7004 | two sidebar entries in one folder have the same title |\n| 7005 | heading skips a level (`##` then `####`) |\n| 7006 | page has nothing beyond its headings |\n| 7007 | `{{name}}` with no value under `variables:` ([variables](../features/writing-docs.md#reusable-snippets-and-variables)) |\n| 7008 | snippet not found, outside the project folder, or including itself (fails `aiui build`) |\n| 7009 | `icon` (front matter, navigation, a component's `icon=\"…\"`) that is not a [lucide](https://lucide.dev/icons) name, an emoji or an image URL, with the nearest name |\n| 7010 | a redirect loops, or ends at a docs path with no page ([redirects](../features/redirects.md#checks)) |\n| 7011 | a page is published at a redirect's source, so the redirect never runs |\n| 7012 | front matter `openapi:` / `api:` or a navigation `METHOD /path` entry that names no operation in the loaded specs ([OpenAPI](../features/openapi.md#endpoints-on-your-own-pages)) |\n| 7013 | front matter `related` names a page that does not exist ([related pages](../features/writing-docs.md#related-pages)) |\n| 7014 | a `site.customCss`, `site.customJs`, `site.theme.fonts` or `site.theme.codeLanguages` file that is not in the project folder ([fonts and custom files](../features/theming.md#fonts)) |\n| 7015 | `site.theme.code` names a theme that is not bundled (with the nearest name), or a `site.theme.codeLanguages` file is not a TextMate grammar ([code blocks](../features/theming.md#code-blocks)) |\n| 7016 | a `::: module` block names no module or member, or has an unknown option (fails `aiui build`; [Python API reference](../features/api-reference-python.md#checks)) |\n| 7017 | `content.docs.auth` is set, and only `aiui serve` / `aiui dev` enforce it (`aiui build`); front matter `public` / `groups` without `content.docs.auth`, or a group no reader is in ([docs sign-in](../features/docs-auth.md)) |\n| 7018 | two `navigation.versions` with the same name, more than one marked `default: true`, or a version that lists a page of another version's folder ([versions](../features/navigation.md#versions)) |\n| 7019 | raw HTML a page shows differently than written: an `\u003ciframe\u003e` that is not a YouTube, Vimeo or Loom video (shown as a link; the host is named), or `\u003cscript\u003e`, `\u003cstyle\u003e`, `\u003clink\u003e`, `\u003cform\u003e`, `\u003caudio\u003e`, `\u003cobject\u003e`, `\u003cembed\u003e` (removed). Also an `aiui build` warning ([raw HTML](../features/writing-docs.md#raw-html)) |\n| 7020 | two `navigation.languages` with the same code, more than one marked `default: true`, or a version folder inside a language folder (`docs/fr/v1/`; [languages](../features/navigation.md#languages)) |\n| 7021 | `site.components` is not a `.js` / `.mjs` file in the project folder, or the build finds no component tag in it ([your own components](../features/writing-docs.md#your-own-components)) |\n| 7022 | a class on a component tag or raw HTML that docs pages drop (not a docs utility class; the nearest allowed one is suggested), or a `style` attribute (always removed). Also an `aiui build` warning ([styling with classes](../features/writing-docs.md#styling-with-classes)) |\n| 7101 | `site.theme.accent` under WCAG AA 3:1 contrast on the light or dark background, with a shade that passes |\n| 7102 | `logo`, `favicon` or `site.theme.background` image that is not a file in the project folder ([branding](../features/theming.md#branding-a-docs-site)) |\n\nWithout `--config`, `validate`, `build` and `serve` read `./aiui.yaml`. The\nold name `aiui.template.yaml` still works: when it is the only one there it is\nused, with a one-line hint on stderr to rename it, and the exit code is\nunchanged. When both files exist, `aiui.yaml` wins. An explicit `--config`\nalways wins and prints no hint. See\n[Config file name](../concepts/configuration.md#config-file-name).\n\n### `aiui schema`\n\nPrint the JSON Schema of `aiui.yaml`, generated from the `Config` model of the\ninstalled version; `--output, -o \u003cfile\u003e` writes it to a file. The schema is\nalso published at `https://ui.praison.ai/aiui.schema.json`; see\n[Editor setup](../concepts/configuration.md#editor-setup).\n\n### `aiui build`\n\nBuild a static docs site from the configuration.\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--config, -c` | `aiui.yaml` | Configuration file ([lookup](../concepts/configuration.md#config-file-name)) |\n| `--output, -o` | `aiui` | Output folder |\n| `--minify` | off | Minify the JSON manifests |\n| `--strict` | off | Stop with exit code 1 on a broken link (without it, broken links are warnings) |\n\nThe output holds `index.html`, `404.html`, the UI bundle (`assets/`,\n`aiui-manifest.json`), the manifests (`ui-config.json`, `docs-nav.json`,\n`route-manifest.json`), one HTML file and the Markdown source per page,\n`robots.txt` and `.nojekyll`. `sitemap.xml`, `llms.txt` and `llms-full.txt`\nare added when the site URL is known (`seo.siteUrl`, or a `CNAME` file next to\nthe configuration or in `docs/`).\n\n### `aiui docs check-links`\n\nFind broken page links, `#anchor`s, images, component `href`s and nav entries\nbefore you deploy. Prints `file:line: target: reason (did you mean X?)` and\nexits `1` when a link is broken. See\n[Writing docs pages → Check links](../features/writing-docs.md#check-links).\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--config, -c` | `aiui.yaml` | Configuration file |\n| `--external` | off | Also request every `http(s)` URL (HEAD, then GET; 16 at a time) |\n| `--timeout` | `10` | Seconds to wait for each external URL |\n| `--json` | off | Print `{\"checked\", \"pages\", \"broken\": [{file, line, target, reason, suggestion}]}` |\n\n### `aiui serve`\n\nBuild (unless `--no-build`) and serve a docs site.\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--config, -c` | `aiui.yaml` | Configuration file ([lookup](../concepts/configuration.md#config-file-name)) |\n| `--output, -o` | `aiui` | Folder to serve |\n| `--port, -p` | `8000` | Port (next free port if taken) |\n| `--host` | `127.0.0.1` | Address to bind to |\n| `--no-build` | off | Serve the existing output without building |\n| `--watch, -w` | off | Rebuild when a file in the configuration's folder changes (reload the page yourself; `aiui dev` reloads it for you) |\n| `--cors-origins` | empty | Comma-separated allowed origins; empty means same-origin only |\n| `--ssl-certfile` | none | Certificate file for HTTPS |\n| `--ssl-keyfile` | none | Private key file for HTTPS |\n| `--open / --no-open` | auto | Open the site in a browser. Auto opens it only when run from a terminal; never in CI, under a test runner or from a script ([when a browser opens](#when-a-browser-opens)) |\n\nPaths without a file extension fall back to the single-page app. Paths that\ntry to leave the output folder are refused. Every response carries the `/*`\nheaders of the build's `_headers` file, which holds the site's\n[Content Security Policy](../features/content-security-policy.md).\n\n#### When a browser opens\n\n`aiui serve`, `aiui dev` and `aiui dev --examples` open a browser tab only for a\nperson at a terminal. With neither flag, the tab opens when standard output is a\nterminal and no CI or test runner is detected (`CI`, `GITHUB_ACTIONS`,\n`GITLAB_CI`, `BUILDKITE`, `PYTEST_CURRENT_TEST`). `--open` forces it,\n`--no-open` skips it, and `AIUI_NO_BROWSER=1` turns it off everywhere, for\nscripts and coding agents that start these servers.\n\n### `aiui dev`\n\nPreview the docs site while you write it: build, serve, and reload the open\nbrowser tab on every save. A failed build is shown in the terminal and over\nthe page while the last good build stays up. Run it in the folder that holds\n`aiui.yaml`, or in a folder with only a `docs/` folder. See\n[Hot Reload](../features/hot-reload.md).\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| `--config, -c` | `aiui.yaml` | Configuration file ([lookup](../concepts/configuration.md#config-file-name)) |\n| `--port, -p` | `8000` | Port (next free port if taken) |\n| `--host` | `127.0.0.1` | Address to bind to |\n| `--open / --no-open` | auto | Open the preview in a browser; auto as for `aiui serve` ([when a browser opens](#when-a-browser-opens)) |\n| `--base-path` | as `aiui build` | URL path to preview the site under |\n| `--examples, -e` | none | Run the examples dashboard for this folder instead (default port `9000`) |\n\n`aiui dev --examples examples` is the older dashboard that lists the example\nprojects in a folder and switches between them. In a folder with no\nconfiguration and no `docs/` but an `examples/` folder, plain `aiui dev` still\nopens it.\n\n## Diagnostics\n\n| Command | Options | Description |\n|---------|---------|-------------|\n| `aiui doctor` | `--server, -s` (default `http://127.0.0.1:8000`), `--json` | Structured diagnostics against a running server |\n| `aiui health-check` | `--server, -s`, `--detailed, -d` | Server health; `--detailed` shows each feature |\n| `aiui health` | same | Alias of `health-check` |\n| `aiui test \u003csuite\u003e` | `--server, -s` (default `http://127.0.0.1:8082`) | Integration tests against a running server: `chat`, `memory`, `sessions`, `endpoints`, `features`, `all`. See [API Testing](testing.md) |\n\n## Plugins\n\n```bash\naiui plugins list [--json] [--config FILE]       # installed UI plugins, version, status, load error\naiui plugins doctor [--config FILE] [--no-builtin]\n```\n\n`--config` applies the `extensions:` policy from that YAML. `doctor` checks the\nentry point, the SDK version gate, `static_dir` and SRI hashes, and (unless\n`--no-builtin`) page ids that a built-in page shadows. A plugin's own commands\nrun as `aiui \u003cplugin\u003e ...` or `aiui plugins \u003cplugin\u003e ...`;\n`AIUI_DISABLE_PLUGIN_AUTOLOAD=1` turns that lookup off. See\n[UI plugins](../features/plugins.md).\n\n## Management commands\n\nThese talk to a running server over HTTP. Every one takes\n`--server, -s URL` (default `http://127.0.0.1:8000`).\n\n### `sessions`\n\n```bash\naiui sessions list\naiui sessions create\naiui sessions get SESSION_ID\naiui sessions delete SESSION_ID\naiui sessions messages SESSION_ID\n```\n\n### `session-ext`\n\n```bash\naiui session-ext state SESSION_ID\naiui session-ext save-state SESSION_ID --key K --value V\naiui session-ext labels SESSION_ID\naiui session-ext usage SESSION_ID\naiui session-ext compact SESSION_ID\naiui session-ext reset SESSION_ID\n```\n\n### `memory`\n\n```bash\naiui memory list [--type short|long|entity|all]\naiui memory add TEXT [--type long]\naiui memory search QUERY [--limit 10]\naiui memory context QUERY [--limit 5]    # memory text for prompt injection\naiui memory clear [--type all]\naiui memory status\n```\n\n### `provider`\n\n```bash\naiui provider status     # active provider and its health\naiui provider health\naiui provider agents\n```\n\n### `features` and `pages`\n\n```bash\naiui features list       # registered feature protocols\naiui features status     # health summary\naiui pages list          # sidebar pages with group and icon\naiui pages ids           # page ids, for aiui.set_pages()\n```\n\n### `config`\n\nRuntime configuration (stored in `config.yaml` under the data directory).\n\n```bash\naiui config get [KEY]          # all keys when KEY is omitted\naiui config set KEY VALUE\naiui config list\naiui config history [--limit 20]\n```\n\n### `approval`\n\n```bash\naiui approval list [--status all|pending|resolved]\naiui approval pending\naiui approval resolve APPROVAL_ID [--approved | --denied] [--reason TEXT]\n```\n\n### `schedule`\n\n```bash\naiui schedule list\naiui schedule add NAME MESSAGE [--every 60]    # interval in seconds\naiui schedule remove JOB_ID\naiui schedule status\n```\n\n### `skills`, `hooks`, `workflows`\n\n```bash\naiui skills list | status | discover\naiui hooks list\naiui hooks trigger HOOK_ID\naiui hooks log [--limit 20]\naiui workflows list | status | runs\naiui workflows run WORKFLOW_ID\n```\n\n### `eval` and `traces`\n\n```bash\naiui eval status | scores | judges\naiui eval list [--limit 20] [--agent-id ID]\naiui eval run --input TEXT --output TEXT [--expected TEXT] [--agent-id cli]\naiui traces status\naiui traces list [--limit 20]\naiui traces spans [--limit 20] [--trace-id ID]\naiui traces get TRACE_ID\n```\n\n### `surface`\n\nA2UI surfaces for the agent canvas; see [A2UI canvas](../features/a2ui-canvas.md).\n\n```bash\naiui surface list | status\naiui surface get [SURFACE_ID] [--json]               # SURFACE_ID defaults to main\naiui surface push [SURFACE_ID] --file messages.json [--replace]\naiui surface clear [SURFACE_ID]\n```\n\n### `auth`\n\n`aiui auth create-secret` prints a new session secret (offline; see\n[Sessions](../features/deployment.md#sessions)); `aiui auth create-key --name my-app` creates an\nAPI key on the running server and prints it once.\n\n## Exit codes\n\n| Code | Meaning |\n|------|---------|\n| `0` | Success |\n| `1` | Invalid configuration, failed request or other error |\n| `2` | File or folder not found, or an unknown `--style` |\n| `3` | Build failed |\n| `4` | No free port near the requested one |\n\n## Environment variables\n\n| Variable | Effect |\n|----------|--------|\n| `AIUI_DATA_DIR` | Data directory (default `~/.praisonaiui`): sessions, runtime `config.yaml`, plugin state |\n| `AIUI_SHELL` | `app` turns the `dashboard` style into the React app shell; `legacy` turns `app` back into `dashboard` |\n| `AIUI_LAYOUT` | Default app-shell layout id; see [Layouts](../features/layouts.md) |\n| `AIUI_TEMPLATES_DIR` | Serve or build with another frontend bundle folder |\n| `AIUI_ALLOWED_ORIGINS` | Origins allowed for cross-site requests and WebSockets (comma-separated, or `*`) |\n| `AIUI_ALLOWED_HOSTS` | Extra host names a loopback or private-address server answers |\n| `AIUI_REQUIRE_TOKEN` | Require the URL token on every request |\n| `AUTH_ENFORCE` | `true` gates every route and WebSocket behind auth |\n| `AIUI_AUTH_SECRET` | Session signing secret (comma-separated to rotate: first signs, all verify); default a generated `\u003cdata dir\u003e/auth_secret` |\n| `AIUI_SESSION_LIFETIME` | How long a sign-in lasts while unused (`14d` default, `12h`, `3600`); overrides YAML `auth.sessionLifetime` |\n| `AIUI_DISABLE_PLUGIN_AUTOLOAD` | `1` stops loading plugin CLI commands |\n| `PRAISONAI_MODEL` | Default model for built-in agent features (default `gpt-4o-mini`) |\n| `OPENAI_API_KEY` | Used by agent features and examples that call OpenAI |\n\nThe security variables are described in\n[Deployment](../features/deployment.md).\n\n## Python equivalent of `aiui build`\n\n```python\nfrom pathlib import Path\n\nimport yaml\n\nfrom praisonaiui.compiler import Compiler\nfrom praisonaiui.schema import Config\n\nconfig = Config.model_validate(yaml.safe_load(Path(\"aiui.yaml\").read_text()))\nresult = Compiler(config, base_path=Path(\".\")).compile(output_dir=Path(\"aiui\"), minify=False)\nprint(result.success, result.files, result.error)\n```\n"}</script>
