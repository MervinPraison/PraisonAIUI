<p>Reference for <code>import praisonaiui as aiui</code>.</p>
<h2>Server Configuration</h2>
<p>These functions configure the server. Call them at module level in your <code>app.py</code>, before the server starts.</p>
<h3>`aiui.set_style(style)`</h3>
<p>Set the UI style.</p>
<p>| Parameter | Type | Values |</p>
<p>|-----------|------|--------|</p>
<p>| <code>style</code> | <code>str</code> | <code>"chat"</code>, <code>"dashboard"</code>, <code>"agents"</code>, <code>"playground"</code>, <code>"docs"</code>, <code>"custom"</code> |</p>
<p>Priority: <code>set_style()</code> → CLI <code>--style</code> flag → auto-detection.</p>
<h3>`aiui.set_branding(title, logo)`</h3>
<p>Configure the sidebar branding (title text and logo emoji).</p>
<p>| Parameter | Type | Default |</p>
<p>|-----------|------|---------|</p>
<p>| <code>title</code> | <code>str</code> | <code>"PraisonAI"</code> |</p>
<p>| <code>logo</code> | <code>str</code> | <code>"🦞"</code> |</p>
<p>Also configurable via <code>config.yaml</code>:</p>
<p>---</p>
<h3>`aiui.set_datastore(store)`</h3>
<p>Set the persistence backend for sessions and messages.</p>
<p>---</p>
<h3>`aiui.set_provider(provider)`</h3>
<p>Set the AI provider for chat completions.</p>
<p>---</p>
<h3>`aiui.register_agent(config)`</h3>
<p>Register an AI agent for the dashboard. Agents appear in the sidebar and can be selected for chat.</p>
<p>---</p>
<h3>`aiui.remove_page(page_id)`</h3>
<p>Remove a page from the sidebar.</p>
<p>---</p>
<h3>`aiui.set_chat_mode(mode, *, position, size, resizable, minimized)`</h3>
<p>Configure chat window display mode — full page, floating window, or sidebar panel.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>mode</code> | <code>str</code> | <code>"fullpage"</code> | <code>"fullpage"</code>, <code>"floating"</code>, or <code>"sidebar"</code> |</p>
<p>| <code>position</code> | <code>tuple[int, int]</code> | <code>(20, 20)</code> | (bottom, right) pixel offset for floating mode |</p>
<p>| <code>size</code> | <code>tuple[int, int]</code> | <code>(400, 500)</code> | (width, height) initial size for floating mode |</p>
<p>| <code>resizable</code> | <code>bool</code> | <code>True</code> | Allow resizing the floating window |</p>
<p>| <code>minimized</code> | <code>bool</code> | <code>False</code> | Start minimized (floating mode only) |</p>
<p>---</p>
<h3>`aiui.set_sidebar_config(*, collapsible, default_collapsed, width, min_width, max_width)`</h3>
<p>Configure sidebar behavior and dimensions.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>collapsible</code> | <code>bool</code> | <code>True</code> | Allow sidebar to be collapsed |</p>
<p>| <code>default_collapsed</code> | <code>bool</code> | <code>False</code> | Start with sidebar collapsed |</p>
<p>| <code>width</code> | <code>int</code> | <code>260</code> | Default sidebar width in pixels |</p>
<p>| <code>min_width</code> | <code>int</code> | <code>200</code> | Minimum width when resizing |</p>
<p>| <code>max_width</code> | <code>int</code> | <code>360</code> | Maximum width when resizing |</p>
<p>---</p>
<h3>`aiui.set_brand_color(color)`</h3>
<p>Set the brand/primary accent color. Overrides the theme's default accent.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>color</code> | <code>str</code> | Hex color (e.g. <code>"#6366f1"</code>) or CSS color value |</p>
<p>---</p>
<h3>`aiui.set_chat_features(*, history, streaming, file_upload, audio, reasoning, tools, multimedia, feedback)`</h3>
<p>Configure which chat features are enabled in the UI.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>history</code> | <code>bool</code> | <code>True</code> | Show session history sidebar |</p>
<p>| <code>streaming</code> | <code>bool</code> | <code>True</code> | Enable streaming responses |</p>
<p>| <code>file_upload</code> | <code>bool</code> | <code>False</code> | Show file upload button |</p>
<p>| <code>audio</code> | <code>bool</code> | <code>False</code> | Show audio input button |</p>
<p>| <code>reasoning</code> | <code>bool</code> | <code>True</code> | Show reasoning/thinking steps |</p>
<p>| <code>tools</code> | <code>bool</code> | <code>True</code> | Show tool call displays |</p>
<p>| <code>multimedia</code> | <code>bool</code> | <code>True</code> | Enable multimedia rendering |</p>
<p>| <code>feedback</code> | <code>bool</code> | <code>False</code> | Show feedback buttons |</p>
<p>---</p>
<h3>`aiui.set_dashboard(*, sidebar, page_header)`</h3>
<p>Configure dashboard layout options.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>sidebar</code> | <code>bool</code> | <code>True</code> | Show the left sidebar navigation |</p>
<p>| <code>page_header</code> | <code>bool</code> | <code>True</code> | Show the page title/description header |</p>
<p>---</p>
<h3>`aiui.set_chat_preview(enabled, *, surface_id, width)`</h3>
<p>Configure the <strong>chat + canvas</strong> split preview (<code>chat-canvas</code> page). The vanilla <code>chat</code> page is unchanged.</p>
<p>| Parameter | Type | Default | Description |</p>
<p>|-----------|------|---------|-------------|</p>
<p>| <code>enabled</code> | <code>bool</code> | <code>True</code> | Expose preview settings in <code>/ui-config.json</code> |</p>
<p>| <code>surface_id</code> | <code>str</code> | <code>"main"</code> | Default A2UI surface id for the preview panel |</p>
<p>| <code>width</code> | <code>str</code> | <code>"40%"</code> | CSS width of the preview column (e.g. <code>"38%"</code>, <code>"420px"</code>) |</p>
<p>See A2UI canvas.</p>
<p>---</p>
<h3>`aiui.register_theme(name, variables)`</h3>
<p>Register a custom theme preset. The theme becomes available in the theme picker UI and via <code>/api/theme</code>.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>name</code> | <code>str</code> | Unique theme name (e.g. <code>"ocean"</code>, <code>"sunset"</code>) |</p>
<p>| <code>variables</code> | <code>dict[str, str]</code> | Dict with at least <code>{"accent": "#hexcolor"}</code> |</p>
<p>See CSS Architecture for all available CSS variables.</p>
<p>---</p>
<h3>`aiui.set_custom_js(path)`</h3>
<p>Inject a local JavaScript file into the UI. Reads the file at <code>path</code> and</p>
<p>serves it at <code>/custom.js</code>. A <code>&lt;script src="/custom.js"&gt;</code> tag is injected</p>
<p>into the host HTML <strong>after</strong> the plugin loader, so <code>window.aiui</code> and all</p>
<p>registry APIs (<code>registerView</code>, <code>registerComponent</code>) are ready when your</p>
<p>code runs.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>path</code> | <code>str \| Path</code> | Local filesystem path to a <code>.js</code> file |</p>
<p>Raises <code>FileNotFoundError</code> if the path does not exist.</p>
<p>Where <code>plugin.js</code> uses the client-side extension APIs:</p>
<p>---</p>
<h3>`aiui.register_component_schema(component_type, schema)`</h3>
<p>Register a JSON Schema contract for a component dict. Built-in schemas</p>
<p>are auto-derived from every <code>aiui.ui.*</code> builder at startup; user schemas</p>
<p>take priority and are merged on top.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>component_type</code> | <code>str</code> | Component type string (e.g. <code>"timeline"</code>) |</p>
<p>| <code>schema</code> | <code>dict</code> | JSON Schema dict (Draft 2020-12 compatible) |</p>
<h3>`aiui.get_component_schemas()`</h3>
<p>Returns the merged registry as a <code>dict[str, dict]</code>. Also available as a</p>
<p>JSON endpoint: <code>GET /api/components/schemas</code>.</p>
<p>---</p>
<h3>`aiui.prompt(question, *, options=None, timeout=300.0)`</h3>
<p>Pause the agent and wait for the user to answer. Preferred entry point</p>
<p>for interactive agent flows — supersedes the legacy <code>AskUserMessage</code></p>
<p>class.</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>question</code> | <code>str</code> | Text shown to the user. |</p>
<p>| <code>options</code>  | <code>list[str] \| None</code> | Optional list of choices. When given, the user picks one; otherwise they type free text. |</p>
<p>| <code>timeout</code>  | <code>float</code> | Seconds to wait before giving up. Default 300 (5 min). |</p>
<p>Returns a <code>PromptResult</code> dataclass (<code>text</code>, <code>choice</code>, <code>message_id</code>).</p>
<p>The result is truthy when the user answered, falsy on timeout.</p>
<p>---</p>
<h3>`aiui.error(content, *, details=None)`</h3>
<p>Emit an error message to the chat. A thin helper around <code>Message</code> with</p>
<p><code>metadata={"kind": "error"}</code> — keeps the public surface small.</p>
<p>---</p>
<h3>`aiui.configure(*, datastore=None, branding=None, theme=None, chat=None, custom_css=None, custom_js=None, style=None)`</h3>
<p>One-stop configuration function. Every keyword is optional, so you only</p>
<p>set what you need. Replaces the dozen individual <code>set_*</code> setters for</p>
<p>most common cases (the <code>set_*</code> functions remain for advanced control).</p>
<p>| Parameter | Type | Description |</p>
<p>|-----------|------|-------------|</p>
<p>| <code>datastore</code> | <code>str</code> | Storage backend: <code>"memory"</code>, <code>"json"</code>, <code>"json:/path"</code>, <code>"sdk"</code>, <code>"sdk:/path"</code>. |</p>
<p>| <code>branding</code>  | <code>dict</code> | Forwarded to <code>set_branding(...)</code>. Keys: <code>title</code>, <code>logo</code>, <code>subtitle</code>. |</p>
<p>| <code>theme</code>     | <code>dict</code> | Forwarded to <code>set_theme(...)</code>. Keys: <code>preset</code>, <code>dark</code>/<code>dark_mode</code>, <code>radius</code>, <code>brand_color</code>. |</p>
<p>| <code>chat</code>      | <code>dict</code> | Forwarded to <code>set_chat_features(...)</code>. Keys: <code>feedback</code>, <code>mode</code>, plus any chat-feature flag. |</p>
<p>| <code>custom_css</code>| <code>str \| Path</code> | Path to a CSS file; same as <code>set_custom_css</code>. |</p>
<p>| <code>custom_js</code> | <code>str \| Path</code> | Path to a JS file; same as <code>set_custom_js</code>. |</p>
<p>| <code>style</code>     | <code>str</code> | UI style — <code>"chat"</code>, <code>"dashboard"</code>, etc. |</p>
<p>---</p>
<h2>Callback Decorators</h2>
<h3>`@aiui.reply`</h3>
<p>Handle incoming chat messages. This is the core callback.</p>
<p>The <code>message</code> object has:</p>
<li><code>message.content</code> — user's text</li>
<li><code>message.session_id</code> — session identifier</li>
<li><code>message.images</code> — attached images (if any)</li>
<p>---</p>
<h3>`@aiui.welcome`</h3>
<p>Send a welcome message when a user connects.</p>
<p>---</p>
<h3>`@aiui.goodbye`</h3>
<p>Cleanup when a user disconnects.</p>
<p>---</p>
<h3>`@aiui.starters`</h3>
<p>Define conversation starters shown to new users.</p>
<p>---</p>
<h3>`@aiui.profiles`</h3>
<p>Define chat profiles (agent personas users can choose).</p>
<p>---</p>
<h3>`@aiui.page(slug, title, icon, group, order)`</h3>
<p>Register a custom dashboard page.</p>
<p>---</p>
<h3>`@aiui.on(event)`</h3>
<p>Listen for server events.</p>
<p>---</p>
<h3>`@aiui.login`</h3>
<p>Handle authentication.</p>
<p>---</p>
<h3>`@aiui.settings`</h3>
<p>Provide user settings.</p>
<p>---</p>
<h3>`@aiui.resume`</h3>
<p>Resume interrupted sessions.</p>
<p>---</p>
<h3>`@aiui.surface_action(surface_id)`</h3>
<p>Handle user actions from an A2UI surface (button clicks, form submits).</p>
<p>---</p>
<h2>Message Functions</h2>
<p>Async functions for sending messages to the user. Call inside callback handlers.</p>
<p>| Function | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>await aiui.say(text)</code> | Send a complete message |</p>
<p>| <code>await aiui.stream(text)</code> | Stream a response progressively |</p>
<p>| <code>await aiui.stream_token(token)</code> | Stream token-by-token |</p>
<p>| <code>await aiui.think(text)</code> | Show a thinking indicator |</p>
<p>| <code>await aiui.ask(question)</code> | Ask user a question (returns answer) |</p>
<p>| <code>await aiui.image(url)</code> | Send an image |</p>
<p>| <code>await aiui.audio(url)</code> | Send audio |</p>
<p>| <code>await aiui.video(url)</code> | Send video |</p>
<p>| <code>await aiui.file(url)</code> | Send a file |</p>
<p>| <code>await aiui.action_buttons(buttons)</code> | Show action buttons |</p>
<p>| <code>await aiui.tool(name, data)</code> | Show tool call result |</p>
<p>---</p>
<h2>UI Components</h2>
<p>Build custom page layouts with UI components.</p>
<p>| Component | Usage |</p>
<p>|-----------|-------|</p>
<p>| <code>aiui.layout(children)</code> | Root container for a page |</p>
<p>| <code>aiui.card(title, *, value, footer)</code> | Metric/stat card with title, value, and optional footer |</p>
<p>| <code>aiui.columns(children)</code> | Horizontal column layout |</p>
<p>| <code>aiui.chart(data, type)</code> | Chart (line, bar, pie) |</p>
<p>| <code>aiui.table(headers, rows)</code> | Data table |</p>
<p>| <code>aiui.text(content)</code> | Text block |</p>
<p>See Component API Reference for all 48 components.</p>

<p>Register custom features that appear in the dashboard.</p>
<p>| Function | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>aiui.register_feature(feature)</code> | Register a feature |</p>
<p>| <code>aiui.get_features()</code> | List all features |</p>
<p>| <code>aiui.get_feature(name)</code> | Get a specific feature |</p>
<p>| <code>aiui.auto_register_defaults()</code> | Auto-register built-in features |</p></noscript></div>
