<p>Test all 16 PraisonAIUI feature APIs using curl. Each example creates real data and verifies backend processing.</p>
<h2>Quick Start</h2>
<h2>CLI Integration Tests (`aiui test`)</h2>
<p>PraisonAIUI includes built-in integration tests via</p>
<p><code>aiui test</code>. These run against a live server and verify chat, memory, sessions,</p>
<p>and API endpoint health.</p>
<h3>Quick Start</h3>
<h3>Available Subcommands</h3>
<p>| Command | What It Tests |</p>
<p>|---------|---------------|</p>
<p>| <code>aiui test endpoints</code> | API endpoint availability (/health, /api/features, /api/sessions, /api/chat) |</p>
<p>| <code>aiui test chat</code> | Message sending, session history isolation, context recall |</p>
<p>| <code>aiui test memory</code> | Cross-session persistent memory (store + recall facts) |</p>
<p>| <code>aiui test sessions</code> | Session file persistence (survives server restarts) |</p>
<p>| <code>aiui test all</code> | Runs all of the above in sequence |</p>
<h3>Options</h3>
<li><code>--server</code> / <code>-s</code> — Server URL (default: <code>http://127.0.0.1:8082</code>)</li>
<li><code>--timeout</code> / <code>-t</code> — Response timeout in seconds (default: <code>30</code>)</li>
<h3>Example Output</h3>
<h3>Test Details</h3>
<p><strong>Endpoints</strong> (6 checks, 2 optional skips):</p>
<li><code>GET /api/features</code> — Feature registry health</li>
<li><code>GET /api/sessions</code> — Session listing</li>
<li><code>GET /api/chat/history</code> — Empty session history</li>
<li><code>POST /api/chat/send</code> — Chat message dispatch</li>
<li><code>GET /api/provider/health</code> — _(optional, skipped if no provider)_</li>
<li><code>GET /api/provider/agents</code> — _(optional, skipped if no provider)_</li>
<li><code>GET /health</code> — Server health check</li>
<p><strong>Chat</strong> (8 checks):</p>
<li>Sends a message to Session A, verifies response in history</li>
<li>Creates Session B, verifies history isolation (no cross-session leakage)</li>
<li>Verifies Session A retains context from earlier messages</li>
<p><strong>Memory</strong> (2 checks):</p>
<li>Sends a fact to Session 1 ("remember my name")</li>
<li>Asks a recall question in Session 2, verifies cross-session memory</li>
<p><strong>Sessions</strong> (4 checks):</p>
<li>Sends a message and verifies session file is created on disk</li>
<li>Verifies history API returns persisted messages</li>
<p>---</p>
