<p>All feature modules in PraisonAIUI implement a <strong>Protocol ABC</strong> pattern for type-safe, swappable backends.</p>
<h2>Pattern</h2>
<h2>Batch 1: Full SDK Wrappers</h2>
<p>| File | Protocol | SDK Class | Fallback | Getter |</p>
<p>|------|----------|-----------|----------|--------|</p>
<p>| <code>guardrails.py</code> | <code>GuardrailProtocol</code> | <code>SDKGuardrailManager</code> | <code>SimpleGuardrailManager</code> | <code>get_guardrail_manager()</code> |</p>
<p>| <code>tracing.py</code> | <code>TracingProtocol</code> | <code>SDKTracingManager</code> | <code>SimpleTracingManager</code> | <code>get_tracing_manager()</code> |</p>
<p>| <code>eval.py</code> | <code>EvalProtocol</code> | <code>SDKEvalManager</code> | <code>SimpleEvalManager</code> | <code>get_eval_manager()</code> |</p>
<p>| <code>approvals.py</code> | <code>ApprovalProtocol</code> | <code>SDKApprovalManager</code> | <code>SimpleApprovalManager</code> | <code>get_approval_manager()</code> |</p>
<h2>Batch 2: SDK Wrappers + Refactored Stores</h2>
<p>| File | Protocol | SDK Class | Fallback | Getter |</p>
<p>|------|----------|-----------|----------|--------|</p>
<p>| <code>security.py</code> | <code>SecurityProtocol</code> | <code>SDKSecurityManager</code> | <code>SimpleSecurityManager</code> | <code>get_security_manager()</code> |</p>
<p>| <code>telemetry.py</code> | <code>TelemetryProtocol</code> | <code>SDKTelemetryManager</code> | <code>SimpleTelemetryManager</code> | <code>get_telemetry_manager()</code> |</p>
<p>| <code>jobs.py</code> | <code>JobStoreProtocol</code> | <code>SDKJobStore</code> | <code>SimpleJobStore</code> | <code>get_job_store()</code> |</p>
<p>| <code>agents.py</code> | <code>AgentRegistryProtocol</code> | <code>SDKAgentRegistry</code> | <code>SimpleAgentRegistry</code> | <code>get_agent_registry()</code> |</p>
<h2>Batch 3: Formalized ABCs</h2>
<p>| File | Protocol | Notes |</p>
<p>|------|----------|-------|</p>
<p>| <code>sessions_ext.py</code> | <code>SessionProtocol</code> | Formalized existing SDK-first pattern |</p>
<p>| <code>schedules.py</code> | <code>ScheduleProtocol</code> | Formalized existing SDK-first pattern |</p>
<p>| <code>channels.py</code> | <code>ChannelProtocol</code> | SDK gap: no channel management API |</p>
<p>| <code>usage.py</code> | <code>UsageProtocol</code> | SDK gap: no token/cost tracking API |</p>
<p>| <code>logs.py</code> | <code>LogProtocol</code> | UI-only by design |</p>
<p>| <code>auth.py</code> | <code>AuthProtocol</code> | SDK gap: no auth API |</p>
<p>| <code>config_runtime.py</code> | <code>ConfigProtocol</code> | UI-only by design |</p>
<p>| <code>nodes.py</code> | <code>NodeProtocol</code> | SDK gap: no node/cluster API |</p>
<h2>Pre-existing</h2>
<p>| File | Protocol | Notes |</p>
<p>|------|----------|-------|</p>
<p>| <code>memory.py</code> | <code>MemoryProtocol</code> | P0 fix: SDK-first default |</p>
<p>| <code>skills.py</code> | <code>BaseFeatureProtocol</code> | P1 fix: <code>get_tool_catalog()</code> |</p>
<h2>SDK Gaps</h2>
<p>Features where <code>praisonaiagents</code> SDK lacks backend support:</p>
<p>| Feature | Gap | Recommendation |</p>
<p>|---------|-----|----------------|</p>
<p>| <strong>Usage</strong> | No token/cost tracking API | Add <code>UsageTracker</code> to <code>praisonaiagents.telemetry</code> |</p>
<p>| <strong>Auth</strong> | No authentication module | Add <code>praisonaiagents.auth</code> with key/session persistence |</p>
<p>| <strong>Nodes</strong> | No node/cluster management | Add <code>praisonaiagents.nodes</code> for node discovery |</p>
<p>| <strong>Channels</strong> | No channel management API | Add <code>praisonaiagents.channels</code> with <code>ChannelStore</code> |</p>
<p>| <strong>Config</strong> | No runtime config persistence | Add <code>praisonaiagents.config</code> with file-backed store |</p>
<h2>Naming Convention</h2>
<p>All feature classes MUST follow the <code>{Name}Feature</code> pattern:</p>
<p>| ✅ Correct | ❌ Incorrect |</p>
<p>|-----------|------------|</p>
<p>| <code>SchedulesFeature</code> | <code>PraisonAISchedules</code> |</p>
<p>| <code>KnowledgeFeature</code> | <code>PraisonAIKnowledge</code> |</p>
<p>| <code>AgentsCrudFeature</code> | <code>PraisonAIAgentsFeature</code> |</p>
<p>| <code>MemoryFeature</code> | <code>PraisonAIMemory</code> |</p>
<h3>Rules</h3>
<p>1. <strong>Class name</strong>: <code>{Name}Feature</code> — PascalCase, ends with <code>Feature</code></p>
<p>2. <strong><code>feature_name</code></strong>: <code>lowercase_snake</code> — this is the registry key, <strong>never change it</strong></p>
<p>3. <strong>Module file</strong>: <code>{name}.py</code> — matches <code>feature_name</code></p>
<p>4. <strong>Backward-compat aliases</strong>: old <code>PraisonAI{Name}</code> names are kept as aliases</p>
<h3>Example</h3>
<h3>Why This Convention?</h3>
<li><strong>AIUI is a universal UI framework</strong>, not PraisonAI-specific</li>
<li><strong>Class names signal framework identity</strong> to third-party developers</li>
<li><strong><code>feature_name</code> stays unchanged</strong> for backward compatibility with existing configs</li>
<li><strong>Aliases preserve imports</strong> for existing code using old names</li></noscript></div>
