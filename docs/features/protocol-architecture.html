></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Protocol Architecture Reference</h1>
<p>All feature modules in PraisonAIUI implement a <strong>Protocol ABC</strong> pattern for type-safe, swappable backends.</p>
<h2>Pattern</h2>
<h2>Batch 1: Full SDK Wrappers</h2>
<p>| File | Protocol | SDK Class | Fallback | Getter |</p>
<p>|------|----------|-----------|----------|--------|</p>
<p>| <code>guardrails.py</code> | <code>GuardrailProtocol</code> | <code>SDKGuardrailManager</code> | <code>SimpleGuardrailManager</code> | <code>get_guardrail_manager()</code> |</p>
<p>| <code>tracing.py</code> | <code>TracingProtocol</code> | <code>SDKTracingManager</code> | <code>SimpleTracingManager</code> | <code>get_tracing_manager()</code> |</p>
<p>| <code>eval.py</code> | <code>EvalProtocol</code> | <code>SDKEvalManager</code> | <code>SimpleEvalManager</code> | <code>get_eval_manager()</code> |</p>
<p>| <code>approvals.py</code> | <code>ApprovalProtocol</code> | <code>SDKApprovalManager</code> | <code>SimpleApprovalManager</code> | <code>get_approval_manager()</code> |</p>
<h2>Batch 2: SDK Wrappers + Refactored Stores</h2>
<p>| File | Protocol | SDK Class | Fallback | Getter |</p>
<p>|------|----------|-----------|----------|--------|</p>
<p>| <code>security.py</code> | <code>SecurityProtocol</code> | <code>SDKSecurityManager</code> | <code>SimpleSecurityManager</code> | <code>get_security_manager()</code> |</p>
<p>| <code>telemetry.py</code> | <code>TelemetryProtocol</code> | <code>SDKTelemetryManager</code> | <code>SimpleTelemetryManager</code> | <code>get_telemetry_manager()</code> |</p>
<p>| <code>jobs.py</code> | <code>JobStoreProtocol</code> | <code>SDKJobStore</code> | <code>SimpleJobStore</code> | <code>get_job_store()</code> |</p>
<p>| <code>agents.py</code> | <code>AgentRegistryProtocol</code> | <code>SDKAgentRegistry</code> | <code>SimpleAgentRegistry</code> | <code>get_agent_registry()</code> |</p>
<h2>Batch 3: Formalized ABCs</h2>
<p>| File | Protocol | Notes |</p>
<p>|------|----------|-------|</p>
<p>| <code>sessions_ext.py</code> | <code>SessionProtocol</code> | Formalized existing SDK-first pattern |</p>
<p>| <code>schedules.py</code> | <code>ScheduleProtocol</code> | Formalized existing SDK-first pattern |</p>
<p>| <code>channels.py</code> | <code>ChannelProtocol</code> | SDK gap: no channel management API |</p>
<p>| <code>usage.py</code> | <code>UsageProtocol</code> | SDK gap: no token/cost tracking API |</p>
<p>| <code>logs.py</code> | <code>LogProtocol</code> | UI-only by design |</p>
<p>| <code>auth.py</code> | <code>AuthProtocol</code> | SDK gap: no auth API |</p>
<p>| <code>config_runtime.py</code> | <code>ConfigProtocol</code> | UI-only by design |</p>
<p>| <code>nodes.py</code> | <code>NodeProtocol</code> | SDK gap: no node/cluster API |</p>
<h2>Pre-existing</h2>
<p>| File | Protocol | Notes |</p>
<p>|------|----------|-------|</p>
<p>| <code>memory.py</code> | <code>MemoryProtocol</code> | P0 fix: SDK-first default |</p>
<p>| <code>skills.py</code> | <code>BaseFeatureProtocol</code> | P1 fix: <code>get_tool_catalog()</code> |</p>
<h2>SDK Gaps</h2>
<p>Features where <code>praisonaiagents</code> SDK lacks backend support:</p>
<p>| Feature | Gap | Recommendation |</p>
<p>|---------|-----|----------------|</p>
<p>| <strong>Usage</strong> | No token/cost tracking API | Add <code>UsageTracker</code> to <code>praisonaiagents.telemetry</code> |</p>
<p>| <strong>Auth</strong> | No authentication module | Add <code>praisonaiagents.auth</code> with key/session persistence |</p>
<p>| <strong>Nodes</strong> | No node/cluster management | Add <code>praisonaiagents.nodes</code> for node discovery |</p>
<p>| <strong>Channels</strong> | No channel management API | Add <code>praisonaiagents.channels</code> with <code>ChannelStore</code> |</p>
<p>| <strong>Config</strong> | No runtime config persistence | Add <code>praisonaiagents.config</code> with file-backed store |</p>
<p>---</p>
<h2>Building & Extending — Key Rules</h2>
<h3>Agent Registration API</h3>
<p>&gt; [!CAUTION]</p>
<p>&gt; The old <code>create_agent()</code> function and <code>_agent_definitions</code> dict were <strong>removed</strong>. All agent registration now goes through the Protocol ABC.</p>
<h3>Frontend Manifest Requirement</h3>
<p>&gt; [!IMPORTANT]</p>
<p>&gt; The React frontend <strong>always</strong> fetches 3 JSON files before rendering, regardless of style:</p>
<p>&gt; - <code>/ui-config.json</code> — must return <code>{"style": "dashboard"}</code> (or <code>"chat"</code>, <code>"agents"</code>, etc.)</p>
<p>&gt; - <code>/docs-nav.json</code> — sidebar nav (can be <code>{"items": []}</code> for non-docs modes)</p>
<p>&gt; - <code>/route-manifest.json</code> — URL routing (can be <code>{}</code> for non-docs modes)</p>
<p>&gt;</p>
<p>&gt; If any of these 404, the user sees <strong>"Failed to load manifests"</strong> and the dashboard never renders.</p>
<p>In <code>server.py</code>, <code>create_app()</code> provides dynamic fallback handlers for these. If you are running</p>
<p>via <code>AIUIGateway</code>, these handlers are included automatically. If writing a custom server, ensure</p>
<p>these routes exist.</p>
<h3>Style System</h3>
<p>The <code>style</code> field in <code>/ui-config.json</code> controls which React component renders:</p>
<p>| Style | Component | Use Case |</p>
<p>|-------|-----------|----------|</p>
<p>| <code>"docs"</code> | Three-column docs layout | Documentation sites |</p>
<p>| <code>"dashboard"</code> | Full sidebar + pages | Feature management dashboard |</p>
<p>| <code>"chat"</code> | Chat-focused interface | Chat-only applications |</p>
<p>| <code>"agents"</code> | Agent selector + chat | Multi-agent interfaces |</p>
<p>| <code>"playground"</code> | Split-pane playground | Agent experimentation |</p>
<p>| <code>"custom"</code> | Flexible layout | Custom configurations |</p>
<p>Set via Python: <code>aiui.set_style("dashboard")</code></p>
<h3>Feature Protocol — How to Add a New Feature</h3>
<p>Every feature follows the same 4-step pattern:</p>
<p>1. <strong>Define the Protocol ABC</strong> — abstract methods for the capability</p>
<p>2. <strong>Implement <code>SimpleXxxManager</code></strong> — in-memory fallback, zero dependencies</p>
<p>3. <strong>Implement <code>SDKXxxManager</code></strong> — wraps <code>praisonaiagents</code> SDK (if available)</p>
<p>4. <strong>Provide <code>get_xxx_manager()</code></strong> — factory function, SDK-first with fallback</p>
<h3>Data Persistence</h3>
<li><strong>Sessions</strong>: JSON files in <code>~/.praisonaiui/sessions/{session_id}.json</code></li>
<li><strong>Memory</strong>: Auto-stored from chat (every user + assistant message → <code>short</code> type memory via SDK <code>Memory.store_short_term()</code>). Searchable via <code>/api/memory/search</code>. Filterable by <code>session_id</code> via <code>/api/memory/session/{id}</code></li>
<li><strong>Knowledge</strong>: Stored via <code>/api/knowledge</code> (text) or <code>/api/knowledge/add-file</code> (file ingest). Searched via <code>/api/knowledge/search</code>. Context auto-injected into chat prompts when relevant entries exist. Uses SDK <code>Knowledge</code> class with RAG pipeline when <code>[knowledge]</code> extras installed</li>
<li><strong>Agents</strong>: In-memory by default; <code>SimpleAgentRegistry</code> persists to data file if <code>set_data_file()</code> called</li>
<li><strong>Schedules</strong>: <code>FileScheduleStore</code> from <code>praisonaiagents</code> SDK persists to disk</li>
<li><strong>Config</strong>: Runtime config via <code>/api/config_runtime</code>, not persisted by default</li>
<h3>Common Pitfalls</h3>
<p>| Pitfall | Solution |</p>
<p>|---------|----------|</p>
<p>| <code>ImportError: _agent_definitions</code> | Use <code>get_agent_registry()</code> instead |</p>
<p>| "Failed to load manifests" in browser | Ensure <code>/ui-config.json</code> route exists and returns valid JSON with <code>style</code> field |</p>
<p>| Port already in use | <code>lsof -ti :PORT \| xargs kill -9</code> before starting |</p>
<p>| Chat returns no response | Check <code>OPENAI_API_KEY</code> is set in the running process |</p>
<p>| <code>praisonai_agents: false</code> in <code>/health</code> | Install <code>praisonaiagents</code> package |</p>
<p>| Features show 0 count | Features auto-register on import; check <code>server.py</code> initializes them |</p>
<p>---</p>
<h2>Naming Convention</h2>
<p>All feature classes MUST follow the <code>{Name}Feature</code> pattern:</p>
<p>| ✅ Correct | ❌ Incorrect |</p>
<p>|-----------|------------|</p>
<p>| <code>SchedulesFeature</code> | <code>PraisonAISchedules</code> |</p>
<p>| <code>KnowledgeFeature</code> | <code>PraisonAIKnowledge</code> |</p>
<p>| <code>AgentsCrudFeature</code> | <code>PraisonAIAgentsFeature</code> |</p>
<p>| <code>MemoryFeature</code> | <code>PraisonAIMemory</code> |</p>
<h3>Rules</h3>
<p>1. <strong>Class name</strong>: <code>{Name}Feature</code> — PascalCase, ends with <code>Feature</code></p>
<p>2. <strong><code>feature_name</code></strong>: <code>lowercase_snake</code> — this is the registry key, <strong>never change it</strong></p>
<p>3. <strong>Module file</strong>: <code>{name}.py</code> — matches <code>feature_name</code></p>
<p>4. <strong>Backward-compat aliases</strong>: old <code>PraisonAI{Name}</code> names are kept as aliases</p>
<h3>Example</h3>
<h3>Why This Convention?</h3>
<li><strong>AIUI is a universal UI framework</strong>, not PraisonAI-specific</li>
<li><strong>Class names signal framework identity</strong> to third-party developers</li>
<li><strong><code>feature_name</code> stays unchanged</strong> for backward compatibility with existing configs</li>
<li><strong>Aliases preserve imports</strong> for existing code using old names</li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/protocol-architecture.source.md", "text": "---\nnav_title: Protocol architecture\n---\n\n# Protocol Architecture Reference\n\nAll feature modules in PraisonAIUI implement a **Protocol ABC** pattern for type-safe, swappable backends.\n\n## Pattern\n\n```\nFeatureProtocol (ABC)              \u003c- abstract interface\n  ├── SDKFeatureManager            \u003c- wraps praisonaiagents SDK\n  └── SimpleFeatureManager         \u003c- in-memory fallback\nget_feature_manager()              \u003c- SDK-first factory\n```\n\n## Batch 1: Full SDK Wrappers\n\n| File | Protocol | SDK Class | Fallback | Getter |\n|------|----------|-----------|----------|--------|\n| `guardrails.py` | `GuardrailProtocol` | `SDKGuardrailManager` | `SimpleGuardrailManager` | `get_guardrail_manager()` |\n| `tracing.py` | `TracingProtocol` | `SDKTracingManager` | `SimpleTracingManager` | `get_tracing_manager()` |\n| `eval.py` | `EvalProtocol` | `SDKEvalManager` | `SimpleEvalManager` | `get_eval_manager()` |\n| `approvals.py` | `ApprovalProtocol` | `SDKApprovalManager` | `SimpleApprovalManager` | `get_approval_manager()` |\n\n## Batch 2: SDK Wrappers + Refactored Stores\n\n| File | Protocol | SDK Class | Fallback | Getter |\n|------|----------|-----------|----------|--------|\n| `security.py` | `SecurityProtocol` | `SDKSecurityManager` | `SimpleSecurityManager` | `get_security_manager()` |\n| `telemetry.py` | `TelemetryProtocol` | `SDKTelemetryManager` | `SimpleTelemetryManager` | `get_telemetry_manager()` |\n| `jobs.py` | `JobStoreProtocol` | `SDKJobStore` | `SimpleJobStore` | `get_job_store()` |\n| `agents.py` | `AgentRegistryProtocol` | `SDKAgentRegistry` | `SimpleAgentRegistry` | `get_agent_registry()` |\n\n## Batch 3: Formalized ABCs\n\n| File | Protocol | Notes |\n|------|----------|-------|\n| `sessions_ext.py` | `SessionProtocol` | Formalized existing SDK-first pattern |\n| `schedules.py` | `ScheduleProtocol` | Formalized existing SDK-first pattern |\n| `channels.py` | `ChannelProtocol` | SDK gap: no channel management API |\n| `usage.py` | `UsageProtocol` | SDK gap: no token/cost tracking API |\n| `logs.py` | `LogProtocol` | UI-only by design |\n| `auth.py` | `AuthProtocol` | SDK gap: no auth API |\n| `config_runtime.py` | `ConfigProtocol` | UI-only by design |\n| `nodes.py` | `NodeProtocol` | SDK gap: no node/cluster API |\n\n## Pre-existing\n\n| File | Protocol | Notes |\n|------|----------|-------|\n| `memory.py` | `MemoryProtocol` | P0 fix: SDK-first default |\n| `skills.py` | `BaseFeatureProtocol` | P1 fix: `get_tool_catalog()` |\n\n## SDK Gaps\n\nFeatures where `praisonaiagents` SDK lacks backend support:\n\n| Feature | Gap | Recommendation |\n|---------|-----|----------------|\n| **Usage** | No token/cost tracking API | Add `UsageTracker` to `praisonaiagents.telemetry` |\n| **Auth** | No authentication module | Add `praisonaiagents.auth` with key/session persistence |\n| **Nodes** | No node/cluster management | Add `praisonaiagents.nodes` for node discovery |\n| **Channels** | No channel management API | Add `praisonaiagents.channels` with `ChannelStore` |\n| **Config** | No runtime config persistence | Add `praisonaiagents.config` with file-backed store |\n\n---\n\n## Building \u0026 Extending — Key Rules\n\n### Agent Registration API\n\n\u003e [!CAUTION]\n\u003e The old `create_agent()` function and `_agent_definitions` dict were **removed**. All agent registration now goes through the Protocol ABC.\n\n```python\n# ✅ Correct — use the registry singleton\nfrom praisonaiui.features.agents import get_agent_registry\n\nregistry = get_agent_registry()\n\n# Create\nregistry.create({\n    \"name\": \"MyAgent\",\n    \"description\": \"Does X\",\n    \"instructions\": \"You are ...\",\n    \"model\": \"gpt-4o-mini\",\n    \"icon\": \"🤖\",\n})\n\n# List \u0026 check\nexisting = registry.list_all()  # returns list of dicts\nagent = registry.get(\"agent-id-here\")\n\n# Update / Delete\nregistry.update(\"agent-id\", {\"model\": \"gpt-4o\"})\nregistry.delete(\"agent-id\")\n```\n\n### Frontend Manifest Requirement\n\n\u003e [!IMPORTANT]\n\u003e The React frontend **always** fetches 3 JSON files before rendering, regardless of style:\n\u003e - `/ui-config.json` — must return `{\"style\": \"dashboard\"}` (or `\"chat\"`, `\"agents\"`, etc.)\n\u003e - `/docs-nav.json` — sidebar nav (can be `{\"items\": []}` for non-docs modes)\n\u003e - `/route-manifest.json` — URL routing (can be `{}` for non-docs modes)\n\u003e\n\u003e If any of these 404, the user sees **\"Failed to load manifests\"** and the dashboard never renders.\n\nIn `server.py`, `create_app()` provides dynamic fallback handlers for these. If you are running\nvia `AIUIGateway`, these handlers are included automatically. If writing a custom server, ensure\nthese routes exist.\n\n### Style System\n\nThe `style` field in `/ui-config.json` controls which React component renders:\n\n| Style | Component | Use Case |\n|-------|-----------|----------|\n| `\"docs\"` | Three-column docs layout | Documentation sites |\n| `\"dashboard\"` | Full sidebar + pages | Feature management dashboard |\n| `\"chat\"` | Chat-focused interface | Chat-only applications |\n| `\"agents\"` | Agent selector + chat | Multi-agent interfaces |\n| `\"playground\"` | Split-pane playground | Agent experimentation |\n| `\"custom\"` | Flexible layout | Custom configurations |\n\nSet via Python: `aiui.set_style(\"dashboard\")`\n\n### Feature Protocol — How to Add a New Feature\n\nEvery feature follows the same 4-step pattern:\n\n1. **Define the Protocol ABC** — abstract methods for the capability\n2. **Implement `SimpleXxxManager`** — in-memory fallback, zero dependencies\n3. **Implement `SDKXxxManager`** — wraps `praisonaiagents` SDK (if available)\n4. **Provide `get_xxx_manager()`** — factory function, SDK-first with fallback\n\n```python\n# Minimal feature skeleton\nfrom abc import ABC, abstractmethod\n\nclass MyProtocol(ABC):\n    @abstractmethod\n    def do_thing(self, data): ...\n\nclass SimpleMyManager(MyProtocol):\n    def do_thing(self, data):\n        return {\"status\": \"ok\", \"data\": data}\n\n_manager = None\n\ndef get_my_manager() -\u003e MyProtocol:\n    global _manager\n    if _manager is None:\n        try:\n            # Try SDK-first\n            from praisonaiagents.my_module import MySDKClass\n            _manager = SDKMyManager()\n        except ImportError:\n            _manager = SimpleMyManager()\n    return _manager\n```\n\n### Data Persistence\n\n- **Sessions**: JSON files in `~/.praisonaiui/sessions/{session_id}.json`\n- **Memory**: Auto-stored from chat (every user + assistant message → `short` type memory via SDK `Memory.store_short_term()`). Searchable via `/api/memory/search`. Filterable by `session_id` via `/api/memory/session/{id}`\n- **Knowledge**: Stored via `/api/knowledge` (text) or `/api/knowledge/add-file` (file ingest). Searched via `/api/knowledge/search`. Context auto-injected into chat prompts when relevant entries exist. Uses SDK `Knowledge` class with RAG pipeline when `[knowledge]` extras installed\n- **Agents**: In-memory by default; `SimpleAgentRegistry` persists to data file if `set_data_file()` called\n- **Schedules**: `FileScheduleStore` from `praisonaiagents` SDK persists to disk\n- **Config**: Runtime config via `/api/config_runtime`, not persisted by default\n\n### Common Pitfalls\n\n| Pitfall | Solution |\n|---------|----------|\n| `ImportError: _agent_definitions` | Use `get_agent_registry()` instead |\n| \"Failed to load manifests\" in browser | Ensure `/ui-config.json` route exists and returns valid JSON with `style` field |\n| Port already in use | `lsof -ti :PORT \\| xargs kill -9` before starting |\n| Chat returns no response | Check `OPENAI_API_KEY` is set in the running process |\n| `praisonai_agents: false` in `/health` | Install `praisonaiagents` package |\n| Features show 0 count | Features auto-register on import; check `server.py` initializes them |\n\n---\n\n## Naming Convention\n\nAll feature classes MUST follow the `{Name}Feature` pattern:\n\n| ✅ Correct | ❌ Incorrect |\n|-----------|------------|\n| `SchedulesFeature` | `PraisonAISchedules` |\n| `KnowledgeFeature` | `PraisonAIKnowledge` |\n| `AgentsCrudFeature` | `PraisonAIAgentsFeature` |\n| `MemoryFeature` | `PraisonAIMemory` |\n\n### Rules\n\n1. **Class name**: `{Name}Feature` — PascalCase, ends with `Feature`\n2. **`feature_name`**: `lowercase_snake` — this is the registry key, **never change it**\n3. **Module file**: `{name}.py` — matches `feature_name`\n4. **Backward-compat aliases**: old `PraisonAI{Name}` names are kept as aliases\n\n### Example\n\n```python\n# In features/schedules.py\n\nclass SchedulesFeature(BaseFeatureProtocol):\n    feature_name = \"schedules\"  # Registry key — never change\n    \n    def routes(self):\n        return [Route(\"/api/schedules\", ...)]\n\n# Backward-compat alias (at end of file)\nPraisonAISchedules = SchedulesFeature\n```\n\n### Why This Convention?\n\n- **AIUI is a universal UI framework**, not PraisonAI-specific\n- **Class names signal framework identity** to third-party developers\n- **`feature_name` stays unchanged** for backward compatibility with existing configs\n- **Aliases preserve imports** for existing code using old names\n"}</script>
