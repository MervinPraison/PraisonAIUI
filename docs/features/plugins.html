<p>A UI plugin is a Python package that adds pages, blocks, chat tool renderers,</p>
<p>settings sections, sidebar groups, theme presets, HTTP routes and CLI commands</p>
<p>to the React app shell (<code>style: app</code>, or</p>
<p><code>AIUI_SHELL=app</code>). Installing the package is the whole setup: the server finds</p>
<p>it through the <code>praisonaiui.plugins</code> entry point.</p>
<p>The smallest complete plugin lives in</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/plugins/aiui-hello-plugin/"><code>examples/plugins/aiui-hello-plugin</code></a>.</p>
<p><code>aiui run app.py</code> opens the app shell (<code>style: app</code>) unless the app, its YAML</p>
<p>or <code>--style</code> picks another style, so a plain <code>@aiui.reply</code> app needs no flag.</p>
<p><code>AIUI_SHELL=app</code> only switches the <code>dashboard</code> style to the app shell; it</p>
<p>leaves an explicit <code>chat</code> or other React style alone (the server logs</p>
<p><code>AIUI_SHELL=app ignored: style is 'chat'</code>).</p>
<p>Then open <code>/hello</code> (a React page) and <code>/hello-blocks</code> (a server-driven page).</p>
<p>!!! note "Three different things are called plugins"</p>
<li><strong>UI plugins</strong> (this page): Python packages, entry point <code>praisonaiui.plugins</code>,</li>
<p>React app shell only. Policy in YAML <code>extensions:</code>.</p>
<li><strong>Dashboard plugins</strong>: folders with a <code>manifest.json</code> under</li>
<p><code>dashboard-plugins/</code>, vanilla JS views (see Agent UI host).</p>
<p>The app shell still hosts them as legacy pages.</p>
<li><strong>Docs plugins</strong>: <code>site.plugins</code> in <code>aiui.yaml</code> (static site compiler hooks).</li>
<p>The default is <code>nav-intercept</code>; see</p>
<p>Deploy to GitHub Pages → Legacy plugins.</p>
<h2>How it fits together</h2>
<p>1. The server imports each entry point once, isolates failures, and lists what</p>
<p>the plugin contributes in the shell manifest.</p>
<p>2. The shell installs <code>window.__AIUI_SDK__</code> and then <code>import()</code>s every plugin</p>
<p>module named in the manifest. An import map points the bare specifiers</p>
<p><code>react</code>, <code>react/jsx-runtime</code>, <code>react-dom</code>, <code>react-dom/client</code> and</p>
<p><code>@aiui/sdk</code> at small shims that re-export the shell's own modules, so a</p>
<p>plugin shares the shell's single React (hooks work, nothing is bundled twice).</p>
<p>3. A module registers what it provides through <code>@aiui/sdk</code>, or default-exports</p>
<p>a component that the shell registers under the page id / block type / tool name.</p>
<p>The app's own React pages and blocks use the same mechanism. The shell and the</p>
<p>SDK are a small core that names no page: the chat page and its "New chat"</p>
<p>command are the first-party plugin <code>builtin.chat</code> in</p>
<p><code>src/frontend/src/builtin</code>, registered with <code>registerPage</code> and</p>
<p><code>registerCommand</code> when the manifest lists the page; the approval toasts are</p>
<p><code>builtin.approvals</code> (on <code>notify</code> and <code>navigate</code>); and the core block types are</p>
<p>registered with <code>registerBlock</code>. A test in the frontend</p>
<p>(<code>shell/core-purity.test.ts</code>) fails if the core imports a feature module or</p>
<p>names a built-in page.</p>
<h2>The Python side</h2>
<p>The value names a plugin object, a class (instantiated with no arguments) or a</p>
<p>zero-argument factory. The entry-point name becomes a URL segment, so it must</p>
<p>match <code>[a-z0-9][a-z0-9_-]*</code>.</p>
<p>Every member except <code>name</code> is optional:</p>
<p>| Member | Returns | Effect |</p>
<p>|---|---|---|</p>
<p>| <code>name</code> | <code>str</code> | Plugin id (<code>/api/plugins/&lt;name&gt;</code>, <code>/_plugins/&lt;name&gt;/</code>, <code>aiui &lt;name&gt;</code>) |</p>
<p>| <code>version</code> | <code>str</code> | Shown by <code>aiui plugins list</code> |</p>
<p>| <code>sdk</code> | <code>int</code> | Browser SDK major the plugin targets (default <code>1</code>); a mismatch marks it <code>incompatible</code> |</p>
<p>| <code>pages()</code> | <code>PageSpec</code> or dicts | Sidebar pages |</p>
<p>| <code>blocks()</code> | <code>BlockSpec</code> | Renderers for block types |</p>
<p>| <code>tool_renderers()</code> | <code>ToolRendererSpec</code> | Chat renderers for tool calls |</p>
<p>| <code>routes()</code> | Starlette routes | Mounted under <code>/api/plugins/&lt;name&gt;</code> |</p>
<p>| <code>static_dir()</code> | <code>Path</code> | Served at <code>/_plugins/&lt;name&gt;/</code> |</p>
<p>| <code>features()</code> | feature protocols | Registered like built-in features (an enabled built-in's names win) |</p>
<p>| <code>cli_commands()</code> | <code>typer.Typer</code> or click command | <code>aiui &lt;name&gt; …</code> and <code>aiui plugins &lt;name&gt; …</code> |</p>
<p>| <code>setup(ctx)</code> | <code>None</code> | Called once per <code>create_app()</code> with <code>{"style", "config"}</code> |</p>
<p>| <code>lifespan(app)</code> | async/sync context manager | Entered on ASGI startup and exited LIFO on shutdown (in both <code>create_app()</code> and <code>create_shell_app()</code>); failures are isolated per plugin |</p>
<p>| <code>settings()</code> | <code>SettingsSectionSpec</code> or dicts | Sections of the shell's settings dialog (below) |</p>
<p>| <code>nav_groups()</code> | <code>NavGroupSpec</code> or dicts | The sidebar groups your pages use, with their position |</p>
<p>| <code>themes()</code> | <code>ThemeSpec</code> or dicts | Theme presets made of seed tokens |</p>
<p>| <code>layouts()</code> | <code>LayoutSpec</code> or dicts | App shell frames (ADR 0003) the viewer can pick (below) |</p>
<p><code>PageSpec</code>, <code>BlockSpec</code>, <code>ToolRendererSpec</code>, <code>SettingsSectionSpec</code>,</p>
<p><code>SettingsField</code>, <code>NavGroupSpec</code>, <code>ThemeSpec</code>, <code>LayoutSpec</code> and</p>
<p><code>get_plugin_settings</code> are importable from <code>praisonaiui</code> (or <code>praisonaiui.plugin_registry</code>). Dicts with</p>
<p>the same field names work too.</p>
<h3>Page kinds</h3>
<p>| <code>kind</code> | Renders | Needs |</p>
<p>|---|---|---|</p>
<p>| <code>react</code> | The component from <code>module</code> (default export, or <code>export</code>) | <code>module</code> |</p>
<p>| <code>blocks</code> | A server-driven block tree (see below) | <code>api_endpoint</code>, default <code>/api/plugins/&lt;name&gt;/pages/&lt;id&gt;</code> |</p>
<p>| <code>iframe</code> | <code>module</code> in a sandboxed iframe (no same-origin access) | <code>module</code> |</p>
<p>These three are the only kinds a plugin can use. <code>native</code> and <code>legacy</code> are</p>
<p>first-party only (the shell never imports a plugin's legacy view): a plugin</p>
<p>page with another <code>kind</code>, or a misspelt one, is dropped with a warning and</p>
<p><code>aiui plugins doctor</code> fails on it.</p>
<p>A relative <code>module</code> (<code>"hello.js"</code>) resolves into <code>static_dir()</code>; the server</p>
<p>then serves <code>/_plugins/&lt;name&gt;/hello.js</code> and adds its <code>sha384</code> integrity to the</p>
<p>manifest and the import map.</p>
<p>The integrity is a <strong>cache-consistency</strong> check, not tamper protection: the</p>
<p>server hashes the file it is about to serve (re-hashed when the file changes,</p>
<p>so a rebuilt bundle keeps loading), which guards against a stale or partly</p>
<p>written file between the page render and the module fetch. Someone who can</p>
<p>change files in the plugin's <code>static_dir</code> can also change what is hashed.</p>
<p>Declare <code>integrity=</code> on the <code>PageSpec</code> to pin a hash you computed at build</p>
<p>time. When auth is enforced the page carries no manifest (and so no import-map</p>
<p>integrity) before login; the shell loads plugin modules afterwards.</p>
<p>When two sources use the same page id, the first wins: pages registered by the</p>
<p>app (<code>aiui.register_page</code>), then built-in pages, then entry-point plugins (in</p>
<p>discovery order), then dashboard-plugin folders. <code>aiui plugins doctor</code> warns</p>
<p>about shadowed ids.</p>
<h3>Settings, nav groups and theme presets</h3>
<p>Three hooks contribute to the shell itself rather than to a page. They were</p>
<p>added under SDK 1; a shell that has them lists the features <code>settings</code>,</p>
<p><code>nav-groups</code> and <code>theme-presets</code> in <code>SDK_FEATURES</code>, and an older host simply</p>
<p>never calls them.</p>
<p><strong>Nav groups.</strong> <code>NavGroupSpec(name, order=None, folded=False)</code> names a group</p>
<p>that your pages use in <code>PageSpec.group</code>. <code>order</code> places it among the groups:</p>
<p>the groups the app lists in <code>layout.groups.order</code> (<code>Agent</code>, <code>Work</code>, <code>Control</code></p>
<p>by default) sit at 100, 200 and 300, groups without an order follow them, and</p>
<p><code>layout.groups.last</code> (<code>Settings</code>) stays last. So <code>order=250</code> puts the group</p>
<p>between Work and Control, and <code>order=50</code> puts it first. <code>folded=True</code> starts</p>
<p>the group collapsed until the viewer opens it. The app's own configuration</p>
<p>wins: a plugin cannot move a group that <code>layout.groups</code> (or</p>
<p><code>set_dashboard(groups=...)</code>) names.</p>
<p>Every frame lists a declared group. The classic frame shows all groups in its</p>
<p>sidebar; the built-in layouts, which keep the app's own groups in More (⌘K),</p>
<p>still show the groups plugins declared, in this order and folded as declared:</p>
<p>under the primary pages in <code>chat</code>, <code>chat-canvas</code>, <code>workbench</code> and <code>mission</code>,</p>
<p>in the rail in <code>command</code>, and under More tools in <code>guided</code>.</p>
<p><strong>Settings.</strong> A</p>
<p><code>SettingsSectionSpec(id, title, fields, description="", order=100)</code> becomes a section of the shell's settings dialog, which opens from</p>
<p>"Plugin settings" (the sliders button in the classic header, a "Plugin</p>
<p>settings" row or rail button in every built-in layout, shown only while some</p>
<p>plugin has a section) or from "Plugin settings" in the command palette. Each</p>
<p><code>SettingsField(key, label="", type="string", default=None, description="", options=None)</code></p>
<p>is drawn from its type:</p>
<p>| <code>type</code> | Control | Default value |</p>
<p>|---|---|---|</p>
<p>| <code>string</code> | One-line text input | <code>""</code> |</p>
<p>| <code>text</code> | Multi-line text area | <code>""</code> |</p>
<p>| <code>number</code> | Number input | <code>0</code> |</p>
<p>| <code>boolean</code> | Switch | <code>False</code> |</p>
<p>| <code>select</code> | Select from <code>options</code> (strings or <code>{"value", "label"}</code> dicts) | the first option |</p>
<p>The values are stored per plugin in</p>
<p><code>$AIUI_DATA_DIR/plugin-settings/&lt;name&gt;.json</code> (default <code>~/.praisonaiui</code>). The</p>
<p>server serves each section at <code>/api/plugins/&lt;name&gt;/settings/&lt;id&gt;</code>: <code>GET</code></p>
<p>returns <code>{"values": {...}}</code> with the defaults filled in, and `PUT</p>
<p>{"values": {...}}` validates every key against its field (unknown keys, wrong</p>
<p>types and options not in the list answer 400 with `{"error", "fields":</p>
<p>{key: reason}}`, and nothing is written). That path is reserved for a plugin</p>
<p>that declares <code>settings()</code>: it is matched before the plugin's own routes. It</p>
<p>sits under the same mount as <code>routes()</code>, so it is authenticated like every</p>
<p>route and default-deny for entry-point plugins on remote or auth-enforced</p>
<p>servers unless they are named in <code>extensions.enabled</code>.</p>
<p><code>get_plugin_settings(name, section)</code> returns the same values to Python; a</p>
<p>stored value that no longer fits its field (an option you removed) falls back</p>
<p>to the default.</p>
<p><strong>Theme presets.</strong> A <code>ThemeSpec(id, label, light={}, dark={})</code> sets L0 seed</p>
<p>tokens per colour mode: <code>--seed-*</code> (<code>--seed-accent</code>, <code>--seed-tint</code>,</p>
<p><code>--seed-paper</code>, <code>--seed-ink</code> …), <code>--radius</code>, <code>--tint-mix</code> and <code>--accent-mix</code>.</p>
<p>Every surface, text and accent colour is derived from the seeds (see</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/DESIGN.md">DESIGN.md</a>), so a preset never names a shadcn</p>
<p>variable. Values are plain CSS values; anything else (another property, <code>;</code>,</p>
<p>braces, <code>url(...)</code>) is rejected. The viewer picks a preset in the command</p>
<p>palette ("Sunrise theme", "Default theme"); the choice is kept per browser.</p>
<p>Invalid entries of all three hooks (and of <code>layouts()</code>) are dropped one by</p>
<p>one with a warning, and one hook that raises does not drop the others. The</p>
<p>warning is printed once per start in the <code>aiui run</code> terminal (and on the Logs</p>
<p>page), and <code>aiui plugins doctor</code> runs every entry through the same checks and</p>
<p>fails on each one it would drop. The</p>
<p>contributions travel on the plugin's record in the shell manifest</p>
<p>(<code>plugins[].settings</code>, <code>plugins[].navGroups</code>, <code>plugins[].themes</code>), only for</p>
<p>plugins whose browser surfaces the viewer may load.</p>
<h3>Built-in plugins</h3>
<p>The pages and features that ship with PraisonAIUI use the same mechanism.</p>
<p>Each domain is a first-party plugin record in <code>praisonaiui.builtin</code>: for</p>
<p>example <code>builtin.chat</code> holds the Chat and Chat + Canvas pages with the <code>chat</code></p>
<p>and <code>attachments</code> features, and <code>builtin.work</code> holds Work Hub, Kanban and</p>
<p>Jobs Board with the <code>kanban</code> feature. Features with no page of their own have</p>
<p>a record each (<code>builtin.tts</code>, <code>builtin.pwa</code>, <code>builtin.video</code> …). The server</p>
<p>reads pages and features through the plugin registry, so the extension policy</p>
<p>can switch a whole domain off:</p>
<p>or <code>aiui.set_extensions(disabled=["builtin.training"])</code>. A disabled built-in</p>
<p>contributes no pages: they leave <code>GET /api/pages</code>, the shell manifest and the</p>
<p>sidebar. Its feature routes are not mounted (<code>/api/training/...</code> returns 404),</p>
<p>the server does not load its feature modules, and a bundled dashboard-plugin</p>
<p>folder that belongs to it (<code>kanban</code> belongs to <code>builtin.work</code>, <code>video-studio</code></p>
<p>to <code>builtin.video</code>, the <code>sample-board</code> demo page in the Examples group to</p>
<p><code>builtin.examples</code>) is not served either. The same holds for the routes the</p>
<p>host itself serves for a built-in: <code>builtin.mcp</code> owns <code>/api/mcp/*</code>,</p>
<p><code>builtin.debug</code> owns <code>/api/debug</code>, <code>builtin.overview</code> owns</p>
<p><code>GET /api/overview</code>, <code>builtin.feedback</code> owns <code>GET /api/feedback</code> and</p>
<p><code>builtin.jobs</code> owns the optional <code>/api/jobs</code> proxy (<code>set_jobs_proxy</code>), so</p>
<p>disabling them returns 404 there. <code>builtin.logs</code> serves <code>GET /api/logs</code> and</p>
<p><code>/api/logs/*</code> from its feature, and installs its log handler only while it is</p>
<p>on. With the built-in off, an entry-point</p>
<p>plugin may use its page ids and feature names.</p>
<p>A few host routes stay mounted whichever built-ins are off, because the host,</p>
<p>several pages or the CLI use them: <code>GET /api/status</code> (<code>aiui status</code>, the same</p>
<p>data as <code>/api/overview</code>), <code>POST /api/feedback</code> (the chat thumbs),</p>
<p><code>/api/config</code>, <code>/api/gateway/status</code>, <code>/api/provider*</code>, the chat protocol</p>
<p>(<code>/agents</code>, <code>/sessions</code>, <code>/run</code>, <code>/cancel</code>, <code>/teams</code>, <code>/starters</code>,</p>
<p><code>/profiles</code>, <code>/welcome</code>, <code>/api/actions/*</code>, thread sharing), <code>/health*</code>, auth,</p>
<p><code>/api/pages</code>, <code>/api/features</code>, <code>/api/shell/manifest</code> and <code>/api/plugins</code>.</p>
<p>Disabling <code>builtin.config</code> removes its page only. Where a page id is also a</p>
<p>JSON path (<code>/agents</code>, <code>/sessions</code>, or an app page named like an API), a</p>
<p>browser navigation to <code>/&lt;page id&gt;</code> gets the page and <code>fetch()</code> gets the JSON,</p>
<p>under the <code>dashboard</code> and <code>app</code> styles.</p>
<p><code>tests/unit/test_route_table_snapshot.py</code> pins the default route table.</p>
<p>Some features are <strong>required</strong>: the server itself depends on <code>auth</code>, <code>theme</code>,</p>
<p><code>chat</code>, <code>usage</code>, <code>config_runtime</code> and <code>sessions_ext</code>. Disabling their record</p>
<p>(<code>builtin.auth</code>, <code>builtin.theme-picker</code>, <code>builtin.chat</code>, <code>builtin.usage</code>,</p>
<p><code>builtin.config</code>, <code>builtin.sessions</code>) removes its pages and its other</p>
<p>features, keeps the required feature mounted and logs a warning. Disabling</p>
<p><code>builtin.auth</code> therefore never turns authentication off.</p>
<li>Built-ins are trusted and on by default. <code>extensions.enabled</code> is an</li>
<p>allowlist for third-party plugins only, so it never hides a built-in page.</p>
<li>Only the <code>builtin.</code> name disables a built-in: <code>disabled: [logs]</code> means a</li>
<p>third-party plugin called <code>logs</code>. A <code>builtin.</code> name that matches no record</p>
<p>logs a warning.</p>
<li>The page-level controls still apply on top: <code>aiui.set_pages([...])</code>,</li>
<p><code>pages.enabled</code> / <code>pages.disabled</code> in <code>config.yaml</code> and <code>aiui.remove_page()</code></p>
<p>hide single pages (their APIs stay mounted), and <code>aiui.register_page()</code></p>
<p>with a built-in id replaces that page.</p>
<li><code>register_feature()</code> before the server starts replaces a built-in feature of</li>
<p>the same name, as before.</p>
<li><code>GET /api/plugins?origin=builtin</code> (or <code>origin=all</code>) lists the built-in</li>
<p>records with their status (and <code>required: true</code> where the host needs one</p>
<p>of their features). Without the parameter the endpoint lists</p>
<p>third-party plugins only, as before.</p>
<h2>The browser side</h2>
<p>A plugin module is plain ESM. Write it by hand (the example uses</p>
<p><code>react/jsx-runtime</code> directly) or build it with React and the SDK as externals:</p>
<p>Only those five bare specifiers are mapped. Anything else must be bundled into</p>
<p>the plugin file or imported by full URL.</p>
<h3>`@aiui/sdk`</h3>
<p>Registration:</p>
<p>| Export | Use |</p>
<p>|---|---|</p>
<p>| <code>SDK_VERSION</code> | <code>1</code> |</p>
<p>| <code>SDK_FEATURES</code> | List of capability names, for feature detection |</p>
<p>| <code>registerPage(id, Component)</code> | Component receives <code>{ page }</code> (its manifest entry). A zero-argument arrow function is treated as a lazy loader: <code>registerPage('x', () =&gt; import('./X.js'))</code> |</p>
<p>| <code>registerBlock(type, Component, options?)</code> | Component receives <code>{ node, page }</code>; <code>node</code> is <code>{ type, props, children }</code>. It also overrides a core block type of the same name. <code>{ fallback: true }</code> registers a default that anything else overrides |</p>
<p>| <code>registerToolRenderer(toolName, Component)</code> | Chat tool call UI; receives assistant-ui tool part props (<code>toolName</code>, <code>args</code>, <code>argsText</code>, <code>result</code>, <code>status</code>, …) |</p>
<p>| <code>registerSlot(name, Component, options?)</code> | Add a component to a slot of the shell |</p>
<p>| <code>registerCommand(command)</code> | Add an entry to the command palette. Returns a function that removes it. Groups list before the pages, in registration order; the groups <code>Preferences</code>, <code>Layout</code> and <code>Theme</code> list after them |</p>
<p>| <code>registerView(pageId, render, cleanup?)</code> | A vanilla view for a legacy page (same as <code>window.aiui.registerView</code> in custom.js) |</p>
<p>| <code>registerSettingsSection(section)</code> | Add a section to the shell's settings dialog: <code>{ id, title, description?, order?, fields, load(), save(values) }</code>, fields as in <code>settings()</code>. A <code>save</code> rejection whose error has <code>body.fields</code> shows those messages next to the fields. Returns a remover |</p>
<p>| <code>registerNavGroup(name, { order, folded }?)</code> | Declare the sidebar group your pages use, like <code>nav_groups()</code>. Returns a remover |</p>
<p>| <code>registerThemePreset({ id, label, light?, dark? })</code> | Offer a seed-token theme preset, like <code>themes()</code>. Returns a remover |</p>
<p>| <code>registerLayout(id, meta, Frame \| loader)</code> | Add a layout (the frame around every page). <code>getLayouts()</code>, <code>useLayout()</code>, <code>setLayout(id)</code>, <code>provideLayoutData(kind, feed)</code> and <code>useLayoutData(kind)</code> go with it. Returns a remover |</p>
<p>| <code>onActivate(fn)</code> | Run <code>fn({ manifest })</code> once the app is ready |</p>
<p>| <code>getPage</code>, <code>getBlock</code>, <code>getSlot</code>, <code>getToolRenderers</code> | Registry lookups |</p>
<p>| <code>subscribe(fn)</code>, <code>useRegistryVersion()</code> | React to later registrations |</p>
<p>Shell services and components:</p>
<p>| Export | Use |</p>
<p>|---|---|</p>
<p>| <code>navigate(pageId, { replace, params }?)</code> | Go to a page of the app: <code>navigate('logs')</code> |</p>
<p>| <code>pageHref(pageId, params?)</code> | Format an in-app page URL path (<code>pageHref('revenue', { range: '30d' })</code> → <code>/revenue?range=30d</code>) |</p>
<p>| <code>pageLinkProps(pageId, params?, { replace }?)</code> | Return <code>{ href, onClick }</code> for an in-app <code>&lt;a&gt;</code> link: plain left click navigates inside the shell with no full document reload (Back/Forward work), while Cmd/Ctrl/Shift/Alt/middle-click keeps native new-tab behaviour |</p>
<p>| <code>useLiveData(key, fetcher, options?)</code> | Keyed, visibility-aware live data hook shared with built-in block pages: aborts in-flight reads on key change (never flashing stale page data), retains the last result on refresh failure alongside <code>error</code>, skips hidden tabs, backs off on failures, and refreshes once when returning to an overdue tab |</p>
<p>| <code>notify(message, options?)</code> | Show a toast. Options: <code>type</code> (<code>info</code>, <code>success</code>, <code>warning</code>, <code>error</code>), <code>description</code>, <code>duration</code>, <code>id</code>, <code>action: { label, onClick }</code> |</p>
<p>| <code>fetchJson(url, options?)</code> | <code>fetch</code> for JSON APIs. It sends the session's gateway token to same-origin URLs only, JSON-encodes a plain-object <code>body</code> (the method then defaults to <code>POST</code>), decodes the response, and rejects with an error carrying <code>status</code>, <code>url</code> and <code>body</code> on a non-2xx status |</p>
<p>| <code>useManifest()</code> | React hook returning the shell manifest (<code>pages</code>, <code>plugins</code>, <code>site</code>, <code>layout</code>) |</p>
<p>| <code>getPageId()</code>, <code>usePageId()</code> | The id of the page on screen (<code>''</code> at <code>/</code>), read the way the shell's router reads the URL; the hook re-renders on navigation. Never parse <code>location</code> yourself |</p>
<p>| <code>useThemeMode()</code> | React hook returning <code>'light'</code> or <code>'dark'</code>, updated when the viewer or the OS switches |</p>
<p>| <code>dismiss(id?)</code> | Close a toast raised with <code>notify(message, { id })</code> (all toasts without an id) |</p>
<p>| <code>Markdown</code> | The shell's Markdown renderer: <code>&lt;Markdown variant="docs"&gt;{text}&lt;/Markdown&gt;</code> |</p>
<p>Style with the theme's CSS variables (<code>var(--foreground)</code>, <code>var(--border)</code>,</p>
<p><code>var(--primary)</code>, …). The shell's Tailwind build only contains the classes the</p>
<p>shell itself uses, so Tailwind classes in a plugin may not exist.</p>
<h3>Shell services</h3>
<p>Use the services instead of globals such as <code>window.fetch</code> or the history API.</p>
<p>They work the same in every page kind and they are part of the SDK contract.</p>
<p>A command that throws, or whose promise rejects, is reported as a toast. An</p>
<p><code>onActivate</code> hook that throws is logged and does not stop the other hooks.</p>
<h4>In-page tabs and live-refreshing data</h4>
<p>Use <code>pageLinkProps()</code> for in-page navigation links or tabs so ordinary clicks</p>
<p>stay in the SPA shell (0 document reloads, Back works) while Cmd/Ctrl-click</p>
<p>still opens a new tab. Pair it with <code>useLiveData()</code> to share the framework's</p>
<p>abort-on-navigation, hidden-tab pause, retry backoff, and retain-last-result logic:</p>
<h3>Slots</h3>
<p>A slot is a place in the shell that renders components from plugins.</p>
<p>| Slot | Where | Extra props |</p>
<p>|---|---|---|</p>
<p>| <code>header:actions</code> | The header bar, before search and the theme toggle. Not shown when the app hides the page header | |</p>
<p>| <code>sidebar:footer</code> | The bottom of the sidebar, on desktop and in the phone menu | <code>collapsed</code> |</p>
<p>| <code>page:&lt;id&gt;:toolbar</code> | Above the body of page <code>&lt;id&gt;</code>, for example <code>page:logs:toolbar</code> | |</p>
<p>Every slot component receives <code>{ slot, pageId, page }</code>: the slot name, the id</p>
<p>of the page on screen and its manifest entry.</p>
<li>Pass <code>{ id, order }</code> so that several plugins can share a slot. <code>id</code> is the</li>
<p>identity of your contribution (use the plugin name), and a lower <code>order</code></p>
<p>comes first (default <code>100</code>). Registering the same <code>id</code> again replaces only</p>
<p>that contribution.</p>
<li>Without options, the call sets the slot's single default contribution and</li>
<p>replaces an earlier one. This is the original behaviour.</p>
<li>Each contribution renders inside its own error boundary. One that throws is</li>
<p>removed and logged; the others and the shell stay.</p>
<li>A slot nobody contributes to renders nothing.</li>
<h3>Layouts</h3>
<p>A layout owns the frame of the app shell: the navigation, the session list,</p>
<p>the top bar, side panels and the phone chrome. The page stays the page: every</p>
<p>page renders inside every layout, in the outlet the shell hands the frame</p>
<p>(<a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/docs/adr/0003-selectable-layouts.md">ADR 0003</a>). aiui ships six layouts</p>
<p>(<code>chat</code>, what <code>aiui run</code> opens; <code>chat-canvas</code>, the app shell's default; plus</p>
<p><code>workbench</code>, <code>command</code>, <code>guided</code> and <code>mission</code>); the core's own frame is called <code>classic</code>. A plugin adds a</p>
<p>layout with the same call the built-ins use.</p>
<p><strong>Which layout is on screen.</strong> The server's manifest lists the layouts it</p>
<p>offers (<code>layouts.available</code>) and its default. The browser takes the first of:</p>
<p>a <code>?layout=&lt;id&gt;</code> preview (kept for the tab, never saved), the viewer's own</p>
<p>choice (the palette's "Switch layout: …" commands or Settings → Appearance,</p>
<p>saved in this browser, only when the server allows a user choice), the server</p>
<p>default, the classic frame. A layout the server does not offer is never</p>
<p>chosen.</p>
<p><strong>Declare it in Python</strong> with a <code>layouts()</code> hook, which returns</p>
<p><code>LayoutSpec</code>s (or dicts with the same field names), like <code>pages()</code>:</p>
<p>| <code>LayoutSpec</code> field | Meaning |</p>
<p>|---|---|</p>
<p>| <code>id</code> | Lower-case letters, digits and <code>-</code>, starting with a letter, at most 40 characters; <code>classic</code> is reserved |</p>
<p>| <code>title</code>, <code>description</code> | Shown in the picker (palette and Settings → Appearance) |</p>
<p>| <code>order</code> | Picker position (default <code>100</code>; the built-ins use 10 to 50) |</p>
<p>| <code>module</code> | <strong>Required</strong> for a plugin layout: the ESM file that registers the frame. A relative path resolves into <code>static_dir()</code> (<code>/_plugins/&lt;name&gt;/&lt;file&gt;</code>) and gets an SRI <code>integrity</code> hash, which the import map carries like a page module's |</p>
<p>| <code>css</code> | Optional stylesheet, resolved the same way (its hash is <code>cssIntegrity</code> in the manifest and on the <code>&lt;link&gt;</code>), added when the layout first loads |</p>
<p>| <code>home</code> | The page <code>/</code> opens while this layout is on screen |</p>
<p>| <code>primary</code> | Page ids of the primary nav, in order (at most 7 shown; YAML <code>layout.primary</code> wins) |</p>
<p>| <code>look</code> | Optional: the <code>meta.look</code> your frame registers (an id such as <code>paper</code>). When the layout is the server's default, the server sets <code>&lt;html data-aiui-look&gt;</code> from the first byte, so the look's fonts load instead of the Pro ones. It is not sent in the manifest |</p>
<p>The first plugin (or built-in) to declare an id keeps it; a later one is</p>
<p>ignored with a warning, as is a malformed or <code>classic</code> id. On a remote or</p>
<p>auth-enforced server an entry-point plugin's layouts follow the same</p>
<p>default-deny rule as its pages. Configuration (which layouts are offered,</p>
<p>the default) is in Layouts → Plugin layouts.</p>
<p><strong>Register the frame in the browser.</strong> The shell imports the module only</p>
<p>when the layout is first rendered, never with the other plugin modules, so an</p>
<p>inactive layout costs nothing. The module either calls `registerLayout(id,</p>
<p>meta, Frame)<code> while it is evaluated (its </code>meta` then replaces the manifest's</p>
<p>title and description) or default-exports the frame:</p>
<p>The complete example is <code>src/frontend/e2e/fixtures/layout-plugin/</code> (the</p>
<p>suite <code>e2e/specs/layouts-host.spec.ts</code> runs it).</p>
<p>What the frame receives (<code>LayoutProps</code>):</p>
<p>| Prop | What it is |</p>
<p>|---|---|</p>
<p>| <code>Outlet</code> | The routed page, with its error boundary, toolbar slot and loading state. Render it once, inside your <code>main</code> |</p>
<p>| <code>pageId</code>, <code>page</code>, <code>fullBleed</code> | The page on screen, its manifest entry, and whether it asked for no padding (chat, iframes): then give the outlet the full height and no scroll |</p>
<p>| <code>nav</code> | <code>primary</code> (at most 7, the layout's own list), <code>groups</code> (every other page, by sidebar group, with <code>folded</code>), <code>footer</code>, <code>activeId</code>, <code>go(pageId)</code>. Items carry <code>id</code>, <code>title</code>, <code>href</code>, <code>active</code>, <code>navIcon</code>, <code>icon</code>, <code>group</code> |</p>
<p>| <code>chrome</code> | <code>siteTitle</code>, <code>siteLogo</code>, <code>openPalette({ query? })</code> (the one command palette, optionally prefilled), <code>toggleColorMode()</code>, <code>Slot</code> (the shell's slot host: <code>&lt;chrome.Slot name="header:actions" /&gt;</code>), <code>mainId</code> (give your <code>main</code> this id: the skip link and the palette focus it) |</p>
<p>| <code>viewport</code> | <code>'phone'</code> (&lt; 768 px), <code>'tablet'</code> (&lt; 1024 px) or <code>'desktop'</code>; draw your phone frame from it |</p>
<p>| <code>layout</code> | <code>id</code>, <code>available</code> (the offered layouts), <code>switchTo(id)</code> |</p>
<p><code>useLayout()</code> returns <code>{ id, meta }</code> of the layout on screen (null for the</p>
<p>classic frame), <code>setLayout(id, { persist }?)</code> switches live (<code>''</code> or</p>
<p><code>'classic'</code> is the classic frame), and <code>getLayouts()</code> lists the registered</p>
<p>ones. <code>meta.chat</code> tells the chat page how to present itself in your frame</p>
<p>(who draws the session list, the thread style, lazy regions such as <code>aside</code>,</p>
<p><code>turnFooter</code> and <code>composerTool</code>); see the ADR. <code>meta.look</code> names a look of</p>
<p>the Pro tokens the frame paints with (the shell ships <code>paper</code>; DESIGN.md "Looks").</p>
<p>Frames read data such as the session list with <code>useLayoutData('sessions')</code>,</p>
<p>which returns null while nothing provides it: render without it. The <code>chat</code></p>
<p>feed (<code>builtin.chat</code>) also acts on the open chat: <code>prefill(text)</code> fills the</p>
<p>composer, <code>send?(text)</code> sends (optional: check for it, and fall back to</p>
<p><code>prefill</code>), <code>cancel()</code> stops the reply, and</p>
<p><code>resolveApproval(id, approved, { always? })</code> decides a gate in the thread.</p>
<p><strong>Failure.</strong> A layout whose module fails to import, or whose frame throws,</p>
<p>is replaced by the classic frame with one toast and an <code>aiui:plugin-error</code></p>
<p>event (<code>detail.layout</code> is its id). Other layouts are not affected.</p>
<p>Keep a frame self-contained: import React and <code>@aiui/sdk</code> only, style with</p>
<p>the theme's CSS variables, give icon-only buttons an <code>aria-label</code>, and make</p>
<p>phone touch targets at least 44 px.</p>
<h3>Feature detection</h3>
<p>The SDK grows without a new major version, so <code>SDK_VERSION</code> stays <code>1</code>. A named</p>
<p>import of an export that an older shell lacks fails when the module loads.</p>
<p>When a plugin must also run on older shells, use the default export and ask</p>
<p>before you call a newer function:</p>
<p>Feature names: <code>pages</code>, <code>blocks</code>, <code>tool-renderers</code>, <code>slots</code>, <code>views</code>,</p>
<p><code>markdown</code>, <code>navigate</code>, <code>notify</code>, <code>fetch-json</code>, <code>manifest</code>, <code>commands</code>,</p>
<p><code>activate</code>, <code>slots.multi</code> (the <code>{ id, order }</code> options and the slot hosts),</p>
<p><code>blocks.fallback</code>, <code>page-id</code> (<code>getPageId</code>, <code>usePageId</code>), <code>theme-mode</code></p>
<p>(<code>useThemeMode</code>), <code>notify.dismiss</code>, <code>settings</code> (<code>registerSettingsSection</code> and</p>
<p>the <code>settings()</code> hook), <code>nav-groups</code> (<code>registerNavGroup</code>, <code>nav_groups()</code>),</p>
<p><code>theme-presets</code> (<code>registerThemePreset</code>, <code>themes()</code>), <code>layouts</code></p>
<p>(<code>registerLayout</code>, <code>getLayouts</code>, <code>useLayout</code>, <code>setLayout</code>, manifest</p>
<p><code>layouts</code>), <code>layout-data</code> (<code>provideLayoutData</code>, <code>useLayoutData</code>),</p>
<p><code>slots.dispose</code> (<code>registerSlot</code> returns a remover), <code>page-links</code></p>
<p>(<code>pageHref</code>, <code>pageLinkProps</code>), <code>live-data</code> (<code>useLiveData</code>),</p>
<p><code>ws-transport</code> (<code>getWsTicket</code>, <code>openWebSocket</code>) and <code>block-tree</code></p>
<p>(<code>BlockTree</code>). A shell older than the</p>
<p>services has no <code>SDK_FEATURES</code>.</p>
<h3>Authenticated WebSockets (`openWebSocket`, `getWsTicket`)</h3>
<p>A plugin's <code>routes()</code> may include Starlette <code>WebSocketRoute</code> endpoints under</p>
<p><code>/api/plugins/&lt;name&gt;/*</code>. In the browser, open them with <code>openWebSocket(path)</code></p>
<p>from <code>@aiui/sdk</code> (feature <code>ws-transport</code>) so stored gateway tokens are</p>
<p>automatically exchanged for a single-use 60-second ticket via</p>
<p><code>POST /api/auth/ws-ticket</code> (credentials are never attached to cross-origin URLs):</p>
<p>Call <code>getWsTicket()</code> directly if you construct a custom WebSocket URL yourself.</p>
<h3>Reusing built-in blocks in React pages (`BlockTree`)</h3>
<p>Custom <code>kind="react"</code> pages and plugin layouts can compose any built-in block</p>
<p>(<code>metric</code>, <code>table</code>, <code>diff_viewer</code>, <code>tree_view</code>, <code>timeline</code>, <code>status</code>,</p>
<p><code>button_group</code>, …) or plugin-registered block via <code>&lt;BlockTree&gt;</code> from</p>
<p><code>@aiui/sdk</code> (feature <code>block-tree</code>). The blocks engine loads lazily on first</p>
<p>use, so shell boot size stays unchanged:</p>
<h3>Types</h3>
<p><code>@aiui/sdk</code> is not an npm package: the shell provides it at runtime. Its types</p>
<p>are in <code>src/frontend/src/sdk/aiui-sdk.d.ts</code>, the frontend build also writes</p>
<p><code>dist/aiui-sdk.d.ts</code>, and the installed package ships the same file at</p>
<p><code>praisonaiui/templates/frontend/aiui-sdk.d.ts</code> (find it with</p>
<p><code>python -c "import praisonaiui, pathlib; print(pathlib.Path(praisonaiui.__file__).parent / 'templates/frontend/aiui-sdk.d.ts')"</code>).</p>
<p>Copy the file into a plugin project and include</p>
<p>it in <code>tsconfig.json</code> (or <code>jsconfig.json</code> with <code>checkJs</code>) to type-check the</p>
<p>plugin. It depends on <code>@types/react</code> only.</p>
<h3>Failure isolation</h3>
<p>Each module is imported once. If one fails to load (network error, syntax</p>
<p>error, no component to register), the shell logs it, shows a toast, fires an</p>
<p><code>aiui:plugin-error</code> window event, and loads everything else. The page shows</p>
<p>"unavailable" instead of crashing. A block that throws while rendering is</p>
<p>replaced by an inline error; the rest of the page still renders.</p>
<h3>Blocks in docs pages</h3>
<p>A docs site can use a block whose type is named like a component</p>
<p>(<code>HelloCard</code>): <code>&lt;HelloCard title="Hi" /&gt;</code> in a page of an <code>aiui build</code> site</p>
<p>renders it, and the build publishes the plugin's static folder with the site</p>
<p>(your own components).</p>
<h2>Block pages</h2>
<p>A <code>blocks</code> page is data, not code: its endpoint returns a component tree and</p>
<p>the shell renders it with built-in React blocks. Page handlers already written</p>
<p>for the dashboard (<code>aiui.register_page(handler=…)</code> with <code>aiui.ui.*</code> helpers)</p>
<p>render unchanged.</p>
<li>The payload may be <code>{"_components": [...]}</code> (also <code>components</code>, <code>blocks</code>, or</li>
<p>a bare list), and each item is a flat dict (<code>{"type": "card", "title": …}</code>)</p>
<p>or <code>{"type", "props", "children"}</code>.</p>
<li>A button with <code>action</code> and every form POST JSON to the action endpoint:</li>
<p><code>page.actionEndpoint</code> (set for <code>aiui.register_page_action</code>), else</p>
<p><code>&lt;apiEndpoint&gt;/action</code> for plugin pages, else <code>/api/pages/&lt;id&gt;/action</code>.</p>
<p>A response with a component list replaces the page; <code>message</code> is shown as a</p>
<p>toast; <code>error</code> (or a non-2xx status) as an error toast.</p>
<li>Resolution order for a block <code>type</code>: a block registered with</li>
<p><code>registerBlock(type, C)</code>, a <code>window.aiui.registerComponent</code> renderer from</p>
<p>custom.js, a block registered with <code>{ fallback: true }</code> (the core blocks are</p>
<p>registered this way), then the legacy dashboard renderer, so every existing</p>
<p><code>_components</code> type keeps working.</p>
<li>Text is always rendered as text, never as HTML. Links and images only accept</li>
<p>relative, <code>http(s)</code>, <code>mailto:</code> and <code>tel:</code> URLs (images also <code>data:image/*</code>).</p>
<p>Core block types: <code>text</code>, <code>caption</code>, <code>header</code>/<code>heading</code>, <code>markdown_text</code>/<code>markdown</code>,</p>
<p><code>code_block</code>/<code>code</code>, <code>json_view</code>/<code>json</code>, <code>card</code>, <code>metric</code>/<code>stat</code>, <code>stat_group</code>,</p>
<p><code>progress_bar</code>/<code>progress</code>, <code>columns</code>/<code>grid</code>, <code>row</code>, <code>container</code>,</p>
<p><code>separator</code>/<code>divider</code>, <code>tabs</code>, <code>expander</code>, <code>accordion</code>, <code>table</code>,</p>
<p><code>key_value_list</code>, <code>list</code>, <code>badge</code>, <code>alert</code>, <code>callout</code>, <code>empty</code>, <code>spinner</code>,</p>
<p><code>skeleton</code>, <code>toast</code>, <code>image_display</code>/<code>image</code>, <code>link</code>, <code>button</code>/<code>action</code>,</p>
<p><code>button_group</code>, <code>form_action</code>/<code>form</code>, <code>text_input</code>, <code>number_input</code>,</p>
<p><code>date_input</code>, <code>time_input</code>, <code>textarea_input</code>, <code>select_input</code>,</p>
<p><code>checkbox_input</code>, <code>switch_input</code>, <code>radio_input</code>, <code>slider_input</code>.</p>
<h2>Trust and policy</h2>
<p>Installing a plugin means trusting it: its Python runs in the server process and</p>
<p>its JavaScript runs in the page with no sandbox (use <code>kind: iframe</code> for</p>
<p>untrusted content). Because any installed package, including a transitive</p>
<p>dependency, can declare the entry point, the browser parts of entry-point</p>
<p>plugins (pages, blocks, tool renderers and <code>/_plugins/&lt;name&gt;/</code>) and their HTTP</p>
<p>routes (<code>/api/plugins/&lt;name&gt;/*</code>) are <strong>default-deny</strong> when the server requires</p>
<p>auth or is reached from a non-loopback address. They are listed as</p>
<p><code>disabled-by-default</code> (and answer 404) until you enable the plugin by name.</p>
<p>The plugin's Python code still runs (<code>setup()</code>, <code>features()</code>): to keep an</p>
<p>installed package from being imported at all, put it in <code>extensions.disabled</code>.</p>
<p><code>extensions: [hello]</code> is shorthand for <code>enabled</code>. From Python:</p>
<p><code>aiui.set_extensions(enabled=["hello"])</code> (it beats YAML). A plugin object</p>
<p>registered with <code>aiui.register_plugin(obj)</code> was chosen by the app author and is</p>
<p>always trusted: the <code>enabled</code> allowlist does not apply to it, so</p>
<p><code>extensions: {enabled: [hello]}</code> never switches your own plugin off. Only</p>
<p><code>extensions.disabled</code> (its name) does.</p>
<p><code>AIUI_DISABLE_PLUGIN_AUTOLOAD=1</code> skips the entry-point group entirely (the test</p>
<p>suite sets it).</p>
<h2>CLI</h2>
<p>| Command | Does |</p>
<p>|---|---|</p>
<p>| <code>aiui plugins list [--json] [--config aiui.yaml]</code> | The built-in records (<code>builtin.&lt;name&gt;</code>: status <code>ok</code> or <code>disabled</code>, whether the host requires part of it, its pages), then installed plugins with version, status (<code>ok</code>, <code>error</code>, <code>disabled</code>, <code>incompatible</code>, <code>disabled-by-default</code>) and load error. <code>--json</code> puts the built-ins under <code>builtins</code> |</p>
<p>| <code>aiui plugins doctor [--config aiui.yaml] [--no-builtin]</code> | Loads each plugin and checks SDK version, <code>static_dir()</code>, every module file and its <code>sha384</code> (pages, blocks, tool renderers, layouts), page kinds, every <code>settings()</code>, <code>nav_groups()</code>, <code>themes()</code> and <code>layouts()</code> entry, routes, CLI name clashes and page ids shadowed by built-in pages or other plugins. A page shadowed by a built-in names the <code>builtin.&lt;name&gt;</code> to add to <code>extensions.disabled</code>; a <code>builtin.</code> name that matches no record is a warning. Exits 1 on any failure |</p>
<p>| <code>aiui &lt;plugin&gt; …</code>, <code>aiui plugins &lt;plugin&gt; …</code> | The plugin's own commands |</p>
<p><code>aiui --help</code> and built-in commands never import plugins; discovery runs only</p>
<p>when a command name is not a built-in one.</p>
<h2>Troubleshooting</h2>
<p>| Symptom | Check |</p>
<p>|---|---|</p>
<p>| Page says "unavailable" | <code>aiui plugins doctor</code>; the browser console shows the import error |</p>
<p>| Plugin listed as <code>disabled-by-default</code> | Remote or auth-enforced server: add it to <code>extensions.enabled</code> |</p>
<p>| <code>Invalid hook call</code> | The module bundled its own React: mark <code>react</code> and <code>react/jsx-runtime</code> external |</p>
<p>| <code>does not provide an export named …</code> | The shell is older than the SDK export the module imports: see feature detection |</p>
<p>| A slot component does not appear | Check the slot name, and that the page header or sidebar is not hidden by the app |</p>
<p>| <code>aiui shell not booted</code> | The module was loaded outside the app shell (style must be <code>app</code>) |</p>
<p>| Integrity error after editing a file | The manifest hashes the file on every request; hard-reload the page so the browser drops its cached copy |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/plugins.source.md", "text": "# UI Plugins\n\nA UI plugin is a Python package that adds pages, blocks, chat tool renderers,\nsettings sections, sidebar groups, theme presets, HTTP routes and CLI commands\nto the React app shell (`style: app`, or\n`AIUI_SHELL=app`). Installing the package is the whole setup: the server finds\nit through the `praisonaiui.plugins` entry point.\n\nThe smallest complete plugin lives in\n[`examples/plugins/aiui-hello-plugin`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/plugins/aiui-hello-plugin/).\n\n```bash\npip install -e examples/plugins/aiui-hello-plugin\naiui plugins list          # name, version, status, load error\naiui plugins doctor        # load, SDK version, static files + SRI, shadowed ids\naiui hello greet Ada       # a command contributed by the plugin\naiui run app.py\n```\n\n`aiui run app.py` opens the app shell (`style: app`) unless the app, its YAML\nor `--style` picks another style, so a plain `@aiui.reply` app needs no flag.\n`AIUI_SHELL=app` only switches the `dashboard` style to the app shell; it\nleaves an explicit `chat` or other React style alone (the server logs\n`AIUI_SHELL=app ignored: style is 'chat'`).\n\nThen open `/hello` (a React page) and `/hello-blocks` (a server-driven page).\n\n!!! note \"Three different things are called plugins\"\n    - **UI plugins** (this page): Python packages, entry point `praisonaiui.plugins`,\n      React app shell only. Policy in YAML `extensions:`.\n    - **Dashboard plugins**: folders with a `manifest.json` under\n      `dashboard-plugins/`, vanilla JS views (see [Agent UI host](./agent-ui-host.md)).\n      The app shell still hosts them as legacy pages.\n    - **Docs plugins**: `site.plugins` in `aiui.yaml` (static site compiler hooks).\n      The default is `nav-intercept`; see\n      [Deploy to GitHub Pages → Legacy plugins](../getting-started/github-pages.md#legacy-plugins).\n\n## How it fits together\n\n```mermaid\nflowchart LR\n    EP[\"pip package\u003cbr/\u003eentry point praisonaiui.plugins\"] --\u003e REG[\"plugin_registry\u003cbr/\u003e(server)\"]\n    REG --\u003e MAN[\"/api/shell/manifest\u003cbr/\u003epages, blocks, toolRenderers\"]\n    REG --\u003e STATIC[\"/_plugins/\u0026lt;name\u0026gt;/\u003cbr/\u003eESM files + sha384\"]\n    REG --\u003e API[\"/api/plugins/\u0026lt;name\u0026gt;/…\u003cbr/\u003eStarlette routes\"]\n    MAN --\u003e SHELL[\"React shell\u003cbr/\u003eloadManifestPlugins()\"]\n    STATIC --\u003e SHELL\n    SHELL --\u003e SDK[\"window.__AIUI_SDK__\u003cbr/\u003eshared React + @aiui/sdk\"]\n```\n\n1. The server imports each entry point once, isolates failures, and lists what\n   the plugin contributes in the shell manifest.\n2. The shell installs `window.__AIUI_SDK__` and then `import()`s every plugin\n   module named in the manifest. An import map points the bare specifiers\n   `react`, `react/jsx-runtime`, `react-dom`, `react-dom/client` and\n   `@aiui/sdk` at small shims that re-export the shell's own modules, so a\n   plugin shares the shell's single React (hooks work, nothing is bundled twice).\n3. A module registers what it provides through `@aiui/sdk`, or default-exports\n   a component that the shell registers under the page id / block type / tool name.\n\nThe app's own React pages and blocks use the same mechanism. The shell and the\nSDK are a small core that names no page: the chat page and its \"New chat\"\ncommand are the first-party plugin `builtin.chat` in\n`src/frontend/src/builtin`, registered with `registerPage` and\n`registerCommand` when the manifest lists the page; the approval toasts are\n`builtin.approvals` (on `notify` and `navigate`); and the core block types are\nregistered with `registerBlock`. A test in the frontend\n(`shell/core-purity.test.ts`) fails if the core imports a feature module or\nnames a built-in page.\n\n## The Python side\n\n```toml\n# pyproject.toml\n[project.entry-points.\"praisonaiui.plugins\"]\nhello = \"aiui_hello:plugin\"\n```\n\nThe value names a plugin object, a class (instantiated with no arguments) or a\nzero-argument factory. The entry-point name becomes a URL segment, so it must\nmatch `[a-z0-9][a-z0-9_-]*`.\n\nEvery member except `name` is optional:\n\n| Member | Returns | Effect |\n|---|---|---|\n| `name` | `str` | Plugin id (`/api/plugins/\u003cname\u003e`, `/_plugins/\u003cname\u003e/`, `aiui \u003cname\u003e`) |\n| `version` | `str` | Shown by `aiui plugins list` |\n| `sdk` | `int` | Browser SDK major the plugin targets (default `1`); a mismatch marks it `incompatible` |\n| `pages()` | `PageSpec` or dicts | Sidebar pages |\n| `blocks()` | `BlockSpec` | Renderers for block types |\n| `tool_renderers()` | `ToolRendererSpec` | Chat renderers for tool calls |\n| `routes()` | Starlette routes | Mounted under `/api/plugins/\u003cname\u003e` |\n| `static_dir()` | `Path` | Served at `/_plugins/\u003cname\u003e/` |\n| `features()` | feature protocols | Registered like built-in features (an enabled built-in's names win) |\n| `cli_commands()` | `typer.Typer` or click command | `aiui \u003cname\u003e …` and `aiui plugins \u003cname\u003e …` |\n| `setup(ctx)` | `None` | Called once per `create_app()` with `{\"style\", \"config\"}` |\n| `lifespan(app)` | async/sync context manager | Entered on ASGI startup and exited LIFO on shutdown (in both `create_app()` and `create_shell_app()`); failures are isolated per plugin |\n| `settings()` | `SettingsSectionSpec` or dicts | Sections of the shell's settings dialog ([below](#settings-nav-groups-and-theme-presets)) |\n| `nav_groups()` | `NavGroupSpec` or dicts | The sidebar groups your pages use, with their position |\n| `themes()` | `ThemeSpec` or dicts | Theme presets made of seed tokens |\n| `layouts()` | `LayoutSpec` or dicts | App shell frames (ADR 0003) the viewer can pick ([below](#layouts)) |\n\n`PageSpec`, `BlockSpec`, `ToolRendererSpec`, `SettingsSectionSpec`,\n`SettingsField`, `NavGroupSpec`, `ThemeSpec`, `LayoutSpec` and\n`get_plugin_settings` are importable from `praisonaiui` (or `praisonaiui.plugin_registry`). Dicts with\nthe same field names work too.\n\n### Page kinds\n\n| `kind` | Renders | Needs |\n|---|---|---|\n| `react` | The component from `module` (default export, or `export`) | `module` |\n| `blocks` | A server-driven block tree (see below) | `api_endpoint`, default `/api/plugins/\u003cname\u003e/pages/\u003cid\u003e` |\n| `iframe` | `module` in a sandboxed iframe (no same-origin access) | `module` |\n\nThese three are the only kinds a plugin can use. `native` and `legacy` are\nfirst-party only (the shell never imports a plugin's legacy view): a plugin\npage with another `kind`, or a misspelt one, is dropped with a warning and\n`aiui plugins doctor` fails on it.\n\nA relative `module` (`\"hello.js\"`) resolves into `static_dir()`; the server\nthen serves `/_plugins/\u003cname\u003e/hello.js` and adds its `sha384` integrity to the\nmanifest and the import map.\n\nThe integrity is a **cache-consistency** check, not tamper protection: the\nserver hashes the file it is about to serve (re-hashed when the file changes,\nso a rebuilt bundle keeps loading), which guards against a stale or partly\nwritten file between the page render and the module fetch. Someone who can\nchange files in the plugin's `static_dir` can also change what is hashed.\nDeclare `integrity=` on the `PageSpec` to pin a hash you computed at build\ntime. When auth is enforced the page carries no manifest (and so no import-map\nintegrity) before login; the shell loads plugin modules afterwards.\n\nWhen two sources use the same page id, the first wins: pages registered by the\napp (`aiui.register_page`), then built-in pages, then entry-point plugins (in\ndiscovery order), then dashboard-plugin folders. `aiui plugins doctor` warns\nabout shadowed ids.\n\n### Settings, nav groups and theme presets\n\nThree hooks contribute to the shell itself rather than to a page. They were\nadded under SDK 1; a shell that has them lists the features `settings`,\n`nav-groups` and `theme-presets` in `SDK_FEATURES`, and an older host simply\nnever calls them.\n\n```python\nfrom praisonaiui.plugin_registry import (\n    NavGroupSpec, SettingsField, SettingsSectionSpec, ThemeSpec, get_plugin_settings,\n)\n\nclass HelloPlugin:\n    name = \"hello\"\n\n    def pages(self):\n        return [{\"id\": \"hello\", \"title\": \"Hello\", \"kind\": \"react\", \"module\": \"hello.js\", \"group\": \"Hello\"}]\n\n    def nav_groups(self):\n        return [NavGroupSpec(name=\"Hello\", order=250)]\n\n    def settings(self):\n        return [SettingsSectionSpec(\n            id=\"greeting\",\n            title=\"Hello plugin\",\n            description=\"How the Hello blocks page greets you.\",\n            fields=(\n                SettingsField(key=\"greeting\", label=\"Greeting\", default=\"Hello\"),\n                SettingsField(key=\"tone\", type=\"select\", options=(\"plain\", \"excited\")),\n            ),\n        )]\n\n    def themes(self):\n        return [ThemeSpec(id=\"sunrise\", label=\"Sunrise\",\n                          light={\"--seed-accent\": \"#c2410c\"},\n                          dark={\"--seed-accent\": \"#fb923c\"})]\n\n# anywhere in the plugin's Python code (a route, a feature):\nget_plugin_settings(\"hello\", \"greeting\")   # {\"greeting\": \"Hello\", \"tone\": \"plain\"}\n```\n\n**Nav groups.** `NavGroupSpec(name, order=None, folded=False)` names a group\nthat your pages use in `PageSpec.group`. `order` places it among the groups:\nthe groups the app lists in `layout.groups.order` (`Agent`, `Work`, `Control`\nby default) sit at 100, 200 and 300, groups without an order follow them, and\n`layout.groups.last` (`Settings`) stays last. So `order=250` puts the group\nbetween Work and Control, and `order=50` puts it first. `folded=True` starts\nthe group collapsed until the viewer opens it. The app's own configuration\nwins: a plugin cannot move a group that `layout.groups` (or\n`set_dashboard(groups=...)`) names.\n\nEvery frame lists a declared group. The classic frame shows all groups in its\nsidebar; the built-in layouts, which keep the app's own groups in More (⌘K),\nstill show the groups plugins declared, in this order and folded as declared:\nunder the primary pages in `chat`, `chat-canvas`, `workbench` and `mission`,\nin the rail in `command`, and under More tools in `guided`.\n\n**Settings.** A\n`SettingsSectionSpec(id, title, fields, description=\"\", order=100)` becomes a section of the shell's settings dialog, which opens from\n\"Plugin settings\" (the sliders button in the classic header, a \"Plugin\nsettings\" row or rail button in every built-in layout, shown only while some\nplugin has a section) or from \"Plugin settings\" in the command palette. Each\n`SettingsField(key, label=\"\", type=\"string\", default=None, description=\"\", options=None)`\nis drawn from its type:\n\n| `type` | Control | Default value |\n|---|---|---|\n| `string` | One-line text input | `\"\"` |\n| `text` | Multi-line text area | `\"\"` |\n| `number` | Number input | `0` |\n| `boolean` | Switch | `False` |\n| `select` | Select from `options` (strings or `{\"value\", \"label\"}` dicts) | the first option |\n\nThe values are stored per plugin in\n`$AIUI_DATA_DIR/plugin-settings/\u003cname\u003e.json` (default `~/.praisonaiui`). The\nserver serves each section at `/api/plugins/\u003cname\u003e/settings/\u003cid\u003e`: `GET`\nreturns `{\"values\": {...}}` with the defaults filled in, and `PUT\n{\"values\": {...}}` validates every key against its field (unknown keys, wrong\ntypes and options not in the list answer 400 with `{\"error\", \"fields\":\n{key: reason}}`, and nothing is written). That path is reserved for a plugin\nthat declares `settings()`: it is matched before the plugin's own routes. It\nsits under the same mount as `routes()`, so it is authenticated like every\nroute and default-deny for entry-point plugins on remote or auth-enforced\nservers unless they are named in `extensions.enabled`.\n`get_plugin_settings(name, section)` returns the same values to Python; a\nstored value that no longer fits its field (an option you removed) falls back\nto the default.\n\n**Theme presets.** A `ThemeSpec(id, label, light={}, dark={})` sets L0 seed\ntokens per colour mode: `--seed-*` (`--seed-accent`, `--seed-tint`,\n`--seed-paper`, `--seed-ink` …), `--radius`, `--tint-mix` and `--accent-mix`.\nEvery surface, text and accent colour is derived from the seeds (see\n[DESIGN.md](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/DESIGN.md)), so a preset never names a shadcn\nvariable. Values are plain CSS values; anything else (another property, `;`,\nbraces, `url(...)`) is rejected. The viewer picks a preset in the command\npalette (\"Sunrise theme\", \"Default theme\"); the choice is kept per browser.\n\nInvalid entries of all three hooks (and of `layouts()`) are dropped one by\none with a warning, and one hook that raises does not drop the others. The\nwarning is printed once per start in the `aiui run` terminal (and on the Logs\npage), and `aiui plugins doctor` runs every entry through the same checks and\nfails on each one it would drop. The\ncontributions travel on the plugin's record in the shell manifest\n(`plugins[].settings`, `plugins[].navGroups`, `plugins[].themes`), only for\nplugins whose browser surfaces the viewer may load.\n\n### Built-in plugins\n\nThe pages and features that ship with PraisonAIUI use the same mechanism.\nEach domain is a first-party plugin record in `praisonaiui.builtin`: for\nexample `builtin.chat` holds the Chat and Chat + Canvas pages with the `chat`\nand `attachments` features, and `builtin.work` holds Work Hub, Kanban and\nJobs Board with the `kanban` feature. Features with no page of their own have\na record each (`builtin.tts`, `builtin.pwa`, `builtin.video` …). The server\nreads pages and features through the plugin registry, so the extension policy\ncan switch a whole domain off:\n\n```yaml\nextensions:\n  disabled: [builtin.training, builtin.logs]\n```\n\nor `aiui.set_extensions(disabled=[\"builtin.training\"])`. A disabled built-in\ncontributes no pages: they leave `GET /api/pages`, the shell manifest and the\nsidebar. Its feature routes are not mounted (`/api/training/...` returns 404),\nthe server does not load its feature modules, and a bundled dashboard-plugin\nfolder that belongs to it (`kanban` belongs to `builtin.work`, `video-studio`\nto `builtin.video`, the `sample-board` demo page in the Examples group to\n`builtin.examples`) is not served either. The same holds for the routes the\nhost itself serves for a built-in: `builtin.mcp` owns `/api/mcp/*`,\n`builtin.debug` owns `/api/debug`, `builtin.overview` owns\n`GET /api/overview`, `builtin.feedback` owns `GET /api/feedback` and\n`builtin.jobs` owns the optional `/api/jobs` proxy (`set_jobs_proxy`), so\ndisabling them returns 404 there. `builtin.logs` serves `GET /api/logs` and\n`/api/logs/*` from its feature, and installs its log handler only while it is\non. With the built-in off, an entry-point\nplugin may use its page ids and feature names.\n\nA few host routes stay mounted whichever built-ins are off, because the host,\nseveral pages or the CLI use them: `GET /api/status` (`aiui status`, the same\ndata as `/api/overview`), `POST /api/feedback` (the chat thumbs),\n`/api/config`, `/api/gateway/status`, `/api/provider*`, the chat protocol\n(`/agents`, `/sessions`, `/run`, `/cancel`, `/teams`, `/starters`,\n`/profiles`, `/welcome`, `/api/actions/*`, thread sharing), `/health*`, auth,\n`/api/pages`, `/api/features`, `/api/shell/manifest` and `/api/plugins`.\nDisabling `builtin.config` removes its page only. Where a page id is also a\nJSON path (`/agents`, `/sessions`, or an app page named like an API), a\nbrowser navigation to `/\u003cpage id\u003e` gets the page and `fetch()` gets the JSON,\nunder the `dashboard` and `app` styles.\n`tests/unit/test_route_table_snapshot.py` pins the default route table.\n\nSome features are **required**: the server itself depends on `auth`, `theme`,\n`chat`, `usage`, `config_runtime` and `sessions_ext`. Disabling their record\n(`builtin.auth`, `builtin.theme-picker`, `builtin.chat`, `builtin.usage`,\n`builtin.config`, `builtin.sessions`) removes its pages and its other\nfeatures, keeps the required feature mounted and logs a warning. Disabling\n`builtin.auth` therefore never turns authentication off.\n\n- Built-ins are trusted and on by default. `extensions.enabled` is an\n  allowlist for third-party plugins only, so it never hides a built-in page.\n- Only the `builtin.` name disables a built-in: `disabled: [logs]` means a\n  third-party plugin called `logs`. A `builtin.` name that matches no record\n  logs a warning.\n- The page-level controls still apply on top: `aiui.set_pages([...])`,\n  `pages.enabled` / `pages.disabled` in `config.yaml` and `aiui.remove_page()`\n  hide single pages (their APIs stay mounted), and `aiui.register_page()`\n  with a built-in id replaces that page.\n- `register_feature()` before the server starts replaces a built-in feature of\n  the same name, as before.\n- `GET /api/plugins?origin=builtin` (or `origin=all`) lists the built-in\n  records with their status (and `required: true` where the host needs one\n  of their features). Without the parameter the endpoint lists\n  third-party plugins only, as before.\n\n## The browser side\n\nA plugin module is plain ESM. Write it by hand (the example uses\n`react/jsx-runtime` directly) or build it with React and the SDK as externals:\n\n```js\n// vite.config.js of a plugin package (library mode)\nexport default {\n  build: {\n    lib: { entry: 'src/index.jsx', formats: ['es'], fileName: () =\u003e 'index.js' },\n    outDir: 'my_plugin/static',\n    rollupOptions: {\n      external: ['react', 'react/jsx-runtime', 'react-dom', 'react-dom/client', '@aiui/sdk'],\n    },\n  },\n}\n```\n\nOnly those five bare specifiers are mapped. Anything else must be bundled into\nthe plugin file or imported by full URL.\n\n### `@aiui/sdk`\n\nRegistration:\n\n| Export | Use |\n|---|---|\n| `SDK_VERSION` | `1` |\n| `SDK_FEATURES` | List of capability names, for [feature detection](#feature-detection) |\n| `registerPage(id, Component)` | Component receives `{ page }` (its manifest entry). A zero-argument arrow function is treated as a lazy loader: `registerPage('x', () =\u003e import('./X.js'))` |\n| `registerBlock(type, Component, options?)` | Component receives `{ node, page }`; `node` is `{ type, props, children }`. It also overrides a core block type of the same name. `{ fallback: true }` registers a default that anything else overrides |\n| `registerToolRenderer(toolName, Component)` | Chat tool call UI; receives assistant-ui tool part props (`toolName`, `args`, `argsText`, `result`, `status`, …) |\n| `registerSlot(name, Component, options?)` | Add a component to a [slot](#slots) of the shell |\n| `registerCommand(command)` | Add an entry to the command palette. Returns a function that removes it. Groups list before the pages, in registration order; the groups `Preferences`, `Layout` and `Theme` list after them |\n| `registerView(pageId, render, cleanup?)` | A vanilla view for a legacy page (same as `window.aiui.registerView` in custom.js) |\n| `registerSettingsSection(section)` | Add a section to the shell's settings dialog: `{ id, title, description?, order?, fields, load(), save(values) }`, fields as in [`settings()`](#settings-nav-groups-and-theme-presets). A `save` rejection whose error has `body.fields` shows those messages next to the fields. Returns a remover |\n| `registerNavGroup(name, { order, folded }?)` | Declare the sidebar group your pages use, like [`nav_groups()`](#settings-nav-groups-and-theme-presets). Returns a remover |\n| `registerThemePreset({ id, label, light?, dark? })` | Offer a seed-token theme preset, like [`themes()`](#settings-nav-groups-and-theme-presets). Returns a remover |\n| `registerLayout(id, meta, Frame \\| loader)` | Add a [layout](#layouts) (the frame around every page). `getLayouts()`, `useLayout()`, `setLayout(id)`, `provideLayoutData(kind, feed)` and `useLayoutData(kind)` go with it. Returns a remover |\n| `onActivate(fn)` | Run `fn({ manifest })` once the app is ready |\n| `getPage`, `getBlock`, `getSlot`, `getToolRenderers` | Registry lookups |\n| `subscribe(fn)`, `useRegistryVersion()` | React to later registrations |\n\nShell services and components:\n\n| Export | Use |\n|---|---|\n| `navigate(pageId, { replace, params }?)` | Go to a page of the app: `navigate('logs')` |\n| `pageHref(pageId, params?)` | Format an in-app page URL path (`pageHref('revenue', { range: '30d' })` → `/revenue?range=30d`) |\n| `pageLinkProps(pageId, params?, { replace }?)` | Return `{ href, onClick }` for an in-app `\u003ca\u003e` link: plain left click navigates inside the shell with no full document reload (Back/Forward work), while Cmd/Ctrl/Shift/Alt/middle-click keeps native new-tab behaviour |\n| `useLiveData(key, fetcher, options?)` | Keyed, visibility-aware live data hook shared with built-in block pages: aborts in-flight reads on key change (never flashing stale page data), retains the last result on refresh failure alongside `error`, skips hidden tabs, backs off on failures, and refreshes once when returning to an overdue tab |\n| `notify(message, options?)` | Show a toast. Options: `type` (`info`, `success`, `warning`, `error`), `description`, `duration`, `id`, `action: { label, onClick }` |\n| `fetchJson(url, options?)` | `fetch` for JSON APIs. It sends the session's gateway token to same-origin URLs only, JSON-encodes a plain-object `body` (the method then defaults to `POST`), decodes the response, and rejects with an error carrying `status`, `url` and `body` on a non-2xx status |\n| `useManifest()` | React hook returning the shell manifest (`pages`, `plugins`, `site`, `layout`) |\n| `getPageId()`, `usePageId()` | The id of the page on screen (`''` at `/`), read the way the shell's router reads the URL; the hook re-renders on navigation. Never parse `location` yourself |\n| `useThemeMode()` | React hook returning `'light'` or `'dark'`, updated when the viewer or the OS switches |\n| `dismiss(id?)` | Close a toast raised with `notify(message, { id })` (all toasts without an id) |\n| `Markdown` | The shell's Markdown renderer: `\u003cMarkdown variant=\"docs\"\u003e{text}\u003c/Markdown\u003e` |\n\n```js\nimport { useState } from 'react'\nimport { jsx } from 'react/jsx-runtime'\nimport { registerToolRenderer } from '@aiui/sdk'\n\nexport default function MyPage({ page }) {\n  const [n, setN] = useState(0)\n  return jsx('button', { onClick: () =\u003e setN(n + 1), children: `${page.title}: ${n}` })\n}\n\nregisterToolRenderer('get_weather', ({ args, result }) =\u003e\n  jsx('span', { children: `${args.city}: ${result?.temperature ?? '…'}°` }),\n)\n```\n\nStyle with the theme's CSS variables (`var(--foreground)`, `var(--border)`,\n`var(--primary)`, …). The shell's Tailwind build only contains the classes the\nshell itself uses, so Tailwind classes in a plugin may not exist.\n\n### Shell services\n\nUse the services instead of globals such as `window.fetch` or the history API.\nThey work the same in every page kind and they are part of the SDK contract.\n\n```js\nimport { fetchJson, navigate, notify, onActivate, registerCommand } from '@aiui/sdk'\n\nasync function refresh() {\n  try {\n    const data = await fetchJson('/api/plugins/reports/refresh', { body: { scope: 'week' } })\n    notify(`Refreshed ${data.count} rows`, { type: 'success' })\n  } catch (err) {\n    notify('Refresh failed', { type: 'error', description: err.message })   // err.status, err.body\n  }\n}\n\nregisterCommand({ id: 'reports.refresh', title: 'Refresh reports', group: 'Reports', run: refresh })\nregisterCommand({ id: 'reports.open', title: 'Open reports', keywords: ['weekly'], run: () =\u003e navigate('report') })\n\n// Runs once the manifest is known (immediately, when the app is already running).\nonActivate(({ manifest }) =\u003e {\n  if (manifest.pages.some((p) =\u003e p.id === 'approvals')) {\n    window.addEventListener('aiui:approval-required', () =\u003e notify('An approval is waiting'))\n  }\n})\n```\n\nA command that throws, or whose promise rejects, is reported as a toast. An\n`onActivate` hook that throws is logged and does not stop the other hooks.\n\n#### In-page tabs and live-refreshing data\n\nUse `pageLinkProps()` for in-page navigation links or tabs so ordinary clicks\nstay in the SPA shell (0 document reloads, Back works) while Cmd/Ctrl-click\nstill opens a new tab. Pair it with `useLiveData()` to share the framework's\nabort-on-navigation, hidden-tab pause, retry backoff, and retain-last-result logic:\n\n```js\nimport { createElement as h } from 'react'\nimport { fetchJson, pageLinkProps, useLiveData, useManifest } from '@aiui/sdk'\n\nexport default function OperatingPage({ page }) {\n  const manifest = useManifest()\n  const { data, error, refreshing, refresh } = useLiveData(\n    page.id,\n    (signal) =\u003e fetchJson(`/api/operations?page=${encodeURIComponent(page.id)}`, { signal }),\n    { intervalMs: 120_000 },\n  )\n  const tabs = (manifest?.pages ?? []).filter((p) =\u003e p.group === 'Operating')\n  return h('article', null,\n    h('nav', { 'aria-label': 'Operating pages' },\n      ...tabs.map((tab) =\u003e\n        h('a', {\n          key: tab.id,\n          ...pageLinkProps(tab.id),\n          'aria-current': tab.id === page.id ? 'page' : undefined,\n        }, tab.title),\n      ),\n    ),\n    error \u0026\u0026 h('p', { role: 'alert' }, data ? 'Refresh failed; showing last result.' : error.message),\n    h('button', { type: 'button', onClick: refresh, disabled: refreshing }, refreshing ? 'Refreshing…' : 'Refresh'),\n    data \u0026\u0026 h('pre', null, JSON.stringify(data, null, 2)),\n  )\n}\n```\n\n### Slots\n\nA slot is a place in the shell that renders components from plugins.\n\n| Slot | Where | Extra props |\n|---|---|---|\n| `header:actions` | The header bar, before search and the theme toggle. Not shown when the app hides the page header | |\n| `sidebar:footer` | The bottom of the sidebar, on desktop and in the phone menu | `collapsed` |\n| `page:\u003cid\u003e:toolbar` | Above the body of page `\u003cid\u003e`, for example `page:logs:toolbar` | |\n\nEvery slot component receives `{ slot, pageId, page }`: the slot name, the id\nof the page on screen and its manifest entry.\n\n```js\nimport { jsx } from 'react/jsx-runtime'\nimport { navigate, registerSlot } from '@aiui/sdk'\n\nfunction HelloAction({ pageId }) {\n  if (pageId === 'hello') return null\n  return jsx('button', { type: 'button', onClick: () =\u003e navigate('hello'), children: 'Hello' })\n}\n\nregisterSlot('header:actions', HelloAction, { id: 'hello', order: 50 })\n```\n\n- Pass `{ id, order }` so that several plugins can share a slot. `id` is the\n  identity of your contribution (use the plugin name), and a lower `order`\n  comes first (default `100`). Registering the same `id` again replaces only\n  that contribution.\n- Without options, the call sets the slot's single default contribution and\n  replaces an earlier one. This is the original behaviour.\n- Each contribution renders inside its own error boundary. One that throws is\n  removed and logged; the others and the shell stay.\n- A slot nobody contributes to renders nothing.\n\n### Layouts\n\nA layout owns the frame of the app shell: the navigation, the session list,\nthe top bar, side panels and the phone chrome. The page stays the page: every\npage renders inside every layout, in the outlet the shell hands the frame\n([ADR 0003](https://github.com/MervinPraison/PraisonAIUI/blob/main/docs/adr/0003-selectable-layouts.md)). aiui ships six layouts\n(`chat`, what `aiui run` opens; `chat-canvas`, the app shell's default; plus\n`workbench`, `command`, `guided` and `mission`); the core's own frame is called `classic`. A plugin adds a\nlayout with the same call the built-ins use.\n\n**Which layout is on screen.** The server's manifest lists the layouts it\noffers (`layouts.available`) and its default. The browser takes the first of:\na `?layout=\u003cid\u003e` preview (kept for the tab, never saved), the viewer's own\nchoice (the palette's \"Switch layout: …\" commands or Settings → Appearance,\nsaved in this browser, only when the server allows a user choice), the server\ndefault, the classic frame. A layout the server does not offer is never\nchosen.\n\n**Declare it in Python** with a `layouts()` hook, which returns\n`LayoutSpec`s (or dicts with the same field names), like `pages()`:\n\n```python\nfrom praisonaiui import LayoutSpec\n\nclass AuroraPlugin:\n    name = \"layoutfx\"\n\n    def layouts(self):\n        return [LayoutSpec(id=\"aurora\", title=\"Aurora\", module=\"aurora.js\", order=90)]\n\n    def static_dir(self):\n        return Path(__file__).parent / \"static\"  # /_plugins/layoutfx/aurora.js\n```\n\n| `LayoutSpec` field | Meaning |\n|---|---|\n| `id` | Lower-case letters, digits and `-`, starting with a letter, at most 40 characters; `classic` is reserved |\n| `title`, `description` | Shown in the picker (palette and Settings → Appearance) |\n| `order` | Picker position (default `100`; the built-ins use 10 to 50) |\n| `module` | **Required** for a plugin layout: the ESM file that registers the frame. A relative path resolves into `static_dir()` (`/_plugins/\u003cname\u003e/\u003cfile\u003e`) and gets an SRI `integrity` hash, which the import map carries like a page module's |\n| `css` | Optional stylesheet, resolved the same way (its hash is `cssIntegrity` in the manifest and on the `\u003clink\u003e`), added when the layout first loads |\n| `home` | The page `/` opens while this layout is on screen |\n| `primary` | Page ids of the primary nav, in order (at most 7 shown; YAML `layout.primary` wins) |\n| `look` | Optional: the `meta.look` your frame registers (an id such as `paper`). When the layout is the server's default, the server sets `\u003chtml data-aiui-look\u003e` from the first byte, so the look's fonts load instead of the Pro ones. It is not sent in the manifest |\n\nThe first plugin (or built-in) to declare an id keeps it; a later one is\nignored with a warning, as is a malformed or `classic` id. On a remote or\nauth-enforced server an entry-point plugin's layouts follow the same\ndefault-deny rule as its pages. Configuration (which layouts are offered,\nthe default) is in [Layouts → Plugin layouts](./layouts.md#plugin-layouts).\n\n**Register the frame in the browser.** The shell imports the module only\nwhen the layout is first rendered, never with the other plugin modules, so an\ninactive layout costs nothing. The module either calls `registerLayout(id,\nmeta, Frame)` while it is evaluated (its `meta` then replaces the manifest's\ntitle and description) or default-exports the frame:\n\n```js\nimport { jsx, jsxs } from 'react/jsx-runtime'\nimport { registerLayout } from '@aiui/sdk'\n\nfunction AuroraFrame({ Outlet, nav, chrome, page, fullBleed }) {\n  const items = [...nav.primary, ...nav.groups.flatMap((g) =\u003e g.items), ...nav.footer]\n  return jsxs('div', {\n    style: { display: 'flex', flex: '1 1 0%', minWidth: 0 },\n    children: [\n      jsx('nav', {\n        'aria-label': 'Main',\n        children: items.map((item) =\u003e\n          jsx('a', {\n            href: item.href,\n            'aria-current': item.active ? 'page' : undefined,\n            onClick: (e) =\u003e { e.preventDefault(); nav.go(item.id) },\n            children: item.title,\n          }, item.id),\n        ),\n      }),\n      jsx('main', { id: chrome.mainId, tabIndex: -1, style: { flex: '1 1 0%', overflowY: fullBleed ? 'hidden' : 'auto' },\n        children: jsx(Outlet, {}) }),\n    ],\n  })\n}\n\nregisterLayout('aurora', { title: 'Aurora', description: 'A slim rail and the page' }, AuroraFrame)\n```\n\nThe complete example is `src/frontend/e2e/fixtures/layout-plugin/` (the\nsuite `e2e/specs/layouts-host.spec.ts` runs it).\n\nWhat the frame receives (`LayoutProps`):\n\n| Prop | What it is |\n|---|---|\n| `Outlet` | The routed page, with its error boundary, toolbar slot and loading state. Render it once, inside your `main` |\n| `pageId`, `page`, `fullBleed` | The page on screen, its manifest entry, and whether it asked for no padding (chat, iframes): then give the outlet the full height and no scroll |\n| `nav` | `primary` (at most 7, the layout's own list), `groups` (every other page, by sidebar group, with `folded`), `footer`, `activeId`, `go(pageId)`. Items carry `id`, `title`, `href`, `active`, `navIcon`, `icon`, `group` |\n| `chrome` | `siteTitle`, `siteLogo`, `openPalette({ query? })` (the one command palette, optionally prefilled), `toggleColorMode()`, `Slot` (the shell's slot host: `\u003cchrome.Slot name=\"header:actions\" /\u003e`), `mainId` (give your `main` this id: the skip link and the palette focus it) |\n| `viewport` | `'phone'` (\u003c 768 px), `'tablet'` (\u003c 1024 px) or `'desktop'`; draw your phone frame from it |\n| `layout` | `id`, `available` (the offered layouts), `switchTo(id)` |\n\n`useLayout()` returns `{ id, meta }` of the layout on screen (null for the\nclassic frame), `setLayout(id, { persist }?)` switches live (`''` or\n`'classic'` is the classic frame), and `getLayouts()` lists the registered\nones. `meta.chat` tells the chat page how to present itself in your frame\n(who draws the session list, the thread style, lazy regions such as `aside`,\n`turnFooter` and `composerTool`); see the ADR. `meta.look` names a look of\nthe Pro tokens the frame paints with (the shell ships `paper`; DESIGN.md \"Looks\").\nFrames r
