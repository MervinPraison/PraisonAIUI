></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Handler context</h1>
<p>Inside an <code>@aiui.reply</code> (or <code>@aiui.on_message</code>) handler you can ask who is calling, keep state for</p>
<p>this chat, read the chat's history in the shape an LLM wants, pop a notice,</p>
<p>and call the UI from blocking worker code. Nothing to configure.</p>
<p>Each API resolves to the chat being answered (two people chatting at once never</p>
<p>see each other's data), also in tasks the handler starts and <code>aiui.make_async</code> threads.</p>
<h2>`aiui.context.session`</h2>
<p>| Attribute | Value |</p>
<p>|---|---|</p>
<p>| <code>id</code> | The chat (session) id. |</p>
<p>| <code>user</code> | The signed-in user as a dict (<code>id</code>, <code>username</code>, extra fields; never the password hash), or <code>None</code>. <code>aiui.current_user()</code> returns the same dict. |</p>
<p>| <code>client_type</code> | <code>"webapp"</code> (a browser), <code>"api"</code> (a script or HTTP client), <code>"copilot"</code>, or the bot platform (<code>"slack"</code>, <code>"discord"</code>, <code>"teams"</code>, …). |</p>
<p>| <code>chat_profile</code> | The profile chosen for this chat, or the server-wide selection. |</p>
<p>| <code>chat_settings</code> | Settings sent with the chat (dict). |</p>
<p>| <code>env</code> | Per-chat values sent by the client (dict of strings). |</p>
<p>| <code>language</code> | The best tag of the caller's <code>Accept-Language</code> (<code>"fr-CA"</code>), or <code>None</code>. |</p>
<p>| <code>headers</code> | Request headers, lower-cased, with credentials removed (<code>Authorization</code>, <code>Cookie</code>, and any header whose name mentions a token, key, secret, password, auth or session). |</p>
<p>It is <code>None</code> outside a handler. A client names itself with <code>?client=&lt;name&gt;</code> on the chat WebSocket or an</p>
<p><code>X-Aiui-Client: &lt;name&gt;</code> header (letters, digits, <code>-</code> and <code>_</code>, up to 32</p>
<p>characters). A chat turn (<code>{type: "chat", ...}</code> on <code>/api/chat/ws</code>, or the body</p>
<p>of <code>POST /api/chat/send</code>) may carry <code>chat_profile</code>, <code>chat_settings</code> and <code>env</code>;</p>
<p>they stay with the chat for its later turns.</p>
<h2>`aiui.user_session`</h2>
<p>A key/value store private to the current chat, kept across its turns.</p>
<p>Preset keys: <code>id</code>, <code>user</code>, <code>chat_profile</code>, <code>chat_settings</code>, <code>env</code>. Values live</p>
<p>in memory (the last 5,000 chats), so keep what must survive a restart in your</p>
<p>own database. Outside a handler <code>get</code> returns the default and <code>set</code> raises.</p>
<h2>`aiui.chat_context`</h2>
<p>The chat's messages, oldest first, including the one being answered; each</p>
<p>finished reply is added. After a restart the saved history is reloaded from</p>
<p>the datastore. At most 200 messages are kept.</p>
<p>| Method | Does |</p>
<p>|---|---|</p>
<p>| <code>get()</code> | A copy of the messages: <code>[{"role", "content"}, ...]</code>. |</p>
<p>| <code>add(content, role="assistant")</code> | Append a message (a string with a role, or a <code>{"role", "content"}</code> dict). Roles: <code>system</code>, <code>user</code>, <code>assistant</code>, <code>tool</code>. |</p>
<p>| <code>remove(message)</code> | Remove the latest message equal to <code>message</code>; returns <code>True</code> if one was removed. |</p>
<p>| <code>clear()</code> | Forget the history (for example on a "new topic" command). |</p>
<p>| <code>to_openai(system=None, max_messages=None)</code> | OpenAI chat messages, with an optional system prompt first and only the last <code>max_messages</code>. Works with any OpenAI-compatible client. |</p>
<h2>Blocking code: `aiui.make_async` and `aiui.run_sync`</h2>
<p>Run blocking work in a thread so the chat stays responsive, and call the UI</p>
<p>from inside it:</p>
<p><code>make_async(fn, executor=None)</code> runs <code>fn</code> on a thread pool (yours, if given)</p>
<p>with the handler's context. From that thread, <code>run_sync(coro, timeout=None)</code></p>
<p>runs the coroutine on the server's loop and waits; in a plain script it starts</p>
<p>its own loop; in async code it raises <code>RuntimeError</code> (use <code>await</code>).</p>
<h2>Per-chat setup and clean-up</h2>
<p><code>@aiui.on_chat_start</code> runs once per chat before its first reply, as that chat,</p>
<p>so it is the place to fill <code>aiui.user_session</code>; <code>@aiui.on_chat_end</code> runs as the</p>
<p>chat when its last connection closes. See</p>
<p>Chat lifecycle.</p>
<h2>`aiui.cache`</h2>
<p>Load a model, an index or a client once and share it across every chat</p>
<p>(<code>@aiui.cache(ttl=3600, maxsize=8)</code> takes options; <code>async def</code> works too):</p>
<p>| Option | Does |</p>
<p>|---|---|</p>
<p>| <code>ttl=None</code> | Seconds an entry is kept; <code>None</code> keeps it until cleared. |</p>
<p>| <code>maxsize=None</code> | Keep only the most recently used entries; <code>None</code> for no limit. |</p>
<p>| <code>fn.cache_clear()</code> | Forget every entry. |</p>
<p>Entries are keyed by the arguments (unhashable ones, like a list, by their</p>
<p><code>repr</code>) and live in the server's memory. It is thread-safe; concurrent first</p>
<p>calls share one computation (a caller cancelled by Stop does not cancel it).</p>
<p>Exceptions are never cached, so the next call tries again.</p>
<h2>`aiui.notify`</h2>
<p><code>type</code> is <code>info</code>, <code>success</code>, <code>warning</code> or <code>error</code>; <code>duration</code> is in</p>
<p>milliseconds. The notice is never saved with the reply or added to</p>
<p><code>aiui.chat_context</code>. Clients receive `{type: "toast", session_id, run_id,</p>
<p>message, variant, duration?}` on the chat WebSocket; both built-in chats show</p>
<p>it as a toast. Returns <code>False</code> outside a handler. (<code>aiui.toast(...)</code></p>
<p>builds a toast component for a page.)</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/handler-context.source.md", "text": "# Handler context\n\nInside an `@aiui.reply` (or `@aiui.on_message`) handler you can ask who is calling, keep state for\nthis chat, read the chat's history in the shape an LLM wants, pop a notice,\nand call the UI from blocking worker code. Nothing to configure.\n\n```python\nimport praisonaiui as aiui\nfrom openai import AsyncOpenAI\n\nclient = AsyncOpenAI()\n\n@aiui.reply\nasync def answer(msg):\n    session = aiui.context.session              # who, from where, which language\n    aiui.user_session[\"turns\"] = aiui.user_session.get(\"turns\", 0) + 1\n\n    reply = await client.chat.completions.create(\n        model=\"gpt-4o-mini\",\n        messages=aiui.chat_context.to_openai(system=f\"Answer in {session.language or 'en'}.\"),\n    )\n    await aiui.say(reply.choices[0].message.content)\n    await aiui.notify(\"Answer ready\", type=\"success\")\n```\n\nEach API resolves to the chat being answered (two people chatting at once never\nsee each other's data), also in tasks the handler starts and `aiui.make_async` threads.\n\n## `aiui.context.session`\n\n| Attribute | Value |\n|---|---|\n| `id` | The chat (session) id. |\n| `user` | The signed-in user as a dict (`id`, `username`, extra fields; never the password hash), or `None`. `aiui.current_user()` returns the same dict. |\n| `client_type` | `\"webapp\"` (a browser), `\"api\"` (a script or HTTP client), `\"copilot\"`, or the bot platform (`\"slack\"`, `\"discord\"`, `\"teams\"`, …). |\n| `chat_profile` | The profile chosen for this chat, or the server-wide selection. |\n| `chat_settings` | Settings sent with the chat (dict). |\n| `env` | Per-chat values sent by the client (dict of strings). |\n| `language` | The best tag of the caller's `Accept-Language` (`\"fr-CA\"`), or `None`. |\n| `headers` | Request headers, lower-cased, with credentials removed (`Authorization`, `Cookie`, and any header whose name mentions a token, key, secret, password, auth or session). |\n\nIt is `None` outside a handler. A client names itself with `?client=\u003cname\u003e` on the chat WebSocket or an\n`X-Aiui-Client: \u003cname\u003e` header (letters, digits, `-` and `_`, up to 32\ncharacters). A chat turn (`{type: \"chat\", ...}` on `/api/chat/ws`, or the body\nof `POST /api/chat/send`) may carry `chat_profile`, `chat_settings` and `env`;\nthey stay with the chat for its later turns.\n\n## `aiui.user_session`\n\nA key/value store private to the current chat, kept across its turns.\n\n```python\naiui.user_session.set(\"plan\", \"pro\")       # or aiui.user_session[\"plan\"] = \"pro\"\nplan = aiui.user_session.get(\"plan\", \"free\")\n```\n\nPreset keys: `id`, `user`, `chat_profile`, `chat_settings`, `env`. Values live\nin memory (the last 5,000 chats), so keep what must survive a restart in your\nown database. Outside a handler `get` returns the default and `set` raises.\n\n## `aiui.chat_context`\n\nThe chat's messages, oldest first, including the one being answered; each\nfinished reply is added. After a restart the saved history is reloaded from\nthe datastore. At most 200 messages are kept.\n\n| Method | Does |\n|---|---|\n| `get()` | A copy of the messages: `[{\"role\", \"content\"}, ...]`. |\n| `add(content, role=\"assistant\")` | Append a message (a string with a role, or a `{\"role\", \"content\"}` dict). Roles: `system`, `user`, `assistant`, `tool`. |\n| `remove(message)` | Remove the latest message equal to `message`; returns `True` if one was removed. |\n| `clear()` | Forget the history (for example on a \"new topic\" command). |\n| `to_openai(system=None, max_messages=None)` | OpenAI chat messages, with an optional system prompt first and only the last `max_messages`. Works with any OpenAI-compatible client. |\n\n## Blocking code: `aiui.make_async` and `aiui.run_sync`\n\nRun blocking work in a thread so the chat stays responsive, and call the UI\nfrom inside it:\n\n```python\ndef slow_tool(query: str) -\u003e str:\n    aiui.run_sync(aiui.say(f\"Searching for {query}...\"))   # reaches this chat\n    return search_index(query)\n\n@aiui.reply\nasync def answer(msg):\n    result = await aiui.make_async(slow_tool)(msg.text)\n    await aiui.say(result)\n```\n\n`make_async(fn, executor=None)` runs `fn` on a thread pool (yours, if given)\nwith the handler's context. From that thread, `run_sync(coro, timeout=None)`\nruns the coroutine on the server's loop and waits; in a plain script it starts\nits own loop; in async code it raises `RuntimeError` (use `await`).\n\n## Per-chat setup and clean-up\n\n`@aiui.on_chat_start` runs once per chat before its first reply, as that chat,\nso it is the place to fill `aiui.user_session`; `@aiui.on_chat_end` runs as the\nchat when its last connection closes. See\n[Chat lifecycle](../api/python.md#chat-lifecycle).\n\n## `aiui.cache`\n\nLoad a model, an index or a client once and share it across every chat\n(`@aiui.cache(ttl=3600, maxsize=8)` takes options; `async def` works too):\n\n```python\n@aiui.cache\ndef load_index(path: str):\n    return build_index(path)          # runs once per path\n\n@aiui.on_chat_start\nasync def start():\n    aiui.user_session[\"index\"] = load_index(\"docs/\")\n```\n\n| Option | Does |\n|---|---|\n| `ttl=None` | Seconds an entry is kept; `None` keeps it until cleared. |\n| `maxsize=None` | Keep only the most recently used entries; `None` for no limit. |\n| `fn.cache_clear()` | Forget every entry. |\n\nEntries are keyed by the arguments (unhashable ones, like a list, by their\n`repr`) and live in the server's memory. It is thread-safe; concurrent first\ncalls share one computation (a caller cancelled by Stop does not cancel it).\nExceptions are never cached, so the next call tries again.\n\n## `aiui.notify`\n\n```python\nawait aiui.notify(\"Saved to your notes\", type=\"success\", duration=2000)\n```\n\n`type` is `info`, `success`, `warning` or `error`; `duration` is in\nmilliseconds. The notice is never saved with the reply or added to\n`aiui.chat_context`. Clients receive `{type: \"toast\", session_id, run_id,\nmessage, variant, duration?}` on the chat WebSocket; both built-in chats show\nit as a toast. Returns `False` outside a handler. (`aiui.toast(...)`\nbuilds a toast component for a page.)\n"}</script>
