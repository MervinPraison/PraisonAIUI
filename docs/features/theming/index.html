<p>Set the colour preset, corner radius and colour mode in YAML (<code>site.theme</code>) or</p>
<p>from Python (<code>aiui.set_theme()</code>).</p>
<h2>Theme Presets</h2>
<p>PraisonAIUI includes all 22 official <a href="https://tailwindcss.com/docs/colors">Tailwind CSS colors</a> as theme presets, plus <code>paper</code> (below):</p>
<p>The same settings from Python, which win over YAML:</p>
<p><code>accent</code> (any CSS colour) overrides the preset's accent in a docs site and the</p>
<p>React app shell (<code>style: app</code>); see Branding a docs site.</p>
<p><code>density</code> (<code>compact</code>, <code>comfortable</code> or <code>spacious</code>) applies to the app shell only.</p>
<h3>The docs site look</h3>
<p>A docs site (<code>style: docs</code>, the default for <code>aiui build</code>) uses the</p>
<p>PraisonAI Pro design: the same colours, type, radii and hairlines as the app</p>
<p>shell's layouts. The preset picks the accent: a neutral preset (<code>zinc</code>,</p>
<p><code>slate</code>, <code>stone</code>, <code>gray</code>, <code>neutral</code>) or <code>indigo</code> gives the indigo accent,</p>
<p><code>blue</code> and <code>teal</code> their Pro swatches, and any other colour its own accent,</p>
<p>derived so links and focus rings keep AA contrast. <code>site.customCss</code></p>
<p>(below) still overrides everything. Details: <code>src/frontend/DESIGN.md</code>, "Docs style".</p>
<h3>The Paper preset</h3>
<p><code>preset: paper</code> is the look of the app's Chat and Canvas screen: warm paper</p>
<p>neutrals, a navy accent, Newsreader for titles, Source Sans 3 for text and</p>
<p>JetBrains Mono for code. This site uses it.</p>
<p>!The Paper look in light and dark: the Chat and Canvas screen with the comparison table and the script the agent wrote</p>
<p>What it changes:</p>
<li><strong>Docs sites</strong> (<code>aiui build</code>) draw in the Paper look itself: the palette</li>
<p>in both modes, serif titles, 17px text on a 1.7 line height in a 40rem</p>
<p>column, and the mono for code. The page is paper from its first paint</p>
<p>(<code>aiui build</code> marks <code>&lt;html data-aiui-look="paper"&gt;</code> and writes the paper</p>
<p>colours into <code>assets/theme.css</code>).</p>
<li><strong>The app shell</strong> (<code>style: app</code>) takes Paper's navy as its accent. The</li>
<p>Paper palette and fonts there come with the layout: Chat and Canvas paints</p>
<p>in Paper by default, the other layouts in plain Pro.</p>
<li><strong>Other React styles</strong> (<code>chat</code>, <code>agents</code>, <code>playground</code>) get the navy accent (<code>#2d4f86</code> light, <code>#a9c1ea</code> dark) on warm neutrals.</li>
<p>The fonts are self-hosted (latin woff2, the same files the app shell uses)</p>
<p>and download only when a page draws in them; nothing loads from a font CDN.</p>

<h2>Branding a docs site</h2>
<p>Logo, favicon, brand colour, page background and a fixed colour mode for a</p>
<p>site built with <code>aiui build</code>, all in <code>aiui.yaml</code>:</p>
<li><strong>One line is enough.</strong> <code>logo: images/logo.svg</code> and</li>
<p><code>favicon: images/favicon.svg</code> use one image in both modes.</p>
<li><strong>Files are published for you.</strong> A logo, favicon or background path</li>
<p>relative to <code>aiui.yaml</code> is copied into the build at the same path, with</p>
<p><code>site.basePath</code> applied. <code>aiui validate</code> warns (7102) when the file is</p>
<p>missing or outside the project folder.</p>
<li><strong>The logo swaps live.</strong> With <code>logo.dark</code>, both images are in the page and</li>
<p>CSS shows the one for the current mode, so the theme toggle swaps them</p>
<p>with no flash. An <code>href</code> on another site is a plain link.</p>
<li><strong>The favicon follows the browser.</strong> With <code>favicon.dark</code>, the built pages</li>
<p>get two icon links with <code>media="(prefers-color-scheme: …)"</code>, because the</p>
<p>tab strip follows the browser's scheme, not the page's.</p>
<li><strong>Brand colour with contrast kept.</strong> <code>accent</code> and <code>accentDark</code> take any</li>
<p>colour; links and focus rings are derived from them to keep AA contrast,</p>
<p>and <code>aiui validate</code> warns (7101) with a passing shade when a button colour</p>
<p>is under 3:1 on its background.</p>
<li><strong>Background.</strong> <code>gradient</code> (a soft wash of the accent at the top) and</li>
<p><code>grid</code> (hairlines that fade out) are drawn in CSS from the theme tokens, so</p>
<p>they fit both modes and add no download. An image path or URL covers the</p>
<p>page behind the content; <code>background: {light: bg.png, dark: bg-dark.png}</code></p>
<p>uses one image per mode.</p>
<li><strong>Strict mode.</strong> <code>strict: true</code> removes the theme toggle and ignores a</li>
<p>reader's stored choice, so the site always shows <code>mode</code> (<code>system</code> still</p>
<p>follows the OS).</p>
<h2>Fonts</h2>
<p>One line sets the font of a docs site (<code>aiui build</code>), loaded from</p>
<p><a href="https://fonts.google.com">Google Fonts</a>:</p>
<p>Or one per role, each a Google Fonts family or a font file of your project:</p>
<p>| Key | Value |</p>
<p>|-----|-------|</p>
<p>| <code>body</code> | Text, navigation and the UI (<code>--aiui-font-sans</code>) |</p>
<p>| <code>heading</code> | Page titles and headings (<code>--aiui-font-display</code>); a single family name sets body and headings |</p>
<p>| <code>code</code> | Code blocks and inline code (<code>--aiui-font-mono</code>) |</p>
<p>| <code>family</code> | The family name (letters, digits, spaces, <code>.</code>, <code>_</code>, <code>-</code>) |</p>
<p>| <code>source</code> | A font file beside <code>aiui.yaml</code> (<code>.woff2</code>, <code>.woff</code>, <code>.ttf</code>, <code>.otf</code>), a site path or a URL. Without it the family loads from Google Fonts |</p>
<p>| <code>weight</code> | <code>400</code>, a range <code>"100 900"</code> for a variable font, or for Google Fonts a list <code>[400, 700]</code>. Default: Google Fonts 400 to 700; a file 400 |</p>
<p>| <code>format</code> | <code>woff2</code>, <code>woff</code>, <code>truetype</code> or <code>opentype</code> (default: from the file extension) |</p>
<li><strong>One request for Google Fonts.</strong> Every Google family goes in one stylesheet</li>
<p>link with <code>display=swap</code>, after a preconnect to both Google hosts, so text</p>
<p>shows at once in the fallback font.</p>
<li><strong>Files are self-hosted.</strong> A <code>source</code> file is published at the same path</li>
<p>(with <code>site.basePath</code>), declared with <code>@font-face</code> and <code>font-display: swap</code>,</p>
<p>and a <code>.woff2</code> body font is preloaded. Nothing loads from another host.</p>
<li><strong>Your font, the theme's fallbacks.</strong> The fonts set the theme's own</li>
<p>variables in <code>assets/theme.css</code>, with the system stack behind them, so they</p>
<p>win over the preset's fonts (also <code>paper</code>) in light and dark.</p>
<li><code>aiui validate</code> reports a <code>source</code> file that is not in the project (7014).</li>
<p>A family name with quotes or braces, or a weight such as <code>450</code>, is a config</p>
<p>error.</p>
<h2>Code blocks</h2>
<p>One line picks the colours of every code block on a docs site (<code>aiui build</code>),</p>
<p>from any of the <a href="https://shiki.style/themes">65 bundled themes</a>:</p>
<p>| Key | Value |</p>
<p>|-----|-------|</p>
<p>| <code>code</code> | A theme name for light and dark, or <code>{light, dark}</code> (each defaults to <code>github-light</code> / <code>github-dark</code>) |</p>
<p>| <code>codeLanguages</code> | TextMate grammar files (<code>.json</code>) beside <code>aiui.yaml</code>: a path, or <code>{source, name, aliases}</code> |</p>
<li><strong>The theme's own background.</strong> A chosen theme draws the block on its</li>
<p>background, with the header, hairlines and muted text mixed from its</p>
<p>colours, so <code>code: dracula</code> stays readable on a light page. Without</p>
<p><code>code</code>, blocks keep the site's code background and the GitHub colours.</p>
<li><strong>Loaded only when used.</strong> Each theme and each grammar is its own file; a</li>
<p>page downloads only the theme of its mode and the grammars its fences use.</p>
<li><strong>Your own language.</strong> A grammar is published with the site and loaded on</li>
<p>the first fence that names it. Its fence name is <code>name</code>, else the grammar's</p>
<p><code>name</code> field (lowercased), else the file name; <code>aliases</code> defaults to the</p>
<p>grammar's <code>fileTypes</code>. A grammar wins over a built-in language of the same</p>
<p>name, and languages it embeds (<code>embeddedLangs</code>) highlight too.</p>
<li><code>aiui validate</code> warns with the nearest name when a theme is not bundled</li>
<p>(7015; that mode keeps the GitHub theme), and when a grammar file is missing</p>
<p>(7014) or is not a grammar (7015). Names are lowercased; one with spaces</p>
<p>or other punctuation than <code>+#._-</code> is a config error.</p>
<h2>Custom CSS and JS</h2>
<p>Add your own stylesheets and scripts to every page of a docs build:</p>
<li><strong><code>customCss</code></strong> takes CSS text (anything with a <code>{</code>), a <code>.css</code> file beside</li>
<p><code>aiui.yaml</code>, a site path or a URL, one or a list. Files are published at the</p>
<p>same path; CSS text goes into <code>assets/custom.css</code>. They load in the order</p>
<p>listed, <strong>after every built-in stylesheet</strong> (at the end of <code>&lt;body&gt;</code>, where the</p>
<p>browser still applies them before the app paints), so a rule as specific as</p>
<p>a built-in one wins, and theme variables such as <code>--seed-accent</code> or</p>
<p><code>--aiui-font-sans</code> just work.</p>
<li><strong><code>customJs</code></strong> takes <code>.js</code> or <code>.mjs</code> files or URLs. Each runs once per page</li>
<p>load, after the app's own scripts, in the order listed.</p>
<li>Local files get a <code>?v=</code> content hash, so a new build is never served from a</li>
<p>stale cache.</p>
<li><code>aiui validate</code> reports a file that is not in the project (7014). <code>aiui run</code></li>
<p>keeps applying <code>customCss</code> CSS text as before.</p>
<p>Pages switch without a reload, so a script that works on the page listens</p>
<p>for these events on <code>window</code>:</p>
<p>| Event | <code>detail</code> | When |</p>
<p>|-------|----------|------|</p>
<p>| <code>aiui:navigate</code> | <code>{ path }</code> | A link, the sidebar, search or back/forward moves to another page |</p>
<p>| <code>aiui:content-loaded</code> | <code>{ path, meta }</code> | The page's article is in the document, including the first page; <code>meta</code> holds the page's custom front matter keys |</p>
<p>To change pages from a script, push the URL and send the same event:</p>
<p><code>history.pushState({}, '', '/docs/guide'); window.dispatchEvent(new CustomEvent('aiui:navigate', { detail: { path: '/docs/guide' } }))</code>.</p>

<p><code>site.theme.mode</code> (<code>light</code>, <code>dark</code> or <code>system</code>) wins over <code>darkMode</code>; <code>system</code></p>
<p>follows the reader's OS. The React styles served by <code>aiui run</code> and docs sites</p>
<p>built with <code>aiui build</code> read it, and a viewer's own choice in the theme toggle</p>
<p>wins over both. The full order is in Dark Mode.</p>
<h2>Theme Toggle Component</h2>
<p>The React UI already shows a theme toggle in its header. There is no npm</p>
<p>package to install: inside this repository's frontend (<code>src/frontend</code>) the</p>
<p>component comes from the in-repo components barrel,</p>
<p><code>src/frontend/src/components/index.ts</code>:</p>

<p><code>useThemeMode()</code> from <code>@aiui/sdk</code> instead.</p>
<h2>Custom CSS Variables</h2>
<p>Presets set CSS variables you can override with <code>site.customCss</code> or</p>
<p><code>aiui.set_custom_css()</code>. Each variable holds a complete CSS colour:</p>
<p>A bare HSL triple such as <code>--primary: 221 83% 53%</code> no longer works (`aiui</p>
<p>validate` warns, code 5001). In the app shell, set the seed instead</p>
<p>(<code>--seed-accent: hsl(221 83% 53%)</code>) and the derived colours follow in both</p>
<p>modes; see React app shell: theme seeds.</p>

<p>For full customization, scaffold a React project:</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/theming.source.md", "text": "# Theming\n\nSet the colour preset, corner radius and colour mode in YAML (`site.theme`) or\nfrom Python (`aiui.set_theme()`).\n\n## Theme Presets\n\nPraisonAIUI includes all 22 official [Tailwind CSS colors](https://tailwindcss.com/docs/colors) as theme presets, plus `paper` (below):\n\n```yaml\nsite:\n  theme:\n    preset: \"zinc\"     # Any Tailwind color name\n    radius: \"md\"       # none | sm | md | lg | xl\n    darkMode: true\n```\n\nThe same settings from Python, which win over YAML:\n\n```python\nimport praisonaiui as aiui\n\naiui.set_theme(preset=\"blue\", dark_mode=True, radius=\"lg\")\n```\n\n`accent` (any CSS colour) overrides the preset's accent in a docs site and the\nReact app shell (`style: app`); see [Branding a docs site](#branding-a-docs-site).\n`density` (`compact`, `comfortable` or `spacious`) applies to the app shell only.\n\n### The docs site look\n\nA docs site (`style: docs`, the default for `aiui build`) uses the\nPraisonAI Pro design: the same colours, type, radii and hairlines as the app\nshell's layouts. The preset picks the accent: a neutral preset (`zinc`,\n`slate`, `stone`, `gray`, `neutral`) or `indigo` gives the indigo accent,\n`blue` and `teal` their Pro swatches, and any other colour its own accent,\nderived so links and focus rings keep AA contrast. `site.customCss`\n([below](#custom-css-and-js)) still overrides everything. Details: `src/frontend/DESIGN.md`, \"Docs style\".\n\n### The Paper preset\n\n`preset: paper` is the look of the app's Chat and Canvas screen: warm paper\nneutrals, a navy accent, Newsreader for titles, Source Sans 3 for text and\nJetBrains Mono for code. This site uses it.\n\n```yaml\nsite:\n  theme:\n    preset: \"paper\"\n    mode: \"system\"   # light | dark | system; system follows the reader's OS\n```\n\n![The Paper look in light and dark: the Chat and Canvas screen with the comparison table and the script the agent wrote](../images/theme-comparison.png)\n\nWhat it changes:\n\n- **Docs sites** (`aiui build`) draw in the Paper look itself: the palette\n  in both modes, serif titles, 17px text on a 1.7 line height in a 40rem\n  column, and the mono for code. The page is paper from its first paint\n  (`aiui build` marks `\u003chtml data-aiui-look=\"paper\"\u003e` and writes the paper\n  colours into `assets/theme.css`).\n- **The app shell** (`style: app`) takes Paper's navy as its accent. The\n  Paper palette and fonts there come with the layout: Chat and Canvas paints\n  in Paper by default, the other layouts in plain Pro.\n- **Other React styles** (`chat`, `agents`, `playground`) get the navy accent (`#2d4f86` light, `#a9c1ea` dark) on warm neutrals.\n\nThe fonts are self-hosted (latin woff2, the same files the app shell uses)\nand download only when a page draws in them; nothing loads from a font CDN.\n\n### Available Presets\n\n**Neutral Tones**\n\n| Preset | Description |\n|--------|-------------|\n| `zinc` | Clean gray (default) |\n| `slate` | Cool blue-gray |\n| `stone` | Warm neutral |\n| `gray` | True gray |\n| `neutral` | Balanced neutral |\n\n**Color Accents**\n\n| Preset | Description |\n|--------|-------------|\n| `red` | Bold red |\n| `orange` | Warm orange |\n| `amber` | Golden amber |\n| `yellow` | Bright yellow |\n| `lime` | Fresh lime |\n| `green` | Classic green |\n| `emerald` | Rich emerald |\n| `teal` | Cool teal |\n| `cyan` | Bright cyan |\n| `sky` | Light sky blue |\n| `blue` | Classic blue |\n| `indigo` | Deep indigo |\n| `violet` | Purple violet |\n| `purple` | Rich purple |\n| `fuchsia` | Vibrant fuchsia |\n| `pink` | Soft pink |\n| `rose` | Warm rose |\n\n**Looks**\n\n| Preset | Description |\n|--------|-------------|\n| `paper` | Warm paper, a navy accent, serif titles ([above](#the-paper-preset)) |\n\n## Branding a docs site\n\nLogo, favicon, brand colour, page background and a fixed colour mode for a\nsite built with `aiui build`, all in `aiui.yaml`:\n\n```yaml\nlogo:\n  light: images/logo.svg        # a file beside aiui.yaml, a site path or a URL\n  dark: images/logo-dark.svg    # optional\n  href: https://acme.dev        # optional; a path stays in the site\nfavicon:\n  light: images/favicon.svg\n  dark: images/favicon-dark.svg # optional\nsite:\n  theme:\n    accent: \"#0f766e\"           # any CSS colour\n    accentDark: \"#5eead4\"       # optional, dark mode\n    background: gradient        # gradient | grid | an image path or URL\n    mode: dark\n    strict: true                # keep `mode`, hide the light/dark toggle\n```\n\n- **One line is enough.** `logo: images/logo.svg` and\n  `favicon: images/favicon.svg` use one image in both modes.\n- **Files are published for you.** A logo, favicon or background path\n  relative to `aiui.yaml` is copied into the build at the same path, with\n  `site.basePath` applied. `aiui validate` warns (7102) when the file is\n  missing or outside the project folder.\n- **The logo swaps live.** With `logo.dark`, both images are in the page and\n  CSS shows the one for the current mode, so the theme toggle swaps them\n  with no flash. An `href` on another site is a plain link.\n- **The favicon follows the browser.** With `favicon.dark`, the built pages\n  get two icon links with `media=\"(prefers-color-scheme: …)\"`, because the\n  tab strip follows the browser's scheme, not the page's.\n- **Brand colour with contrast kept.** `accent` and `accentDark` take any\n  colour; links and focus rings are derived from them to keep AA contrast,\n  and `aiui validate` warns (7101) with a passing shade when a button colour\n  is under 3:1 on its background.\n- **Background.** `gradient` (a soft wash of the accent at the top) and\n  `grid` (hairlines that fade out) are drawn in CSS from the theme tokens, so\n  they fit both modes and add no download. An image path or URL covers the\n  page behind the content; `background: {light: bg.png, dark: bg-dark.png}`\n  uses one image per mode.\n- **Strict mode.** `strict: true` removes the theme toggle and ignores a\n  reader's stored choice, so the site always shows `mode` (`system` still\n  follows the OS).\n\n## Fonts\n\nOne line sets the font of a docs site (`aiui build`), loaded from\n[Google Fonts](https://fonts.google.com):\n\n```yaml\nsite:\n  theme:\n    fonts: Inter\n```\n\nOr one per role, each a Google Fonts family or a font file of your project:\n\n```yaml\nsite:\n  theme:\n    fonts:\n      body: Inter\n      heading: { family: Fraunces, weight: \"100 900\" }\n      code: JetBrains Mono\n      # a file beside aiui.yaml; a list of faces for separate weight files\n      # body: { family: Brand Sans, source: fonts/brand.woff2, weight: 400 }\n```\n\n| Key | Value |\n|-----|-------|\n| `body` | Text, navigation and the UI (`--aiui-font-sans`) |\n| `heading` | Page titles and headings (`--aiui-font-display`); a single family name sets body and headings |\n| `code` | Code blocks and inline code (`--aiui-font-mono`) |\n| `family` | The family name (letters, digits, spaces, `.`, `_`, `-`) |\n| `source` | A font file beside `aiui.yaml` (`.woff2`, `.woff`, `.ttf`, `.otf`), a site path or a URL. Without it the family loads from Google Fonts |\n| `weight` | `400`, a range `\"100 900\"` for a variable font, or for Google Fonts a list `[400, 700]`. Default: Google Fonts 400 to 700; a file 400 |\n| `format` | `woff2`, `woff`, `truetype` or `opentype` (default: from the file extension) |\n\n- **One request for Google Fonts.** Every Google family goes in one stylesheet\n  link with `display=swap`, after a preconnect to both Google hosts, so text\n  shows at once in the fallback font.\n- **Files are self-hosted.** A `source` file is published at the same path\n  (with `site.basePath`), declared with `@font-face` and `font-display: swap`,\n  and a `.woff2` body font is preloaded. Nothing loads from another host.\n- **Your font, the theme's fallbacks.** The fonts set the theme's own\n  variables in `assets/theme.css`, with the system stack behind them, so they\n  win over the preset's fonts (also `paper`) in light and dark.\n- `aiui validate` reports a `source` file that is not in the project (7014).\n  A family name with quotes or braces, or a weight such as `450`, is a config\n  error.\n\n## Code blocks\n\nOne line picks the colours of every code block on a docs site (`aiui build`),\nfrom any of the [65 bundled themes](https://shiki.style/themes):\n\n```yaml\nsite:\n  theme:\n    code: dracula                                   # both modes\n    # code: { light: github-light, dark: github-dark-dimmed }\n    codeLanguages:\n      - grammars/mylang.tmLanguage.json             # your own TextMate grammar\n      - { source: grammars/rules.json, name: rules, aliases: [rl] }\n```\n\n| Key | Value |\n|-----|-------|\n| `code` | A theme name for light and dark, or `{light, dark}` (each defaults to `github-light` / `github-dark`) |\n| `codeLanguages` | TextMate grammar files (`.json`) beside `aiui.yaml`: a path, or `{source, name, aliases}` |\n\n- **The theme's own background.** A chosen theme draws the block on its\n  background, with the header, hairlines and muted text mixed from its\n  colours, so `code: dracula` stays readable on a light page. Without\n  `code`, blocks keep the site's code background and the GitHub colours.\n- **Loaded only when used.** Each theme and each grammar is its own file; a\n  page downloads only the theme of its mode and the grammars its fences use.\n- **Your own language.** A grammar is published with the site and loaded on\n  the first fence that names it. Its fence name is `name`, else the grammar's\n  `name` field (lowercased), else the file name; `aliases` defaults to the\n  grammar's `fileTypes`. A grammar wins over a built-in language of the same\n  name, and languages it embeds (`embeddedLangs`) highlight too.\n- `aiui validate` warns with the nearest name when a theme is not bundled\n  (7015; that mode keeps the GitHub theme), and when a grammar file is missing\n  (7014) or is not a grammar (7015). Names are lowercased; one with spaces\n  or other punctuation than `+#._-` is a config error.\n\n## Custom CSS and JS\n\nAdd your own stylesheets and scripts to every page of a docs build:\n\n```yaml\nsite:\n  customCss: styles/brand.css        # or a list of files, URLs and CSS text\n  customJs:\n    - scripts/analytics.js           # .js runs deferred; .mjs as a module\n    - https://plausible.io/js/script.js\n```\n\n- **`customCss`** takes CSS text (anything with a `{`), a `.css` file beside\n  `aiui.yaml`, a site path or a URL, one or a list. Files are published at the\n  same path; CSS text goes into `assets/custom.css`. They load in the order\n  listed, **after every built-in stylesheet** (at the end of `\u003cbody\u003e`, where the\n  browser still applies them before the app paints), so a rule as specific as\n  a built-in one wins, and theme variables such as `--seed-accent` or\n  `--aiui-font-sans` just work.\n- **`customJs`** takes `.js` or `.mjs` files or URLs. Each runs once per page\n  load, after the app's own scripts, in the order listed.\n- Local files get a `?v=` content hash, so a new build is never served from a\n  stale cache.\n- `aiui validate` reports a file that is not in the project (7014). `aiui run`\n  keeps applying `customCss` CSS text as before.\n\nPages switch without a reload, so a script that works on the page listens\nfor these events on `window`:\n\n| Event | `detail` | When |\n|-------|----------|------|\n| `aiui:navigate` | `{ path }` | A link, the sidebar, search or back/forward moves to another page |\n| `aiui:content-loaded` | `{ path, meta }` | The page's article is in the document, including the first page; `meta` holds the page's custom front matter keys |\n\n```js\nwindow.addEventListener('aiui:content-loaded', (e) =\u003e {\n  window.plausible?.('pageview', { u: location.href })\n})\n```\n\nTo change pages from a script, push the URL and send the same event:\n`history.pushState({}, '', '/docs/guide'); window.dispatchEvent(new CustomEvent('aiui:navigate', { detail: { path: '/docs/guide' } }))`.\n\n## Examples\n\n### Minimal (Default)\n```yaml\nsite:\n  theme:\n    preset: \"zinc\"\n    radius: \"md\"\n    darkMode: true\n```\n\n### Corporate (Light Mode)\n```yaml\nsite:\n  theme:\n    preset: \"blue\"\n    radius: \"sm\"\n    darkMode: false\n```\n\n### Colorful (Rounded)\n```yaml\nsite:\n  theme:\n    preset: \"rose\"\n    radius: \"xl\"\n    darkMode: true\n```\n\n### Developer Portal (Sharp)\n```yaml\nsite:\n  theme:\n    preset: \"emerald\"\n    radius: \"none\"\n    darkMode: true\n```\n\n## Dark Mode\n\n```yaml\nsite:\n  theme:\n    darkMode: true   # true | false\n```\n\n`site.theme.mode` (`light`, `dark` or `system`) wins over `darkMode`; `system`\nfollows the reader's OS. The React styles served by `aiui run` and docs sites\nbuilt with `aiui build` read it, and a viewer's own choice in the theme toggle\nwins over both. The full order is in [Dark Mode](dark-mode.md#colour-mode-order).\n\n## Theme Toggle Component\n\nThe React UI already shows a theme toggle in its header. There is no npm\npackage to install: inside this repository's frontend (`src/frontend`) the\ncomponent comes from the in-repo components barrel,\n`src/frontend/src/components/index.ts`:\n\n```tsx\nimport { ThemeToggle } from '@/components'\n\nfunction Header() {\n  return (\n    \u003cheader\u003e\n      \u003cnav\u003e...\u003c/nav\u003e\n      \u003cThemeToggle /\u003e\n    \u003c/header\u003e\n  )\n}\n```\n\nA plugin page in the app shell (`--style app`) reads the current mode with\n`useThemeMode()` from `@aiui/sdk` instead.\n\n## Custom CSS Variables\n\nPresets set CSS variables you can override with `site.customCss` or\n`aiui.set_custom_css()`. Each variable holds a complete CSS colour:\n\n```css\n:root {\n  --background: oklch(1 0 0);\n  --foreground: oklch(0.141 0.005 285.823);\n  --primary: oklch(0.21 0.006 285.885);\n  --radius: 0.5rem;\n}\n```\n\nA bare HSL triple such as `--primary: 221 83% 53%` no longer works (`aiui\nvalidate` warns, code 5001). In the app shell, set the seed instead\n(`--seed-accent: hsl(221 83% 53%)`) and the derived colours follow in both\nmodes; see [React app shell: theme seeds](react-shell.md#theme-seeds-migration).\n\n## Advanced: Custom Frontend\n\nFor full customization, scaffold a React project:\n\n```bash\naiui init --frontend\ncd frontend\npnpm install\npnpm dev\n```\n\n---\n\n## Related Pages\n\n- [CSS Architecture](css-architecture.md) — Deep dive into CSS layers, variables, and cascade order\n- [Theme System](theme-system.md) — Light/dark mode and custom theme registration\n- [Dark Mode](dark-mode.md) — Dark mode toggle configuration\n- [Python API](../api/python.md) — `set_theme()`, `set_custom_css()`, `register_theme()`\n"}</script>
