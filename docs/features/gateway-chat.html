<h2>Quick Start</h2>
<h2>How It Works</h2>
<h3>Full Streaming Data Flow</h3>
<p>A chat message travels through 5 layers before reaching the browser:</p>
<h3>Key Files</h3>
<p>| File | Layer | Responsibility |</p>
<p>|------|-------|----------------|</p>
<p>| <code>aiui/plugins/views/chat.js</code> | Frontend | WS connection, DOM rendering, session history |</p>
<p>| <code>src/praisonaiui/features/chat.py</code> | Backend | ChatManager, <code>_run_and_broadcast</code>, history API |</p>
<p>| <code>src/praisonaiui/server.py</code> | Backend | SSE streaming path (<code>run_agent</code> endpoint) |</p>
<p>| <code>src/praisonaiui/providers/__init__.py</code> | Provider | SDK → RunEvent bridge, <code>_run_direct_mode</code> |</p>
<p>| <code>src/praisonaiui/datastore.py</code> | Storage | <code>MemoryDataStore</code> / <code>JSONFileDataStore</code> |</p>
<p>| <code>src/praisonaiui/provider.py</code> | Protocol | <code>RunEventType</code> enum definition |</p>
<h2>Architecture</h2>
<h2>Agent Tool Resolution</h2>
<p>Agents created via YAML config, CRUD API, jobs, or channel bots automatically get tools resolved through the <code>ToolResolver</code>. Tool names in config are resolved to callable Python functions from 4 sources:</p>
<p>1. Local <code>tools.py</code> file (backward compatibility)</p>
<p>2. <code>praisonaiagents.tools.TOOL_MAPPINGS</code> (built-in tools)</p>
<p>3. <code>praisonai_tools</code> package (community tools)</p>
<p>4. Tool registry (programmatically registered tools)</p>
<h3>YAML Configuration</h3>
<h3>CRUD API</h3>
<p>Agents created via <code>POST /api/agents</code> also support tools:</p>
<h3>Where Tool Resolution Applies</h3>
<p>| Component | Tool Resolution |</p>
<p>|-----------|----------------|</p>
<p>| Gateway <code>_create_agents_from_config()</code> | ✅ <code>ToolResolver</code> |</p>
<p>| Integration <code>create_gateway_from_yaml()</code> | ✅ <code>ToolResolver</code> |</p>
<p>| Provider <code>_get_or_create_agent()</code> | ✅ Default tools |</p>
<p>| Channel bot <code>_start_channel_bot()</code> | ✅ Default tools |</p>
<p>| Jobs <code>_execute_job()</code> fallback | ✅ <code>ToolResolver</code> |</p>
<p>| CRUD agents <code>_run()</code> fallback | ✅ <code>ToolResolver</code> |</p>
<p>| CRUD agents <code>_sync_to_gateway()</code> | ✅ <code>ToolResolver</code> |</p>
<h2>Features</h2>
<h3>Markdown Rendering</h3>
<p>Assistant messages are rendered with full markdown support:</p>
<li><strong>Bold</strong>, *italic*, ~~strikethrough~~</li>
<li>Inline <code>code</code> and fenced code blocks with syntax highlighting</li>
<li>Ordered and unordered lists</li>
<li>Links (auto-detected and rendered safely)</li>
<h3>Tool Call Display</h3>
<p>!Tool Call Streaming</p>
<p>When agents use tools, each call is displayed as a collapsible card:</p>
<li>Tool name and status indicator (running/completed/failed)</li>
<li>Input arguments (JSON)</li>
<li>Output results (rendered in code blocks)</li>
<h4>Tool Call Lifecycle</h4>
<p>Tool calls go through 4 stages: <strong>emit → enrich → dedup → persist</strong>.</p>
<p><strong>1. Emit</strong> — The SDK fires <code>TOOL_CALL_START</code> / <code>DELTA_TOOL_CALL</code> / <code>TOOL_CALL_END</code> events via <code>StreamEventEmitter</code>. The provider maps these to <code>RunEvent</code> types (<code>TOOL_CALL_STARTED</code>, <code>TOOL_CALL_COMPLETED</code>).</p>
<p><strong>2. Enrich</strong> — <code>_run_and_broadcast()</code> in <code>chat.py</code> enriches each tool call event with display-friendly fields via <code>_enrich_tool_payload()</code>:</p>
<p>| Field | Source | Example |</p>
<p>|-------|--------|---------|</p>
<p>| <code>icon</code> | Mapped from tool name | 🔍, 📝, 💾 |</p>
<p>| <code>description</code> | Generated from name + args | "🔍 Searching for 'Django latest version'" |</p>
<p>| <code>step_number</code> | Auto-incrementing counter per run | 1, 2, 3 |</p>
<p>| <code>formatted_result</code> | Truncated result string | "✓ Done" |</p>
<p>| <code>tool_call_id</code> | SDK-assigned or UUID fallback | "call_abc123" |</p>
<p><strong>3. Dedup</strong> — Both <code>DELTA_TOOL_CALL</code> (stream) and hook callbacks fire for the same tool call. The handler uses <code>_seen_tool_started</code> / <code>_seen_tool_completed</code> sets keyed by <code>tool_call_id</code> and <code>name</code> to suppress duplicates. A re-broadcast with <code>has_complete_args=True</code> is allowed to update the description with keyword-rich text.</p>
<p><strong>4. Persist</strong> — After the run completes, all enriched tool calls are merged by <code>tool_call_id</code> into <code>collected_tool_calls</code> and saved alongside the assistant message:</p>
<h4>Tool Call Persistence Schema</h4>
<p>Tool calls are persisted alongside assistant messages in the datastore. When a session is reloaded from history, tool call steps are reconstructed from the <code>toolCalls</code> array on each assistant message.</p>

<h4>History Reload Rendering</h4>
<h3>Session Management</h3>
<li><strong>New Session</strong>: Click "New Chat" to create a fresh session</li>
<li><strong>Session History</strong>: Switch between sessions in the sidebar</li>
<li><strong>Message History</strong>: Full conversation history per session via REST API</li>
<h3>Message Abort</h3>
<li>Click the <strong>Stop</strong> button (or send <code>chat_abort</code> via WebSocket) to cancel an in-progress agent run</li>
<li>The partial response is preserved in history</li>
<h3>File Attachments</h3>
<p>Upload files to include with your chat messages — see Attachments for details.</p>
<h2>Session Persistence</h2>
<p>Chat history is persisted via the <code>BaseDataStore</code> interface (<code>datastore.py</code>). Two implementations are available:</p>
<p>| DataStore | Persistence | Default |</p>
<p>|-----------|-------------|--------|</p>
<p>| <code>MemoryDataStore</code> | Volatile (in-memory only) | Yes (fallback) |</p>
<p>| <code>JSONFileDataStore</code> | Disk (<code>~/.praisonaiui/sessions/</code>) | Yes (when <code>data_dir</code> configured) |</p>
<p>Each session is a JSON file containing:</p>
<p>Messages are appended via <code>add_message()</code> and retrieved via <code>get_messages()</code>. Both methods are <code>async</code> to support future database backends.</p>
<h3>Response Content Strategy</h3>
<p>The <code>content</code> field on assistant messages stores the SDK's final response from <code>agent.chat()</code> — the same text displayed by <code>finalizeDelta()</code> in the live view. This ensures the reloaded view matches what the user saw during streaming.</p>
<p>&gt; [!IMPORTANT]</p>
<p>&gt; During streaming, text tokens are accumulated in <code>full_response</code>. However, when <code>RUN_COMPLETED</code> arrives with <code>event.content</code> (the SDK's authoritative return value), it <strong>replaces</strong> the accumulated tokens for storage. This prevents intermediate narrative text from being duplicated on reload.</p>
