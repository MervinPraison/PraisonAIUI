<p>Built-in SEO for documentation sites — sitemap, robots, llms.txt, per-page meta tags, and crawlable static HTML.</p>
<h2>Configuration</h2>
<p>Top-level <code>seo</code> block in <code>aiui.template.yaml</code>:</p>
<p><code>siteUrl</code> is required for absolute canonical URLs, sitemap, and social tags.</p>
<h2>Build outputs</h2>
<p><code>aiui build</code> automatically generates:</p>
<p>| File | Purpose |</p>
<p>|------|---------|</p>
<p>| <code>sitemap.xml</code> | All doc URLs with <code>lastmod</code> dates |</p>
<p>| <code>robots.txt</code> | Crawl rules + sitemap pointer |</p>
<p>| <code>llms.txt</code> | AI crawler index (<a href="https://llmstxt.org">llmstxt.org</a>) |</p>
<p>| <code>llms-full.txt</code> | Full markdown export for AI tools |</p>
<p>| <code>docs/**/*.html</code> | Per-route HTML with meta tags + crawl nav |</p>
<p>| <code>.nojekyll</code> | GitHub Pages Jekyll bypass |</p>
<p>No extra flags are needed — SEO files are emitted whenever <code>content.docs</code> is configured.</p>
<h2>Page-level overrides</h2>
<p>Use frontmatter on any markdown page:</p>
<p>If <code>description</code> is omitted, the first paragraph is used automatically.</p>
<h2>Per-page HTML includes</h2>
<p>Each route HTML file contains:</p>
<li><code>&lt;link rel="canonical"&gt;</code> (absolute HTTPS)</li>
<li><code>&lt;meta name="description"&gt;</code></li>
<li>Open Graph tags (<code>og:title</code>, <code>og:description</code>, <code>og:url</code>, <code>og:type</code>, <code>og:image</code>)</li>
<li>Twitter Card tags</li>
<li>JSON-LD <code>TechArticle</code> schema</li>
<li>Static <code>&lt;nav&gt;</code> with links to every doc page (for non-JS crawlers)</li>
<li><code>&lt;noscript&gt;</code> pre-rendered page content</li>
<h2>Runtime (SPA navigation)</h2>
<p>When users navigate via the sidebar, React updates title, canonical, OG, Twitter, robots, and JSON-LD to match the current page.</p>
<h2>Deploy</h2>
<p>GitHub Pages deploy runs via the <strong>Deploy Docs</strong> workflow on every push to <code>main</code>. Submit your sitemap in <a href="https://search.google.com/search-console">Google Search Console</a>:</p></noscript></div>
