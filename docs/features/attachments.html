<p>Upload files to include with chat messages — PDFs, CSVs, images, and text files up to 50 MB per file. Uploaded files are <strong>automatically processed</strong> and their content is injected into the agent's prompt.</p>
<p>!Attachments Panel</p>
<h2>Quick Start</h2>
<p>The agent will receive the extracted PDF text prepended to the user message and can answer questions about the document's content.</p>
<h2>How It Works</h2>
<h2>File Processing by Type</h2>
<p>When you send a chat message with <code>attachment_ids</code>, each attachment is processed based on its type:</p>
<p>| File Type | Processing | What the Agent Sees |</p>
<p>|-----------|-----------|-------------------|</p>
<p>| <strong>PDF</strong> (<code>.pdf</code>) | Text extracted via <code>pypdf</code> | Full text content prepended to prompt |</p>
<p>| <strong>Images</strong> (<code>.png</code>, <code>.jpg</code>, etc.) | Passed to SDK multimodal handler | Image sent as base64 to vision-capable LLMs |</p>
<p>| <strong>Text/Code</strong> (<code>.txt</code>, <code>.py</code>, <code>.csv</code>, etc.) | File contents read directly | Full file content prepended to prompt |</p>
<p>!!! note "PDF Dependency"</p>
<p>PDF text extraction requires the <code>pypdf</code> package (<code>pip install pypdf</code>). If <code>pypdf</code> is not installed, a fallback message is shown instead of the extracted text. <code>pypdf</code> is included in PraisonAIUI's dependencies by default.</p>
<h2>Supported File Types</h2>
<p>| Category | Extensions |</p>
<p>|----------|-----------|</p>
<p>| Documents | <code>.pdf</code>, <code>.doc</code>, <code>.docx</code>, <code>.txt</code>, <code>.md</code> |</p>
<p>| Data | <code>.csv</code>, <code>.json</code>, <code>.xml</code>, <code>.yaml</code>, <code>.yml</code> |</p>
<p>| Images | <code>.png</code>, <code>.jpg</code>, <code>.jpeg</code>, <code>.gif</code>, <code>.webp</code>, <code>.svg</code> |</p>
<p>| Code | <code>.py</code>, <code>.js</code>, <code>.ts</code>, <code>.html</code>, <code>.css</code> |</p>
<p>!!! warning "Blocked Types"</p>
<p>Executable files (<code>.exe</code>, <code>.sh</code>, <code>.bat</code>, <code>.cmd</code>, <code>.com</code>) are rejected by default.</p>
<h2>Configuration</h2>
<h2>REST API</h2>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/chat/attachments</code> | POST | Upload a file |</p>
<p>| <code>/api/chat/attachments</code> | GET | List attachments for a session |</p>
<p>| <code>/api/chat/attachments/{id}</code> | DELETE | Delete an attachment |</p>
