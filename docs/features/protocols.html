<p>PraisonAIUI uses a <strong>protocol-driven architecture</strong> to wire features into the server. Every feature module implements the <code>BaseFeatureProtocol</code> ABC, which auto-registers API routes, CLI commands, and health checks.</p>

<h2>BaseFeatureProtocol API</h2>
<p>Every feature module must implement:</p>
<p>| Method | Return | Required | Description |</p>
<p>|--------|--------|----------|-------------|</p>
<p>| <code>name</code> | <code>str</code> | ✓ | Unique feature identifier |</p>
<p>| <code>description</code> | <code>str</code> | ✓ | Human-readable description |</p>
<p>| <code>routes()</code> | <code>List[Route]</code> | ✓ | Starlette routes to mount |</p>
<p>| <code>cli_commands()</code> | <code>List[dict]</code> | ○ | CLI command metadata |</p>
<p>| <code>health()</code> | <code>dict</code> | ○ | Health check (default: <code>{"status": "ok"}</code>) |</p>
<p>| <code>info()</code> | <code>dict</code> | ○ | Metadata for <code>/api/features</code> listing |</p>

<h2>Built-in Features Reference</h2>
<h3>1. Approvals</h3>
<p>Tool-execution approval management with policies, history, and SSE streaming.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/approvals</code> | GET | List all approvals |</p>
<p>| <code>/api/approvals</code> | POST | Create approval request |</p>
<p>| <code>/api/approvals/pending</code> | GET | List pending approvals |</p>
<p>| <code>/api/approvals/history</code> | GET | List resolved approvals |</p>
<p>| <code>/api/approvals/policies</code> | GET | Get auto-approve/deny policies |</p>
<p>| <code>/api/approvals/policies</code> | PUT | Update policies |</p>
<p>| <code>/api/approvals/stream</code> | GET | SSE stream for real-time updates |</p>
<p>| <code>/api/approvals/{id}</code> | GET | Get single approval |</p>
<p>| <code>/api/approvals/{id}/approve</code> | POST | Approve request |</p>
<p>| <code>/api/approvals/{id}/deny</code> | POST | Deny request |</p>
<p><strong>CLI:</strong> <code>aiui approval list</code>, <code>aiui approval pending</code></p>
<h3>2. Channels</h3>
<p>Multi-platform messaging channel management (Discord, Slack, Telegram, WhatsApp, etc.).</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/channels</code> | GET | List all channels (enriched with gateway status) |</p>
<p>| <code>/api/channels</code> | POST | Add a channel |</p>
<p>| <code>/api/channels/platforms</code> | GET | List supported platforms |</p>
<p>| <code>/api/channels/{id}</code> | GET | Get channel details |</p>
<p>| <code>/api/channels/{id}</code> | PUT | Update channel |</p>
<p>| <code>/api/channels/{id}</code> | DELETE | Remove channel |</p>
<p>| <code>/api/channels/{id}/toggle</code> | POST | Enable/disable |</p>
<p>| <code>/api/channels/{id}/status</code> | GET | Live status (gateway-enriched) |</p>
<p>| <code>/api/channels/{id}/restart</code> | POST | Restart channel bot (via gateway) |</p>
<p><strong>CLI:</strong> <code>aiui channel list</code>, <code>aiui channel status</code>, <code>aiui channel platforms</code></p>
<h3>3. Schedules</h3>
<p>Manage scheduled jobs (cron, interval, one-shot).</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/schedules</code> | GET | List all jobs |</p>
<p>| <code>/api/schedules</code> | POST | Add a job |</p>
<p>| <code>/api/schedules/{id}</code> | GET | Get job details |</p>
<p>| <code>/api/schedules/{id}</code> | PUT | Update schedule config |</p>
<p>| <code>/api/schedules/{id}</code> | DELETE | Remove job |</p>
<p>| <code>/api/schedules/{id}/toggle</code> | POST | Enable/disable |</p>
<p>| <code>/api/schedules/{id}/run</code> | POST | Trigger immediately |</p>
<p>| <code>/api/schedules/{id}/stop</code> | POST | Stop running schedule |</p>
<p>| <code>/api/schedules/{id}/stats</code> | GET | Get execution statistics |</p>
<p><strong>CLI:</strong> <code>aiui schedule list</code>, <code>aiui schedule add &lt;name&gt; &lt;msg&gt;</code>, <code>aiui schedule remove &lt;id&gt;</code>, <code>aiui schedule status</code></p>
<h3>4. Memory</h3>
<p>Agent memory management (short-term, long-term, entity).</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/memory</code> | GET | List memories (filter: <code>?type=short\|long\|entity\|all</code>) |</p>
<p>| <code>/api/memory</code> | POST | Add memory entry |</p>
<p>| <code>/api/memory/search</code> | POST | Search memories |</p>
<p>| <code>/api/memory/{id}</code> | GET | Get single memory |</p>
<p>| <code>/api/memory/{id}</code> | DELETE | Delete memory |</p>
<p>| <code>/api/memory</code> | DELETE | Clear memories (filter: <code>?type=all</code>) |</p>
<p><strong>CLI:</strong> <code>aiui memory list</code>, <code>aiui memory add &lt;text&gt;</code>, <code>aiui memory search &lt;query&gt;</code>, <code>aiui memory clear</code>, <code>aiui memory status</code></p>
<h3>5. Nodes</h3>
<p>Execution node registration, agent bindings, and instance presence.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/nodes</code> | GET | List all nodes |</p>
<p>| <code>/api/nodes</code> | POST | Register a node |</p>
<p>| <code>/api/nodes/{id}</code> | GET | Get node details |</p>
<p>| <code>/api/nodes/{id}</code> | PUT | Update node |</p>
<p>| <code>/api/nodes/{id}</code> | DELETE | Remove node |</p>
<p>| <code>/api/nodes/{id}/status</code> | GET | Node status (gateway-enriched) |</p>
<p>| <code>/api/nodes/{id}/agents</code> | GET/PUT | Get/set agent bindings |</p>
<p>| <code>/api/instances</code> | GET | List connected instances |</p>
<p>| <code>/api/instances/heartbeat</code> | POST | Record presence heartbeat |</p>
<p><strong>CLI:</strong> <code>aiui node list</code>, <code>aiui node status</code>, <code>aiui node instances</code></p>
<h3>6. Extended Sessions</h3>
<p>Advanced session management (state, context, labels, usage).</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/sessions/{id}/state</code> | GET | Get session state |</p>
<p>| <code>/api/sessions/{id}/state</code> | POST | Save session state |</p>
<p>| <code>/api/sessions/{id}/context</code> | POST | Build context |</p>
<p>| <code>/api/sessions/{id}/compact</code> | POST | Compact session (with stats) |</p>
<p>| <code>/api/sessions/{id}/reset</code> | POST | Reset session |</p>
<p>| <code>/api/sessions/{id}/preview</code> | GET | Formatted preview |</p>
<p>| <code>/api/sessions/{id}/labels</code> | GET/POST | Get/set labels |</p>
<p>| <code>/api/sessions/{id}/usage</code> | GET | Get usage stats |</p>
<h3>7. Skills</h3>
<p>Agent skill registration and discovery.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/skills</code> | GET | List all tools (filter: <code>?category=</code>, <code>?enabled=</code>, <code>?search=</code>) |</p>
<p>| <code>/api/skills</code> | POST | Register custom skill |</p>
<p>| <code>/api/skills/categories</code> | GET | List tool categories |</p>
<p>| <code>/api/skills/{id}</code> | GET | Get tool details |</p>
<p>| <code>/api/skills/{id}</code> | PUT | Update custom skill |</p>
<p>| <code>/api/skills/{id}</code> | DELETE | Remove custom skill |</p>
<p>| <code>/api/skills/{id}/toggle</code> | POST | Toggle enabled/disabled |</p>
<p>| <code>/api/skills/{id}/config</code> | PUT | Set tool configuration/API keys |</p>
<p><strong>CLI:</strong> <code>aiui skills list</code>, <code>aiui skills status</code></p>
<h3>8. Hooks</h3>
<p>Pre/post operation hooks for tool calls, agent runs, etc.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/hooks</code> | GET | List hooks |</p>
<p>| <code>/api/hooks</code> | POST | Register hook |</p>
<p>| <code>/api/hooks/log</code> | GET | View execution log |</p>
<p>| <code>/api/hooks/{id}</code> | GET | Get hook details |</p>
<p>| <code>/api/hooks/{id}</code> | DELETE | Remove hook |</p>
<p>| <code>/api/hooks/{id}/trigger</code> | POST | Trigger manually |</p>
<p><strong>CLI:</strong> <code>aiui hooks list</code>, <code>aiui hooks trigger &lt;id&gt;</code>, <code>aiui hooks log</code></p>
<h3>9. Workflows</h3>
<p>Multi-step workflow orchestration (Pipeline, Route, Parallel, Loop).</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/workflows</code> | GET | List workflows |</p>
<p>| <code>/api/workflows</code> | POST | Create workflow |</p>
<p>| <code>/api/workflows/runs</code> | GET | List all runs |</p>
<p>| <code>/api/workflows/runs/{id}</code> | GET | Get run details |</p>
<p>| <code>/api/workflows/{id}</code> | GET | Get workflow |</p>
<p>| <code>/api/workflows/{id}</code> | DELETE | Delete workflow |</p>
<p>| <code>/api/workflows/{id}/run</code> | POST | Execute workflow |</p>
<p>| <code>/api/workflows/{id}/status</code> | GET | Workflow status |</p>
<p><strong>CLI:</strong> <code>aiui workflows list</code>, <code>aiui workflows run &lt;id&gt;</code>, <code>aiui workflows status</code>, <code>aiui workflows runs</code></p>
<h3>10. Config Runtime</h3>
<p>Live runtime configuration without server restart.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/config/runtime</code> | GET | Get all config |</p>
<p>| <code>/api/config/runtime</code> | PATCH | Merge config values |</p>
<p>| <code>/api/config/runtime</code> | PUT | Replace all config |</p>
<p>| <code>/api/config/runtime/history</code> | GET | Change history |</p>

<p>| <code>/api/config/runtime/{key}</code> | PUT | Set single key |</p>
<p>| <code>/api/config/runtime/{key}</code> | DELETE | Delete key |</p>
<p>| <code>/api/config/schema</code> | GET | JSON Schema for form rendering |</p>
<p>| <code>/api/config/validate</code> | POST | Validate config without applying |</p>
<p>| <code>/api/config/apply</code> | POST | Validate and apply config |</p>

<p><strong>CLI:</strong> <code>aiui config get [key]</code>, <code>aiui config set &lt;key&gt; &lt;value&gt;</code>, <code>aiui config list</code>, <code>aiui config history</code></p>
<h3>11. Jobs</h3>
<p>Async job submission and monitoring with real-time SSE streaming.</p>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/jobs</code> | GET | List jobs (filter: <code>?status=</code>, <code>?limit=</code>, <code>?offset=</code>) |</p>
<p>| <code>/api/jobs</code> | POST | Submit job (returns 202) |</p>
<p>| <code>/api/jobs/stats</code> | GET | Executor statistics |</p>
<p>| <code>/api/jobs/{id}</code> | GET | Get job details |</p>
<p>| <code>/api/jobs/{id}</code> | DELETE | Delete completed job |</p>
<p>| <code>/api/jobs/{id}/status</code> | GET | Get status + progress |</p>
<p>| <code>/api/jobs/{id}/result</code> | GET | Get result (409 if not complete) |</p>

<h2>Route Ordering</h2>
<p>&gt; <strong>Important:</strong> When defining routes with parametric paths (e.g., <code>/{id}</code>), always place literal paths (e.g., <code>/log</code>, <code>/runs</code>) <strong>before</strong> the parametric route. Starlette matches routes in order, and a parametric route will capture literal segments as parameter values.</p>
