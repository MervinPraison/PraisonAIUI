ckend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/health-endpoints">Health Endpoints Guide</a></li><li><a href="https://ui.praison.ai/docs/api">Reference</a></li><li><a href="https://ui.praison.ai/docs/api/cli">CLI Reference</a></li><li><a href="https://ui.praison.ai/docs/api/python">Python SDK API</a></li><li><a href="https://ui.praison.ai/docs/concepts/configuration">YAML Configuration</a></li><li><a href="https://ui.praison.ai/docs/api/components">Component API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/features-api">Features REST API Reference</a></li><li><a href="https://ui.praison.ai/docs/features/api-reference">API Reference page and OpenAPI document</a></li><li><a href="https://ui.praison.ai/docs/api/sessions">Sessions API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/health">Health API Reference</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/api/typescript">TypeScript SDK Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocols">Feature Protocols</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-architecture">Protocol Architecture Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-versioning">Protocol Versioning</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp">Application Design Protocol (ADP)</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Video Studio</h1>
<p>The Video Studio integrates <a href="https://github.com/MervinPraison/praisonai-video">PraisonAI Video</a> as an external Node render engine. PraisonAIUI provides the dashboard shell, project files, YAML editor, job UX, and HTTP proxying. The video engine handles parse, compile, lint, and MP4 export. <strong>Agents live in PraisonAI (Chat + tools), not inside the renderer.</strong></p>
<h2>Prerequisites</h2>
<p>1. Install PraisonAI Video CLI (<code>praisonai-video</code>) or run from the monorepo.</p>
<p>2. Start the engine sidecar (recommended):</p>
<p>3. Run the example app:</p>
<p>Open the <strong>Video</strong> tab, create a project, edit <code>scene.yaml</code>, and use Lint / Render.</p>
<p>For <strong>Chat</strong> to edit scenes, install <code>praisonaiagents</code> and set <code>OPENAI_API_KEY</code>. Optional: <code>VIDEO_STUDIO_PROJECT_ID</code> to target a specific project.</p>
<h2>Configuration</h2>
<p>| Variable | Default | Purpose |</p>
<p>|----------|---------|---------|</p>
<p>| <code>VIDEO_ENGINE_URL</code> | <code>http://127.0.0.1:3921</code> | HTTP API base URL |</p>
<p>| <code>VIDEO_ENGINE_TOKEN</code> | (none) | Optional Bearer token forwarded to the engine |</p>
<p>| <code>PRAISONAI_PROJECTS_DIR</code> | <code>&lt;data dir&gt;/projects</code> when <code>PRAISONAI_HOME</code> or <code>AIUI_DATA_DIR</code> is set, else <code>~/.praisonai/projects</code> | On-disk project roots |</p>
<p>| <code>PRAISONAI_VIDEO_CLI</code> | (auto-detect) | Path to <code>praisonai-video</code> or <code>dist/cli.js</code> for subprocess fallback |</p>
<p>| <code>VIDEO_STUDIO_PROJECT_ID</code> | (auto) | Active project for agent tools when not passed explicitly |</p>
<p>| <code>PRAISONAI_MODEL</code> | <code>gpt-4o-mini</code> | LLM for Video Editor agent in the example app |</p>
<p>Python API:</p>
<h2>Projects</h2>
<p>Each project is a directory containing:</p>
<li><code>scene.yaml</code> — scene definition</li>
<li><code>scene.visual-test.yaml</code> — optional visual regression spec</li>
<li><code>.praisonai/project.json</code> — metadata</li>
<li><code>exports/</code> — rendered MP4 artefacts</li>
<p>A project id is one folder name inside the projects folder: an id holding <code>/</code>,</p>
<p><code>\</code> or <code>..</code> is answered like an unknown project (404). A <code>projectPath</code> passed to</p>
<p><code>/lint</code>, <code>/compile</code> or <code>/preview/start</code> must be a project folder inside the</p>
<p>projects folder, and the <code>out</code> name for <code>/render</code> must be a plain file name</p>
<p>(400 otherwise).</p>
<h2>API routes</h2>
<p>All routes are under <code>/api/video/</code>:</p>
<li><code>GET /health</code> — sidecar status</li>
<li><code>POST /lint</code>, <code>POST /compile</code> — scene validation</li>
<li><code>GET /preview-url</code>, <code>POST /preview/start</code> — preview iframe URL (CLI; dashboard preview hidden)</li>
<li><code>POST /render</code> — async render job (<code>type: video_render</code>); optional <code>backend</code> (<code>playwright</code> | <code>remotion</code>) overrides <code>scene.yaml</code> <code>render.backend</code></li>
<li><code>GET /jobs/{id}</code> — job status and download URL</li>
<li><code>GET|POST /projects</code> — list and create projects</li>
<li><code>GET /projects/{id}/studio-refresh</code> — poll after agent tool updates (<code>refresh: true</code> once)</li>
<p>When the HTTP sidecar is unavailable, lint and render fall back to subprocess calls to <code>praisonai-video</code>.</p>
<h2>Dashboard plugin</h2>
<p>The UI lives in <code>dashboard-plugins/video-studio/</code> (built-in) or <code>~/.praisonai/dashboard-plugins/video-studio/</code> for overrides. It uses <code>window.aiui.sdk.fetchJSON</code>.</p>
<p><strong>Frame-by-frame composition preview is hidden</strong> in the dashboard (<code>SHOW_COMPOSITION_PREVIEW = false</code>) until serve preview + seek are reliable. Use <strong>Render MP4</strong> and the <strong>Your video</strong> player for output. Set the flag to <code>true</code> in <code>index.js</code> to re-enable the optional iframe scrubber.</p>
<p>After agent tool writes, the editor reloads via <code>video-studio:refresh</code> (custom event) or polling <code>studio-refresh</code>.</p>
<h2>Agent workflow (PraisonAI-first)</h2>
<p>1. Open <strong>Chat</strong> with the Video Editor agent (example app registers tools when <code>praisonaiagents</code> is installed).</p>
<p>2. Agent calls <code>video_get_scene</code> / <code>video_update_scene</code> / <code>video_lint_scene</code> / <code>video_render_project</code> (same outcomes as UI buttons).</p>
<p>3. Video Studio tab picks up changes automatically.</p>
<p>Tools are defined in <code>praisonaiui/video_agent_tools.py</code>. For Cursor/Codex outside the UI, use the skill at <code>skills/praisonai-video/SKILL.md</code> in the PraisonAI Video repo.</p>
<h3>Optional render backends</h3>
<p>Default is <strong>Playwright</strong> (no <code>render:</code> block in <code>scene.yaml</code>). Use Remotion only when required:</p>
<p><code>video_render_project(backend="playwright")</code> overrides YAML for one agent run. Hyperframes is deferred.</p>
<h2>CLI parity</h2>
<p>The text box edits the same <code>scene.yaml</code> the CLI uses. Equivalent commands (from the video repo):</p>
<p>Lint editor text without saving: <code>praisonai-video lint --stdin &lt; scene.yaml</code></p>
<p>See <code>docs/integrations/praisonaiui.md</code> in the PraisonAI Video repo for the full mapping table.</p>
<h2>Related</h2>
<li>Agent UI host — extension patterns (<code>registerView</code>, plugins, <code>@aiui.page</code>)</li>
<li>PraisonAI Video integration doc: <code>docs/integrations/praisonaiui.md</code> in the video repo</li>
<li>PraisonAI Video skill: <code>skills/praisonai-video/SKILL.md</code> — YAML-first invariants for agents and CI</li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/video-studio.source.md", "text": "# Video Studio\n\nThe Video Studio integrates [PraisonAI Video](https://github.com/MervinPraison/praisonai-video) as an external Node render engine. PraisonAIUI provides the dashboard shell, project files, YAML editor, job UX, and HTTP proxying. The video engine handles parse, compile, lint, and MP4 export. **Agents live in PraisonAI (Chat + tools), not inside the renderer.**\n\n## Prerequisites\n\n1. Install PraisonAI Video CLI (`praisonai-video`) or run from the monorepo.\n2. Start the engine sidecar (recommended):\n\n```bash\npraisonai-video serve --port 3921\n```\n\n3. Run the example app:\n\n```bash\naiui run examples/python/video-studio/app.py\n```\n\nOpen the **Video** tab, create a project, edit `scene.yaml`, and use Lint / Render.\n\nFor **Chat** to edit scenes, install `praisonaiagents` and set `OPENAI_API_KEY`. Optional: `VIDEO_STUDIO_PROJECT_ID` to target a specific project.\n\n## Configuration\n\n| Variable | Default | Purpose |\n|----------|---------|---------|\n| `VIDEO_ENGINE_URL` | `http://127.0.0.1:3921` | HTTP API base URL |\n| `VIDEO_ENGINE_TOKEN` | (none) | Optional Bearer token forwarded to the engine |\n| `PRAISONAI_PROJECTS_DIR` | `\u003cdata dir\u003e/projects` when `PRAISONAI_HOME` or `AIUI_DATA_DIR` is set, else `~/.praisonai/projects` | On-disk project roots |\n| `PRAISONAI_VIDEO_CLI` | (auto-detect) | Path to `praisonai-video` or `dist/cli.js` for subprocess fallback |\n| `VIDEO_STUDIO_PROJECT_ID` | (auto) | Active project for agent tools when not passed explicitly |\n| `PRAISONAI_MODEL` | `gpt-4o-mini` | LLM for Video Editor agent in the example app |\n\nPython API:\n\n```python\nfrom praisonaiui.video_config import set_video_engine\n\nset_video_engine(url=\"http://127.0.0.1:3921\", projects_dir=\"~/my-videos\")\n```\n\n## Projects\n\nEach project is a directory containing:\n\n- `scene.yaml` — scene definition\n- `scene.visual-test.yaml` — optional visual regression spec\n- `.praisonai/project.json` — metadata\n- `exports/` — rendered MP4 artefacts\n\nA project id is one folder name inside the projects folder: an id holding `/`,\n`\\` or `..` is answered like an unknown project (404). A `projectPath` passed to\n`/lint`, `/compile` or `/preview/start` must be a project folder inside the\nprojects folder, and the `out` name for `/render` must be a plain file name\n(400 otherwise).\n\n## API routes\n\nAll routes are under `/api/video/`:\n\n- `GET /health` — sidecar status\n- `POST /lint`, `POST /compile` — scene validation\n- `GET /preview-url`, `POST /preview/start` — preview iframe URL (CLI; dashboard preview hidden)\n- `POST /render` — async render job (`type: video_render`); optional `backend` (`playwright` | `remotion`) overrides `scene.yaml` `render.backend`\n- `GET /jobs/{id}` — job status and download URL\n- `GET|POST /projects` — list and create projects\n- `GET /projects/{id}/studio-refresh` — poll after agent tool updates (`refresh: true` once)\n\nWhen the HTTP sidecar is unavailable, lint and render fall back to subprocess calls to `praisonai-video`.\n\n## Dashboard plugin\n\nThe UI lives in `dashboard-plugins/video-studio/` (built-in) or `~/.praisonai/dashboard-plugins/video-studio/` for overrides. It uses `window.aiui.sdk.fetchJSON`.\n\n**Frame-by-frame composition preview is hidden** in the dashboard (`SHOW_COMPOSITION_PREVIEW = false`) until serve preview + seek are reliable. Use **Render MP4** and the **Your video** player for output. Set the flag to `true` in `index.js` to re-enable the optional iframe scrubber.\n\nAfter agent tool writes, the editor reloads via `video-studio:refresh` (custom event) or polling `studio-refresh`.\n\n## Agent workflow (PraisonAI-first)\n\n1. Open **Chat** with the Video Editor agent (example app registers tools when `praisonaiagents` is installed).\n2. Agent calls `video_get_scene` / `video_update_scene` / `video_lint_scene` / `video_render_project` (same outcomes as UI buttons).\n3. Video Studio tab picks up changes automatically.\n\nTools are defined in `praisonaiui/video_agent_tools.py`. For Cursor/Codex outside the UI, use the skill at `skills/praisonai-video/SKILL.md` in the PraisonAI Video repo.\n\n### Optional render backends\n\nDefault is **Playwright** (no `render:` block in `scene.yaml`). Use Remotion only when required:\n\n```yaml\nrender:\n  backend: remotion   # needs Remotion licence + remotion-root export; lint will error on default YAML export\n```\n\n`video_render_project(backend=\"playwright\")` overrides YAML for one agent run. Hyperframes is deferred.\n\n## CLI parity\n\nThe text box edits the same `scene.yaml` the CLI uses. Equivalent commands (from the video repo):\n\n```bash\npraisonai-video project create \"My video\"\npraisonai-video project lint \u003cproject-id\u003e\npraisonai-video project preview \u003cproject-id\u003e\npraisonai-video project test \u003cproject-id\u003e\npraisonai-video project render \u003cproject-id\u003e\npraisonai-video project reset \u003cproject-id\u003e\n```\n\nLint editor text without saving: `praisonai-video lint --stdin \u003c scene.yaml`\n\nSee `docs/integrations/praisonaiui.md` in the PraisonAI Video repo for the full mapping table.\n\n## Related\n\n- [Agent UI host](agent-ui-host.md) — extension patterns (`registerView`, plugins, `@aiui.page`)\n- PraisonAI Video integration doc: `docs/integrations/praisonaiui.md` in the video repo\n- PraisonAI Video skill: `skills/praisonai-video/SKILL.md` — YAML-first invariants for agents and CI\n"}</script>
