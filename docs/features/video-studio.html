<p>The Video Studio integrates <a href="https://github.com/MervinPraison/praisonai-video">PraisonAI Video</a> as an external Node render engine. PraisonAIUI provides the dashboard shell, project files, YAML editor, job UX, and HTTP proxying. The video engine handles parse, compile, lint, and MP4 export. <strong>Agents live in PraisonAI (Chat + tools), not inside the renderer.</strong></p>
<h2>Prerequisites</h2>
<p>1. Install PraisonAI Video CLI (<code>praisonai-video</code>) or run from the monorepo.</p>
<p>2. Start the engine sidecar (recommended):</p>
<p>3. Run the example app:</p>
<p>Open the <strong>Video</strong> tab, create a project, edit <code>scene.yaml</code>, and use Lint / Render.</p>
<p>For <strong>Chat</strong> to edit scenes, install <code>praisonaiagents</code> and set <code>OPENAI_API_KEY</code>. Optional: <code>VIDEO_STUDIO_PROJECT_ID</code> to target a specific project.</p>
<h2>Configuration</h2>
<p>| Variable | Default | Purpose |</p>
<p>|----------|---------|---------|</p>
<p>| <code>VIDEO_ENGINE_URL</code> | <code>http://127.0.0.1:3921</code> | HTTP API base URL |</p>
<p>| <code>VIDEO_ENGINE_TOKEN</code> | (none) | Optional Bearer token forwarded to the engine |</p>
<p>| <code>PRAISONAI_PROJECTS_DIR</code> | <code>~/.praisonai/projects</code> | On-disk project roots |</p>
<p>| <code>PRAISONAI_VIDEO_CLI</code> | (auto-detect) | Path to <code>praisonai-video</code> or <code>dist/cli.js</code> for subprocess fallback |</p>
<p>| <code>VIDEO_STUDIO_PROJECT_ID</code> | (auto) | Active project for agent tools when not passed explicitly |</p>
<p>| <code>PRAISONAI_MODEL</code> | <code>gpt-4o-mini</code> | LLM for Video Editor agent in the example app |</p>
<p>Python API:</p>
<h2>Projects</h2>
<p>Each project is a directory containing:</p>
<li><code>scene.yaml</code> — scene definition</li>
<li><code>scene.visual-test.yaml</code> — optional visual regression spec</li>
<li><code>.praisonai/project.json</code> — metadata</li>
<li><code>exports/</code> — rendered MP4 artefacts</li>
<h2>API routes</h2>
<p>All routes are under <code>/api/video/</code>:</p>
<li><code>GET /health</code> — sidecar status</li>
<li><code>POST /lint</code>, <code>POST /compile</code> — scene validation</li>
<li><code>GET /preview-url</code>, <code>POST /preview/start</code> — preview iframe URL (CLI; dashboard preview hidden)</li>
<li><code>POST /render</code> — async render job (<code>type: video_render</code>); optional <code>backend</code> (<code>playwright</code> | <code>remotion</code>) overrides <code>scene.yaml</code> <code>render.backend</code></li>
<li><code>GET /jobs/{id}</code> — job status and download URL</li>
<li><code>GET|POST /projects</code> — list and create projects</li>
<li><code>GET /projects/{id}/studio-refresh</code> — poll after agent tool updates (<code>refresh: true</code> once)</li>
<p>When the HTTP sidecar is unavailable, lint and render fall back to subprocess calls to <code>praisonai-video</code>.</p>
<h2>Dashboard plugin</h2>
<p>The UI lives in <code>dashboard-plugins/video-studio/</code> (built-in) or <code>~/.praisonai/dashboard-plugins/video-studio/</code> for overrides. It uses <code>window.aiui.sdk.fetchJSON</code>.</p>
<p><strong>Frame-by-frame composition preview is hidden</strong> in the dashboard (<code>SHOW_COMPOSITION_PREVIEW = false</code>) until serve preview + seek are reliable. Use <strong>Render MP4</strong> and the <strong>Your video</strong> player for output. Set the flag to <code>true</code> in <code>index.js</code> to re-enable the optional iframe scrubber.</p>
<p>After agent tool writes, the editor reloads via <code>video-studio:refresh</code> (custom event) or polling <code>studio-refresh</code>.</p>
<h2>Agent workflow (PraisonAI-first)</h2>
<p>1. Open <strong>Chat</strong> with the Video Editor agent (example app registers tools when <code>praisonaiagents</code> is installed).</p>
<p>2. Agent calls <code>video_get_scene</code> / <code>video_update_scene</code> / <code>video_lint_scene</code> / <code>video_render_project</code> (same outcomes as UI buttons).</p>
<p>3. Video Studio tab picks up changes automatically.</p>
<p>Tools are defined in <code>praisonaiui/video_agent_tools.py</code>. For Cursor/Codex outside the UI, use the skill at <code>skills/praisonai-video/SKILL.md</code> in the PraisonAI Video repo.</p>
<h3>Optional render backends</h3>
<p>Default is <strong>Playwright</strong> (no <code>render:</code> block in <code>scene.yaml</code>). Use Remotion only when required:</p>
<p><code>video_render_project(backend="playwright")</code> overrides YAML for one agent run. Hyperframes is deferred.</p>
<h2>CLI parity</h2>
<p>The text box edits the same <code>scene.yaml</code> the CLI uses. Equivalent commands (from the video repo):</p>
<p>Lint editor text without saving: <code>praisonai-video lint --stdin &lt; scene.yaml</code></p>
<p>See <code>docs/integrations/praisonaiui.md</code> in the PraisonAI Video repo for the full mapping table.</p>
