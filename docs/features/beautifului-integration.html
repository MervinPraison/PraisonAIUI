tocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/typescript">Typescript</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li></ul></nav><h1>BeautifulUI Integration Strategy</h1>
<p>&gt; <strong>Epic:</strong> <a href="https://github.com/MervinPraison/PraisonAIUI/issues/292">#292</a> — BeautifulUI integration strategy for AI-native dashboard UX.</p>
<p>&gt; This is the durable, agreed strategy that the linked child issues execute against.</p>
<p><a href="https://www.beautifului.dev/">BeautifulUI</a> (MIT, Shane Levine / Turbo) is a <strong>copy-paste / shadcn-registry</strong> library of React primitives for AI-native interfaces: thinking traces, streaming answers with inline sources, HITL approval cards, tool chips, task rows, context chunks, diff/records tables, prompt bars, and a reference chat harness.</p>
<p>There is <strong>no published npm package</strong> named <code>beautiful-ui</code>. It ships only as source consumed via the shadcn registry or manual copy.</p>
<h2>1. Strategic decision</h2>
<p>BeautifulUI is adopted as <strong>vendored source</strong>, not a runtime dependency, and is exposed to dashboard plugins <strong>only through the existing <code>@praisonaiui/react</code> package</strong> — never by importing upstream file paths directly. Rollout is <strong>phased behind a feature flag</strong>, keeping the current vanilla dashboard as the fallback until parity is proven.</p>
<p>Upstream stack (Next.js 15 · React 19 · Tailwind v4 · TypeScript) is closely aligned with PraisonAIUI's <code>src/frontend</code> (Vite · React 19 · Tailwind v4 · shadcn/Radix), so primitives port with adapter work rather than a runtime bridge.</p>
<h2>2. Pillars</h2>
<p>| # | Pillar | Decision |</p>
<p>|---|--------|----------|</p>
<p>| 1 | <strong>Vendoring model</strong> | Add primitives into <code>src/frontend</code> via <code>npx shadcn add https://www.beautifului.dev/r/&lt;component&gt;.json</code>, or manual copy from <a href="https://github.com/slev12397/beautiful-ui">github.com/slev12397/beautiful-ui</a>. Pin via lockfile plus a recorded registry URL / git SHA. No <code>beautiful-ui</code> npm dependency in production builds. |</p>
<p>| 2 | <strong>Adapter layer</strong> | Map PraisonAIUI chat / approval / trace <strong>protocol events</strong> to stable internal props. Primitives sit behind <code>@praisonaiui/react</code> exports; dashboard plugins consume those exports, not upstream paths. See <a href="https://github.com/MervinPraison/PraisonAIUI/issues/294">#294</a>. |</p>
<p>| 3 | <strong>Hybrid rollout</strong> | Mount React <strong>islands</strong> (or expand <code>@praisonaiui/react</code>) for high-value surfaces first — chat streaming/thinking/tools, then approvals. Vanilla chat (<code>templates/frontend/plugins/views/chat.js</code>) stays as the flag-gated fallback until parity is proven. |</p>
<p>| 4 | <strong>Token strategy</strong> | Merge BeautifulUI foundation CSS <strong>selectively</strong> into the existing shadcn theme generation (<code>praisonaiui/themes.py</code>). One design system per page — avoid two competing token sets. |</p>
<p>| 5 | <strong>Icon licence</strong> | Upstream <code>SidebarNav</code> uses the paid <code>@central-icons-react</code>. Port nav patterns with <strong>lucide-react</strong> (already in PraisonAIUI) instead. |</p>
<h2>3. Phasing</h2>
<p>1. <strong>Spike</strong> — evaluate primitives in the dev environment, confirm React 19 / Tailwind v4 alignment. <a href="https://github.com/MervinPraison/PraisonAIUI/issues/293">#293</a></p>
<p>2. <strong>Architecture</strong> — adapter layer + upstream pin policy. <a href="https://github.com/MervinPraison/PraisonAIUI/issues/294">#294</a></p>
<p>3. <strong>CI gate</strong> — frontend build + BeautifulUI compatibility check (no frontend build gate exists today). <a href="https://github.com/MervinPraison/PraisonAIUI/issues/295">#295</a></p>
<p>4. <strong>Migrations</strong> — chat streaming / thinking / tool chips (<a href="https://github.com/MervinPraison/PraisonAIUI/issues/296">#296</a>), then the approval card (<a href="https://github.com/MervinPraison/PraisonAIUI/issues/297">#297</a>).</p>
<p>5. <strong>Docs</strong> — upgrade playbook + MIT attribution. <a href="https://github.com/MervinPraison/PraisonAIUI/issues/298">#298</a></p>
<h2>4. Risks</h2>
<p>| Risk | Mitigation |</p>
<p>|------|------------|</p>
<p>| No semver npm package | Vendor the source; pin to a recorded registry URL / git SHA in the lockfile. |</p>
<p>| Upstream breaking registry JSON | Vendoring decouples builds from live registry; re-sync is a deliberate, reviewed step. |</p>
<p>| Icon licence (<code>@central-icons-react</code> is paid) | Use lucide-react for ported nav patterns; never vendor the paid package. |</p>
<p>| Two competing design systems on one page | Selective CSS token merge into <code>themes.py</code>; adapter-only prop surface. |</p>
<p>| React / Tailwind drift | Upstream (React 19 / Tailwind v4) already matches <code>src/frontend</code>; the CI gate catches drift. |</p>
<h2>5. Out of scope</h2>
<li>Replacing the entire dashboard shell in one PR.</li>
<li>PyPI packaging of BeautifulUI.</li>
<li>iframe embedding of beautifului.dev.</li>
<li>Depending on any unpublished npm package for production builds.</li>
<h2>6. Acceptance criteria status</h2>
<li>[x] Written integration strategy agreed (vendoring + adapter + phased rollout) — this document.</li>
<li>[x] Risks documented — section 4.</li>
<li>[x] Child issues filed and prioritised — <a href="https://github.com/MervinPraison/PraisonAIUI/issues/293">#293</a>–<a href="https://github.com/MervinPraison/PraisonAIUI/issues/298">#298</a>.</li>
<li>[x] No requirement to depend on unpublished npm packages for production builds — pillar 1, out of scope.</li></noscript></div>
