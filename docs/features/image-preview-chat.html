></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Image Preview in Chat</h1>
<p>Protocol-driven inline media for agent-generated images (and other element types) during chat streaming. Any backend that implements <code>BaseProvider</code> can emit images without PraisonAI-specific code in chat or the frontend.</p>
<h2>Problem This Solves</h2>
<p>Before this feature, PraisonAIUI could <strong>render</strong> images (<code>Message.add_image</code>, <code>ElementRenderer</code>) but the <strong>wire protocol dropped media</strong> during agent runs. ImageAgent / tool results appeared as JSON in the tool-call panel instead of inline <code>&lt;img&gt;</code> previews.</p>
<h2>Architecture</h2>
<p>Modular layers — same pattern as A2UI surfaces:</p>
<h3>Layer responsibilities</h3>
<p>| Layer | Module | Backend-agnostic? |</p>
<p>|-------|--------|-------------------|</p>
<p>| <strong>Detection</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/media_utils.py"><code>media_utils.py</code></a> | Yes — normalises OpenAI, URL, b64, element dicts |</p>
<p>| <strong>Protocol</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/provider.py"><code>provider.py</code></a> — <code>RunEventType.MESSAGE_ELEMENT</code> | Yes |</p>
<p>| <strong>Adapter</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/providers/__init__.py"><code>providers/__init__.py</code></a> — PraisonAI bridge only | No — maps SDK/callback queue → protocol |</p>
<p>| <strong>Transport</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/features/chat.py"><code>chat.py</code></a> — broadcast + persist | Yes |</p>
<p>| <strong>Storage</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/features/attachments.py"><code>attachments.py</code></a> — <code>GET /api/chat/media/{id}</code> | Yes — reuses attachment store for b64 |</p>
<p>| <strong>UI</strong> | <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/plugins/views/chat.js"><code>chat.js</code></a>, <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/src/chat-engine/parts/media/MultimediaElements.tsx"><code>ElementRenderer</code></a> | Yes — renders <code>{type, url, alt}</code> |</p>
<p>Detection and UI do <strong>not</strong> import PraisonAI. Only the provider adapter knows ImageAgent / OpenAI <code>{data: [{url}]}</code> shapes.</p>
<h2>Wire protocol</h2>
<h3>Event type</h3>
<p>Defined in Python as <code>RunEventType.MESSAGE_ELEMENT</code> and mirrored in <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/src/types.ts"><code>types.ts</code></a>.</p>
<h3>Helper (any provider)</h3>
<p>Element shape reuses the existing message element schema (<code>image</code>, <code>pdf</code>, <code>video</code>, <code>audio</code>, <code>file</code>, <code>code</code>).</p>
<h2>Data flow paths</h2>
<h3>1. Custom provider (swappable backend)</h3>
<p>Example app: <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/30-image-preview/app.py"><code>examples/python/30-image-preview/app.py</code></a>.</p>
<h3>2. Callback handler (`@aiui.reply`)</h3>
<p><code>PraisonAIProvider</code> maps queue events (<code>image</code>, <code>message</code> + <code>elements</code>) → <code>MESSAGE_ELEMENT</code>.</p>
<h3>3. Tool results (automatic detection)</h3>
<p>When a tool completes, <code>tool_completed_extra()</code> in <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/a2ui_utils.py"><code>a2ui_utils.py</code></a> calls <code>build_media_extra()</code> from <code>media_utils</code>. Supported shapes:</p>
<p>| Input shape | Example |</p>
<p>|-------------|---------|</p>
<p>| OpenAI / ImageAgent | <code>{"data": [{"url": "...", "b64_json": "...", "revised_prompt": "..."}]}</code> |</p>
<p>| Explicit element | <code>{"type": "image", "url": "..."}</code> |</p>
<p>| Plain URL string | <code>"https://cdn.example.com/out.png"</code> |</p>
<p>| Data URL | <code>"data:image/png;base64,..."</code> |</p>
<p>| Nested elements | <code>{"elements": [{"type": "video", "url": "..."}]}</code> |</p>
<p><code>chat.py</code> broadcasts <code>message_element</code> for each detected element and attaches <code>elements</code> to the persisted assistant message.</p>
<h3>4. ImageAgent direct mode</h3>
<p>If the registered agent's <code>chat()</code> returns an OpenAI-shaped dict, <code>PraisonAIProvider._run_direct_mode</code> runs <code>extract_media_elements()</code> and emits <code>MESSAGE_ELEMENT</code> events before <code>RUN_COMPLETED</code>.</p>
<h2>Base64 storage</h2>
<p>Large <code>b64_json</code> payloads are <strong>not</strong> stored inline in message history. They are decoded and saved via <code>AttachmentManager</code>, then served at:</p>
<p>If storage fails, the system falls back to a <code>data:image/png;base64,...</code> URL.</p>
<h2>Frontend rendering</h2>
<p>| Surface | Handler |</p>
<p>|---------|---------|</p>
<p>| Dashboard chat (template) | <code>chat.js</code> — <code>case 'message_element': appendMediaElement()</code> |</p>
<p>| React chat | <code>streamingStore.ts</code> — <code>pendingElements</code> + <code>ElementRenderer</code> |</p>
<p>| Tool call panel | Thumbnail from <code>toolCall.elements</code> when expanded |</p>
<p>| Session reload | <code>elements</code> on messages from <code>/api/chat/history</code> and <code>/sessions/{id}/runs</code> |</p>
<p>See also Message Elements for element properties and display modes.</p>
<h2>Deduplication</h2>
<p><code>_collect_element()</code> in <code>chat.py</code> dedupes by URL so the same image is not stored twice when both a <code>MESSAGE_ELEMENT</code> event and a tool completion carry the same URL.</p>
<h2>Out of scope</h2>
<li><strong>REST image generation</strong> (<code>POST /v1/images/generations</code>) — separate OpenAI-compat endpoint; not wired into chat streaming</li>
<li><strong>Canvas / A2UI surfaces</strong> — separate feature for agent-driven UI catalogs</li>
<li><strong>Auto-registering ImageAgent</strong> — agents are configured explicitly by the user</li>
<h2>Tests</h2>
<p>Coverage includes: detection normalisation, b64 fallback, provider callback bridge, <code>_run_and_broadcast</code> persistence, media serve route, ImageAgent dict responses, URL dedup.</p>
<h2>Related docs</h2>
<li>Providers — provider protocol and inline media snippet</li>
<li>Message Elements — element types and Python API</li>
<li>Attachments — user file uploads (separate from generated media serve path)</li>
<li>Gateway Chat — WebSocket event flow</li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/image-preview-chat.source.md", "text": "# Image Preview in Chat\n\nProtocol-driven inline media for agent-generated images (and other element types) during chat streaming. Any backend that implements `BaseProvider` can emit images without PraisonAI-specific code in chat or the frontend.\n\n## Problem This Solves\n\nBefore this feature, PraisonAIUI could **render** images (`Message.add_image`, `ElementRenderer`) but the **wire protocol dropped media** during agent runs. ImageAgent / tool results appeared as JSON in the tool-call panel instead of inline `\u003cimg\u003e` previews.\n\n## Architecture\n\nModular layers — same pattern as [A2UI surfaces](./agent-ui-host.md):\n\n```mermaid\nsequenceDiagram\n    participant Backend as Provider_or_Tool\n    participant Detect as media_utils.py\n    participant Protocol as RunEvent_MESSAGE_ELEMENT\n    participant Chat as chat.py\n    participant UI as chat.js_React\n\n    Backend-\u003e\u003eDetect: tool result or callback payload\n    Detect-\u003e\u003eProtocol: normalised element dict\n    Protocol-\u003e\u003eChat: broadcast message_element\n    Chat-\u003e\u003eUI: WebSocket / SSE frame\n    UI-\u003e\u003eUI: appendMediaElement / ElementRenderer\n    Chat-\u003e\u003eChat: persist elements in session history\n```\n\n### Layer responsibilities\n\n| Layer | Module | Backend-agnostic? |\n|-------|--------|-------------------|\n| **Detection** | [`media_utils.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/media_utils.py) | Yes — normalises OpenAI, URL, b64, element dicts |\n| **Protocol** | [`provider.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/provider.py) — `RunEventType.MESSAGE_ELEMENT` | Yes |\n| **Adapter** | [`providers/__init__.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/providers/__init__.py) — PraisonAI bridge only | No — maps SDK/callback queue → protocol |\n| **Transport** | [`chat.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/features/chat.py) — broadcast + persist | Yes |\n| **Storage** | [`attachments.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/features/attachments.py) — `GET /api/chat/media/{id}` | Yes — reuses attachment store for b64 |\n| **UI** | [`chat.js`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/plugins/views/chat.js), [`ElementRenderer`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/src/chat-engine/parts/media/MultimediaElements.tsx) | Yes — renders `{type, url, alt}` |\n\nDetection and UI do **not** import PraisonAI. Only the provider adapter knows ImageAgent / OpenAI `{data: [{url}]}` shapes.\n\n## Wire protocol\n\n### Event type\n\n```\ntype: \"message_element\"\nelement: { \"type\": \"image\", \"url\": \"...\", \"alt\": \"...\" }\nsession_id: \"...\"\nrun_id: \"...\"\n```\n\nDefined in Python as `RunEventType.MESSAGE_ELEMENT` and mirrored in [`types.ts`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/frontend/src/types.ts).\n\n### Helper (any provider)\n\n```python\nfrom praisonaiui.provider import BaseProvider, RunEvent, RunEventType\n\nyield BaseProvider.message_element_event({\n    \"type\": \"image\",\n    \"url\": \"https://example.com/out.png\",\n    \"alt\": \"Generated image\",\n})\n```\n\nElement shape reuses the existing [message element schema](./message-elements.md) (`image`, `pdf`, `video`, `audio`, `file`, `code`).\n\n## Data flow paths\n\n### 1. Custom provider (swappable backend)\n\n```python\nimport praisonaiui as aiui\nfrom praisonaiui.provider import BaseProvider, RunEvent, RunEventType\n\nclass MyImageProvider(BaseProvider):\n    async def run(self, message, *, session_id=None, agent_name=None, **kw):\n        yield RunEvent(type=RunEventType.RUN_STARTED)\n        # Call any image API here (OpenAI, Stability, local, etc.)\n        yield BaseProvider.message_element_event({\n            \"type\": \"image\",\n            \"url\": image_url,\n            \"alt\": \"Generated image\",\n        })\n        yield RunEvent(type=RunEventType.RUN_COMPLETED, content=\"Here is your image.\")\n\naiui.set_provider(MyImageProvider())\n```\n\nExample app: [`examples/python/30-image-preview/app.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/30-image-preview/app.py).\n\n### 2. Callback handler (`@aiui.reply`)\n\n```python\nimport praisonaiui as aiui\nfrom praisonaiui import Message\n\n@aiui.reply\nasync def on_message(msg):\n    m = Message(content=\"Here is your image:\")\n    m.add_image(\"https://example.com/chart.png\", alt=\"Chart\")\n    await m.send()\n```\n\n`PraisonAIProvider` maps queue events (`image`, `message` + `elements`) → `MESSAGE_ELEMENT`.\n\n### 3. Tool results (automatic detection)\n\nWhen a tool completes, `tool_completed_extra()` in [`a2ui_utils.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/a2ui_utils.py) calls `build_media_extra()` from `media_utils`. Supported shapes:\n\n| Input shape | Example |\n|-------------|---------|\n| OpenAI / ImageAgent | `{\"data\": [{\"url\": \"...\", \"b64_json\": \"...\", \"revised_prompt\": \"...\"}]}` |\n| Explicit element | `{\"type\": \"image\", \"url\": \"...\"}` |\n| Plain URL string | `\"https://cdn.example.com/out.png\"` |\n| Data URL | `\"data:image/png;base64,...\"` |\n| Nested elements | `{\"elements\": [{\"type\": \"video\", \"url\": \"...\"}]}` |\n\n`chat.py` broadcasts `message_element` for each detected element and attaches `elements` to the persisted assistant message.\n\n### 4. ImageAgent direct mode\n\nIf the registered agent's `chat()` returns an OpenAI-shaped dict, `PraisonAIProvider._run_direct_mode` runs `extract_media_elements()` and emits `MESSAGE_ELEMENT` events before `RUN_COMPLETED`.\n\n## Base64 storage\n\nLarge `b64_json` payloads are **not** stored inline in message history. They are decoded and saved via `AttachmentManager`, then served at:\n\n```\nGET /api/chat/media/{attachment_id}\n```\n\nIf storage fails, the system falls back to a `data:image/png;base64,...` URL.\n\n## Frontend rendering\n\n| Surface | Handler |\n|---------|---------|\n| Dashboard chat (template) | `chat.js` — `case 'message_element': appendMediaElement()` |\n| React chat | `streamingStore.ts` — `pendingElements` + `ElementRenderer` |\n| Tool call panel | Thumbnail from `toolCall.elements` when expanded |\n| Session reload | `elements` on messages from `/api/chat/history` and `/sessions/{id}/runs` |\n\nSee also [Message Elements](./message-elements.md) for element properties and display modes.\n\n## Deduplication\n\n`_collect_element()` in `chat.py` dedupes by URL so the same image is not stored twice when both a `MESSAGE_ELEMENT` event and a tool completion carry the same URL.\n\n## Out of scope\n\n- **REST image generation** (`POST /v1/images/generations`) — separate OpenAI-compat endpoint; not wired into chat streaming\n- **Canvas / A2UI surfaces** — separate feature for agent-driven UI catalogs\n- **Auto-registering ImageAgent** — agents are configured explicitly by the user\n\n## Tests\n\n```bash\npytest tests/unit/test_media_utils.py \\\n       tests/integration/test_chat_image_preview.py -v -o addopts=\n```\n\nCoverage includes: detection normalisation, b64 fallback, provider callback bridge, `_run_and_broadcast` persistence, media serve route, ImageAgent dict responses, URL dedup.\n\n## Related docs\n\n- [Providers](../concepts/providers.md) — provider protocol and inline media snippet\n- [Message Elements](./message-elements.md) — element types and Python API\n- [Attachments](./attachments.md) — user file uploads (separate from generated media serve path)\n- [Gateway Chat](./gateway-chat.md) — WebSocket event flow\n"}</script>
