<p>Protocol-driven inline media for agent-generated images (and other element types) during chat streaming. Any backend that implements <code>BaseProvider</code> can emit images without PraisonAI-specific code in chat or the frontend.</p>
<h2>Problem This Solves</h2>
<p>Before this feature, PraisonAIUI could <strong>render</strong> images (<code>Message.add_image</code>, <code>ElementRenderer</code>) but the <strong>wire protocol dropped media</strong> during agent runs. ImageAgent / tool results appeared as JSON in the tool-call panel instead of inline <code>&lt;img&gt;</code> previews.</p>
<h2>Architecture</h2>
<p>Modular layers — same pattern as A2UI surfaces:</p>
<h3>Layer responsibilities</h3>
<p>| Layer | Module | Backend-agnostic? |</p>
<p>|-------|--------|-------------------|</p>
<p>| <strong>Detection</strong> | <code>media_utils.py</code> | Yes — normalises OpenAI, URL, b64, element dicts |</p>
<p>| <strong>Protocol</strong> | <code>provider.py</code> — <code>RunEventType.MESSAGE_ELEMENT</code> | Yes |</p>
<p>| <strong>Adapter</strong> | <code>providers/__init__.py</code> — PraisonAI bridge only | No — maps SDK/callback queue → protocol |</p>
<p>| <strong>Transport</strong> | <code>chat.py</code> — broadcast + persist | Yes |</p>
<p>| <strong>Storage</strong> | <code>attachments.py</code> — <code>GET /api/chat/media/{id}</code> | Yes — reuses attachment store for b64 |</p>
<p>| <strong>UI</strong> | <code>chat.js</code>, <code>ElementRenderer</code> | Yes — renders <code>{type, url, alt}</code> |</p>
<p>Detection and UI do <strong>not</strong> import PraisonAI. Only the provider adapter knows ImageAgent / OpenAI <code>{data: [{url}]}</code> shapes.</p>
<h2>Wire protocol</h2>
<h3>Event type</h3>
<p>Defined in Python as <code>RunEventType.MESSAGE_ELEMENT</code> and mirrored in <code>types.ts</code>.</p>
<h3>Helper (any provider)</h3>
<p>Element shape reuses the existing message element schema (<code>image</code>, <code>pdf</code>, <code>video</code>, <code>audio</code>, <code>file</code>, <code>code</code>).</p>
<h2>Data flow paths</h2>
<h3>1. Custom provider (swappable backend)</h3>
<p>Example app: <code>examples/python/30-image-preview/app.py</code>.</p>
<h3>2. Callback handler (`@aiui.reply`)</h3>
<p><code>PraisonAIProvider</code> maps queue events (<code>image</code>, <code>message</code> + <code>elements</code>) → <code>MESSAGE_ELEMENT</code>.</p>
<h3>3. Tool results (automatic detection)</h3>
<p>When a tool completes, <code>tool_completed_extra()</code> in <code>a2ui_utils.py</code> calls <code>build_media_extra()</code> from <code>media_utils</code>. Supported shapes:</p>
<p>| Input shape | Example |</p>
<p>|-------------|---------|</p>
<p>| OpenAI / ImageAgent | <code>{"data": [{"url": "...", "b64_json": "...", "revised_prompt": "..."}]}</code> |</p>
<p>| Explicit element | <code>{"type": "image", "url": "..."}</code> |</p>
<p>| Plain URL string | <code>"https://cdn.example.com/out.png"</code> |</p>
<p>| Data URL | <code>"data:image/png;base64,..."</code> |</p>
<p>| Nested elements | <code>{"elements": [{"type": "video", "url": "..."}]}</code> |</p>
<p><code>chat.py</code> broadcasts <code>message_element</code> for each detected element and attaches <code>elements</code> to the persisted assistant message.</p>
<h3>4. ImageAgent direct mode</h3>
<p>If the registered agent's <code>chat()</code> returns an OpenAI-shaped dict, <code>PraisonAIProvider._run_direct_mode</code> runs <code>extract_media_elements()</code> and emits <code>MESSAGE_ELEMENT</code> events before <code>RUN_COMPLETED</code>.</p>
<h2>Base64 storage</h2>
<p>Large <code>b64_json</code> payloads are <strong>not</strong> stored inline in message history. They are decoded and saved via <code>AttachmentManager</code>, then served at:</p>
<p>If storage fails, the system falls back to a <code>data:image/png;base64,...</code> URL.</p>
<h2>Frontend rendering</h2>
<p>| Surface | Handler |</p>
<p>|---------|---------|</p>
<p>| Dashboard chat (template) | <code>chat.js</code> — <code>case 'message_element': appendMediaElement()</code> |</p>
<p>| React chat | <code>streamingStore.ts</code> — <code>pendingElements</code> + <code>ElementRenderer</code> |</p>
<p>| Tool call panel | Thumbnail from <code>toolCall.elements</code> when expanded |</p>
<p>| Session reload | <code>elements</code> on messages from <code>/api/chat/history</code> and <code>/sessions/{id}/runs</code> |</p>
<p>See also Message Elements for element properties and display modes.</p>
<h2>Deduplication</h2>
<p><code>_collect_element()</code> in <code>chat.py</code> dedupes by URL so the same image is not stored twice when both a <code>MESSAGE_ELEMENT</code> event and a tool completion carry the same URL.</p>
<h2>Out of scope</h2>
<li><strong>REST image generation</strong> (<code>POST /v1/images/generations</code>) — separate OpenAI-compat endpoint; not wired into chat streaming</li>
<li><strong>Canvas / A2UI surfaces</strong> — separate feature for agent-driven UI catalogs</li>
<li><strong>Auto-registering ImageAgent</strong> — agents are configured explicitly by the user</li>
<h2>Tests</h2>
<p>Coverage includes: detection normalisation, b64 fallback, provider callback bridge, <code>_run_and_broadcast</code> persistence, media serve route, ImageAgent dict responses, URL dedup.</p>

<li>Attachments — user file uploads (separate from generated media serve path)</li>
