<p>&gt; <strong>Last validated</strong>: 2026-03-06 — PraisonAIUI features verified programmatically, OpenClaw features sourced from GitHub README and docs</p>
<h2>Summary</h2>
<p>| Aspect | PraisonAIUI | OpenClaw |</p>
<p>|--------|-------------|----------|</p>
<p>| <strong>Focus</strong> | Multi-agent orchestration dashboard | Personal AI assistant gateway |</p>
<p>| <strong>Language</strong> | Python (Starlette) | TypeScript (Node.js) |</p>
<p>| <strong>Stars</strong> | Growing | 100k+ |</p>
<p>| <strong>Architecture</strong> | Protocol-driven feature modules | Gateway + Channel adapters |</p>
<p>| <strong>Registered Features</strong> | 24 | ~15 core subsystems |</p>
<p>| <strong>API Routes</strong> | 164 | ~50 (WebSocket-focused) |</p>
<p>| <strong>Channels</strong> | 8 configured, <strong>4 working bots</strong> (Discord, Telegram, Slack, WhatsApp) | <strong>22 working channels</strong> |</p>
<p>| <strong>Skills/Tools</strong> | 20+ built-in tools | <strong>13,000+ via ClawHub</strong> |</p>
<p>| <strong>Native Apps</strong> | Web only | macOS, iOS, Android |</p>
<h2>Competitive Analysis</h2>
<h3>Where PraisonAIUI is Ahead ✅</h3>
<p>| Area | Advantage |</p>
<p>|------|-----------|</p>
<p>| <strong>Multi-agent orchestration</strong> | Pipeline, Route, Parallel, Loop — no equivalent in OpenClaw |</p>
<p>| <strong>OpenAI-compatible API</strong> | Full <code>/v1/*</code> — clients can use OpenAI SDK directly |</p>
<p>| <strong>Workflow designer</strong> | 8-route workflow CRUD with run/status tracking |</p>
<p>| <strong>Approval workflows</strong> | 10-route approval system for tool execution gating |</p>
<p>| <strong>API surface area</strong> | 164 REST routes vs ~50 in OpenClaw |</p>
<p>| <strong>Config validation</strong> | Schema-driven with history tracking |</p>
<p>| <strong>Hooks system</strong> | Pre/post operation hooks with trigger API |</p>
<p>| <strong>Theme system</strong> | Dark/light/custom with CSS variable API |</p>
<p>| <strong>Protocol versioning</strong> | Client-server version negotiation |</p>
<p>| <strong>Agent CRUD</strong> | Full REST API for agent definitions |</p>
<p>| <strong>MCP tools</strong> | 64+ Model Context Protocol tools |</p>
<h3>Where OpenClaw is Ahead ⚠️</h3>
<p>| Area | Gap | Impact |</p>
<p>|------|-----|--------|</p>
<p>| <strong>Channels</strong> | 22 working vs 4 | 🟡 High — 18 niche channels missing |</p>
<p>| <strong>Skills marketplace</strong> | 13,000+ vs 0 | 🔴 Critical — massive ecosystem moat |</p>
<p>| <strong>Native apps</strong> | macOS/iOS/Android vs web-only | 🟡 High — device presence |</p>
<p>| <strong>Voice</strong> | Wake word + Talk Mode vs none | 🟡 High — hands-free interaction |</p>
<p>| <strong>Canvas (A2UI)</strong> | Agent-driven visual workspace vs partial parity | 🟡 Medium |</p>
<p>| <strong>Agent-to-agent</strong> | Sessions-based messaging vs none | 🟡 Medium |</p>
<h3>Strategic Positioning</h3>
<h3>Recommended Priorities to Close Gaps</h3>
<p>| Priority | Feature | Effort | Why |</p>
<p>|----------|---------|--------|-----|</p>
<p>| 🔴 P0 | Skills marketplace UI | High | Must have ecosystem to compete |</p>
<p>| 🟡 P1 | Wire SDK bots into dashboard UI | Medium | SDK has all 4 bots, UI just needs to launch them |</p>
<p>| 🟡 P1 | Wire SDK Memory into chat UI | Low | SDK Memory fully exists, just wire into chat |</p>
<p>| 🟡 P1 | Wire VisionAgent into chat attachments | Low | SDK has VisionAgent, wire to image uploads |</p>
<p>| 🟡 P1 | Voice/TTS in chat UI | Medium | Browser SpeechSynthesis API is free |</p>
<p>| 🟢 P2 | Agent-to-agent messaging | Medium | Builds on existing sessions + chat |</p>
<p>| 🟢 P2 | Typing indicators / presence | Low | WebSocket event additions |</p>
<p>| 🟢 P3 | Native apps (Electron/Tauri) | High | Web-first is acceptable for now |</p>
<p>| 🟢 P3 | Canvas / visual workspace | High | Unique feature but not essential |</p></noscript></div>
