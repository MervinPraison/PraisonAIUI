<p>Build rich admin panels with <strong>zero HTML/CSS/JS</strong>. Register pages from Python, compose UIs with the component API, and the SDK renders everything.</p>
<h2>Quick Start</h2>
<h2>How It Works</h2>
<p>1. <strong><code>@aiui.page()</code></strong> registers a page with the server</p>
<p>2. <strong><code>dashboard.js</code></strong> fetches <code>/api/pages</code>, builds the sidebar automatically</p>
<p>3. When a page is selected, it fetches <code>/api/pages/{id}/data</code></p>
<p>4. If the data contains <code>_components</code>, they render as real UI elements (cards, tables, etc.)</p>
<h2>Registering Pages</h2>
<h3>Basic Page</h3>
<p>Pages without component layouts render as formatted JSON.</p>
<h3>Page with Components</h3>
<h3>Page Groups</h3>
<p>Pages are grouped in the sidebar by the <code>group</code> parameter:</p>
<p>| Parameter | Type | Required | Description |</p>
<p>|-----------|------|----------|-------------|</p>
<p>| <code>page_id</code> | <code>str</code> | ✅ | Unique identifier (URL-safe) |</p>
<p>| <code>title</code> | <code>str</code> | ✅ | Display name in sidebar |</p>
<p>| <code>icon</code> | <code>str</code> | ❌ | Emoji or icon character |</p>
<p>| <code>group</code> | <code>str</code> | ❌ | Sidebar group name |</p>
<p>| <code>description</code> | <code>str</code> | ❌ | Subtitle below the title |</p>
<h2>Component API</h2>
<p>Build dashboard UIs entirely from Python — no HTML needed. <strong>54 components</strong> are available across 7 categories.</p>
<p>&gt; See the full Component API Reference for all components and parameters.</p>

<p>The <code>layout()</code> function adds the <code>_components</code> key that tells the frontend to render structured components instead of raw JSON.</p>
<h2>Built-in Pages</h2>
<p>When style is set to <code>dashboard</code>, <strong>16 built-in pages</strong> are auto-registered from the feature system:</p>
<p>| Page | Group | Description |</p>
<p>|------|-------|-------------|</p>
<p>| 🤖 Agents | Agent | Configured AI agents |</p>
<p>| ⚡ Skills | Agent | Agent tools and skills |</p>
<p>| 🖥️ Nodes | Agent | Execution nodes |</p>
<p>| 📊 Overview | Control | System overview |</p>
<p>| 📡 Channels | Control | Messaging channels |</p>
<p>| 📋 Sessions | Control | Active sessions |</p>
<p>| 📻 Instances | Control | Connected instances |</p>
<p>| 📈 Usage | Control | Token usage analytics |</p>
<p>| ⏰ Cron | Control | Scheduled jobs |</p>
<p>| 📋 Jobs | Control | Async job queue |</p>
<p>| ✅ Approvals | Control | Pending approvals |</p>
<p>| 🔌 API | Control | API documentation |</p>
<p>| ⚙️ Config | Settings | Runtime configuration |</p>
<p>| 🔐 Auth | Settings | Authentication |</p>
<p>| 📜 Logs | Settings | Real-time log viewer |</p>
<p>| 🐛 Debug | Settings | Debug information |</p>
<p>Custom pages added via <code>@aiui.page()</code> appear alongside built-in pages.</p>
<h2>Agent Run Button</h2>
<p>Each agent card on the <strong>Agents</strong> page includes a <strong>▶ Run</strong> button. Clicking it navigates to the <strong>Chat</strong> page with that agent automatically pre-selected in the agent dropdown.</p>
<h3>How It Works</h3>
<p>1. The Run button reads the agent name from its <code>data-id</code> attribute</p>
<p>2. It pushes <code>/chat?agent=&lt;name&gt;</code> to browser history and dispatches <code>popstate</code></p>
<p>3. The dashboard's <code>popstate</code> listener calls <code>selectPage('chat')</code>, loading the Chat view</p>
<p>4. Chat's <code>render()</code> calls <code>loadAgents()</code>, then checks <code>URLSearchParams</code> for <code>?agent=</code></p>
<p>5. If found, it sets the dropdown value and <code>currentAgentName</code>, then cleans the URL</p>
<h2>Test Panel</h2>
<p>Every dashboard includes a <strong>Test All Features</strong> link at the bottom of the sidebar. It auto-discovers all registered features from <code>/api/features</code> and tests each endpoint, showing pass/fail results in a grid.</p>
<h2>Full Example</h2>
<h2>API Endpoints</h2>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/pages</code> | GET | List all registered pages |</p>
<p>| <code>/api/pages/{id}/data</code> | GET | Get page handler response |</p>
<p>| <code>/api/features</code> | GET | List all registered features |</p>
<p>| <code>/plugins/plugins.json</code> | GET | Style-aware frontend plugin list |</p></noscript></div>
