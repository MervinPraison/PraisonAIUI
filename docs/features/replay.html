praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/typescript">Typescript</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li></ul></nav><h1>Replay</h1>
<p><strong>PraisonAI Replay</strong> shows a recorded agent run as a story: who did what, when, why, and</p>
<p>at what cost. It works for finished runs and for runs that are still going.</p>
<h2>Record a run, then open it</h2>
<p>or from Python:</p>
<p>Every recorded run is a file <code>&lt;id&gt;.jsonl</code> in the traces folder. Replay reads it from</p>
<p><code>$PRAISONAI_TRACES_DIR</code>, else <code>$PRAISON_HOME/traces</code>, else <code>~/.praison/traces</code>.</p>
<p>To open aiui on Replay yourself:</p>
<p><code>/#/replay?run=&lt;id&gt;</code> works too. In a full dashboard, Replay is in the sidebar under</p>
<p><strong>Control</strong>.</p>
<h2>Watch a run live: the Run button</h2>
<p>For learning, demos and debugging, open a page with a <strong>Run</strong> button. Each click records</p>
<p>a new run, and the page draws it as it happens:</p>
<p>On the <strong>Map</strong>, each step and agent shows where the run is: dashed means not reached,</p>
<p>blue (pulsing) means running now, green means done and red means failed. After a run,</p>
<p><strong>▶ Play</strong> moves through it again one step at a time, and the map rewinds with it. One</p>
<p>run goes at a time. Each run of a team starts its tasks afresh; an Agent keeps its chat</p>
<p>history between runs.</p>
<h2>Show progress inside your own app</h2>
<p><code>create_replay_app()</code> is the same view as a small ASGI app, without the dashboard. Mount</p>
<p>it in any FastAPI or Starlette app:</p>
<p>Then show one run, live, in your page, for example in an <code>&lt;iframe&gt;</code>:</p>
<p>| URL | Shows |</p>
<p>|---|---|</p>
<p>| <code>/replay/</code> | The run list and the selected run |</p>
<p>| <code>/replay/?run=&lt;id&gt;</code> | Only that run, no list. A run that has not started yet is waited for. |</p>
<p><code>replay_app(team)</code> adds the Run box to the mounted page. Without the PraisonAI wrapper,</p>
<p>pass any <code>run(input, run_id)</code> callable to <code>praisonaiui.features.replay.create_replay_app</code>;</p>
<p>it must record the run under <code>run_id</code>. For a page you build yourself, the view is one</p>
<p>module:</p>
<p><code>render()</code> options: <code>base</code> (where the API is mounted), <code>run</code> (show only this run),</p>
<p><code>runner</code> (<code>{input, placeholder, ask}</code> to show the Run box) and <code>approve</code> (<code>false</code> hides</p>
<p>the approve and deny buttons; the embedded app has no approvals API, so answer approvals</p>
<p>where your app asks for them).</p>
<p>Anyone who can reach the mounted app can read the runs, and with a runner can start one.</p>
<p>Keep it on localhost or behind your app's login. <code>POST /api/replay/run</code> only accepts</p>
<p><code>Content-Type: application/json</code>, so another website cannot start a run from a visitor's</p>
<p>browser.</p>
<h2>What you see</h2>
<p>| Part | What it shows |</p>
<p>|---|---|</p>
<p>| <strong>Runs</strong> | Recorded runs, newest first. A run that is still being written has a <strong>Live</strong> badge. |</p>
<p>| <strong>Timeline</strong> (default) | One lane per agent, plus <strong>Manager</strong> and <strong>You</strong>. Time runs left to right. LLM calls and tool calls are blocks in their agent's lane. Arrows show hand-offs, delegation, routing and approval requests. Parallel branches get their own sub-lanes. A call or step repeated back to back is one block marked ×N. Tasks and steps run across the top. |</p>
<p>| <strong>Map</strong> | The team or flow as a graph, drawn from the graph recorded at the start of the run and fitted to the page (−, Fit and + zoom; drag to pan). Agents that took part but are not in the graph, for example after a hand-off to an agent outside the team, appear in an <strong>Outside the team</strong> group with their hand-offs. Older recordings without a graph get a "who talked to whom" map built from the events. Each node shows its state at the cursor: dashed means not reached, blue means running, green means done (×N when it ran more than once) and red means failed; the node the cursor is on has a bold outline. |</p>
<p>| <strong>What happened</strong> | One plain sentence per step, for example *"Researcher asked web_search for 'solar sail facts' — 1.2 s, $0.002."* Hovering or focusing a sentence highlights its block, and the other way round. |</p>
<p>| <strong>Details</strong> | Three tabs for the selected step. <strong>What happened</strong>: when, who, how long, cost, tokens, output. <strong>Why</strong>: only what the recording holds, such as the input given to a tool, the context passed in a hand-off and its reason, the manager's task snapshot, the route a step chose, and an approval's decision and where an automatic approval came from. <strong>Raw JSON</strong>: the events themselves. |</p>
<p>| <strong>Cost &amp; latency</strong> | Adds a bar under each block (taller and darker means more cost, or more time) and per-agent totals in the lane labels. |</p>
<p>Shapes always carry meaning as well as colour: agents are circles, tools are rounded</p>
<p>rectangles, you are a diamond and the manager is a square. In each lane, LLM calls sit on</p>
<p>the top row and that agent's tool calls on a thinner row under them, so a long LLM call</p>
<p>never hides its tools. Labels that do not fit end in "…"; hover or focus a block to see the</p>
<p>whole label.</p>
<p>The <strong>Theme</strong> menu follows your system's light or dark setting by default; choose Light or</p>
<p>Dark to override it. On a phone the run list, timeline and steps stack in one column.</p>
<h2>Moving through a run</h2>
<p>Replay opens at the end of the run, so you see everything. Move the cursor to replay it:</p>
<p>anything after the cursor is drawn as an outline.</p>
<p>| Key | Action |</p>
<p>|---|---|</p>
<p>| ← → | Previous / next step |</p>
<p>| ↑ ↓ | Previous / next step in the step list; previous / next node in the map |</p>
<p>| Home / End | First / last step |</p>
<p>| Enter or Space | Open the focused block or node |</p>
<p>| ← → in the tabs | Switch between What happened, Why and Raw JSON |</p>
<p>The scrubber under the timeline does the same with a mouse or touch, and <strong>▶ Play</strong> steps</p>
<p>through on its own. On a live run the</p>
<p>cursor follows new events; if you step back, <strong>Jump to live</strong> takes you to the latest.</p>
<h2>Approving from Replay</h2>
<p>When an agent asks for approval and the run uses aiui's approval store, a **Waiting for</p>
<p>you** card appears above the timeline:</p>
<li><strong>Approve</strong> or <strong>Deny</strong>, with an optional reason.</li>
<li><strong>Edit arguments…</strong> opens the arguments as JSON (taken from the server, not the redacted</li>
<p>recording when the server has them). The JSON must be an object; mistakes are shown</p>
<p>as you type. <strong>Approve with these arguments</strong> sends them as <code>modified_args</code>.</p>
<p>These buttons call <code>POST /api/approvals/{id}/approve</code> and <code>/deny</code>. The agent waits until</p>
<p>you answer, and is denied if nobody answers before the approval timeout.</p>
<h2>Sharing a run as one file</h2>
<p><code>praisonai replay export RUN --format html</code> writes a single HTML file with the run and</p>
<p>this viewer inside. It needs no server and no network. Approvals cannot be answered from</p>
<p>an exported file.</p>
<h2>HTTP API</h2>
<p>| Endpoint | Returns |</p>
<p>|---|---|</p>
<p>| <code>GET /api/replay/runs</code> | <code>[{run_id, session_id, path, started_at, ended_at?, status, kind, name, agents, events, cost_usd, live}]</code>, newest first |</p>
<p>| <code>GET /api/replay/runs/{id}/events?after_seq=N</code> | <code>{events, graph, run}</code>; <code>after_seq</code> keeps only events with a larger <code>sequence_num</code>; <code>wait=1</code> answers <code>{events: [], graph: null, run: null}</code> instead of 404 for a run that has not started yet |</p>
<p>| <code>GET /api/replay/runs/{id}/stream</code> | Server-sent events: <code>event: ctx</code> per trace event (with <code>id:</code> = <code>sequence_num</code>), <code>ping</code> every 15 s, <code>end</code> once the run has finished and gone quiet for 2 s. Honours <code>after_seq</code> and <code>Last-Event-ID</code>. |</p>
<p>With a runner (<code>create_replay_app(run=...)</code>), <code>POST /api/replay/run</code> with</p>
<p><code>{"input": "..."}</code> starts a run and returns <code>{run_id}</code> (409 while one is going).</p>
<p>Run ids must match <code>^[A-Za-z0-9._-]+$</code>. Replay never writes trace files itself. Half-written last lines, unknown fields and unknown event types are skipped</p>
<p>safely, and schema 1.0 recordings still open.</p>
<p>The <strong>Traces</strong> page reads the same files: each run is a trace, and its spans come from</p>
<p>matching start and end events.</p></noscript></div>
