<p>How <strong>PraisonAIUI</strong> (<code>aiui</code>) connects to <strong><code>praisonai-package</code></strong> — the agent runtime, gateway, and CLI. For generic UI hosting see Agent UI host.</p>
<h2>Division of labour</h2>
<p>| Layer | Repo | Role |</p>
<p>|-------|------|------|</p>
<p>| Agent runtime | <code>praisonai-agents</code> | <code>Agent</code>, tools, memory, streaming |</p>
<p>| Gateway, jobs, CLI | <code>praisonai</code> | WebSocket <code>/ws</code>, <code>/api/v1/runs</code>, <code>praisonai claw</code> |</p>
<p>| Dashboard UI | <strong>PraisonAIUI</strong> | <code>dashboard.js</code>, <code>@aiui.page</code>, layout protocol |</p>
<p>| Work tracking | <code>praisonai-platform</code> | Issues API (optional board data source) |</p>
<p>Canonical app: <code>praisonai-package</code> → <code>src/praisonai/praisonai/claw/default_app.py</code>.</p>
<h2>Deployment shapes</h2>
<h3>1. Single process — `praisonai claw` (recommended)</h3>
<p>Use when: local dev, full dashboard, agents registered in Python.</p>
<h3>2. Unified — `AIUIGateway`</h3>
<p>Use when: you need <strong>WebSocket gateway protocol</strong> and dashboard on <strong>one port</strong>.</p>
<h3>3. Split — gateway + UI</h3>
<p>| Service | Default port | Endpoints |</p>
<p>|---------|--------------|-----------|</p>
<p>| <code>praisonai gateway start</code> | 8765 | <code>ws://…/ws</code>, <code>/health</code>, <code>/info</code> |</p>
<p>| <code>praisonai claw</code> or <code>aiui run</code> | 8082 | Dashboard, <code>/run</code> SSE, <code>/api/*</code> |</p>
<p>Use when: gateway runs headless; UI is a separate process. Point chat at gateway via provider config or run <code>AIUIGateway</code> instead.</p>
<h2>Wiring checklist</h2>
<p>Or via host bootstrap:</p>
<h2>API surface</h2>
<h3>Chat and agents (dashboard)</h3>
<p>| Endpoint | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>POST /run</code> | Stream agent run (SSE) |</p>
<p>| <code>GET /sessions</code>, <code>POST /sessions</code> | Session CRUD |</p>
<p>| <code>GET /agents</code>, <code>/api/agents/definitions</code> | Agent list / CRUD |</p>
<p>| <code>GET /api/health</code> | Sidebar health slot |</p>
<h3>Async jobs — two paths</h3>
<p>| Backend | Base path | When |</p>
<p>|---------|-----------|------|</p>
<p>| <strong>aiui</strong> <code>JobsFeature</code> | <code>/api/jobs</code> | Default; in-process job store |</p>
<p>| <strong>praisonai</strong> jobs server | <code>/api/v1/runs</code> | Standalone <code>praisonai jobs</code> / FastAPI router |</p>
<p>Configure the dashboard jobs view:</p>
<p><code>/ui-config.json</code> exposes <code>jobs: { apiBase, backend }</code> for <code>jobs.js</code>.</p>
<p><strong>Response shapes:</strong> both return <code>{ jobs, total }</code>. Praison uses <code>job_id</code>; aiui uses <code>id</code>. The jobs view normalises either field.</p>
<p>| Action | aiui | praisonai |</p>
<p>|--------|------|-----------|</p>
<p>| List | <code>GET /api/jobs</code> | <code>GET /api/v1/runs</code> |</p>
<p>| Detail | <code>GET /api/jobs/{id}</code> | <code>GET /api/v1/runs/{id}</code> |</p>
<p>| Cancel | <code>POST /api/jobs/{id}/cancel</code> | <code>POST /api/v1/runs/{id}/cancel</code> |</p>
<p>| Stream | <code>GET /api/jobs/{id}/stream</code> | <code>GET /api/v1/runs/{id}/stream</code> |</p>
<p>| Delete | <code>DELETE /api/jobs/{id}</code> | Not on package router |</p>
<p><strong>Split jobs server (optional):</strong> proxy aiui <code>/api/jobs/*</code> to an external jobs host:</p>
<p>Use when the dashboard and jobs server run on different ports. Prefer <code>set_jobs_backend("praisonai")</code> when the browser can call <code>/api/v1/runs</code> on the same origin.</p>
<h3>REST invoke (automation)</h3>
<p>| Path | Use |</p>
<p>|------|-----|</p>
<p>| <code>POST /api/v1/agents/{id}/invoke</code> | Sync invoke (n8n, scripts) — <strong>package</strong> <code>agent_invoke.py</code> |</p>
<p>| <code>POST /run</code> | Streaming chat — <strong>dashboard</strong> chat page |</p>
<p>Same agents if registered on both surfaces; different protocols.</p>
<h3>Discovery (package serve)</h3>
<p>| Endpoint | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>GET /__praisonai__/discovery</code> | Serve-mode capability discovery |</p>
<p>| <code>GET /health</code>, <code>GET /info</code> | Gateway liveness and metadata |</p>
<p>| <code>GET /api/gateway/status</code> | aiui gateway feature status |</p>
<p>See <strong>Feature Explorer</strong> page in dashboard for live probes.</p>
<h2>Parallel UI protocols (not dashboard replacements)</h2>
<p>Under <code>praisonaiagents/ui/</code>:</p>
<p>| Protocol | Purpose |</p>
<p>|----------|---------|</p>
<p>| <strong>A2A</strong> | Agent cards, <code>/.well-known/agent.json</code>, external agent hosts |</p>
<p>| <strong>AG-UI</strong> | CopilotKit-style event stream (<code>POST /agui</code>) |</p>
<p>| <strong>A2UI</strong> | Declarative surfaces in chat/canvas |</p>
<p>Dashboard shell remains the ops console for <code>praisonai claw</code>. Use A2A/AG-UI/A2UI when embedding in other products.</p>
<h2>Two plugin systems</h2>
<p>| System | Location | Purpose |</p>
<p>|--------|----------|---------|</p>
<p>| <strong>Agent plugins</strong> | <code>~/.praisonai/plugins/</code> | Python agent extensions (<code>praisonaiagents.plugins</code>) |</p>
<p>| <strong>Dashboard plugins</strong> | <code>~/.praisonai/dashboard-plugins/</code> | JS tabs + <code>manifest.json</code> for aiui shell |</p>
<p>Do not mix folders. Agent plugins extend runtime; dashboard plugins extend UI tabs only.</p>
<h2>Optional modules</h2>
<p>Loads <code>jobs.js</code>, <code>auth.js</code>, <code>api.js</code> into the plugin chain and maps them in <code>BUILTIN_VIEWS</code>. Enable only what your deployment exposes.</p>
<h2>Board / work tracking</h2>
<p>Neither repo ships Hermes-style Kanban. Options:</p>
<p>1. <strong><code>aiui.board()</code></strong> — columns from <code>@aiui.page</code> handler (jobs by status, custom data).</p>
<p>2. <strong><code>praisonai-platform</code> issues</strong> — map issue <code>status</code> → board columns (see <code>examples/python/platform-board/</code>). Set <code>PRAISONAI_PLATFORM_URL</code> and <code>PRAISONAI_PLATFORM_WORKSPACE_ID</code> (default workspace <code>default</code>); issues are fetched from <code>GET /api/v1/workspaces/{workspace_id}/issues</code>.</p>
<p>3. <strong><code>dashboard-plugins</code></strong> — rich JS via <code>registerView</code> + <code>sdk.createBoard</code>.</p>
<p>Advanced board UX (drag-drop, WebSocket sync) is <strong>deferred</strong> — use polling via <code>sdk.createBoard({ pollMs })</code> or a custom plugin.</p>
<h2>Smoke checklist</h2>
<p>After <code>praisonai claw</code> or <code>aiui run</code> with package bridges:</p>
<li>[ ] <code>GET /api/health</code> → sidebar footer shows healthy</li>
<li>[ ] Chat page sends message, streams reply</li>
<li>[ ] Sessions page lists <code>~/.praisonai/sessions/</code> data</li>
<li>[ ] Agents page CRUD (if agents registered)</li>
<li>[ ] Jobs page (if <code>modules</code> includes <code>jobs</code> and jobs API configured)</li>
<li>[ ] Explorer probes <code>/health</code>, <code>/ui-config.json</code>, <code>/api/dashboard/plugins</code></li>
<li>[ ] Auth/API pages (if <code>modules</code> includes <code>auth</code> / <code>api</code>)</li>
