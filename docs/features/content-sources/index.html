></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Content Sources</h1>
<p><code>content.docs</code> tells <code>aiui build</code> where your Markdown lives. Each file becomes a</p>
<p>page under <code>site.routeBaseDocs</code> (default <code>/docs</code>).</p>
<h2>Docs Directory</h2>
<p>The path is relative to the config file.</p>
<h2>Include/Exclude Patterns</h2>
<p><code>include</code> patterns are globs relative to <code>dir</code>. An <code>exclude</code> pattern matches</p>
<p>the path relative to <code>dir</code>, a folder holding it (<code>drafts</code>, <code>drafts/</code>) or, with</p>
<p>no <code>/</code>, any file or folder name (<code>*.tmp</code>). A leading <code>/</code> anchors it to <code>dir</code>;</p>
<p><code>!pattern</code> brings back a file an earlier pattern left out.</p>
<p>Excluded files are not published at all: <code>aiui build</code> copies neither the</p>
<p>pages nor the images next to them, and it lists what it left out.</p>
<p>The same patterns can live in an <code>.aiuiignore</code> file next to <code>aiui.yaml</code>, one</p>
<p>per line (<code>#</code> starts a comment); they add to <code>exclude</code>:</p>
<h2>Index Files</h2>
<p><code>index.md</code> and <code>README.md</code> (any case) are the page of their folder:</p>
<p><code>guides/index.md</code> is served at <code>/docs/guides</code>. <code>indexFiles</code> is accepted in the</p>
<p>config, but other file names are not treated as index pages yet.</p>
<h2>Frontmatter</h2>
<p>| Field | Description |</p>
<p>|-------|-------------|</p>
<p>| <code>title</code> | Page title in the navigation; default: the first <code>#</code> heading, then the slug |</p>
<p>| <code>order</code> | Sort order within the folder (lower first); <code>0</code> or missing falls back to a number prefix |</p>
<p>| <code>description</code> | Meta description; default: the first paragraph of 20 or more characters, cut at 160 |</p>
<p>| <code>noindex</code> | <code>true</code> adds <code>robots: noindex, nofollow</code> and leaves the page out of the sitemap |</p>
<p>| <code>layout</code> | <code>home</code> on <code>docs/index.md</code> draws the home page layout |</p>
<p>The frontmatter block is not shown on the page.</p>
<h2>Home Page Layout</h2>
<p>Frontmatter <code>layout: home</code> on the docs home page (<code>docs/index.md</code>) puts a</p>
<p>hero and a feature grid above the page's own Markdown, the way VitePress does:</p>
<li>The hero image keeps a 16:10 box until the file arrives, so nothing below it</li>
<p>jumps as it loads; once loaded it takes the image's own shape. Screenshots</p>
<p>at 16:10 (1600 × 1000, say) never move the page. Only the image for the</p>
<p>colour mode on screen downloads at first; the other one waits until the</p>
<p>reader switches.</p>
<li><code>aiui build</code> adds <code>&lt;link rel="preload" as="image"&gt;</code> for the hero to the home</li>
<p>page's HTML, so the download starts with the page instead of after the app</p>
<p>has drawn the hero. With <code>site.theme.mode: system</code> (or no mode) each image</p>
<p>gets the matching <code>prefers-color-scheme</code> media query; a fixed <code>light</code> or</p>
<p><code>dark</code> preloads only that image. A reader whose saved light/dark choice</p>
<p>differs from the system setting downloads both.</p>
<li>Links and images resolve against the home page like Markdown links, and</li>
<p>links to other sites open in a new tab.</p>
<li><code>icon</code> is one of <code>message-square</code>, <code>panels-top-left</code>, <code>layout-dashboard</code>,</li>
<p><code>book-open</code>, <code>plug</code>, <code>shield-check</code>, <code>code</code>, <code>terminal</code>, <code>bot</code>, <code>zap</code>,</p>
<p><code>rocket</code> and <code>palette</code> (lucide line icons); any other name shows no icon.</p>
<li>Up to 4 actions and 12 features are kept. Every value is plain text.</li>
<li>Only the docs home page reads <code>layout: home</code>; on other pages it does nothing.</li>
<h2>Numbered Prefixes</h2>
<p>A leading number gives the order when the frontmatter sets none, and the</p>
<p><code>NN-</code> prefix is stripped from the URL. Only a prefix at the start of a folder or</p>
<p>file name counts: digits inside a name stay (<code>ui-reset-2026-11.md</code> is served at</p>
<p><code>/docs/ui-reset-2026-11</code>). A link that names the file (<code>01-introduction.md</code>)</p>
<p>opens the page at its URL.</p>
<h2>Static Hosting</h2>
<p><code>aiui build</code> writes a site any static host can serve, with no rewrite rules:</p>
<p>| File | Why |</p>
<p>|------|-----|</p>
<p>| <code>index.html</code> | The site root; it shows <code>docs/index.md</code> (the docs home page). <code>/docs</code> and <code>/docs/index</code> open the same page and move to <code>/</code>, the home page's one URL (also in the sitemap, <code>llms.txt</code> and canonical links) |</p>
<p>| <code>docs/&lt;page&gt;.html</code> | <code>/docs/&lt;page&gt;</code> on hosts that map a path to <code>&lt;path&gt;.html</code> (GitHub Pages, Netlify, Cloudflare Pages) |</p>
<p>| <code>docs/&lt;page&gt;/index.html</code> | <code>/docs/&lt;page&gt;/</code> on hosts that do not (S3, <code>python -m http.server</code>); the page drops the trailing slash |</p>
<p>| <code>docs/&lt;page&gt;.md</code> | The markdown the page loads, also for index pages (<code>guides/index.md</code> → <code>docs/guides.md</code>) and numbered files |</p>
<p>| <code>404.html</code> | Any other path loads the site, which opens the page the URL means (<code>/guides/setup</code> opens <code>/docs/guides/setup</code>) or shows "Page not found" with links home and to search |</p>

<li>Navigation: how pages become the sidebar</li>
<li>SEO: meta tags, sitemap and <code>robots.txt</code></li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/content-sources.source.md", "text": "# Content Sources\n\n`content.docs` tells `aiui build` where your Markdown lives. Each file becomes a\npage under `site.routeBaseDocs` (default `/docs`).\n\n## Docs Directory\n\n```yaml\ncontent:\n  docs:\n    dir: \"./docs\"\n```\n\nThe path is relative to the config file.\n\n## Include/Exclude Patterns\n\n```yaml\ncontent:\n  docs:\n    dir: \"./docs\"\n    include:            # default: [\"**/*.md\", \"**/*.mdx\"]\n      - \"**/*.md\"\n    exclude:\n      - \"drafts/**\"\n      - \"_*.md\"\n```\n\n`include` patterns are globs relative to `dir`. An `exclude` pattern matches\nthe path relative to `dir`, a folder holding it (`drafts`, `drafts/`) or, with\nno `/`, any file or folder name (`*.tmp`). A leading `/` anchors it to `dir`;\n`!pattern` brings back a file an earlier pattern left out.\n\nExcluded files are not published at all: `aiui build` copies neither the\npages nor the images next to them, and it lists what it left out.\n\nThe same patterns can live in an `.aiuiignore` file next to `aiui.yaml`, one\nper line (`#` starts a comment); they add to `exclude`:\n\n```text\n# .aiuiignore\ndrafts/\ninternal/\n*.secret.md\n```\n\n## Index Files\n\n`index.md` and `README.md` (any case) are the page of their folder:\n`guides/index.md` is served at `/docs/guides`. `indexFiles` is accepted in the\nconfig, but other file names are not treated as index pages yet.\n\n## Frontmatter\n\n```markdown\n---\ntitle: \"Custom Title\"\norder: 1\ndescription: \"One sentence for search results.\"\n---\n\n# Page Content\n```\n\n| Field | Description |\n|-------|-------------|\n| `title` | Page title in the navigation; default: the first `#` heading, then the slug |\n| `order` | Sort order within the folder (lower first); `0` or missing falls back to a number prefix |\n| `description` | Meta description; default: the first paragraph of 20 or more characters, cut at 160 |\n| `noindex` | `true` adds `robots: noindex, nofollow` and leaves the page out of the sitemap |\n| `layout` | `home` on `docs/index.md` draws the [home page layout](#home-page-layout) |\n\nThe frontmatter block is not shown on the page.\n\n## Home Page Layout\n\nFrontmatter `layout: home` on the docs home page (`docs/index.md`) puts a\nhero and a feature grid above the page's own Markdown, the way VitePress does:\n\n```markdown\n---\ntitle: Acme\nlayout: home\nhero:\n  name: Acme                          # the page heading, in the accent colour\n  text: Ship your agent's UI today    # the large headline\n  tagline: One sentence that says what it is and who it is for.\n  image: images/app-light.webp        # optional, relative to this page\n  imageDark: images/app-dark.webp     # optional, shown in dark mode instead\n  imageAlt: The app with a conversation open\n  actions:\n    - text: Quick start\n      link: getting-started/quickstart.md\n    - text: GitHub\n      link: https://github.com/acme/acme\n      theme: alt                      # brand (default) or alt\nfeatures:\n  - title: Chat\n    icon: message-square\n    details: Streaming replies, tool calls and approvals.\n    link: guides/chat.md\n    linkText: Chat guide\n---\n\n## Install\n\nThe Markdown below the frontmatter renders under the hero.\n```\n\n- The hero image keeps a 16:10 box until the file arrives, so nothing below it\n  jumps as it loads; once loaded it takes the image's own shape. Screenshots\n  at 16:10 (1600 × 1000, say) never move the page. Only the image for the\n  colour mode on screen downloads at first; the other one waits until the\n  reader switches.\n- `aiui build` adds `\u003clink rel=\"preload\" as=\"image\"\u003e` for the hero to the home\n  page's HTML, so the download starts with the page instead of after the app\n  has drawn the hero. With `site.theme.mode: system` (or no mode) each image\n  gets the matching `prefers-color-scheme` media query; a fixed `light` or\n  `dark` preloads only that image. A reader whose saved light/dark choice\n  differs from the system setting downloads both.\n\n- Links and images resolve against the home page like Markdown links, and\n  links to other sites open in a new tab.\n- `icon` is one of `message-square`, `panels-top-left`, `layout-dashboard`,\n  `book-open`, `plug`, `shield-check`, `code`, `terminal`, `bot`, `zap`,\n  `rocket` and `palette` (lucide line icons); any other name shows no icon.\n- Up to 4 actions and 12 features are kept. Every value is plain text.\n- Only the docs home page reads `layout: home`; on other pages it does nothing.\n\n## Numbered Prefixes\n\n```\ndocs/\n├── 01-introduction.md   # order 1, served at /docs/introduction\n├── 02-installation.md   # order 2\n└── 03-quickstart.md     # order 3\n```\n\nA leading number gives the order when the frontmatter sets none, and the\n`NN-` prefix is stripped from the URL. Only a prefix at the start of a folder or\nfile name counts: digits inside a name stay (`ui-reset-2026-11.md` is served at\n`/docs/ui-reset-2026-11`). A link that names the file (`01-introduction.md`)\nopens the page at its URL.\n\n## Static Hosting\n\n`aiui build` writes a site any static host can serve, with no rewrite rules:\n\n| File | Why |\n|------|-----|\n| `index.html` | The site root; it shows `docs/index.md` (the docs home page). `/docs` and `/docs/index` open the same page and move to `/`, the home page's one URL (also in the sitemap, `llms.txt` and canonical links) |\n| `docs/\u003cpage\u003e.html` | `/docs/\u003cpage\u003e` on hosts that map a path to `\u003cpath\u003e.html` (GitHub Pages, Netlify, Cloudflare Pages) |\n| `docs/\u003cpage\u003e/index.html` | `/docs/\u003cpage\u003e/` on hosts that do not (S3, `python -m http.server`); the page drops the trailing slash |\n| `docs/\u003cpage\u003e.md` | The markdown the page loads, also for index pages (`guides/index.md` → `docs/guides.md`) and numbered files |\n| `404.html` | Any other path loads the site, which opens the page the URL means (`/guides/setup` opens `/docs/guides/setup`) or shows \"Page not found\" with links home and to search |\n\n## Related\n\n- [Navigation](navigation.md): how pages become the sidebar\n- [SEO](seo.md): meta tags, sitemap and `robots.txt`\n"}</script>
