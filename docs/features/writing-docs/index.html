<p>A docs site is a folder of Markdown and one YAML file. This page lists every</p>
<p>block a page can use: the Markdown you write, then the block as this site</p>
<p>draws it. Pages that <code>aiui build</code> publishes also exist as plain Markdown</p>
<p>(<code>/docs/&lt;page&gt;.md</code>, components converted) and in <code>llms.txt</code>, so assistants</p>
<p>read the same content (AI-ready docs).</p>
<h2>The look</h2>
<p><code>site.theme.preset</code> picks the colours. <code>paper</code> is the look of this site: warm</p>
<p>paper, a navy accent, serif titles, 17px text on a 1.7 line height and a</p>
<p>measure of about 75 characters. <code>mode: system</code> follows the reader's OS.</p>
<p>The other presets and what each changes are in Theming.</p>
<h2>Front matter</h2>
<p>YAML at the top of a page sets its title in the sidebar, the browser tab and</p>
<p>search results, and its description for search engines and <code>llms.txt</code>. Every</p>
<p>key is optional, and the common MDX page metadata keys work as they are.</p>
<p>| Key | Type | What it does |</p>
<p>|---|---|---|</p>
<p>| <code>title</code> | string | The page title: the <code>#</code> heading when the body has none, the browser tab, search, <code>llms.txt</code>. Default: the first <code>#</code> heading, else the file name. |</p>
<p>| <code>description</code> | string | Shown under the title (unless the first paragraph already says it), and the meta description, <code>llms.txt</code> and search snippet. Default: the first paragraph, for those but not shown again. |</p>
<p>| <code>sidebarTitle</code> (or <code>nav_title</code>) | string | A shorter label in the sidebar. |</p>
<p>| <code>icon</code> | string | Before the sidebar label: a lucide name (<code>rocket</code>, <code>terminal</code>, <code>book-open</code>, …), an emoji, or an image URL (<code>https://…</code> or <code>/icons/x.svg</code>). |</p>
<p>| <code>tag</code> | string | A badge after the sidebar label, such as <code>NEW</code> or <code>BETA</code>. |</p>
<p>| <code>deprecated</code> | <code>true</code>/<code>false</code> | <code>true</code>: a <code>Deprecated</code> badge, the label struck through, and a notice above the page. |</p>
<p>| <code>mode</code> | string | <code>wide</code>: no "On this page", a wider column. <code>center</code>: no sidebar either. <code>custom</code>: only the article, full width (no breadcrumb, footer or pager). <code>frame</code>: <code>custom</code> with the sidebar. <code>assistant</code>: the page's text, then Ask AI under it. |</p>
<p>| <code>url</code> | string | An <code>https://</code> URL makes the page a sidebar link that opens that site in a new tab. The page itself is not published (no route, sitemap, <code>llms.txt</code> or search entry). |</p>
<p>| <code>hideFooterPagination</code> | <code>true</code>/<code>false</code> | <code>true</code>: no previous / next links under the page. |</p>
<p>| <code>noAnchor</code> | <code>true</code>/<code>false</code> | <code>true</code>: no copy-link icon on the page's headings. |</p>
<p>| <code>order</code> | number | Position inside its folder (default: a number prefix such as <code>01-</code>). |</p>
<p>| <code>hidden</code> | <code>true</code>/<code>false</code> | Routable, but not in the sidebar, pager or indexes (Navigation). |</p>
<p>| <code>noindex</code> | <code>true</code>/<code>false</code> | Tells search engines not to index the page (and leaves it out of the sitemap). |</p>
<p>| <code>searchable</code> | <code>true</code>/<code>false</code> | <code>false</code> leaves the page out of the site's own search. |</p>
<p>| <code>keywords</code> | list of words, or one comma-separated string | Extra search terms, matched but never shown; also the <code>keywords</code> meta tag and JSON-LD. |</p>
<p>| <code>canonical</code> | string | The page's canonical URL (and <code>og:url</code>), for a page whose original lives elsewhere. |</p>
<p>| <code>robots</code> | string | The robots meta, such as <code>noindex, nofollow</code>; a value with <code>noindex</code> also leaves the page out of the sitemap, <code>llms.txt</code> and search. |</p>
<p>| <code>og:*</code>, <code>twitter:*</code>, <code>article:*</code> | string | That head tag for this page (quote the key: <code>'og:image': /images/card.png</code>); see SEO. |</p>
<p>| <code>boost</code> | number | Search ranking weight (<code>2</code> ranks the page higher). |</p>
<p>| <code>openapi</code> | string | <code>"GET /users"</code>, <code>"spec.yaml POST /users"</code> or <code>"webhook name"</code>: the page shows that operation, its endpoint bar, Try it, fields and examples around your text (OpenAPI). |</p>
<p>| <code>api</code> | string | <code>"POST /v1/users"</code>: an endpoint page without a spec, Try it from the page's <code>&lt;ParamField&gt;</code>s (OpenAPI). |</p>
<p>| <code>playground</code> | string | <code>interactive</code>, <code>simple</code>, <code>none</code> or <code>auth</code>: the Try-it display of an <code>openapi:</code> or <code>api:</code> page; site-wide: <code>api.playground.display</code> (OpenAPI). |</p>
<p>| <code>timestamp</code> | <code>true</code>/<code>false</code> | Turns the "Last updated" date off or on for this page (see Page footer). |</p>
<p>| <code>lastUpdatedDate</code> | date (<code>2026-05-01</code>) | The "Last updated" date, instead of the last commit's. |</p>
<p>| <code>related</code> | list of pages or URLs, or <code>false</code> | The "Related pages" under this page, instead of the suggested ones; <code>false</code> shows none (Related pages). |</p>
<p>| <code>pageActions</code> | list of page actions, or <code>false</code> | This page's page actions menu, in order, instead of the site's; <code>false</code> shows none (Page actions). |</p>
<p>| <code>rss</code> | <code>true</code>/<code>false</code> | <code>true</code> on a changelog page: the build writes its <code>&lt;Update&gt;</code> entries as an RSS feed at <code>&lt;page&gt;/rss.xml</code> and links it (Changelog). |</p>
<p>| <code>public</code> | <code>true</code>/<code>false</code> | On a site with sign-in: <code>true</code> opens the page to everyone, <code>false</code> keeps it behind sign-in when a <code>public</code> pattern would open it. |</p>
<p>| <code>groups</code> | list of group names, or one name | On a site with sign-in: only readers in one of these groups can read the page; to everyone else it does not exist. |</p>
<p>| <code>layout</code>, <code>hero</code>, <code>features</code> | | The docs home page (Home page layout). |</p>
<p>| any other key | string, number or <code>true</code>/<code>false</code> | Custom data, such as <code>product: cloud</code>: a <code>data-fm-product="cloud"</code> attribute on the article (for CSS) and <code>meta</code> in the <code>aiui:content-loaded</code> event (for custom JS). |</p>
<p>The front matter never shows on the page as text.</p>
<p><code>aiui validate</code> checks these types and reports the line of a wrong one</p>
<p>(<code>hidden: "yes"</code> is a string, so the page would stay in the sidebar), front</p>
<p>matter that is not valid YAML, images without alt text, two files that publish</p>
<p>the same page, two sidebar entries with the same title in one folder, headings</p>
<p>that skip a level, empty pages and a <code>theme.accent</code> with too little contrast.</p>
<p>Each finding names <code>file:line</code> and how to fix it; <code>--strict</code> makes them errors</p>
<p>for CI. See the codes.</p>
<p>A nav group can also list a link among its pages:</p>
<h2>Headings and "On this page"</h2>
<p><code>##</code> and <code>###</code> headings build the "On this page" list beside the article</p>
<p>(above it on narrow screens), which follows the reader as they scroll. Every</p>
<p>heading gets an id from its text, so <code>writing-docs#callouts</code> links straight to</p>
<p>a section, and a link with a section opens the page scrolled to it. Hover a</p>
<p>heading (on a phone, look beside it) for its link icon: one click puts the</p>
<p>section in the address bar and copies its URL. Keep one <code>#</code> title per page; the paragraph right under it is the</p>
<p>lede and reads larger.</p>
<p>To pin an anchor that survives a reworded title, end the heading with <code>{#id}</code>:</p>
<p><code>## Install the CLI {#install}</code> links as <code>#install</code>, the search index uses the</p>
<p>same id, and the braces never show.</p>
<h2>Callouts</h2>
<p>Use a callout for what a reader must not miss. Each tag sets the colour and</p>
<p>the icon: <code>&lt;Note&gt;</code> and <code>&lt;Info&gt;</code> (blue), <code>&lt;Tip&gt;</code> and <code>&lt;Check&gt;</code> (green),</p>
<p><code>&lt;Warning&gt;</code> (amber), <code>&lt;Danger&gt;</code> (red). A <code>title</code> is optional. A tag can sit on</p>
<p>lines of its own or share one with its text: <code>&lt;Note&gt;Saved.&lt;/Note&gt;</code> works (see</p>
<p>Component tags).</p>
<p>&lt;Note title="Run the build first"&gt;</p>
<p><code>aiui serve</code> serves the output of <code>aiui build</code>.</p>
<p>&lt;/Note&gt;</p>
<p>&lt;Tip&gt;</p>
<p><code>mode: system</code> follows the reader's light or dark setting.</p>
<p>&lt;/Tip&gt;</p>
<p>&lt;Check&gt;</p>
<p>The site rebuilt without warnings.</p>
<p>&lt;/Check&gt;</p>
<p>&lt;Warning title="Pinned versions"&gt;</p>
<p>Plugins built for SDK 1 keep working; check <code>aiui plugins doctor</code> after an upgrade.</p>
<p>&lt;/Warning&gt;</p>
<p>&lt;Danger&gt;</p>
<p>Never put an API key in <code>aiui.yaml</code>; it ships with the site.</p>
<p>&lt;/Danger&gt;</p>
<p>Pages written for MkDocs keep working: <code>!!! note "Title"</code> with an indented</p>
<p>body draws the same callout (<code>note</code>, <code>info</code>, <code>tip</code>, <code>success</code>, <code>warning</code>,</p>
<p><code>danger</code> and the other MkDocs types).</p>
<h2>Steps</h2>
<p>For a procedure the reader follows in order. Each step gets a number on a</p>
<p>rail; its body is ordinary Markdown, code blocks included.</p>
<p>pip install aiui</p>
<p>&lt;Steps&gt;</p>
<p>&lt;Step title="Install"&gt;</p>
<p>&lt;/Step&gt;</p>
<p>&lt;Step title="Write app.py"&gt;</p>
<p>Reply to every message with <code>@aiui.reply</code>.</p>
<p>&lt;/Step&gt;</p>
<p>&lt;Step title="Run it"&gt;</p>
<p><code>aiui run app.py</code>, then open the address it prints.</p>
<p>&lt;/Step&gt;</p>
<p>&lt;/Steps&gt;</p>
<p>Options: <code>titleSize="h2"</code> (or <code>h3</code>, <code>h4</code>) on <code>&lt;Steps&gt;</code> or one <code>&lt;Step&gt;</code> makes</p>
<p>the titles real headings, so they appear in "On this page" and get a link;</p>
<p><code>stepNumber={n}</code> restarts the count at <code>n</code>; <code>icon="terminal"</code> draws an icon</p>
<p>in the circle instead of the number; <code>id="…"</code> names the step for a link.</p>
<p>&lt;Steps titleSize="h3"&gt;</p>
<p>&lt;Step title="Install the package" icon="terminal"&gt;</p>
<p><code>pip install aiui</code></p>
<p>&lt;/Step&gt;</p>
<p>&lt;Step title="Start the server" stepNumber={3}&gt;</p>
<p><code>aiui run app.py</code></p>
<p>&lt;/Step&gt;</p>
<p>&lt;/Steps&gt;</p>
<h2>Accordions</h2>
<p><code>&lt;Accordion&gt;</code> hides detail the reader opens on demand: long output, edge</p>
<p>cases, FAQs. <code>defaultOpen</code> starts it open. Wrap several in <code>&lt;AccordionGroup&gt;</code></p>
<p>to stack them as one list.</p>
<p>&lt;AccordionGroup&gt;</p>
<p>&lt;Accordion title="Why does the site show the old page after a deploy?"&gt;</p>
<p>The entry files keep fixed names; <code>aiui build</code> adds a content hash to their</p>
<p>URLs, so a hard refresh is never needed.</p>
<p>&lt;/Accordion&gt;</p>
<p>&lt;Accordion title="Can I host the site on GitHub Pages?" defaultOpen&gt;</p>
<p>Yes. See Deploy to GitHub Pages.</p>
<p>&lt;/Accordion&gt;</p>
<p>&lt;/AccordionGroup&gt;</p>
<p><code>description="…"</code> adds a line under the title, <code>icon="code"</code> an icon before</p>
<p>it, and <code>id="…"</code> an anchor: <code>writing-docs#accordion-faq</code> opens the page with</p>
<p>that accordion open. A link to a heading inside a closed accordion opens it</p>
<p>too.</p>
<p>&lt;Accordion title="How do I link to an answer?" description="Give it an id" icon="code" id="accordion-faq"&gt;</p>
<p>Link to <code>#accordion-faq</code>; the accordion opens and scrolls into view.</p>
<p>&lt;/Accordion&gt;</p>
<p>In MkDocs syntax, <code>???</code> makes any callout a disclosure and <code>???+</code> starts it</p>
<p>open.</p>
<h2>Tabs</h2>
<p><code>&lt;Tabs&gt;</code> with one <code>&lt;Tab title="…"&gt;</code> per choice: the same task in different</p>
<p>tools, languages or operating systems. Arrow keys move between tabs.</p>
<p>&lt;Tabs&gt;</p>
<p>&lt;Tab title="macOS and Linux"&gt;</p>
<p>Run <code>export OPENAI_API_KEY=sk-...</code> before <code>aiui run</code>.</p>
<p>&lt;/Tab&gt;</p>
<p>&lt;Tab title="Windows"&gt;</p>
<p>Run <code>setx OPENAI_API_KEY sk-...</code>, then open a new terminal.</p>
<p>&lt;/Tab&gt;</p>
<p>&lt;/Tabs&gt;</p>
<p>Tabs sync by title: pick "Windows" once and every set of tabs on the page</p>
<p>with a "Windows" tab shows it, code groups included. The pick is remembered,</p>
<p>so the next page opens on it as well, and "On this page" lists only the</p>
<p>headings of the tabs shown. That covers a page-wide language or platform</p>
<p>switcher: use the same tab titles in each set. Options:</p>
<p>| Option | What it does |</p>
<p>|---|---|</p>
<p>| <code>sync={false}</code> on <code>&lt;Tabs&gt;</code> | This set keeps its own selection. |</p>
<p>| <code>defaultTabIndex={1}</code> on <code>&lt;Tabs&gt;</code> | The tab shown first (counted from 0) until the reader picks one. |</p>
<p>| <code>borderBottom</code> on <code>&lt;Tabs&gt;</code> | A rule under the tab content, to set it apart from the text below. |</p>
<p>| <code>icon="terminal"</code> on <code>&lt;Tab&gt;</code> | An icon before the title. |</p>
<p>| <code>id="…"</code> on <code>&lt;Tab&gt;</code> | An anchor: <code>#windows-setup</code> in the URL opens that tab. |</p>
<p>&lt;Tabs defaultTabIndex={1} borderBottom&gt;</p>
<p>&lt;Tab title="macOS and Linux"&gt;</p>
<p><code>export OPENAI_API_KEY=sk-...</code></p>
<p>&lt;/Tab&gt;</p>
<p>&lt;Tab title="Windows" icon="terminal" id="windows-setup"&gt;</p>
<p><code>setx OPENAI_API_KEY sk-...</code></p>
<p>&lt;/Tab&gt;</p>
<p>&lt;/Tabs&gt;</p>
<p>Tabs that each hold one code block draw as a code group (below). The MkDocs</p>
<p>form, consecutive <code>=== "Label"</code> blocks with indented bodies, works too.</p>
<h2>Code blocks</h2>
<p>Fence code with its language for highlighting and a copy button. 74</p>
<p>languages are highlighted, each grammar loaded only when a page uses it; the</p>
<p>rest show as plain text unless the site adds its own grammar</p>
<p>(code theme and languages). Comments are drawn in a</p>
<p>colour that keeps 4.5:1 contrast on the code background, light and dark.</p>
<p>Highlighted: apache, astro, awk, bash, bat, bicep, c, clojure, cmake, cpp,</p>
<p>csharp, css, csv, dart, diff, docker, dotenv, elixir, elm, fish, fsharp,</p>
<p>gleam, glsl, go, graphql, groovy, handlebars, haskell, hcl, html, http, ini,</p>
<p>java, javascript, jinja, json, jsonl, jsx, julia, kotlin, lua, make, markdown,</p>
<p>matlab, nginx, nix, objective-c, perl, php, powershell, prisma, proto,</p>
<p>python, r, regexp, ruby, rust, sass, scala, scss, solidity, sql, svelte,</p>
<p>swift, terraform, toml, tsx, typescript, vb, vue, wgsl, xml, yaml and zig,</p>
<p>with their common short names (<code>sh</code>, <code>js</code>, <code>ts</code>, <code>py</code>, <code>yml</code>, <code>tf</code>, <code>ps1</code>,</p>
<p><code>makefile</code>, <code>objc</code>, <code>protobuf</code>, <code>hs</code>, <code>ex</code> and more).</p>
<p>import praisonaiui as aiui</p>
<p>@aiui.reply</p>
<p>async def on_message(message: str):</p>
<p>await aiui.say(f"You said: {message}")</p>
<h3>File names and highlighted lines</h3>
<p>After the language, name the file with <code>title="…"</code> (or just the name) and</p>
<p>pick lines to highlight with <code>{…}</code>: single lines and ranges, separated by</p>
<p>commas.</p>
<p>import praisonaiui as aiui</p>
<p>@aiui.reply</p>
<p>async def on_message(message: str):</p>
<p>await aiui.say(f"You said: {message}")</p>
<p>Without <code>title=</code>, every word after the language up to the first option is</p>
<p>the title: <code>python Reply handler {3-4}</code> shows "Reply handler".</p>
<p><code>highlight={3-4}</code>, <code>hl_lines="3 4"</code> and <code>highlight="3-4"</code> work too, so fences</p>
<p>written for MkDocs or in MDX syntax carry over.</p>
<h3>Code block options</h3>
<p>Options go after the language, in any order, alone or together:</p>
<p>| Option | What it does |</p>
<p>|---|---|</p>
<p>| <code>lines</code> | Line numbers in a gutter (the copy button copies the code only). |</p>
<p>| <code>wrap</code> | Long lines wrap instead of scrolling sideways. |</p>
<p>| <code>expandable</code> | A block over 12 lines shows 12 and a "Show all N lines" button. |</p>
<p>| <code>nocopy</code> | No copy button. |</p>
<p>| <code>icon="terminal"</code> | An icon before the title (<code>terminal</code>, <code>code</code>, <code>rocket</code>, …; other names show the code icon). |</p>
<p>| <code>highlight={1-2,5}</code> | Highlighted lines; <code>{1-2,5}</code> alone does the same. |</p>
<p>| <code>focus={2,4-5}</code> | These lines stay sharp, the rest dim until the reader points at the block. |</p>
<p>A flag is never taken for a title, and <code>twoslash</code> is accepted and ignored.</p>
<p>import praisonaiui as aiui</p>
<p>@aiui.reply</p>
<p>async def on_message(message: str):</p>
<p>await aiui.say(f"You said: {message}, and this line is long enough to wrap on a phone")</p>
<h3>Diffs and notation comments</h3>
<p>End a line with a <code>[!code …]</code> comment in the language's own comment syntax</p>
<p>(<code>//</code>, <code>#</code>, <code>--</code>, <code>&lt;!-- --&gt;</code>) to mark it: <code>++</code> added, <code>--</code> removed,</p>
<p><code>highlight</code> and <code>focus</code>. <code>:N</code> marks that line and the next N-1; a comment on a</p>
<p>line of its own marks the lines after it. The comments never show, and the</p>
<p>copy button copies the code without them.</p>
<p>port = 3000  # [!code --]</p>
<p>port = 8080  # [!code ++]</p>
<p>serve(port)  # [!code highlight]</p>
<h3>The CodeBlock component</h3>
<p><code>&lt;CodeBlock&gt;</code> takes the same options as attributes (<code>language</code>, <code>filename</code>,</p>
<p><code>icon</code>, <code>lines</code>, <code>wrap</code>, <code>expandable</code>, <code>nocopy</code>, <code>highlight="[1,3]"</code>,</p>
<p><code>focus="[2]"</code>) and renders exactly like the fence. The code goes between the</p>
<p>tags, as written or as a `<code> {</code>…<code>} </code>` template literal.</p>
<p>&lt;CodeBlock language="bash" filename="install.sh" icon="terminal" lines highlight="[2]"&gt;</p>
<p>pip install aiui</p>
<p>aiui run app.py</p>
<p>&lt;/CodeBlock&gt;</p>
<h3>Code groups</h3>
<p>Put fences between <code>&lt;CodeGroup&gt;</code> and <code>&lt;/CodeGroup&gt;</code> (each on its own line) to</p>
<p>show them as tabs, one per fence, labelled with the file name or, without</p>
<p>one, the language. Use it for the same step in different tools or languages.</p>
<p>pip install aiui</p>
<p>uv pip install aiui</p>
<p>poetry add aiui</p>
<p>&lt;CodeGroup&gt;</p>
<p>&lt;/CodeGroup&gt;</p>
<p><code>&lt;CodeGroup dropdown&gt;</code> picks the file from a menu in the header instead of</p>
<p>tabs, for groups with many files or long names. Code groups sync with tabs</p>
<p>of the same title.</p>
<p>pip install aiui</p>
<p>uv pip install aiui</p>
<p>&lt;CodeGroup dropdown&gt;</p>
<p>&lt;/CodeGroup&gt;</p>
<h2>Cards</h2>
<p><code>&lt;Card&gt;</code> is a tile with a title, an optional <code>icon</code> and an optional <code>href</code></p>
<p>(a page like <code>quickstart.md</code>, or any URL); with a link the whole card is</p>
<p>clickable. <code>&lt;CardGroup cols={2}&gt;</code> lays cards out in 1 to 4 columns (one on</p>
<p>phones).</p>
<p>&lt;CardGroup cols={2}&gt;</p>
<p>&lt;Card title="Quick start" icon="rocket" href="../getting-started/quickstart.md"&gt;</p>
<p>A chat app in five minutes.</p>
<p>&lt;/Card&gt;</p>
<p>&lt;Card title="Layouts" icon="panels-top-left" href="layouts.md"&gt;</p>
<p>Five frames for the same app.</p>
<p>&lt;/Card&gt;</p>
<p>&lt;/CardGroup&gt;</p>
<p><code>icon</code> takes any icon. A list whose items start with bold text</p>
<p>also becomes a grid of plain cards.</p>
<p>Card options:</p>
<p>| Option | What it does |</p>
<p>|---|---|</p>
<p>| <code>horizontal</code> | Icon beside the title, one compact row. |</p>
<p>| <code>img="images/x.png"</code> | A header image across the top (relative paths resolve like Markdown images). |</p>
<p>| <code>cta="Read the guide"</code> | A call-to-action line with an arrow at the bottom. |</p>
<p>| <code>arrow</code> / <code>arrow={false}</code> | A link arrow in the corner (on by default for links that leave the site). |</p>
<p>| <code>color="#0f766e"</code> | The icon's colour (a hex, <code>rgb()</code>, <code>hsl()</code> or colour name). |</p>
<p>&lt;CardGroup cols={2}&gt;</p>
<p>&lt;Card title="Quick start" icon="rocket" horizontal color="#0f766e" href="../getting-started/quickstart.md" /&gt;</p>
<p>&lt;Card title="Themes" img="../images/theme-comparison.png" cta="Pick a theme" href="theming.md"&gt;</p>
<p>Light, dark and the presets side by side.</p>
<p>&lt;/Card&gt;</p>
<p>&lt;/CardGroup&gt;</p>
<h2>Columns</h2>
<p><code>&lt;Columns cols={2}&gt;</code> lays any content side by side, one <code>&lt;Column&gt;</code> per cell,</p>
<p>in 1 to 4 columns; on phones the columns stack.</p>
<p>&lt;Columns cols={2}&gt;</p>
<p>&lt;Column&gt;</p>
<p><strong>Python</strong>: <code>pip install aiui</code></p>
<p>&lt;/Column&gt;</p>
<p>&lt;Column&gt;</p>
<p><strong>From source</strong>: <code>pip install -e ".[dev]"</code></p>
<p>&lt;/Column&gt;</p>
<p>&lt;/Columns&gt;</p>
<h2>Icons</h2>
<p>Every <code>icon</code> (frontmatter, a navigation group, <code>&lt;Card&gt;</code>, <code>&lt;Callout&gt;</code>,</p>
<p><code>&lt;Step&gt;</code>, <code>&lt;Tab&gt;</code>, <code>&lt;Accordion&gt;</code>, <code>&lt;Badge&gt;</code>, <code>&lt;Prompt&gt;</code>) and the <code>&lt;Icon&gt;</code> tag</p>
<p>take the same values:</p>
<li>any <a href="https://lucide.dev/icons">lucide icon</a> name, case-insensitive (<code>flag</code>,</li>
<p><code>git-branch</code>, or an old name such as <code>home</code>);</p>
<li>an emoji (<code>icon="🚀"</code>);</li>
<li>an image URL: <code>https://…</code> or a site path such as <code>/icons/logo.svg</code>.</li>
<p><code>&lt;Icon&gt;</code> puts one inside a sentence: <code>size</code> in pixels (default: the text's</p>
<p>size) and <code>color</code> (a hex, <code>rgb()</code>, a colour name or a theme token).</p>
<p>Ship it &lt;Icon icon="flag" size={20} color="#0f766e" /&gt;, go &lt;Icon icon="house" /&gt; or &lt;Icon icon="🚀" /&gt;.</p>
<p>The most used icons are drawn at once. Any other lucide icon loads on demand</p>
<p>from one of 32 small files (about 4 kB each), so a page downloads only the</p>
<p>icons it shows and no page gets heavier for the 1,900 icons on offer.</p>
<p><code>aiui validate</code> warns (7009) about an icon name that is not lucide's, with the</p>
<p>nearest name.</p>
<h2>More components</h2>
<li><code>&lt;Callout&gt;</code>: <code>icon</code> (any icon), <code>color</code>, <code>title</code>.</li>
<li><code>&lt;Badge&gt;</code> (inside a sentence): <code>color</code> (<code>gray</code>, <code>blue</code>, <code>green</code>, <code>yellow</code>, <code>orange</code>, <code>red</code>, <code>purple</code>, or a token), <code>size</code> (<code>xs</code> to <code>lg</code>), <code>shape="pill"</code>, <code>icon</code>, <code>stroke</code>, <code>disabled</code>.</li>
<li><code>&lt;Tooltip&gt;</code>: <code>tip</code>, <code>headline</code>, <code>cta</code> + <code>href</code>. It opens on hover or keyboard focus; Escape closes it.</li>
<li><code>&lt;Tree&gt;</code> (or <code>&lt;FileTree&gt;</code>) around a Markdown list, which reads on GitHub too: an item ending in <code>/</code> or with items under it is a folder (open), <code><strong>name</strong></code> is highlighted. The MDX form <code>&lt;Tree.Folder name defaultOpen openable={false} highlight&gt;</code> / <code>&lt;Tree.File name highlight /&gt;</code> works as well; arrow keys move between rows, Right / Left open and close.</li>
<li><code>&lt;Prompt&gt;</code>: <code>description</code> (Markdown), <code>icon</code>, <code>actions</code> from <code>copy</code>, <code>chatgpt</code>, <code>claude</code>, <code>cursor</code> (default: the first three). The prompt folds under "Show prompt"; Copy and the links carry it exactly as written.</li>
<li><code>&lt;Tile&gt;</code>: <code>href</code>, <code>title</code> (Markdown), <code>description</code>; the body is the preview.</li>
<li><code>&lt;Color variant="compact|table"&gt;</code>: <code>&lt;Color.Item name value&gt;</code> (one colour or <code>{{ light, dark }}</code>; a click copies it), grouped by <code>&lt;Color.Row title&gt;</code> in a table.</li>
<li>Table column widths: <code>&lt;colgroup&gt;&lt;col width="30%"&gt;&lt;col width="70%"&gt;&lt;/colgroup&gt;</code> in an HTML <code>&lt;table&gt;</code>.</li>
<h2>API fields</h2>
<p>Document an endpoint's parameters and response with field rows. Each row</p>
<p>shows the name, its type, where it goes, <code>required</code> and <code>deprecated</code>, and</p>
<p>its default, then the description (any Markdown). For Python code, a</p>
<p><code>::: mypkg.module</code> line writes these rows from the docstrings</p>
<p>(Python API reference).</p>
<p><code>&lt;ParamField&gt;</code> names the parameter by where it goes: <code>path</code>, <code>query</code>,</p>
<p><code>body</code> or <code>header</code>. <code>&lt;ResponseField name&gt;</code> is a field of the response.</p>
<p>Both take <code>type</code> (any text: <code>string</code>, <code>string[]</code>, <code>object</code>, <code>User | null</code>),</p>
<p><code>required</code>, <code>deprecated</code>, <code>default</code>, and <code>pre</code> / <code>post</code>: labels shown before</p>
<p>or after the name (<code>pre={["beta"]}</code>, or <code>pre="beta, internal"</code>).</p>
<p><code>placeholder</code> is accepted for API playgrounds and not shown.</p>
<p>Every row has its own link: <code>#param-user_id</code>, <code>#response-next_cursor</code>, and</p>
<p>for a nested field the path from its parent (<code>#response-user-address</code>). The</p>
<p>name is that link, and opening it opens the <code>&lt;Expandable&gt;</code> around the field.</p>
<p><code>id="…"</code> sets the link yourself.</p>
<p>&lt;ParamField path="user_id" type="string" required&gt;</p>
<p>The user to fetch.</p>
<p>&lt;/ParamField&gt;</p>
<p>&lt;ParamField query="tags" type="string[]" default="all" pre={["beta"]}&gt;</p>
<p>Only users with these tags.</p>
<p>&lt;/ParamField&gt;</p>
<p>&lt;ResponseField name="user" type="object" required&gt;</p>
<p>The user.</p>
<p>&lt;Expandable title="user properties"&gt;</p>
<p>&lt;ResponseField name="name" type="string"&gt;Display name.&lt;/ResponseField&gt;</p>
<p>&lt;ResponseField name="email" type="string" deprecated&gt;Use <code>emails</code>.&lt;/ResponseField&gt;</p>
<p>&lt;/Expandable&gt;</p>
<p>&lt;/ResponseField&gt;</p>
<p><code>&lt;Expandable title="…"&gt;</code> folds nested properties behind "Show …" (default</p>
<p>"Show properties"); <code>defaultOpen</code> starts it open. Nest them as deep as the</p>
<p>object goes.</p>
<h3>Request and response examples</h3>
<p><code>&lt;RequestExample&gt;</code> and <code>&lt;ResponseExample&gt;</code> hold code fences, labelled like a</p>
<p>code group (several fences become tabs; <code>dropdown</code> picks one</p>
<p>from a menu instead). They leave the article: on wide screens they stay in</p>
<p>view in a column on the right, in place of "On this page"; on phones they</p>
<p>follow the article. <code>&lt;Panel&gt;</code> puts anything else in that column.</p>
<p>curl https://api.example.com/v1/users/42</p>
<p>client.users.get("42")</p>
<p>{ "user": { "name": "Ada" } }</p>
<p>{ "error": "not_found" }</p>
<p>Put each on lines of its own, outside list items (a <code>&lt;Panel&gt;</code> inside a list</p>
<p>item stays where it is). This page has none, so it keeps its "On this page".</p>
<h2>Reusable snippets and variables</h2>
<p>Write a block once and use it on many pages. Put it in <code>docs/snippets/</code> (that</p>
<p>folder is never published as pages) and include it where it should appear:</p>
<p><code>docs/snippets/install.md</code>, where <code>{pkg}</code> takes the value passed in:</p>
<p>pip install {pkg}</p>
<p>Site-wide values go in one key of <code>aiui.yaml</code>, and <code>{{name}}</code> in any page or</p>
<p>snippet becomes the value, in text, code and front matter (<code>title</code>,</p>
<p><code>description</code>):</p>
<li>Snippets nest, and take any number of props. A path is looked up next to</li>
<p>the page, then in <code>docs/snippets/</code>, then the docs folder; <code>/x.md</code> starts at</p>
<p>the docs folder. Indent the tag inside a list item and the snippet follows</p>
<p>the indent.</p>
<li>Existing MDX snippet syntax works too: <code>import Install from '/snippets/install.mdx'</code></li>
<p>then <code>&lt;Install pkg="aiui" /&gt;</code>. From MkDocs: <code>--8&lt;-- "install.md"</code> on</p>
<p>a line of its own.</p>
<li>Write <code>\{{name}}</code> for a literal <code>{{name}}</code>. A snippet tag in a code block</li>
<p>stays as written.</p>
<li>It all happens in <code>aiui build</code>, so the page, its <code>.md</code> copy, <code>llms-full.txt</code></li>
<p>and search all hold the expanded text. A missing snippet, a path outside the</p>
<p>project folder, or a snippet that includes itself fails the build (7008), and</p>
<p><code>aiui validate</code> names each <code>{{name}}</code> that has no value (7007).</p>
<li>To publish a docs folder that is really called <code>snippets</code>, add</li>
<p><code>"!snippets"</code> to <code>content.docs.exclude</code>.</p>
<h2>Changelog</h2>
<p>A changelog page is a list of <code>&lt;Update&gt;</code> entries, newest first. Add</p>
<p><code>rss: true</code> and readers can subscribe:</p>
<li><code>label</code> (a date or version) is the entry's section heading: it gets an</li>
<p>anchor (<code>#2026-11-18</code>, or <code>id="…"</code>), a copy-link icon, a line in "On this</p>
<p>page" and its own result in site search. From 768px wide it sits in a left</p>
<p>column that stays in view while the entry scrolls.</p>
<li><code>description</code> shows under the label, <code>tags</code> (<code>{["A", "B"]}</code> or <code>"A, B"</code>) as</li>
<p>chips.</p>
<li>A page with tagged entries gets a tag filter above the first entry. Choosing</li>
<p>tags shows the entries with any of them and keeps the choice in the address</p>
<p>(<code>?tags=API,Fix</code>), so a filtered view is a link you can share.</p>
<li><code>rss: true</code>: <code>aiui build</code> writes <code>&lt;page&gt;/rss.xml</code> (RSS 2.0, one item per</li>
<p>entry: the label and description as its title, the entry's anchor as its</p>
<p>link, its tags as categories and its body as HTML; a label that is a date,</p>
<p>such as <code>2026-11-18</code> or <code>November 18, 2026</code>, becomes its date). The page's</p>
<p>head gets <code>&lt;link rel="alternate" type="application/rss+xml"&gt;</code>, so browsers</p>
<p>and feed readers find it, and the filter row shows an "RSS feed" link. Links</p>
<p>are absolute when the site URL is known (<code>seo.siteUrl</code> or a <code>CNAME</code> file),</p>
<p>base path included.</p>
<li>The entries are <code>## label</code> sections in the page's <code>.md</code> and <code>llms-full.txt</code>.</li>
<h2>Component tags</h2>
<p>Tags work the way MDX reads them: on lines of their own, on one line with</p>
<p>their text, inside a list item (indent the tag with the item's text), or</p>
<p>self-closing (<code>&lt;Card title="Docs" href="index.md" /&gt;</code>). Attributes take quotes</p>
<p>or braces (<code>cols={3}</code>) and may run over several lines. A body indented under</p>
<p>its tag is text, not code, as in MDX.</p>
<p>A tag the site does not know (say <code>&lt;Gadget&gt;</code>) keeps its</p>
<p>text as plain Markdown, and <code>aiui build</code> and <code>aiui validate</code> name it:</p>
<p><code>Warning: docs/guide.md:12: &lt;Gadget&gt; is not a docs component; its content shows as plain Markdown</code>.</p>
<p><code>&lt;Visibility for="humans"&gt;</code> / <code>for="agents"</code> shows its content only on the page /</p>
<p>only to agents (AI-ready docs).</p>
<h2>Your own components</h2>
<p>Write a React component once and use it on any page as a tag. Point the site</p>
<p>at one ES module beside <code>aiui.yaml</code>:</p>
<p>The module registers each component with <code>registerBlock</code> from <code>@aiui/sdk</code>, or</p>
<p>exports it under the tag's name. It imports React and the SDK as bare names:</p>
<p>the build maps them to the page's own copies, so no bundler is needed for</p>
<p>plain JS, and hooks work.</p>
<li><strong>Props.</strong> A quoted attribute is a string; <code>{…}</code> is a value: a number, <code>true</code></li>
<p>or <code>false</code>, an array or an object (<code>{{ calls: 10 }}</code>, JSON or JS-style); a</p>
<p>bare attribute (<code>&lt;Counter compact /&gt;</code>) is <code>true</code>. The component gets them as</p>
<p>props, and as <code>node.props</code> like any block.</p>
<li><strong>Children.</strong> The tag's body is Markdown, rendered and passed as <code>children</code>.</li>
<p>A self-closing tag that shares its line with text sits inside the sentence.</p>
<li><strong>Loading.</strong> The module loads only on a page that uses one of its tags,</li>
<p>after the page has painted; until then, and if the module fails or the</p>
<p>component throws, the page shows the tag's body. A built-in tag name</p>
<p>(<code>&lt;Note&gt;</code>, <code>&lt;Card&gt;</code>) keeps its built-in meaning.</p>
<li><strong>Tags.</strong> The build finds them in the module (<code>registerBlock('Name'</code> and</li>
<p><code>export function Name</code>). A minified bundle hides them: list them with</p>
<p><code>site.components: {src: ./components/index.js, tags: [Counter, Price]}</code>.</p>
<p>Declared tags are not reported as unknown; a missing module, or one with no</p>
<p>tag the build can find, is a 7021 warning.</p>
<li><strong>Security.</strong> The module is your site's own code, served from the site</li>
<p>(<code>script-src 'self'</code>); the build adds the import map's hash to the</p>
<p>Content-Security-Policy. Only same-site</p>
<p>modules load. In the <code>.md</code> copy for agents the tag's body stays and the tag goes.</p>
<li><strong>Styles.</strong> Use the theme's CSS variables (<code>var(--primary)</code>), or add a</li>
<p>stylesheet with <code>site.customCss</code>.</p>
<p>An installed UI plugin whose <code>blocks()</code> include a type named</p>
<p>like a component (<code>HelloCard</code>) provides that tag too, with no config: when a</p>
<p>page uses a tag nothing else knows, the build asks the plugins and publishes</p>
<p>the plugin's static folder with the site.</p>
<h2>Comments</h2>
<p><code>{/* … */}</code> and <code>&lt;!-- … --&gt;</code> never show on the page, in search or in</p>
<p><code>llms-full.txt</code>; inside a code block they stay as written.</p>
<h2>Tables</h2>
<p>| Key | What it sets | Default |</p>
<p>|---|---|---|</p>
<p>| <code>preset</code> | colours (and for <code>paper</code>, the type) | <code>zinc</code> |</p>
<p>| <code>mode</code> | <code>light</code>, <code>dark</code> or <code>system</code> | <code>darkMode</code> |</p>
<p>| <code>radius</code> | corner radius, <code>none</code> to <code>xl</code> | <code>md</code> |</p>
<p>A wide table scrolls inside its frame, never the page.</p>
<h2>Images</h2>
<p>Paths are relative to the page. Write the alt text as a sentence about what</p>
<p>the image shows; it is also what search engines and assistants read. Click</p>
<p>any image (or focus it and press Enter) to see it at full size, with **Copy</p>
<p>image<strong> and </strong>Download** buttons; Escape or a click elsewhere closes it. An</p>
<p>image inside a link opens the link instead, and <code>noZoom</code> turns zoom off for</p>
<p>one image:</p>
<p><code>width</code> and <code>height</code> on <code>&lt;img&gt;</code> set its size and reserve the space before it</p>
<p>loads, so the page does not jump.</p>
<h3>Light and dark images</h3>
<p>Show one image in light mode and another in dark mode. They follow the site's</p>
<p>theme toggle, not only the system setting. Any of these forms works, so the</p>
<p>same Markdown also reads well on GitHub:</p>
<h2>Videos</h2>
<p>Paste a YouTube, Vimeo or Loom URL (watch, share or embed form) in an</p>
<p><code>&lt;iframe&gt;</code>, or a video file in <code>&lt;video&gt;</code>:</p>
<li>An embedded video shows a play button (with <code>poster</code>, if set) until the</li>
<p>reader presses it: nothing loads from the provider before that, so a page</p>
<p>of videos stays fast and sets no third-party cookies. YouTube plays from</p>
<p><code>youtube-nocookie.com</code>, Vimeo with Do Not Track; the player runs in a</p>
<p>sandboxed frame. <code>width</code> and <code>height</code> set the shape (16:9 by default).</p>
<li>An <code>&lt;iframe&gt;</code> from any other site shows as a link to it, never as a frame.</li>
<li><code>&lt;video autoPlay&gt;</code> always plays muted and inline, and readers who ask for</li>
<p>reduced motion get the controls instead. Without <code>autoPlay</code> it shows</p>
<p>controls.</p>
<li>In the page's <code>.md</code> copy for assistants, each video is a link.</li>
<h3>Raw HTML</h3>
<p>Pages may use plain HTML for layout and text (<code>&lt;div&gt;</code>, <code>&lt;details&gt;</code>,</p>
<p><code>&lt;kbd&gt;</code>, <code>&lt;sup&gt;</code>, tables, <code>&lt;img&gt;</code>, <code>&lt;picture&gt;</code>), plus the <code>&lt;iframe&gt;</code> and</p>
<p><code>&lt;video&gt;</code> above, styled with utility classes. Anything that could run code or send the reader's data</p>
<p>elsewhere is not rendered, so a page can never become a way to attack its</p>
<p>readers:</p>
<p>| You write | The reader sees | Instead |</p>
<p>|-----------|-----------------|---------|</p>
<p>| <code>&lt;iframe&gt;</code> from a site other than YouTube, Vimeo or Loom | a link to it | a link, or a screenshot with a link |</p>
<p>| <code>&lt;script&gt;</code> | nothing | <code>site.customJs</code> |</p>
<p>| <code>&lt;style&gt;</code>, <code>&lt;link rel="stylesheet"&gt;</code> | nothing | <code>site.customCss</code> |</p>
<p>| <code>&lt;form&gt;</code>, <code>&lt;audio&gt;</code>, <code>&lt;object&gt;</code>, <code>&lt;embed&gt;</code> | nothing | a link |</p>
<p><code>aiui validate</code> and <code>aiui build</code> name each one with its file and line</p>
<p>(finding 7019). HTML inside code fences and inline code is shown as code and</p>
<p>never flagged.</p>
<p><code>&lt;Frame&gt;</code> sets an image on a mat, with an optional <code>caption</code> under it and a <code>hint</code> above</p>
<p>it (both Markdown, links included):</p>
<p>&lt;Frame caption="A tool call, then an approval the agent waits on."&gt;</p>
<p>!A tool call row (execute_command, Done in 0.3 s) above the answer, then an approval card for pip install numpy with Approve and Deny</p>
<p>&lt;/Frame&gt;</p>
<h2>Styling with classes</h2>
<p>Add <code>className</code> (or <code>class</code>) to a component tag or to raw HTML to adjust one</p>
<p>block: its spacing, width, text, colour or layout. The classes use the site's</p>
<p>theme tokens, so they follow light and dark mode and any theme preset:</p>
<p>Only these classes work (<code>{a,b}</code> means either). Any other class is dropped,</p>
<p>and <code>aiui validate</code> and <code>aiui build</code> name it with its file and line, with the</p>
<p>nearest allowed class (finding 7022). Nothing on a page can move the site's</p>
<p>header, sidebar or search, or cover them, so there is no <code>fixed</code>, <code>absolute</code>,</p>
<p><code>z-*</code> or arbitrary <code>[...]</code> value.</p>
<p>| Group | Classes |</p>
<p>|-------|---------|</p>
<p>| Display | <code>block</code>, <code>inline-block</code>, <code>inline</code>, <code>flex</code>, <code>inline-flex</code>, <code>grid</code>, <code>hidden</code> |</p>
<p>| Flex and grid | <code>flex-row</code>, <code>flex-col</code>, <code>flex-wrap</code>, <code>flex-1</code>, <code>flex-none</code>, <code>shrink-0</code>, <code>grid-cols-{1,2,3,4}</code>, <code>col-span-{2,3,full}</code>, <code>items-{start,center,end,baseline}</code>, <code>justify-{start,center,end,between}</code>, <code>self-{start,center,end}</code>, <code>gap{,-x,-y}-{0,1,2,3,4,6,8}</code> |</p>
<p>| Spacing | <code>m</code>, <code>mx</code>, <code>my</code>, <code>mt</code>, <code>mb</code>, <code>p</code>, <code>px</code>, <code>py</code>, <code>pt</code>, <code>pb</code> with <code>-{0,1,2,3,4,6,8,12}</code>; <code>mx-auto</code> |</p>
<p>| Size | <code>w-{full,auto,fit,1/2,1/3,2/3,1/4,3/4}</code>, <code>max-w-{xs,sm,md,lg,xl,2xl,full,prose}</code>, <code>h-auto</code>, <code>min-w-0</code>, <code>aspect-{video,square}</code>, <code>object-{cover,contain}</code> |</p>
<p>| Text | <code>text-{xs,sm,base,lg,xl,2xl,3xl}</code>, <code>font-{normal,medium,semibold,bold,mono}</code>, <code>text-{left,center,right}</code>, <code>italic</code>, <code>underline</code>, <code>no-underline</code>, <code>uppercase</code>, <code>truncate</code>, <code>whitespace-nowrap</code>, <code>break-words</code>, <code>leading-{tight,normal,relaxed}</code>, <code>tracking-{tight,wide}</code> |</p>
<p>| Colour (theme tokens) | <code>text-{foreground,muted-foreground,primary,primary-foreground,destructive,success,warning,info}</code>, <code>bg-{background,card,muted,accent,primary,secondary}</code>, <code>border-{border,primary}</code> |</p>
<p>| Borders | <code>border</code>, <code>border-0</code>, <code>border-2</code>, <code>border-t</code>, <code>border-b</code>, <code>border-dashed</code>, <code>rounded{,-none,-sm,-md,-lg,-xl,-full}</code> |</p>
<p>| Other | <code>overflow-hidden</code>, <code>overflow-x-auto</code>, <code>opacity-{50,75}</code> |</p>
<p>| Screen size | <code>sm:</code>, <code>md:</code> and <code>lg:</code> before a display class, <code>flex-row</code>, <code>flex-col</code>, <code>grid-cols-{1,2,3,4}</code>, <code>text-{left,center,right}</code> or <code>w-{full,1/2,1/3,2/3}</code> (from 640, 768 and 1024 px wide) |</p>
<p>| Dark mode | <code>dark:</code> before a display class: <code>dark:hidden</code>, <code>dark:block</code>, <code>dark:inline-block</code>, <code>dark:inline</code>, <code>dark:flex</code>, <code>dark:grid</code> |</p>
<li>A class wins over the component's own look, so <code>&lt;Note className="mt-8"&gt;</code></li>
<p>really moves the note.</p>
<li><code>style="…"</code> is always removed (finding 7022 names it). For anything the</li>
<p>classes do not cover, write CSS in <code>site.customCss</code>.</p>
<li>Your own components (<code>site.components</code>) receive <code>className</code> as a prop and</li>
<p>decide what to do with it. <code>&lt;Tab&gt;</code> and <code>&lt;Visibility&gt;</code> take no classes.</p>
<h2>Diagrams and math</h2>
<p>A <code>mermaid</code> fence draws a diagram (loaded only on pages that have one), and</p>
<p><code>$$ … $$</code> typesets math.</p>
<p>flowchart LR</p>
<p>YAML --&gt; build["aiui build"] --&gt; site[Static site]</p>
<h2>Search</h2>
<p>Readers press &lt;kbd&gt;⌘&lt;/kbd&gt; &lt;kbd&gt;K&lt;/kbd&gt; (&lt;kbd&gt;Ctrl&lt;/kbd&gt; &lt;kbd&gt;K&lt;/kbd&gt;) or the</p>
<p>search field. Search covers page titles, every <code>##</code> and <code>###</code> heading and all</p>
<p>the text under it, and a result opens the page at its section with the words</p>
<p>marked. It forgives typing: plurals and verb forms match ("themes",</p>
<p>"theming"), a word matches as you type it ("inst"), one typo in a longer word</p>
<p>still matches, and question words drop out ("how do I deploy"). Titles rank</p>
<p>first, then headings, then text, each BM25 style.</p>
<p>While the dialog is open the address bar carries the query, so a link such as</p>
<p><code>/docs?q=api+keys</code> opens search filled in. On a site with header tabs</p>
<p>(Navigation), chips filter results by tab: search starts in</p>
<p>the reader's tab, and one row offers the other tabs' results when it has none.</p>
<p>A navigation group's <code>boost:</code> applies to its pages (a page's own wins).</p>
<p>Site settings (<code>search.provider</code> is ignored and <code>aiui validate</code> says so):</p>
<p><code>aiui build</code> writes the index (<code>search-index.json</code>, up to 6,000 characters</p>
<p>per section) and the same index in parts under <code>search-index/</code>, so the dialog</p>
<p>downloads only what a query needs:</p>
<p>| Part | Holds | Fetched |</p>
<p>|---|---|---|</p>
<p>| <code>search-index/meta.json</code> | each page's path, keywords, boost and section headings with their word counts, and the sorted list of every word | the first time a reader opens search |</p>
<p>| <code>search-index/&lt;key&gt;/w&lt;n&gt;.json</code> | for a run of those words, the sections each appears in and how often | when a query has a word in that run (by stem, prefix or one typo) |</p>
<p>| <code>search-index/&lt;key&gt;/p&lt;i&gt;.json</code> | page <code>i</code>'s section text | when the page is in the results, for its snippets |</p>
<p>Ranking is the same as over the whole file: BM25, stems, prefixes, typos,</p>
<p>keywords, <code>boost</code> and the tab chips. On this repository's 99 searchable pages</p>
<p>the first open downloads 35 KB gzipped instead of 181 KB, and a first query</p>
<p>about 13 KB more. <code>&lt;key&gt;</code> is a hash of the index, so a page cached from an</p>
<p>older deploy never mixes parts; a missing part, or a site built before the</p>
<p>parts existed, makes the dialog read <code>search-index.json</code> whole, which every</p>
<p>other reader (the MCP server, Ask AI, older</p>
<p>pages) still uses. A site with sign-in gets no parts: its</p>
<p><code>search-index.json</code> is cut per reader.</p>
<h2>Links between pages</h2>
<p>Link to another page by its file: <code>Theming</code>. The build turns it</p>
<p>into the page's URL, so links work on GitHub and on the site.</p>
<p>A folder's <code>README.md</code> or <code>index.md</code> is served at the folder's URL</p>
<p>(<code>protocols/adp/README.md</code> at <code>/docs/protocols/adp</code>), and a number prefix is</p>
<p>dropped (<code>adr/0003-selectable-layouts.md</code> at <code>/docs/adr/selectable-layouts</code>).</p>
<p>List such a page in the nav by its file path (<code>protocols/adp/README</code>); the</p>
<p>header still opens the tab that lists it.</p>
<h2>Check links</h2>
<p><code>aiui docs check-links</code> finds every link that leads nowhere, before readers do:</p>
<p>It checks Markdown links and images, reference links, <code>href</code> and <code>src</code> on</p>
<p>components and HTML (<code>&lt;Card href&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;img&gt;</code>), the docs home <code>hero</code> and</p>
<p><code>features</code> links, the nav page entries and the navbar and footer links in the</p>
<p>YAML. A <code>#section</code> link is checked against the ids the site gives its headings</p>
<p>(<code>## The aiui CLI</code> is <code>#the-aiui-cli</code>). Links in code are skipped. Paths outside</p>
<p>the docs (app routes such as <code>/chat</code>) are not judged.</p>
<p><code>--external</code> also requests every <code>http(s)</code> URL, and <code>--json</code> prints the result</p>
<p>for scripts. The exit code is <code>1</code> when a link is broken, so a CI step needs one</p>
<p>line. <code>aiui validate --strict</code> and <code>aiui build --strict</code> fail on broken links</p>
<p>too; without <code>--strict</code> they print them as warnings.</p>
<h2>Page actions</h2>
<p>Above every page's title, <strong>Copy page</strong> copies the page's Markdown, ready to</p>
<p>paste into an assistant. <code>Ctrl+C</code> (<code>⌘C</code> on a Mac) does the same when nothing</p>
<p>is selected and the cursor is not in a text field. Its menu also has:</p>
<p>| Action | Id | What it does |</p>
<p>|---|---|---|</p>
<p>| Copy page | <code>copy</code> | The page's agent-ready Markdown on the clipboard |</p>
<p>| View as Markdown | <code>view</code> | Opens <code>/docs/&lt;page&gt;.md</code>, the page as plain Markdown for assistants |</p>
<p>| Download as PDF | <code>pdf</code> | The browser's Print dialog; pick <strong>Save as PDF</strong> |</p>
<p>| Listen to page | <code>listen</code> | The browser reads the article aloud, with pause and stop; hidden where the browser has no speech |</p>
<p>| Open in ChatGPT | <code>chatgpt</code> | A new ChatGPT chat that reads the page and takes questions |</p>
<p>| Open in Claude | <code>claude</code> | The same, in Claude |</p>
<p>| Copy MCP server URL, Connect to Cursor / VS Code | <code>mcp</code> | On a site <code>aiui serve</code> runs (MCP server) |</p>
<p>Nothing to configure: they use the Markdown <code>aiui build</code> already publishes.</p>
<p>Try it on this page.</p>
<p>To pick and order the actions, list them. Besides the ids above there are</p>
<p><code>perplexity</code>, <code>grok</code>, <code>google</code> (Google AI Mode), <code>copilot</code>, <code>mistral</code> (Le Chat)</p>
<p>and <code>cursor</code>, and links of your own:</p>
<p>In <code>href</code>, <code>{url}</code> is the page's address, <code>{md}</code> its Markdown, <code>{title}</code> its</p>
<p>title and <code>{prompt}</code> the "read this page" prompt the assistants get, each</p>
<p>URL-encoded. <code>pageActions: false</code> turns the menu off. One page can have its own</p>
<p>list, or none, in its front matter:</p>
<h3>Printing and PDF</h3>
<p>A printed page (Download as PDF, or the browser's own Print, <code>Ctrl+P</code> / <code>⌘P</code>)</p>
<p>is the article alone, on light paper even when the reader uses dark mode:</p>
<li>The header, sidebar, "On this page", page actions, previous / next, footer</li>
<p>and feedback are left out. Breadcrumbs and "Last updated" stay.</p>
<li>Everything a click would reveal is shown: accordions, <code>&lt;Expandable&gt;</code> field</li>
<p>lists and file trees open, every tab of <code>&lt;Tabs&gt;</code> and <code>&lt;CodeGroup&gt;</code> prints</p>
<p>under its own title, and <code>expandable</code> code blocks print every line.</p>
<li>Code wraps instead of running off the page; code blocks, callouts, cards,</li>
<p>steps, table rows and images are not split across pages.</p>
<li>External links print their address after the link text:</li>
<p><code>link (https://example.com/docs)</code>.</p>
<p>Site chrome added by custom JS (<code>site.customJs</code>) or a plugin can opt out of</p>
<p>print with <code>data-print="hide"</code>. The PDF comes from the reader's browser: no</p>
<p>build step, no server-side renderer.</p>
<h2>Page footer</h2>
<p>Under each page: "Was this page helpful?" (on by default, see</p>
<p>Page feedback) and two optional parts, turned on in <code>aiui.yaml</code>:</p>
<li><strong>Edit this page</strong> links to <code>pattern</code> with <code>:path</code> replaced by the page's</li>
<p>file under the docs folder (<code>getting-started/quickstart.md</code>).</p>
<li><strong>Last updated</strong> is the date of the last commit that changed the page.</li>
<p><code>aiui build</code> reads it from git. In a shallow clone, pages changed inside the</p>
<p>cloned history keep their date; older ones get none rather than the clone's</p>
<p>date. In GitHub Actions, check out with <code>fetch-depth: 0</code> to date every page.</p>
<p>A page's <code>lastUpdatedDate: 2026-05-01</code> sets the date by hand, and</p>
<p><code>timestamp: false</code> (or <code>true</code>) turns it off (or on) for that page alone.</p>
<li><strong>Was this page helpful?</strong> keeps the vote (next section). With <code>issues</code>, a</li>
<p>"No" also offers a new issue there with the page's title and address filled in.</p>
<p>The footer of this page shows all three.</p>
<h3>Related pages</h3>
<p>Under each page, "Related pages" lists the three pages closest to it. Nothing to</p>
<p>configure: <code>aiui build</code> compares the words of every page (title, <code>keywords</code>,</p>
<p>description and headings count most, then the text) and favours pages in the</p>
<p>same sidebar group. Hidden, <code>noindex</code> and <code>searchable: false</code> pages and the home</p>
<p>page are never suggested. The list is part of <code>docs-nav.json</code>, so it works on any</p>
<p>static host and offline, and each page's agent-ready <code>.md</code></p>
<p>ends with it too.</p>
<p>Pick the list for a page in its front matter, or turn it off:</p>
<p><code>related: false</code> shows none on that page. Site-wide, <code>content.docs.related: 5</code></p>
<p>shows five (at most 10) and <code>content.docs.related: false</code> only the lists pages</p>
<p>set themselves. <code>aiui validate</code> reports a target that is no page (7013). The</p>
<p>block is left out when the page prints.</p>
<h3>Page feedback</h3>
<p>Nothing to configure: under <code>aiui serve</code> and <code>aiui dev</code> every docs page asks</p>
<p>"Was this page helpful?". A vote is stored at once; the reader can then add a</p>
<p>comment (up to 1,000 characters), which joins that vote. Read them with:</p>
<p>Votes are lines of <code>docs-feedback/feedback.jsonl</code> in the data directory</p>
<p>(<code>$AIUI_DATA_DIR</code>, default <code>~/.praisonaiui</code>). <code>POST /api/docs/feedback</code> takes</p>
<p>same-origin requests only (plus <code>--cors-origins</code>, <code>AIUI_ALLOWED_ORIGINS</code>),</p>
<p>checks the Host header, takes 4 KiB and 20 posts a minute per client, and</p>
<p>stops at 20 MB. Nothing is readable over HTTP; the export is the CLI.</p>
<p>Agents report through the docs MCP server's <code>submit_feedback</code> tool into the</p>
<p>same store and limits (MCP server).</p>
<p>A code flag is a <code>-1</code> vote with <code>kind: "code"</code> and <code>block</code>, the block's index</p>
<p>on the page, plus an optional comment. <code>aiui serve</code> and <code>aiui dev</code> say in the</p>
<p><code>ui-config.json</code> they serve where they keep votes (<code>docsFeedback.url</code>); a</p>
<p>static host (GitHub Pages, any CDN) serves the built file, which has no such</p>
<p>entry, so with no <code>endpoint</code> the page sends no request at all and the</p>
<p>question is shown only if <code>issues</code> is set.</p>
<p><code>endpoint</code> receives the vote as JSON, sent as <code>text/plain</code> when it is on</p>
<p>another origin so the browser makes no preflight request: `{"id", "path",</p>
<p>"value", "kind", "block", "comment"}`. A comment arrives as a second post with</p>
<p>the same <code>id</code>. Every vote, wherever it goes, also fires a browser event your</p>
<p>own script can send to analytics:</p>
<h3>Load telemetry</h3>
<p>Off by default. Every docs page records how each of its requests went</p>
<p>(<code>aiui:docs-load</code> records: retries, time-outs, failures, timings). Turn on</p>
<p>telemetry and the page also sends the ones that went wrong, plus a sample of</p>
<p>the good timings, home, so a reader's stalled page shows up without anyone</p>
<p>watching that tab:</p>
<p>Read what <code>aiui serve</code> stored with:</p>
<p>What is sent: the requested file, its kind (<code>doc</code> or <code>manifest</code>), the</p>
<p>attempt, the time it took, the outcome and reason, the HTTP status and the</p>
<p>page path. Query strings and fragments are dropped. No user or session id and</p>
<p>no user agent is sent, and the server stores no IP address or header. The</p>
<p>page collects records while it is open and sends them in batches of up to 50</p>
<p>with <code>navigator.sendBeacon</code> when it is hidden or left, so nothing is sent</p>
<p>while it loads. A post is JSON sent as <code>text/plain</code> (no preflight on another</p>
<p>origin): `{"v": 1, "records": [{"url", "kind", "attempt", "of", "ms",</p>
<p>"outcome", "reason", "status", "page", "sampled"}]}`.</p>
<p>With <code>telemetry: true</code> only <code>aiui serve</code> and <code>aiui dev</code> receive records: they</p>
<p>name <code>/api/docs/telemetry</code> in the <code>ui-config.json</code> they serve</p>
<p>(<code>docsTelemetry.url</code>). A static host serves the built file, which has no such</p>
<p>entry, so the page sends nothing and asks nothing. The endpoint takes</p>
<p>same-origin requests (plus <code>--cors-origins</code>, <code>AIUI_ALLOWED_ORIGINS</code>), checks</p>
<p>the Host header, takes 16 KiB and 30 posts a minute per client, and stops at</p>
<p>20 MB; on a site with sign-in it needs a signed-in reader.</p>
<p>Records are lines of <code>docs-telemetry/telemetry.jsonl</code> in the data directory</p>
<p>(<code>$AIUI_DATA_DIR</code>, default <code>~/.praisonaiui</code>). The pre-QA dashboard</p>
<p>(<code>tools/preqa</code>) shows them when that file exists.</p>
<h2>What the build publishes for assistants</h2>
<p>| File | What it holds |</p>
<p>|---|---|</p>
<p>| <code>/llms.txt</code> | every page with its description, by nav group (<a href="https://llmstxt.org">llmstxt.org</a>) |</p>
<p>| <code>/llms-full.txt</code> | every page's agent-ready Markdown in one file |</p>
<p>| <code>/docs/&lt;page&gt;.md</code> | one page's agent-ready Markdown (AI-ready docs) |</p>
<p>| <code>/docs/&lt;page&gt;.source.md</code> | the page source the site renders |</p>
<p>| <code>/search-index.json</code> | headings and text per page, for the site's own search |</p>
<p>| <code>/search-index/</code> | the same index in parts, fetched as a query needs them (Search) |</p>
<p>| <code>/sitemap.xml</code>, <code>/robots.txt</code> | for search engines |</p>
<p>Each page's HTML also carries that page's source (a JSON script,</p>
<p><code>id="aiui-initial-doc"</code>), so the first visit renders without a second request</p>
<p>for it. Pages over 200 KB of Markdown are fetched as before. It also carries</p>
<p><code>docs-nav.json</code> and <code>route-manifest.json</code> (<code>id="aiui-boot-data"</code>, each up to</p>
<p>100 KB; not the navigation of a site with sign-in) and preloads</p>
<p><code>ui-config.json</code>; see</p>
<p>Deploy to GitHub Pages → How pages load.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/writing-docs.source.md", "text": "---\ntitle: Writing docs pages\nnav_title: Writing pages\ndescription: Every block a docs page can use, with its Markdown and a live example, and the look the site draws them in.\n---\n\n# Writing docs pages\n\nA docs site is a folder of Markdown and one YAML file. This page lists every\nblock a page can use: the Markdown you write, then the block as this site\ndraws it. Pages that `aiui build` publishes also exist as plain Markdown\n(`/docs/\u003cpage\u003e.md`, components converted) and in `llms.txt`, so assistants\nread the same content ([AI-ready docs](ai-ready-docs.md)).\n\n## The look\n\n`site.theme.preset` picks the colours. `paper` is the look of this site: warm\npaper, a navy accent, serif titles, 17px text on a 1.7 line height and a\nmeasure of about 75 characters. `mode: system` follows the reader's OS.\n\n```yaml\nsite:\n  theme:\n    preset: \"paper\"\n    mode: \"system\"\n```\n\nThe other presets and what each changes are in [Theming](theming.md).\n\n## Front matter\n\nYAML at the top of a page sets its title in the sidebar, the browser tab and\nsearch results, and its description for search engines and `llms.txt`. Every\nkey is optional, and the common MDX page metadata keys work as they are.\n\n```markdown\n---\ntitle: Writing docs pages\nsidebarTitle: Writing pages\ndescription: Every block a docs page can use.\nicon: book-open\ntag: NEW\n---\n```\n\n| Key | Type | What it does |\n|---|---|---|\n| `title` | string | The page title: the `#` heading when the body has none, the browser tab, search, `llms.txt`. Default: the first `#` heading, else the file name. |\n| `description` | string | Shown under the title (unless the first paragraph already says it), and the meta description, `llms.txt` and search snippet. Default: the first paragraph, for those but not shown again. |\n| `sidebarTitle` (or `nav_title`) | string | A shorter label in the sidebar. |\n| `icon` | string | Before the sidebar label: a lucide name (`rocket`, `terminal`, `book-open`, …), an emoji, or an image URL (`https://…` or `/icons/x.svg`). |\n| `tag` | string | A badge after the sidebar label, such as `NEW` or `BETA`. |\n| `deprecated` | `true`/`false` | `true`: a `Deprecated` badge, the label struck through, and a notice above the page. |\n| `mode` | string | `wide`: no \"On this page\", a wider column. `center`: no sidebar either. `custom`: only the article, full width (no breadcrumb, footer or pager). `frame`: `custom` with the sidebar. `assistant`: the page's text, then [Ask AI](ai-ready-docs.md#ask-ai) under it. |\n| `url` | string | An `https://` URL makes the page a sidebar link that opens that site in a new tab. The page itself is not published (no route, sitemap, `llms.txt` or search entry). |\n| `hideFooterPagination` | `true`/`false` | `true`: no previous / next links under the page. |\n| `noAnchor` | `true`/`false` | `true`: no copy-link icon on the page's headings. |\n| `order` | number | Position inside its folder (default: a number prefix such as `01-`). |\n| `hidden` | `true`/`false` | Routable, but not in the sidebar, pager or indexes ([Navigation](navigation.md)). |\n| `noindex` | `true`/`false` | Tells search engines not to index the page (and leaves it out of the sitemap). |\n| `searchable` | `true`/`false` | `false` leaves the page out of the site's own search. |\n| `keywords` | list of words, or one comma-separated string | Extra search terms, matched but never shown; also the `keywords` meta tag and JSON-LD. |\n| `canonical` | string | The page's canonical URL (and `og:url`), for a page whose original lives elsewhere. |\n| `robots` | string | The robots meta, such as `noindex, nofollow`; a value with `noindex` also leaves the page out of the sitemap, `llms.txt` and search. |\n| `og:*`, `twitter:*`, `article:*` | string | That head tag for this page (quote the key: `'og:image': /images/card.png`); see [SEO](seo.md#page-level-overrides). |\n| `boost` | number | Search ranking weight (`2` ranks the page higher). |\n| `openapi` | string | `\"GET /users\"`, `\"spec.yaml POST /users\"` or `\"webhook name\"`: the page shows that operation, its endpoint bar, Try it, fields and examples around your text ([OpenAPI](openapi.md#endpoints-on-your-own-pages)). |\n| `api` | string | `\"POST /v1/users\"`: an endpoint page without a spec, Try it from the page's `\u003cParamField\u003e`s ([OpenAPI](openapi.md#pages-without-a-spec)). |\n| `playground` | string | `interactive`, `simple`, `none` or `auth`: the Try-it display of an `openapi:` or `api:` page; site-wide: `api.playground.display` ([OpenAPI](openapi.md#try-it)). |\n| `timestamp` | `true`/`false` | Turns the \"Last updated\" date off or on for this page (see [Page footer](#page-footer)). |\n| `lastUpdatedDate` | date (`2026-05-01`) | The \"Last updated\" date, instead of the last commit's. |\n| `related` | list of pages or URLs, or `false` | The \"Related pages\" under this page, instead of the suggested ones; `false` shows none ([Related pages](#related-pages)). |\n| `pageActions` | list of page actions, or `false` | This page's page actions menu, in order, instead of the site's; `false` shows none ([Page actions](#page-actions)). |\n| `rss` | `true`/`false` | `true` on a changelog page: the build writes its `\u003cUpdate\u003e` entries as an RSS feed at `\u003cpage\u003e/rss.xml` and links it ([Changelog](#changelog)). |\n| `public` | `true`/`false` | On a site with [sign-in](docs-auth.md): `true` opens the page to everyone, `false` keeps it behind sign-in when a `public` pattern would open it. |\n| `groups` | list of group names, or one name | On a site with [sign-in](docs-auth.md): only readers in one of these groups can read the page; to everyone else it does not exist. |\n| `layout`, `hero`, `features` | | The docs home page ([Home page layout](content-sources.md#home-page-layout)). |\n| any other key | string, number or `true`/`false` | Custom data, such as `product: cloud`: a `data-fm-product=\"cloud\"` attribute on the article (for CSS) and `meta` in the `aiui:content-loaded` event (for custom JS). |\n\nThe front matter never shows on the page as text.\n\n`aiui validate` checks these types and reports the line of a wrong one\n(`hidden: \"yes\"` is a string, so the page would stay in the sidebar), front\nmatter that is not valid YAML, images without alt text, two files that publish\nthe same page, two sidebar entries with the same title in one folder, headings\nthat skip a level, empty pages and a `theme.accent` with too little contrast.\nEach finding names `file:line` and how to fix it; `--strict` makes them errors\nfor CI. See the [codes](../api/cli.md#aiui-validate).\n\n```js\n// custom JS (site.customJs, aiui.set_custom_js): read a page's custom keys\nwindow.addEventListener('aiui:content-loaded', (e) =\u003e {\n    if (e.detail.meta.product === 'cloud') document.body.dataset.product = 'cloud'\n})\n```\n\nA nav group can also list a link among its pages:\n\n```yaml\nnavigation:\n  tabs:\n    - tab: Docs\n      groups:\n        - group: Resources\n          pages:\n            - guides/install\n            - { label: GitHub, href: \"https://github.com/acme/site\", icon: code }\n```\n\n## Headings and \"On this page\"\n\n`##` and `###` headings build the \"On this page\" list beside the article\n(above it on narrow screens), which follows the reader as they scroll. Every\nheading gets an id from its text, so `writing-docs#callouts` links straight to\na section, and a link with a section opens the page scrolled to it. Hover a\nheading (on a phone, look beside it) for its link icon: one click puts the\nsection in the address bar and copies its URL. Keep one `#` title per page; the paragraph right under it is the\nlede and reads larger.\n\nTo pin an anchor that survives a reworded title, end the heading with `{#id}`:\n`## Install the CLI {#install}` links as `#install`, the search index uses the\nsame id, and the braces never show.\n\n## Callouts\n\nUse a callout for what a reader must not miss. Each tag sets the colour and\nthe icon: `\u003cNote\u003e` and `\u003cInfo\u003e` (blue), `\u003cTip\u003e` and `\u003cCheck\u003e` (green),\n`\u003cWarning\u003e` (amber), `\u003cDanger\u003e` (red). A `title` is optional. A tag can sit on\nlines of its own or share one with its text: `\u003cNote\u003eSaved.\u003c/Note\u003e` works (see\n[Component tags](#component-tags)).\n\n```markdown\n\u003cNote title=\"Run the build first\"\u003e\n`aiui serve` serves the output of `aiui build`.\n\u003c/Note\u003e\n\n\u003cTip\u003e\n`mode: system` follows the reader's light or dark setting.\n\u003c/Tip\u003e\n\n\u003cCheck\u003e\nThe site rebuilt without warnings.\n\u003c/Check\u003e\n\n\u003cWarning title=\"Pinned versions\"\u003e\nPlugins built for SDK 1 keep working; check `aiui plugins doctor` after an upgrade.\n\u003c/Warning\u003e\n\n\u003cDanger\u003e\nNever put an API key in `aiui.yaml`; it ships with the site.\n\u003c/Danger\u003e\n```\n\n\u003cNote title=\"Run the build first\"\u003e\n`aiui serve` serves the output of `aiui build`.\n\u003c/Note\u003e\n\n\u003cTip\u003e\n`mode: system` follows the reader's light or dark setting.\n\u003c/Tip\u003e\n\n\u003cCheck\u003e\nThe site rebuilt without warnings.\n\u003c/Check\u003e\n\n\u003cWarning title=\"Pinned versions\"\u003e\nPlugins built for SDK 1 keep working; check `aiui plugins doctor` after an upgrade.\n\u003c/Warning\u003e\n\n\u003cDanger\u003e\nNever put an API key in `aiui.yaml`; it ships with the site.\n\u003c/Danger\u003e\n\nPages written for MkDocs keep working: `!!! note \"Title\"` with an indented\nbody draws the same callout (`note`, `info`, `tip`, `success`, `warning`,\n`danger` and the other MkDocs types).\n\n## Steps\n\nFor a procedure the reader follows in order. Each step gets a number on a\nrail; its body is ordinary Markdown, code blocks included.\n\n````markdown\n\u003cSteps\u003e\n\u003cStep title=\"Install\"\u003e\n```bash\npip install aiui\n```\n\u003c/Step\u003e\n\u003cStep title=\"Write app.py\"\u003e\nReply to every message with `@aiui.reply`.\n\u003c/Step\u003e\n\u003cStep title=\"Run it\"\u003e\n`aiui run app.py`, then open the address it prints.\n\u003c/Step\u003e\n\u003c/Steps\u003e\n````\n\n\u003cSteps\u003e\n\u003cStep title=\"Install\"\u003e\n```bash\npip install aiui\n```\n\u003c/Step\u003e\n\u003cStep title=\"Write app.py\"\u003e\nReply to every message with `@aiui.reply`.\n\u003c/Step\u003e\n\u003cStep title=\"Run it\"\u003e\n`aiui run app.py`, then open the address it prints.\n\u003c/Step\u003e\n\u003c/Steps\u003e\n\nOptions: `titleSize=\"h2\"` (or `h3`, `h4`) on `\u003cSteps\u003e` or one `\u003cStep\u003e` makes\nthe titles real headings, so they appear in \"On this page\" and get a link;\n`stepNumber={n}` restarts the count at `n`; `icon=\"terminal\"` draws an icon\nin the circle instead of the number; `id=\"…\"` names the step for a link.\n\n```markdown\n\u003cSteps titleSize=\"h3\"\u003e\n\u003cStep title=\"Install the package\" icon=\"terminal\"\u003e\n`pip install aiui`\n\u003c/Step\u003e\n\u003cStep title=\"Start the server\" stepNumber={3}\u003e\n`aiui run app.py`\n\u003c/Step\u003e\n\u003c/Steps\u003e\n```\n\n\u003cSteps titleSize=\"h3\"\u003e\n\u003cStep title=\"Install the package\" icon=\"terminal\"\u003e\n`pip install aiui`\n\u003c/Step\u003e\n\u003cStep title=\"Start the server\" stepNumber={3}\u003e\n`aiui run app.py`\n\u003c/Step\u003e\n\u003c/Steps\u003e\n\n## Accordions\n\n`\u003cAccordion\u003e` hides detail the reader opens on demand: long output, edge\ncases, FAQs. `defaultOpen` starts it open. Wrap several in `\u003cAccordionGroup\u003e`\nto stack them as one list.\n\n```markdown\n\u003cAccordionGroup\u003e\n\u003cAccordion title=\"Why does the site show the old page after a deploy?\"\u003e\nThe entry files keep fixed names; `aiui build` adds a content hash to their\nURLs, so a hard refresh is never needed.\n\u003c/Accordion\u003e\n\u003cAccordion title=\"Can I host the site on GitHub Pages?\" defaultOpen\u003e\nYes. See [Deploy to GitHub Pages](../getting-started/github-pages.md).\n\u003c/Accordion\u003e\n\u003c/AccordionGroup\u003e\n```\n\n\u003cAccordionGroup\u003e\n\u003cAccordion title=\"Why does the site show the old page after a deploy?\"\u003e\nThe entry files keep fixed names; `aiui build` adds a content hash to their\nURLs, so a hard refresh is never needed.\n\u003c/Accordion\u003e\n\u003cAccordion title=\"Can I host the site on GitHub Pages?\" defaultOpen\u003e\nYes. See [Deploy to GitHub Pages](../getting-started/github-pages.md).\n\u003c/Accordion\u003e\n\u003c/AccordionGroup\u003e\n\n`description=\"…\"` adds a line under the title, `icon=\"code\"` an icon before\nit, and `id=\"…\"` an anchor: `writing-docs#accordion-faq` opens the page with\nthat accordion open. A link to a heading inside a closed accordion opens it\ntoo.\n\n```markdown\n\u003cAccordion title=\"How do I link to an answer?\" description=\"Give it an id\" icon=\"code\" id=\"accordion-faq\"\u003e\nLink to `#accordion-faq`; the accordion opens and scrolls into view.\n\u003c/Accordion\u003e\n```\n\n\u003cAccordion title=\"How do I link to an answer?\" description=\"Give it an id\" icon=\"code\" id=\"accordion-faq\"\u003e\nLink to `#accordion-faq`; the accordion opens and scrolls into view.\n\u003c/Accordion\u003e\n\nIn MkDocs syntax, `???` makes any callout a disclosure and `???+` starts it\nopen.\n\n## Tabs\n\n`\u003cTabs\u003e` with one `\u003cTab title=\"…\"\u003e` per choice: the same task in different\ntools, languages or operating systems. Arrow keys move between tabs.\n\n```markdown\n\u003cTabs\u003e\n\u003cTab title=\"macOS and Linux\"\u003e\nRun `export OPENAI_API_KEY=sk-...` before `aiui run`.\n\u003c/Tab\u003e\n\u003cTab title=\"Windows\"\u003e\nRun `setx OPENAI_API_KEY sk-...`, then open a new terminal.\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n\u003cTabs\u003e\n\u003cTab title=\"macOS and Linux\"\u003e\nRun `export OPENAI_API_KEY=sk-...` before `aiui run`.\n\u003c/Tab\u003e\n\u003cTab title=\"Windows\"\u003e\nRun `setx OPENAI_API_KEY sk-...`, then open a new terminal.\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n\nTabs sync by title: pick \"Windows\" once and every set of tabs on the page\nwith a \"Windows\" tab shows it, code groups included. The pick is remembered,\nso the next page opens on it as well, and \"On this page\" lists only the\nheadings of the tabs shown. That covers a page-wide language or platform\nswitcher: use the same tab titles in each set. Options:\n\n| Option | What it does |\n|---|---|\n| `sync={false}` on `\u003cTabs\u003e` | This set keeps its own selection. |\n| `defaultTabIndex={1}` on `\u003cTabs\u003e` | The tab shown first (counted from 0) until the reader picks one. |\n| `borderBottom` on `\u003cTabs\u003e` | A rule under the tab content, to set it apart from the text below. |\n| `icon=\"terminal\"` on `\u003cTab\u003e` | An icon before the title. |\n| `id=\"…\"` on `\u003cTab\u003e` | An anchor: `#windows-setup` in the URL opens that tab. |\n\n```markdown\n\u003cTabs defaultTabIndex={1} borderBottom\u003e\n\u003cTab title=\"macOS and Linux\"\u003e\n`export OPENAI_API_KEY=sk-...`\n\u003c/Tab\u003e\n\u003cTab title=\"Windows\" icon=\"terminal\" id=\"windows-setup\"\u003e\n`setx OPENAI_API_KEY sk-...`\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n```\n\n\u003cTabs defaultTabIndex={1} borderBottom\u003e\n\u003cTab title=\"macOS and Linux\"\u003e\n`export OPENAI_API_KEY=sk-...`\n\u003c/Tab\u003e\n\u003cTab title=\"Windows\" icon=\"terminal\" id=\"windows-setup\"\u003e\n`setx OPENAI_API_KEY sk-...`\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n\nTabs that each hold one code block draw as a code group (below). The MkDocs\nform, consecutive `=== \"Label\"` blocks with indented bodies, works too.\n\n## Code blocks\n\nFence code with its language for highlighting and a copy button. 74\nlanguages are highlighted, each grammar loaded only when a page uses it; the\nrest show as plain text unless the site adds its own grammar\n([code theme and languages](theming.md#code-blocks)). Comments are drawn in a\ncolour that keeps 4.5:1 contrast on the code background, light and dark.\n\nHighlighted: apache, astro, awk, bash, bat, bicep, c, clojure, cmake, cpp,\ncsharp, css, csv, dart, diff, docker, dotenv, elixir, elm, fish, fsharp,\ngleam, glsl, go, graphql, groovy, handlebars, haskell, hcl, html, http, ini,\njava, javascript, jinja, json, jsonl, jsx, julia, kotlin, lua, make, markdown,\nmatlab, nginx, nix, objective-c, perl, php, powershell, prisma, proto,\npython, r, regexp, ruby, rust, sass, scala, scss, solidity, sql, svelte,\nswift, terraform, toml, tsx, typescript, vb, vue, wgsl, xml, yaml and zig,\nwith their common short names (`sh`, `js`, `ts`, `py`, `yml`, `tf`, `ps1`,\n`makefile`, `objc`, `protobuf`, `hs`, `ex` and more).\n\n````markdown\n```python\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}\")\n```\n````\n\n### File names and highlighted lines\n\nAfter the language, name the file with `title=\"…\"` (or just the name) and\npick lines to highlight with `{…}`: single lines and ranges, separated by\ncommas.\n\n````markdown\n```python title=\"app.py\" {3-4}\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}\")\n```\n````\n\n```python title=\"app.py\" {3-4}\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}\")\n```\n\nWithout `title=`, every word after the language up to the first option is\nthe title: `python Reply handler {3-4}` shows \"Reply handler\".\n`highlight={3-4}`, `hl_lines=\"3 4\"` and `highlight=\"3-4\"` work too, so fences\nwritten for MkDocs or in MDX syntax carry over.\n\n### Code block options\n\nOptions go after the language, in any order, alone or together:\n\n| Option | What it does |\n|---|---|\n| `lines` | Line numbers in a gutter (the copy button copies the code only). |\n| `wrap` | Long lines wrap instead of scrolling sideways. |\n| `expandable` | A block over 12 lines shows 12 and a \"Show all N lines\" button. |\n| `nocopy` | No copy button. |\n| `icon=\"terminal\"` | An icon before the title (`terminal`, `code`, `rocket`, …; other names show the code icon). |\n| `highlight={1-2,5}` | Highlighted lines; `{1-2,5}` alone does the same. |\n| `focus={2,4-5}` | These lines stay sharp, the rest dim until the reader points at the block. |\n\nA flag is never taken for a title, and `twoslash` is accepted and ignored.\n\n````markdown\n```python Reply handler lines wrap icon=\"code\" focus={3-4}\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}, and this line is long enough to wrap on a phone\")\n```\n````\n\n```python Reply handler lines wrap icon=\"code\" focus={3-4}\nimport praisonaiui as aiui\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}, and this line is long enough to wrap on a phone\")\n```\n\n### Diffs and notation comments\n\nEnd a line with a `[!code …]` comment in the language's own comment syntax\n(`//`, `#`, `--`, `\u003c!-- --\u003e`) to mark it: `++` added, `--` removed,\n`highlight` and `focus`. `:N` marks that line and the next N-1; a comment on a\nline of its own marks the lines after it. The comments never show, and the\ncopy button copies the code without them.\n\n````markdown\n```python\nport = 3000  # [!code --]\nport = 8080  # [!code ++]\nserve(port)  # [!code highlight]\n```\n````\n\n```python\nport = 3000  # [!code --]\nport = 8080  # [!code ++]\nserve(port)  # [!code highlight]\n```\n\n### The CodeBlock component\n\n`\u003cCodeBlock\u003e` takes the same options as attributes (`language`, `filename`,\n`icon`, `lines`, `wrap`,
