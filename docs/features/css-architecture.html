<p>A beginner-friendly guide to how PraisonAIUI creates its visual appearance — what controls the colors, fonts, and layout you see on screen.</p>
<h2>The Big Picture</h2>
<p>PraisonAIUI's appearance comes from <strong>three layers</strong> working together:</p>
<p><strong>In plain English:</strong></p>
<p>1. You choose a theme preset (like "zinc" or "blue") in your config</p>
<p>2. The system translates that into CSS variables (color codes)</p>
<p>3. Every button, text, and background reads those variables to know what color to be</p>
<h2>Configuring from YAML</h2>
<h3>Theme</h3>
<h3>Custom CSS</h3>
<p>---</p>
<h2>What You Can Control</h2>
<h3>Theme Presets</h3>
<p>The preset sets your <strong>color palette</strong> — it changes the accent color used for buttons, active states, and highlights across the entire UI.</p>
<p>| Category | Options |</p>
<p>|----------|---------|</p>
<p>| <strong>Neutral</strong> | zinc (default), slate, stone, gray, neutral |</p>
<p>| <strong>Warm</strong> | red, orange, amber, yellow |</p>
<p>| <strong>Cool</strong> | blue, indigo, violet, purple, cyan, sky, teal |</p>
<p>| <strong>Nature</strong> | green, emerald, lime |</p>
<p>| <strong>Vibrant</strong> | pink, rose, fuchsia |</p>
<h3>Dark Mode</h3>
<p>When light mode is on, all backgrounds flip to white/light gray and text becomes dark.</p>
<h3>Border Radius</h3>
<p>| Value | Effect |</p>
<p>|-------|--------|</p>
<p>| <code>none</code> | Sharp, square corners |</p>
<p>| <code>sm</code> | Slightly rounded |</p>
<p>| <code>md</code> | Medium rounded (default) |</p>
<p>| <code>lg</code> | More rounded |</p>
<p>| <code>xl</code> | Very rounded, pill-shaped buttons |</p>
<h3>Dashboard CSS Variables</h3>
<p>For fine-grained control, override these variables in <code>customCss</code>:</p>
<p>| Variable | Default (dark) | What It Controls |</p>
<p>|----------|---------------|-----------------|</p>
<p>| <code>--db-bg</code> | <code>#0a0a0f</code> | Page background |</p>
<p>| <code>--db-sidebar-bg</code> | <code>#111118</code> | Sidebar background |</p>
<p>| <code>--db-accent</code> | <code>#6366f1</code> | Buttons, active items, highlights |</p>
<p>| <code>--db-text</code> | <code>#e4e4e7</code> | Primary text |</p>
<p>| <code>--db-text-dim</code> | <code>#71717a</code> | Secondary/muted text |</p>
<p>| <code>--db-border</code> | <code>rgba(255,255,255,0.06)</code> | Borders and dividers |</p>
<p>| <code>--db-card-bg</code> | <code>rgba(255,255,255,0.03)</code> | Card backgrounds |</p>
<p>| <code>--db-radius</code> | <code>10px</code> | Corner roundness |</p>
<p>---</p>
<h2>Priority Order</h2>
<p>When the same setting is defined in multiple places:</p>
<p>| Priority | Source | Example |</p>
<p>|----------|--------|---------|</p>
<p>| 1 (highest) | <strong>CLI flag</strong> | <code>--style chat</code> |</p>
<p>| 2 | <strong>Python API</strong> | <code>aiui.set_theme(preset="blue")</code> |</p>
<p>| 3 | <strong>YAML config</strong> | <code>site.theme.preset: blue</code> |</p>
<p>| 4 (lowest) | <strong>Built-in defaults</strong> | zinc, dark, md radius |</p>
<p>---</p>
<h2>Two Chat Systems Explained</h2>
<p>PraisonAIUI includes <strong>two different chat interfaces</strong>. Understanding the difference helps you choose the right one and know what features to expect.</p>
<h3>React Chat — The Full-Featured Chat</h3>
<p><strong>When it's active:</strong> <code>style: chat</code>, <code>style: agents</code>, or <code>style: playground</code></p>
<p>This is the <strong>recommended chat</strong> for most users. It's built with React and benefits from the full modern web stack.</p>
<p><strong>What you get:</strong></p>
<p>| Feature | How it works |</p>
<p>|---------|-------------|</p>
<p>| 🎨 <strong>Your theme colors</strong> | Automatically follows your <code>preset</code> and <code>darkMode</code> settings |</p>
<p>| 📋 <strong>Copy code button</strong> | Click to copy any code block — shows "✓ Copied" feedback |</p>
<p>| 🌈 <strong>Syntax highlighting</strong> | Code is color-coded by language (Python, JavaScript, etc.) |</p>
<p>| 📊 <strong>Markdown tables</strong> | Tables render as proper formatted tables |</p>
<p>| 🔤 <strong>Rich typography</strong> | Headers, bold, italic, lists — all beautifully styled |</p>
<p>| 📎 <strong>File attachments</strong> | Upload files to include as context |</p>
<h3>Dashboard Chat — The Admin Chat</h3>
<p><strong>When it's active:</strong> <code>style: dashboard</code></p>
<p>This is a lighter chat built as a dashboard plugin. It's designed for quick admin interactions within the dashboard.</p>
<p><strong>What you get:</strong></p>
<p>| Feature | How it works |</p>
<p>|---------|-------------|</p>
<p>| 🎨 <strong>Dashboard theme</strong> | Uses the dashboard's color scheme (now follows your preset!) |</p>
<p>| 💬 <strong>Basic markdown</strong> | Bold, italic, headings, code blocks, links, lists |</p>
<p>| 🔧 <strong>Tool call display</strong> | Shows when the AI is using tools |</p>
<p>| 📋 <strong>Session management</strong> | Create, switch, and manage conversations |</p>
<p>| 🤖 <strong>Agent selection</strong> | Pick which AI agent to chat with |</p>
<p><strong>What it doesn't have (yet):</strong></p>
<li>❌ Copy button on code blocks</li>
<li>❌ Syntax highlighting (code blocks are plain text)</li>
<li>❌ Markdown tables</li>
<h3>Which Should I Use?</h3>
<p>| If you want... | Use this style |</p>
<p>|----------------|---------------|</p>
<p>| Best chat experience with all features | <code>style: chat</code> |</p>
<p>| Multi-agent dashboard with admin controls | <code>style: dashboard</code> |</p>
<p>| Agent profiles and switching | <code>style: agents</code> |</p>
<p>| Side-by-side prompt testing | <code>style: playground</code> |</p>
<p>---</p>
<h2>File Map</h2>
<p>Where does each piece of styling live?</p>
<p>| File | What It Does |</p>
<p>|------|-------------|</p>
<p>| <code>src/frontend/src/index.css</code> | Main CSS — imports Tailwind, defines default color variables |</p>
<p>| <code>src/frontend/src/themes.ts</code> | Theme engine — translates preset names to CSS variable values |</p>
<p>| <code>src/frontend/src/chat/ChatMessages.tsx</code> | React chat — has copy buttons, syntax highlighting |</p>
<p>| <code>templates/frontend/plugins/views/chat.js</code> | Dashboard chat — basic markdown, dashboard theme |</p>
<p>| <code>templates/frontend/plugins/dashboard.js</code> | Dashboard — defines <code>--db-*</code> color variables + reads config |</p>
