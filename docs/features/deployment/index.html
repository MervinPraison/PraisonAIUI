<h2>Environment Variables</h2>
<p>| Variable | Default | Description |</p>
<p>|----------|---------|-------------|</p>
<p>| <code>AIUI_DATA_DIR</code> | <code>~/.praisonaiui</code> | Data directory for config, sessions, logs, and feature data (see below) |</p>

<p>| <code>AIUI_ALLOWED_ORIGINS</code> | — | Comma-separated origins allowed to call the server from another site (CORS and cross-site requests); <code>*</code> allows any |</p>
<p>| <code>AIUI_ALLOWED_HOSTS</code> | — | Comma-separated host names the server answers to when reached on a loopback or private address (<code>.example.com</code> also matches subdomains); <code>*</code> turns the check off |</p>
<p>| <code>AIUI_KNOWLEDGE_ROOTS</code> | — | Folders (<code>os.pathsep</code>-separated) that <code>POST /api/knowledge/add-file</code> may read, in addition to the chat attachments folder; any other <code>file_path</code> is refused with 400 |</p>
<p>| <code>AIUI_MAX_BODY_MB</code> | <code>25</code> | Largest request body in MiB; a bigger one gets 413 before it is read. <code>0</code> turns this cap off. Paths that need no credentials (login, sign-up, protocol negotiation) always take at most 64 KiB |</p>
<p>| <code>AIUI_PUBLIC_STATIC_DIR</code> | — | <code>1</code> serves every file in a <code>static_dir</code> without credentials (see Auth Enforcement); by default only code, styles, fonts, images and the HTML shell are public |</p>
<p>| <code>OPENAI_API_KEY</code> | — | OpenAI API key for LLM provider |</p>
<h3>Feature data and the data directory</h3>
<p>When <code>AIUI_DATA_DIR</code> or <code>PRAISONAI_HOME</code> is set (<code>PRAISONAI_HOME</code> wins when both are),</p>
<p>feature data lives under that directory, so two servers with different data</p>
<p>directories never see each other's data:</p>
<p>| Data | With a data directory | Without one (default install) | Explicit override |</p>
<p>|------|-----------------------|-------------------------------|-------------------|</p>
<p>| Recorded runs (Overview, Replay, Runs) | <code>&lt;data dir&gt;/traces</code> | <code>~/.praison/traces</code> | <code>PRAISONAI_TRACES_DIR</code>, then <code>PRAISON_HOME/traces</code> |</p>
<p>| Memory | <code>&lt;data dir&gt;/memory</code> | <code>~/.praisonai/memory</code> and <code>./.praisonai/memory</code> | — |</p>
<p>| Knowledge store | <code>&lt;data dir&gt;/knowledge</code> | <code>./.praisonai</code> | — |</p>
<p>| Training sessions | <code>&lt;data dir&gt;/train</code> | <code>~/.praison/train</code> | <code>PRAISON_TRAIN_DIR</code> |</p>
<p>| MCP server list | <code>&lt;data dir&gt;/mcp.json</code> | <code>~/.praisonai/mcp.json</code> | — |</p>
<p>| Video projects | <code>&lt;data dir&gt;/projects</code> | <code>~/.praisonai/projects</code> | <code>PRAISONAI_PROJECTS_DIR</code>, <code>set_video_engine(projects_dir=)</code> |</p>
<p>Setting <code>AIUI_DATA_DIR</code> to its default, <code>~/.praisonaiui</code>, counts as not set.</p>
<p>The PraisonAI CLI always records runs to <code>~/.praison/traces</code>. A server with a data</p>
<p>directory does not show those runs unless you also set</p>
<p><code>PRAISONAI_TRACES_DIR=~/.praison/traces</code>.</p>
<h3>Auth Enforcement</h3>
<p>When <code>AUTH_ENFORCE=true</code>, every route requires a valid Bearer token in the <code>Authorization</code> header: <code>/api/*</code>, and also <code>/sessions</code>, <code>/run</code>, <code>/cancel</code>, <code>/agents/{id}/runs</code>, <code>/teams/*</code>, <code>/v1/*</code> (OpenAI-compatible), <code>/agui</code> and any route a plugin adds. Only the public surface answers without one (deny by default):</p>
<p><strong>Public paths</strong> (always accessible without auth):</p>
<li><code>/health</code>, <code>/health/live</code>, <code>/health/ready</code>, <code>/api/health</code> — health checks</li>
<li><code>/api/auth/login</code>, <code>/login</code> — login endpoints</li>
<li><code>/api/protocol</code>, <code>/api/protocol/negotiate</code> — protocol discovery</li>
<li>the HTML page for a browser navigation (<code>/</code>, <code>/chat</code>, …; under <code>style: app</code></li>
<p><code>/sessions</code> and <code>/agents</code> too, but only as the page, never their JSON)</p>
<li>static code: <code>/assets/*</code>, <code>/plugins/*</code>, <code>/_aiui/externals/*</code>, <code>/_plugins/*</code>,</li>
<p><code>/icon.svg</code>, <code>/manifest.json</code>, <code>/sw.js</code>, <code>/custom.js</code>, <code>/ui-config.json</code></p>
<li>OAuth sign-in: <code>GET /api/auth/oauth/{provider}</code> and its <code>/callback</code> (they</li>
<p>only redirect)</p>
<p><strong>A <code>static_dir</code> folder</strong> (<code>create_app(static_dir=...)</code>, <code>aiui run --config</code>)</p>
<p>is not public as a whole. Its code, styles, fonts and images</p>
<p>(<code>.js .mjs .css .map .woff .woff2 .ttf .otf .eot .svg .png .jpg .jpeg .gif .webp .avif .ico</code>)</p>
<p>answer without credentials. So do its HTML pages, but under <code>AUTH_ENFORCE</code> and</p>
<p><code>require_auth</code> they are served as the app shell only: the page's inlined</p>
<p>markdown and <code>&lt;noscript&gt;</code> copy are removed. Markdown, JSON (a search index) and</p>
<p>any other file need credentials, under <code>AUTH_ENFORCE</code>, <code>require_auth</code> and</p>
<p>URL-token mode alike. The docs app sends the stored access token with every</p>
<p>request it makes (pages, manifests, search). A reader who has not signed in</p>
<p>sees the sign-in prompt, and after entering the token reads the site as on an</p>
<p>open server. Page titles and descriptions stay visible: <code>/docs-nav.json</code> lists</p>
<p>them for the sidebar. To keep the folder public in front of a private API, set</p>
<p><code>AIUI_PUBLIC_STATIC_DIR=1</code>.</p>
<p>A built docs site served by <code>aiui serve</code> takes a password, open pages and</p>
<p>reader groups from <code>content.docs.auth</code> instead (docs sign-in).</p>
<p>WebSocket handshakes are gated too (all of them). Browsers cannot send an</p>
<p><code>Authorization</code> header on a WebSocket, so the UI first exchanges its key for a</p>
<p>single-use ticket (<code>POST /api/auth/ws-ticket</code>, valid 60 s) and connects with</p>
<p><code>?ticket=</code>. Clients that cannot do that may still send <code>?token=&lt;key&gt;</code>; it is</p>
<p>redacted from the server's access log.</p>
<p>The other auth modes gate WebSockets as well: URL-token mode</p>
<p>(<code>AIUI_REQUIRE_TOKEN=1</code>) accepts its session cookie, a Bearer header, <code>?token=</code></p>
<p>or a ticket; <code>create_app(require_auth=True)</code> / YAML <code>auth.requireAuth</code> checks</p>
<p>session tokens on every route and socket except the public surface above.</p>
<h3>Self-registration under `requireAuth`</h3>
<p>A token from <code>POST /register</code> passes the <code>requireAuth</code> check, so registration is</p>
<p>closed by default. <code>POST /register</code> is accepted only:</p>
<li>for the <strong>first user</strong>: while no account exists (and no login, password,</li>
<p>header or OAuth callback is registered), the first registration creates it;</p>
<li>from a <strong>signed-in user</strong> (<code>Authorization: Bearer &lt;session token&gt;</code>), to add</li>
<p>an account;</p>
<li>for <strong>anyone</strong> when the config opts in:</li>
<p>(<code>create_app(config={"auth": {"requireAuth": True, "allowSignup": True}})</code> from</p>
<p>Python.) Otherwise it returns <code>403 {"error": "Registration is closed"}</code>.</p>
<p>Accounts live in memory, so after a restart the first-user window is open</p>
<p>again until someone registers; create the admin in your app at startup</p>
<p>(<code>praisonaiui.auth.register_user("admin", password)</code>) to close it. Under</p>
<p><code>AUTH_ENFORCE</code> and URL-token mode <code>/register</code> already needs the API key or URL</p>
<p>token, as before; with no auth mode it stays open.</p>
<h3>Sessions</h3>
<p>Signing in (<code>POST /login</code>, <code>POST /register</code>, OAuth) returns a session token in</p>
<p>the JSON body and also sets it as an httpOnly cookie. The token is signed</p>
<p>(HMAC-SHA256), not held in server memory, so a session survives a restart and</p>
<p>works on every worker that shares the secret. With no config the first sign-in</p>
<p>generates one into <code>&lt;data dir&gt;/auth_secret</code> (mode 0600, never logged). For</p>
<p>several hosts set the same secret everywhere:</p>
<p><code>export AIUI_AUTH_SECRET=$(aiui auth create-secret)</code>.</p>
<li><strong>Sliding.</strong> Under <code>requireAuth</code> the cookie signs in HTTP and WebSockets, and</li>
<p>a request past half its lifetime gets a fresh one: active users stay signed</p>
<p>in, idle ones are signed out after <code>sessionLifetime</code>. A Bearer token lasts</p>
<p><code>sessionLifetime</code> from sign-in. <code>SameSite</code> and the cross-site guard keep other</p>
<p>sites from riding the cookie.</p>
<li><strong>Sign-out.</strong> <code>POST /logout</code> revokes the Bearer token and the cookie and</li>
<p>deletes the cookie. Revoked token ids stay in <code>&lt;data dir&gt;/auth_revoked.jsonl</code></p>
<p>until they would have expired, so every worker on that data directory honours</p>
<p>them. <code>Session.clear_tokens()</code> (in <code>@aiui.on_logout</code>) signs the user out on</p>
<p>every device.</p>
<li><strong>Rotation.</strong> <code>AIUI_AUTH_SECRET=new,old</code>: the first secret signs, all verify.</li>
<p>Drop <code>old</code> after <code>sessionLifetime</code>. A single new secret (or deleting</p>
<p><code>auth_secret</code>) signs everyone out.</p>
<p>Trade-off: hosts that do not share the data directory verify sessions but do</p>
<p>not see each other's sign-outs, so a signed-out token stays valid there until</p>
<p>it expires. Keep <code>sessionLifetime</code> short in that setup, or rotate the secret.</p>
<h3>OAuth sign-in</h3>
<p>With a provider configured (<code>AIUI_OAUTH_&lt;PROVIDER&gt;_CLIENT_ID</code> and</p>
<p><code>_CLIENT_SECRET</code>), a browser starts sign-in at</p>
<p><code>/api/auth/oauth/&lt;provider&gt;?return_url=/chat</code>. Both that route and the callback</p>
<p>are public in every auth mode. <code>return_url</code> must be a path on this server</p>
<p>(starting with a single <code>/</code>). Anything else, such as an absolute URL or</p>
<p><code>//host</code>, returns to <code>/</code>. The callback sends the browser to</p>
<p><code>&lt;return_url&gt;#token=&lt;session token&gt;</code>. The token is in the URL fragment, which</p>
<p>browsers never send to a server, a log or a <code>Referer</code>. The dashboard stores it</p>
<p>and removes it from the address bar. A client that sends</p>
<p><code>Accept: application/json</code> gets <code>{"user", "token"}</code> instead. OAuth tokens are</p>
<p>session tokens, so they sign in under <code>require_auth</code> / <code>auth.requireAuth</code>.</p>

<h2>Security</h2>
<h3>Auth Modes</h3>
<p>AIUI supports multiple authentication modes:</p>
<p>| Mode | Description |</p>
<p>|------|-------------|</p>
<p>| <code>none</code> | No authentication (default) |</p>
<p>| <code>api_key</code> | API key in <code>X-API-Key</code> header or <code>api_key</code> query param |</p>
<p>| <code>session</code> | Session token in <code>Authorization: Bearer &lt;token&gt;</code> header |</p>
<p>| <code>password</code> | Username/password login |</p>
<h3>API Key Management</h3>
<h3>Cross-site requests</h3>
<p>By default the server only serves its own pages: responses carry no CORS</p>
<p>headers, and a page on another site can neither open a WebSocket to it nor</p>
<p>send it a state-changing request (<code>POST</code>/<code>PUT</code>/<code>PATCH</code>/<code>DELETE</code>, including</p>
<p><code>text/plain</code> "simple" requests that skip the CORS preflight). The check uses</p>
<p>the browser's <code>Sec-Fetch-Site</code> header, so it works behind a reverse proxy that</p>
<p>rewrites <code>Host</code>; without that header the <code>Origin</code> is compared with <code>Host</code> and</p>
<p><code>X-Forwarded-Host</code>. Requests with neither header (curl, SDK clients) are not</p>
<p>affected. A local dev server (Vite on another port) talking to a local server</p>
<p>is allowed.</p>
<p>To let another site call the server (an embedded widget, a separate frontend),</p>
<p>list its origin:</p>
<h3>Host names (DNS rebinding)</h3>
<p>A server reached on a loopback or private address (<code>127.0.0.1</code>, <code>192.168.x.x</code>,</p>
<p>a Docker bridge) only answers requests whose <code>Host</code> is an IP address,</p>
<p><code>localhost</code> / <code>*.localhost</code>, a <code>*.local</code> name, the machine's own hostname, or a</p>
<p>name listed in <code>AIUI_ALLOWED_HOSTS</code>. Anything else gets <code>400 Host not allowed</code></p>
<p>(a WebSocket is closed with code 1008). This stops DNS rebinding, where a</p>
<p>website points its own domain at <code>127.0.0.1</code> so that the browser treats it as</p>
<p>same-origin with your local server.</p>
<p>If a reverse proxy on the same machine forwards a public name to the server</p>
<p>(nginx → <code>127.0.0.1:8082</code> with <code>proxy_set_header Host $host</code>), list that name:</p>
<p>A server reached directly on a public IP address is not checked.</p>
<h3>Network Considerations</h3>
<li><strong>Internal networks</strong>: Use <code>AUTH_ENFORCE=false</code> if behind a trusted reverse proxy</li>
<li><strong>Public exposure</strong>: Always set <code>AUTH_ENFORCE=true</code> and use HTTPS</li>
<li><strong>Load balancers</strong>: Health check path is <code>/health/live</code> (fast, exempt from auth)</li>
<h2>Managed Hosting</h2>
<h3>Required Endpoints</h3>
<p>Hosting platforms should expose these endpoints:</p>
<p>| Endpoint | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>/health/live</code> | Fast liveness probe (returns <code>{"status": "ok"}</code>) |</p>
<p>| <code>/health/ready</code> | Readiness probe (parallel feature checks) |</p>
<p>| <code>/health</code> | Deep health (parallel feature checks; <code>?deep=false</code> for liveness) |</p>
<p>| <code>/api/protocol</code> | Protocol version and capabilities |</p>
<p>| <code>/api/protocol/negotiate</code> | Capability negotiation |</p>
<p>| <code>/api/features</code> | List of registered features |</p>
<h3>Protocol Discovery</h3>
<h3>Minimum Viable Deployment</h3>
<p>For a minimal AIUI deployment:</p>
<p>1. <strong>Required</strong>: <code>OPENAI_API_KEY</code> environment variable</p>
<p>2. <strong>Recommended</strong>: Persistent volume for <code>AIUI_DATA_DIR</code></p>
<p>3. <strong>Optional</strong>: <code>AUTH_ENFORCE=true</code> for multi-tenant environments</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/deployment.source.md", "text": "# Deployment Guide\n\nProduction deployment guide for AIUI — covering Docker, environment variables, configuration, and security.\n\n## Quick Start (Docker)\n\n### Build the Image\n\n```bash\ncd /path/to/PraisonAIUI\ndocker build -t aiui:latest .\n```\n\n### Run with Default Settings\n\n```bash\ndocker run -d \\\n  --name aiui \\\n  -p 8082:8082 \\\n  -e OPENAI_API_KEY=sk-... \\\n  aiui:latest\n```\n\n### Run with Custom Data Directory\n\n```bash\ndocker run -d \\\n  --name aiui \\\n  -p 8082:8082 \\\n  -v /path/to/data:/data \\\n  -e AIUI_DATA_DIR=/data \\\n  -e OPENAI_API_KEY=sk-... \\\n  aiui:latest\n```\n\n### Docker Compose Example\n\n```yaml\nversion: '3.8'\nservices:\n  aiui:\n    build: .\n    ports:\n      - \"8082:8082\"\n    environment:\n      - OPENAI_API_KEY=${OPENAI_API_KEY}\n      - AIUI_DATA_DIR=/data\n      - AUTH_ENFORCE=true\n    volumes:\n      - aiui-data:/data\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8082/health/live\"]\n      interval: 30s\n      timeout: 5s\n      retries: 3\n\nvolumes:\n  aiui-data:\n```\n\n## Environment Variables\n\n| Variable | Default | Description |\n|----------|---------|-------------|\n| `AIUI_DATA_DIR` | `~/.praisonaiui` | Data directory for config, sessions, logs, and feature data (see below) |\n| `AIUI_PORT` | `8082` | Server port (Docker only) |\n| `AIUI_HOST` | `0.0.0.0` | Server bind address (Docker only) |\n| `AUTH_ENFORCE` | `false` | Enforce Bearer token auth on every route except the public surface (see below) |\n| `AIUI_ALLOWED_ORIGINS` | — | Comma-separated origins allowed to call the server from another site (CORS and cross-site requests); `*` allows any |\n| `AIUI_ALLOWED_HOSTS` | — | Comma-separated host names the server answers to when reached on a loopback or private address (`.example.com` also matches subdomains); `*` turns the check off |\n| `AIUI_KNOWLEDGE_ROOTS` | — | Folders (`os.pathsep`-separated) that `POST /api/knowledge/add-file` may read, in addition to the chat attachments folder; any other `file_path` is refused with 400 |\n| `AIUI_MAX_BODY_MB` | `25` | Largest request body in MiB; a bigger one gets 413 before it is read. `0` turns this cap off. Paths that need no credentials (login, sign-up, protocol negotiation) always take at most 64 KiB |\n| `AIUI_PUBLIC_STATIC_DIR` | — | `1` serves every file in a `static_dir` without credentials (see [Auth Enforcement](#auth-enforcement)); by default only code, styles, fonts, images and the HTML shell are public |\n| `OPENAI_API_KEY` | — | OpenAI API key for LLM provider |\n\n### Feature data and the data directory\n\nWhen `AIUI_DATA_DIR` or `PRAISONAI_HOME` is set (`PRAISONAI_HOME` wins when both are),\nfeature data lives under that directory, so two servers with different data\ndirectories never see each other's data:\n\n| Data | With a data directory | Without one (default install) | Explicit override |\n|------|-----------------------|-------------------------------|-------------------|\n| Recorded runs (Overview, Replay, Runs) | `\u003cdata dir\u003e/traces` | `~/.praison/traces` | `PRAISONAI_TRACES_DIR`, then `PRAISON_HOME/traces` |\n| Memory | `\u003cdata dir\u003e/memory` | `~/.praisonai/memory` and `./.praisonai/memory` | — |\n| Knowledge store | `\u003cdata dir\u003e/knowledge` | `./.praisonai` | — |\n| Training sessions | `\u003cdata dir\u003e/train` | `~/.praison/train` | `PRAISON_TRAIN_DIR` |\n| MCP server list | `\u003cdata dir\u003e/mcp.json` | `~/.praisonai/mcp.json` | — |\n| Video projects | `\u003cdata dir\u003e/projects` | `~/.praisonai/projects` | `PRAISONAI_PROJECTS_DIR`, `set_video_engine(projects_dir=)` |\n\nSetting `AIUI_DATA_DIR` to its default, `~/.praisonaiui`, counts as not set.\n\nThe PraisonAI CLI always records runs to `~/.praison/traces`. A server with a data\ndirectory does not show those runs unless you also set\n`PRAISONAI_TRACES_DIR=~/.praison/traces`.\n\n### Auth Enforcement\n\nWhen `AUTH_ENFORCE=true`, every route requires a valid Bearer token in the `Authorization` header: `/api/*`, and also `/sessions`, `/run`, `/cancel`, `/agents/{id}/runs`, `/teams/*`, `/v1/*` (OpenAI-compatible), `/agui` and any route a plugin adds. Only the public surface answers without one (deny by default):\n\n```bash\n# Without AUTH_ENFORCE (default): open access\ncurl http://localhost:8082/api/config\n\n# With AUTH_ENFORCE=true: requires auth\ncurl -H \"Authorization: Bearer \u003capi-key\u003e\" http://localhost:8082/api/config\n```\n\n**Public paths** (always accessible without auth):\n- `/health`, `/health/live`, `/health/ready`, `/api/health` — health checks\n- `/api/auth/login`, `/login` — login endpoints\n- `/api/protocol`, `/api/protocol/negotiate` — protocol discovery\n- the HTML page for a browser navigation (`/`, `/chat`, …; under `style: app`\n  `/sessions` and `/agents` too, but only as the page, never their JSON)\n- static code: `/assets/*`, `/plugins/*`, `/_aiui/externals/*`, `/_plugins/*`,\n  `/icon.svg`, `/manifest.json`, `/sw.js`, `/custom.js`, `/ui-config.json`\n- OAuth sign-in: `GET /api/auth/oauth/{provider}` and its `/callback` (they\n  only redirect)\n\n**A `static_dir` folder** (`create_app(static_dir=...)`, `aiui run --config`)\nis not public as a whole. Its code, styles, fonts and images\n(`.js .mjs .css .map .woff .woff2 .ttf .otf .eot .svg .png .jpg .jpeg .gif .webp .avif .ico`)\nanswer without credentials. So do its HTML pages, but under `AUTH_ENFORCE` and\n`require_auth` they are served as the app shell only: the page's inlined\nmarkdown and `\u003cnoscript\u003e` copy are removed. Markdown, JSON (a search index) and\nany other file need credentials, under `AUTH_ENFORCE`, `require_auth` and\nURL-token mode alike. The docs app sends the stored access token with every\nrequest it makes (pages, manifests, search). A reader who has not signed in\nsees the sign-in prompt, and after entering the token reads the site as on an\nopen server. Page titles and descriptions stay visible: `/docs-nav.json` lists\nthem for the sidebar. To keep the folder public in front of a private API, set\n`AIUI_PUBLIC_STATIC_DIR=1`.\n\nA built docs site served by `aiui serve` takes a password, open pages and\nreader groups from `content.docs.auth` instead ([docs sign-in](docs-auth.md)).\n\nWebSocket handshakes are gated too (all of them). Browsers cannot send an\n`Authorization` header on a WebSocket, so the UI first exchanges its key for a\nsingle-use ticket (`POST /api/auth/ws-ticket`, valid 60 s) and connects with\n`?ticket=`. Clients that cannot do that may still send `?token=\u003ckey\u003e`; it is\nredacted from the server's access log.\n\nThe other auth modes gate WebSockets as well: URL-token mode\n(`AIUI_REQUIRE_TOKEN=1`) accepts its session cookie, a Bearer header, `?token=`\nor a ticket; `create_app(require_auth=True)` / YAML `auth.requireAuth` checks\nsession tokens on every route and socket except the public surface above.\n\n### Self-registration under `requireAuth`\n\nA token from `POST /register` passes the `requireAuth` check, so registration is\nclosed by default. `POST /register` is accepted only:\n\n- for the **first user**: while no account exists (and no login, password,\n  header or OAuth callback is registered), the first registration creates it;\n- from a **signed-in user** (`Authorization: Bearer \u003csession token\u003e`), to add\n  an account;\n- for **anyone** when the config opts in:\n\n```yaml\nauth:\n  requireAuth: true\n  allowSignup: true   # open sign-up: any visitor can register and sign in\n```\n\n(`create_app(config={\"auth\": {\"requireAuth\": True, \"allowSignup\": True}})` from\nPython.) Otherwise it returns `403 {\"error\": \"Registration is closed\"}`.\nAccounts live in memory, so after a restart the first-user window is open\nagain until someone registers; create the admin in your app at startup\n(`praisonaiui.auth.register_user(\"admin\", password)`) to close it. Under\n`AUTH_ENFORCE` and URL-token mode `/register` already needs the API key or URL\ntoken, as before; with no auth mode it stays open.\n\n### Sessions\n\nSigning in (`POST /login`, `POST /register`, OAuth) returns a session token in\nthe JSON body and also sets it as an httpOnly cookie. The token is signed\n(HMAC-SHA256), not held in server memory, so a session survives a restart and\nworks on every worker that shares the secret. With no config the first sign-in\ngenerates one into `\u003cdata dir\u003e/auth_secret` (mode 0600, never logged). For\nseveral hosts set the same secret everywhere:\n`export AIUI_AUTH_SECRET=$(aiui auth create-secret)`.\n\n```yaml\nauth:\n  sessionLifetime: 14d   # default; 12h, 90m or seconds. Env AIUI_SESSION_LIFETIME wins\n  cookie:                # all optional\n    name: aiui_session\n    sameSite: lax        # lax, strict or none (none adds Secure)\n    path: /              # default: the app's root path\n    secure: true         # default: on https (or X-Forwarded-Proto: https)\n```\n\n- **Sliding.** Under `requireAuth` the cookie signs in HTTP and WebSockets, and\n  a request past half its lifetime gets a fresh one: active users stay signed\n  in, idle ones are signed out after `sessionLifetime`. A Bearer token lasts\n  `sessionLifetime` from sign-in. `SameSite` and the cross-site guard keep other\n  sites from riding the cookie.\n- **Sign-out.** `POST /logout` revokes the Bearer token and the cookie and\n  deletes the cookie. Revoked token ids stay in `\u003cdata dir\u003e/auth_revoked.jsonl`\n  until they would have expired, so every worker on that data directory honours\n  them. `Session.clear_tokens()` (in `@aiui.on_logout`) signs the user out on\n  every device.\n- **Rotation.** `AIUI_AUTH_SECRET=new,old`: the first secret signs, all verify.\n  Drop `old` after `sessionLifetime`. A single new secret (or deleting\n  `auth_secret`) signs everyone out.\n\nTrade-off: hosts that do not share the data directory verify sessions but do\nnot see each other's sign-outs, so a signed-out token stays valid there until\nit expires. Keep `sessionLifetime` short in that setup, or rotate the secret.\n\n### OAuth sign-in\n\nWith a provider configured (`AIUI_OAUTH_\u003cPROVIDER\u003e_CLIENT_ID` and\n`_CLIENT_SECRET`), a browser starts sign-in at\n`/api/auth/oauth/\u003cprovider\u003e?return_url=/chat`. Both that route and the callback\nare public in every auth mode. `return_url` must be a path on this server\n(starting with a single `/`). Anything else, such as an absolute URL or\n`//host`, returns to `/`. The callback sends the browser to\n`\u003creturn_url\u003e#token=\u003csession token\u003e`. The token is in the URL fragment, which\nbrowsers never send to a server, a log or a `Referer`. The dashboard stores it\nand removes it from the address bar. A client that sends\n`Accept: application/json` gets `{\"user\", \"token\"}` instead. OAuth tokens are\nsession tokens, so they sign in under `require_auth` / `auth.requireAuth`.\n\n## Configuration\n\n### Config File Location\n\nThe config file is located at `AIUI_DATA_DIR/config.yaml` (default: `~/.praisonaiui/config.yaml`).\n\n### Config Structure\n\n```yaml\nschemaVersion: 2\n\n# Site customization\nsite:\n  title: \"My Custom UI\"  # Appears in HTML \u003ctitle\u003e and UI header\n\n# Server settings\nserver:\n  host: \"127.0.0.1\"\n  port: 8003\n\n# AI Provider\nprovider:\n  name: \"openai\"\n  model: \"gpt-4o-mini\"\n\n# Gateway settings\ngateway:\n  host: \"127.0.0.1\"\n  port: 8765\n\n# Agents (managed via /api/agents)\nagents: {}\n\n# Skills (managed via /api/skills)\nskills:\n  enabled: []\n  custom: {}\n\n# Channels (managed via /api/channels)\nchannels: {}\n```\n\n### Site Title Customization\n\nThe site title is configurable via `site.title` in config.yaml:\n\n```yaml\nsite:\n  title: \"AIUI\"  # Default\n```\n\nThis affects:\n- HTML `\u003ctitle\u003e` tag\n- Dashboard header\n- `/ui-config.json` response\n\n## Health Monitoring\n\n### Health Endpoint\n\n```bash\n# Fast liveness probe (\u003c500ms) - use for load balancers and K8s livenessProbe\ncurl http://localhost:8082/health/live\n# Returns: {\"status\": \"ok\", \"timestamp\": \"2024-...\"}\n\n# Readiness probe with parallel feature checks - use for K8s readinessProbe\ncurl http://localhost:8082/health/ready\n\n# Deep diagnostics (parallel feature checks, deep by default)\ncurl http://localhost:8082/health\n# Pass ?deep=false for an immediate liveness response\n```\n\n### Kubernetes Probes\n\nUse the fast liveness endpoint for probes to avoid timeouts:\n\n```yaml\nlivenessProbe:\n  httpGet:\n    path: /health/live\n    port: 8082\n  initialDelaySeconds: 10\n  periodSeconds: 30\n  timeoutSeconds: 1\nreadinessProbe:\n  httpGet:\n    path: /health/ready\n    port: 8082\n  initialDelaySeconds: 5\n  periodSeconds: 10\n```\n\n### Docker HEALTHCHECK\n\nThe Dockerfile includes a built-in health check:\n\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \\\n    CMD curl -f http://localhost:${AIUI_PORT}/health/live || exit 1\n```\n\n### CLI Health Commands\n\n```bash\n# Quick health check\naiui health-check --server http://localhost:8082\n\n# Detailed per-feature health  \naiui health-check --server http://localhost:8082 --detailed\n\n# Full diagnostic (7 checks)\naiui doctor --server http://localhost:8082\n```\n\n## Security\n\n### Auth Modes\n\nAIUI supports multiple authentication modes:\n\n| Mode | Description |\n|------|-------------|\n| `none` | No authentication (default) |\n| `api_key` | API key in `X-API-Key` header or `api_key` query param |\n| `session` | Session token in `Authorization: Bearer \u003ctoken\u003e` header |\n| `password` | Username/password login |\n\n### API Key Management\n\n```bash\n# Create an API key on a running server (or POST /api/auth/keys)\naiui auth create-key --name \"my-app\" --server http://localhost:8082\n\n# Use the key\ncurl -H \"X-API-Key: \u003ckey\u003e\" http://localhost:8082/api/config\n```\n\n### Cross-site requests\n\nBy default the server only serves its own pages: responses carry no CORS\nheaders, and a page on another site can neither open a WebSocket to it nor\nsend it a state-changing request (`POST`/`PUT`/`PATCH`/`DELETE`, including\n`text/plain` \"simple\" requests that skip the CORS preflight). The check uses\nthe browser's `Sec-Fetch-Site` header, so it works behind a reverse proxy that\nrewrites `Host`; without that header the `Origin` is compared with `Host` and\n`X-Forwarded-Host`. Requests with neither header (curl, SDK clients) are not\naffected. A local dev server (Vite on another port) talking to a local server\nis allowed.\n\nTo let another site call the server (an embedded widget, a separate frontend),\nlist its origin:\n\n```bash\nAIUI_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com\n# AIUI_ALLOWED_ORIGINS=*   # the old allow-everything behaviour\n```\n\n### Host names (DNS rebinding)\n\nA server reached on a loopback or private address (`127.0.0.1`, `192.168.x.x`,\na Docker bridge) only answers requests whose `Host` is an IP address,\n`localhost` / `*.localhost`, a `*.local` name, the machine's own hostname, or a\nname listed in `AIUI_ALLOWED_HOSTS`. Anything else gets `400 Host not allowed`\n(a WebSocket is closed with code 1008). This stops DNS rebinding, where a\nwebsite points its own domain at `127.0.0.1` so that the browser treats it as\nsame-origin with your local server.\n\nIf a reverse proxy on the same machine forwards a public name to the server\n(nginx → `127.0.0.1:8082` with `proxy_set_header Host $host`), list that name:\n\n```bash\nAIUI_ALLOWED_HOSTS=aiui.example.com          # or .example.com for subdomains\n# AIUI_ALLOWED_HOSTS=*   # turn the check off\n```\n\nA server reached directly on a public IP address is not checked.\n\n### Network Considerations\n\n- **Internal networks**: Use `AUTH_ENFORCE=false` if behind a trusted reverse proxy\n- **Public exposure**: Always set `AUTH_ENFORCE=true` and use HTTPS\n- **Load balancers**: Health check path is `/health/live` (fast, exempt from auth)\n\n## Managed Hosting\n\n### Required Endpoints\n\nHosting platforms should expose these endpoints:\n\n| Endpoint | Purpose |\n|----------|---------|\n| `/health/live` | Fast liveness probe (returns `{\"status\": \"ok\"}`) |\n| `/health/ready` | Readiness probe (parallel feature checks) |\n| `/health` | Deep health (parallel feature checks; `?deep=false` for liveness) |\n| `/api/protocol` | Protocol version and capabilities |\n| `/api/protocol/negotiate` | Capability negotiation |\n| `/api/features` | List of registered features |\n\n### Protocol Discovery\n\n```bash\n# Get protocol version\ncurl http://localhost:8082/api/protocol\n# Returns: {\"version\": \"1.0\", \"capabilities\": [...]}\n\n# List features\ncurl http://localhost:8082/api/features\n# Returns: {\"features\": [{\"name\": \"chat\", ...}, ...]}\n```\n\n### Minimum Viable Deployment\n\nFor a minimal AIUI deployment:\n\n1. **Required**: `OPENAI_API_KEY` environment variable\n2. **Recommended**: Persistent volume for `AIUI_DATA_DIR`\n3. **Optional**: `AUTH_ENFORCE=true` for multi-tenant environments\n\n```bash\ndocker run -d \\\n  -p 8082:8082 \\\n  -e OPENAI_API_KEY=sk-... \\\n  -v aiui-data:/root/.praisonaiui \\\n  aiui:latest\n```\n"}</script>
