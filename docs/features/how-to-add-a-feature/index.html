></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>How to Add a Feature to PraisonAIUI</h1>
<p>This guide explains every way a user can extend PraisonAIUI — and which approach fits your use case.</p>
<h2>Extension Points at a Glance</h2>
<p>| I want to add… | Use | Side | Effort |</p>
<p>|----------------|-----|------|--------|</p>
<p>| A new dashboard page | <code>@aiui.page()</code> | Server | 5 lines |</p>
<p>| A form that saves data | <code>aiui.form_action()</code> + <code>@aiui.register_page_action()</code> | Both | 15 lines |</p>
<p>| A brand-new UI component type | <code>window.aiui.registerComponent()</code> + dict type | Both | 20 lines |</p>
<p>| A page rendered entirely in the browser | <code>window.aiui.registerView()</code> | Client | 10 lines |</p>
<p>| Ship client-side JS from Python | <code>aiui.set_custom_js(path)</code> | Server | 1 line |</p>
<p>| A typed contract for a component | <code>aiui.register_component_schema(type, schema)</code> | Server | 5 lines |</p>
<p>| A custom theme | <code>aiui.register_theme()</code> | Server | 1 line |</p>
<p>| A new AI backend | Subclass <code>aiui.BaseProvider</code> | Server | ~50 lines |</p>
<p>| A whole new feature module (routes, state) | Subclass <code>BaseFeatureProtocol</code> + <code>register_feature()</code> | Server | ~100 lines |</p>
<p>| Persistence backend | Subclass <code>aiui.BaseDataStore</code> | Server | ~50 lines |</p>
<p>---</p>
<h2>Decision Flow</h2>
<p>---</p>
<h2>1. Add a new page</h2>
<p><strong>Goal</strong>: Show a new page in the sidebar with custom content.</p>
<p><strong>What happens</strong>:</p>
<p>1. The page is registered in the server's page registry.</p>
<p>2. It appears in the sidebar at <code>/api/pages</code>.</p>
<p>3. When the user clicks it, the frontend fetches <code>/api/pages/analytics/data</code>.</p>
<p>4. Your handler returns a dict; <code>aiui.layout()</code> wraps it in <code>{"_components": [...]}</code>.</p>
<p>5. <code>dashboard.js</code> loops over <code>_components</code> and calls <code>renderComponent(comp)</code> on each.</p>
<p>See Dashboard for the full <code>@aiui.page()</code> signature.</p>
<p>---</p>
<h2>2. Add an interactive form</h2>
<p><strong>Goal</strong>: Let users submit data from the UI back to your Python code.</p>
<p><strong>What happens</strong>:</p>
<p>1. The form renders with all inputs.</p>
<p>2. On submit, the frontend POSTs to <code>/api/pages/contact/action</code>.</p>
<p>3. The server invokes <code>handle_contact(data)</code> with the form values keyed by label.</p>
<p>4. The returned dict is sent back to the browser as JSON.</p>
<p>&gt; <strong>Note</strong>: Input labels become dict keys. Use distinct labels per input.</p>
<p>---</p>
<h2>3. Add a custom component type</h2>
<p><strong>Goal</strong>: Add a new UI widget that doesn't exist in the 48 built-ins.</p>
<h3>Step 1 — Python side: return a dict with your new type</h3>
<p><strong>If you stop here</strong>, the component renders as formatted JSON (graceful fallback).</p>
<h3>Step 2 — Client side: register a renderer</h3>
<p>Put this in a <code>plugin.js</code> file (or paste into DevTools Console):</p>
<p><strong>What happens</strong>:</p>
<p>1. <code>renderComponent(comp)</code> checks <code>COMPONENT_REGISTRY[comp.type]</code> before the built-in switch.</p>
<p>2. Your renderer takes priority and returns a DOM element.</p>
<h3>Auto-load `plugin.js` from Python</h3>
<p>Use <code>aiui.set_custom_js(path)</code> to ship client-side extensions directly from</p>
<p>your app:</p>
<p>The script runs <strong>after</strong> the plugin loader, so <code>window.aiui.registerView</code></p>
<p>and <code>window.aiui.registerComponent</code> are ready when it executes. No DevTools</p>
<p>workaround needed.</p>
<p>---</p>
<h3>Adding a docs component (`<Badge>`, `<Tooltip>`, ...)</h3>
<p>Docs tags are driven by one table, <code>DOCS_TAGS</code> in</p>
<p><code>src/frontend/src/markdown/docsTags.ts</code>. A new tag is three small changes:</p>
<p>1. An entry: the <code>aiui-*</code> element it becomes (<code>el</code>), the lower-case</p>
<p>attributes the sanitizer keeps (<code>attrs</code>), an optional <code>map</code> from the</p>
<p>author's attributes, and <code>inline: true</code> for a tag inside a sentence:</p>
<p><code>Badge: { el: 'aiui-badge', attrs: ['color'], inline: true }</code>. <code>slots: ['caption']</code></p>
<p>renders an attribute as Markdown (an <code>aiui-slot</code> child; <code>slots()</code> in <code>docs/DocsWidgets.tsx</code>).</p>
<p>2. Its React component under the same element name in <code>DOCS_TAG_COMPONENTS</code></p>
<p>(<code>src/frontend/src/docs/DocsBlocks.tsx</code>): those attributes are its props.</p>
<p>3. The name in <code>KNOWN_DOCS_TAGS</code> (<code>src/praisonaiui/compiler/docs_tags.py</code>) so</p>
<p><code>aiui build</code> stops warning; <code>tests/unit/test_docs_tags.py</code> checks the lists.</p>
<p>Placement (own line, one line, list items, self-closing, code left alone) and</p>
<p>the sanitizer allowlist come with the table. Rebuild the bundle and document</p>
<p>the tag in <code>docs/features/writing-docs.md</code>.</p>
<p>A tag whose body is code is not a table entry: <code>&lt;CodeBlock&gt;</code> is listed in</p>
<p><code>PASSTHROUGH</code> and turned into a fence (<code>codeBlockFence</code>, <code>docs/codeMeta.ts</code>),</p>
<p>so it renders through the same code frame (<code>docs/DocsPre.tsx</code>) as a fence.</p>
<p>A new code option goes in <code>parseCodeMeta</code> and <code>DocsPre</code>.</p>
<p>Content for the page's right-hand column is an <code>aiui-panel</code> block</p>
<p>(<code>&lt;Panel&gt;</code>, and <code>&lt;RequestExample&gt;</code> / <code>&lt;ResponseExample&gt;</code>, which</p>
<p><code>convertMkdocsBlocks</code> turns into a panel around a code group): <code>splitPanels</code></p>
<p>(<code>docs/panels.ts</code>) moves every top-level one out of the article, and</p>
<p><code>Content.tsx</code> draws them in a sticky column in place of "On this page".</p>
<h2>4. Add a client-only page</h2>
<p><strong>Goal</strong>: A page rendered entirely in the browser — no server round-trip on navigation.</p>
<p>Still register a placeholder page in Python so it appears in the sidebar:</p>
<p><strong>What happens</strong>:</p>
<p>1. <code>registerView</code> takes priority over the built-in + server-side rendering.</p>
<p>2. Navigation calls your <code>render(container)</code> function.</p>
<p>3. When the user navigates away, your <code>cleanup()</code> function runs.</p>
<p>---</p>
<h2>5. Register a custom theme</h2>
<p>See CSS Architecture for all variables.</p>
<p>---</p>
<h2>6. Add a new AI provider</h2>
<p>See Providers.</p>
<p>---</p>
<h2>7. Add a feature module (advanced)</h2>
<p>Features live in <code>praisonaiui/features/*.py</code> and implement <code>BaseFeatureProtocol</code>:</p>
<p><code>name</code> and <code>description</code> are abstract on <code>BaseFeatureProtocol</code>; omitting</p>
<p>either raises <code>TypeError: Can't instantiate abstract class</code>. Optional hooks:</p>
<p><code>cli_commands()</code>, <code>health()</code> (kept cheap: it runs on every <code>/api/features</code></p>
<p>request) and <code>on_config_reload()</code> (drop what you cached from <code>config.yaml</code>;</p>
<p>see Config Hot-Reload).</p>
<p>See Protocol Architecture.</p>
<p>---</p>
<h2>Is This the Best Approach?</h2>
<h3>Strengths ✅</h3>
<li><strong>Clean separation</strong> — Python returns dicts, client renders DOM. You can mix and match server/client work per-feature.</li>
<li><strong>Graceful degradation</strong> — Unknown component types render as JSON (no crashes).</li>
<li><strong>Zero build step for Python users</strong> — No webpack/TS compile required for server-side pages.</li>
<li><strong>Single source of truth</strong> — Every feature has a protocol ABC.</li>
<li><strong>Hot-swap friendly</strong> — <code>window.aiui.registerView/Component</code> updates live without server restart.</li>
<h3>Previously reported gaps — all closed ✅</h3>
<p>| Gap | Resolution |</p>
<p>|-----|------------|</p>
<p>| No <code>aiui.set_custom_js(path)</code> | <strong>Implemented</strong> — serves the file at <code>/custom.js</code> and injects a <code>&lt;script&gt;</code> tag after the plugin loader. Unit tests: <code>tests/unit/test_custom_js.py</code> (10 tests). |</p>
<p>| <code>form_action</code> uses input labels as keys | <strong>Implemented</strong> — every form input now accepts an optional <code>name=</code> kwarg that becomes the submit-key. Tests: <code>tests/unit/test_form_input_names.py</code> (18 tests). |</p>
<p>| No typed Python ⇄ JS contract | <strong>Implemented</strong> — <code>aiui.register_component_schema(type, schema)</code> + <code>GET /api/components/schemas</code>. Built-in schemas are auto-derived from <code>ui.py</code> signatures. Tests: <code>tests/unit/test_component_schemas.py</code> (9 tests). |</p>
<p>| <code>/api/features</code> cold-start slow | <strong>Mitigated</strong> — <code>info()</code> calls are parallelized via <code>asyncio.gather</code>. Warm calls are now instant; cold starts are dominated by LiteLLM import (out of scope). |</p>
<p>| <code>pygments 2.20</code> mkdocs build crash on <code>providers.md</code> | <strong>Fixed</strong> — <code>scripts/docs_hooks.py</code> patches <code>pymdownx.BlockHtmlFormatter.__init__</code> to coerce <code>filename=None</code> → <code>""</code>. |</p>
<h3>When NOT to use this approach</h3>
<li><strong>You need a full SPA with routing</strong>: Use the Next.js adapter or scaffold a React project with <code>aiui init --frontend</code>.</li>
<li><strong>Your UI needs TypeScript types</strong>: Use the TypeScript SDK (<code>@praisonaiui/runtime</code>).</li>
<li><strong>You need server-sent events beyond chat</strong>: Extend <code>BaseFeatureProtocol</code> with a WebSocket route.</li>
<p>---</p>
<h2>Checklist for a New Feature</h2>
<li>[ ] Decide: is it a page, a component, or a backend module?</li>
<li>[ ] Write the Python side first (returns a dict / routes).</li>
<li>[ ] If you added a new component type: implement the JS renderer.</li>
<li>[ ] Write a unit test (see <code>tests/unit/test_form_action.py</code> as an example).</li>
<li>[ ] Add a runnable example under <code>examples/python/</code>.</li>
<li>[ ] Update the docs under <code>docs/features/</code> or <code>docs/api/</code>.</li>
<li>[ ] Run <code>mkdocs build --strict</code>.</li>
<li>[ ] Run <code>pytest tests/unit -v</code>.</li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/how-to-add-a-feature.source.md", "text": "---\nnav_title: Add a feature\n---\n\n# How to Add a Feature to PraisonAIUI\n\nThis guide explains every way a user can extend PraisonAIUI — and which approach fits your use case.\n\n## Extension Points at a Glance\n\n| I want to add… | Use | Side | Effort |\n|----------------|-----|------|--------|\n| A new dashboard page | `@aiui.page()` | Server | 5 lines |\n| A form that saves data | `aiui.form_action()` + `@aiui.register_page_action()` | Both | 15 lines |\n| A brand-new UI component type | `window.aiui.registerComponent()` + dict type | Both | 20 lines |\n| A page rendered entirely in the browser | `window.aiui.registerView()` | Client | 10 lines |\n| Ship client-side JS from Python | `aiui.set_custom_js(path)` | Server | 1 line |\n| A typed contract for a component | `aiui.register_component_schema(type, schema)` | Server | 5 lines |\n| A custom theme | `aiui.register_theme()` | Server | 1 line |\n| A new AI backend | Subclass `aiui.BaseProvider` | Server | ~50 lines |\n| A whole new feature module (routes, state) | Subclass `BaseFeatureProtocol` + `register_feature()` | Server | ~100 lines |\n| Persistence backend | Subclass `aiui.BaseDataStore` | Server | ~50 lines |\n\n---\n\n## Decision Flow\n\n```\n┌─────────────────────────────────────┐\n│   What do you want to add?          │\n└────────────────┬────────────────────┘\n                 │\n     ┌───────────┼───────────────────────────────┐\n     ▼           ▼                               ▼\n  A PAGE    A COMPONENT                  A BACKEND THING\n     │           │                               │\n     ▼           ▼                               ▼\n @aiui.page  Is it in the 48             Is it a provider?\n     │       built-in components?           → BaseProvider\n     ▼              │                     Is it storage?\n Compose from       │                        → BaseDataStore\n existing       Yes │   No                 Is it a feature with\n components         │    │                 its own routes/state?\n     │              ▼    ▼                    → BaseFeatureProtocol\n     │          Use it   Custom component\n     │                   via registerComponent\n     ▼\n Need form data back?\n    → add form_action\n    + @register_page_action\n```\n\n---\n\n## 1. Add a new page\n\n**Goal**: Show a new page in the sidebar with custom content.\n\n```python\nimport praisonaiui as aiui\n\n@aiui.page(\"analytics\", title=\"Analytics\", icon=\"📈\", group=\"Custom\")\nasync def analytics():\n    return aiui.layout([\n        aiui.columns([\n            aiui.card(\"Revenue\", value=\"$12,340\"),\n            aiui.card(\"Users\", value=\"1,204\"),\n        ]),\n        aiui.chart(data=[10, 20, 30], type=\"line\"),\n    ])\n```\n\n**What happens**:\n\n1. The page is registered in the server's page registry.\n2. It appears in the sidebar at `/api/pages`.\n3. When the user clicks it, the frontend fetches `/api/pages/analytics/data`.\n4. Your handler returns a dict; `aiui.layout()` wraps it in `{\"_components\": [...]}`.\n5. `dashboard.js` loops over `_components` and calls `renderComponent(comp)` on each.\n\nSee [Dashboard](dashboard.md) for the full `@aiui.page()` signature.\n\n---\n\n## 2. Add an interactive form\n\n**Goal**: Let users submit data from the UI back to your Python code.\n\n```python\nimport praisonaiui as aiui\n\n_saved = []\n\n@aiui.page(\"contact\", title=\"Contact\", icon=\"📝\")\nasync def contact_form():\n    return aiui.layout([\n        aiui.form_action(\n            \"contact\",\n            submit_label=\"Save\",\n            children=[\n                aiui.text_input(\"Name\"),\n                aiui.text_input(\"Email\"),\n                aiui.select_input(\"Role\", options=[\"Engineer\", \"PM\"]),\n                aiui.checkbox_input(\"Subscribe\", checked=True),\n            ],\n        ),\n    ])\n\n@aiui.register_page_action(\"contact\")\nasync def handle_contact(data: dict) -\u003e dict:\n    _saved.append(data)\n    return {\"status\": \"saved\", \"count\": len(_saved)}\n```\n\n**What happens**:\n\n1. The form renders with all inputs.\n2. On submit, the frontend POSTs to `/api/pages/contact/action`.\n3. The server invokes `handle_contact(data)` with the form values keyed by label.\n4. The returned dict is sent back to the browser as JSON.\n\n\u003e **Note**: Input labels become dict keys. Use distinct labels per input.\n\n---\n\n## 3. Add a custom component type\n\n**Goal**: Add a new UI widget that doesn't exist in the 48 built-ins.\n\n### Step 1 — Python side: return a dict with your new type\n\n```python\n@aiui.page(\"activity\", title=\"Activity\", icon=\"🕒\")\nasync def activity():\n    return aiui.layout([\n        {\n            \"type\": \"timeline\",   # ← custom type\n            \"events\": [\n                {\"time\": \"09:00\", \"label\": \"Deploy\", \"icon\": \"🚀\"},\n                {\"time\": \"13:00\", \"label\": \"Review\", \"icon\": \"🔍\"},\n            ],\n        },\n    ])\n```\n\n**If you stop here**, the component renders as formatted JSON (graceful fallback).\n\n### Step 2 — Client side: register a renderer\n\nPut this in a `plugin.js` file (or paste into DevTools Console):\n\n```javascript\nwindow.aiui.registerComponent('timeline', function(comp) {\n    const el = document.createElement('div');\n    el.className = 'db-timeline';\n    (comp.events || []).forEach(ev =\u003e {\n        const row = document.createElement('div');\n        row.innerHTML = `\u003cb\u003e${ev.icon}\u003c/b\u003e ${ev.time} — ${ev.label}`;\n        el.appendChild(row);\n    });\n    return el;\n});\n```\n\n**What happens**:\n\n1. `renderComponent(comp)` checks `COMPONENT_REGISTRY[comp.type]` before the built-in switch.\n2. Your renderer takes priority and returns a DOM element.\n\n### Auto-load `plugin.js` from Python\n\nUse `aiui.set_custom_js(path)` to ship client-side extensions directly from\nyour app:\n\n```python\nimport praisonaiui as aiui\n\naiui.set_custom_js(\"plugin.js\")   # reads file, serves at /custom.js,\n                                   # injects \u003cscript\u003e after the plugin loader\n```\n\nThe script runs **after** the plugin loader, so `window.aiui.registerView`\nand `window.aiui.registerComponent` are ready when it executes. No DevTools\nworkaround needed.\n\n---\n\n### Adding a docs component (`\u003cBadge\u003e`, `\u003cTooltip\u003e`, ...)\n\nDocs tags are driven by one table, `DOCS_TAGS` in\n`src/frontend/src/markdown/docsTags.ts`. A new tag is three small changes:\n\n1. An entry: the `aiui-*` element it becomes (`el`), the lower-case\n   attributes the sanitizer keeps (`attrs`), an optional `map` from the\n   author's attributes, and `inline: true` for a tag inside a sentence:\n   `Badge: { el: 'aiui-badge', attrs: ['color'], inline: true }`. `slots: ['caption']`\n   renders an attribute as Markdown (an `aiui-slot` child; `slots()` in `docs/DocsWidgets.tsx`).\n2. Its React component under the same element name in `DOCS_TAG_COMPONENTS`\n   (`src/frontend/src/docs/DocsBlocks.tsx`): those attributes are its props.\n3. The name in `KNOWN_DOCS_TAGS` (`src/praisonaiui/compiler/docs_tags.py`) so\n   `aiui build` stops warning; `tests/unit/test_docs_tags.py` checks the lists.\n\nPlacement (own line, one line, list items, self-closing, code left alone) and\nthe sanitizer allowlist come with the table. Rebuild the bundle and document\nthe tag in `docs/features/writing-docs.md`.\n\nA tag whose body is code is not a table entry: `\u003cCodeBlock\u003e` is listed in\n`PASSTHROUGH` and turned into a fence (`codeBlockFence`, `docs/codeMeta.ts`),\nso it renders through the same code frame (`docs/DocsPre.tsx`) as a fence.\nA new code option goes in `parseCodeMeta` and `DocsPre`.\n\nContent for the page's right-hand column is an `aiui-panel` block\n(`\u003cPanel\u003e`, and `\u003cRequestExample\u003e` / `\u003cResponseExample\u003e`, which\n`convertMkdocsBlocks` turns into a panel around a code group): `splitPanels`\n(`docs/panels.ts`) moves every top-level one out of the article, and\n`Content.tsx` draws them in a sticky column in place of \"On this page\".\n\n## 4. Add a client-only page\n\n**Goal**: A page rendered entirely in the browser — no server round-trip on navigation.\n\n```javascript\n// In plugin.js\nwindow.aiui.registerView('live-feed', async (container) =\u003e {\n    container.innerHTML = '\u003ch1\u003eLive Feed\u003c/h1\u003e';\n    const ws = new WebSocket('wss://your-feed.example.com');\n    ws.onmessage = (e) =\u003e {\n        const div = document.createElement('div');\n        div.textContent = e.data;\n        container.appendChild(div);\n    };\n    // Store ws for cleanup\n    container._ws = ws;\n}, () =\u003e {\n    // Cleanup when user navigates away\n    if (container._ws) container._ws.close();\n});\n```\n\nStill register a placeholder page in Python so it appears in the sidebar:\n\n```python\n@aiui.page(\"live-feed\", title=\"Live Feed\", icon=\"📡\")\nasync def live_feed():\n    return aiui.layout([aiui.text(\"Loading…\")])\n```\n\n**What happens**:\n\n1. `registerView` takes priority over the built-in + server-side rendering.\n2. Navigation calls your `render(container)` function.\n3. When the user navigates away, your `cleanup()` function runs.\n\n---\n\n## 5. Register a custom theme\n\n```python\naiui.register_theme(\"ocean\", {\"accent\": \"#0077b6\"})\naiui.set_theme(preset=\"ocean\")\n```\n\nSee [CSS Architecture](css-architecture.md) for all variables.\n\n---\n\n## 6. Add a new AI provider\n\n```python\nfrom praisonaiui.provider import BaseProvider, RunEvent, RunEventType\n\nclass MyProvider(BaseProvider):\n    async def run(self, message, **kw):\n        yield RunEvent(type=RunEventType.RUN_STARTED)\n        yield RunEvent(type=RunEventType.RUN_CONTENT, token=\"Hello\")\n        yield RunEvent(type=RunEventType.RUN_COMPLETED, content=\"Hello\")\n\naiui.set_provider(MyProvider())\n```\n\nSee [Providers](../concepts/providers.md).\n\n---\n\n## 7. Add a feature module (advanced)\n\nFeatures live in `praisonaiui/features/*.py` and implement `BaseFeatureProtocol`:\n\n```python\nfrom praisonaiui.features import BaseFeatureProtocol, register_feature\nfrom starlette.routing import Route\nfrom starlette.responses import JSONResponse\n\nclass MyFeature(BaseFeatureProtocol):\n    name = \"my-feature\"\n    description = \"Example feature with GET and PATCH routes\"\n\n    def routes(self):\n        return [\n            Route(\"/api/my-feature\", self._get, methods=[\"GET\"]),\n            Route(\"/api/my-feature/{item_id}\", self._patch, methods=[\"PATCH\"]),\n        ]\n\n    async def _get(self, request):\n        # Query parameters: GET /api/my-feature?q=hello\n        return JSONResponse({\"data\": request.query_params.get(\"q\", \"hello\")})\n\n    async def _patch(self, request):\n        # Path parameter + JSON body: PATCH /api/my-feature/42\n        body = await request.json()\n        return JSONResponse({\"ok\": True, \"id\": request.path_params[\"item_id\"], **body})\n\n# Register before the app is created — create_app() mounts feature\n# routes ahead of the SPA fallback, so no route reordering is needed.\nregister_feature(MyFeature())\n```\n\n`name` and `description` are abstract on `BaseFeatureProtocol`; omitting\neither raises `TypeError: Can't instantiate abstract class`. Optional hooks:\n`cli_commands()`, `health()` (kept cheap: it runs on every `/api/features`\nrequest) and `on_config_reload()` (drop what you cached from `config.yaml`;\nsee [Config Hot-Reload](config-hot-reload.md)).\n\nSee [Protocol Architecture](protocol-architecture.md).\n\n---\n\n## Is This the Best Approach?\n\n### Strengths ✅\n\n- **Clean separation** — Python returns dicts, client renders DOM. You can mix and match server/client work per-feature.\n- **Graceful degradation** — Unknown component types render as JSON (no crashes).\n- **Zero build step for Python users** — No webpack/TS compile required for server-side pages.\n- **Single source of truth** — Every feature has a protocol ABC.\n- **Hot-swap friendly** — `window.aiui.registerView/Component` updates live without server restart.\n\n### Previously reported gaps — all closed ✅\n\n| Gap | Resolution |\n|-----|------------|\n| No `aiui.set_custom_js(path)` | **Implemented** — serves the file at `/custom.js` and injects a `\u003cscript\u003e` tag after the plugin loader. Unit tests: `tests/unit/test_custom_js.py` (10 tests). |\n| `form_action` uses input labels as keys | **Implemented** — every form input now accepts an optional `name=` kwarg that becomes the submit-key. Tests: `tests/unit/test_form_input_names.py` (18 tests). |\n| No typed Python ⇄ JS contract | **Implemented** — `aiui.register_component_schema(type, schema)` + `GET /api/components/schemas`. Built-in schemas are auto-derived from `ui.py` signatures. Tests: `tests/unit/test_component_schemas.py` (9 tests). |\n| `/api/features` cold-start slow | **Mitigated** — `info()` calls are parallelized via `asyncio.gather`. Warm calls are now instant; cold starts are dominated by LiteLLM import (out of scope). |\n| `pygments 2.20` mkdocs build crash on `providers.md` | **Fixed** — `scripts/docs_hooks.py` patches `pymdownx.BlockHtmlFormatter.__init__` to coerce `filename=None` → `\"\"`. |\n\n### When NOT to use this approach\n\n- **You need a full SPA with routing**: Use the Next.js adapter or scaffold a React project with `aiui init --frontend`.\n- **Your UI needs TypeScript types**: Use the TypeScript SDK (`@praisonaiui/runtime`).\n- **You need server-sent events beyond chat**: Extend `BaseFeatureProtocol` with a WebSocket route.\n\n---\n\n## Checklist for a New Feature\n\n- [ ] Decide: is it a page, a component, or a backend module?\n- [ ] Write the Python side first (returns a dict / routes).\n- [ ] If you added a new component type: implement the JS renderer.\n- [ ] Write a unit test (see `tests/unit/test_form_action.py` as an example).\n- [ ] Add a runnable example under `examples/python/`.\n- [ ] Update the docs under `docs/features/` or `docs/api/`.\n- [ ] Run `mkdocs build --strict`.\n- [ ] Run `pytest tests/unit -v`.\n"}</script>
