ckend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/health-endpoints">Health Endpoints Guide</a></li><li><a href="https://ui.praison.ai/docs/api">Reference</a></li><li><a href="https://ui.praison.ai/docs/api/cli">CLI Reference</a></li><li><a href="https://ui.praison.ai/docs/api/python">Python SDK API</a></li><li><a href="https://ui.praison.ai/docs/concepts/configuration">YAML Configuration</a></li><li><a href="https://ui.praison.ai/docs/api/components">Component API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/features-api">Features REST API Reference</a></li><li><a href="https://ui.praison.ai/docs/features/api-reference">API Reference page and OpenAPI document</a></li><li><a href="https://ui.praison.ai/docs/api/sessions">Sessions API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/health">Health API Reference</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/api/typescript">TypeScript SDK Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocols">Feature Protocols</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-architecture">Protocol Architecture Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-versioning">Protocol Versioning</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp">Application Design Protocol (ADP)</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Docs sign-in</h1>
<p>Put a docs site behind a password, keep some pages open to everyone, and limit</p>
<p>others to a group of readers. <code>aiui serve</code> and <code>aiui dev</code> enforce it; there is</p>
<p>nothing to install and no account system to run.</p>
<h2>A password for the whole site</h2>
<p>Every page now asks for the password. A reader who opens any page gets a sign-in</p>
<p>page in the site's own theme, at that URL, and lands on the page they asked for.</p>
<p>The session lasts seven days. <code>/__aiui/login</code> shows who is signed in and a</p>
<p><strong>Sign out</strong> button (link to it from <code>navbar.links</code> if you want one).</p>
<p>Passwords are always written <code>env:NAME</code>: the build stores the variable's name,</p>
<p>never the password. Change the variable and restart to change the password;</p>
<p>every reader signed in with the old one is signed out.</p>
<h2>Open pages</h2>
<p>Most docs want a public home and quickstart and the rest behind sign-in:</p>
<p><code>public</code> lists page paths relative to the docs (<code>/</code> is the home page,</p>
<p><code>/docs/quickstart</code> also works) and patterns (<code>*</code> matches any part of a path). A</p>
<p>page can also say it in its front matter:</p>
<p><code>public: false</code> keeps a page behind sign-in when a pattern would open it, so</p>
<p><code>public: ["*"]</code> plus <code>public: false</code> on a few pages protects only those.</p>
<h2>A password per reader</h2>
<p>Readers sign in with their password alone; it tells the server who they are.</p>
<h2>Groups</h2>
<p>Give readers groups, then name the groups a page is for:</p>
<p>A page with <code>groups</code> is for readers in at least one of them. To any other</p>
<p>signed-in reader it does not exist: a 404, and it is missing from their sidebar,</p>
<p>search, <code>llms.txt</code>, MCP and Ask AI. A signed-out reader who opens it gets the</p>
<p>sign-in page (they may be a member).</p>
<h2>What is protected</h2>
<p>A page's rule covers everything made from it: its HTML (including the copy</p>
<p>inside <code>&lt;noscript&gt;</code>), its <code>.md</code> and <code>.source.md</code> files and `Accept:</p>
<p>text/markdown<code> answer, its social card under </code>/og/`, its Try it data and its RSS</p>
<p>feed. <code>docs-nav.json</code>, <code>search-index.json</code>, <code>llms.txt</code> and <code>llms-full.txt</code> (and</p>
<p>their <code>/.well-known/</code> copies) hold only the pages the reader may read (so the</p>
<p>pages do not carry the navigation, as they do on a site without sign-in, and</p>
<p>the build writes no split search index, <code>search-index/</code>: search reads the cut</p>
<p><code>search-index.json</code>), and the</p>
<p>MCP server, Ask AI,</p>
<p><code>/api/docs/search</code> and page feedback see only those pages. An AI tool that</p>
<p>connects to <code>/mcp</code> without the browser's cookie reads the open pages. The</p>
<p>sitemap lists only open pages.</p>
<p>Code, styles, fonts, images and <code>ui-config.json</code> are open to anyone, so open</p>
<p>pages render (do not put a secret in an image). Any other file (OpenAPI specs, a</p>
<p>nav group's generated page, files you copied in) needs sign-in.</p>
<h2>Security</h2>
<li>Protected answers carry <code>Cache-Control: private</code>, so a shared cache never</li>
<p>hands one reader's page to another.</p>
<li>The session cookie is <code>HttpOnly</code>, <code>SameSite=Lax</code> and <code>Secure</code> over HTTPS</li>
<p>(also behind a proxy that sets <code>X-Forwarded-Proto</code>). It is signed with a key</p>
<p>derived from the reader's password.</p>
<li>Passwords are compared in constant time. Ten wrong passwords from one address</li>
<p>in ten minutes block that address for the rest of the ten minutes (429).</p>
<li>Sign-in and sign-out only accept a form posted from the site itself</li>
<p>(<code>AIUI_ALLOWED_ORIGINS</code> adds origins, as for the rest of aiui).</p>
<li>A password variable that is not set is logged as a warning; that reader</li>
<p>cannot sign in.</p>
<h2>Static hosts</h2>
<p>Sign-in needs the aiui server. A static host (GitHub Pages, a CDN) serves every</p>
<p>file of the build, so <code>aiui build</code> warns (7017) on a site with</p>
<p><code>content.docs.auth</code>; serve it with <code>aiui serve</code> (deployment).</p>
<p><code>aiui validate</code> reports front matter <code>public</code> or <code>groups</code> on a site without</p>
<p><code>content.docs.auth</code>, and a group no reader is in (7017). A docs folder served by <code>aiui run</code> uses the app's own</p>
<p>sign-in instead (deployment).</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/docs-auth.source.md", "text": "# Docs sign-in\n\nPut a docs site behind a password, keep some pages open to everyone, and limit\nothers to a group of readers. `aiui serve` and `aiui dev` enforce it; there is\nnothing to install and no account system to run.\n\n## A password for the whole site\n\n```yaml\ncontent:\n  docs:\n    dir: docs\n    auth:\n      password: env:DOCS_PASSWORD\n```\n\n```bash\naiui build\nDOCS_PASSWORD='a long passphrase' aiui serve\n```\n\nEvery page now asks for the password. A reader who opens any page gets a sign-in\npage in the site's own theme, at that URL, and lands on the page they asked for.\nThe session lasts seven days. `/__aiui/login` shows who is signed in and a\n**Sign out** button (link to it from `navbar.links` if you want one).\n\nPasswords are always written `env:NAME`: the build stores the variable's name,\nnever the password. Change the variable and restart to change the password;\nevery reader signed in with the old one is signed out.\n\n## Open pages\n\nMost docs want a public home and quickstart and the rest behind sign-in:\n\n```yaml\nauth:\n  password: env:DOCS_PASSWORD\n  public: [\"/\", quickstart, \"guides/*\"]\n```\n\n`public` lists page paths relative to the docs (`/` is the home page,\n`/docs/quickstart` also works) and patterns (`*` matches any part of a path). A\npage can also say it in its front matter:\n\n```markdown\n---\ntitle: Pricing\npublic: true\n---\n```\n\n`public: false` keeps a page behind sign-in when a pattern would open it, so\n`public: [\"*\"]` plus `public: false` on a few pages protects only those.\n\n## A password per reader\n\n```yaml\nauth:\n  password: env:DOCS_PASSWORD          # optional: a shared password\n  users:\n    alice: env:ALICE_PASSWORD\n    bob: env:BOB_PASSWORD\n```\n\nReaders sign in with their password alone; it tells the server who they are.\n\n## Groups\n\nGive readers groups, then name the groups a page is for:\n\n```yaml\nauth:\n  users:\n    alice: {password: env:ALICE_PASSWORD, groups: [partners]}\n```\n\n```markdown\n---\ntitle: Partner API\ngroups: [partners]\n---\n```\n\nA page with `groups` is for readers in at least one of them. To any other\nsigned-in reader it does not exist: a 404, and it is missing from their sidebar,\nsearch, `llms.txt`, MCP and Ask AI. A signed-out reader who opens it gets the\nsign-in page (they may be a member).\n\n## What is protected\n\nA page's rule covers everything made from it: its HTML (including the copy\ninside `\u003cnoscript\u003e`), its `.md` and `.source.md` files and `Accept:\ntext/markdown` answer, its social card under `/og/`, its Try it data and its RSS\nfeed. `docs-nav.json`, `search-index.json`, `llms.txt` and `llms-full.txt` (and\ntheir `/.well-known/` copies) hold only the pages the reader may read (so the\npages do not carry the navigation, as they do on a site without sign-in, and\nthe build writes no split search index, `search-index/`: search reads the cut\n`search-index.json`), and the\n[MCP server](ai-ready-docs.md#mcp-server), [Ask AI](ai-ready-docs.md#ask-ai),\n`/api/docs/search` and page feedback see only those pages. An AI tool that\nconnects to `/mcp` without the browser's cookie reads the open pages. The\nsitemap lists only open pages.\n\nCode, styles, fonts, images and `ui-config.json` are open to anyone, so open\npages render (do not put a secret in an image). Any other file (OpenAPI specs, a\nnav group's generated page, files you copied in) needs sign-in.\n\n## Security\n\n- Protected answers carry `Cache-Control: private`, so a shared cache never\n  hands one reader's page to another.\n- The session cookie is `HttpOnly`, `SameSite=Lax` and `Secure` over HTTPS\n  (also behind a proxy that sets `X-Forwarded-Proto`). It is signed with a key\n  derived from the reader's password.\n- Passwords are compared in constant time. Ten wrong passwords from one address\n  in ten minutes block that address for the rest of the ten minutes (429).\n- Sign-in and sign-out only accept a form posted from the site itself\n  (`AIUI_ALLOWED_ORIGINS` adds origins, as for the rest of aiui).\n- A password variable that is not set is logged as a warning; that reader\n  cannot sign in.\n\n## Static hosts\n\nSign-in needs the aiui server. A static host (GitHub Pages, a CDN) serves every\nfile of the build, so `aiui build` warns (7017) on a site with\n`content.docs.auth`; serve it with `aiui serve` ([deployment](deployment.md)).\n`aiui validate` reports front matter `public` or `groups` on a site without\n`content.docs.auth`, and a group no reader is in (7017). A docs folder served by `aiui run` uses the app's own\nsign-in instead ([deployment](deployment.md#auth-enforcement)).\n"}</script>
