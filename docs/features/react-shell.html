></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>React App Shell (`style: app`)</h1>
<p>The app shell is a React interface for the PraisonAIUI dashboard: a sidebar,</p>
<p>a header with a command palette (⌘K / Ctrl+K), a React chat and a host that</p>
<p>runs every existing dashboard page inside it. It is <strong>opt-in</strong> in this</p>
<p>release. The default style is still <code>dashboard</code> (the vanilla-JS dashboard),</p>
<p>and it renders exactly as it did in v0.3.153.</p>
<h2>Turn it on</h2>
<p>Any one of these:</p>
<p>| Where | How |</p>
<p>|---|---|</p>
<p>| YAML config | <code>style: app</code> |</p>
<p>| Python | <code>aiui.set_style("app")</code> before the server starts |</p>
<p>| CLI | <code>aiui run app.py --style app</code> |</p>
<p>| Environment | <code>AIUI_SHELL=app aiui run app.py</code> (alias: <code>AIUI_SHELL=react</code>) |</p>
<p><code>AIUI_SHELL=app</code> only changes the <code>dashboard</code> style (explicit or default) into</p>
<p><code>app</code>. Other styles (<code>chat</code>, <code>docs</code>, <code>agents</code>, <code>playground</code>, <code>custom</code>) are</p>
<p>never rewritten.</p>
<h3>Kill switch</h3>
<p><code>AIUI_SHELL=legacy</code> turns <code>app</code> back into <code>dashboard</code>, whatever the config</p>
<p>says. It is the documented way back once the default flips (see</p>
<p>flip criteria).</p>
<h2>What you get</h2>
<li><strong>Every page you have today.</strong> A page is resolved in this order:</li>
<p>1. a React page registered through the SDK (built-in ports such as chat, or</p>
<p>a UI plugin page);</p>
<p>2. a server-driven page (<code>register_page</code> with a handler, <code>@aiui.page</code>),</p>
<p>rendered from its <code>_components</code> tree as blocks;</p>
<p>3. otherwise the original dashboard view, mounted inside the shell.</p>
<p>Nothing disappears: dashboard plugins (<code>kanban</code>, <code>sample-board</code>,</p>
<p><code>video-studio</code>), <code>set_custom_js</code> and <code>custom.js</code> <code>registerView</code> pages keep</p>
<p>working as hosted pages.</p>
<li><strong>React chat</strong> over the WebSocket <code>/api/chat/ws</code> (streaming, tool calls,</li>
<p>reasoning, inline approvals and questions, attachments, Stop, history).</p>
<p>When the socket cannot open it falls back to Server-Sent Events (<code>POST /run</code>);</p>
<p>on SSE an agent's question says that answering needs a live connection.</p>
<li><strong>One markdown renderer</strong> (Streamdown) for chat and docs, with lazy code</li>
<p>highlighting (74 languages), Mermaid and KaTeX. In chat, external links open</p>
<p>in a new tab with <code>rel="noopener noreferrer nofollow"</code>, and remote images</p>
<p>are shown as a click-to-load placeholder naming their host (same-origin,</p>
<p><code>data:image/</code> and <code>blob:</code> images load directly).</p>
<li><strong>Approval toasts.</strong> A new approval anywhere raises a toast with a</li>
<p>"Review" button that opens the Approvals page. On the chat page the</p>
<p>approval is shown in the thread instead.</p>
<h2>Compatibility</h2>
<p>| Existing API | <code>dashboard</code> (default) | <code>app</code> (opt-in) |</p>
<p>|---|---|---|</p>
<p>| <code>register_page</code> with a handler / <code>@aiui.page</code> | unchanged | server-driven blocks page |</p>
<p>| <code>register_page</code> without a handler | unchanged | hosted <code>custom.js</code> <code>registerView</code> page |</p>
<p>| <code>register_page_action</code> | unchanged | the page's action endpoint |</p>
<p>| <code>set_pages</code>, <code>pages.enabled/disabled</code> | unchanged | applied |</p>
<p>| <code>set_custom_js</code> | unchanged | injected; runs when the hosted runtime loads |</p>
<p>| <code>set_custom_css</code> | unchanged | unchanged; HSL triples warn (see below) |</p>
<p>| <code>set_theme</code>, <code>set_brand_color</code>, <code>register_theme</code> | unchanged | converted to theme seeds |</p>
<p>| dashboard plugins | unchanged | hosted pages; <code>dashboard.plugins</code> allowlist honoured |</p>
<p>| <code>chat</code>, <code>docs</code>, <code>agents</code>, <code>playground</code>, <code>custom</code> styles | same app, now lazy-loaded with the new markdown renderer and tokens | n/a |</p>
<p>| <code>aiui build</code> static docs | same app; <code>index.js</code>/<code>index.css</code> get a <code>?v=</code> content hash | n/a |</p>
<h2>Theme seeds (migration)</h2>
<p>Colours now come from a small set of <strong>seeds</strong> (<code>--seed-accent</code>,</p>
<p><code>--seed-ink</code>, <code>--seed-paper</code>, …). Everything else (<code>--background</code>,</p>
<p><code>--primary</code>, sidebar and chart colours) is derived from them in CSS with</p>
<p><code>color-mix()</code>, separately for light and dark. Python emits seeds only</p>
<p>(<code>praisonaiui.themes.get_seed_theme_css(preset, radius, accent, density)</code>):</p>
<li>neutral presets (<code>zinc</code>, <code>slate</code>, <code>stone</code>, <code>gray</code>, <code>neutral</code>) are</li>
<p>monochrome: the accent follows the ink;</p>
<li>colour presets (<code>rose</code>, <code>blue</code>, …) seed the accent from the 600 shade in</li>
<p>light mode, and the button text colour is picked automatically for</p>
<p>at least 4.5:1 contrast;</p>
<li>radius presets are unchanged.</li>
<p><code>get_theme_css()</code> is kept for API compatibility but the compiler no longer</p>
<p>uses it. Runtime themes (<code>register_theme</code>, named presets) are converted to</p>
<p>seeds in the browser.</p>
<h3>Breaking change: bare HSL triples</h3>
<p>Listed in the <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md">changelog</a> for the release that ships the</p>
<p>app shell.</p>
<p>shadcn variables used to hold bare HSL triples that the stylesheet wrapped in</p>
<p><code>hsl()</code>. They are now complete colours:</p>
<p><code>aiui validate</code> warns (code 5001) when <code>site.custom_css</code> sets one of these</p>
<p>variables to a bare triple. Custom CSS and runtime themes that still use</p>
<p>triples are converted in the browser where possible, but update the CSS.</p>
<h2>Caching and deploys</h2>
<li>Code chunks are content-hashed (<code>assets/&lt;name&gt;-&lt;hash&gt;.js</code>) and served with</li>
<p><code>Cache-Control: immutable</code>. <code>assets/index.js</code> and <code>assets/index.css</code> keep</p>
<p>fixed names and are referenced as <code>?v=&lt;hash&gt;</code>, so a release never mixes an</p>
<p>old entry with new chunks.</p>
<li><code>aiui build</code> writes <code>index.html</code> (and every route page) with</li>
<p><code>/assets/index.js?v=&lt;sha256[:10]&gt;</code> and the same for <code>index.css</code>, and copies</p>
<p><code>aiui-manifest.json</code> next to it.</p>
<li>The docs deploy keeps the previous build's chunks, and with its ledger</li>
<p>(<code>aiui-carried.json</code>) older builds' chunks for <code>--keep-days</code> (default 2)</p>
<p>(<code>src/frontend/scripts/carry-forward-assets.mjs</code>), so a reader with an</p>
<p>old page open can still load its lazy parts.</p>
<li>A stale chunk that does fail to load triggers one automatic reload, and</li>
<p>only when the server's HTML (fetched past the cache) names another build.</p>
<p>The reload opens the page as <code>?aiui-build=&lt;build&gt;</code>, a URL no browser or CDN</p>
<p>cache holds, and the boot removes the parameter again. When the boot</p>
<p>chunks themselves cannot load, the page says so and offers Reload.</p>
<li>A docs page never waits for good: each markdown request has a time limit</li>
<p>for its headers and one for its body, a stalled request is sent again,</p>
<p>and a page that still cannot load shows "Couldn't load this page" with</p>
<p>Retry (<code>src/frontend/src/docs/docLoader.ts</code>).</p>
<li>Static files are sent gzip-compressed. Each file is compressed once per</li>
<p>version (path, mtime, size) in a worker thread and kept in memory (at most</p>
<p>64 MB), so a cold page load does not compress the bundle again on the</p>
<p>event loop. Range requests get the plain bytes. The page HTML,</p>
<p><code>/api/shell/manifest</code>, <code>/api/pages</code> and dashboard-plugin files are</p>
<p>compressed too.</p>
<li><code>aiui run app.py</code> serves the bundle from the installed package; it no</li>
<p>longer copies it into <code>./aiui</code> on every start (a <code>./aiui</code> left by an older</p>
<p>version is ignored for a chat app; delete it). A site built with</p>
<p><code>aiui run --config</code> is served gzip-compressed with `Cache-Control:</p>
<p>no-cache<code>, like </code>aiui serve<code>, and its own </code>assets/` (for example</p>
<p><code>theme.css</code>) is looked up after the package's.</p>
<li><code>aiui serve</code> answers a page's canonical URL (<code>/docs/x</code>) from <code>docs/x.html</code></li>
<p>directly, without a redirect to <code>/docs/x/</code>.</p>
<h2>Quality gates</h2>
<p>| Gate | Command (in <code>src/frontend</code>) | Limit |</p>
<p>|---|---|---|</p>
<p>| Types | <code>npx tsc -b</code> | 0 errors |</p>
<p>| Unit tests | <code>npm test</code>, <code>npm run test:scripts</code> | all pass |</p>
<p>| Size (gzip) | <code>npm run size</code> | shell boot ≤ 150 kB, chat route ≤ 143,579 B, /chat first-screen JS ≤ 257,066 B, <code>index.css</code> ≤ 32 kB, Streamdown ≤ 100 kB, shikiPlugin ≤ 55 kB, legacy App path ≤ 250 kB, docs Try it chunk ≤ 7,162 B, Pro fonts (Geist + Geist Mono woff2) ≤ 58 kB, Paper fonts (Newsreader + Source Sans 3 + JetBrains Mono woff2) ≤ 140 kB, all assets ≤ 11,173,363 B uncompressed |</p>
<p>| First screen stays light | <code>npm run check:closure</code> | no Streamdown, Shiki, Mermaid, KaTeX or assistant-ui in the static closure of the entry, the shell or the legacy App |</p>
<p>| Committed bundle | <code>npm run check:bundle</code> | <code>templates/frontend</code> equals a fresh build (pull requests that touch the frontend only) |</p>
<p>| Browser suites | <code>npm run test:e2e</code> | see <code>src/frontend/e2e/README.md</code> |</p>
<p>The docs style preloads Streamdown before first paint (about 98 kB gzip on</p>
<p>that path). The HTML parser it needs for raw HTML and docs components</p>
<p>(rehype-raw, about 48 kB) is a chunk of its own that only pages whose</p>
<p>markdown has HTML load (<code>markdown/rehypeRawGate.ts</code>). This is an accepted</p>
<p>exception until docs pages are pre-rendered at build time.</p>
<h2>When the default flips</h2>
<p>The default stays <code>dashboard</code> until <strong>all</strong> of these hold. Status as of this</p>
<p>release:</p>
<p>| # | Criterion | Status |</p>
<p>|---|---|---|</p>
<p>| 1 | Every page renders in the shell with status ready, 0 page errors and 0 leak delta in the Playwright sweep | <strong>Not met.</strong> Every manifest page is ready (a page that prints a JSON error body, or whose own data endpoint fails, now counts as an error; the Inspector was one and is fixed), 0 page errors, no page grows per visit, and every page opens by URL. Three pages keep a one-time residue after their first visit that does not grow, each listed with its reason in the sweep's <code>FIRST_VISIT_ALLOWANCE</code> (any other or larger residue fails): <code>chat</code> (13 window listeners and the composer's hidden measuring textarea), <code>chat-canvas</code> (one window listener) and <code>code-studio</code> (Monaco's interval, listener and two body nodes) |</p>
<p>| 2 | Chat parity complete | <strong>Not met.</strong> Done: streaming, tools, reasoning, approvals, ask, attachments, Stop, history, feedback, session rail, reconnect. Missing: message queue, channel messages with unread dots, context ring and compaction banner, cost chip, memory panel, floating and focus modes |</p>
<p>| 3 | Light mode correct on every page; owner signs off the light and dark screenshots | <strong>Not met.</strong> Awaiting owner review |</p>
<p>| 4 | Gates green: size, bundle-sync, entry closure, screenshots, pytest, tsc | <strong>Partly.</strong> All run green locally; screenshot comparison is not enforced in CI until Linux baselines exist |</p>
<p>| 5 | <code>set_custom_js</code>, <code>custom.js</code> <code>registerView</code> and the three bundled dashboard plugins work under <code>app</code> | <strong>Met in this build.</strong> The three dashboard plugins pass the sweep; the e2e app-shell server sets <code>set_custom_js</code> with a <code>registerView</code> for a page that also has a server handler, and the client view wins (as in the legacy dashboard) |</p>
<p>| 6 | One minor release with <code>app</code> opt-in, then two weeks with no open P1 from opt-in users | <strong>Not met</strong> |</p>
<h2>Plugins and trust</h2>
<p>See UI Plugins. Installing a plugin package means trusting it:</p>
<p>its Python runs in the server process and its JavaScript runs in the page</p>
<p>with no sandbox. An <code>iframe</code> page is the sandboxed option.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/react-shell.source.md", "text": "---\nnav_title: React app shell\n---\n\n# React App Shell (`style: app`)\n\nThe app shell is a React interface for the PraisonAIUI dashboard: a sidebar,\na header with a command palette (⌘K / Ctrl+K), a React chat and a host that\nruns every existing dashboard page inside it. It is **opt-in** in this\nrelease. The default style is still `dashboard` (the vanilla-JS dashboard),\nand it renders exactly as it did in v0.3.153.\n\n## Turn it on\n\nAny one of these:\n\n| Where | How |\n|---|---|\n| YAML config | `style: app` |\n| Python | `aiui.set_style(\"app\")` before the server starts |\n| CLI | `aiui run app.py --style app` |\n| Environment | `AIUI_SHELL=app aiui run app.py` (alias: `AIUI_SHELL=react`) |\n\n`AIUI_SHELL=app` only changes the `dashboard` style (explicit or default) into\n`app`. Other styles (`chat`, `docs`, `agents`, `playground`, `custom`) are\nnever rewritten.\n\n### Kill switch\n\n`AIUI_SHELL=legacy` turns `app` back into `dashboard`, whatever the config\nsays. It is the documented way back once the default flips (see\n[flip criteria](#when-the-default-flips)).\n\n```bash\nAIUI_SHELL=legacy aiui run app.py   # always the vanilla dashboard\n```\n\n## What you get\n\n- **Every page you have today.** A page is resolved in this order:\n    1. a React page registered through the SDK (built-in ports such as chat, or\n       a [UI plugin](./plugins.md) page);\n    2. a server-driven page (`register_page` with a handler, `@aiui.page`),\n       rendered from its `_components` tree as blocks;\n    3. otherwise the original dashboard view, mounted inside the shell.\n\n  Nothing disappears: dashboard plugins (`kanban`, `sample-board`,\n  `video-studio`), `set_custom_js` and `custom.js` `registerView` pages keep\n  working as hosted pages.\n- **React chat** over the WebSocket `/api/chat/ws` (streaming, tool calls,\n  reasoning, inline approvals and questions, attachments, Stop, history).\n  When the socket cannot open it falls back to Server-Sent Events (`POST /run`);\n  on SSE an agent's question says that answering needs a live connection.\n- **One markdown renderer** (Streamdown) for chat and docs, with lazy code\n  highlighting (74 languages), Mermaid and KaTeX. In chat, external links open\n  in a new tab with `rel=\"noopener noreferrer nofollow\"`, and remote images\n  are shown as a click-to-load placeholder naming their host (same-origin,\n  `data:image/` and `blob:` images load directly).\n- **Approval toasts.** A new approval anywhere raises a toast with a\n  \"Review\" button that opens the Approvals page. On the chat page the\n  approval is shown in the thread instead.\n\n## Compatibility\n\n| Existing API | `dashboard` (default) | `app` (opt-in) |\n|---|---|---|\n| `register_page` with a handler / `@aiui.page` | unchanged | server-driven blocks page |\n| `register_page` without a handler | unchanged | hosted `custom.js` `registerView` page |\n| `register_page_action` | unchanged | the page's action endpoint |\n| `set_pages`, `pages.enabled/disabled` | unchanged | applied |\n| `set_custom_js` | unchanged | injected; runs when the hosted runtime loads |\n| `set_custom_css` | unchanged | unchanged; HSL triples warn (see below) |\n| `set_theme`, `set_brand_color`, `register_theme` | unchanged | converted to theme seeds |\n| dashboard plugins | unchanged | hosted pages; `dashboard.plugins` allowlist honoured |\n| `chat`, `docs`, `agents`, `playground`, `custom` styles | same app, now lazy-loaded with the new markdown renderer and tokens | n/a |\n| `aiui build` static docs | same app; `index.js`/`index.css` get a `?v=` content hash | n/a |\n\n## Theme seeds (migration)\n\nColours now come from a small set of **seeds** (`--seed-accent`,\n`--seed-ink`, `--seed-paper`, …). Everything else (`--background`,\n`--primary`, sidebar and chart colours) is derived from them in CSS with\n`color-mix()`, separately for light and dark. Python emits seeds only\n(`praisonaiui.themes.get_seed_theme_css(preset, radius, accent, density)`):\n\n- neutral presets (`zinc`, `slate`, `stone`, `gray`, `neutral`) are\n  monochrome: the accent follows the ink;\n- colour presets (`rose`, `blue`, …) seed the accent from the 600 shade in\n  light mode, and the button text colour is picked automatically for\n  at least 4.5:1 contrast;\n- radius presets are unchanged.\n\n`get_theme_css()` is kept for API compatibility but the compiler no longer\nuses it. Runtime themes (`register_theme`, named presets) are converted to\nseeds in the browser.\n\n### Breaking change: bare HSL triples\n\nListed in the [changelog](https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md) for the release that ships the\napp shell.\n\nshadcn variables used to hold bare HSL triples that the stylesheet wrapped in\n`hsl()`. They are now complete colours:\n\n```css\n/* before (no longer valid) */\n:root { --primary: 221 83% 53%; }\n\n/* after: any CSS colour */\n:root { --primary: hsl(221 83% 53%); }\n\n/* better: set the seed, and every derived colour follows in both modes */\n:root { --seed-accent: hsl(221 83% 53%); }\n```\n\n`aiui validate` warns (code 5001) when `site.custom_css` sets one of these\nvariables to a bare triple. Custom CSS and runtime themes that still use\ntriples are converted in the browser where possible, but update the CSS.\n\n## Caching and deploys\n\n- Code chunks are content-hashed (`assets/\u003cname\u003e-\u003chash\u003e.js`) and served with\n  `Cache-Control: immutable`. `assets/index.js` and `assets/index.css` keep\n  fixed names and are referenced as `?v=\u003chash\u003e`, so a release never mixes an\n  old entry with new chunks.\n- `aiui build` writes `index.html` (and every route page) with\n  `/assets/index.js?v=\u003csha256[:10]\u003e` and the same for `index.css`, and copies\n  `aiui-manifest.json` next to it.\n- The docs deploy keeps the previous build's chunks, and with its ledger\n  (`aiui-carried.json`) older builds' chunks for `--keep-days` (default 2)\n  (`src/frontend/scripts/carry-forward-assets.mjs`), so a reader with an\n  old page open can still load its lazy parts.\n- A stale chunk that does fail to load triggers one automatic reload, and\n  only when the server's HTML (fetched past the cache) names another build.\n  The reload opens the page as `?aiui-build=\u003cbuild\u003e`, a URL no browser or CDN\n  cache holds, and the boot removes the parameter again. When the boot\n  chunks themselves cannot load, the page says so and offers Reload.\n- A docs page never waits for good: each markdown request has a time limit\n  for its headers and one for its body, a stalled request is sent again,\n  and a page that still cannot load shows \"Couldn't load this page\" with\n  Retry (`src/frontend/src/docs/docLoader.ts`).\n- Static files are sent gzip-compressed. Each file is compressed once per\n  version (path, mtime, size) in a worker thread and kept in memory (at most\n  64 MB), so a cold page load does not compress the bundle again on the\n  event loop. Range requests get the plain bytes. The page HTML,\n  `/api/shell/manifest`, `/api/pages` and dashboard-plugin files are\n  compressed too.\n- `aiui run app.py` serves the bundle from the installed package; it no\n  longer copies it into `./aiui` on every start (a `./aiui` left by an older\n  version is ignored for a chat app; delete it). A site built with\n  `aiui run --config` is served gzip-compressed with `Cache-Control:\n  no-cache`, like `aiui serve`, and its own `assets/` (for example\n  `theme.css`) is looked up after the package's.\n- `aiui serve` answers a page's canonical URL (`/docs/x`) from `docs/x.html`\n  directly, without a redirect to `/docs/x/`.\n\n## Quality gates\n\n| Gate | Command (in `src/frontend`) | Limit |\n|---|---|---|\n| Types | `npx tsc -b` | 0 errors |\n| Unit tests | `npm test`, `npm run test:scripts` | all pass |\n| Size (gzip) | `npm run size` | shell boot ≤ 150 kB, chat route ≤ 143,579 B, /chat first-screen JS ≤ 257,066 B, `index.css` ≤ 32 kB, Streamdown ≤ 100 kB, shikiPlugin ≤ 55 kB, legacy App path ≤ 250 kB, docs Try it chunk ≤ 7,162 B, Pro fonts (Geist + Geist Mono woff2) ≤ 58 kB, Paper fonts (Newsreader + Source Sans 3 + JetBrains Mono woff2) ≤ 140 kB, all assets ≤ 11,173,363 B uncompressed |\n| First screen stays light | `npm run check:closure` | no Streamdown, Shiki, Mermaid, KaTeX or assistant-ui in the static closure of the entry, the shell or the legacy App |\n| Committed bundle | `npm run check:bundle` | `templates/frontend` equals a fresh build (pull requests that touch the frontend only) |\n| Browser suites | `npm run test:e2e` | see `src/frontend/e2e/README.md` |\n\nThe docs style preloads Streamdown before first paint (about 98 kB gzip on\nthat path). The HTML parser it needs for raw HTML and docs components\n(rehype-raw, about 48 kB) is a chunk of its own that only pages whose\nmarkdown has HTML load (`markdown/rehypeRawGate.ts`). This is an accepted\nexception until docs pages are pre-rendered at build time.\n\n## When the default flips\n\nThe default stays `dashboard` until **all** of these hold. Status as of this\nrelease:\n\n| # | Criterion | Status |\n|---|---|---|\n| 1 | Every page renders in the shell with status ready, 0 page errors and 0 leak delta in the Playwright sweep | **Not met.** Every manifest page is ready (a page that prints a JSON error body, or whose own data endpoint fails, now counts as an error; the Inspector was one and is fixed), 0 page errors, no page grows per visit, and every page opens by URL. Three pages keep a one-time residue after their first visit that does not grow, each listed with its reason in the sweep's `FIRST_VISIT_ALLOWANCE` (any other or larger residue fails): `chat` (13 window listeners and the composer's hidden measuring textarea), `chat-canvas` (one window listener) and `code-studio` (Monaco's interval, listener and two body nodes) |\n| 2 | Chat parity complete | **Not met.** Done: streaming, tools, reasoning, approvals, ask, attachments, Stop, history, feedback, session rail, reconnect. Missing: message queue, channel messages with unread dots, context ring and compaction banner, cost chip, memory panel, floating and focus modes |\n| 3 | Light mode correct on every page; owner signs off the light and dark screenshots | **Not met.** Awaiting owner review |\n| 4 | Gates green: size, bundle-sync, entry closure, screenshots, pytest, tsc | **Partly.** All run green locally; screenshot comparison is not enforced in CI until Linux baselines exist |\n| 5 | `set_custom_js`, `custom.js` `registerView` and the three bundled dashboard plugins work under `app` | **Met in this build.** The three dashboard plugins pass the sweep; the e2e app-shell server sets `set_custom_js` with a `registerView` for a page that also has a server handler, and the client view wins (as in the legacy dashboard) |\n| 6 | One minor release with `app` opt-in, then two weeks with no open P1 from opt-in users | **Not met** |\n\n## Plugins and trust\n\nSee [UI Plugins](./plugins.md). Installing a plugin package means trusting it:\nits Python runs in the server process and its JavaScript runs in the page\nwith no sandbox. An `iframe` page is the sandboxed option.\n"}</script>
