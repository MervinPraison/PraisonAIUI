<p>This page summarises the expected install and runtime shape for PraisonAIUI in both modes.</p>
<h2>Install Matrix</h2>
<p>| Mode | Package install | Runtime dependency | Behaviour |</p>
<p>| --- | --- | --- | --- |</p>
<p>| Standalone UI | <code>pip install praisonaiui</code> | Optional SDK packages absent | Uses built-in local managers and fallbacks |</p>
<p>| Integrated (PraisonAI) | <code>pip install praisonaiui praisonai praisonaiagents</code> | SDK and wrapper available | Uses injected backends and SDK-aware managers |</p>
<h2>Backend injection (integrated mode)</h2>
<p>When hosted via <code>praisonai.integration.host_app.configure_host()</code>, the wrapper calls <code>praisonaiui.backends.set_backend()</code> for:</p>
<p>| Backend key | Feature area |</p>
<p>| --- | --- |</p>
<p>| <code>hooks</code> | Hooks dashboard |</p>
<p>| <code>workflows</code> | Workflow runs |</p>
<p>| <code>usage_query</code> / <code>usage_sink</code> | Usage analytics |</p>
<p>| <code>approvals_pending</code> / <code>approvals_policies</code> | HITL approvals |</p>
<p>| <code>jobs_store</code> / <code>jobs_executor</code> | Async jobs (optional) |</p>
<p>| <code>channel_bot</code> | Channel bots (optional) |</p>
<p>| <code>tool_resolver</code> | Agent tool name resolution (optional) |</p>
<p>Detect integrated mode in code: <code>praisonaiui.backends.is_integrated_mode()</code>.</p>
<h2>Documented SDK gaps (local fallback)</h2>
<p>These features work standalone with in-memory stores. Health responses include <code>sdk_gap: true</code>:</p>
<p>| Feature | Gap | Standalone behaviour |</p>
<p>| --- | --- | --- |</p>
<p>| <strong>nodes</strong> | No cluster API in praisonaiagents | In-memory node registry |</p>
<p>| <strong>auth</strong> | No SDK auth module | In-memory API keys / sessions |</p>
<p>| <strong>channels</strong> | Bot runtime via praisonai wrapper | In-memory channel registry; bots need <code>praisonai[bot]</code> |</p>
<p>| <strong>jobs</strong> | Mock success only when standalone and agent missing | Integrated mode fails job instead of fake success |</p>
<p>| <strong>realtime</strong> | WebRTC needs <code>OPENAI_API_KEY</code> | Mock stream standalone; degraded error when integrated without key |</p>
<p>| <strong>media / code</strong> | SDK paths optional | <code>status: simulated</code> standalone; <code>status: degraded</code> integrated on failure |</p>
<p>View gaps in the dashboard sidebar footer (<code>GET /api/health</code> → <code>sdk_gaps</code> array).</p>
<h2>Practical Differences</h2>
<li><strong>Session/data handling</strong>: standalone uses UI datastore fallback; integrated aligns with SDK-backed stores.</li>
<li><strong>Feature backends</strong>: standalone keeps in-memory/mock behaviour; integrated routes through injected factories.</li>
<li><strong>Lifecycle hooks</strong>: integrated mode can subscribe to SDK hooks (handoff, MCP lifecycle, tracing/eval stores).</li>
<h2>Recommendation</h2>
<p>Use standalone mode for local UI-only workflows. Use integrated mode when you need shared runtime state with PraisonAI agents, tools, tracing, approvals, and schedules.</p>
<p>See also backend-integration.md and praisonai-package-integration.md.</p></noscript></div>
