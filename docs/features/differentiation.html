<p>PraisonAIUI is a <strong>protocol-driven UI framework</strong> for building AI applications. This page explains how it differs from other popular tools.</p>
<h2>Quick Comparison</h2>
<p>| Feature | PraisonAIUI | Streamlit | Gradio |</p>
<p>|---------|-------------|-----------|--------|</p>
<p>| <strong>Architecture</strong> | Protocol-driven (SDK→JSON→Client) | Script re-run | Input→Output |</p>
<p>| <strong>UI Styles</strong> | 6 (chat, agents, dashboard, playground, docs, custom) | 1 | 1 |</p>
<p>| <strong>Components</strong> | 48 structured | ~30 widgets | ~20 blocks |</p>
<p>| <strong>Custom Pages</strong> | <code>@aiui.page()</code> decorator | Multipage apps | Tabs |</p>
<p>| <strong>Theme System</strong> | 22 presets + custom CSS variables | Limited | Limited |</p>
<p>| <strong>Agent-First</strong> | ✅ Built for agents | ❌ General | ❌ ML demos |</p>
<p>| <strong>Extensibility</strong> | Plugin architecture | ❌ | ❌ |</p>
<p>| <strong>YAML Config</strong> | ✅ Full config | ❌ | ❌ |</p>
<h2>vs Gradio</h2>
<h3>How Gradio Works</h3>
<p>Gradio is designed for ML demos with an <strong>input→output paradigm</strong>. You define inputs, a function, and outputs.</p>
<h3>How PraisonAIUI Works</h3>
<p>PraisonAIUI is designed for <strong>conversational AI</strong> with callbacks and structured components.</p>
<h3>Key Differences</h3>
<p>| Aspect | PraisonAIUI | Gradio |</p>
<p>|--------|-------------|--------|</p>
<p>| <strong>Paradigm</strong> | Conversational callbacks | Input→Output |</p>
<p>| <strong>Components</strong> | 48 structured (cards, tables, charts) | ~20 blocks |</p>
<p>| <strong>Dashboard</strong> | Full admin panel with pages | Tabs only |</p>
<p>| <strong>Agent Support</strong> | Built-in profiles, tools, memory | Manual |</p>
<p><strong>When to use PraisonAIUI</strong>: Chat agents, admin dashboards, multi-agent systems.</p>
<p><strong>When to use Gradio</strong>: ML model demos, quick input/output interfaces.</p>
