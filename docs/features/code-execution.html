<p><strong>Sandboxed code execution</strong> with language allowlists, behind a human approval. Runs Python through the SDK's <code>execute_code</code> (<code>praisonaiagents.tools.python_tools</code>), which carries <code>@require_approval(risk_level="critical")</code>. Every run waits until someone approves it in the <strong>Approvals</strong> page.</p>
<h2>Quick Start</h2>
<h2>How It Works</h2>
<p>1. Code is submitted with a target language. A language outside the <strong>allowlist</strong> (default: python, javascript, bash) is a 400; so is any language other than Python, because the SDK sandbox runs Python only.</p>
<p>2. Without <code>praisonaiagents</code> the response is <code>503</code> with <code>status: "degraded"</code>. Nothing runs, and nothing is simulated.</p>
<p>3. Otherwise the request goes through the SDK's own approval gate on <code>execute_code</code>, wired to the aiui approvals queue. A pending <code>execute_code</code> entry (risk <code>critical</code>, arguments = the exact code) appears in <code>GET /api/approvals/pending</code>, and the HTTP request waits for the decision without blocking the server.</p>
<p>4. <strong>Approve</strong> runs the code and returns <code>200</code>. <strong>Deny</strong>, or no answer within the SDK registry timeout (300 s by default), returns <code>403</code> with <code>status: "denied"</code>.</p>
<p>One run needs one approval. Only the entry the server created for that run counts: an entry created with <code>POST /api/approvals</code> does not unlock a run, and approving a run with <code>always: true</code> approves that run only (critical tools never get a standing approval).</p>
<p>To skip the human step on a trusted machine, opt out explicitly: add <code>execute_code</code> to the <code>auto_approve_tools</code> policy (<code>PUT /api/approvals/policies</code>; remove it to turn the gate back on) or set <code>PRAISONAI_AUTO_APPROVE=true</code> for the server process. Authentication is the server's job (<code>AUTH_ENFORCE</code>, <code>require_auth</code>, <code>AIUI_REQUIRE_TOKEN</code>): without credentials, the run and the approve/deny endpoints return 401.</p>
<h2>Configuration</h2>
<h2>REST API</h2>
<p>| Endpoint | Method | Description |</p>
<p>|----------|--------|-------------|</p>
<p>| <code>/api/code/languages</code> | GET | List supported languages |</p>
<p>| <code>/api/code/execute</code> | POST | Execute code in sandbox |</p>
