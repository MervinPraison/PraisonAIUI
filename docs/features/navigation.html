></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Navigation</h1>
<p><code>aiui build</code> turns the docs folder into the sidebar (<code>docs-nav.json</code>). YAML</p>
<p><code>navigation.tabs</code> then splits that sidebar into tabs.</p>
<h2>The Generated Sidebar</h2>
<p>Each folder becomes a section and each Markdown file an entry:</p>
<li>Inside a folder, pages sort by frontmatter <code>order</code>, then by file name (see</li>
<p>Content Sources).</p>
<li>A folder's section takes the title of its <code>index.md</code> (or another</li>
<p><code>indexFiles</code> name) and links to it; a folder without one is titled with</p>
<p>its name, title-cased. Link a folder's index page by the folder (<code>notes/</code>).</p>
<li>An entry's title is the frontmatter <code>title</code>, else the first <code>#</code> heading.</li>
<p>The generated tree looks like this:</p>
<p><code>content.docs.nav.mode</code> picks between this generated sidebar (<code>auto</code>, the</p>
<p>default) and one you list in YAML (below). Options for the generated sidebar:</p>
<p>Frontmatter <code>order</code> wins over <code>sort</code>. A folder's index page is its section's</p>
<p>own page (the label links there).</p>
<h2>A Sidebar at the Root</h2>
<p><code>navigation.pages</code> and <code>navigation.groups</code> list the sidebar in order, with no</p>
<p>tab or <code>nav.mode</code> needed:</p>
<p>These group keys work in tab groups too.</p>
<h2>Folding Groups</h2>
<p>Every group folds: click its label, or the chevron beside a label that links</p>
<p>to a page. Each reader's choice is remembered across reloads and visits. The</p>
<p>group holding the current page always opens. <code>interaction.drilldown: true</code></p>
<p>makes a group label with no page of its own open the group's first page.</p>
<h2>Directory Listings</h2>
<p><code>directory: card</code> (a card grid) or <code>accordion</code> (a row per page) lists a</p>
<p>group's pages with their descriptions at the end of the group's page. A group</p>
<p>with no <code>root</code> gets a generated page at <code>/docs/&lt;group-slug&gt;</code> (<code>Guides</code> is</p>
<p><code>/docs/guides</code>), or uses the page already there. <code>content.docs.nav.directory</code></p>
<p>does this for every folder of the generated sidebar.</p>
<h2>Breadcrumbs</h2>
<p>The line above a page title is the page's group. `styling.eyebrows:</p>
<p>breadcrumbs` shows every group above it, each with a page of its own linked.</p>
<p>Every page's HTML carries a schema.org <code>BreadcrumbList</code> for search engines.</p>
<h2>Checks</h2>
<p><code>aiui validate</code> and <code>aiui build</code> warn about a listed page name that matches no</p>
<p>page (code 2101, with the closest name; <code>aiui validate --strict</code> fails), a tab,</p>
<p>anchor or dropdown with nothing to open (2102) and about keys that</p>
<p>do nothing yet (1004: <code>nav.maxDepth</code>, <code>i18n.fallbackLocale</code>, <code>translationsDir</code>).</p>
<h2>A Sidebar You List (`mode: manual`)</h2>
<p>With <code>content.docs.nav.mode: manual</code> the sidebar comes from the tab groups:</p>
<p>each group is a section holding the pages it lists, in that order, whatever</p>
<p>folder they live in. A <code>pages</code> entry may itself be a group, which nests a</p>
<p>section (one level is the usual choice).</p>
<li>A page is named by its URL path under the docs base (<code>features/layouts</code>),</li>
<p>its file path without <code>.md</code> (<code>adr/0001-replay-view</code>, <code>adr/index</code>) or</p>
<p><code>index</code> for the home page. A name that matches no page is skipped (and</p>
<p>reported, see Checks).</p>
<li>A page listed twice appears once, where it is first listed.</li>
<li>Frontmatter <code>nav_title</code> gives a page a shorter sidebar title than its</li>
<p>heading (<code>nav_title: CLI</code> on a page titled "CLI API Reference").</p>
<li>Pages no group lists are still built and reachable by URL, but hidden: not</li>
<p>in any sidebar, search, <code>sitemap.xml</code> or <code>llms.txt</code> (see</p>
<p>Hidden pages). Leave a page out of the site with</p>
<p><code>content.docs.exclude</code> (see Content Sources).</p>
<li><code>hidden: true</code> on a group hides its pages the same way; on a tab it also</li>
<p>drops the tab from the header.</p>
<li><code>boost: 2</code> on a group ranks its pages higher in site search (0.1 to 10; a</li>
<p>page's own <code>boost</code> wins; see Search). With</p>
<p>tabs, search results can be filtered by tab.</p>
<li>The active tab is the one whose groups list the page; for a page no group</li>
<p>lists, the folder <code>prefix</code> decides as in auto mode, then the first tab.</p>
<h2>Sidebar Icons</h2>
<p>A group's <code>icon:</code> in the navigation YAML, or a page's frontmatter <code>icon:</code>,</p>
<p>puts a 16px line icon before its title in the sidebar and the phone drawer.</p>
<li>Any <a href="https://lucide.dev/icons">lucide icon</a> name (<code>flag</code>, <code>house</code>, or an</li>
<p>old name such as <code>home</code>), an emoji (<code>icon: "🚀"</code>) or an image URL</p>
<p>(<code>https://…</code> or <code>/icons/x.svg</code>). See Icons.</p>
<p><code>aiui validate</code> warns (7009) about a name that is not an icon.</p>
<li>Page icons work in both modes; group icons need <code>mode: manual</code>.</li>
<h2>Tabs</h2>
<p><code>navigation.tabs</code> groups the sidebar sections into tabs in the header. A</p>
<p>section belongs to the first group whose <code>group</code> name matches its title, whose</p>
<p><code>prefix</code> is its folder, or whose <code>pages</code> list one of its pages. The sidebar</p>
<p>shows only the active tab's sections, in the order of its groups; the active tab</p>
<p>follows the URL.</p>
<p>A section that no group of any tab claims is not shown while tabs are set.</p>
<p>In manual mode the groups are the sections, so each one belongs to its tab.</p>
<p>Clicking a tab opens its first page; the active tab follows the page you</p>
<p>are on. On phones the tabs move into the navigation drawer, where tapping</p>
<p>one shows its sidebar without leaving the page.</p>
<h3>Tab options</h3>
<p>| Key | On | Does |</p>
<p>|-----|----|------|</p>
<p>| <code>icon</code> | tab, menu item, anchor, dropdown | an icon before the name |</p>
<p>| <code>href</code> | tab, menu item, anchor, dropdown | a link instead of a sidebar (<code>url</code> still works on a tab) |</p>
<p>| <code>pages</code> | tab, menu item, anchor, dropdown | pages listed straight in it (before its <code>groups</code>) |</p>
<p>| <code>groups</code> | tab, menu item, anchor, dropdown | its sidebar sections |</p>
<p>| <code>hidden</code> | tab, menu item, anchor, dropdown | leaves the header and sidebar; its pages stay routable |</p>
<p>| <code>menu</code> | tab | items, each with its own sidebar or <code>href</code>; the tab opens the list |</p>
<p>| <code>description</code> | menu item, dropdown | a second line under the name |</p>
<p>| <code>tabs</code> | dropdown | header tabs shown while that dropdown is open |</p>
<h2>Anchors</h2>
<p>Anchors are links pinned at the top of the sidebar on every page. An anchor</p>
<p>with <code>href</code> links out; one with <code>pages</code> or <code>groups</code> opens its own sidebar,</p>
<p>like a tab. <code>navigation.global.anchors</code> takes the same entries and lists</p>
<p>them first.</p>
<h2>Dropdowns (Product Switcher)</h2>
<p><code>navigation.dropdowns</code> (also spelled <code>products</code>, with <code>product:</code> names) puts</p>
<p>a switcher at the top of the sidebar. Each entry opens its own sidebar, or</p>
<p>brings its own header <code>tabs</code>, so one site can hold several products.</p>
<p>Tabs, menu items, anchors and dropdowns share one rule: each part with</p>
<p>pages or groups gets its own sidebar, and the page you are on decides which</p>
<p>one is open. <code>aiui validate</code> warns about one with no pages, groups or</p>
<p><code>href</code> (code 2102) and about a listed page that does not exist (2101).</p>
<h2>Versions</h2>
<p><code>navigation.versions</code> publishes several versions of the docs side by side.</p>
<p>The default version is served at the docs root; every other version comes</p>
<p>from its own folder, with no page list needed:</p>
<p>| Key | Meaning |</p>
<p>|---|---|</p>
<p>| <code>version</code> | the name in the switcher; also the folder and URL segment (<code>v1</code>, <code>2.x</code>) |</p>
<p>| <code>default</code> | the version at the docs root (default: the first one) |</p>
<p>| <code>tag</code> | a badge after the name (<code>Latest</code>, <code>Beta</code>, <code>Deprecated</code>), up to 24 characters |</p>
<p>| <code>index</code> | <code>true</code> keeps an older version in the sitemap and <code>llms.txt</code> (default: only the default version) |</p>
<p>| <code>groups</code>, <code>pages</code>, <code>tabs</code> | the version's own sidebar and header tabs (with <code>nav.mode: manual</code>); without them the folder's pages form the sidebar |</p>
<p>| <code>hidden</code> | left out of the switcher; its pages stay routable |</p>
<p>A switcher at the top of the sidebar (and of the phone drawer) names the open</p>
<p>version. Picking another one opens the same page in it (<code>/docs/guide/setup</code></p>
<p>and <code>/docs/v1/guide/setup</code>), or that version's first page when it has no</p>
<p>such page. The sidebar, the pager, the header tabs and the site search show</p>
<p>the open version only; the top-level <code>tabs</code> and <code>dropdowns</code> belong to the</p>
<p>default version, and anchors show in every version.</p>
<p>An older version's page names the default version's same page as its</p>
<p>canonical URL and carries <code>robots: noindex</code>, so search engines send readers</p>
<p>to the current docs; its pages stay out of <code>sitemap.xml</code> and <code>llms.txt</code></p>
<p>unless the version sets <code>index: true</code>. A page's own <code>canonical</code> or <code>robots</code></p>
<p>front matter wins. <code>aiui validate</code> reports two versions with one name, more</p>
<p>than one default, and a version that lists a page from another version's</p>
<p>folder (code 7018).</p>
<h2>Languages</h2>
<p><code>navigation.languages</code> publishes translated docs. The default language is</p>
<p>served at the docs root; every other one comes from its own folder, named by</p>
<p>its code, with no page list needed:</p>
<p>| Key | Meaning |</p>
<p>|---|---|</p>
<p>| <code>language</code> | the language code (<code>fr</code>, <code>pt-BR</code>); also the folder and URL segment |</p>
<p>| <code>label</code> | the name in the switcher (default: the language's own name, <code>Français</code>) |</p>
<p>| <code>default</code> | the language at the docs root (default: the first one) |</p>
<p>| <code>index</code> | <code>true</code> lists its pages in <code>llms.txt</code> too (default: only the default language) |</p>
<p>| <code>groups</code>, <code>pages</code> | its own sidebar (with <code>nav.mode: manual</code>); without them its folder's pages form the sidebar |</p>
<p>| <code>hidden</code> | left out of the switcher and the translation links; its pages stay routable |</p>
<p>A switcher in the header (an icon on phones) opens the same page in the</p>
<p>other language (<code>/docs/guide/setup</code> and <code>/docs/fr/guide/setup</code>), or that</p>
<p>language's first page when the page is not translated yet. The sidebar, the</p>
<p>pager and the site search show the open language only. The reader's pick is</p>
<p>remembered, and on a first visit to the docs home the reader's browser</p>
<p>language (<code>fr-CA</code> finds <code>fr</code>) opens its translation; crawlers and other</p>
<p>automated browsers always get the default language. <code>navigation.languageRedirect: false</code></p>
<p>turns that redirect off.</p>
<p>Every page carries <code>&lt;html lang&gt;</code> and, when it has translations, a</p>
<p><code>&lt;link rel="alternate" hreflang&gt;</code> for each (with <code>x-default</code> on the default</p>
<p>language's page); <code>sitemap.xml</code> lists the same alternates. <code>llms.txt</code> and</p>
<p><code>llms-full.txt</code> hold the default language, and each other language gets its</p>
<p>own <code>llms-&lt;code&gt;.txt</code>.</p>
<p>With <code>navigation.versions</code> too, a language folder sits inside its version's</p>
<p>folder: <code>docs/v1/fr/</code> is served at <code>/docs/v1/fr/...</code>, and both switchers keep</p>
<p>the page. <code>aiui validate</code> reports two languages with one code, more than one</p>
<p>default, and a version folder inside a language folder such as <code>docs/fr/v1/</code></p>
<p>(code 7020).</p>
<h2>Header Links</h2>
<p><code>navbar</code> adds links and one primary button to the header. On phones they move</p>
<p>into the navigation drawer.</p>
<p>A link with <code>type</code> and no <code>label</code> shows the network's mark alone, named for</p>
<p>screen readers. Links to another site open in a new tab.</p>
<p>The star count needs no setup: the browser asks the public GitHub API once and</p>
<p>keeps the answer for six hours. If it cannot get one, the button shows the mark</p>
<p>and the label.</p>
<h2>Footer</h2>
<p><code>footer.socials</code> maps a network to a URL and draws its mark; <code>footer.links</code></p>
<p>adds columns of links above the bottom line.</p>
<p>Known keys: <code>github</code>, <code>gitlab</code>, <code>x</code> (or <code>twitter</code>), <code>discord</code>, <code>slack</code>,</p>
<p><code>linkedin</code>, <code>youtube</code>, <code>bluesky</code>, <code>mastodon</code>, <code>reddit</code>, <code>telegram</code>,</p>
<p><code>facebook</code>, <code>instagram</code>, <code>threads</code>, <code>medium</code>, <code>hacker-news</code>, <code>npm</code>,</p>
<p><code>website</code>, <code>email</code> (a <code>mailto:</code> URL), <code>rss</code> and <code>podcast</code>. Any other key whose</p>
<p>URL is on one of those sites gets that mark (`community:</p>
<p>https://discord.gg/x` shows Discord); the rest get a globe. Each mark is a link</p>
<p>named for its network.</p>
<h2>Banner</h2>
<p><code>banner</code> puts a strip above the header on every docs page:</p>
<p><code>banner: "Version 2 is out."</code> is the short form. A closed banner stays closed</p>
<p>for that reader until its content changes, so a new announcement shows again</p>
<p>with no key to bump.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/navigation.source.md", "text": "# Navigation\n\n`aiui build` turns the docs folder into the sidebar (`docs-nav.json`). YAML\n`navigation.tabs` then splits that sidebar into tabs.\n\n## The Generated Sidebar\n\nEach folder becomes a section and each Markdown file an entry:\n\n- Inside a folder, pages sort by frontmatter `order`, then by file name (see\n  [Content Sources](content-sources.md#frontmatter)).\n- A folder's section takes the title of its `index.md` (or another\n  `indexFiles` name) and links to it; a folder without one is titled with\n  its name, title-cased. Link a folder's index page by the folder (`notes/`).\n- An entry's title is the frontmatter `title`, else the first `#` heading.\n\nThe generated tree looks like this:\n\n```json\n{\n  \"items\": [\n    {\n      \"title\": \"Getting Started\",\n      \"path\": \"/docs/getting-started\",\n      \"children\": [\n        { \"title\": \"Installation\", \"path\": \"/docs/getting-started/installation\" },\n        { \"title\": \"Quick Start\", \"path\": \"/docs/getting-started/quickstart\" }\n      ]\n    }\n  ]\n}\n```\n\n`content.docs.nav.mode` picks between this generated sidebar (`auto`, the\ndefault) and one you list in YAML (below). Options for the generated sidebar:\n\n```yaml\ncontent:\n  docs:\n    indexFiles: [index.md, README.md, _index.md]   # files that name their folder\n    nav:\n      sort: alpha        # filesystem (default) | alpha (title) | date (frontmatter `date`, newest first)\n      collapsible: false # groups never fold (default: true)\n      directory: card    # card | accordion: list each folder's pages (Directory Listings)\n```\n\nFrontmatter `order` wins over `sort`. A folder's index page is its section's\nown page (the label links there).\n\n## A Sidebar at the Root\n\n`navigation.pages` and `navigation.groups` list the sidebar in order, with no\ntab or `nav.mode` needed:\n\n```yaml\nnavigation:\n  pages:\n    - index                   # a top-level page\n    - group: \"API\"\n      root: api/overview      # the group's own page: its label and breadcrumb link there\n      tag: \"New\"              # a badge after the label (up to 24 characters)\n      pages:\n        - api/auth\n        - group: \"Errors\"\n          expanded: false     # starts folded\n          pages: [api/errors]\n  groups:\n    - group: \"Guides\"\n      directory: card         # list the group's pages on its page\n      pages: [guide/setup, guide/deploy]\n```\n\nThese group keys work in tab groups too.\n\n## Folding Groups\n\nEvery group folds: click its label, or the chevron beside a label that links\nto a page. Each reader's choice is remembered across reloads and visits. The\ngroup holding the current page always opens. `interaction.drilldown: true`\nmakes a group label with no page of its own open the group's first page.\n\n```yaml\ninteraction:\n  drilldown: true\n```\n\n## Directory Listings\n\n`directory: card` (a card grid) or `accordion` (a row per page) lists a\ngroup's pages with their descriptions at the end of the group's page. A group\nwith no `root` gets a generated page at `/docs/\u003cgroup-slug\u003e` (`Guides` is\n`/docs/guides`), or uses the page already there. `content.docs.nav.directory`\ndoes this for every folder of the generated sidebar.\n\n## Breadcrumbs\n\nThe line above a page title is the page's group. `styling.eyebrows:\nbreadcrumbs` shows every group above it, each with a page of its own linked.\nEvery page's HTML carries a schema.org `BreadcrumbList` for search engines.\n\n```yaml\nstyling:\n  eyebrows: breadcrumbs   # section (default) | breadcrumbs\n```\n\n## Checks\n\n`aiui validate` and `aiui build` warn about a listed page name that matches no\npage (code 2101, with the closest name; `aiui validate --strict` fails), a tab,\nanchor or dropdown with nothing to open (2102) and about keys that\ndo nothing yet (1004: `nav.maxDepth`, `i18n.fallbackLocale`, `translationsDir`).\n\n## A Sidebar You List (`mode: manual`)\n\nWith `content.docs.nav.mode: manual` the sidebar comes from the tab groups:\neach group is a section holding the pages it lists, in that order, whatever\nfolder they live in. A `pages` entry may itself be a group, which nests a\nsection (one level is the usual choice).\n\n```yaml\ncontent:\n  docs:\n    dir: \"./docs\"\n    nav:\n      mode: manual\n\nnavigation:\n  tabs:\n    - tab: \"Guides\"\n      groups:\n        - group: \"App\"\n          pages:\n            - features/styles\n            - group: \"Layouts\"          # a nested section\n              pages:\n                - features/layouts\n                - features/layouts/chat-canvas\n        - group: \"Deployment\"\n          pages:\n            - features/deployment\n            - health-endpoints          # a page at the docs root\n    - tab: \"Project\"\n      groups:\n        - group: \"Decisions\"\n          pages:\n            - adr/index\n            - adr/0001-replay-view      # the file name works too\n```\n\n- A page is named by its URL path under the docs base (`features/layouts`),\n  its file path without `.md` (`adr/0001-replay-view`, `adr/index`) or\n  `index` for the home page. A name that matches no page is skipped (and\n  reported, see Checks).\n- A page listed twice appears once, where it is first listed.\n- Frontmatter `nav_title` gives a page a shorter sidebar title than its\n  heading (`nav_title: CLI` on a page titled \"CLI API Reference\").\n- Pages no group lists are still built and reachable by URL, but hidden: not\n  in any sidebar, search, `sitemap.xml` or `llms.txt` (see\n  [Hidden pages](seo.md#hidden-pages)). Leave a page out of the site with\n  `content.docs.exclude` (see [Content Sources](content-sources.md#includeexclude-patterns)).\n- `hidden: true` on a group hides its pages the same way; on a tab it also\n  drops the tab from the header.\n- `boost: 2` on a group ranks its pages higher in site search (0.1 to 10; a\n  page's own `boost` wins; see [Search](writing-docs.md#search)). With\n  tabs, search results can be filtered by tab.\n- The active tab is the one whose groups list the page; for a page no group\n  lists, the folder `prefix` decides as in auto mode, then the first tab.\n\n## Sidebar Icons\n\nA group's `icon:` in the navigation YAML, or a page's frontmatter `icon:`,\nputs a 16px line icon before its title in the sidebar and the phone drawer.\n\n```yaml\nnavigation:\n  tabs:\n    - tab: \"Get started\"\n      groups:\n        - group: \"Get started\"\n          icon: rocket\n          pages:\n            - getting-started/quickstart\n```\n\n```markdown\n---\ntitle: CLI\nicon: terminal\n---\n```\n\n- Any [lucide icon](https://lucide.dev/icons) name (`flag`, `house`, or an\n  old name such as `home`), an emoji (`icon: \"🚀\"`) or an image URL\n  (`https://…` or `/icons/x.svg`). See [Icons](writing-docs.md#icons).\n  `aiui validate` warns (7009) about a name that is not an icon.\n- Page icons work in both modes; group icons need `mode: manual`.\n\n## Tabs\n\n`navigation.tabs` groups the sidebar sections into tabs in the header. A\nsection belongs to the first group whose `group` name matches its title, whose\n`prefix` is its folder, or whose `pages` list one of its pages. The sidebar\nshows only the active tab's sections, in the order of its groups; the active tab\nfollows the URL.\n\n```yaml\nnavigation:\n  tabs:\n    - tab: \"Documentation\"\n      groups:\n        - group: \"Getting Started\"\n          icon: \"rocket\"\n          prefix: \"getting-started\"\n          pages:\n            - getting-started/installation\n            - getting-started/quickstart\n        - group: \"Features\"\n          prefix: \"features\"\n    - tab: \"API Reference\"\n      groups:\n        - group: \"API\"\n          prefix: \"api\"\n```\n\nA section that no group of any tab claims is not shown while tabs are set.\nIn manual mode the groups are the sections, so each one belongs to its tab.\n\nClicking a tab opens its first page; the active tab follows the page you\nare on. On phones the tabs move into the navigation drawer, where tapping\none shows its sidebar without leaving the page.\n\n### Tab options\n\n```yaml\nnavigation:\n  tabs:\n    - tab: \"Guides\"\n      icon: book-open                  # any icon (see Sidebar Icons)\n      pages: [index, quickstart]       # pages straight in the tab, no group needed\n    - tab: \"Blog\"\n      href: \"https://example.com/blog\" # a link out (opens in a new tab)\n    - tab: \"API\"\n      menu:                            # a small dropdown under the tab\n        - item: \"REST\"\n          description: \"HTTP endpoints\"\n          icon: globe\n          groups:\n            - group: \"REST\"\n              pages: [api/rest/users]\n        - item: \"SDKs\"\n          pages: [api/sdk/python, api/sdk/node]\n        - item: \"Status\"\n          href: \"https://status.example.com\"\n```\n\n| Key | On | Does |\n|-----|----|------|\n| `icon` | tab, menu item, anchor, dropdown | an icon before the name |\n| `href` | tab, menu item, anchor, dropdown | a link instead of a sidebar (`url` still works on a tab) |\n| `pages` | tab, menu item, anchor, dropdown | pages listed straight in it (before its `groups`) |\n| `groups` | tab, menu item, anchor, dropdown | its sidebar sections |\n| `hidden` | tab, menu item, anchor, dropdown | leaves the header and sidebar; its pages stay routable |\n| `menu` | tab | items, each with its own sidebar or `href`; the tab opens the list |\n| `description` | menu item, dropdown | a second line under the name |\n| `tabs` | dropdown | header tabs shown while that dropdown is open |\n\n## Anchors\n\nAnchors are links pinned at the top of the sidebar on every page. An anchor\nwith `href` links out; one with `pages` or `groups` opens its own sidebar,\nlike a tab. `navigation.global.anchors` takes the same entries and lists\nthem first.\n\n```yaml\nnavigation:\n  global:\n    anchors:\n      - anchor: \"Community\"\n        icon: users\n        href: \"https://example.com/forum\"\n  anchors:\n    - anchor: \"Changelog\"\n      icon: newspaper\n      pages: [changelog]\n```\n\n## Dropdowns (Product Switcher)\n\n`navigation.dropdowns` (also spelled `products`, with `product:` names) puts\na switcher at the top of the sidebar. Each entry opens its own sidebar, or\nbrings its own header `tabs`, so one site can hold several products.\n\n```yaml\nnavigation:\n  dropdowns:\n    - dropdown: \"Cloud\"\n      description: \"Hosted service\"\n      icon: cloud\n      tabs:\n        - tab: \"Guides\"\n          groups: [{ group: \"Cloud\", pages: [cloud/start, cloud/deploy] }]\n        - tab: \"API\"\n          pages: [cloud/api]\n    - dropdown: \"Self-hosted\"\n      description: \"Run it yourself\"\n      icon: server\n      groups:\n        - group: \"Install\"\n          pages: [self/install]\n```\n\nTabs, menu items, anchors and dropdowns share one rule: each part with\npages or groups gets its own sidebar, and the page you are on decides which\none is open. `aiui validate` warns about one with no pages, groups or\n`href` (code 2102) and about a listed page that does not exist (2101).\n\n## Versions\n\n`navigation.versions` publishes several versions of the docs side by side.\nThe default version is served at the docs root; every other version comes\nfrom its own folder, with no page list needed:\n\n```yaml\nnavigation:\n  versions:\n    - { version: v2, default: true, tag: Latest }   # docs/**  -\u003e  /docs/...\n    - { version: v1, tag: Deprecated }              # docs/v1/** -\u003e  /docs/v1/...\n```\n\n| Key | Meaning |\n|---|---|\n| `version` | the name in the switcher; also the folder and URL segment (`v1`, `2.x`) |\n| `default` | the version at the docs root (default: the first one) |\n| `tag` | a badge after the name (`Latest`, `Beta`, `Deprecated`), up to 24 characters |\n| `index` | `true` keeps an older version in the sitemap and `llms.txt` (default: only the default version) |\n| `groups`, `pages`, `tabs` | the version's own sidebar and header tabs (with `nav.mode: manual`); without them the folder's pages form the sidebar |\n| `hidden` | left out of the switcher; its pages stay routable |\n\nA switcher at the top of the sidebar (and of the phone drawer) names the open\nversion. Picking another one opens the same page in it (`/docs/guide/setup`\nand `/docs/v1/guide/setup`), or that version's first page when it has no\nsuch page. The sidebar, the pager, the header tabs and the site search show\nthe open version only; the top-level `tabs` and `dropdowns` belong to the\ndefault version, and anchors show in every version.\n\nAn older version's page names the default version's same page as its\ncanonical URL and carries `robots: noindex`, so search engines send readers\nto the current docs; its pages stay out of `sitemap.xml` and `llms.txt`\nunless the version sets `index: true`. A page's own `canonical` or `robots`\nfront matter wins. `aiui validate` reports two versions with one name, more\nthan one default, and a version that lists a page from another version's\nfolder (code 7018).\n\n## Languages\n\n`navigation.languages` publishes translated docs. The default language is\nserved at the docs root; every other one comes from its own folder, named by\nits code, with no page list needed:\n\n```yaml\nnavigation:\n  languages:\n    - { language: en, default: true }   # docs/**     -\u003e  /docs/...\n    - { language: fr }                  # docs/fr/**  -\u003e  /docs/fr/...\n    - { language: pt-BR, label: Português }\n```\n\n| Key | Meaning |\n|---|---|\n| `language` | the language code (`fr`, `pt-BR`); also the folder and URL segment |\n| `label` | the name in the switcher (default: the language's own name, `Français`) |\n| `default` | the language at the docs root (default: the first one) |\n| `index` | `true` lists its pages in `llms.txt` too (default: only the default language) |\n| `groups`, `pages` | its own sidebar (with `nav.mode: manual`); without them its folder's pages form the sidebar |\n| `hidden` | left out of the switcher and the translation links; its pages stay routable |\n\nA switcher in the header (an icon on phones) opens the same page in the\nother language (`/docs/guide/setup` and `/docs/fr/guide/setup`), or that\nlanguage's first page when the page is not translated yet. The sidebar, the\npager and the site search show the open language only. The reader's pick is\nremembered, and on a first visit to the docs home the reader's browser\nlanguage (`fr-CA` finds `fr`) opens its translation; crawlers and other\nautomated browsers always get the default language. `navigation.languageRedirect: false`\nturns that redirect off.\n\nEvery page carries `\u003chtml lang\u003e` and, when it has translations, a\n`\u003clink rel=\"alternate\" hreflang\u003e` for each (with `x-default` on the default\nlanguage's page); `sitemap.xml` lists the same alternates. `llms.txt` and\n`llms-full.txt` hold the default language, and each other language gets its\nown `llms-\u003ccode\u003e.txt`.\n\nWith `navigation.versions` too, a language folder sits inside its version's\nfolder: `docs/v1/fr/` is served at `/docs/v1/fr/...`, and both switchers keep\nthe page. `aiui validate` reports two languages with one code, more than one\ndefault, and a version folder inside a language folder such as `docs/fr/v1/`\n(code 7020).\n\n## Header Links\n\n`navbar` adds links and one primary button to the header. On phones they move\ninto the navigation drawer.\n\n```yaml\nnavbar:\n  links:\n    - label: \"Blog\"\n      href: \"https://example.com/blog\"\n      icon: newspaper       # optional: any icon value (lucide name, image URL, emoji)\n    - type: discord         # github | discord: the network's mark; no label needed\n      href: \"https://discord.gg/your-server\"\n  primary:\n    type: github            # button (default) | github | discord\n    href: \"https://github.com/your/repo\"\n```\n\nA link with `type` and no `label` shows the network's mark alone, named for\nscreen readers. Links to another site open in a new tab.\n\nThe star count needs no setup: the browser asks the public GitHub API once and\nkeeps the answer for six hours. If it cannot get one, the button shows the mark\nand the label.\n\n## Footer\n\n`footer.socials` maps a network to a URL and draws its mark; `footer.links`\nadds columns of links above the bottom line.\n\n```yaml\nfooter:\n  socials:\n    github: \"https://github.com/your/repo\"\n    x: \"https://x.com/you\"\n    discord: \"https://discord.gg/your-server\"\n    status: \"https://status.example.com\"   # any key: a globe named \"status\"\n  links:\n    - header: \"Company\"                    # optional\n      items:\n        - label: \"About\"\n          href: \"https://example.com/about\"\n```\n\nKnown keys: `github`, `gitlab`, `x` (or `twitter`), `discord`, `slack`,\n`linkedin`, `youtube`, `bluesky`, `mastodon`, `reddit`, `telegram`,\n`facebook`, `instagram`, `threads`, `medium`, `hacker-news`, `npm`,\n`website`, `email` (a `mailto:` URL), `rss` and `podcast`. Any other key whose\nURL is on one of those sites gets that mark (`community:\nhttps://discord.gg/x` shows Discord); the rest get a globe. Each mark is a link\nnamed for its network.\n\n## Banner\n\n`banner` puts a strip above the header on every docs page:\n\n```yaml\nbanner:\n  content: \"Version 2 is out. [Read the notes](/changelog)\"   # Markdown\n  dismissible: true      # a close button (default false)\n  type: warning          # info (default) | warning | success\n```\n\n`banner: \"Version 2 is out.\"` is the short form. A closed banner stays closed\nfor that reader until its content changes, so a new announcement shows again\nwith no key to bump.\n"}</script>
