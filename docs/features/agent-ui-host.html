></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Agent UI host — modular dashboard shell</h1>
<p>PraisonAIUI can host any AI agent backend behind a <strong>modular dashboard shell</strong>: pages, views, layout components, optional plugins, and branding — without forking the frontend.</p>
<h2>Architecture</h2>
<p><strong>Extension priority</strong> (first match wins):</p>
<p>1. <code>window.aiui.registerView(pageId, …)</code></p>
<p>2. Dashboard manifest plugins (<code>dashboard-plugins/*/manifest.json</code>)</p>
<p>3. Built-in view modules: <code>views/&lt;page id&gt;.js</code> for built-in pages, from <code>/api/shell/manifest</code> (a page's <code>source</code> and <code>kind</code> there decide; an app page under a built-in id renders its own content, also in the dashboard style)</p>
<p>4. Server <code>aiui.layout()</code> JSON from <code>@aiui.page()</code></p>
<p>5. <code>window.aiui.registerComponent(type, …)</code> inside <code>renderComponent</code></p>
<p>6. Generic JSON fallback viewer</p>
<h2>Video Studio</h2>
<p>For YAML scene authoring with an external PraisonAI Video engine, see Video Studio.</p>
<h2>Quick start (external agent)</h2>
<p>See <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/external-agent-dashboard/app.py"><code>examples/python/external-agent-dashboard/app.py</code></a>.</p>
<h2>`window.aiui` extension API</h2>
<p>| API | Purpose |</p>
<p>|-----|---------|</p>
<p>| <code>version</code> | Shell protocol version (<code>'1'</code>) |</p>
<p>| <code>registerView(pageId, renderFn, cleanup?)</code> | Replace or add a full page renderer |</p>
<p>| <code>registerComponent(type, renderFn)</code> | Override a layout component type |</p>
<p>| <code>registerSurfaceRenderer(surfaceId, renderFn)</code> | Custom A2UI surface renderer |</p>
<p>| <code>selectPage(pageId)</code> | Navigate programmatically (e.g. open full canvas) |</p>
<p>| <code>registerSlot(name, renderFn)</code> | Inject DOM into named slots |</p>
<p>| <code>sdk.fetchJSON(url, opts?)</code> | Authenticated fetch helper |</p>
<p>| <code>sdk.el(tag, attrs?, children?)</code> | Small DOM builder |</p>
<p>| <code>sdk.themeVar('--db-*', fallback?)</code> | Read theme CSS variables |</p>
<p>| <code>sdk.createBoard(root, { fetch, pollMs? })</code> | Live board with optional polling |</p>
<h3>Slots</h3>
<p>| Slot id | Where it renders |</p>
<p>|---------|------------------|</p>
<p>| <code>shell:sidebar:footer</code> | Bottom of sidebar (default: health hint) |</p>
<p>| <code>page:{pageId}:toolbar</code> | Right side of page header |</p>
<p>Register only what you need; omit slots you do not use.</p>
<h2>Layout components (Python → JS)</h2>
<p>Define pages with <code>@aiui.page()</code> returning <code>aiui.layout([...])</code>. Types are implemented once in <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/ui.py"><code>ui.py</code></a> and <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/plugins/dashboard.js"><code>dashboard.js</code></a>.</p>
<p><strong>Kanban / board:</strong> use <code>aiui.board(columns=[...])</code>. Columns contain <code>id</code>, <code>title</code>, and <code>cards</code> (from <code>aiui.card()</code> or dicts). The shell renders via <code>renderBoard</code>, composing existing card renderers (DRY).</p>
<h2>A2UI surfaces (agent-driven UI)</h2>
<p>Three tiers work together:</p>
<p>| Tier | Mechanism | Use case |</p>
<p>|------|-----------|----------|</p>
<p>| Dashboard | <code>aiui.layout()</code> → <code>_components</code> | Python-authored pages |</p>
<p>| A2UI | <code>send_a2ui_messages</code> → <code>SurfaceHost</code> | Agent-generated UI in chat/canvas |</p>
<p>| AG-UI | <code>POST /agui</code> SSE | CopilotKit / external clients |</p>
<p>Register an empty canvas page:</p>
<p>Or use <code>@aiui.surface_action("main")</code> for button callbacks.</p>
<p><strong>Full guide:</strong> A2UI canvas — chat-canvas split view, <code>send_a2ui_messages</code>, HTTP/CLI, <code>coerce_a2ui_tool_messages</code>, troubleshooting. Example: <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/30-a2ui-canvas/app.py"><code>examples/python/30-a2ui-canvas/</code></a>.</p>
<h2>Optional dashboard modules</h2>
<p>Load heavy built-ins only when listed:</p>
<p>This adds <code>jobs.js</code>, <code>auth.js</code>, or <code>api.js</code> to the plugin chain; their pages resolve to <code>views/&lt;page id&gt;.js</code> for built-in pages, from <code>/api/shell/manifest</code>. <code>feedback</code> is always available as a built-in view when the page is enabled.</p>
<h2>Third-party dashboard plugins</h2>
<p>Place folders under:</p>
<li><code>~/.praisonai/dashboard-plugins/{name}/</code></li>
<li>Or <code>src/praisonaiui/templates/frontend/dashboard-plugins/{name}/</code> (shipped examples)</li>
<p>Each plugin needs <code>manifest.json</code> + <code>index.js</code> (optional <code>styles.css</code>):</p>
<p>The server exposes:</p>
<li><code>GET /api/dashboard/plugins</code> — manifest list</li>
<li><code>GET /dashboard-plugins/{name}/{path}</code> — static assets</li>
<p>Plugins register views in <code>index.js</code>:</p>
<p>Sample: <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/dashboard-plugins/sample-board/"><code>sample-board</code></a>.</p>
<h2>Agent plugins vs dashboard plugins</h2>
<p>| System | Location | Purpose |</p>
<p>|--------|----------|---------|</p>
<p>| Agent plugins | <code>~/.praisonai/plugins/</code> | Python agent extensions |</p>
<p>| Dashboard plugins | <code>~/.praisonai/dashboard-plugins/</code> | JS UI tabs |</p>
<p>See PraisonAI package integration for backend wiring, jobs API, and deployment.</p>
<h2>Granular control — opt-in / opt-out</h2>
<p>| What you control | How | Example |</p>
<p>|------------------|-----|---------|</p>
<p>| UI mode | <code>aiui.set_style(...)</code> | <code>"dashboard"</code>, <code>"chat"</code>, <code>"docs"</code> |</p>
<p>| Sidebar pages | <code>aiui.set_pages([ids])</code> whitelist | <code>["chat", "sessions"]</code> |</p>
<p>| Hide built-ins | YAML <code>pages.disabled: [...]</code> | Blacklist in server |</p>
<p>| Sidebar on/off | <code>set_dashboard(sidebar=False)</code> | Chat-only full width |</p>
<p>| Page title bar | <code>set_dashboard(page_header=False)</code> | Cleaner surface |</p>
<p>| Optional modules | <code>set_dashboard(modules=[...])</code> | <code>["jobs"]</code> only |</p>
<p>| Third-party tabs | Install chosen <code>dashboard-plugins/</code> folders | Manifest per plugin |</p>
<p>| Shell chrome | <code>registerSlot</code> | Header/footer widgets |</p>
<p>| Look only | <code>set_theme</code>, <code>set_branding</code>, <code>set_custom_css</code> | White-label |</p>
<p>| Replace one page | <code>registerView(pageId, ...)</code> | Override built-in |</p>
<p>| Board UI | <code>aiui.board()</code> or plugin | Not in default nav |</p>
<p><strong>Note:</strong> <code>@aiui.page()</code> custom pages are <strong>not</strong> filtered by <code>set_pages()</code> — only built-in dashboard pages are. Remove custom pages from code to hide them.</p>
<h3>Example profiles</h3>
<p>CLI: <code>aiui pages ids</code> lists built-in page ids for whitelists.</p>
<h2>DRY rules for contributors</h2>
<p>1. Add new layout types in <strong><code>ui.py</code></strong> and one <code>case</code> in <strong><code>dashboard.js</code></strong>.</p>
<p>2. Page-specific UI belongs in **<code>plugins/views/*.js</code>**, delegating to shared modules (<code>jobs.js</code>, etc.) via thin wrappers.</p>
<p>3. Reuse <strong><code>_helpers.js</code></strong> (<code>pageToolbar</code>, <code>filterChips</code>, <code>searchInput</code>, <code>modalShell</code>, <code>toast</code>).</p>
<p>4. Boards compose <strong><code>card</code></strong> / <strong><code>columns</code></strong> — do not duplicate card markup in plugins.</p>

<p>| <a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/schema/models.py"><code>schema/models.py</code></a> | <code>DashboardConfig.modules</code>, <code>plugin_dirs</code> |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/agent-ui-host.source.md", "text": "---\nnav_title: Agent UI host\n---\n\n# Agent UI host — modular dashboard shell\n\nPraisonAIUI can host any AI agent backend behind a **modular dashboard shell**: pages, views, layout components, optional plugins, and branding — without forking the frontend.\n\n## Architecture\n\n```text\nYAML / Python config → server (pages API, plugins.json) → dashboard.js shell\n                              ↓\n  registerView / views/\u003cpage id\u003e.js (built-in pages) / layout JSON / registerComponent\n                              ↓\n                    renderComponent() + theme (--db-*)\n```\n\n**Extension priority** (first match wins):\n\n1. `window.aiui.registerView(pageId, …)`\n2. Dashboard manifest plugins (`dashboard-plugins/*/manifest.json`)\n3. Built-in view modules: `views/\u003cpage id\u003e.js` for built-in pages, from `/api/shell/manifest` (a page's `source` and `kind` there decide; an app page under a built-in id renders its own content, also in the dashboard style)\n4. Server `aiui.layout()` JSON from `@aiui.page()`\n5. `window.aiui.registerComponent(type, …)` inside `renderComponent`\n6. Generic JSON fallback viewer\n\n## Video Studio\n\nFor YAML scene authoring with an external PraisonAI Video engine, see [Video Studio](video-studio.md).\n\n## Quick start (external agent)\n\n```python\nimport praisonaiui as aiui\nfrom praisonaiui.server import create_app\n\naiui.set_style(\"dashboard\")\naiui.set_branding(title=\"Acme Agents\", logo=\"A\")\naiui.set_pages([\"chat\", \"tasks\", \"sessions\", \"config\"])\naiui.set_dashboard(modules=[\"jobs\"], sidebar=True, page_header=True)\n\n@aiui.page(\"tasks\", title=\"Tasks\", icon=\"📋\", group=\"Work\")\nasync def tasks_page():\n    return aiui.layout([\n        aiui.board(columns=[\n            {\"id\": \"todo\", \"title\": \"Todo\", \"cards\": [aiui.card(\"Review PR\", footer=\"agent-a\")]},\n            {\"id\": \"done\", \"title\": \"Done\", \"cards\": [aiui.card(\"Ship feature\")]},\n        ]),\n    ])\n\napp = create_app()\n```\n\nSee [`examples/python/external-agent-dashboard/app.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/external-agent-dashboard/app.py).\n\n## `window.aiui` extension API\n\n| API | Purpose |\n|-----|---------|\n| `version` | Shell protocol version (`'1'`) |\n| `registerView(pageId, renderFn, cleanup?)` | Replace or add a full page renderer |\n| `registerComponent(type, renderFn)` | Override a layout component type |\n| `registerSurfaceRenderer(surfaceId, renderFn)` | Custom A2UI surface renderer |\n| `selectPage(pageId)` | Navigate programmatically (e.g. open full canvas) |\n| `registerSlot(name, renderFn)` | Inject DOM into named slots |\n| `sdk.fetchJSON(url, opts?)` | Authenticated fetch helper |\n| `sdk.el(tag, attrs?, children?)` | Small DOM builder |\n| `sdk.themeVar('--db-*', fallback?)` | Read theme CSS variables |\n| `sdk.createBoard(root, { fetch, pollMs? })` | Live board with optional polling |\n\n### Slots\n\n| Slot id | Where it renders |\n|---------|------------------|\n| `shell:sidebar:footer` | Bottom of sidebar (default: health hint) |\n| `page:{pageId}:toolbar` | Right side of page header |\n\nRegister only what you need; omit slots you do not use.\n\n## Layout components (Python → JS)\n\nDefine pages with `@aiui.page()` returning `aiui.layout([...])`. Types are implemented once in [`ui.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/ui.py) and [`dashboard.js`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/plugins/dashboard.js).\n\n**Kanban / board:** use `aiui.board(columns=[...])`. Columns contain `id`, `title`, and `cards` (from `aiui.card()` or dicts). The shell renders via `renderBoard`, composing existing card renderers (DRY).\n\n## A2UI surfaces (agent-driven UI)\n\nThree tiers work together:\n\n| Tier | Mechanism | Use case |\n|------|-----------|----------|\n| Dashboard | `aiui.layout()` → `_components` | Python-authored pages |\n| A2UI | `send_a2ui_messages` → `SurfaceHost` | Agent-generated UI in chat/canvas |\n| AG-UI | `POST /agui` SSE | CopilotKit / external clients |\n\nRegister an empty canvas page:\n\n```python\n@aiui.page(\"agent-canvas\", title=\"Agent Canvas\", icon=\"🖼️\")\nasync def agent_canvas():\n    return {\"_surface\": {\"id\": \"main\", \"messages\": []}}\n```\n\nOr use `@aiui.surface_action(\"main\")` for button callbacks.\n\n**Full guide:** [A2UI canvas](a2ui-canvas.md) — chat-canvas split view, `send_a2ui_messages`, HTTP/CLI, `coerce_a2ui_tool_messages`, troubleshooting. Example: [`examples/python/30-a2ui-canvas/`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/30-a2ui-canvas/app.py).\n\n## Optional dashboard modules\n\nLoad heavy built-ins only when listed:\n\n```python\naiui.set_dashboard(modules=[\"jobs\", \"auth\", \"api\"])\n```\n\n```yaml\ndashboard:\n  modules: [jobs]\n```\n\nThis adds `jobs.js`, `auth.js`, or `api.js` to the plugin chain; their pages resolve to `views/\u003cpage id\u003e.js` for built-in pages, from `/api/shell/manifest`. `feedback` is always available as a built-in view when the page is enabled.\n\n## Third-party dashboard plugins\n\nPlace folders under:\n\n- `~/.praisonai/dashboard-plugins/{name}/`\n- Or `src/praisonaiui/templates/frontend/dashboard-plugins/{name}/` (shipped examples)\n\nEach plugin needs `manifest.json` + `index.js` (optional `styles.css`):\n\n```json\n{\n  \"name\": \"my-board\",\n  \"label\": \"My board\",\n  \"icon\": \"📋\",\n  \"tab\": { \"path\": \"/my-board\" },\n  \"entry\": \"index.js\"\n}\n```\n\nThe server exposes:\n\n- `GET /api/dashboard/plugins` — manifest list\n- `GET /dashboard-plugins/{name}/{path}` — static assets\n\nPlugins register views in `index.js`:\n\n```javascript\nwindow.aiui.registerView('my-board', async (container) =\u003e {\n  window.aiui.sdk.createBoard(container, {\n    fetch: async () =\u003e ({ columns: [...] }),\n  });\n});\n```\n\nSample: [`sample-board`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/dashboard-plugins/sample-board/).\n\n## Agent plugins vs dashboard plugins\n\n| System | Location | Purpose |\n|--------|----------|---------|\n| Agent plugins | `~/.praisonai/plugins/` | Python agent extensions |\n| Dashboard plugins | `~/.praisonai/dashboard-plugins/` | JS UI tabs |\n\nSee [PraisonAI package integration](praisonai-package-integration.md) for backend wiring, jobs API, and deployment.\n\n## Granular control — opt-in / opt-out\n\n| What you control | How | Example |\n|------------------|-----|---------|\n| UI mode | `aiui.set_style(...)` | `\"dashboard\"`, `\"chat\"`, `\"docs\"` |\n| Sidebar pages | `aiui.set_pages([ids])` whitelist | `[\"chat\", \"sessions\"]` |\n| Hide built-ins | YAML `pages.disabled: [...]` | Blacklist in server |\n| Sidebar on/off | `set_dashboard(sidebar=False)` | Chat-only full width |\n| Page title bar | `set_dashboard(page_header=False)` | Cleaner surface |\n| Optional modules | `set_dashboard(modules=[...])` | `[\"jobs\"]` only |\n| Third-party tabs | Install chosen `dashboard-plugins/` folders | Manifest per plugin |\n| Shell chrome | `registerSlot` | Header/footer widgets |\n| Look only | `set_theme`, `set_branding`, `set_custom_css` | White-label |\n| Replace one page | `registerView(pageId, ...)` | Override built-in |\n| Board UI | `aiui.board()` or plugin | Not in default nav |\n\n**Note:** `@aiui.page()` custom pages are **not** filtered by `set_pages()` — only built-in dashboard pages are. Remove custom pages from code to hide them.\n\n### Example profiles\n\n```python\n# Chat-only\naiui.set_style(\"dashboard\")\naiui.set_pages([\"chat\"])\naiui.set_dashboard(sidebar=False, page_header=False)\n\n# Ops console — no chat\naiui.set_pages([\"sessions\", \"agents\", \"logs\", \"config\", \"usage\", \"approvals\"])\n```\n\n```yaml\nstyle: dashboard\npages:\n  enabled: [chat, agents, memory, sessions]\ndashboard:\n  sidebar: true\n  pageHeader: true\n  modules: [jobs]\n  plugin_dirs: [/opt/my-agent/plugins]\n```\n\nCLI: `aiui pages ids` lists built-in page ids for whitelists.\n\n## DRY rules for contributors\n\n1. Add new layout types in **`ui.py`** and one `case` in **`dashboard.js`**.\n2. Page-specific UI belongs in **`plugins/views/*.js`**, delegating to shared modules (`jobs.js`, etc.) via thin wrappers.\n3. Reuse **`_helpers.js`** (`pageToolbar`, `filterChips`, `searchInput`, `modalShell`, `toast`).\n4. Boards compose **`card`** / **`columns`** — do not duplicate card markup in plugins.\n\n## Related files\n\n| File | Role |\n|------|------|\n| [`praisonai-package-integration.md`](praisonai-package-integration.md) | Praison backend wiring |\n| [`server.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/server.py) | Pages API, `set_dashboard`, plugin chain |\n| [`dashboard_plugins.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/dashboard_plugins.py) | Manifest discovery and static routes |\n| [`dashboard.js`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/templates/frontend/plugins/dashboard.js) | Shell, registries, renderers |\n| [`schema/models.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/schema/models.py) | `DashboardConfig.modules`, `plugin_dirs` |\n"}</script>
