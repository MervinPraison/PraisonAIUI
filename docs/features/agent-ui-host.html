<p>PraisonAIUI can host any AI agent backend behind a <strong>modular dashboard shell</strong>: pages, views, layout components, optional plugins, and branding — without forking the frontend.</p>
<h2>Architecture</h2>
<p><strong>Extension priority</strong> (first match wins):</p>
<p>1. <code>window.aiui.registerView(pageId, …)</code></p>
<p>2. Dashboard manifest plugins (<code>dashboard-plugins/*/manifest.json</code>)</p>
<p>3. Built-in view modules (<code>plugins/views/*.js</code> via <code>BUILTIN_VIEWS</code>)</p>
<p>4. Server <code>aiui.layout()</code> JSON from <code>@aiui.page()</code></p>
<p>5. <code>window.aiui.registerComponent(type, …)</code> inside <code>renderComponent</code></p>
<p>6. Generic JSON fallback viewer</p>
<h2>Video Studio</h2>
<p>For YAML scene authoring with an external PraisonAI Video engine, see Video Studio.</p>
<h2>Quick start (external agent)</h2>
<p>See <code>examples/python/external-agent-dashboard/app.py</code>.</p>
<h2>`window.aiui` extension API</h2>
<p>| API | Purpose |</p>
<p>|-----|---------|</p>
<p>| <code>version</code> | Shell protocol version (<code>'1'</code>) |</p>
<p>| <code>registerView(pageId, renderFn, cleanup?)</code> | Replace or add a full page renderer |</p>
<p>| <code>registerComponent(type, renderFn)</code> | Override a layout component type |</p>
<p>| <code>registerSurfaceRenderer(surfaceId, renderFn)</code> | Custom A2UI surface renderer |</p>
<p>| <code>selectPage(pageId)</code> | Navigate programmatically (e.g. open full canvas) |</p>
<p>| <code>registerSlot(name, renderFn)</code> | Inject DOM into named slots |</p>
<p>| <code>sdk.fetchJSON(url, opts?)</code> | Authenticated fetch helper |</p>
<p>| <code>sdk.el(tag, attrs?, children?)</code> | Small DOM builder |</p>
<p>| <code>sdk.themeVar('--db-*', fallback?)</code> | Read theme CSS variables |</p>
<p>| <code>sdk.createBoard(root, { fetch, pollMs? })</code> | Live board with optional polling |</p>
<h3>Slots</h3>
<p>| Slot id | Where it renders |</p>
<p>|---------|------------------|</p>
<p>| <code>shell:sidebar:footer</code> | Bottom of sidebar (default: health hint) |</p>
<p>| <code>page:{pageId}:toolbar</code> | Right side of page header |</p>
<p>Register only what you need; omit slots you do not use.</p>
<h2>Layout components (Python → JS)</h2>
<p>Define pages with <code>@aiui.page()</code> returning <code>aiui.layout([...])</code>. Types are implemented once in <code>ui.py</code> and <code>dashboard.js</code>.</p>
<p><strong>Kanban / board:</strong> use <code>aiui.board(columns=[...])</code>. Columns contain <code>id</code>, <code>title</code>, and <code>cards</code> (from <code>aiui.card()</code> or dicts). The shell renders via <code>renderBoard</code>, composing existing card renderers (DRY).</p>
<h2>A2UI surfaces (agent-driven UI)</h2>
<p>Three tiers work together:</p>
<p>| Tier | Mechanism | Use case |</p>
<p>|------|-----------|----------|</p>
<p>| Dashboard | <code>aiui.layout()</code> → <code>_components</code> | Python-authored pages |</p>
<p>| A2UI | <code>send_a2ui_messages</code> → <code>SurfaceHost</code> | Agent-generated UI in chat/canvas |</p>
<p>| AG-UI | <code>POST /agui</code> SSE | CopilotKit / external clients |</p>
<p>Register an empty canvas page:</p>
<p>Or use <code>@aiui.surface_action("main")</code> for button callbacks.</p>
<p><strong>Full guide:</strong> A2UI canvas — chat-canvas split view, <code>send_a2ui_messages</code>, HTTP/CLI, <code>coerce_a2ui_tool_messages</code>, troubleshooting. Example: <code>examples/python/30-a2ui-canvas/</code>.</p>
<h2>Optional dashboard modules</h2>
<p>Load heavy built-ins only when listed:</p>
<p>This adds <code>jobs.js</code>, <code>auth.js</code>, or <code>api.js</code> to the plugin chain and maps them in <code>BUILTIN_VIEWS</code>. <code>feedback</code> is always available as a built-in view when the page is enabled.</p>
<h2>Third-party dashboard plugins</h2>
<p>Place folders under:</p>
<li><code>~/.praisonai/dashboard-plugins/{name}/</code></li>
<li>Or <code>src/praisonaiui/templates/frontend/dashboard-plugins/{name}/</code> (shipped examples)</li>
<p>Each plugin needs <code>manifest.json</code> + <code>index.js</code> (optional <code>styles.css</code>):</p>
<p>The server exposes:</p>
<li><code>GET /api/dashboard/plugins</code> — manifest list</li>
<li><code>GET /dashboard-plugins/{name}/{path}</code> — static assets</li>
<p>Plugins register views in <code>index.js</code>:</p>
<p>Sample: <code>sample-board</code>.</p>
<h2>Agent plugins vs dashboard plugins</h2>
<p>| System | Location | Purpose |</p>
<p>|--------|----------|---------|</p>
<p>| Agent plugins | <code>~/.praisonai/plugins/</code> | Python agent extensions |</p>
<p>| Dashboard plugins | <code>~/.praisonai/dashboard-plugins/</code> | JS UI tabs |</p>
<p>See PraisonAI package integration for backend wiring, jobs API, and deployment.</p>
<h2>Granular control — opt-in / opt-out</h2>
<p>| What you control | How | Example |</p>
<p>|------------------|-----|---------|</p>
<p>| UI mode | <code>aiui.set_style(...)</code> | <code>"dashboard"</code>, <code>"chat"</code>, <code>"docs"</code> |</p>
<p>| Sidebar pages | <code>aiui.set_pages([ids])</code> whitelist | <code>["chat", "sessions"]</code> |</p>
<p>| Hide built-ins | YAML <code>pages.disabled: [...]</code> | Blacklist in server |</p>
<p>| Sidebar on/off | <code>set_dashboard(sidebar=False)</code> | Chat-only full width |</p>
<p>| Page title bar | <code>set_dashboard(page_header=False)</code> | Cleaner surface |</p>
<p>| Optional modules | <code>set_dashboard(modules=[...])</code> | <code>["jobs"]</code> only |</p>
<p>| Third-party tabs | Install chosen <code>dashboard-plugins/</code> folders | Manifest per plugin |</p>
<p>| Shell chrome | <code>registerSlot</code> | Header/footer widgets |</p>
<p>| Look only | <code>set_theme</code>, <code>set_branding</code>, <code>set_custom_css</code> | White-label |</p>
<p>| Replace one page | <code>registerView(pageId, ...)</code> | Override built-in |</p>
<p>| Board UI | <code>aiui.board()</code> or plugin | Not in default nav |</p>
<p><strong>Note:</strong> <code>@aiui.page()</code> custom pages are <strong>not</strong> filtered by <code>set_pages()</code> — only built-in dashboard pages are. Remove custom pages from code to hide them.</p>
<h3>Example profiles</h3>
<p>CLI: <code>aiui pages ids</code> lists built-in page ids for whitelists.</p>
<h2>DRY rules for contributors</h2>
<p>1. Add new layout types in <strong><code>ui.py</code></strong> and one <code>case</code> in <strong><code>dashboard.js</code></strong>.</p>
<p>2. Page-specific UI belongs in **<code>plugins/views/*.js</code>**, delegating to shared modules (<code>jobs.js</code>, etc.) via thin wrappers.</p>
<p>3. Reuse <strong><code>_helpers.js</code></strong> (<code>pageToolbar</code>, <code>filterChips</code>, <code>searchInput</code>, <code>modalShell</code>, <code>toast</code>).</p>
<p>4. Boards compose <strong><code>card</code></strong> / <strong><code>columns</code></strong> — do not duplicate card markup in plugins.</p>
