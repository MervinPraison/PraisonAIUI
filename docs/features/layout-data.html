></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Layout data: run ledger and artifacts</h1>
<p>Two built-in records serve data that only the selectable layouts read. Each lives in</p>
<p>its own feature module and mounts only while a layout that needs it is on offer:</p>
<p>| Record | Module | Serves layouts | Routes |</p>
<p>|---|---|---|---|</p>
<p>| <code>builtin.run-ledger</code> | <code>features/run_ledger.py</code> | <code>command</code>, <code>mission</code> | <code>/api/runs*</code> |</p>
<p>| <code>builtin.artifacts</code> | <code>features/artifacts.py</code> | <code>chat-canvas</code> | <code>/api/artifacts*</code> |</p>
<h2>When they are mounted</h2>
<li>Under <code>style: app</code> every layout is on offer by default, so both records are on.</li>
<li><code>layout.available</code> (YAML) or <code>aiui.set_layout(available=[...])</code> narrows the offer. With</li>
<p><code>available: [chat-canvas]</code> only <code>builtin.artifacts</code> mounts, and with <code>available: [mission]</code> only</p>
<p><code>builtin.run-ledger</code> does.</p>
<li>Under any other style (<code>dashboard</code>, the standalone default, or <code>chat</code>) no layout is on offer.</li>
<p>Both records are then <code>disabled</code> with the reason <code>no layout needs it</code> in</p>
<p><code>/api/plugins?origin=builtin</code>. Their modules are never imported and their routes answer 404.</p>
<li><code>extensions.enabled: [builtin.run-ledger]</code> mounts a record whatever the layouts are.</li>
<li><code>extensions.disabled</code> always wins.</li>
<p><code>builtin.artifacts</code> owns one page, <code>artifacts</code> (<code>shell_only</code>, <code>kind: native</code>,</p>
<p><code>layouts: [chat-canvas]</code>): every chat's artifacts, newest first, with their versions. The React</p>
<p>page is <code>layout-features/artifacts/ArtifactsPage</code> (chunk <code>lf-artifacts</code>), registered lazily by the</p>
<p>browser built-in <code>builtin.artifacts</code> (<code>src/frontend/src/builtin/artifacts.ts</code>) only while the</p>
<p>manifest lists the page. The shell shows it in the nav while Chat and Canvas is the frame, and its</p>
<p>URL (where Share links land, <code>/artifacts?session=…&amp;artifact=…&amp;v=…</code>) renders under any layout. Like</p>
<p>every <code>shell_only</code> page it reaches the app shell manifest only, never <code>/api/pages</code> or the</p>
<p>dashboard. <code>builtin.run-ledger</code> adds no page.</p>
<p>Every route is authenticated in all three auth modes, like any other <code>/api/*</code> route. None is</p>
<p>public.</p>
<h2>Run ledger</h2>
<p>The ledger keeps one record per chat run: its session, agent, start and end, status</p>
<p>(<code>running</code>, <code>waiting</code>, <code>completed</code>, <code>failed</code>, <code>cancelled</code>), its steps (<code>reasoning</code>, <code>tool</code>,</p>
<p><code>text</code>, <code>approval</code>, <code>handoff</code>), and the tokens, cost and model of the run's usage records. It adds</p>
<p>no wire event. A client reads the ledger after <code>run_completed</code>.</p>
<p>| Route | Returns |</p>
<p>|---|---|</p>
<p>| <code>GET /api/runs?after=&amp;agent=&amp;session_id=&amp;limit=</code> | <code>{runs: RunSummary[], count}</code>, newest first (<code>limit</code> 1–500, default 50) |</p>
<p>| <code>GET /api/runs/{run_id}</code> | <code>RunDetail</code> with its steps, or 404 |</p>
<p>| <code>GET /api/runs/kpis?window=today\|24h\|7d</code> | <code>RunKpis</code>; any other window is 400 |</p>
<p>| <code>GET /api/runs/agents</code> | <code>{agents: AgentStatus[]}</code>, running and waiting agents first |</p>
<p>The shapes are the ones in <code>src/frontend/src/sdk/layoutTypes.ts</code>: camelCase keys, times in epoch</p>
<p>milliseconds.</p>
<p><code>RunKpis</code> holds:</p>
<li><code>runs</code> and <code>runsDelta</code>, the change against the previous window of the same length;</li>
<li><code>successRate</code>, from 0 to 1, with cancelled runs left out;</li>
<li><code>cost</code> and <code>budget</code>;</li>
<li><code>p50Ms</code> and <code>p95Ms</code>, the latency of completed runs.</li>
<p><code>budget</code> is <code>finops.daily_cost_budget_usd</code> from the runtime config (Settings, FinOps &amp; Budgets),</p>
<p>multiplied by 7 for the <code>7d</code> window. It is left out when that value is unset or 0, or when</p>
<p><code>finops.enabled</code> is <code>false</code>.</p>
<p><strong>Tokens and cost per run.</strong> <code>usage.track_usage()</code> takes <code>run_id=</code>. When it is not given, it uses</p>
<p>the run the calling task is serving, from the <code>praisonaiui.features.chat.current_run_id</code> context</p>
<p>variable. The chat sets that variable for the whole run, and <code>PraisonAIProvider</code> passes it on.</p>
<p><code>POST /api/usage/track</code> accepts <code>run_id</code> in its body. A provider that records usage without a run</p>
<p>id is joined to the run by session and time window instead, and the run then carries</p>
<p><code>approximate: true</code>.</p>
<p><strong>Storage.</strong> Finished runs are held in memory (the newest 1000) and appended to</p>
<p><code>&lt;data dir&gt;/runs/ledger.jsonl</code>. The data dir is <code>PRAISONAI_HOME</code>, else <code>AIUI_DATA_DIR</code>, else</p>
<p><code>~/.praisonaiui</code>.</p>
<p>The append runs on a single writer thread, so the chat broadcast never waits on the disk. The</p>
<p>file is read back the first time a <code>/api/runs*</code> route is called, and it is compacted once it holds</p>
<p>more than twice the ring size.</p>
<h3>Observing chat events</h3>
<p>The ledger is fed by a hook that any server-side code can use:</p>
<p>The observer sees every event that <code>ChatManager.broadcast</code> sends, whether or not a client is</p>
<p>connected. After each run it also gets one <code>run_closed</code> event, which clients never see. By the</p>
<p>time it arrives, the provider has finished and its usage is tracked. Observers run inline on the</p>
<p>event loop, so they must be quick and must not change <code>event</code>. An observer that raises is logged</p>
<p>and skipped.</p>
<h2>Artifacts</h2>
<p>The browser derives artifacts from the chat: fenced code, tables, file and media elements, and</p>
<p>A2UI surfaces. The extraction rules live only in the client. The server stores what the client</p>
<p>sends: the index for each session, so the nav can count artifacts across sessions, and the</p>
<p>versions the user edited.</p>
<p>| Route | Does |</p>
<p>|---|---|</p>
<p>| <code>GET /api/artifacts?session_id=&amp;limit=</code> | The latest version of every key, newest first, without content: <code>{artifacts, count, sessions}</code> |</p>
<p>| <code>GET /api/artifacts/{session_id}</code> | Every version, with content: <code>{sessionId, artifacts}</code> |</p>
<p>| <code>PUT /api/artifacts/{session_id}/{key}</code> | Upserts a derived version, or adds a user edit: <code>{artifact}</code> |</p>
<p>| <code>DELETE /api/artifacts/{session_id}/{key}[?version=N]</code> | Removes one key, or one version of it |</p>
<p>| <code>DELETE /api/artifacts/{session_id}</code> | Removes the whole session |</p>
<p>Deleting a chat (<code>DELETE /sessions/{id}</code>, which the chat, the Sessions page and</p>
<p><code>aiui sessions delete</code> use) also deletes its artifacts.</p>
<p>The body of a <code>PUT</code> is an <code>Artifact</code>. <code>kind</code> is one of <code>code</code>, <code>table</code>, <code>markdown</code>, <code>file</code>,</p>
<p><code>image</code>, <code>pdf</code>, <code>video</code> or <code>a2ui</code>.</p>
<li>With <code>edited: true</code>, or with no <code>version</code>, the <code>PUT</code> adds the next version.</li>
<li>With a <code>version</code>, it replaces that version. If the user edited that version, the <code>PUT</code> is</li>
<p>refused with 409.</p>
<p>The limits are 512 KB of content for each version, 50 versions for each key (unedited versions</p>
<p>are dropped first), and 500 keys for each session.</p>
<p><code>url</code> must be a relative or same-origin path, or an <code>http:</code>, <code>https:</code>, <code>blob:</code> or <code>data:image/</code></p>
<p>URL, the same rule chat markdown uses. The server first normalises the URL the way a browser</p>
<p>does: it drops tab, CR and LF, and strips leading and trailing control characters and spaces. So</p>
<p><code>java\nscript:</code> is refused like <code>javascript:</code>. The normalised form is the one stored.</p>
<p>Each session is one JSON file under <code>&lt;data dir&gt;/artifacts/</code>, named by a hash of the session id.</p>
<p>Each write goes to a temporary file that is then renamed into place.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/layout-data.source.md", "text": "---\nnav_title: Run ledger and artifacts\n---\n\n# Layout data: run ledger and artifacts\n\nTwo built-in records serve data that only the selectable [layouts](layouts.md) read. Each lives in\nits own feature module and mounts only while a layout that needs it is on offer:\n\n| Record | Module | Serves layouts | Routes |\n|---|---|---|---|\n| `builtin.run-ledger` | `features/run_ledger.py` | `command`, `mission` | `/api/runs*` |\n| `builtin.artifacts` | `features/artifacts.py` | `chat-canvas` | `/api/artifacts*` |\n\n## When they are mounted\n\n- Under `style: app` every layout is on offer by default, so both records are on.\n- `layout.available` (YAML) or `aiui.set_layout(available=[...])` narrows the offer. With\n  `available: [chat-canvas]` only `builtin.artifacts` mounts, and with `available: [mission]` only\n  `builtin.run-ledger` does.\n- Under any other style (`dashboard`, the standalone default, or `chat`) no layout is on offer.\n  Both records are then `disabled` with the reason `no layout needs it` in\n  `/api/plugins?origin=builtin`. Their modules are never imported and their routes answer 404.\n- `extensions.enabled: [builtin.run-ledger]` mounts a record whatever the layouts are.\n- `extensions.disabled` always wins.\n\n`builtin.artifacts` owns one page, `artifacts` (`shell_only`, `kind: native`,\n`layouts: [chat-canvas]`): every chat's artifacts, newest first, with their versions. The React\npage is `layout-features/artifacts/ArtifactsPage` (chunk `lf-artifacts`), registered lazily by the\nbrowser built-in `builtin.artifacts` (`src/frontend/src/builtin/artifacts.ts`) only while the\nmanifest lists the page. The shell shows it in the nav while Chat and Canvas is the frame, and its\nURL (where Share links land, `/artifacts?session=…\u0026artifact=…\u0026v=…`) renders under any layout. Like\nevery `shell_only` page it reaches the app shell manifest only, never `/api/pages` or the\ndashboard. `builtin.run-ledger` adds no page.\n\nEvery route is authenticated in all three auth modes, like any other `/api/*` route. None is\npublic.\n\n## Run ledger\n\nThe ledger keeps one record per chat run: its session, agent, start and end, status\n(`running`, `waiting`, `completed`, `failed`, `cancelled`), its steps (`reasoning`, `tool`,\n`text`, `approval`, `handoff`), and the tokens, cost and model of the run's usage records. It adds\nno wire event. A client reads the ledger after `run_completed`.\n\n| Route | Returns |\n|---|---|\n| `GET /api/runs?after=\u0026agent=\u0026session_id=\u0026limit=` | `{runs: RunSummary[], count}`, newest first (`limit` 1–500, default 50) |\n| `GET /api/runs/{run_id}` | `RunDetail` with its steps, or 404 |\n| `GET /api/runs/kpis?window=today\\|24h\\|7d` | `RunKpis`; any other window is 400 |\n| `GET /api/runs/agents` | `{agents: AgentStatus[]}`, running and waiting agents first |\n\nThe shapes are the ones in `src/frontend/src/sdk/layoutTypes.ts`: camelCase keys, times in epoch\nmilliseconds.\n\n`RunKpis` holds:\n\n- `runs` and `runsDelta`, the change against the previous window of the same length;\n- `successRate`, from 0 to 1, with cancelled runs left out;\n- `cost` and `budget`;\n- `p50Ms` and `p95Ms`, the latency of completed runs.\n\n`budget` is `finops.daily_cost_budget_usd` from the runtime config (Settings, FinOps \u0026 Budgets),\nmultiplied by 7 for the `7d` window. It is left out when that value is unset or 0, or when\n`finops.enabled` is `false`.\n\n**Tokens and cost per run.** `usage.track_usage()` takes `run_id=`. When it is not given, it uses\nthe run the calling task is serving, from the `praisonaiui.features.chat.current_run_id` context\nvariable. The chat sets that variable for the whole run, and `PraisonAIProvider` passes it on.\n`POST /api/usage/track` accepts `run_id` in its body. A provider that records usage without a run\nid is joined to the run by session and time window instead, and the run then carries\n`approximate: true`.\n\n**Storage.** Finished runs are held in memory (the newest 1000) and appended to\n`\u003cdata dir\u003e/runs/ledger.jsonl`. The data dir is `PRAISONAI_HOME`, else `AIUI_DATA_DIR`, else\n`~/.praisonaiui`.\nThe append runs on a single writer thread, so the chat broadcast never waits on the disk. The\nfile is read back the first time a `/api/runs*` route is called, and it is compacted once it holds\nmore than twice the ring size.\n\n### Observing chat events\n\nThe ledger is fed by a hook that any server-side code can use:\n\n```python\nfrom praisonaiui.features.chat import add_event_observer\n\ndef on_event(session_id: str, event: dict) -\u003e None:\n    if event[\"type\"] == \"run_closed\":\n        print(event[\"run_id\"], event[\"status\"])  # completed | failed | cancelled\n\nremove = add_event_observer(on_event)   # call remove() to stop observing\n```\n\nThe observer sees every event that `ChatManager.broadcast` sends, whether or not a client is\nconnected. After each run it also gets one `run_closed` event, which clients never see. By the\ntime it arrives, the provider has finished and its usage is tracked. Observers run inline on the\nevent loop, so they must be quick and must not change `event`. An observer that raises is logged\nand skipped.\n\n## Artifacts\n\nThe browser derives artifacts from the chat: fenced code, tables, file and media elements, and\nA2UI surfaces. The extraction rules live only in the client. The server stores what the client\nsends: the index for each session, so the nav can count artifacts across sessions, and the\nversions the user edited.\n\n| Route | Does |\n|---|---|\n| `GET /api/artifacts?session_id=\u0026limit=` | The latest version of every key, newest first, without content: `{artifacts, count, sessions}` |\n| `GET /api/artifacts/{session_id}` | Every version, with content: `{sessionId, artifacts}` |\n| `PUT /api/artifacts/{session_id}/{key}` | Upserts a derived version, or adds a user edit: `{artifact}` |\n| `DELETE /api/artifacts/{session_id}/{key}[?version=N]` | Removes one key, or one version of it |\n| `DELETE /api/artifacts/{session_id}` | Removes the whole session |\n\nDeleting a chat (`DELETE /sessions/{id}`, which the chat, the Sessions page and\n`aiui sessions delete` use) also deletes its artifacts.\n\nThe body of a `PUT` is an `Artifact`. `kind` is one of `code`, `table`, `markdown`, `file`,\n`image`, `pdf`, `video` or `a2ui`.\n\n- With `edited: true`, or with no `version`, the `PUT` adds the next version.\n- With a `version`, it replaces that version. If the user edited that version, the `PUT` is\n  refused with 409.\n\nThe limits are 512 KB of content for each version, 50 versions for each key (unedited versions\nare dropped first), and 500 keys for each session.\n\n`url` must be a relative or same-origin path, or an `http:`, `https:`, `blob:` or `data:image/`\nURL, the same rule chat markdown uses. The server first normalises the URL the way a browser\ndoes: it drops tab, CR and LF, and strips leading and trailing control characters and spaces. So\n`java\\nscript:` is refused like `javascript:`. The normalised form is the one stored.\n\nEach session is one JSON file under `\u003cdata dir\u003e/artifacts/`, named by a hash of the session id.\nEach write goes to a temporary file that is then renamed into place.\n"}</script>
