<p>WordPress-style widget areas for placing UI components in layout zones via YAML configuration.</p>
<h2>Zone Layout</h2>
<h2>Configuration</h2>
<p>Use the <code>zones</code> property in your template configuration:</p>
<h2>Available Zones</h2>
<p>| Zone | Location | Description |</p>
<p>|------|----------|-------------|</p>
<p>| <code>header</code> | Top | Site header area |</p>
<p>| <code>topNav</code> | Below header | Secondary navigation |</p>
<p>| <code>hero</code> | Above main | Hero banners, announcements |</p>
<p>| <code>leftSidebar</code> | Left column | Navigation, filters |</p>
<p>| <code>main</code> | Center | Primary content |</p>
<p>| <code>rightSidebar</code> | Right column | TOC, widgets |</p>
<p>| <code>bottomNav</code> | Below main | Pagination, related |</p>
<p>| <code>footer</code> | Bottom | Footer widgets |</p>
<h2>Built-in Widgets</h2>
<h3>StatsCard</h3>
<p>Display metrics and statistics.</p>
<h3>QuickLinks</h3>
<p>Navigation links widget.</p>
<h3>Newsletter</h3>
<p>Email subscription form.</p>
<h3>HeroBanner</h3>
<p>Landing page hero section.</p>
<h3>SocialLinks</h3>
<p>Social media links.</p>
<h3>Copyright</h3>
<p>Copyright notice.</p>
<h2>Layouts Supporting Zones</h2>
<p>| Layout | Supported Zones |</p>
<p>|--------|-----------------|</p>
<p>| <code>FlexibleLayout</code> | All 8 zones |</p>
<p>| <code>ThreeColumnLayout</code> | rightSidebar only |</p>
<p>| <code>CenteredLayout</code> | hero only |</p>
<p>| <code>FullWidthLayout</code> | hero only |</p>
