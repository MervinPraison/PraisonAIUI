></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Mission Control layout</h1>
<p>Mission Control (<code>mission</code>) is the operations view of the app shell: every agent's status,</p>
<p>today's runs and cost, and what waits on you, before anything else. It is one of the built-in</p>
<p>selectable layouts (ADR 0003, record <code>builtin.layout-mission</code>).</p>
<p>A viewer can also pick it from the palette ("Switch layout: Mission Control") or Settings →</p>
<p>Appearance, and <code>?layout=mission</code> previews it for one tab.</p>
<h2>What is on screen</h2>
<p>| Where | Desktop (1024 px and up) | Phone (under 768 px) |</p>
<p>|---|---|---|</p>
<p>| Top | Site title, the <code>environment</code> badge, search (opens the command palette), provider health, the approvals bell with its count, theme | Site title with health and environment, search, the approvals bell (44 px buttons) |</p>
<p>| Navigation | A 216 px column: the layout's primary pages with counts (agents, runs today, waiting approvals as a warning badge), the other pages folded under 11px uppercase group headers, "More pages ⌘K"; the top bar's pill is the one status indicator ("Connected") | Bottom tabs: the first four primary pages (Overview, Agents, Approvals with its badge, Chat) and More, which opens a sheet with the rest of the nav and the recent chats |</p>
<p>| Home (<code>/overview</code>) | The ops overview: approval request cards, today's KPI strip, the agents (waiting first), recent runs | Approval cards first, then the KPI strip and "Tap an agent to open its chat" |</p>
<p>| Chat | The ops column (KPI strip, agent cards, the selected agent's sessions and New chat) beside the chat; a chat header with the session title, Running / Waiting for approval, the agent, run id and start time, Open runs and Stop run | The chat, with the approval banner above it |</p>
<p>| Any page | The approval banner while something waits; the page renders in the frame's outlet under a title row | The approval banner, then the page |</p>
<p>Tablet widths use the desktop frame without the ops column.</p>
<h3>Approvals everywhere</h3>
<p>Mission sets <code>meta.approvals: 'frame'</code>, so <code>builtin.approvals</code> stops toasting while Mission is on</p>
<p>screen: the frame shows every pending approval itself.</p>
<li><strong>Banner</strong>, on every page except the overview (which lists them) and the approvals page: the</li>
<p>oldest pending approval ("Coder needs your approval to continue", the exact call, its risk, how</p>
<p>long it has waited, how many more wait) with Review, Deny and Approve. When nothing is listed in</p>
<p><code>/api/approvals</code> but a run is paused on a gate in the open chat, the banner shows that gate on</p>
<p>the other pages with Open chat. The banner is a region named by its title, and only the title</p>
<p>is live: a screen reader announces it when an approval appears, not each tick of the timer.</p>
<li><strong>Nav badge and bell</strong>: the number of pending approvals.</li>
<li><strong>Agent card</strong>: an agent with a pending approval (listed, or a gate in the open chat) shows as</li>
<p>"Waiting for approval" with the call and a waiting timer, and is listed first.</p>
<li><strong>Overview</strong>: one request card per pending approval ("Needs approval · Coder wants to run a</li>
<p>command", the call, the reason, Deny / Approve, in the banner's order).</p>
<li><strong>Thread</strong>: the chat draws gates as approval cards (<code>meta.chat.approvals: 'card'</code>).</li>
<p>&lt;kbd&gt;⌘&lt;/kbd&gt;/&lt;kbd&gt;Ctrl&lt;/kbd&gt; &lt;kbd&gt;J&lt;/kbd&gt; moves focus to the banner's Approve button;</p>
<p>&lt;kbd&gt;⌘&lt;/kbd&gt;/&lt;kbd&gt;Ctrl&lt;/kbd&gt; &lt;kbd&gt;N&lt;/kbd&gt; starts a new chat. In a browser tab most browsers keep</p>
<p>&lt;kbd&gt;⌘&lt;/kbd&gt;/&lt;kbd&gt;Ctrl&lt;/kbd&gt; &lt;kbd&gt;N&lt;/kbd&gt; for a new window and the page never sees it; use the</p>
<p>ops column's New chat button there (the shortcut works in an installed app window).</p>
<h3>Run timeline</h3>
<p>Above each answer the chat shows the run's steps (<code>meta.chat.turnHeader</code>): Think, each tool by</p>
<p>name, Answer, Handoff → *agent* and Approval pending, each as wide as the time it took, with its</p>
<p>duration (a waiting gate counts up as <code>0:42</code>). The steps are derived in the browser from the</p>
<p>turn's own parts and their timing, so the timeline needs no server call.</p>
<h2>Data it reads</h2>
<p>| Data | Source | When it is missing |</p>
<p>|---|---|---|</p>
<p>| KPIs (runs today and the change, success rate, cost against the FinOps daily budget, p50 / p95 latency), agent status, recent runs | The <code>runs</code> layout data kind. Until a browser built-in provides it, the mission board reads the run ledger's routes itself (<code>GET /api/runs/kpis?window=today</code>, <code>/api/runs/agents</code>, <code>/api/runs?limit=10</code>), every 5 s while the tab is visible and on approval events, and stops when Mission is switched away | <code>builtin.run-ledger</code> off (the routes answer 404): "Run history is off on this server", no counts in the nav |</p>
<p>| Pending approvals | The <code>approvals</code> layout data kind (<code>builtin.approvals</code>, its own <code>/api/approvals/stream</code>) | No banner, no badge |</p>
<p>| Sessions and the open chat | The <code>sessions</code> and <code>chat</code> kinds (<code>builtin.chat</code>) | No session list or chat header details |</p>
<p>| Health pill | <code>GET /api/provider/health</code> every 30 s | "Status unknown" |</p>
<p>See layout data for the run ledger's routes and gating: it is mounted while</p>
<p><code>command</code> or <code>mission</code> is on offer.</p>
<h2>Chat presentation</h2>
<p>| <code>meta.chat</code> | Value |</p>
<p>|---|---|</p>
<p>| <code>sessions</code> | <code>frame</code> (the ops column draws the agent's sessions) |</p>
<p>| <code>thread</code> | <code>dense</code> |</p>
<p>| <code>approvals</code> | <code>card</code> |</p>
<p>| <code>turnHeader</code> | the run timeline (<code>RunTimeline</code>, from the mission board's entry) |</p>
<h2>Code and chunks</h2>
<p>| Piece | Path | Chunk | Loaded |</p>
<p>|---|---|---|---|</p>
<p>| Descriptor | <code>src/frontend/src/builtin/layouts/mission.ts</code> | boot (a few lines) | always (registers the layout; downloads nothing) |</p>
<p>| Frame | <code>src/frontend/src/app-layouts/mission/</code> | <code>layout-mission</code> | when Mission is on screen |</p>
<p>| Mission board | <code>src/frontend/src/layout-features/mission-board/</code> | <code>lf-mission-board</code> (one chunk) | with <code>import()</code> the first time the frame shows a board part (the run feed, the ops column, the overview, the banner or the run timeline); cached after that |</p>
<p>The frame imports only the SDK, <code>components/ui</code>, <code>lib</code> and the layout kit, and the board only with</p>
<p><code>import()</code> of its one entry, <code>mission-board/index.ts</code> (R17), so the board builds as a single chunk:</p>
<p>one request, not one per part. Budgets (<code>.size-limit.mjs</code>, gzip): <code>layout-mission</code> 13.2 kB (kit included),</p>
<p><code>lf-mission-board</code> 11.8 kB. Every board part sits behind its own error boundary: a part that fails to load</p>
<p>or render disappears and the frame keeps working.</p>
<h2>The ops overview page</h2>
<p>The home of Mission is <code>overview</code>. While no catalog page replaces it, the frame shows the ops</p>
<p>overview there itself. The <code>ops-overview</code> page record (<code>shell_only</code>, <code>layouts: [mission]</code>,</p>
<p><code>replaces: overview</code>) is <strong>(planned)</strong>: once the catalog carries it, <code>/overview</code> resolves to it under</p>
<p>Mission (shell <code>resolveRoutePage</code>) and the frame shows the same board for it.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/layouts/mission.source.md", "text": "---\nnav_title: Mission Control\n---\n\n# Mission Control layout\n\nMission Control (`mission`) is the operations view of the app shell: every agent's status,\ntoday's runs and cost, and what waits on you, before anything else. It is one of the built-in\n[selectable layouts](../layouts.md) (ADR 0003, record `builtin.layout-mission`).\n\n```yaml\nstyle: app\nlayout: mission                                   # or, with an environment badge:\nlayout: {default: mission, options: {mission: {environment: prod}}}\n```\n\n```python\naiui.set_style(\"app\")\naiui.set_layout(\"mission\", options={\"mission\": {\"environment\": \"prod\"}})\n```\n\nA viewer can also pick it from the palette (\"Switch layout: Mission Control\") or Settings →\nAppearance, and `?layout=mission` previews it for one tab.\n\n## What is on screen\n\n| Where | Desktop (1024 px and up) | Phone (under 768 px) |\n|---|---|---|\n| Top | Site title, the `environment` badge, search (opens the command palette), provider health, the approvals bell with its count, theme | Site title with health and environment, search, the approvals bell (44 px buttons) |\n| Navigation | A 216 px column: the layout's primary pages with counts (agents, runs today, waiting approvals as a warning badge), the other pages folded under 11px uppercase group headers, \"More pages ⌘K\"; the top bar's pill is the one status indicator (\"Connected\") | Bottom tabs: the first four primary pages (Overview, Agents, Approvals with its badge, Chat) and More, which opens a sheet with the rest of the nav and the recent chats |\n| Home (`/overview`) | The ops overview: approval request cards, today's KPI strip, the agents (waiting first), recent runs | Approval cards first, then the KPI strip and \"Tap an agent to open its chat\" |\n| Chat | The ops column (KPI strip, agent cards, the selected agent's sessions and New chat) beside the chat; a chat header with the session title, Running / Waiting for approval, the agent, run id and start time, Open runs and Stop run | The chat, with the approval banner above it |\n| Any page | The approval banner while something waits; the page renders in the frame's outlet under a title row | The approval banner, then the page |\n\nTablet widths use the desktop frame without the ops column.\n\n### Approvals everywhere\n\nMission sets `meta.approvals: 'frame'`, so `builtin.approvals` stops toasting while Mission is on\nscreen: the frame shows every pending approval itself.\n\n- **Banner**, on every page except the overview (which lists them) and the approvals page: the\n  oldest pending approval (\"Coder needs your approval to continue\", the exact call, its risk, how\n  long it has waited, how many more wait) with Review, Deny and Approve. When nothing is listed in\n  `/api/approvals` but a run is paused on a gate in the open chat, the banner shows that gate on\n  the other pages with Open chat. The banner is a region named by its title, and only the title\n  is live: a screen reader announces it when an approval appears, not each tick of the timer.\n- **Nav badge and bell**: the number of pending approvals.\n- **Agent card**: an agent with a pending approval (listed, or a gate in the open chat) shows as\n  \"Waiting for approval\" with the call and a waiting timer, and is listed first.\n- **Overview**: one request card per pending approval (\"Needs approval · Coder wants to run a\n  command\", the call, the reason, Deny / Approve, in the banner's order).\n- **Thread**: the chat draws gates as approval cards (`meta.chat.approvals: 'card'`).\n\n\u003ckbd\u003e⌘\u003c/kbd\u003e/\u003ckbd\u003eCtrl\u003c/kbd\u003e \u003ckbd\u003eJ\u003c/kbd\u003e moves focus to the banner's Approve button;\n\u003ckbd\u003e⌘\u003c/kbd\u003e/\u003ckbd\u003eCtrl\u003c/kbd\u003e \u003ckbd\u003eN\u003c/kbd\u003e starts a new chat. In a browser tab most browsers keep\n\u003ckbd\u003e⌘\u003c/kbd\u003e/\u003ckbd\u003eCtrl\u003c/kbd\u003e \u003ckbd\u003eN\u003c/kbd\u003e for a new window and the page never sees it; use the\nops column's New chat button there (the shortcut works in an installed app window).\n\n### Run timeline\n\nAbove each answer the chat shows the run's steps (`meta.chat.turnHeader`): Think, each tool by\nname, Answer, Handoff → *agent* and Approval pending, each as wide as the time it took, with its\nduration (a waiting gate counts up as `0:42`). The steps are derived in the browser from the\nturn's own parts and their timing, so the timeline needs no server call.\n\n## Data it reads\n\n| Data | Source | When it is missing |\n|---|---|---|\n| KPIs (runs today and the change, success rate, cost against the FinOps daily budget, p50 / p95 latency), agent status, recent runs | The `runs` layout data kind. Until a browser built-in provides it, the mission board reads the run ledger's routes itself (`GET /api/runs/kpis?window=today`, `/api/runs/agents`, `/api/runs?limit=10`), every 5 s while the tab is visible and on approval events, and stops when Mission is switched away | `builtin.run-ledger` off (the routes answer 404): \"Run history is off on this server\", no counts in the nav |\n| Pending approvals | The `approvals` layout data kind (`builtin.approvals`, its own `/api/approvals/stream`) | No banner, no badge |\n| Sessions and the open chat | The `sessions` and `chat` kinds (`builtin.chat`) | No session list or chat header details |\n| Health pill | `GET /api/provider/health` every 30 s | \"Status unknown\" |\n\nSee [layout data](../layout-data.md) for the run ledger's routes and gating: it is mounted while\n`command` or `mission` is on offer.\n\n## Chat presentation\n\n| `meta.chat` | Value |\n|---|---|\n| `sessions` | `frame` (the ops column draws the agent's sessions) |\n| `thread` | `dense` |\n| `approvals` | `card` |\n| `turnHeader` | the run timeline (`RunTimeline`, from the mission board's entry) |\n\n## Code and chunks\n\n| Piece | Path | Chunk | Loaded |\n|---|---|---|---|\n| Descriptor | `src/frontend/src/builtin/layouts/mission.ts` | boot (a few lines) | always (registers the layout; downloads nothing) |\n| Frame | `src/frontend/src/app-layouts/mission/` | `layout-mission` | when Mission is on screen |\n| Mission board | `src/frontend/src/layout-features/mission-board/` | `lf-mission-board` (one chunk) | with `import()` the first time the frame shows a board part (the run feed, the ops column, the overview, the banner or the run timeline); cached after that |\n\nThe frame imports only the SDK, `components/ui`, `lib` and the layout kit, and the board only with\n`import()` of its one entry, `mission-board/index.ts` (R17), so the board builds as a single chunk:\none request, not one per part. Budgets (`.size-limit.mjs`, gzip): `layout-mission` 13.2 kB (kit included),\n`lf-mission-board` 11.8 kB. Every board part sits behind its own error boundary: a part that fails to load\nor render disappears and the frame keeps working.\n\n## The ops overview page\n\nThe home of Mission is `overview`. While no catalog page replaces it, the frame shows the ops\noverview there itself. The `ops-overview` page record (`shell_only`, `layouts: [mission]`,\n`replaces: overview`) is **(planned)**: once the catalog carries it, `/overview` resolves to it under\nMission (shell `resolveRoutePage`) and the frame shows the same board for it.\n"}</script>
