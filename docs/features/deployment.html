<h2>Environment Variables</h2>
<p>| Variable | Default | Description |</p>
<p>|----------|---------|-------------|</p>
<p>| <code>AIUI_DATA_DIR</code> | <code>~/.praisonaiui</code> | Data directory for config, sessions, logs |</p>
<p>| <code>AIUI_PORT</code> | <code>8082</code> | Server port (Docker only) |</p>
<p>| <code>AIUI_HOST</code> | <code>0.0.0.0</code> | Server bind address (Docker only) |</p>
<p>| <code>AUTH_ENFORCE</code> | <code>false</code> | Enforce Bearer token auth on every route except the public surface (see below) |</p>
<p>| <code>AIUI_ALLOWED_ORIGINS</code> | — | Comma-separated origins allowed to call the server from another site (CORS and cross-site requests); <code>*</code> allows any |</p>
<p>| <code>AIUI_ALLOWED_HOSTS</code> | — | Comma-separated host names the server answers to when reached on a loopback or private address (<code>.example.com</code> also matches subdomains); <code>*</code> turns the check off |</p>
<p>| <code>OPENAI_API_KEY</code> | — | OpenAI API key for LLM provider |</p>
<h3>Auth Enforcement</h3>
<p>When <code>AUTH_ENFORCE=true</code>, every route requires a valid Bearer token in the <code>Authorization</code> header: <code>/api/*</code>, and also <code>/sessions</code>, <code>/run</code>, <code>/cancel</code>, <code>/agents/{id}/runs</code>, <code>/teams/*</code>, <code>/v1/*</code> (OpenAI-compatible), <code>/agui</code> and any route a plugin adds. Only the public surface answers without one (deny by default):</p>
<p><strong>Public paths</strong> (always accessible without auth):</p>
<li><code>/health</code>, <code>/health/live</code>, <code>/health/ready</code>, <code>/api/health</code> — health checks</li>
<li><code>/api/auth/login</code>, <code>/login</code> — login endpoints</li>
<li><code>/api/protocol</code>, <code>/api/protocol/negotiate</code> — protocol discovery</li>
<li>the HTML page for a browser navigation (<code>/</code>, <code>/chat</code>, …; under <code>style: app</code></li>
<p><code>/sessions</code> and <code>/agents</code> too, but only as the page, never their JSON)</p>
<li>static code: <code>/assets/*</code>, <code>/plugins/*</code>, <code>/_aiui/externals/*</code>, <code>/_plugins/*</code>,</li>
<p><code>/icon.svg</code>, <code>/manifest.json</code>, <code>/sw.js</code>, <code>/custom.js</code>, <code>/ui-config.json</code></p>
<p>WebSocket handshakes are gated too (all of them). Browsers cannot send an</p>
<p><code>Authorization</code> header on a WebSocket, so the UI first exchanges its key for a</p>
<p>single-use ticket (<code>POST /api/auth/ws-ticket</code>, valid 60 s) and connects with</p>
<p><code>?ticket=</code>. Clients that cannot do that may still send <code>?token=&lt;key&gt;</code>; it is</p>
<p>redacted from the server's access log.</p>
<p>The other auth modes gate WebSockets as well: URL-token mode</p>
<p>(<code>AIUI_REQUIRE_TOKEN=1</code>) accepts its session cookie, a Bearer header, <code>?token=</code></p>
<p>or a ticket; <code>create_app(require_auth=True)</code> / YAML <code>auth.requireAuth</code> checks</p>
<p>session tokens on every route and socket except the public surface above.</p>
<h3>Self-registration under `requireAuth`</h3>
<p>A token from <code>POST /register</code> passes the <code>requireAuth</code> check, so registration is</p>
<p>closed by default. <code>POST /register</code> is accepted only:</p>
<li>for the <strong>first user</strong>: while no account exists (and no login, password,</li>
<p>header or OAuth callback is registered), the first registration creates it;</p>
<li>from a <strong>signed-in user</strong> (<code>Authorization: Bearer &lt;session token&gt;</code>), to add</li>
<p>an account;</p>
<li>for <strong>anyone</strong> when the config opts in:</li>
<p>(<code>create_app(config={"auth": {"requireAuth": True, "allowSignup": True}})</code> from</p>
<p>Python.) Otherwise it returns <code>403 {"error": "Registration is closed"}</code>.</p>
<p>Accounts live in memory, so after a restart the first-user window is open</p>
<p>again until someone registers; create the admin in your app at startup</p>
<p>(<code>praisonaiui.auth.register_user("admin", password)</code>) to close it. Under</p>
<p><code>AUTH_ENFORCE</code> and URL-token mode <code>/register</code> already needs the API key or URL</p>
<p>token, as before; with no auth mode it stays open.</p>

<h2>Security</h2>
<h3>Auth Modes</h3>
<p>AIUI supports multiple authentication modes:</p>
<p>| Mode | Description |</p>
<p>|------|-------------|</p>
<p>| <code>none</code> | No authentication (default) |</p>
<p>| <code>api_key</code> | API key in <code>X-API-Key</code> header or <code>api_key</code> query param |</p>
<p>| <code>session</code> | Session token in <code>Authorization: Bearer &lt;token&gt;</code> header |</p>
<p>| <code>password</code> | Username/password login |</p>
<h3>API Key Management</h3>
<h3>Cross-site requests</h3>
<p>By default the server only serves its own pages: responses carry no CORS</p>
<p>headers, and a page on another site can neither open a WebSocket to it nor</p>
<p>send it a state-changing request (<code>POST</code>/<code>PUT</code>/<code>PATCH</code>/<code>DELETE</code>, including</p>
<p><code>text/plain</code> "simple" requests that skip the CORS preflight). The check uses</p>
<p>the browser's <code>Sec-Fetch-Site</code> header, so it works behind a reverse proxy that</p>
<p>rewrites <code>Host</code>; without that header the <code>Origin</code> is compared with <code>Host</code> and</p>
<p><code>X-Forwarded-Host</code>. Requests with neither header (curl, SDK clients) are not</p>
<p>affected. A local dev server (Vite on another port) talking to a local server</p>
<p>is allowed.</p>
<p>To let another site call the server (an embedded widget, a separate frontend),</p>
<p>list its origin:</p>
<h3>Host names (DNS rebinding)</h3>
<p>A server reached on a loopback or private address (<code>127.0.0.1</code>, <code>192.168.x.x</code>,</p>
<p>a Docker bridge) only answers requests whose <code>Host</code> is an IP address,</p>
<p><code>localhost</code> / <code>*.localhost</code>, a <code>*.local</code> name, the machine's own hostname, or a</p>
<p>name listed in <code>AIUI_ALLOWED_HOSTS</code>. Anything else gets <code>400 Host not allowed</code></p>
<p>(a WebSocket is closed with code 1008). This stops DNS rebinding, where a</p>
<p>website points its own domain at <code>127.0.0.1</code> so that the browser treats it as</p>
<p>same-origin with your local server.</p>
<p>If a reverse proxy on the same machine forwards a public name to the server</p>
<p>(nginx → <code>127.0.0.1:8082</code> with <code>proxy_set_header Host $host</code>), list that name:</p>
<p>A server reached directly on a public IP address is not checked.</p>
<h3>Network Considerations</h3>
<li><strong>Internal networks</strong>: Use <code>AUTH_ENFORCE=false</code> if behind a trusted reverse proxy</li>
<li><strong>Public exposure</strong>: Always set <code>AUTH_ENFORCE=true</code> and use HTTPS</li>
<li><strong>Load balancers</strong>: Health check path is <code>/health/live</code> (fast, exempt from auth)</li>
<h2>Managed Hosting</h2>
<h3>Required Endpoints</h3>
<p>Hosting platforms should expose these endpoints:</p>
<p>| Endpoint | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>/health/live</code> | Fast liveness probe (returns <code>{"status": "ok"}</code>) |</p>
<p>| <code>/health/ready</code> | Readiness probe (parallel feature checks) |</p>
<p>| <code>/health</code> | Deep health (parallel feature checks; <code>?deep=false</code> for liveness) |</p>
<p>| <code>/api/protocol</code> | Protocol version and capabilities |</p>
<p>| <code>/api/protocol/negotiate</code> | Capability negotiation |</p>
<p>| <code>/api/features</code> | List of registered features |</p>
<h3>Protocol Discovery</h3>
<h3>Minimum Viable Deployment</h3>
<p>For a minimal AIUI deployment:</p>
<p>1. <strong>Required</strong>: <code>OPENAI_API_KEY</code> environment variable</p>
<p>2. <strong>Recommended</strong>: Persistent volume for <code>AIUI_DATA_DIR</code></p>
<p>3. <strong>Optional</strong>: <code>AUTH_ENFORCE=true</code> for multi-tenant environments</p></noscript></div>
