<h2>Environment Variables</h2>
<p>| Variable | Default | Description |</p>
<p>|----------|---------|-------------|</p>
<p>| <code>AIUI_DATA_DIR</code> | <code>~/.praisonaiui</code> | Data directory for config, sessions, logs |</p>
<p>| <code>AIUI_PORT</code> | <code>8082</code> | Server port (Docker only) |</p>
<p>| <code>AIUI_HOST</code> | <code>0.0.0.0</code> | Server bind address (Docker only) |</p>
<p>| <code>AUTH_ENFORCE</code> | <code>false</code> | Enforce Bearer token auth on <code>/api/*</code> routes |</p>
<p>| <code>OPENAI_API_KEY</code> | — | OpenAI API key for LLM provider |</p>
<h3>Auth Enforcement</h3>
<p>When <code>AUTH_ENFORCE=true</code>, all <code>/api/*</code> routes require a valid Bearer token in the <code>Authorization</code> header:</p>
<p><strong>Exempt paths</strong> (always accessible without auth):</p>
<li><code>/health</code>, <code>/health/live</code>, <code>/health/ready</code>, <code>/api/health</code> — health checks</li>
<li><code>/api/auth/login</code>, <code>/login</code> — login endpoints</li>
<li><code>/api/protocol</code>, <code>/api/protocol/negotiate</code> — protocol discovery</li>
<h2>Configuration</h2>
<h3>Config File Location</h3>
<p>The config file is located at <code>AIUI_DATA_DIR/config.yaml</code> (default: <code>~/.praisonaiui/config.yaml</code>).</p>

<h2>Security</h2>
<h3>Auth Modes</h3>
<p>AIUI supports multiple authentication modes:</p>
<p>| Mode | Description |</p>
<p>|------|-------------|</p>
<p>| <code>none</code> | No authentication (default) |</p>
<p>| <code>api_key</code> | API key in <code>X-API-Key</code> header or <code>api_key</code> query param |</p>
<p>| <code>session</code> | Session token in <code>Authorization: Bearer &lt;token&gt;</code> header |</p>
<p>| <code>password</code> | Username/password login |</p>
<h3>API Key Management</h3>
<h3>Network Considerations</h3>
<li><strong>Internal networks</strong>: Use <code>AUTH_ENFORCE=false</code> if behind a trusted reverse proxy</li>
<li><strong>Public exposure</strong>: Always set <code>AUTH_ENFORCE=true</code> and use HTTPS</li>
<li><strong>Load balancers</strong>: Health check path is <code>/health/live</code> (fast, exempt from auth)</li>
<h2>Managed Hosting</h2>
<h3>Required Endpoints</h3>
<p>Hosting platforms should expose these endpoints:</p>
<p>| Endpoint | Purpose |</p>
<p>|----------|---------|</p>
<p>| <code>/health/live</code> | Fast liveness probe (returns <code>{"status": "ok"}</code>) |</p>
<p>| <code>/health/ready</code> | Readiness probe (parallel feature checks) |</p>
<p>| <code>/health</code> | Deep health (parallel feature checks; <code>?deep=false</code> for liveness) |</p>
<p>| <code>/api/protocol</code> | Protocol version and capabilities |</p>
<p>| <code>/api/protocol/negotiate</code> | Capability negotiation |</p>
<p>| <code>/api/features</code> | List of registered features |</p>
<h3>Protocol Discovery</h3>
<h3>Minimum Viable Deployment</h3>
<p>For a minimal AIUI deployment:</p>
<p>1. <strong>Required</strong>: <code>OPENAI_API_KEY</code> environment variable</p>
<p>2. <strong>Recommended</strong>: Persistent volume for <code>AIUI_DATA_DIR</code></p>
<p>3. <strong>Optional</strong>: <code>AUTH_ENFORCE=true</code> for multi-tenant environments</p></noscript></div>
