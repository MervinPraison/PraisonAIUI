<p>PraisonAIUI hosts <strong>A2UI v0.9</strong> surfaces: agents push structured UI messages to a live canvas while users chat in the same window or on a full-page workspace.</p>
<p>For dashboard extension patterns (views, plugins, layout JSON), see Agent UI host.</p>
<h2>Quick start</h2>
<p>Run the full example: <code>examples/python/30-a2ui-canvas/app.py</code>.</p>
<h2>Dashboard pages</h2>
<p>| Page id | Route | Purpose |</p>
<p>|---------|-------|---------|</p>
<p>| <code>chat-canvas</code> | <code>/chat-canvas</code> | Split view — chat left, live A2UI preview right |</p>
<p>| <code>chat</code> | <code>/chat</code> | Vanilla chat (unchanged) |</p>
<p>| <code>canvas</code> | <code>/canvas</code> | Full-page surface workspace |</p>
<p>Enable the split preview with <code>set_chat_preview</code>. Settings appear in <code>/ui-config.json</code> as <code>chat.preview: { enabled, surfaceId, width }</code>.</p>
<h2>Agent integration</h2>
<p>Agents should call <strong><code>send_a2ui_messages</code></strong> (from <code>praisonaiagents.tools.a2ui_tools</code>) with A2UI message dicts:</p>
<p>Wrap the tool with <strong><code>coerce_a2ui_tool_messages</code></strong> so common LLM argument shapes still work:</p>
<p><code>coerce_a2ui_tool_messages</code> accepts:</p>
<li>A JSON string or list of message dicts</li>
<li>A dict with a <code>messages</code> key</li>
<li>A bare <code>components</code> list (wrapped in <code>updateComponents</code>)</li>
<li>A single component dict (wrapped in <code>updateComponents</code>)</li>
<li>Missing <code>createSurface</code> (inserted automatically for the given <code>surface_id</code>)</li>
<p>Tool results are detected by <code>a2ui_utils</code> and ingested into the surface store; connected clients receive WebSocket <code>a2ui_surface</code> events.</p>
<h2>HTTP API</h2>
<p>| Method | Path | Behaviour |</p>
<p>|--------|------|-----------|</p>
<p>| <code>GET</code> | <code>/api/surfaces</code> | List surfaces and message counts |</p>
<p>| <code>GET</code> | <code>/api/surfaces/{id}</code> | Surface state; <strong>200 with <code>{ messages: [] }</code></strong> if not created yet (empty canvas is normal) |</p>
<p>| <code>POST</code> | <code>/api/surfaces/{id}/messages</code> | Append or replace messages (<code>replace: true</code> in body) |</p>
<p>| <code>POST</code> | <code>/api/surfaces/{id}/actions</code> | User action from a button/component |</p>
<p>| <code>DELETE</code> | <code>/api/surfaces/{id}</code> | Clear surface |</p>
<p>Realtime updates use the existing dashboard WebSocket (<code>a2ui_surface</code> payload).</p>
<h2>CLI</h2>
<p>Manage surfaces against a running server (<code>--server</code> / <code>AIUI_SERVER</code>, default <code>http://127.0.0.1:8000</code>):</p>
<p><code>messages.json</code> must contain <code>{ "messages": [ ... ] }</code>.</p>
<h2>Frontend modules</h2>
<p>Shared dashboard JS (lazy-loaded with <code>chat-canvas</code>):</p>
<p>| Module | Role |</p>
<p>|--------|------|</p>
<p>| <code>surface-utils.js</code> | Load surface, WebSocket sync, post actions |</p>
<p>| <code>canvas-preview.js</code> | Right-hand preview panel |</p>
<p>| <code>a2ui-mapper.js</code> | Default DOM mapper (Text, Button, Column, Row, Card, …) |</p>
<p>| <code>plugins/views/chat-canvas.js</code> | Composes chat + preview without modifying <code>chat.js</code> |</p>
<p>Override rendering: <code>window.aiui.registerSurfaceRenderer("main", fn)</code>.</p>
<h2>Troubleshooting</h2>
<p>| Symptom | Likely cause | Fix |</p>
<p>|---------|--------------|-----|</p>
<p>| Chat works but canvas stays empty | Agent did not call <code>send_a2ui_messages</code> | Strengthen instructions; wrap tool with <code>coerce_a2ui_tool_messages</code> |</p>
<p>| Tool error / invalid JSON | LLM passed wrong shape | Use coercion wrapper; include schema prompt from <code>praisonaiagents.ui.a2ui.adapter</code> |</p>
<p>| Preview shows raw JSON | Component type not in <code>a2ui-mapper</code> | Extend mapper or use supported components |</p>
<p>| <code>GET /api/surfaces/main</code> empty | Normal before first push | Push via agent or <code>aiui surface push</code> |</p>
<p>| Button click does nothing | No <code>@aiui.surface_action</code> handler | Register handler for that <code>surface_id</code> |</p>
<h2>Related</h2>
<li>Agent UI host — <code>registerSurfaceRenderer</code>, layout tiers</li>
<li>Python API — <code>set_chat_preview</code></li>
<li>Python API — <code>@aiui.surface_action</code></li></noscript></div>
