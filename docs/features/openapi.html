></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>OpenAPI</h1>
<p>Name your spec in <code>aiui.yaml</code>; <code>aiui validate</code> and <code>aiui build</code> load and check it.</p>
<li>A file (relative to <code>aiui.yaml</code>) or an <code>http(s)</code> URL; <code>http://localhost:8080/openapi.json</code> works with no flag.</li>
<li>JSON or YAML, OpenAPI 3.0, 3.1 and 3.2. Swagger 2.0 is an error.</li>
<li>A <code>$ref</code> to another file (<code>paths/pets.yaml</code>, <code>../common.yaml#/components/schemas/Error</code>)</li>
<p>resolves relative to the file naming it, URLs too, and is bundled in: no pre-bundling.</p>
<p>Recursive schemas, across files too, stay finite.</p>
<li>3.0 specs are normalised to 3.1 rules for rendering (<code>nullable</code>, boolean</li>
<p><code>exclusiveMinimum</code>/<code>exclusiveMaximum</code>, schema <code>example</code>); the published file keeps your version.</p>
<p><code>openapi</code> also goes on a navigation tab or group: a path or URL, <code>{source, directory}</code> or a</p>
<p>list of either. A spec named twice loads once. <code>directory</code>: the URL folder of its endpoint pages</p>
<p>(default <code>api-reference</code>).</p>
<h2>Checks</h2>
<p>Each problem names its file, line and JSON pointer (`openapi.yaml:42: $ref '#/x' does not</p>
<p>resolve (at #/components/schemas/Pet/properties/owner)<code>). Errors fail </code>validate` and</p>
<p><code>build</code>: an unreadable file or URL, YAML/JSON syntax, a missing or unsupported <code>openapi</code></p>
<p>version, <code>info</code> without <code>title</code>/<code>version</code>, a <code>$ref</code> that does not resolve, a path not</p>
<p>starting with <code>/</code>, a duplicate <code>operationId</code>. Warning: a <code>{param}</code> with no path parameter.</p>
<h2>Output</h2>
<p><code>aiui build</code> writes <code>openapi/&lt;slug&gt;.json</code> (the spec bundled into one file, <code>x-excluded</code></p>
<p>operations removed; <code>&lt;slug&gt;</code>: file name, <code>-2</code> on a clash), <code>openapi/index.json</code></p>
<p>(<code>{"specs": [{source, file, title, openapi, version, operations}]}</code>), an "OpenAPI specs"</p>
<p>section in <code>llms.txt</code> and an <a href="https://www.rfc-editor.org/rfc/rfc9727">RFC 9727</a> API catalog at</p>
<p><code>/.well-known/api-catalog</code> (each API's base URL, spec and first endpoint page).</p>
<h2>Endpoint pages</h2>
<p>Every operation and 3.1 webhook gets a docs page, generated at build time as Markdown with</p>
<p>the API field components: the endpoint bar with Try it, server URL,</p>
<p>deprecation notice, path / query / header / cookie parameters, request body,</p>
<p>each response (schemas with <code>oneOf</code>/<code>anyOf</code> tabs, constraints and conditional</p>
<p>requirements), request examples in several languages, response examples, callbacks and a link to the spec. They publish like hand-written pages: agent <code>.md</code>, <code>llms.txt</code>,</p>
<p><code>llms-full.txt</code>, sitemap and site search (which also matches <code>METHOD /path</code>, the</p>
<p><code>operationId</code> and every parameter and body field name).</p>
<p>| Spec | Result |</p>
<p>|---|---|</p>
<p>| <code>api.openapi</code> only | an "API Reference" group at the end of the sidebar |</p>
<p>| <code>openapi</code> on a tab | its tag groups join the tab ("API Reference" for untagged operations) |</p>
<p>| <code>openapi</code> on a group | its tag groups go inside that group |</p>
<p>| <code>tags</code> | one sidebar group per operation's first tag; label: <code>x-group</code>, <code>x-displayName</code>, <code>summary</code>, then <code>name</code>; 3.2 <code>parent</code> nests groups; a tag with another <code>kind</code> (<code>badge</code>) makes no group |</p>
<p>| untagged webhook | a "Webhooks" group |</p>
<p>| <code>x-hidden: true</code> | page built and routable, not in the sidebar or indexes |</p>
<p>| <code>x-excluded: true</code> | no page, and removed from the published spec |</p>
<p>| <code>deprecated: true</code> | a deprecation notice |</p>
<p>URL: <code>/docs/&lt;directory&gt;/&lt;tag name&gt;/&lt;slug&gt;</code>, the slug from the <code>operationId</code> (<code>listPets</code> -&gt;</p>
<p><code>list-pets</code>, so rewording a summary keeps the URL), else the summary, else method and path</p>
<p>(<code>get-pets-id</code>). <code>x-aiui: {href: /reference/pets}</code> sets the whole path (kebab-cased, <code>..</code></p>
<p>dropped; see page settings). A slug already taken (by a hand-written page or another endpoint) gets <code>-2</code>, <code>-3</code>.</p>
<p>The title is the <code>summary</code> as written, else the <code>operationId</code> in words. <code>aiui validate</code></p>
<p>warns about a duplicate tag, an unknown <code>parent</code> and a <code>parent</code> cycle.</p>
<h3>Schemas</h3>
<p>Each field shows what the schema says, at build time, in the page Markdown (so agents and</p>
<p>search see it too):</p>
<p>| Schema | On the page |</p>
<p>|---|---|</p>
<p>| <code>$ref</code>, <code>allOf</code> | followed and merged into one field list |</p>
<p>| <code>oneOf</code> / <code>anyOf</code> | tabs, one per choice, titled by its <code>title</code>, else its <code>$ref</code> name, else its type, else "Option n"; at the top of a body or response too |</p>
<p>| <code>nullable: true</code>, <code>type: [x, "null"]</code>, <code>anyOf: [X, {type: "null"}]</code> | <code>x \| null</code> in the type; the field still expands to X's properties |</p>
<p>| <code>object[]</code>, nested objects | properties nested under "Show properties", a recursive schema stops one level down |</p>
<p>| <code>enum</code>, <code>const</code> | "Available options: <code>card</code>, <code>bank</code>", "Allowed value: <code>card</code>" |</p>
<p>| <code>minimum</code>/<code>maximum</code> (exclusive too), <code>minLength</code>/<code>maxLength</code>, <code>minItems</code>/<code>maxItems</code>, <code>pattern</code> | "Required range: <code>1 &lt;= x &lt; 100</code>", "Required string length: <code>16 - 19</code>", "Required array length: <code>&gt;= 1</code> elements", "Pattern: <code>^[0-9]+$</code>" |</p>
<p>| <code>examples</code> / <code>example</code> on a field | "Example: <code>5</code>" (short values) |</p>
<p>| <code>additionalProperties</code>, <code>not</code> | "Additional properties: <code>string</code>", "Must not match: <code>integer</code>" |</p>
<p>| <code>if</code>/<code>then</code>/<code>else</code>, <code>dependentRequired</code>, <code>dependentSchemas</code> (also inside <code>allOf</code>) | a pill on each affected field: "required if method = card", "required unless method = card", "required if owner is set"; an <code>if</code> that tests more than sibling <code>const</code> / <code>enum</code> / <code>required</code> shows "conditionally required" |</p>
<h3>Response examples</h3>
<p>The side column's response example has one tab per status code, content type (when a response</p>
<p>has several) and named example (its <code>summary</code>, else its key). This gives the tabs</p>
<p><code>200 · application/json · A small cat</code>, <code>200 · application/json · big</code> and <code>200 · application/xml</code>:</p>
<p>Per content type: the <code>examples</code> map (<code>value</code>, 3.2 <code>dataValue</code> / <code>serializedValue</code>, or the</p>
<p><code>externalValue</code> URL), else <code>example</code>, else for JSON an example built from the schema. JSON is</p>
<p>pretty-printed (a JSON string too); XML, HTML, YAML and CSV are highlighted; other types are text.</p>
<h3>Request examples</h3>
<p>The side column shows the request as code, one tab per language: cURL, Python and</p>
<p>JavaScript by default. A pick is remembered, so every endpoint page opens on the reader's</p>
<p>language. Each sample is built at build time from the spec: the server URL (variables set to</p>
<p>their defaults; a relative or missing server is joined to <code>https://api.example.com</code>), path</p>
<p>parameters (their example, else a <code>{name}</code> placeholder), required query, header and cookie</p>
<p>parameters and any with an example, the first security requirement as a placeholder</p>
<p>(<code>Bearer &lt;token&gt;</code>, <code>Basic &lt;encoded-value&gt;</code>, an API key <code>&lt;api-key&gt;</code> in its header, query or</p>
<p>cookie) and the body (its first example, else one made from the schema without <code>readOnly</code></p>
<p>fields). JSON, form-urlencoded and plain-text bodies work in every language; <code>multipart/form-data</code></p>
<p>in cURL, Python and JavaScript (a <code>format: binary</code> field is sent as a file).</p>
<p>Languages: <code>curl</code>, <code>python</code>, <code>javascript</code>, <code>go</code>, <code>java</code>, <code>ruby</code>, <code>php</code>, <code>csharp</code>, <code>rust</code>,</p>
<p><code>swift</code> (also <code>shell</code>, <code>node</code>, <code>js</code>, <code>py</code>, <code>c#</code>, <code>dotnet</code>, ...). <code>aiui validate</code> names an</p>
<p>unknown one.</p>
<p>Your own samples, from an SDK say, go in the operation's <code>x-codeSamples</code> (or <code>x-code-samples</code>).</p>
<p>They come first, in their order; one in a generated language replaces that sample, any other</p>
<p>language adds a tab. <code>label</code> is the tab title (default: the language's name).</p>
<p>The agent <code>.md</code> export, <code>llms-full.txt</code> and the page source keep every sample as a fence.</p>
<h3>Try it</h3>
<p>Under the title, every endpoint page has an endpoint bar (method, path, copy) and <strong>Try it</strong>: a</p>
<p>request form with a server menu (operation, path, then spec <code>servers</code>) and an input per server</p>
<p>variable, an input per path, query, header and cookie parameter (<code>enum</code> and boolean as menus,</p>
<p>arrays comma-separated, empty <code>required</code> ones named before sending) and the body to edit</p>
<p>(<code>multipart/form-data</code> as a JSON object of its fields). Inputs start with <code>x-default</code>, else the</p>
<p>example (<code>example</code>, <code>examples</code>, <code>default</code>, <code>const</code>, first <code>enum</code> value); the body with its first</p>
<p>example, else one made from the schema. Beside them: the curl command for exactly what will be</p>
<p>sent, live, with copy, and after Send the status, time, size, headers and body (JSON</p>
<p>pretty-printed). A relative or missing server URL means the site the docs are served from.</p>
<p>With <code>auth</code>, the bar asks <code>GET /api/auth/status</code> once per page load and shows Try it only when it</p>
<p>answers <code>authenticated: true</code> (an <code>aiui serve</code> or <code>create_app</code> site whose reader is signed in;</p>
<p>without sign-in configured, every reader counts as signed in). On a static host it acts like</p>
<p><code>simple</code>.</p>
<p>Webhooks have no Try it. Front matter <code>playground:</code> (same values) sets the display of one</p>
<p><code>openapi:</code> or <code>api:</code> page, <code>x-aiui</code> <code>metadata.playground</code> of</p>
<p>one generated page.</p>
<p>The request goes straight from the reader's browser to your API: no proxy, so it works on a</p>
<p>static host and keys never pass through a third party, and the browser's CORS rules apply. The</p>
<p>API must allow the docs site's origin (<code>Access-Control-Allow-Origin</code>; for custom headers or a</p>
<p>JSON body, a preflight <code>OPTIONS</code> with <code>Access-Control-Allow-Headers</code>). A blocked request says it</p>
<p>"did not reach the API" (the curl command still works in a terminal). Response headers other</p>
<p>than the CORS-safelisted ones show only when listed in <code>Access-Control-Expose-Headers</code>; a cookie</p>
<p>parameter goes only into the curl command (a browser sends just the cookies it holds).</p>
<p><code>aiui build</code> writes each page's form data to <code>openapi/try/&lt;page&gt;.json</code>; the form is a lazy chunk</p>
<p>loaded on the first hover, focus or click of Try it. In the page source the bar is</p>
<p><code>&lt;ApiPlayground method="GET" path="/pets" src="/openapi/try/....json" /&gt;</code> (without <code>src</code>, the bar</p>
<p>alone, usable on a hand-written page); the agent <code>.md</code> keeps `<code> </code>GET<code> </code>/pets<code> </code>`.</p>
<h4>Authentication</h4>
<p>An operation's <code>security</code> (else the spec's) becomes an <strong>Authorization</strong> section on its page (a</p>
<p>field per scheme, required when every alternative needs it, OAuth2 scopes listed) and inputs in</p>
<p>Try it: <code>apiKey</code> in a header, query or cookie, <code>http</code> <code>bearer</code> (and any other scheme name),</p>
<p><code>http</code> <code>basic</code> (username and password, base64-encoded for you), <code>oauth2</code> and <code>openIdConnect</code> (paste</p>
<p>an access token; sent as <code>Bearer</code>). With several alternatives a menu picks one (<code>{}</code> in the list</p>
<p>adds "None"); <code>security: []</code> turns it off; <code>mutualTLS</code> is left out (a browser cannot send it).</p>
<p>A scheme's <code>x-default</code> prefills its input.</p>
<p>Values are kept in the browser tab's <code>sessionStorage</code> per docs site (gone when the tab closes,</p>
<p>never <code>localStorage</code>) and sent only with the request itself. The curl command shows them as</p>
<p><code>******<strong></code> until </strong>Show values**; the request examples on the page keep placeholders</p>
<p>(<code>Bearer &lt;token&gt;</code>).</p>
<h4>Files and streams</h4>
<li><code>multipart/form-data</code>: a file input per part with <code>format: binary</code> / <code>byte</code> or a</li>
<p><code>contentMediaType</code>; the chosen file replaces that field (curl <code>--form 'photo=@cat.png'</code>).</p>
<li>A body that is a file (<code>application/octet-stream</code>, <code>image/*</code>, <code>audio/*</code>, <code>video/*</code>, PDF, or a</li>
<p><code>format: binary</code> schema): one file input, sent as the body (curl <code>--data-binary</code>).</p>
<li>A JSON field with <code>format: byte</code> or <code>contentEncoding: base64</code> / <code>base64url</code>: a file input</li>
<p>that writes the file's encoding into the body.</p>
<li>A <code>text/event-stream</code>, NDJSON or JSON Lines response is shown as it arrives: server-sent events</li>
<p>as a list (event name, id, data with JSON pretty-printed), other streams as text. <strong>Stop</strong></p>
<p>ends it; reading stops at 10 MB; a broken connection says "Stream interrupted."</p>
<p><strong>(planned)</strong>: method and <code>kind: badge</code> pills in the</p>
<p>sidebar, a choice picker for <code>any</code> fields, <code>api.optional</code>, and showing image, audio and video responses inline.</p>
<h2>Endpoints on your own pages</h2>
<p>Name an operation in a page's front matter and the page shows it: the endpoint bar and Try it</p>
<p>under your <code>#</code> title, your Markdown, then the generated parameters, body, responses and</p>
<p>request and response examples.</p>
<li><code>"GET /users"</code> looks in every spec the config names; <code>"admin.yaml POST /users"</code> in that file</li>
<p>(its name is enough; a file only pages name is loaded, relative to <code>aiui.yaml</code>, and published);</p>
<p><code>"webhook user-created"</code> names a webhook.</p>
<li><code>title</code>, <code>description</code> and search keywords come from the operation unless the page sets them;</li>
<p>the spec's description shows only when the page has no text of its own.</p>
<li>The operation gets no generated page of its own: your page replaces it.</li>
<li><code>playground: simple</code> (or <code>none</code>) on the page changes its Try it display.</li>
<h3>Pages without a spec</h3>
<p><code>api:</code> makes an endpoint page from the page alone: the bar, and Try it with an input per</p>
<p><code>&lt;ParamField&gt;</code> (<code>placeholder</code>, else <code>default</code>, as the example), per <code>{param}</code> in the path, and a</p>
<p>JSON body of the <code>body</code> fields.</p>
<h3>Endpoints in navigation</h3>
<p>A <code>pages:</code> entry can be an operation: <code>"GET /users"</code>, <code>"admin.yaml POST /users"</code> or</p>
<p><code>"webhook user-created"</code>. Without a file it comes from the nearest group or tab with <code>openapi</code>,</p>
<p>else <code>api.openapi</code>, else any spec. When a spec's own group (or <code>api.openapi</code>) lists operations,</p>
<p>only the listed ones get pages, each where it is listed, and no tag groups are added. An entry</p>
<p>for an operation a page shows (<code>openapi:</code> front matter) links that page.</p>
<p><code>aiui validate</code> names a reference that matches no operation (7012).</p>
<h3>Page settings in the spec</h3>
<p>An operation's <code>x-aiui</code> sets its generated page: <code>metadata</code> is front matter (<code>title</code>,</p>
<p><code>sidebarTitle</code>, <code>description</code>, <code>playground</code>, <code>tag</code>, <code>og:*</code>, ...), <code>content</code> is Markdown shown</p>
<p>above the description (any docs component works) and <code>href</code> the page URL. The <code>x-mint</code> key</p>
<p>other docs tools write is read too; <code>x-aiui</code> wins where both set a value.</p>
<p>From Python, <code>praisonaiui.compiler.openapi.load_spec("openapi.yaml")</code> returns an <code>ApiSpec</code></p>
<p>(<code>ok</code>, <code>issues</code>, <code>document</code>, <code>operations</code>, <code>dereference(node)</code>).</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/openapi.source.md", "text": "---\ntitle: OpenAPI\ndescription: Point the docs site at an OpenAPI spec; aiui build loads, bundles and checks it.\n---\n\n# OpenAPI\n\nName your spec in `aiui.yaml`; `aiui validate` and `aiui build` load and check it.\n\n```yaml\napi:\n  openapi: openapi.yaml   # or https://api.example.com/openapi.json\n```\n\n- A file (relative to `aiui.yaml`) or an `http(s)` URL; `http://localhost:8080/openapi.json` works with no flag.\n- JSON or YAML, OpenAPI 3.0, 3.1 and 3.2. Swagger 2.0 is an error.\n- A `$ref` to another file (`paths/pets.yaml`, `../common.yaml#/components/schemas/Error`)\n  resolves relative to the file naming it, URLs too, and is bundled in: no pre-bundling.\n  Recursive schemas, across files too, stay finite.\n- 3.0 specs are normalised to 3.1 rules for rendering (`nullable`, boolean\n  `exclusiveMinimum`/`exclusiveMaximum`, schema `example`); the published file keeps your version.\n\n`openapi` also goes on a navigation tab or group: a path or URL, `{source, directory}` or a\nlist of either. A spec named twice loads once. `directory`: the URL folder of its endpoint pages\n(default `api-reference`).\n\n```yaml\nnavigation: {tabs: [{tab: API, openapi: [v2.yaml, {source: admin.yaml, directory: api/admin}]}]}\n```\n\n## Checks\n\nEach problem names its file, line and JSON pointer (`openapi.yaml:42: $ref '#/x' does not\nresolve (at #/components/schemas/Pet/properties/owner)`). Errors fail `validate` and\n`build`: an unreadable file or URL, YAML/JSON syntax, a missing or unsupported `openapi`\nversion, `info` without `title`/`version`, a `$ref` that does not resolve, a path not\nstarting with `/`, a duplicate `operationId`. Warning: a `{param}` with no path parameter.\n\n## Output\n\n`aiui build` writes `openapi/\u003cslug\u003e.json` (the spec bundled into one file, `x-excluded`\noperations removed; `\u003cslug\u003e`: file name, `-2` on a clash), `openapi/index.json`\n(`{\"specs\": [{source, file, title, openapi, version, operations}]}`), an \"OpenAPI specs\"\nsection in `llms.txt` and an [RFC 9727](https://www.rfc-editor.org/rfc/rfc9727) API catalog at\n`/.well-known/api-catalog` (each API's base URL, spec and first endpoint page).\n\n## Endpoint pages\n\nEvery operation and 3.1 webhook gets a docs page, generated at build time as Markdown with\nthe [API field components](writing-docs.md#api-fields): the endpoint bar with [Try it](#try-it), server URL,\ndeprecation notice, path / query / header / cookie parameters, request body,\neach response ([schemas](#schemas) with `oneOf`/`anyOf` tabs, constraints and conditional\nrequirements), [request examples](#request-examples) in several languages, [response examples](#response-examples), callbacks and a link to the spec. They publish like hand-written pages: agent `.md`, `llms.txt`,\n`llms-full.txt`, sitemap and site search (which also matches `METHOD /path`, the\n`operationId` and every parameter and body field name).\n\n| Spec | Result |\n|---|---|\n| `api.openapi` only | an \"API Reference\" group at the end of the sidebar |\n| `openapi` on a tab | its tag groups join the tab (\"API Reference\" for untagged operations) |\n| `openapi` on a group | its tag groups go inside that group |\n| `tags` | one sidebar group per operation's first tag; label: `x-group`, `x-displayName`, `summary`, then `name`; 3.2 `parent` nests groups; a tag with another `kind` (`badge`) makes no group |\n| untagged webhook | a \"Webhooks\" group |\n| `x-hidden: true` | page built and routable, not in the sidebar or indexes |\n| `x-excluded: true` | no page, and removed from the published spec |\n| `deprecated: true` | a deprecation notice |\n\nURL: `/docs/\u003cdirectory\u003e/\u003ctag name\u003e/\u003cslug\u003e`, the slug from the `operationId` (`listPets` -\u003e\n`list-pets`, so rewording a summary keeps the URL), else the summary, else method and path\n(`get-pets-id`). `x-aiui: {href: /reference/pets}` sets the whole path (kebab-cased, `..`\ndropped; see [page settings](#page-settings-in-the-spec)). A slug already taken (by a hand-written page or another endpoint) gets `-2`, `-3`.\nThe title is the `summary` as written, else the `operationId` in words. `aiui validate`\nwarns about a duplicate tag, an unknown `parent` and a `parent` cycle.\n\n### Schemas\n\nEach field shows what the schema says, at build time, in the page Markdown (so agents and\nsearch see it too):\n\n| Schema | On the page |\n|---|---|\n| `$ref`, `allOf` | followed and merged into one field list |\n| `oneOf` / `anyOf` | tabs, one per choice, titled by its `title`, else its `$ref` name, else its type, else \"Option n\"; at the top of a body or response too |\n| `nullable: true`, `type: [x, \"null\"]`, `anyOf: [X, {type: \"null\"}]` | `x \\| null` in the type; the field still expands to X's properties |\n| `object[]`, nested objects | properties nested under \"Show properties\", a recursive schema stops one level down |\n| `enum`, `const` | \"Available options: `card`, `bank`\", \"Allowed value: `card`\" |\n| `minimum`/`maximum` (exclusive too), `minLength`/`maxLength`, `minItems`/`maxItems`, `pattern` | \"Required range: `1 \u003c= x \u003c 100`\", \"Required string length: `16 - 19`\", \"Required array length: `\u003e= 1` elements\", \"Pattern: `^[0-9]+$`\" |\n| `examples` / `example` on a field | \"Example: `5`\" (short values) |\n| `additionalProperties`, `not` | \"Additional properties: `string`\", \"Must not match: `integer`\" |\n| `if`/`then`/`else`, `dependentRequired`, `dependentSchemas` (also inside `allOf`) | a pill on each affected field: \"required if method = card\", \"required unless method = card\", \"required if owner is set\"; an `if` that tests more than sibling `const` / `enum` / `required` shows \"conditionally required\" |\n\n```yaml\napi:\n  openapi: openapi.yaml\n  params: {expanded: all}   # nested properties start open (default: closed)\n```\n\n### Response examples\n\nThe side column's response example has one tab per status code, content type (when a response\nhas several) and named example (its `summary`, else its key). This gives the tabs\n`200 · application/json · A small cat`, `200 · application/json · big` and `200 · application/xml`:\n\n```yaml\nresponses:\n  \"200\":\n    content:\n      application/json:\n        examples:\n          small: {summary: A small cat, value: {name: Tom}}\n          big: {value: {name: Garfield}}\n      application/xml: {example: \"\u003ccat/\u003e\"}\n```\n\nPer content type: the `examples` map (`value`, 3.2 `dataValue` / `serializedValue`, or the\n`externalValue` URL), else `example`, else for JSON an example built from the schema. JSON is\npretty-printed (a JSON string too); XML, HTML, YAML and CSV are highlighted; other types are text.\n\n### Request examples\n\nThe side column shows the request as code, one tab per language: cURL, Python and\nJavaScript by default. A pick is remembered, so every endpoint page opens on the reader's\nlanguage. Each sample is built at build time from the spec: the server URL (variables set to\ntheir defaults; a relative or missing server is joined to `https://api.example.com`), path\nparameters (their example, else a `{name}` placeholder), required query, header and cookie\nparameters and any with an example, the first security requirement as a placeholder\n(`Bearer \u003ctoken\u003e`, `Basic \u003cencoded-value\u003e`, an API key `\u003capi-key\u003e` in its header, query or\ncookie) and the body (its first example, else one made from the schema without `readOnly`\nfields). JSON, form-urlencoded and plain-text bodies work in every language; `multipart/form-data`\nin cURL, Python and JavaScript (a `format: binary` field is sent as a file).\n\n```yaml\napi:\n  openapi: openapi.yaml\n  examples:\n    languages: [curl, python, go]   # or all; [] shows only the spec's own samples\n```\n\nLanguages: `curl`, `python`, `javascript`, `go`, `java`, `ruby`, `php`, `csharp`, `rust`,\n`swift` (also `shell`, `node`, `js`, `py`, `c#`, `dotnet`, ...). `aiui validate` names an\nunknown one.\n\nYour own samples, from an SDK say, go in the operation's `x-codeSamples` (or `x-code-samples`).\nThey come first, in their order; one in a generated language replaces that sample, any other\nlanguage adds a tab. `label` is the tab title (default: the language's name).\n\n```yaml\nx-codeSamples:\n  - {lang: python, label: Python SDK, source: \"client.pets.list(limit=10)\"}\n  - {lang: kotlin, source: \"client.pets().list(10)\"}\n```\n\nThe agent `.md` export, `llms-full.txt` and the page source keep every sample as a fence.\n\n### Try it\n\nUnder the title, every endpoint page has an endpoint bar (method, path, copy) and **Try it**: a\nrequest form with a server menu (operation, path, then spec `servers`) and an input per server\nvariable, an input per path, query, header and cookie parameter (`enum` and boolean as menus,\narrays comma-separated, empty `required` ones named before sending) and the body to edit\n(`multipart/form-data` as a JSON object of its fields). Inputs start with `x-default`, else the\nexample (`example`, `examples`, `default`, `const`, first `enum` value); the body with its first\nexample, else one made from the schema. Beside them: the curl command for exactly what will be\nsent, live, with copy, and after Send the status, time, size, headers and body (JSON\npretty-printed). A relative or missing server URL means the site the docs are served from.\n\n```yaml\napi:\n  playground:\n    display: interactive   # simple: the bar without Try it; none: method and path as plain text;\n                           # auth: Try it only for readers signed in to the aiui server\n  examples:\n    prefill: true          # false: inputs start empty, the example as placeholder\n```\n\nWith `auth`, the bar asks `GET /api/auth/status` once per page load and shows Try it only when it\nanswers `authenticated: true` (an `aiui serve` or `create_app` site whose reader is signed in;\nwithout sign-in configured, every reader counts as signed in). On a static host it acts like\n`simple`.\n\nWebhooks have no Try it. Front matter `playground:` (same values) sets the display of one\n[`openapi:` or `api:` page](#endpoints-on-your-own-pages), `x-aiui` `metadata.playground` of\none generated page.\n\nThe request goes straight from the reader's browser to your API: no proxy, so it works on a\nstatic host and keys never pass through a third party, and the browser's CORS rules apply. The\nAPI must allow the docs site's origin (`Access-Control-Allow-Origin`; for custom headers or a\nJSON body, a preflight `OPTIONS` with `Access-Control-Allow-Headers`). A blocked request says it\n\"did not reach the API\" (the curl command still works in a terminal). Response headers other\nthan the CORS-safelisted ones show only when listed in `Access-Control-Expose-Headers`; a cookie\nparameter goes only into the curl command (a browser sends just the cookies it holds).\n\n`aiui build` writes each page's form data to `openapi/try/\u003cpage\u003e.json`; the form is a lazy chunk\nloaded on the first hover, focus or click of Try it. In the page source the bar is\n`\u003cApiPlayground method=\"GET\" path=\"/pets\" src=\"/openapi/try/....json\" /\u003e` (without `src`, the bar\nalone, usable on a hand-written page); the agent `.md` keeps `` `GET` `/pets` ``.\n\n#### Authentication\n\nAn operation's `security` (else the spec's) becomes an **Authorization** section on its page (a\nfield per scheme, required when every alternative needs it, OAuth2 scopes listed) and inputs in\nTry it: `apiKey` in a header, query or cookie, `http` `bearer` (and any other scheme name),\n`http` `basic` (username and password, base64-encoded for you), `oauth2` and `openIdConnect` (paste\nan access token; sent as `Bearer`). With several alternatives a menu picks one (`{}` in the list\nadds \"None\"); `security: []` turns it off; `mutualTLS` is left out (a browser cannot send it).\nA scheme's `x-default` prefills its input.\n\n```yaml\ncomponents:\n  securitySchemes:\n    token: {type: http, scheme: bearer, bearerFormat: JWT, x-default: test-token}\n    key: {type: apiKey, in: query, name: api_key}\nsecurity: [{token: []}, {key: []}]\n```\n\nValues are kept in the browser tab's `sessionStorage` per docs site (gone when the tab closes,\nnever `localStorage`) and sent only with the request itself. The curl command shows them as\n`********` until **Show values**; the request examples on the page keep placeholders\n(`Bearer \u003ctoken\u003e`).\n\n#### Files and streams\n\n- `multipart/form-data`: a file input per part with `format: binary` / `byte` or a\n  `contentMediaType`; the chosen file replaces that field (curl `--form 'photo=@cat.png'`).\n- A body that is a file (`application/octet-stream`, `image/*`, `audio/*`, `video/*`, PDF, or a\n  `format: binary` schema): one file input, sent as the body (curl `--data-binary`).\n- A JSON field with `format: byte` or `contentEncoding: base64` / `base64url`: a file input\n  that writes the file's encoding into the body.\n- A `text/event-stream`, NDJSON or JSON Lines response is shown as it arrives: server-sent events\n  as a list (event name, id, data with JSON pretty-printed), other streams as text. **Stop**\n  ends it; reading stops at 10 MB; a broken connection says \"Stream interrupted.\"\n\n**(planned)**: method and `kind: badge` pills in the\nsidebar, a choice picker for `any` fields, `api.optional`, and showing image, audio and video responses inline.\n\n## Endpoints on your own pages\n\nName an operation in a page's front matter and the page shows it: the endpoint bar and Try it\nunder your `#` title, your Markdown, then the generated parameters, body, responses and\nrequest and response examples.\n\n```markdown\n---\nopenapi: \"GET /users\"\n---\n\n# Listing users\n\nPaging works like this...\n```\n\n- `\"GET /users\"` looks in every spec the config names; `\"admin.yaml POST /users\"` in that file\n  (its name is enough; a file only pages name is loaded, relative to `aiui.yaml`, and published);\n  `\"webhook user-created\"` names a webhook.\n- `title`, `description` and search keywords come from the operation unless the page sets them;\n  the spec's description shows only when the page has no text of its own.\n- The operation gets no generated page of its own: your page replaces it.\n- `playground: simple` (or `none`) on the page changes its Try it display.\n\n### Pages without a spec\n\n`api:` makes an endpoint page from the page alone: the bar, and Try it with an input per\n`\u003cParamField\u003e` (`placeholder`, else `default`, as the example), per `{param}` in the path, and a\nJSON body of the `body` fields.\n\n```markdown\n---\napi: \"POST /v1/users\"\n---\n\n\u003cParamField body=\"name\" type=\"string\" placeholder=\"Ada\" required\u003eThe name.\u003c/ParamField\u003e\n```\n\n```yaml\napi:\n  server: https://api.example.com     # or a list: a menu in Try it\n  auth: {method: key, name: X-API-Key}  # bearer (default), basic, key or none: Try it's Authorization inputs\n```\n\n### Endpoints in navigation\n\nA `pages:` entry can be an operation: `\"GET /users\"`, `\"admin.yaml POST /users\"` or\n`\"webhook user-created\"`. Without a file it comes from the nearest group or tab with `openapi`,\nelse `api.openapi`, else any spec. When a spec's own group (or `api.openapi`) lists operations,\nonly the listed ones get pages, each where it is listed, and no tag groups are added. An entry\nfor an operation a page shows (`openapi:` front matter) links that page.\n\n```yaml\nnavigation:\n  groups:\n    - group: Users\n      openapi: openapi.yaml\n      pages: [guides/users, \"GET /users\", \"POST /users\", \"webhook user-created\"]\n```\n\n`aiui validate` names a reference that matches no operation (7012).\n\n### Page settings in the spec\n\nAn operation's `x-aiui` sets its generated page: `metadata` is front matter (`title`,\n`sidebarTitle`, `description`, `playground`, `tag`, `og:*`, ...), `content` is Markdown shown\nabove the description (any docs component works) and `href` the page URL. The `x-mint` key\nother docs tools write is read too; `x-aiui` wins where both set a value.\n\n```yaml\nx-aiui:\n  metadata: {title: Create a user, sidebarTitle: Create, tag: NEW}\n  content: \"\u003cNote\u003eNeeds an admin key.\u003c/Note\u003e\"\n```\n\nFrom Python, `praisonaiui.compiler.openapi.load_spec(\"openapi.yaml\")` returns an `ApiSpec`\n(`ok`, `issues`, `document`, `operations`, `dereference(node)`).\n"}</script>
