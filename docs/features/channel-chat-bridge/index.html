></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Channel-to-Chat Bridge</h1>
<p>Bridge channel bot conversations (Slack, Discord, Telegram) into the Chat UI in real-time.</p>
<h2>Architecture</h2>
<h2>How It Works</h2>
<h3>Backend (`channels.py`)</h3>
<p><code>_attach_chat_bridge(channel_id, bot, platform)</code> is called in <code>_start_channel_bot()</code> right before the bot task is launched:</p>
<p>1. <strong><code>on_message</code> hook</strong> — Captures incoming platform messages and broadcasts <code>channel_message</code> events with sender name, platform, and icon</p>
<p>2. <strong><code>_session.chat()</code> wrapper</strong> — Wraps the agent's chat method so responses are also broadcast as <code>channel_response</code> events</p>
<p>3. <strong>Persistence</strong> — All messages saved to the datastore under session <code>channel-{channel_id}</code> for history on reload</p>
<h3>Frontend (`chat.js`)</h3>
<p>| Function | Purpose |</p>
<p>|---|---|</p>
<p>| <code>_handleChannelMessage(data)</code> | Renders incoming platform user messages; auto-switches to channel session if on fresh chat |</p>
<p>| <code>_handleChannelResponse(data)</code> | Renders agent responses from channel bots |</p>
<p>| <code>_appendChannelMsg(role, data)</code> | Creates message DOM with platform badge, icon, sender name |</p>
<p>| <code>_markSessionUnread(sessionId)</code> | Adds unread dot to sidebar for inactive channel sessions |</p>
<h2>Performance</h2>
<p>Every broadcast is dispatched via <code>asyncio.create_task()</code> — the original bot message handling is <strong>never blocked</strong>. Errors in broadcasting are logged at <code>debug</code> level and swallowed — the bot continues normally even with zero Chat UI clients connected.</p>
<h2>Session Naming</h2>
<p>Each channel gets a dedicated session: <code>channel-{channel_id}</code>. Platform icons:</p>
<p>| Platform | Icon |</p>
<p>|---|---|</p>
<p>| Slack | 💬 |</p>
<p>| Discord | 🎮 |</p>
<p>| Telegram | ✈️ |</p>
<p>| WhatsApp | 📱 |</p>
<h2>WebSocket Events</h2>
<h3>`channel_message`</h3>
<h3>`channel_response`</h3></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/channel-chat-bridge.source.md", "text": "# Channel-to-Chat Bridge\n\nBridge channel bot conversations (Slack, Discord, Telegram) into the Chat UI in real-time.\n\n## Architecture\n\n```mermaid\nsequenceDiagram\n    participant PU as Platform User\n    participant Bot as SlackBot / DiscordBot / TelegramBot\n    participant Bridge as _attach_chat_bridge()\n    participant CM as ChatManager.broadcast()\n    participant WS as Chat WebSocket (/api/chat/ws)\n    participant UI as chat.js (Chat View)\n\n    Note over Bridge: Attached BEFORE bot.start()\n    Note over Bridge: All broadcasts via asyncio.create_task\u003cbr/\u003e(fire-and-forget, zero perf impact)\n\n    PU-\u003e\u003eBot: \"Hello\" (platform message)\n    Bot-\u003e\u003eBridge: on_message hook fires\n    Bridge-\u003e\u003eCM: broadcast({type: \"channel_message\", ...})\n    CM-\u003e\u003eWS: send to connected clients\n    WS-\u003e\u003eUI: _handleChannelMessage() renders with platform badge\n\n    Bot-\u003e\u003eBot: agent processes message\n    Bot-\u003e\u003eBridge: _wrapped_chat() returns response\n    Bridge-\u003e\u003eCM: broadcast({type: \"channel_response\", ...})\n    CM-\u003e\u003eWS: send to connected clients\n    WS-\u003e\u003eUI: _handleChannelResponse() renders as assistant\n```\n\n## How It Works\n\n### Backend (`channels.py`)\n\n`_attach_chat_bridge(channel_id, bot, platform)` is called in `_start_channel_bot()` right before the bot task is launched:\n\n1. **`on_message` hook** — Captures incoming platform messages and broadcasts `channel_message` events with sender name, platform, and icon\n2. **`_session.chat()` wrapper** — Wraps the agent's chat method so responses are also broadcast as `channel_response` events\n3. **Persistence** — All messages saved to the datastore under session `channel-{channel_id}` for history on reload\n\n### Frontend (`chat.js`)\n\n| Function | Purpose |\n|---|---|\n| `_handleChannelMessage(data)` | Renders incoming platform user messages; auto-switches to channel session if on fresh chat |\n| `_handleChannelResponse(data)` | Renders agent responses from channel bots |\n| `_appendChannelMsg(role, data)` | Creates message DOM with platform badge, icon, sender name |\n| `_markSessionUnread(sessionId)` | Adds unread dot to sidebar for inactive channel sessions |\n\n## Performance\n\nEvery broadcast is dispatched via `asyncio.create_task()` — the original bot message handling is **never blocked**. Errors in broadcasting are logged at `debug` level and swallowed — the bot continues normally even with zero Chat UI clients connected.\n\n## Session Naming\n\nEach channel gets a dedicated session: `channel-{channel_id}`. Platform icons:\n\n| Platform | Icon |\n|---|---|\n| Slack | 💬 |\n| Discord | 🎮 |\n| Telegram | ✈️ |\n| WhatsApp | 📱 |\n\n## WebSocket Events\n\n### `channel_message`\n\n```json\n{\n  \"type\": \"channel_message\",\n  \"session_id\": \"channel-abc123\",\n  \"channel_id\": \"abc123\",\n  \"platform\": \"slack\",\n  \"icon\": \"💬\",\n  \"content\": \"Hello from Slack!\",\n  \"sender\": \"john.doe\",\n  \"timestamp\": 1773033464.37\n}\n```\n\n### `channel_response`\n\n```json\n{\n  \"type\": \"channel_response\",\n  \"session_id\": \"channel-abc123\",\n  \"channel_id\": \"abc123\",\n  \"platform\": \"slack\",\n  \"icon\": \"💬\",\n  \"content\": \"Hi! How can I help?\",\n  \"agent_name\": \"assistant\",\n  \"timestamp\": 1773033465.12\n}\n```\n"}</script>
