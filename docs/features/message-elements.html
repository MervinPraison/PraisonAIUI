ckend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/health-endpoints">Health Endpoints Guide</a></li><li><a href="https://ui.praison.ai/docs/api">Reference</a></li><li><a href="https://ui.praison.ai/docs/api/cli">CLI Reference</a></li><li><a href="https://ui.praison.ai/docs/api/python">Python SDK API</a></li><li><a href="https://ui.praison.ai/docs/concepts/configuration">YAML Configuration</a></li><li><a href="https://ui.praison.ai/docs/api/components">Component API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/features-api">Features REST API Reference</a></li><li><a href="https://ui.praison.ai/docs/features/api-reference">API Reference page and OpenAPI document</a></li><li><a href="https://ui.praison.ai/docs/api/sessions">Sessions API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/health">Health API Reference</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/api/typescript">TypeScript SDK Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocols">Feature Protocols</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-architecture">Protocol Architecture Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-versioning">Protocol Versioning</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp">Application Design Protocol (ADP)</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Message Elements</h1>
<p>A message can carry elements: images, PDFs, videos, audio, files and code</p>
<p>blocks shown with the message text. Each element is a dict with a <code>type</code>, the</p>
<p>fields below, and an optional <code>name</code> and <code>display</code>.</p>
<h2>Sending elements</h2>
<p>These reach the chat as <code>message_element</code> events:</p>
<p><code>aiui.audio(url)</code> and <code>aiui.video(url)</code> work the same way.</p>
<p><code>msg.add_image()</code>, <code>add_pdf()</code>, <code>add_video()</code>, <code>add_audio()</code>, <code>add_file()</code></p>
<p>and <code>add_code()</code> validate their arguments and append typed elements</p>
<p>(<code>ImageElement</code> and the others in <code>praisonaiui.schema.models</code>); they reach the</p>
<p>chat like dicts. So does any object with <code>model_dump()</code> or <code>to_dict()</code>.</p>
<h2>Several messages in one reply</h2>
<p>Each <code>aiui.Message(...).send()</code> and each <code>aiui.say(...)</code> is its own message:</p>
<p>the chat shows it at once, as its own block under the same answer, with its</p>
<p>author when it is not the agent, and its elements and actions under it. A</p>
<p>reload shows the same blocks.</p>
<p>Copy, feedback and Regenerate act on the whole answer. The saved reply keeps</p>
<p><code>content</code> (the messages joined by a blank line) and <code>segments</code></p>
<p>(<code>[{id, text, author?}]</code>); elements carry the <code>message_id</code> of their message.</p>
<p><code>msg.update()</code> and <code>msg.remove()</code> change only that message while the reply</p>
<p>runs.</p>
<p>On the wire every piece of reply text names its message: <code>run_content</code></p>
<p>carries <code>message_id</code> with a <code>token</code> (appended) or a whole <code>content</code> (sets that</p>
<p>message's text), plus <code>author</code> when set. <code>message_element</code> and</p>
<p><code>message_actions</code> carry the same <code>message_id</code>; <code>message_update</code>,</p>
<p><code>message_remove</code> and <code>action_remove</code> edit a message already shown.</p>
<p>The sections below list each element's fields.</p>
<h2>Element Types</h2>
<h3>1. Image Elements</h3>
<p>Display images with thumbnail and click-to-zoom functionality.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Image URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>alt</code> (optional): Alt text for accessibility</li>
<li><code>display</code> (optional): Display mode - "inline" (default), "side", "page"</li>
<li><code>width</code> (optional): Fixed width in pixels</li>
<li><code>height</code> (optional): Fixed height in pixels</li>
<h3>2. PDF Elements</h3>
<p>Display PDF documents with inline viewer or link to open in new tab.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): PDF URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>display</code> (optional):</li>
<li><code>"inline"</code>: Embedded PDF viewer (600px height)</li>
<li><code>"side"</code>: Smaller embedded viewer (400px height)</li>
<li><code>"page"</code>: Link to open in new tab</li>
<h3>3. Video Elements</h3>
<p>Display videos with native HTML5 video player.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Video URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>controls</code> (optional): Show video controls (default: True)</li>
<li><code>autoplay</code> (optional): Auto-play video (default: False)</li>
<li><code>loop</code> (optional): Loop video (default: False)</li>
<h3>4. Audio Elements</h3>
<p>Display audio with native HTML5 audio player.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Audio URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>controls</code> (optional): Show audio controls (default: True)</li>
<li><code>autoplay</code> (optional): Auto-play audio (default: False)</li>
<li><code>loop</code> (optional): Loop audio (default: False)</li>
<h3>5. File Elements</h3>
<p>Display downloadable files with file type icons and size information.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): File download URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>size</code> (optional): File size in bytes</li>
<li><code>mime_type</code> (optional): MIME type for file type detection</li>
<h3>6. Code Elements</h3>
<p>Display syntax-highlighted code blocks with copy functionality.</p>
<p><strong>Properties:</strong></p>
<li><code>content</code> (required): Code content</li>
<li><code>language</code> (optional): Programming language for syntax highlighting</li>
<li><code>name</code> (optional): Display name</li>
<h2>Display Modes</h2>
<p>All elements support three display modes:</p>
<li><strong><code>inline</code></strong> (default): Full width, normal display</li>
<li><strong><code>side</code></strong>: Smaller size, suitable for sidebars</li>
<li><strong><code>page</code></strong>: Full page width, maximum size</li>
<h2>Size Limits</h2>
<p><code>add_file()</code> raises <code>ValueError</code> when <code>size</code> is over 100 MB and <code>add_code()</code></p>
<p>when <code>content</code> is over 1 MB. Dict elements are not checked.</p>
<h2>Typed models</h2>
<p><code>praisonaiui.schema.models</code> has a model per type (<code>ImageElement</code>, <code>PdfElement</code>,</p>
<p><code>VideoElement</code>, <code>AudioElement</code>, <code>FileElement</code>, <code>CodeElement</code>) that validates the</p>
<p>fields above:</p>
<h2>Agent-generated images (streaming)</h2>
<p>When an agent or tool <strong>creates</strong> an image during a chat run, the UI receives <code>message_element</code> events over WebSocket/SSE and renders them inline. This uses the same element dict shape as above but is driven by the RunEvent protocol, not only <code>Message.send()</code>.</p>
<p>See <strong>Image Preview in Chat</strong> for the full architecture: detection (<code>media_utils</code>), provider bridge, persistence, and swappable backends.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/features/message-elements.source.md", "text": "# Message Elements\n\nA message can carry elements: images, PDFs, videos, audio, files and code\nblocks shown with the message text. Each element is a dict with a `type`, the\nfields below, and an optional `name` and `display`.\n\n## Sending elements\n\nThese reach the chat as `message_element` events:\n\n```python\nimport praisonaiui as aiui\nfrom praisonaiui import Message\n\n@aiui.reply\nasync def on_message(message):\n    # One media item per call\n    await aiui.image(\"https://example.com/chart.png\", alt=\"Monthly sales\")\n    await aiui.file(\"https://example.com/data.csv\", name=\"Data Export\")\n\n    # Or elements as dicts on a Message\n    msg = Message(\"Check out this chart:\")\n    msg.elements = [\n        {\"type\": \"image\", \"url\": \"https://example.com/chart.png\", \"name\": \"Sales Chart\"},\n    ]\n    await msg.send()\n```\n\n`aiui.audio(url)` and `aiui.video(url)` work the same way.\n\n`msg.add_image()`, `add_pdf()`, `add_video()`, `add_audio()`, `add_file()`\nand `add_code()` validate their arguments and append typed elements\n(`ImageElement` and the others in `praisonaiui.schema.models`); they reach the\nchat like dicts. So does any object with `model_dump()` or `to_dict()`.\n\n## Several messages in one reply\n\nEach `aiui.Message(...).send()` and each `aiui.say(...)` is its own message:\nthe chat shows it at once, as its own block under the same answer, with its\nauthor when it is not the agent, and its elements and actions under it. A\nreload shows the same blocks.\n\n```python\n@aiui.reply\nasync def on_message(message):\n    await aiui.Message(content=\"Looking that up...\").send()\n    chart = aiui.Message(content=\"Here is the chart:\", author=\"Analyst\")\n    chart.add_image(url=\"https://example.com/chart.png\", alt=\"Sales\")\n    await chart.send()\n\n    answer = aiui.Message(content=\"\")\n    for token in [\"The \", \"total \", \"is 42.\"]:\n        await answer.stream_token(token)\n    await answer.send()  # finalizes: the text is not repeated\n```\n\nCopy, feedback and Regenerate act on the whole answer. The saved reply keeps\n`content` (the messages joined by a blank line) and `segments`\n(`[{id, text, author?}]`); elements carry the `message_id` of their message.\n`msg.update()` and `msg.remove()` change only that message while the reply\nruns.\n\nOn the wire every piece of reply text names its message: `run_content`\ncarries `message_id` with a `token` (appended) or a whole `content` (sets that\nmessage's text), plus `author` when set. `message_element` and\n`message_actions` carry the same `message_id`; `message_update`,\n`message_remove` and `action_remove` edit a message already shown.\n\nThe sections below list each element's fields.\n\n## Element Types\n\n### 1. Image Elements\n\nDisplay images with thumbnail and click-to-zoom functionality.\n\n```python\nfrom praisonaiui import Message\n\nmsg = Message(\"Check out this chart:\")\nmsg.add_image(\n    url=\"https://example.com/chart.png\",\n    name=\"Sales Chart\",\n    alt=\"Monthly sales chart showing growth\",\n    display=\"inline\"  # or \"side\", \"page\"\n)\nawait msg.send()\n```\n\n**Properties:**\n- `url` (required): Image URL\n- `name` (optional): Display name\n- `alt` (optional): Alt text for accessibility\n- `display` (optional): Display mode - \"inline\" (default), \"side\", \"page\"\n- `width` (optional): Fixed width in pixels\n- `height` (optional): Fixed height in pixels\n\n### 2. PDF Elements\n\nDisplay PDF documents with inline viewer or link to open in new tab.\n\n```python\nmsg.add_pdf(\n    url=\"https://example.com/report.pdf\",\n    name=\"Quarterly Report\",\n    display=\"inline\"  # Shows PDF viewer inline\n)\n```\n\n**Properties:**\n- `url` (required): PDF URL\n- `name` (optional): Display name\n- `display` (optional):\n  - `\"inline\"`: Embedded PDF viewer (600px height)\n  - `\"side\"`: Smaller embedded viewer (400px height)\n  - `\"page\"`: Link to open in new tab\n\n### 3. Video Elements\n\nDisplay videos with native HTML5 video player.\n\n```python\nmsg.add_video(\n    url=\"https://example.com/demo.mp4\",\n    name=\"Product Demo\",\n    controls=True,  # Show video controls\n    autoplay=False  # Don't autoplay\n)\n```\n\n**Properties:**\n- `url` (required): Video URL\n- `name` (optional): Display name\n- `controls` (optional): Show video controls (default: True)\n- `autoplay` (optional): Auto-play video (default: False)\n- `loop` (optional): Loop video (default: False)\n\n### 4. Audio Elements\n\nDisplay audio with native HTML5 audio player.\n\n```python\nmsg.add_audio(\n    url=\"https://example.com/clip.mp3\",\n    name=\"Audio Clip\",\n    controls=True\n)\n```\n\n**Properties:**\n- `url` (required): Audio URL\n- `name` (optional): Display name\n- `controls` (optional): Show audio controls (default: True)\n- `autoplay` (optional): Auto-play audio (default: False)\n- `loop` (optional): Loop audio (default: False)\n\n### 5. File Elements\n\nDisplay downloadable files with file type icons and size information.\n\n```python\nmsg.add_file(\n    url=\"https://example.com/data.csv\",\n    name=\"Data Export\",\n    size=1024000,  # Size in bytes\n    mime_type=\"text/csv\"\n)\n```\n\n**Properties:**\n- `url` (required): File download URL\n- `name` (optional): Display name\n- `size` (optional): File size in bytes\n- `mime_type` (optional): MIME type for file type detection\n\n### 6. Code Elements\n\nDisplay syntax-highlighted code blocks with copy functionality.\n\n```python\nmsg.add_code(\n    content='print(\"Hello, World!\")',\n    language=\"python\",\n    name=\"Hello World Example\"\n)\n```\n\n**Properties:**\n- `content` (required): Code content\n- `language` (optional): Programming language for syntax highlighting\n- `name` (optional): Display name\n\n## Display Modes\n\nAll elements support three display modes:\n\n- **`inline`** (default): Full width, normal display\n- **`side`**: Smaller size, suitable for sidebars\n- **`page`**: Full page width, maximum size\n\n## Size Limits\n\n`add_file()` raises `ValueError` when `size` is over 100 MB and `add_code()`\nwhen `content` is over 1 MB. Dict elements are not checked.\n\n## Typed models\n\n`praisonaiui.schema.models` has a model per type (`ImageElement`, `PdfElement`,\n`VideoElement`, `AudioElement`, `FileElement`, `CodeElement`) that validates the\nfields above:\n\n```python\nfrom praisonaiui.schema.models import ImageElement\n\nelement = ImageElement(url=\"https://example.com/image.png\", alt=\"Description\")\nmsg.elements.append(element.model_dump(exclude_none=True))\n```\n\n## Agent-generated images (streaming)\n\nWhen an agent or tool **creates** an image during a chat run, the UI receives `message_element` events over WebSocket/SSE and renders them inline. This uses the same element dict shape as above but is driven by the [RunEvent protocol](../concepts/providers.md), not only `Message.send()`.\n\nSee **[Image Preview in Chat](image-preview-chat.md)** for the full architecture: detection (`media_utils`), provider bridge, persistence, and swappable backends."}</script>
