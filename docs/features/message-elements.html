<p>PraisonAIUI supports rich inline message elements for displaying images, PDFs, videos, audio, files, and code blocks within chat messages.</p>
<h2>Element Types</h2>
<h3>1. Image Elements</h3>
<p>Display images with thumbnail and click-to-zoom functionality.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Image URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>alt</code> (optional): Alt text for accessibility</li>
<li><code>display</code> (optional): Display mode - "inline" (default), "side", "page"</li>
<li><code>width</code> (optional): Fixed width in pixels</li>
<li><code>height</code> (optional): Fixed height in pixels</li>
<h3>2. PDF Elements</h3>
<p>Display PDF documents with inline viewer or link to open in new tab.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): PDF URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>display</code> (optional):</li>
<li><code>"inline"</code>: Embedded PDF viewer (600px height)</li>
<li><code>"side"</code>: Smaller embedded viewer (400px height)</li>
<li><code>"page"</code>: Link to open in new tab</li>
<h3>3. Video Elements</h3>
<p>Display videos with native HTML5 video player.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Video URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>controls</code> (optional): Show video controls (default: True)</li>
<li><code>autoplay</code> (optional): Auto-play video (default: False)</li>
<li><code>loop</code> (optional): Loop video (default: False)</li>
<h3>4. Audio Elements</h3>
<p>Display audio with native HTML5 audio player.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): Audio URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>controls</code> (optional): Show audio controls (default: True)</li>
<li><code>autoplay</code> (optional): Auto-play audio (default: False)</li>
<li><code>loop</code> (optional): Loop audio (default: False)</li>
<h3>5. File Elements</h3>
<p>Display downloadable files with file type icons and size information.</p>
<p><strong>Properties:</strong></p>
<li><code>url</code> (required): File download URL</li>
<li><code>name</code> (optional): Display name</li>
<li><code>size</code> (optional): File size in bytes</li>
<li><code>mime_type</code> (optional): MIME type for file type detection</li>
<h3>6. Code Elements</h3>
<p>Display syntax-highlighted code blocks with copy functionality.</p>
<p><strong>Properties:</strong></p>
<li><code>content</code> (required): Code content</li>
<li><code>language</code> (optional): Programming language for syntax highlighting</li>
<li><code>name</code> (optional): Display name</li>
<h2>Display Modes</h2>
<p>All elements support three display modes:</p>
<li><strong><code>inline</code></strong> (default): Full width, normal display</li>
<li><strong><code>side</code></strong>: Smaller size, suitable for sidebars</li>
<li><strong><code>page</code></strong>: Full page width, maximum size</li>
<h2>Size Limits</h2>
<li><strong>File elements</strong>: Maximum 100MB per file</li>
<li><strong>Code elements</strong>: Maximum 1MB per code block</li>
<li><strong>Images</strong>: No size limit (browser-dependent)</li>
<h2>Accessibility Features</h2>
<li><strong>Images</strong>: Alt text support, keyboard navigation for zoom</li>
<li><strong>PDFs</strong>: Proper ARIA labels and roles</li>
<li><strong>Videos/Audio</strong>: Native browser accessibility</li>
<li><strong>Files</strong>: Icon-based file type recognition</li>
<li><strong>Code</strong>: Copy button with keyboard support</li>

<h2>Legacy Support</h2>
<p>The new element system maintains backward compatibility with existing message properties:</p>
<li><code>message.images</code> (still supported)</li>
<li><code>message.files</code> (still supported)</li>
<li>New <code>message.elements</code> takes precedence when both are present</li>
<p>This ensures existing code continues to work while providing a migration path to the new standardized element system.</p>
<h2>Agent-generated images (streaming)</h2>
<p>When an agent or tool <strong>creates</strong> an image during a chat run, the UI receives <code>message_element</code> events over WebSocket/SSE and renders them inline. This uses the same element dict shape as above but is driven by the RunEvent protocol, not only <code>Message.send()</code>.</p>
<p>See <strong>Image Preview in Chat</strong> for the full architecture: detection (<code>media_utils</code>), provider bridge, persistence, and swappable backends.</p></noscript></div>
