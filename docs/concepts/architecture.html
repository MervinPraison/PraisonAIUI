<p>PraisonAIUI has <strong>two complementary integration layers</strong> with the praisonai backend. They solve different problems and run side-by-side.</p>
<h2>Protocol Stack</h2>
<p>AG-UI sits alongside MCP and A2A in the agentic protocol stack:</p>
<p>| Protocol | Purpose |</p>
<p>|----------|---------|</p>
<p>| <strong>MCP</strong> | Gives agents tools |</p>
<p>| <strong>A2A</strong> | Agent-to-agent communication |</p>
<p>| <strong>AG-UI</strong> | Agent-to-user-interface (streaming) |</p>
<p>| <strong>Gateway</strong> | Infrastructure management (channels, nodes, instances) |</p>
<h2>AG-UI — The Conversation Layer</h2>
<p><a href="https://ag-ui.com/">AG-UI</a> is an <strong>open, event-based protocol</strong> by CopilotKit that standardizes how agent backends stream events to frontends. PraisonAI implements it at <code>praisonaiagents/ui/agui/</code>.</p>
<p><strong>What it does:</strong> Streams ~16 standard event types (text deltas, tool calls, state sync, generative UI) over SSE.</p>
<p><strong>Who uses it:</strong> LangGraph, CrewAI, Google ADK, Microsoft Agent Framework, AWS Strands, Mastra, Pydantic AI, LlamaIndex, AG2, and PraisonAI.</p>
<h3>Usage</h3>
<p><strong>Frontend compatibility:</strong> CopilotKit, or any AG-UI-compatible client.</p>
<h2>Gateway Integration — The Operations Layer</h2>
<p>The gateway integration connects PraisonAIUI's dashboard features to the live <code>WebSocketGateway</code> backend for infrastructure management.</p>
<p><strong>What it does:</strong> CRUD for channels, nodes, instances; live bot status; heartbeat monitoring.</p>
<h3>How It Works</h3>
<h3>Key Files</h3>
<p>| File | Purpose |</p>
<p>|------|---------|</p>
<p>| <code>features/_gateway_ref.py</code> | Thread-safe singleton holding reference to the live gateway |</p>
<p>| <code>features/channels.py</code> | Channel CRUD + live status enrichment from gateway |</p>
<p>| <code>features/nodes.py</code> | Node CRUD + gateway health enrichment |</p>
<p>| <code>integration.py</code> | Calls <code>set_gateway()</code> on start, clears on stop |</p>
<p>| <code>config_store.py</code> | Unified <code>~/.praisonaiui/config.yaml</code> — single source of truth for all feature state |</p>
<h3>API Endpoints</h3>
<p>| Endpoint | Methods | Description |</p>
<p>|----------|---------|-------------|</p>
<p>| <code>/api/channels</code> | GET, POST | List/create channels |</p>
<p>| <code>/api/channels/{id}</code> | GET, PUT, DELETE | Channel CRUD |</p>
<p>| <code>/api/channels/{id}/toggle</code> | POST | Enable/disable |</p>
<p>| <code>/api/channels/{id}/status</code> | GET | Live running status |</p>
<p>| <code>/api/channels/platforms</code> | GET | Supported platforms |</p>
<p>| <code>/api/nodes</code> | GET, POST | List/register nodes |</p>
<p>| <code>/api/nodes/{id}</code> | GET, PUT, DELETE | Node CRUD |</p>
<p>| <code>/api/nodes/{id}/status</code> | GET | Node status + gateway enrichment |</p>
<p>| <code>/api/nodes/{id}/agents</code> | GET, PUT | Agent bindings |</p>
<p>| <code>/api/instances</code> | GET | Connected instances |</p>
<p>| <code>/api/instances/heartbeat</code> | POST | Presence heartbeat |</p>
<h2>Using Both Together</h2>
<p><code>AIUIGateway.start()</code> in <code>integration.py</code> mounts the gateway and dashboard REST API on one server. Chat uses the built-in WebSocket/SSE <code>RunEvent</code> protocol; AG-UI is mounted separately via <code>AguiFeature</code> when enabled:</p>
<h2>Summary</h2>
<p>| | AG-UI (<code>/agui</code>) | Gateway (<code>/api/*</code>) |</p>
<p>|---|---|---|</p>
<p>| <strong>Layer</strong> | Conversation | Operations |</p>
<p>| <strong>Transport</strong> | SSE (server-sent events) | REST + WebSocket |</p>
<p>| <strong>Purpose</strong> | Stream agent responses to users | Manage channels, nodes, instances |</p>
<p>| <strong>Frontend</strong> | CopilotKit / AG-UI clients | PraisonAIUI React dashboard |</p>
<p>| <strong>Protocol</strong> | Open standard (~16 event types) | Internal REST API |</p></noscript></div>
