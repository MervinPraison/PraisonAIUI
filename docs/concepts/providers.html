<p>PraisonAIUI uses a <strong>provider protocol</strong> — a simple abstraction that lets you plug in any AI backend.</p>
<h2>Architecture</h2>
<p>The provider protocol is the <strong>only contract</strong> between the frontend and any AI backend. All dashboard pages (<code>/api/overview</code>, <code>/api/config</code>, <code>/api/logs</code>, etc.) are provider-agnostic — they always work regardless of which backend is active. The provider only handles agent execution (<code>run()</code>), agent listing (<code>list_agents()</code>), and health checks (<code>health()</code>).</p>
<h2>How It Works</h2>
<p>1. User sends a message → <code>POST /run</code></p>
<p>2. Server calls <code>provider.run(message)</code> on the active provider</p>
<p>3. Provider yields <code>RunEvent</code> objects (start, content, tool calls, reasoning, completion)</p>
<p>4. Server serialises each <code>RunEvent</code> to an SSE <code>data:</code> frame</p>
<p>5. Frontend <code>useSSE.ts</code> parses events and renders components</p>
<h2>Built-in Provider: PraisonAI</h2>
<p>PraisonAI is the default provider. It wraps the <code>@aiui.reply</code> callback system:</p>
<p>No extra config needed — <code>PraisonAIProvider</code> is used automatically.</p>
<h3>Agent Tools and Reflection</h3>
<p>The default provider resolves tools for agents using <code>ToolResolver</code> from the <code>praisonai</code> package. Agents created via the CRUD API or <code>~/.praisonaiui/config.yaml</code> get their tool names (strings) automatically resolved to callable Python functions:</p>
<p>When no tools are configured, the provider gives agents sensible defaults (<code>internet_search</code>).</p>
<p>Agents also support <code>reflection: true</code> (default) for self-reflection mode, where the agent evaluates its own response quality before returning.</p>
<h2>Swapping Providers</h2>
<h2>Writing a Custom Provider</h2>
<p>Implement <code>BaseProvider.run()</code> — that's it:</p>
<h3>Inline media (images, video, files)</h3>
<p>Any provider can attach rich media to chat messages using `<code>MESSAGE_ELEMENT</code>`</p>
<p>events. The UI renders them inline and persists them in session history.</p>
<p>Tool results from PraisonAI agents are also detected automatically when they</p>
<p>match OpenAI image shapes (`<code>{"data": [{"url": "..."}]}</code>`) or explicit element</p>
<p>dicts — no provider code required.</p>
<p>Callback handlers can use `<code>Message.add_image()</code><code> or </code><code>await aiui.image(url)</code>`</p>
<p>and the default `<code>PraisonAIProvider</code><code> maps those to </code><code>MESSAGE_ELEMENT</code>` events.</p>
<p>Full architecture, data flows, and tests: Image Preview in Chat.</p>
<h3>With Tool Calls and Reasoning</h3>
<h2>RunEvent Reference</h2>
<p>Every event has a <code>type</code> field and optional payload fields:</p>
<p>| Field | Type | Used By |</p>
<p>|-------|------|---------|</p>
<p>| <code>type</code> | <code>RunEventType</code> | All events |</p>
<p>| <code>content</code> | <code>str</code> | <code>RUN_COMPLETED</code>, <code>RUN_CONTENT</code> |</p>
<p>| <code>token</code> | <code>str</code> | <code>RUN_CONTENT</code> (streaming) |</p>
<p>| <code>name</code> | <code>str</code> | <code>TOOL_CALL_*</code> |</p>
<p>| <code>args</code> | <code>dict</code> | <code>TOOL_CALL_STARTED</code> |</p>
<p>| <code>result</code> | <code>any</code> | <code>TOOL_CALL_COMPLETED</code> |</p>
<p>| <code>step</code> | <code>str</code> | <code>REASONING_STEP</code> |</p>
<p>| <code>error</code> | <code>str</code> | <code>RUN_ERROR</code> |</p>
<p>| <code>agent_name</code> | <code>str</code> | Multi-agent events |</p>
<p>| <code>extra_data</code> | <code>dict</code> | Custom payload (includes <code>element</code> for <code>message_element</code>) |</p>
<h3>Event Types (27 total)</h3>
<p>=== "Agent Events"</p>
<p>| Type | Description |</p>
<p>|------|-------------|</p>
<p>| <code>run_started</code> | Agent run begins |</p>
<p>| <code>run_content</code> | Streaming token or content chunk |</p>
<p>| <code>run_completed</code> | Agent run finished |</p>
<p>| <code>run_error</code> | Error occurred |</p>
<p>| <code>run_cancelled</code> | User cancelled |</p>
<p>| <code>tool_call_started</code> | Tool invocation started |</p>
<p>| <code>tool_call_completed</code> | Tool returned result |</p>
<p>| <code>reasoning_started</code> | Thinking begun |</p>
<p>| <code>reasoning_step</code> | Individual reasoning step |</p>
<p>| <code>reasoning_completed</code> | Thinking finished |</p>
<p>| <code>memory_update_started</code> | Memory write begun |</p>
<p>| <code>memory_update_completed</code> | Memory write done |</p>
<p>| <code>updating_memory</code> | Memory being updated |</p>
<p>| <code>run_paused</code> | Run paused (e.g. waiting for user) |</p>
<p>| <code>run_continued</code> | Run resumed |</p>
<p>| <code>message_element</code> | Inline media element (image, video, file, etc.) — see Image Preview in Chat |</p>
<p>=== "Team Events"</p>
<p>| Type | Description |</p>
<p>|------|-------------|</p>
<p>| <code>team_run_started</code> | Team run begins |</p>
<p>| <code>team_run_content</code> | Team streaming content |</p>
<p>| <code>team_run_completed</code> | Team run finished |</p>
<p>| <code>team_run_error</code> | Team error |</p>
<p>| <code>team_run_cancelled</code> | Team cancelled |</p>
<p>| <code>team_tool_call_started</code> | Team tool call started |</p>
<p>| <code>team_tool_call_completed</code> | Team tool call done |</p>
<p>| <code>team_reasoning_started</code> | Team reasoning begun |</p>
<p>| <code>team_reasoning_step</code> | Team reasoning step |</p>
<p>| <code>team_reasoning_completed</code> | Team reasoning done |</p>
<p>| <code>team_memory_update_started</code> | Team memory update started |</p>
<p>| <code>team_memory_update_completed</code> | Team memory update done |</p>
<h2>API Summary</h2>
<h3>`BaseProvider` (abstract)</h3>
<p>:   Subclass and implement <code>run()</code> to create a custom provider.</p>
<p>| Method | Description |</p>
<p>|--------|-------------|</p>
<p>| <code>run(message, *, session_id, agent_name, <strong>kw)</code> | </strong>Required.** Async generator yielding <code>RunEvent</code> objects |</p>
<p>| <code>list_agents()</code> | Optional. Returns list of available agents |</p>
<p>| <code>health()</code> | Optional. Returns health check dict |</p>
<h3>`RunEvent` (dataclass)</h3>
<p>:   Structured event with <code>type: RunEventType</code> and optional payload fields (see table above).</p>
<li><code>to_dict()</code> → serialise to JSON-compatible dict matching the frontend <code>SSEEvent</code> interface</li>
<h3>`RunEventType` (enum)</h3>
<p>:   27 string values matching the frontend <code>types.ts</code> — see Agent Events and Team Events tabs above.</p>
<h3>Helper Functions</h3>
<p>| Function | Description |</p>
<p>|----------|-------------|</p>
<p>| <code>praisonaiui.set_provider(provider)</code> | Set the active provider |</p>
<p>| <code>praisonaiui.get_provider()</code> | Get the active provider (lazy-inits <code>PraisonAIProvider</code>) |</p></noscript></div>
