<p>The <code>aiui.yaml</code> schema: what <code>aiui validate</code> checks and <code>aiui build</code></p>
<p>compiles. The source of truth is</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/schema/models.py"><code>schema/models.py</code></a></p>
<p>(<code>Config</code>). The runtime state file of a running server is a different file; see</p>
<p>Runtime Persistence below.</p>
<h2>Config file name</h2>
<p><code>aiui validate</code>, <code>aiui build</code> and <code>aiui serve</code> find the file in this order:</p>
<p>1. <code>--config &lt;path&gt;</code>, when given. It always wins and prints nothing extra.</p>
<p>2. <code>./aiui.yaml</code>.</p>
<p>3. <code>./aiui.template.yaml</code>, the old name. It still works; the command prints one</p>
<p>dim line on stderr and its exit code does not change:</p>
<p><code>Using aiui.template.yaml; rename it to aiui.yaml (the old name keeps working).</code></p>
<p>When both files exist, <code>aiui.yaml</code> is used and the command says so in one line</p>
<p>(<code>Using aiui.yaml; aiui.template.yaml is also here and is ignored.</code>). With</p>
<p>neither, the command stops with <code>Configuration file not found: aiui.yaml</code>.</p>
<p><code>aiui init</code> writes <code>aiui.yaml</code> and refuses to overwrite either name without</p>
<p><code>--force</code>. <code>aiui dev</code> reads either name, and <code>aiui dev --examples</code> accepts either name in each example folder. <code>aiui.yml</code></p>
<p>is not looked up; pass it with <code>--config</code>.</p>
<h2>Split the config with `$ref`</h2>
<p>Any mapping can live in its own file. <code>$ref</code> names a YAML (or JSON) file,</p>
<p>relative to the file that holds the <code>$ref</code>:</p>
<li>Included files can include others; keys written next to <code>$ref</code> override the</li>
<p>included ones.</p>
<li>Paths stay inside the folder of <code>aiui.yaml</code>; a file that includes itself,</li>
<p>directly or through others, is an error (`$ref cycle: aiui.yaml -&gt;</p>
<p>config/nav.yaml -&gt; aiui.yaml`).</p>
<li>Errors name the file and line of the <code>$ref</code> (`aiui.yaml:6: $ref</li>
<p>'./config/nav.yaml' not found`); a YAML error or an unknown key inside an</p>
<p>included file names that file. <code>validate</code>, <code>build</code>, <code>serve</code>, `docs</p>
<p>check-links` and the server all read includes.</p>
<h2>Editor setup</h2>
<p><code>aiui init</code> starts <code>aiui.yaml</code> with this line:</p>
<p>Editors that run the YAML language server (VS Code with the Red Hat YAML</p>
<p>extension, JetBrains IDEs, Neovim, Zed) then complete keys, show each key's</p>
<p>description on hover and underline wrong values as you type; add the line to</p>
<p>an existing <code>aiui.yaml</code> for the same. The schema is generated from the</p>
<p><code>Config</code> model, so it never drifts from <code>aiui validate</code>. For the exact</p>
<p>installed version (offline, or pinned), run <code>aiui schema -o aiui.schema.json</code></p>
<p>and use <code>$schema=./aiui.schema.json</code>.</p>

<p>| Key | What it sets | Page |</p>

<p>| <code>schemaVersion</code> | Schema version (<code>1</code>) | below |</p>

<p>| <code>style</code> | UI style (<code>docs</code> by default for a site) | UI Styles |</p>
<p>| <code>content</code> | Where the Markdown lives | Content Sources |</p>

<p><code>aiui validate --strict</code> turns unknown keys into errors.</p>

<p>&gt; <strong>Note</strong>: The <code>ui</code> field is a theming hint. Components are UI-agnostic and use CSS classes you can style with any framework.</p>

<p>Auto-install shadcn components at build time:</p>
<p>When you run <code>aiui build</code>, missing components are installed with</p>
<p><code>npx shadcn@latest add &lt;name&gt;</code> into the frontend source (<code>src/frontend</code> in a</p>
<p>repository checkout). This only matters when you build the frontend yourself;</p>
<p>the bundled React app does not change.</p>
<h2>Content Sources</h2>
<p><code>editLink</code>, <code>lastUpdated</code> and <code>feedback</code> draw the page footer; see</p>
<p>Writing docs pages → Page footer.</p>
<p><code>related</code> is the related pages list.</p>
<p><code>mcp</code> is the docs MCP server and</p>
<p><code>assistant</code> is Ask AI.</p>
<p><code>indexFiles</code> and <code>nav</code> (<code>mode</code>, <code>sort</code>, <code>collapsible</code>, <code>maxDepth</code>) are accepted</p>

<h2>Widget Zones</h2>
<p>Place widgets in layout zones without modifying markdown:</p>
<p>Zones, the widgets and which layouts render them:</p>
<p>Widget Zones.</p>
<h2>Routes</h2>
<p>Map URL patterns to templates:</p>
<p>Route matching uses glob patterns:</p>
<li><code>*</code> - one path segment</li>
<li><code>**</code> - any number of segments</li>
<p>The first matching route wins, so list specific routes before broad ones.</p>
<p>A route's <code>slots</code> can override only the <code>right</code> slot in the docs site</p>
<p>(<code>right: null</code> hides the table of contents); header and footer are read from</p>
<p>the template, so per-route overrides of them have no effect.</p>

<h2>Runtime Persistence (`config.yaml`)</h2>
<p>&gt; <strong>Single source of truth</strong> for all runtime feature state.</p>
<p>In addition to <code>aiui.yaml</code> (which drives static site generation), PraisonAIUI uses a <strong>unified runtime config file</strong>, <code>config.yaml</code> in the data directory (<code>AIUI_DATA_DIR</code>, default <code>~/.praisonaiui/</code>). This file stores all feature state — agents, channels, guardrails, schedules, and runtime settings — in a single YAML file that persists across server restarts.</p>
<p>This is compatible with the <code>gateway.yaml</code> schema used by <code>praisonai gateway start --config</code>.</p>
<h3>Schema</h3>
<h3>How It Works</h3>
<p>All CRUD operations (dashboard, REST API, CLI) <strong>automatically write back</strong> to this file:</p>
<p>| Feature | Section | Written On |</p>
<p>|---------|---------|------------|</p>
<p>| Config Runtime | <code>runtime_config</code> | PATCH, PUT, DELETE, apply |</p>
<p>| Guardrails | <code>guardrails</code> | Register |</p>
<p>| Channels | <code>channels</code> | Add, update, delete |</p>
<p>| Schedules | <code>schedules</code> | Add, remove, update |</p>
<p>| Agents | <code>agents</code> | Create, update, delete |</p>
<li><strong>Atomic writes</strong>: a temp file and <code>os.replace()</code> prevent corruption.</li>
<li><strong>Hot reload</strong>: the Config Hot-Reload watcher, once started, reloads this file after external edits.</li>
<li><strong>Secrets</strong>: channel secrets are written as <code>env:VAR_NAME</code> references (a <code>&lt;key&gt;_ref</code> key works too); the server refuses an inline token that looks like a secret and redacts secrets in API responses.</li>
<p>Rule of thumb: secrets (API keys, tokens) go in environment variables;</p>
<p>preferences (model, theme, branding) in the config file.</p>
<h3>Relationship to `aiui.yaml`</h3>
<p>| File | Purpose | Used By |</p>
<p>|------|---------|---------|</p>
<p>| <code>aiui.yaml</code> | Static site layout, components, routes | <code>aiui build</code>, <code>aiui serve</code>, <code>aiui validate</code> |</p>
<p>| <code>$AIUI_DATA_DIR/config.yaml</code> | Runtime feature state (agents, channels, config) | <code>aiui run</code>, dashboard API |</p>
<p>| <code>gateway.yaml</code> | Subset of <code>config.yaml</code> (legacy compatibility) | <code>praisonai gateway start</code> |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/concepts/configuration.source.md", "text": "---\nnav_title: YAML configuration\n---\n\n# YAML Configuration\n\nThe `aiui.yaml` schema: what `aiui validate` checks and `aiui build`\ncompiles. The source of truth is\n[`schema/models.py`](https://github.com/MervinPraison/PraisonAIUI/blob/main/src/praisonaiui/schema/models.py)\n(`Config`). The runtime state file of a running server is a different file; see\n[Runtime Persistence](#runtime-persistence-configyaml) below.\n\n## Config file name\n\n`aiui validate`, `aiui build` and `aiui serve` find the file in this order:\n\n1. `--config \u003cpath\u003e`, when given. It always wins and prints nothing extra.\n2. `./aiui.yaml`.\n3. `./aiui.template.yaml`, the old name. It still works; the command prints one\n   dim line on stderr and its exit code does not change:\n   `Using aiui.template.yaml; rename it to aiui.yaml (the old name keeps working).`\n\nWhen both files exist, `aiui.yaml` is used and the command says so in one line\n(`Using aiui.yaml; aiui.template.yaml is also here and is ignored.`). With\nneither, the command stops with `Configuration file not found: aiui.yaml`.\n`aiui init` writes `aiui.yaml` and refuses to overwrite either name without\n`--force`. `aiui dev` reads either name, and `aiui dev --examples` accepts either name in each example folder. `aiui.yml`\nis not looked up; pass it with `--config`.\n\n## Split the config with `$ref`\n\nAny mapping can live in its own file. `$ref` names a YAML (or JSON) file,\nrelative to the file that holds the `$ref`:\n\n```yaml\n# aiui.yaml\nsite:\n  title: My Docs\nnavigation:\n  $ref: ./config/nav.yaml\n```\n\n```yaml\n# config/nav.yaml\ntabs:\n  - tab: Guides\n    groups:\n      - $ref: ./groups/guides.yaml\n```\n\n- Included files can include others; keys written next to `$ref` override the\n  included ones.\n- Paths stay inside the folder of `aiui.yaml`; a file that includes itself,\n  directly or through others, is an error (`$ref cycle: aiui.yaml -\u003e\n  config/nav.yaml -\u003e aiui.yaml`).\n- Errors name the file and line of the `$ref` (`aiui.yaml:6: $ref\n  './config/nav.yaml' not found`); a YAML error or an unknown key inside an\n  included file names that file. `validate`, `build`, `serve`, `docs\n  check-links` and the server all read includes.\n\n## Editor setup\n\n`aiui init` starts `aiui.yaml` with this line:\n\n```yaml\n# yaml-language-server: $schema=https://ui.praison.ai/aiui.schema.json\n```\n\nEditors that run the YAML language server (VS Code with the Red Hat YAML\nextension, JetBrains IDEs, Neovim, Zed) then complete keys, show each key's\ndescription on hover and underline wrong values as you type; add the line to\nan existing `aiui.yaml` for the same. The schema is generated from the\n`Config` model, so it never drifts from `aiui validate`. For the exact\ninstalled version (offline, or pinned), run `aiui schema -o aiui.schema.json`\nand use `$schema=./aiui.schema.json`.\n\n## Overview\n\n| Key | What it sets | Page |\n|-----|--------------|------|\n| `schemaVersion` | Schema version (`1`) | below |\n| `site` | Title, description, theme, logo, custom CSS | below, [Theming](../features/theming.md) |\n| `style` | UI style (`docs` by default for a site) | [UI Styles](../features/styles.md) |\n| `content` | Where the Markdown lives | [Content Sources](../features/content-sources.md) |\n| `components`, `templates`, `routes` | Layout of each page | below, [Templates](templates.md), [Slots](slots.md) |\n| `navigation`, `navbar`, `footer`, `logo`, `search` | Docs site chrome | [Navigation](../features/navigation.md) |\n| `seo`, `i18n`, `a11y` | Meta tags, locales, accessibility switches | [SEO](../features/seo.md), [i18n](../features/i18n.md) |\n| `layout` | Chat position, and the app shell's layouts | [Layouts](../features/layouts.md) |\n| `chat`, `auth`, `dashboard`, `widgets`, `extensions` | Chat, sign-in, dashboard and plugin settings | [Deployment](../features/deployment.md), [Plugins](../features/plugins.md) |\n| `dependencies` | shadcn components to install at build time | below |\n\n`aiui validate --strict` turns unknown keys into errors.\n\n## Schema Version\n\nAlways specify the schema version:\n\n```yaml\nschemaVersion: 1\n```\n\n## Site Configuration\n\n```yaml\nsite:\n  title: \"My Documentation\"          # Required\n  description: \"Site description\"    # Optional\n  routeBaseDocs: \"/docs\"             # Default: /docs\n  ui: \"shadcn\"                       # Theming hint (shadcn | mui | chakra)\n  theme:\n    preset: \"zinc\"                   # Any Tailwind color (22 options)\n    radius: \"md\"                     # none | sm | md | lg | xl\n    darkMode: true\n```\n\n\u003e **Note**: The `ui` field is a theming hint. Components are UI-agnostic and use CSS classes you can style with any framework.\n\n## Component Dependencies\n\nAuto-install shadcn components at build time:\n\n```yaml\ndependencies:\n  shadcn:\n    - accordion\n    - tabs\n    - dialog\n```\n\nWhen you run `aiui build`, missing components are installed with\n`npx shadcn@latest add \u003cname\u003e` into the frontend source (`src/frontend` in a\nrepository checkout). This only matters when you build the frontend yourself;\nthe bundled React app does not change.\n\n## Content Sources\n\n```yaml\ncontent:\n  docs:\n    dir: \"./docs\"                    # Path to docs folder\n    include:                         # Glob patterns\n      - \"**/*.md\"\n      - \"**/*.mdx\"\n    exclude:                         # Excluded patterns\n      - \"**/drafts/**\"\n    editLink:                        # \"Edit this page\" under each page\n      pattern: \"https://github.com/acme/site/edit/main/docs/:path\"\n      text: \"Edit this page\"         # optional\n    lastUpdated: true                # the date of the page's last commit\n    feedback:                        # \"Was this page helpful?\" (on by default; false: off)\n      issues: \"https://github.com/acme/site/issues/new\"  # optional\n      code: true                     # optional: a flag on each code block\n      endpoint: \"https://hooks.example.com/votes\"  # optional: static hosting\n    related: 5                       # related pages under each page (default 3; false: none)\n    mcp: false                       # no MCP server on aiui serve (default: on)\n    assistant:                       # Ask AI on aiui serve (default: on; false: off)\n      starters: [\"How do I install it?\"]\n      instructions: \"Call the product Acme.\"\n```\n\n`editLink`, `lastUpdated` and `feedback` draw the page footer; see\n[Writing docs pages → Page footer](../features/writing-docs.md#page-footer).\n`related` is the [related pages](../features/writing-docs.md#related-pages) list.\n`mcp` is the [docs MCP server](../features/ai-ready-docs.md#mcp-server) and\n`assistant` is [Ask AI](../features/ai-ready-docs.md#ask-ai).\n\n`indexFiles` and `nav` (`mode`, `sort`, `collapsible`, `maxDepth`) are accepted\nbut not read by the build yet; see [Navigation](../features/navigation.md).\n\n## Components\n\nDefine reusable components:\n\n```yaml\ncomponents:\n  my_header:\n    type: \"Header\"\n    props:\n      logoText: \"My Site\"\n      cta:\n        label: \"Get Started\"\n        href: \"/docs\"\n\n  my_footer:\n    type: \"Footer\"\n    props:\n      text: \"© 2024\"\n```\n\n### Built-in Component Types\n\n| Type | Description |\n|------|-------------|\n| `Header` | Site header with logo, nav, CTA |\n| `Footer` | Site footer |\n| `DocsSidebar` | Documentation sidebar navigation |\n| `Toc` | Table of contents |\n| `DocContent` | Rendered markdown content |\n\n## Templates\n\nTemplates combine a layout with slot assignments:\n\n```yaml\ntemplates:\n  docs:\n    layout: \"ThreeColumnLayout\"\n    slots:\n      header: { ref: \"my_header\" }     # Reference a component\n      left: { ref: \"sidebar_docs\" }\n      main: { type: \"DocContent\" }     # Direct type assignment\n      right: { type: \"Toc\" }\n      footer: { ref: \"my_footer\" }\n```\n\n### Layouts\n\n| Layout | Description |\n|--------|-------------|\n| `ThreeColumnLayout` | Sidebar + Content + TOC |\n| `TwoColumnLayout` | Sidebar + Content |\n| `CenteredLayout` | Centered content, no sidebar |\n| `FullWidthLayout` | Full width content |\n| `FlexibleLayout` | WordPress-style widget zones |\n\n## Widget Zones\n\nPlace widgets in layout zones without modifying markdown:\n\n```yaml\ntemplates:\n  docs:\n    layout: \"FlexibleLayout\"\n    zones:\n      rightSidebar:\n        - type: \"StatsCard\"\n          props:\n            title: \"Users\"\n            value: \"15,231\"\n            change: \"+20%\"\n      footer:\n        - type: \"Newsletter\"\n        - type: \"Copyright\"\n          props:\n            text: \"© 2024\"\n```\n\nZones, the widgets and which layouts render them:\n[Widget Zones](../features/widget-zones.md).\n\n## Routes\n\nMap URL patterns to templates:\n\n```yaml\nroutes:\n  - match: \"/docs/changelog\"\n    template: \"docs\"\n    slots:\n      right: null                      # Override: hide TOC\n\n  - match: \"/docs/**\"\n    template: \"docs\"\n```\n\nRoute matching uses glob patterns:\n- `*` - one path segment\n- `**` - any number of segments\n\nThe first matching route wins, so list specific routes before broad ones.\nA route's `slots` can override only the `right` slot in the docs site\n(`right: null` hides the table of contents); header and footer are read from\nthe template, so per-route overrides of them have no effect.\n\n## Complete Example\n\n```yaml\nschemaVersion: 1\n\nsite:\n  title: \"PraisonAI Docs\"\n  ui: \"shadcn\"\n  theme:\n    darkMode: true\n\ncontent:\n  docs:\n    dir: \"./docs\"\n\ncomponents:\n  header:\n    type: \"Header\"\n    props:\n      logoText: \"PraisonAI\"\n\n  footer:\n    type: \"Footer\"\n    props:\n      text: \"© 2024 Praison Limited\"\n\n  sidebar:\n    type: \"DocsSidebar\"\n    props:\n      source: \"docs-nav\"\n\ntemplates:\n  docs:\n    layout: \"ThreeColumnLayout\"\n    slots:\n      header: { ref: \"header\" }\n      left: { ref: \"sidebar\" }\n      main: { type: \"DocContent\" }\n      right: { type: \"Toc\" }\n      footer: { ref: \"footer\" }\n\nroutes:\n  - match: \"/docs/**\"\n    template: \"docs\"\n```\n\n---\n\n## Runtime Persistence (`config.yaml`)\n\n\u003e **Single source of truth** for all runtime feature state.\n\nIn addition to `aiui.yaml` (which drives static site generation), PraisonAIUI uses a **unified runtime config file**, `config.yaml` in the data directory (`AIUI_DATA_DIR`, default `~/.praisonaiui/`). This file stores all feature state — agents, channels, guardrails, schedules, and runtime settings — in a single YAML file that persists across server restarts.\n\nThis is compatible with the `gateway.yaml` schema used by `praisonai gateway start --config`.\n\n### Schema\n\n```yaml\n# ~/.praisonaiui/config.yaml (auto-generated)\nschemaVersion: 2\n\nserver:\n  host: \"127.0.0.1\"\n  port: 8003\n\nprovider:\n  name: \"openai\"\n  model: \"gpt-4o-mini\"\n\ngateway:\n  host: \"127.0.0.1\"\n  port: 8765\n\n# Agent definitions (same schema as gateway.yaml)\nagents:\n  personal:\n    name: \"Personal Assistant\"\n    instructions: \"You are a friendly personal assistant.\"\n    model: \"gpt-4o-mini\"\n    tools: [\"internet_search\"]\n\n# Messaging channels\nchannels:\n  telegram_bot:\n    name: \"My Bot\"\n    platform: \"telegram\"\n    config:\n      bot_token: \"env:TELEGRAM_BOT_TOKEN\"\n\n# Runtime configuration (set via /api/config/runtime)\nruntime_config:\n  model: \"gpt-4o\"\n  temperature: 0.7\n\n# Guardrail definitions\nguardrails:\n  registry:\n    polite_check:\n      description: \"Output must be polite\"\n\n# Scheduled jobs\nschedules:\n  jobs:\n    daily_report:\n      name: \"Daily Report\"\n      schedule:\n        kind: every\n        every_seconds: 86400\n```\n\n### How It Works\n\nAll CRUD operations (dashboard, REST API, CLI) **automatically write back** to this file:\n\n| Feature | Section | Written On |\n|---------|---------|------------|\n| Config Runtime | `runtime_config` | PATCH, PUT, DELETE, apply |\n| Guardrails | `guardrails` | Register |\n| Channels | `channels` | Add, update, delete |\n| Schedules | `schedules` | Add, remove, update |\n| Agents | `agents` | Create, update, delete |\n\n- **Atomic writes**: a temp file and `os.replace()` prevent corruption.\n- **Hot reload**: the [Config Hot-Reload](../features/config-hot-reload.md) watcher, once started, reloads this file after external edits.\n- **Secrets**: channel secrets are written as `env:VAR_NAME` references (a `\u003ckey\u003e_ref` key works too); the server refuses an inline token that looks like a secret and redacts secrets in API responses.\n\nRule of thumb: secrets (API keys, tokens) go in environment variables;\npreferences (model, theme, branding) in the config file.\n\n### Relationship to `aiui.yaml`\n\n| File | Purpose | Used By |\n|------|---------|---------|\n| `aiui.yaml` | Static site layout, components, routes | `aiui build`, `aiui serve`, `aiui validate` |\n| `$AIUI_DATA_DIR/config.yaml` | Runtime feature state (agents, channels, config) | `aiui run`, dashboard API |\n| `gateway.yaml` | Subset of `config.yaml` (legacy compatibility) | `praisonai gateway start` |\n"}</script>
