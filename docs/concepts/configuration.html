<p>Complete guide to the <code>aiui.template.yaml</code> configuration schema.</p>
<h2>Overview</h2>
<p>PraisonAIUI uses a single YAML file to configure your entire site. This file defines:</p>
<li><strong>Site metadata</strong> - Title, description, theme</li>
<li><strong>Content sources</strong> - Where to find your docs</li>
<li><strong>Components</strong> - Reusable UI elements</li>
<li><strong>Templates</strong> - Page layouts with slots</li>
<li><strong>Routes</strong> - URL patterns to template mappings</li>
<h2>Schema Version</h2>
<p>Always specify the schema version:</p>
<h2>Site Configuration</h2>
<p>&gt; <strong>Note</strong>: The <code>ui</code> field is a theming hint. Components are UI-agnostic and use CSS classes you can style with any framework.</p>
<h2>Component Dependencies</h2>
<p>Auto-install shadcn components at build time:</p>
<p>When you run <code>aiui build</code>, any missing components are automatically installed via <code>npx shadcn add</code>.</p>
<h2>Content Sources</h2>
<h2>Components</h2>
<p>Define reusable components:</p>
<h3>Built-in Component Types</h3>
<p>| Type | Description |</p>
<p>|------|-------------|</p>
<p>| <code>Header</code> | Site header with logo, nav, CTA |</p>
<p>| <code>Footer</code> | Site footer |</p>
<p>| <code>DocsSidebar</code> | Documentation sidebar navigation |</p>
<p>| <code>Toc</code> | Table of contents |</p>
<p>| <code>DocContent</code> | Rendered markdown content |</p>
<h2>Templates</h2>
<p>Templates combine a layout with slot assignments:</p>
<h3>Layouts</h3>
<p>| Layout | Description |</p>
<p>|--------|-------------|</p>
<p>| <code>ThreeColumnLayout</code> | Sidebar + Content + TOC |</p>
<p>| <code>TwoColumnLayout</code> | Sidebar + Content |</p>
<p>| <code>CenteredLayout</code> | Centered content, no sidebar |</p>
<p>| <code>FullWidthLayout</code> | Full width content |</p>
<p>| <code>FlexibleLayout</code> | WordPress-style widget zones |</p>
<h2>Widget Zones</h2>
<p>Place widgets in layout zones without modifying markdown:</p>
<h3>Available Zones</h3>
<p>| Zone | Description |</p>
<p>|------|-------------|</p>
<p>| <code>header</code> | Top header |</p>
<p>| <code>topNav</code> | Below header nav |</p>
<p>| <code>hero</code> | Hero banners |</p>
<p>| <code>leftSidebar</code> | Left column |</p>
<p>| <code>main</code> | Main content |</p>
<p>| <code>rightSidebar</code> | Right column |</p>
<p>| <code>bottomNav</code> | Pagination area |</p>
<p>| <code>footer</code> | Footer widgets |</p>
<h3>Built-in Widgets</h3>
<p>| Widget | Description |</p>
<p>|--------|-------------|</p>
<p>| <code>StatsCard</code> | Metrics display |</p>
<p>| <code>QuickLinks</code> | Navigation links |</p>
<p>| <code>Newsletter</code> | Email signup |</p>
<p>| <code>HeroBanner</code> | Hero section |</p>
<p>| <code>SocialLinks</code> | Social icons |</p>
<p>| <code>Copyright</code> | Copyright text |</p>
<p>See Widget Zones for full documentation.</p>
<h2>Routes</h2>
<p>Map URL patterns to templates:</p>
<p>Route matching uses glob patterns:</p>
<li><code>*</code> - Single segment</li>
<li><code>**</code> - Multiple segments</li>
