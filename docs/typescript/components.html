<p>All components use semantic CSS classes prefixed with <code>aiui-</code>. Style them with your preferred CSS approach:</p>
<p>| Component | CSS Classes |</p>
<p>|-----------|-------------|</p>

<p>| Header | <code>aiui-header</code>, <code>aiui-header-logo</code>, <code>aiui-header-nav</code>, <code>aiui-header-cta</code> |</p>
<p>| Footer | <code>aiui-footer</code>, <code>aiui-footer-links</code> |</p>
<p>| Sidebar | <code>aiui-sidebar</code>, <code>aiui-sidebar-item</code>, <code>aiui-sidebar-group</code> |</p>
<p>| Toc | <code>aiui-toc</code>, <code>aiui-toc-item</code> |</p>
