<h2>Overview</h2>
<p>PraisonAIUI provides multiple health endpoints optimized for different use cases:</p>
<li><strong><code>/health/live</code></strong> - Fast liveness check (&lt;500ms)</li>
<li><strong><code>/health/ready</code></strong> - Readiness check with optional deep checks</li>
<li><strong><code>/health</code></strong> - Legacy endpoint (backward compatibility)</li>
<h2>Endpoints</h2>
<h3>Liveness Check: `/health/live`</h3>
<p>Fast endpoint to verify the server is running. Returns immediately with minimal processing.</p>
<p><strong>Use for:</strong></p>
<li>Load balancer health probes</li>
<li>Kubernetes liveness probes</li>
<li>High-frequency monitoring</li>
<p><strong>Response time:</strong> &lt;500ms (typically &lt;100ms)</p>
<p><strong>Example:</strong></p>
<p><strong>Response:</strong></p>
<h3>Readiness Check: `/health/ready`</h3>
<p>Verifies the server is ready to handle requests. Performs parallel health checks on all features with timeout protection.</p>
<p><strong>Use for:</strong></p>
<li>Kubernetes readiness probes</li>
<li>Pre-deployment validation</li>
<li>Detailed diagnostics</li>
<p><strong>Query parameters:</strong></p>
<li><code>?deep=false</code> - Skip feature checks for faster response</li>
<p><strong>Response time:</strong></p>
<li>With deep checks: &lt;1s (parallel execution)</li>
<li>Without deep checks: &lt;200ms</li>
<p><strong>Example:</strong></p>
<p><strong>Response with deep checks:</strong></p>
<h3>API Health: `/api/health`</h3>
<p>Cached version of readiness check for dashboard polling. 30-second TTL to reduce load.</p>
<p><strong>Use for:</strong></p>
<li>Dashboard health indicators</li>
<li>Frequent client polling</li>
<li>Status pages</li>
<p><strong>Response:</strong> Same as <code>/health/ready</code> but cached for 30 seconds</p>
<h2>Deployment Configurations</h2>
<h3>Kubernetes</h3>
<h3>AWS ALB/ELB</h3>
<h3>Docker Compose</h3>
<h3>Nginx</h3>
<h2>Migration Guide</h2>
<p>If you're upgrading from a version using only <code>/health</code>:</p>
<p>1. <strong>Update monitoring:</strong> Change health checks to use <code>/health/live</code> for liveness</p>
<p>2. <strong>Update readiness:</strong> Use <code>/health/ready?deep=false</code> for readiness probes</p>
<p>3. <strong>Update dashboards:</strong> Point status indicators to <code>/api/health</code> (cached)</p>
<p>4. <strong>Backward compatibility:</strong> The <code>/health</code> endpoint remains available but may be slow</p>
<h2>Performance Characteristics</h2>
<p>| Endpoint | Cold Start | Warm (p50) | Warm (p95) | Use Case |</p>
<p>|----------|------------|------------|------------|----------|</p>
<p>| <code>/health/live</code> | &lt;100ms | &lt;20ms | &lt;50ms | Liveness probes |</p>
<p>| <code>/health/ready?deep=false</code> | &lt;200ms | &lt;50ms | &lt;100ms | Basic readiness |</p>
<p>| <code>/health/ready</code> | &lt;1s | &lt;500ms | &lt;800ms | Full diagnostics |</p>
<p>| <code>/api/health</code> (cached) | &lt;1s* | &lt;20ms | &lt;50ms | Dashboard polling |</p>
<p>*First request only, then cached for 30s</p>
<h2>Troubleshooting</h2>
<h3>Slow `/health` responses</h3>
<p>If you're seeing slow responses on the legacy <code>/health</code> endpoint:</p>
<li>Switch to <code>/health/live</code> for fast checks</li>
<li>Use <code>/health/ready?deep=false</code> if you don't need feature health</li>
<li>Enable caching with <code>/api/health</code> for frequent polling</li>
<h3>Feature timeouts</h3>
<p>Features that timeout in <code>/health/ready</code> will show:</p>
<p>This indicates the feature took longer than 500ms to respond. The server is still operational, but that specific feature may be experiencing issues.</p>
<h3>High latency under load</h3>
<p>Under high load, use <code>/health/live</code> exclusively for monitoring. It has minimal overhead and won't impact performance.</p></noscript></div>
