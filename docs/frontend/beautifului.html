tocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/typescript">Typescript</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li></ul></nav><h1>BeautifulUI Upgrade Playbook</h1>
<p>How PraisonAIUI vendors <a href="https://www.beautifului.dev/">BeautifulUI</a> React primitives so</p>
<p>upgrades are <strong>repeatable</strong> and licence obligations are <strong>explicit</strong>.</p>
<p>!!! info "Related planning"</p>
<p>Epic <a href="https://github.com/MervinPraison/PraisonAIUI/issues/292">#292</a> (integration</p>
<p>strategy) and the adapter/pin policy in</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/issues/294">#294</a>.</p>
<h2>1. What BeautifulUI is</h2>
<p>BeautifulUI (MIT, © Shane Levine / Turbo) is a library of React primitives aimed at</p>
<p><strong>AI-native interfaces</strong> — thinking traces, streaming answers with inline sources,</p>
<p>human-in-the-loop approval cards, tool chips, task rows, context chunks, and a reference</p>
<p>chat harness.</p>
<p><strong>It is a shadcn registry + copy-paste library — not an npm package.</strong> There is no</p>
<p>published <code>beautiful-ui</code> package. You install components by resolving a registry URL, and</p>
<p>the source is copied into your tree (like any other shadcn/ui primitive).</p>
<li>Website &amp; registry: &lt;https://www.beautifului.dev/&gt;</li>
<li>Upstream source: &lt;https://github.com/slev12397/beautiful-ui&gt;</li>
<p>Upstream stack (Next.js 15 · React 19 · Tailwind CSS v4 · TypeScript) is closely aligned</p>
<p>with PraisonAIUI's <code>src/frontend</code> (Vite · React 19 · Tailwind v4 · shadcn/Radix), which is</p>
<p>why copy-paste vendoring works without a framework shim.</p>
<h2>2. One-time foundation setup</h2>
<p>PraisonAIUI already carries the shadcn/ui foundation that BeautifulUI primitives depend on:</p>
<li><strong>shadcn config</strong> — <code>src/frontend/components.json</code> (<code>style: new-york</code>,</li>
<p><code>baseColor: neutral</code>, <code>iconLibrary: lucide</code>, <code>cssVariables: true</code>). Its <code>registries</code></p>
<p>map is where pinned BeautifulUI registry URLs are added (see §3).</p>
<li><strong>Theme tokens</strong> — <code>src/praisonaiui/themes.py</code> generates the shadcn CSS variables</li>
<p>(<code>--background</code>, <code>--foreground</code>, <code>--primary</code>, <code>--radius</code>, …) at build time for all 22</p>
<p>official presets, offline. BeautifulUI's foundation CSS (upstream <code>app/globals.css</code>)</p>
<p>must only contribute <strong>new</strong> tokens/utilities; it must <strong>not</strong> redefine variables that</p>
<p><code>themes.py</code> already owns, or theme switching and dark mode break.</p>
<p><strong>Rule:</strong> when merging upstream <code>app/globals.css</code>, diff it against the variables emitted by</p>
<p><code>themes.py</code> and keep only the additive slices (new keyframes, component-scoped utilities).</p>
<p>Record what was merged in the pin doc (§3).</p>
<h2>3. Adding or updating a primitive</h2>
<p>1. <strong>Install with a pinned registry URL</strong> from <code>src/frontend/</code>:</p>
<p>The registry resolves dependencies and CSS slices. Commit the resulting</p>
<p><code>package-lock.json</code> change in the same PR.</p>
<p>2. <strong>Re-export through the adapter</strong> — add the component to</p>
<p><code>src/frontend/src/components/index.ts</code> (<code>@praisonaiui/react</code>). Consumers never import</p>
<p>the raw vendored path (see §4).</p>
<p>3. <strong>Update the pin record</strong> — create/update <code>docs/frontend/BEAUTIFULUI_UPSTREAM.md</code> with:</p>
<p>the upstream <strong>git SHA</strong>, the <strong>date</strong>, the <strong>registry base URL</strong>, and the **component</p>
<p>list** vendored so far. This file is the single source of truth for "what version are</p>
<p>we on". (It is created the first time a real primitive is vendored — do not add it</p>
<p>empty.)</p>
<p>4. <strong>Rebuild &amp; sync the bundle</strong> — the committed frontend bundle must be regenerated:</p>
<p>(See <code>AGENTS.md</code> → "Frontend Build".)</p>
<p>5. <strong>Run frontend CI</strong> — <code>.github/workflows/ci.yml</code> (ruff + pytest) must pass, plus the</p>
<p>frontend build step.</p>
<h2>4. Adapter boundary</h2>
<p>Consumers import from <strong><code>@praisonaiui/react</code> only</strong> — never from raw vendored paths such as</p>
<p><code>@/components/ui/...</code> or any upstream module.</p>
<p>This keeps the upstream surface behind one file (<code>components/index.ts</code>), so a BeautifulUI</p>
<p>bump changes vendored source but not consumer imports.</p>
<h2>5. Rollback</h2>
<li>BeautifulUI-backed views mount behind a <strong>feature flag</strong>; the <strong>vanilla dashboard views</strong></li>
<p>(<code>src/praisonaiui/templates/frontend/plugins/*</code>) remain the fallback and are kept working.</p>
<li>To roll back a bad bump: revert the vendoring PR (source + <code>BEAUTIFULUI_UPSTREAM.md</code> +</li>
<p>rebuilt bundle move together in one commit), and disable the flag. No consumer import</p>
<p>changes are needed because everything routes through the adapter (§4).</p>
<h2>6. Licence</h2>
<p>BeautifulUI is <strong>MIT, © Shane Levine</strong>. The full licence text is retained in</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/THIRD_PARTY_NOTICES.md"><code>THIRD_PARTY_NOTICES.md</code></a></p>
<p>at the repository root. Any PR that vendors or bumps BeautifulUI source must keep that</p>
<p>notice present and current.</p>
<h2>7. Commercial icons — do not vendor</h2>
<p>Do <strong>not</strong> use <code>@central-icons-react</code> without a licence — it is commercial. PraisonAIUI</p>
<p>standardises on <strong><code>lucide-react</code></strong> (<code>iconLibrary: lucide</code> in <code>components.json</code>). If an</p>
<p>upstream BeautifulUI primitive imports commercial icons, swap them for lucide equivalents</p>
<p>during vendoring.</p></noscript></div>
