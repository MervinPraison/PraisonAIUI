tocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/typescript">Typescript</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li></ul></nav><h1>ADR: BeautifulUI adapter layer & upstream pin policy</h1>
<p><strong>Status:</strong> Accepted · <strong>Issue:</strong> <a href="https://github.com/MervinPraison/PraisonAIUI/issues/294">#294</a></p>
<h2>Context</h2>
<p>BeautifulUI is <strong>not</strong> a semver npm library — it is distributed as shadcn-style</p>
<p>registry components that are copied into the consuming repo. PraisonAIUI must</p>
<p>integrate it without leaking upstream types or import paths across the codebase,</p>
<p>and without breaking when either side updates.</p>
<h2>Decision</h2>
<p>Introduce a single <strong>adapter boundary</strong> between transport payloads and the UI,</p>
<p>and vendor BeautifulUI components behind that boundary.</p>
<h3>1. Folder layout</h3>
<p><strong>Rule:</strong> BeautifulUI / upstream prop types must <strong>never</strong> be imported outside</p>
<p><code>src/agent-ui/</code>. Consumers depend on <code>contracts.ts</code> only, so the vendored</p>
<p>implementation can be swapped later without touching call sites.</p>
<h3>2. Adapter contracts</h3>
<p>Internal, transport-agnostic types live in <code>contracts.ts</code>:</p>
<li><code>AgentStreamEvent</code> — normalized form of the WebSocket frames handled in</li>
<p><code>chat.js</code> (<code>run_started</code>, <code>run_content</code>, <code>tool_call_started</code>, …). Unknown</p>
<p>frame <code>type</code>s degrade to <code>kind: 'unknown'</code> with <code>rawType</code> preserved instead</p>
<p>of throwing, so new upstream events never break the UI.</p>
<li><code>ToolCallChipModel</code> — tool-call chip view model.</li>
<li><code>ApprovalPromptModel</code> — approval card view model, mapped from the</li>
<p><code>/api/approvals/pending</code> REST payload.</p>
<p>Mappers (<code>adapter.ts</code>): <code>mapChatEventToUi(frame)</code> and</p>
<p><code>mapApprovalToCardProps(item)</code>. Both are <strong>pure</strong> and unit tested.</p>
<h3>3. Vendoring & pin policy</h3>
<p>| Mechanism | Purpose |</p>
<p>|-----------|---------|</p>
<p>| <code>BEAUTIFULUI_UPSTREAM.md</code> | Record git SHA, date, registry base URL for every vendored component |</p>
<p>| shadcn registry URLs | Per-component install, pinned in the upstream doc |</p>
<p>| <strong>No</strong> <code>dependencies.beautiful-ui</code> in <code>package.json</code> | Avoid a phantom npm package |</p>
<p><strong>Upgrade rule:</strong> bump upstream <strong>only</strong> via a PR that updates</p>
<p><code>BEAUTIFULUI_UPSTREAM.md</code> and passes the frontend CI gate (issue #295). Icons</p>
<p>stay on <code>lucide-react</code>; do not vendor paid Central icons.</p>
<h3>4. Feature flag (default **off**)</h3>
<p>Integration is gated so the existing vanilla-JS chat/approvals plugins remain</p>
<p>the fallback until migration milestones (#296, #297) complete.</p>
<li><strong>Flag:</strong> <code>AIUI_BEAUTIFULUI</code> (build-time env / dashboard config JSON).</li>
<li><strong>Default:</strong> off — vanilla JS renders; the adapter is imported but not mounted.</li>
<li><strong>On:</strong> React islands mount using <code>src/agent-ui</code> contracts.</li>
<li><strong>Fallback:</strong> if a vendored component fails to load, the flag is treated as</li>
<p>off and the vanilla path renders. No user-facing regression when off.</p>
<h3>5. Design tokens</h3>
<p>Scope agent-UI primitives under an <code>.aiui-agent-ui { … }</code> CSS layer (or extend</p>
<p>the existing shadcn presets in <code>themes.py</code>) so vendored component tokens cannot</p>
<p>collide with the global dashboard theme.</p>
<h3>6. Deprecation / upstream abandonment</h3>
<p>Vendored code stays MIT-licensed in-tree. Because consumers depend only on the</p>
<p><code>contracts.ts</code> view models, a future first-party implementation can satisfy the</p>
<p>same contracts and replace the vendored components with no call-site churn.</p>
<h2>Consequences</h2>
<li>One place (<code>src/agent-ui/</code>) owns the upstream coupling.</li>
<li>Adapters are testable without a browser or the transport layer.</li>
<li>The default-off flag keeps the migration reversible at every step.</li></noscript></div>
