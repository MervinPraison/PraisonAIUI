<h2>DataFrame input & Plotly compatibility</h2>
<p><code>aiui.chart(..., data=df)</code> accepts pandas and Polars DataFrames directly (duck-typed without importing them). If you already build Plotly figures, <code>aiui.plotly_chart(fig)</code> converts standard Plotly traces (<code>bar</code>, <code>barh</code>, <code>scatter</code>/<code>scattergl</code> line/area/scatter, <code>pie</code>/<code>donut</code>, <code>histogram</code>, <code>heatmap</code>) into native Recharts <code>chart</code> blocks without bundling <code>plotly.js</code>:</p>
<p>Both work on <code>@aiui.page</code> and inline in chat via <code>await aiui.send_block(...)</code>.</p>
<h2>Props</h2>
<p>| Parameter | Type | Description |</p>
<p>|---|---|---|</p>
<p>| <code>title</code>, <code>data</code> | <code>str</code>, <code>list[dict]</code> / DataFrame | Chart heading and row-oriented data records (or pandas/Polars DataFrame). |</p>
<p>| <code>chart_type</code> | <code>str</code> | <code>bar</code>, <code>barh</code>, <code>line</code>, <code>area</code>, <code>pie</code>, <code>donut</code>, <code>scatter</code>, <code>histogram</code>, <code>heatmap</code>, or <code>sparkline</code>. |</p>
<p>| <code>x</code>, <code>y</code>, <code>y2</code>, <code>stacked</code> | <code>str</code> / <code>list</code> / <code>bool</code> | Axis keys, secondary axis, and stacked bar/area mode. |</p>
<p>| <code>x_domain</code>, <code>y_domain</code>, <code>x_scale</code>, <code>y_scale</code>, <code>facet</code> | options | Custom domains, <code>log</code> scales, reference lines, and faceted small multiples. |</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/components/chart.source.md", "text": "---\ntitle: Chart\nnav_title: Chart\ndescription: Interactive Recharts visualizations across 10 chart kinds with theme colors and tooltips.\n---\n\n# Chart\n\n`chart()` renders responsive browser charts (lazy-loaded so pages without charts pay zero JS cost) supporting `line`, `bar`, `barh`, `area`, `pie`, `scatter`, `histogram`, `heatmap`, `sparkline`, and small-multiple `facet` grids.\n\n\u003cComponentPreview title=\"Interactive Bar \u0026 Line Charts\"\u003e\n[\n  {\n    \"type\": \"chart\",\n    \"title\": \"Weekly Agent Runs\",\n    \"chart_type\": \"bar\",\n    \"x\": \"day\",\n    \"y\": [\"runs\"],\n    \"height\": 220,\n    \"data\": [\n      {\"day\": \"Mon\", \"runs\": 120},\n      {\"day\": \"Tue\", \"runs\": 185},\n      {\"day\": \"Wed\", \"runs\": 240},\n      {\"day\": \"Thu\", \"runs\": 210},\n      {\"day\": \"Fri\", \"runs\": 295}\n    ]\n  },\n  {\n    \"type\": \"chart\",\n    \"title\": \"Success Rate Trend\",\n    \"chart_type\": \"area\",\n    \"x\": \"day\",\n    \"y\": [\"rate\"],\n    \"height\": 180,\n    \"data\": [\n      {\"day\": \"Mon\", \"rate\": 98.4},\n      {\"day\": \"Tue\", \"rate\": 99.1},\n      {\"day\": \"Wed\", \"rate\": 99.5},\n      {\"day\": \"Thu\", \"rate\": 99.3},\n      {\"day\": \"Fri\", \"rate\": 99.8}\n    ]\n  }\n]\n\u003c/ComponentPreview\u003e\n\n\u003cTabs\u003e\n\u003cTab title=\"Python\"\u003e\n```python\nimport praisonaiui as aiui\n\naiui.chart(\n    \"Weekly Agent Runs\",\n    data=[\n        {\"day\": \"Mon\", \"runs\": 120},\n        {\"day\": \"Tue\", \"runs\": 185},\n        {\"day\": \"Wed\", \"runs\": 240},\n    ],\n    chart_type=\"bar\",\n    x=\"day\",\n    y=\"runs\",\n    height=220,\n)\n```\n\u003c/Tab\u003e\n\u003cTab title=\"YAML\"\u003e\n```yaml\n- type: chart\n  title: \"Weekly Agent Runs\"\n  chart_type: \"bar\"\n  x: \"day\"\n  y: [\"runs\"]\n  height: 220\n  data:\n    - { day: \"Mon\", runs: 120 }\n    - { day: \"Tue\", runs: 185 }\n    - { day: \"Wed\", runs: 240 }\n```\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n## DataFrame input \u0026 Plotly compatibility\n\n`aiui.chart(..., data=df)` accepts pandas and Polars DataFrames directly (duck-typed without importing them). If you already build Plotly figures, `aiui.plotly_chart(fig)` converts standard Plotly traces (`bar`, `barh`, `scatter`/`scattergl` line/area/scatter, `pie`/`donut`, `histogram`, `heatmap`) into native Recharts `chart` blocks without bundling `plotly.js`:\n\n```python\naiui.chart(\"Weekly Runs\", data=df, chart_type=\"bar\", x=\"day\", y=\"runs\")\naiui.plotly_chart(fig, title=\"Revenue Breakdown\")\n```\n\nBoth work on `@aiui.page` and inline in chat via `await aiui.send_block(...)`.\n\n## Props\n\n| Parameter | Type | Description |\n|---|---|---|\n| `title`, `data` | `str`, `list[dict]` / DataFrame | Chart heading and row-oriented data records (or pandas/Polars DataFrame). |\n| `chart_type` | `str` | `bar`, `barh`, `line`, `area`, `pie`, `donut`, `scatter`, `histogram`, `heatmap`, or `sparkline`. |\n| `x`, `y`, `y2`, `stacked` | `str` / `list` / `bool` | Axis keys, secondary axis, and stacked bar/area mode. |\n| `x_domain`, `y_domain`, `x_scale`, `y_scale`, `facet` | options | Custom domains, `log` scales, reference lines, and faceted small multiples. |\n"}</script>
