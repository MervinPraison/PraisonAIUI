<p>A server page is a Python function that returns blocks. The app shell</p>
<p>(<code>style: app</code>, the default) fetches them from <code>GET /api/pages/{id}/data</code> and</p>
<p>renders them; forms and buttons talk back through <code>POST /api/pages/{id}/action</code>.</p>
<p>Both endpoints sit behind the same auth as every other <code>/api/*</code> route.</p>
<p>This guide builds a filter page step by step. Each part works on its own.</p>
<h2>1. A page</h2>
<p><code>@aiui.page("channels", title="Channels")</code> on a function that returns</p>
<p><code>aiui.layout([...])</code> (<code>{"_components": [...]}</code>) makes a page; every helper in</p>
<p><code>aiui</code> (<code>metric</code>, <code>table</code>, <code>tabs</code>, <code>form</code>, ...) is a block, see</p>
<p>Components. <code>aiui.register_page(id, title=..., handler=fn)</code></p>
<p>does the same without the decorator. Run the app with <code>aiui run app.py</code>.</p>
<h2>2. Page parameters: filters in the URL</h2>
<p>A handler that takes <code>params</code> receives the page URL's query string as a dict.</p>
<p>A key given once is a string; a key given more than once is a list:</p>
<p>The handler is matched by its signature: a parameter named <code>params</code> (or</p>
<p><code>**kwargs</code>) gets it by keyword, a single required positional parameter gets it</p>
<p>positionally, and a handler with no parameters is called as before.</p>
<p>The app shell sends the URL's query string with every data request, so a</p>
<p>filtered view survives a refresh, a bookmark and a shared link. The page's</p>
<p>Refresh button re-fetches with the current params.</p>
<h2>3. Forms</h2>
<p><code>aiui.form(action_id, children=[...], submit_label=...)</code> collects every input</p>
<p>inside it by <code>name</code> (or by its label when it has no <code>name</code>). Give inputs a</p>
<p><code>name</code> so the keys are stable. The first argument is the action id, normally</p>
<p>the page id.</p>
<p>There are two ways to submit.</p>
<h3>`method="get"`: filters</h3>
<p>The values are written into the page URL (<code>history.replaceState</code>) and the page</p>
<p>data is fetched again, so the page handler sees them in <code>params</code>. No action</p>
<p>handler is needed. This is the right choice for a filter form:</p>
<p>Render each input with <code>value=</code> taken from <code>params</code>, so the form shows the</p>
<p>active filters after a refresh. An empty value removes its key from the URL;</p>
<p>other keys in the URL stay. Keys starting with <code>_</code> are never written.</p>
<h3>`method="post"` (default): page actions</h3>
<p>The values are POSTed as JSON to <code>/api/pages/{page_id}/action</code>. Handle them</p>
<p>with <code>aiui.register_page_action(page_id)</code>:</p>
<p>What the reply can hold:</p>
<p>| Key | Effect in the app shell |</p>
<p>|-----|-------------------------|</p>
<p>| <code>_components</code> | Replaces the page with these blocks (return <code>aiui.layout([...])</code>). |</p>
<p>| <code>message</code> (or <code>status</code>) | A success toast. With <code>_components</code>, both happen. |</p>
<p>| <code>error</code> | An error toast; the page is left as it was. |</p>
<p>| <code>_params</code> | Written into the page URL's query string (<code>aiui.layout([...], params={...})</code>); <code>None</code> or <code>""</code> removes a key. |</p>
<p>| <code>_refresh_every</code> | Starts or changes auto refresh (section 5). |</p>
<p><code>aiui.form(..., update_url=True)</code> writes the submitted values into the URL</p>
<p>after a successful POST, as <code>method="get"</code> does. Use it when the action both</p>
<p>does something and changes the view; a reply's <code>_params</code> wins over it.</p>
<p>A button posts <code>{**payload, "action": action, "_params": {...}}</code>. A form posts</p>
<p>its values alongside <code>"_params"</code> (the page URL's current query string, same</p>
<p>dict shape as <code>params</code> in the page handler).</p>
<h3>Streaming replies (`yield`)</h3>
<p>To stream LLM tokens or step-by-step progress live without polling, make your</p>
<p><code>@aiui.register_page_action</code> handler an <code>async def</code> (or sync) generator that</p>
<p><code>yield</code>s <code>aiui.layout([...])</code> frames:</p>
<p>The server streams each yielded frame as <code>application/x-ndjson</code>; the app shell</p>
<p>updates the page live and displays a <strong>Stop</strong> button to cancel the stream.</p>
<h2>4. Lazy tabs and expanders</h2>
<p>Heavy sections can load when they are first opened instead of with the page:</p>
<li>With <code>lazy=True</code>, a tab item without <code>children</code> is lazy; its key is its</li>
<p><code>load</code> value, or its <code>label</code>. An item with <code>children</code> renders at once.</p>
<li><code>aiui.expander(title, lazy=True, load=key)</code>: the key defaults to the title.</li>
<li>The body is fetched with <code>POST /api/pages/{id}/action</code> and the JSON body</li>
<p><code>{"_lazy": key, "_params": {...}}</code>. Reply with <code>_components</code>, as for any</p>
<p>action. A reply with <code>error</code> (or an HTTP error) shows the message and a</p>
<p>"Try again" button; a skeleton shows while it loads.</p>
<li>Once loaded, a section stays loaded. When the page data reloads (Refresh,</li>
<p>auto refresh, an action that re-renders), open sections fetch again; a</p>
<p>closed one fetches again the next time it opens.</p>
<h2>5. Auto refresh and job status</h2>
<p><code>refresh_every</code> (seconds, at least 1) re-fetches the page while its browser</p>
<p>tab is visible. It pauses while the tab is hidden and resumes when it is shown</p>
<p>again. After a failure it keeps the last good content, shows one error toast</p>
<p>and doubles the wait on each failure in a row (up to 5 minutes).</p>
<p>Set it when you register the page, or per reply (a reply's value wins, so a</p>
<p>page can refresh only while something runs):</p>
<p><code>@aiui.page(..., refresh_every=10)</code> and</p>
<p><code>aiui.register_page(..., refresh_every=10)</code> set a fixed period; the data</p>
<p>reply carries it as <code>_refresh_every</code> unless the handler set that key.</p>
<p><code>@aiui.page(..., badge=...)</code> and <code>aiui.register_page(..., badge=...)</code> show a</p>
<p>short pill beside the page title in the app shell sidebar (across Classic and</p>
<p>all selectable layouts). Pass a string, an integer, or a zero-argument callable</p>
<p>(evaluated when the manifest is served) for live counts such as unread items or</p>
<p>queued jobs. To update badges dynamically after an action without reloading the</p>
<p>page, return <code>aiui.layout([...], badges={"inbox": 2})</code> (or <code>refresh_manifest=True</code>).</p>
<h2>6. Declarative YAML pages</h2>
<p><code>aiui run app.yaml</code> can declare server-driven block pages directly in YAML</p>
<p>(alongside built-in page ids such as <code>chat</code>):</p>
<p>Every component block (<code>card</code>, <code>metric</code>, <code>table</code>, <code>chart</code>, <code>gallery</code>,</p>
<p><code>card_grid</code>, <code>filter_bar</code>, <code>select_input</code>, <code>list_detail</code>, <code>markdown_text</code>,</p>
<p><code>doc_viewer</code>, <code>pagination</code>, <code>color_picker_input</code>, …) uses the same JSON/YAML</p>
<p>dict format as Python's <code>aiui.*</code> helpers. Large apps can split page definitions</p>
<p>into separate files with <code>$ref:</code> (e.g. <code>- $ref: ./pages/overview.yaml</code>). Edits</p>
<p>to the YAML file, any <code>$ref</code>-included file, or a referenced <code>markdown_file</code></p>
<p>reload dynamically on the next fetch without restarting the server. Set</p>
<p><code>api_endpoint:</code> instead of <code>components:</code> to back a YAML-declared page with a</p>
<p>custom API or plugin endpoint.</p>
<h2>Shell support</h2>
<p>The app shell supports everything in this guide. The legacy <code>dashboard</code></p>
<p>style renders the page and its forms. It ignores <code>params</code>, <code>method="get"</code>,</p>
<p>lazy loading and <code>refresh_every</code>, and shows a status as plain text.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/guides/server-pages.source.md", "text": "---\nnav_title: Server pages\ndescription: Pages built in Python with @aiui.page and aiui blocks - filters in the URL, forms and page actions, lazy tabs, auto refresh and job status.\n---\n\n# Server pages\n\nA server page is a Python function that returns blocks. The app shell\n(`style: app`, the default) fetches them from `GET /api/pages/{id}/data` and\nrenders them; forms and buttons talk back through `POST /api/pages/{id}/action`.\nBoth endpoints sit behind the same auth as every other `/api/*` route.\n\nThis guide builds a filter page step by step. Each part works on its own.\n\n## 1. A page\n\n`@aiui.page(\"channels\", title=\"Channels\")` on a function that returns\n`aiui.layout([...])` (`{\"_components\": [...]}`) makes a page; every helper in\n`aiui` (`metric`, `table`, `tabs`, `form`, ...) is a block, see\n[Components](../api/components.md). `aiui.register_page(id, title=..., handler=fn)`\ndoes the same without the decorator. Run the app with `aiui run app.py`.\n\n## 2. Page parameters: filters in the URL\n\nA handler that takes `params` receives the page URL's query string as a dict.\nA key given once is a string; a key given more than once is a list:\n\n```\n/channels?format=shorts\u0026tag=ai\u0026tag=dev   -\u003e   {\"format\": \"shorts\", \"tag\": [\"ai\", \"dev\"]}\n```\n\nThe handler is matched by its signature: a parameter named `params` (or\n`**kwargs`) gets it by keyword, a single required positional parameter gets it\npositionally, and a handler with no parameters is called as before.\n\nThe app shell sends the URL's query string with every data request, so a\nfiltered view survives a refresh, a bookmark and a shared link. The page's\nRefresh button re-fetches with the current params.\n\n## 3. Forms\n\n`aiui.form(action_id, children=[...], submit_label=...)` collects every input\ninside it by `name` (or by its label when it has no `name`). Give inputs a\n`name` so the keys are stable. The first argument is the action id, normally\nthe page id.\n\nThere are two ways to submit.\n\n### `method=\"get\"`: filters\n\nThe values are written into the page URL (`history.replaceState`) and the page\ndata is fetched again, so the page handler sees them in `params`. No action\nhandler is needed. This is the right choice for a filter form:\n\n```python\nFORMATS = [\"all\", \"long\", \"shorts\"]\n\n\n@aiui.page(\"channels\", title=\"Channels\", icon=\"📺\", group=\"Research\")\nasync def channels(params):\n    fmt = params.get(\"format\", \"all\")\n    query = params.get(\"q\", \"\")\n    rows = [r for r in load_channels() if matches(r, fmt, query)]\n    return aiui.layout([\n        aiui.form(\"channels\", method=\"get\", submit_label=\"Apply\", children=[\n            aiui.columns([\n                aiui.text_input(\"Search\", name=\"q\", value=query),\n                aiui.select_input(\"Format\", name=\"format\", options=FORMATS, value=fmt),\n            ]),\n        ]),\n        aiui.table(headers=[\"Name\", \"Format\"], rows=[[r.name, r.format] for r in rows]),\n    ])\n```\n\nRender each input with `value=` taken from `params`, so the form shows the\nactive filters after a refresh. An empty value removes its key from the URL;\nother keys in the URL stay. Keys starting with `_` are never written.\n\n### `method=\"post\"` (default): page actions\n\nThe values are POSTed as JSON to `/api/pages/{page_id}/action`. Handle them\nwith `aiui.register_page_action(page_id)`:\n\n```python\n@aiui.register_page_action(\"channels\")\nasync def channels_action(data):\n    if data.get(\"action\") == \"sync\":            # a button: aiui.button_group([{\"label\": \"Sync\", \"action\": \"sync\"}])\n        start_sync()\n        return {\"message\": \"Sync started\"}       # a toast\n    save_note(data[\"note\"])                     # a form: the inputs by name\n    return aiui.layout([...])                   # re-renders the page\n```\n\nWhat the reply can hold:\n\n| Key | Effect in the app shell |\n|-----|-------------------------|\n| `_components` | Replaces the page with these blocks (return `aiui.layout([...])`). |\n| `message` (or `status`) | A success toast. With `_components`, both happen. |\n| `error` | An error toast; the page is left as it was. |\n| `_params` | Written into the page URL's query string (`aiui.layout([...], params={...})`); `None` or `\"\"` removes a key. |\n| `_refresh_every` | Starts or changes auto refresh (section 5). |\n\n`aiui.form(..., update_url=True)` writes the submitted values into the URL\nafter a successful POST, as `method=\"get\"` does. Use it when the action both\ndoes something and changes the view; a reply's `_params` wins over it.\n\nA button posts `{**payload, \"action\": action, \"_params\": {...}}`. A form posts\nits values alongside `\"_params\"` (the page URL's current query string, same\ndict shape as `params` in the page handler).\n\n### Streaming replies (`yield`)\n\nTo stream LLM tokens or step-by-step progress live without polling, make your\n`@aiui.register_page_action` handler an `async def` (or sync) generator that\n`yield`s `aiui.layout([...])` frames:\n\n```python\n@aiui.register_page_action(\"writer\")\nasync def writer_action(data):\n    text = \"\"\n    async for token in run_llm(data[\"prompt\"]):\n        text += token\n        yield aiui.layout([aiui.markdown_text(text)])\n    yield {\"message\": \"Done\"}\n```\n\nThe server streams each yielded frame as `application/x-ndjson`; the app shell\nupdates the page live and displays a **Stop** button to cancel the stream.\n\n## 4. Lazy tabs and expanders\n\nHeavy sections can load when they are first opened instead of with the page:\n\n```python\n@aiui.page(\"youtube\", title=\"YouTube\", icon=\"▶️\", group=\"Research\")\nasync def youtube(params):\n    return aiui.layout([\n        aiui.tabs([\n            {\"label\": \"Overview\", \"children\": [aiui.metric(\"Views\", value=\"1.2M\")]},  # eager\n            {\"label\": \"Retention\", \"load\": \"retention\"},                              # lazy\n            {\"label\": \"Traffic\", \"load\": \"traffic\"},\n        ], lazy=True),\n        aiui.expander(\"Every video\", lazy=True, load=\"videos\"),\n    ])\n\n\n@aiui.register_page_action(\"youtube\")\nasync def youtube_action(data):\n    key = data.get(\"_lazy\")\n    params = data.get(\"_params\", {})       # the page URL's query string\n    if key == \"retention\":\n        return aiui.layout([retention_chart(params)])\n    if key == \"traffic\":\n        return aiui.layout([traffic_table(params)])\n    if key == \"videos\":\n        return aiui.layout([videos_table(params)])\n    return {\"error\": f\"Unknown section {key!r}\"}\n```\n\n- With `lazy=True`, a tab item without `children` is lazy; its key is its\n  `load` value, or its `label`. An item with `children` renders at once.\n- `aiui.expander(title, lazy=True, load=key)`: the key defaults to the title.\n- The body is fetched with `POST /api/pages/{id}/action` and the JSON body\n  `{\"_lazy\": key, \"_params\": {...}}`. Reply with `_components`, as for any\n  action. A reply with `error` (or an HTTP error) shows the message and a\n  \"Try again\" button; a skeleton shows while it loads.\n- Once loaded, a section stays loaded. When the page data reloads (Refresh,\n  auto refresh, an action that re-renders), open sections fetch again; a\n  closed one fetches again the next time it opens.\n\n## 5. Auto refresh and job status\n\n`refresh_every` (seconds, at least 1) re-fetches the page while its browser\ntab is visible. It pauses while the tab is hidden and resumes when it is shown\nagain. After a failure it keeps the last good content, shows one error toast\nand doubles the wait on each failure in a row (up to 5 minutes).\n\nSet it when you register the page, or per reply (a reply's value wins, so a\npage can refresh only while something runs):\n\n```python\n@aiui.page(\"sync\", title=\"Sync\", icon=\"🔄\", group=\"Research\")\nasync def sync():\n    jobs = list_jobs()  # your job store\n    rows = [\n        # state: \"queued\" | \"running\" | \"done\" | \"failed\"; progress 0-100 or None\n        aiui.status(j.name, state=j.state, detail=j.detail, progress=j.percent, log=j.lines[-20:])\n        for j in jobs\n    ]\n    running = any(j.state in (\"queued\", \"running\") for j in jobs)\n    return aiui.layout(\n        [aiui.button_group([{\"label\": \"Sync now\", \"action\": \"sync\"}]), *rows],\n        refresh_every=3 if running else None,\n    )\n\n\n@aiui.register_page_action(\"sync\")\nasync def sync_action(data):\n    start_sync()\n    # Re-render, so the reply's _refresh_every starts the polling.\n    return {**await sync(), \"message\": \"Sync started\"}\n```\n\n`@aiui.page(..., refresh_every=10)` and\n`aiui.register_page(..., refresh_every=10)` set a fixed period; the data\nreply carries it as `_refresh_every` unless the handler set that key.\n\n`@aiui.page(..., badge=...)` and `aiui.register_page(..., badge=...)` show a\nshort pill beside the page title in the app shell sidebar (across Classic and\nall selectable layouts). Pass a string, an integer, or a zero-argument callable\n(evaluated when the manifest is served) for live counts such as unread items or\nqueued jobs. To update badges dynamically after an action without reloading the\npage, return `aiui.layout([...], badges={\"inbox\": 2})` (or `refresh_manifest=True`).\n\n## 6. Declarative YAML pages\n\n`aiui run app.yaml` can declare server-driven block pages directly in YAML\n(alongside built-in page ids such as `chat`):\n\n```yaml\nstyle: app\nbranding:\n  title: \"Operations\"\npages:\n  - chat\n  - id: overview\n    title: \"Overview\"\n    icon: \"bar-chart-2\"\n    group: \"Workspace\"\n    badge: \"Live\"\n    refresh_every: 30\n    components:\n      - type: columns\n        children:\n          - type: metric\n            label: \"Active users\"\n            value: \"1,420\"\n            delta: \"+12%\"\n          - type: card\n            title: \"Status\"\n            value: \"Healthy\"\n      - type: table\n        columns:\n          - { key: \"name\", label: \"Service\", type: \"text\" }\n          - { key: \"lift\", label: \"Lift\", type: \"number\", format: \"multiplier\", tone_above: 1.0 }\n        rows:\n          - { name: \"API\", lift: 1.8 }\n  - id: runbook\n    title: \"Runbook\"\n    icon: \"book-open\"\n    group: \"Docs\"\n    markdown_file: \"./runbook.md\"\n    toc: true\n```\n\nEvery component block (`card`, `metric`, `table`, `chart`, `gallery`,\n`card_grid`, `filter_bar`, `select_input`, `list_detail`, `markdown_text`,\n`doc_viewer`, `pagination`, `color_picker_input`, …) uses the same JSON/YAML\ndict format as Python's `aiui.*` helpers. Large apps can split page definitions\ninto separate files with `$ref:` (e.g. `- $ref: ./pages/overview.yaml`). Edits\nto the YAML file, any `$ref`-included file, or a referenced `markdown_file`\nreload dynamically on the next fetch without restarting the server. Set\n`api_endpoint:` instead of `components:` to back a YAML-declared page with a\ncustom API or plugin endpoint.\n\n## Shell support\n\nThe app shell supports everything in this guide. The legacy `dashboard`\nstyle renders the page and its forms. It ignores `params`, `method=\"get\"`,\nlazy loading and `refresh_every`, and shows a status as plain text.\n"}</script>
