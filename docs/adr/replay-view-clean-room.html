ckend Integration Contract</a></li><li><a href="https://ui.praison.ai/docs/features/deployment">Deployment Guide</a></li><li><a href="https://ui.praison.ai/docs/health-endpoints">Health Endpoints Guide</a></li><li><a href="https://ui.praison.ai/docs/api">Reference</a></li><li><a href="https://ui.praison.ai/docs/api/cli">CLI Reference</a></li><li><a href="https://ui.praison.ai/docs/api/python">Python SDK API</a></li><li><a href="https://ui.praison.ai/docs/concepts/configuration">YAML Configuration</a></li><li><a href="https://ui.praison.ai/docs/api/components">Component API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/features-api">Features REST API Reference</a></li><li><a href="https://ui.praison.ai/docs/features/api-reference">API Reference page and OpenAPI document</a></li><li><a href="https://ui.praison.ai/docs/api/sessions">Sessions API Reference</a></li><li><a href="https://ui.praison.ai/docs/api/health">Health API Reference</a></li><li><a href="https://ui.praison.ai/docs/typescript">TypeScript SDK Overview</a></li><li><a href="https://ui.praison.ai/docs/typescript/runtime">Runtime</a></li><li><a href="https://ui.praison.ai/docs/typescript/nextjs">Next.js Adapter</a></li><li><a href="https://ui.praison.ai/docs/typescript/components">Components</a></li><li><a href="https://ui.praison.ai/docs/api/typescript">TypeScript SDK Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocols">Feature Protocols</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-architecture">Protocol Architecture Reference</a></li><li><a href="https://ui.praison.ai/docs/features/protocol-versioning">Protocol Versioning</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp">Application Design Protocol (ADP)</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/spec">Application Design Protocol (ADP) — Normative Specification</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/validation-rules">ADP Validation Rules</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>ADR 0001: PraisonAI Replay view, a clean-room design</h1>
<li><strong>Status:</strong> accepted</li>
<li><strong>Date:</strong> 2026-10-26</li>
<li><strong>Scope:</strong> <code>src/praisonaiui/features/replay.py</code>, <code>features/_trace_jsonl.py</code>,</li>
<p><code>templates/frontend/plugins/views/replay-core.js</code>, <code>templates/frontend/plugins/views/replay.js</code></p>
<h2>Context</h2>
<p>PraisonAI records agent runs as context-trace JSONL (one <code>ContextEvent.to_dict()</code> per</p>
<p>line). People need to see what a team or flow did: who did what, when, why, and at what</p>
<p>cost, both after the fact and live. Other tools have shown that a graph plus a trace is a</p>
<p>useful way to look at agent runs. We want that value without copying anyone's product,</p>
<p>code or look, and without adding dependencies.</p>
<h2>Decision</h2>
<p>Build our own view, in plain DOM and SVG, with our own layout code, palette and words.</p>
<h3>Ideas we took (ideas only)</h3>
<p>| Idea | Where it came from | What we did with it |</p>
<p>|---|---|---|</p>
<p>| Show the graph of a multi-agent program next to the trace of a run | The general concept behind LangGraph Studio's graph-plus-trace view, known from public talks and articles | A <strong>Map</strong> view drawn by our own layered layout (<code>layoutMap</code>); the default view is a <strong>Timeline</strong>, which Studio does not have |</p>
<p>| Parallel voices on shared time, read left to right | Musical scores and swimlane diagrams | One lane per agent plus Manager and You; parallel branches as sub-lanes; tasks and steps as "chapters" across the top |</p>
<p>| Vocabulary for LLM and tool spans, tokens and cost | OpenTelemetry GenAI semantic conventions (public specification) | Block kinds (LLM, tool), token and cost totals; the wrapper's OTLP export uses the conventions, the UI only borrows the concepts |</p>
<h3>What we did not use</h3>
<li><strong>No third-party UI code, CSS, icons, layouts or screenshots</strong> were used to build this</li>
<p>view. Shapes, palette, spacing, wording ("Brief", "Delivered", "Waiting for you") and</p>
<p>the layout algorithm are our own.</p>
<li>**LangGraph's server (Elastic License 2.0) and the proprietary LangGraph Studio were</li>
<p>not consulted for code**, and none of their assets, markup or styles were copied. We</p>
<p>do not use the name "Studio", any "Lang…" naming, or <code>__start__</code>/<code>__end__</code> pills.</p>
<li>No Mermaid, D3, React Flow, dagre, ELK or other graph libraries. The dashboard's</li>
<p>existing Mermaid CDN plugin is not used by Replay.</p>
<h3>How it is built</h3>
<li><code>replay-core.js</code>: pure functions (<code>buildModel</code>, <code>narrate</code>, <code>layoutMap</code>,</li>
<p><code>deriveGraph</code>). No DOM, no network. Tested with <code>node --test</code>.</p>
<li><code>replay.js</code>: DOM/SVG rendering, keyboard handling, SSE follow and approvals. It also</li>
<p>boots by itself when <code>window.__REPLAY_DATA__ = {events, graph}</code> is set, which is how</p>
<p>the wrapper's single-file HTML export works (<code>standalone_html()</code> inlines both files).</p>
<li><code>layoutMap</code> is a textbook layered layout written from scratch: depth-first search to</li>
<p>find back edges (loops), longest-path layering, one virtual waypoint per crossed layer</p>
<p>for long edges, and a few barycentre sweeps to order each layer. It is deterministic.</p>
<li>Narration is template text, chosen per event type. No LLM, no randomness.</li>
<h2>Palette and accessibility rationale</h2>
<p>| Role | Fill | Shape | Why |</p>
<p>|---|---|---|---|</p>
<p>| Agent | <code>#8B0000</code> | circle | PraisonAI's brand red; white text on it is 10.0:1 |</p>
<p>| Tool | <code>#0F7287</code> | rounded rectangle | Teal kept from the brand but darkened from <code>#189AB4</code> (white text on <code>#189AB4</code> fails AA); white on <code>#0F7287</code> is 5.6:1 |</p>
<p>| You (human) | <code>#8A5A00</code> | diamond | Amber distinct from red and teal for common colour-vision deficiencies; white on it is 5.9:1 |</p>
<p>| Manager | <code>#3C4A5C</code> | square | Neutral slate, so the manager reads as coordination, not work; white on it is 9.0:1 |</p>
<li><strong>Never colour alone.</strong> Every lane, block, node and step has a shape and a text label;</li>
<p>arrows differ by dash pattern and carry words ("hands off", "delegates", "routes").</p>
<p>Heat in the cost/latency overlay is a bar whose height and shade both grow, plus the</p>
<p>value in text.</p>
<li><strong>Theme.</strong> Follows the system setting (<code>prefers-color-scheme</code>) by default, with a</li>
<p>Light/Dark override; the light theme is the design baseline.</p>
<li><strong>Light theme first.</strong> Text tokens are at least 6.9:1 on their backgrounds in light mode</li>
<p>and 7.7:1 in dark mode. In dark mode the palette fills keep white text at AA, and get a</p>
<p>light 2 px outline so each shape's boundary stays above 3:1 against the dark page.</p>
<li><strong>Keyboard throughout.</strong> ← → (and ↑ ↓ in the step list) move the replay cursor, Home</li>
<p>and End jump to the ends, tabs follow the ARIA tabs pattern, map nodes use a roving</p>
<p>tab stop, and every action has a real button.</p>
<li><strong>Screen readers.</strong> The narration column is a real ordered list and is the main way</li>
<p>through a run. Timeline blocks and map nodes are named buttons whose names start with</p>
<p>their visible text (WCAG 2.5.3). Live updates are announced through a polite live</p>
<p>region, throttled.</p>
<li><strong>Motion.</strong> The only animation (the live dot) runs only under</li>
<p><code>prefers-reduced-motion: no-preference</code>; scrolling is instant when motion is reduced.</p>
<li>Checked with axe-core against WCAG 2.0, 2.1 and 2.2 A/AA in both themes (dev-only test</li>
<p>in <code>tests/browser/</code>).</p>
<h2>Dependency licences</h2>
<p>No new runtime or build dependencies. The Python side uses only the standard library and</p>
<p>Starlette, which aiui already depends on. The browser side is plain ES modules with no</p>
<p>imports beyond our own file. Dev-only test tools that are not shipped: Playwright</p>
<p>(Apache-2.0, already used in this environment) and axe-core (MPL-2.0, loaded from a path</p>
<p>given by <code>AXE_CORE_JS</code>; not vendored).</p>
<h2>Consequences</h2>
<li>We own the look and the layout code, and can change them without licence questions.</li>
<li>The layout is simpler than a dedicated graph engine. It is fine for the team and flow</li>
<p>sizes we see (tens of nodes). Very large graphs may need a better crossing-reduction</p>
<p>step later.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/adr/replay-view-clean-room.source.md", "text": "---\nnav_title: 0001 Replay view\n---\n\n# ADR 0001: PraisonAI Replay view, a clean-room design\n\n- **Status:** accepted\n- **Date:** 2026-10-26\n- **Scope:** `src/praisonaiui/features/replay.py`, `features/_trace_jsonl.py`,\n  `templates/frontend/plugins/views/replay-core.js`, `templates/frontend/plugins/views/replay.js`\n\n## Context\n\nPraisonAI records agent runs as context-trace JSONL (one `ContextEvent.to_dict()` per\nline). People need to see what a team or flow did: who did what, when, why, and at what\ncost, both after the fact and live. Other tools have shown that a graph plus a trace is a\nuseful way to look at agent runs. We want that value without copying anyone's product,\ncode or look, and without adding dependencies.\n\n## Decision\n\nBuild our own view, in plain DOM and SVG, with our own layout code, palette and words.\n\n### Ideas we took (ideas only)\n\n| Idea | Where it came from | What we did with it |\n|---|---|---|\n| Show the graph of a multi-agent program next to the trace of a run | The general concept behind LangGraph Studio's graph-plus-trace view, known from public talks and articles | A **Map** view drawn by our own layered layout (`layoutMap`); the default view is a **Timeline**, which Studio does not have |\n| Parallel voices on shared time, read left to right | Musical scores and swimlane diagrams | One lane per agent plus Manager and You; parallel branches as sub-lanes; tasks and steps as \"chapters\" across the top |\n| Vocabulary for LLM and tool spans, tokens and cost | OpenTelemetry GenAI semantic conventions (public specification) | Block kinds (LLM, tool), token and cost totals; the wrapper's OTLP export uses the conventions, the UI only borrows the concepts |\n\n### What we did not use\n\n- **No third-party UI code, CSS, icons, layouts or screenshots** were used to build this\n  view. Shapes, palette, spacing, wording (\"Brief\", \"Delivered\", \"Waiting for you\") and\n  the layout algorithm are our own.\n- **LangGraph's server (Elastic License 2.0) and the proprietary LangGraph Studio were\n  not consulted for code**, and none of their assets, markup or styles were copied. We\n  do not use the name \"Studio\", any \"Lang…\" naming, or `__start__`/`__end__` pills.\n- No Mermaid, D3, React Flow, dagre, ELK or other graph libraries. The dashboard's\n  existing Mermaid CDN plugin is not used by Replay.\n\n### How it is built\n\n- `replay-core.js`: pure functions (`buildModel`, `narrate`, `layoutMap`,\n  `deriveGraph`). No DOM, no network. Tested with `node --test`.\n- `replay.js`: DOM/SVG rendering, keyboard handling, SSE follow and approvals. It also\n  boots by itself when `window.__REPLAY_DATA__ = {events, graph}` is set, which is how\n  the wrapper's single-file HTML export works (`standalone_html()` inlines both files).\n- `layoutMap` is a textbook layered layout written from scratch: depth-first search to\n  find back edges (loops), longest-path layering, one virtual waypoint per crossed layer\n  for long edges, and a few barycentre sweeps to order each layer. It is deterministic.\n- Narration is template text, chosen per event type. No LLM, no randomness.\n\n## Palette and accessibility rationale\n\n| Role | Fill | Shape | Why |\n|---|---|---|---|\n| Agent | `#8B0000` | circle | PraisonAI's brand red; white text on it is 10.0:1 |\n| Tool | `#0F7287` | rounded rectangle | Teal kept from the brand but darkened from `#189AB4` (white text on `#189AB4` fails AA); white on `#0F7287` is 5.6:1 |\n| You (human) | `#8A5A00` | diamond | Amber distinct from red and teal for common colour-vision deficiencies; white on it is 5.9:1 |\n| Manager | `#3C4A5C` | square | Neutral slate, so the manager reads as coordination, not work; white on it is 9.0:1 |\n\n- **Never colour alone.** Every lane, block, node and step has a shape and a text label;\n  arrows differ by dash pattern and carry words (\"hands off\", \"delegates\", \"routes\").\n  Heat in the cost/latency overlay is a bar whose height and shade both grow, plus the\n  value in text.\n- **Theme.** Follows the system setting (`prefers-color-scheme`) by default, with a\n  Light/Dark override; the light theme is the design baseline.\n- **Light theme first.** Text tokens are at least 6.9:1 on their backgrounds in light mode\n  and 7.7:1 in dark mode. In dark mode the palette fills keep white text at AA, and get a\n  light 2 px outline so each shape's boundary stays above 3:1 against the dark page.\n- **Keyboard throughout.** ← → (and ↑ ↓ in the step list) move the replay cursor, Home\n  and End jump to the ends, tabs follow the ARIA tabs pattern, map nodes use a roving\n  tab stop, and every action has a real button.\n- **Screen readers.** The narration column is a real ordered list and is the main way\n  through a run. Timeline blocks and map nodes are named buttons whose names start with\n  their visible text (WCAG 2.5.3). Live updates are announced through a polite live\n  region, throttled.\n- **Motion.** The only animation (the live dot) runs only under\n  `prefers-reduced-motion: no-preference`; scrolling is instant when motion is reduced.\n- Checked with axe-core against WCAG 2.0, 2.1 and 2.2 A/AA in both themes (dev-only test\n  in `tests/browser/`).\n\n## Dependency licences\n\nNo new runtime or build dependencies. The Python side uses only the standard library and\nStarlette, which aiui already depends on. The browser side is plain ES modules with no\nimports beyond our own file. Dev-only test tools that are not shipped: Playwright\n(Apache-2.0, already used in this environment) and axe-core (MPL-2.0, loaded from a path\ngiven by `AXE_CORE_JS`; not vendored).\n\n## Consequences\n\n- We own the look and the layout code, and can change them without licence questions.\n- The layout is simpler than a dedicated graph engine. It is fine for the team and flow\n  sizes we see (tens of nodes). Very large graphs may need a better crossing-reduction\n  step later.\n"}</script>
