></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>ADR 0003: Selectable layouts, a first-party plugin kind</h1>
<li><strong>Status:</strong> Accepted (Nov 2026). The browser contract (F1) is frozen. The foundation (F2 Python config and</li>
<p>records, F3 shell host and gates, F4 Pro tokens, C chat presentation and feeds, D artifacts and run ledger</p>
<p>APIs) is shipped; the five layouts' own designs (wave 2) are <strong>(planned)</strong> and marked so below.</p>
<li><strong>Date:</strong> 2026-11-14</li>
<li><strong>Extends:</strong> ADR 0002. It adds one registration kind, which R3 allows through an ADR. It supersedes nothing.</li>
<li><strong>Scope:</strong> <code>src/frontend/src/{sdk,shell,builtin,app-layouts,layout-features,chat-engine}</code>,</li>
<p><code>src/praisonaiui/{layouts.py,plugin_registry.py,builtin,schema,features}</code></p>
<li><strong>Related:</strong> <code>ARCHITECTURE.md</code> (R1–R16, plus R17 below), <code>docs/features/plugins.md</code>, <code>docs/features/react-shell.md</code></li>
<h2>Context</h2>
<li>The app shell (<code>style: app</code>) has one frame: the sidebar, header and page area in <code>shell/ReactShell.tsx</code>.</li>
<p>The product needs several frames over the same pages: a workbench, a keyboard-first command deck,</p>
<p>chat with a canvas, a guided mode for newcomers, and a mission-control overview.</p>
<li>The frames differ in navigation, in who draws the session list, in how the chat thread and its</li>
<p>approvals look, and in the side panels they show (artifacts, run inspector, KPIs). They do not differ</p>
<p>in what a page is.</p>
<li>Several names were already taken, so this ADR uses new ones:</li>
<li><code>src/layouts/</code> belongs to the legacy React App, so new frames live in <strong><code>app-layouts/</code></strong>.</li>
<li>Manifest <code>layout</code> already holds sidebar and page settings (<code>layout.default</code> is the default page),</li>
<p>so the new data is a top-level <strong><code>layouts</code></strong> key.</p>
<li>YAML <code>layout:</code> is the existing <code>LayoutConfig</code> (chat <code>mode</code>, <code>width</code>, <code>height</code>). It is extended</li>
<p>additively, not replaced (R7).</p>
<li><code>aiui.layout(...)</code> is the blocks helper, so the Python setter is <strong><code>aiui.set_layout()</code></strong>.</li>
<li>A page with the id <code>chat-canvas</code> already exists. Layout ids are a separate namespace.</li>
<li>The standalone default (<code>dashboard</code>) must render byte-for-byte as before (R6).</li>
<h2>Decision</h2>
<p>1. <strong>A layout owns the frame; a page owns its content.</strong> The frame is everything around the routed</p>
<p>page: navigation, session list, top bar, side panels, status bar and phone chrome. Every manifest</p>
<p>page renders inside every layout through the <code>Outlet</code> the shell passes in. The current frame becomes</p>
<p>the core's own <strong>classic frame</strong> (<code>shell/ClassicFrame.tsx</code>). It has no layout id, it</p>
<p>is the fallback whenever no layout is selected, registered or able to load, and <code>classic</code> is the</p>
<p>reserved id that selects it.</p>
<p>2. <strong>Each built-in layout is three things</strong>:</p>
<li>a Python <code>BuiltinPlugin</code> record <code>builtin.layout-&lt;id&gt;</code>, which <code>extensions.disabled</code> can switch off;</li>
<li>a tiny eager browser descriptor (<code>builtin/layouts/&lt;id&gt;.ts</code>, meta plus a loader);</li>
<li>a lazy frame chunk (<code>app-layouts/&lt;id&gt;/</code>).</li>
<p>A third-party layout makes the same SDK call. Its Python plugin declares it with a new <code>layouts()</code></p>
<p>hook, and its ESM module is imported only while that layout is active.</p>
<p>3. <strong>Isolation is a hard rule:</strong> R17, below.</p>
<p>4. <strong>Layout-specific backend data lives in separate feature modules</strong>:</p>
<p><code>features/artifacts.py</code> and <code>features/run_ledger.py</code>, each with its own catalog record declaring</p>
<p><code>for_layouts=(...)</code>. Such a record mounts only when one of those layouts is available, or when it is</p>
<p>named in <code>extensions.enabled</code>. Nothing goes in <code>server.py</code> (R11).</p>
<p>5. <strong>Pages a layout owns are ordinary catalog pages</strong> with <code>shell_only=True</code> and <code>layouts=(...)</code>.</p>
<p><code>shell_only</code> keeps them out of <code>/api/pages</code> and the dashboard (R6). The manifest carries <code>layouts</code></p>
<p>and <code>replaces</code> as data, so the core never compares page or layout ids (R1). A page owned by a</p>
<p>layout record carries the source <code>builtin.layout-&lt;id&gt;</code> (<code>builtin.&lt;name&gt;</code> for a data record such as</p>
<p><code>builtin.artifacts</code>). Guided's <code>start</code> and <code>templates</code> and Mission's <code>ops-overview</code> arrive with</p>
<p>their frames <strong>(planned, wave 2)</strong>.</p>
<p>6. <strong>Switching is live.</strong> <code>setLayout</code> remounts the frame and the page without a reload. Chat state</p>
<p>survives because the thread store is module state.</p>
<h2>Frozen contract (F1, shipped)</h2>
<p>Additive under <code>SDK_VERSION = 1</code>. <code>SDK_EXPORTS</code> appends <code>registerLayout</code>, <code>getLayouts</code>, <code>useLayout</code>,</p>
<p><code>setLayout</code>, <code>provideLayoutData</code> and <code>useLayoutData</code>. <code>SDK_FEATURES</code> appends <code>layouts</code>, <code>layout-data</code></p>
<p>and <code>slots.dispose</code>. Types for plugin authors are in <code>sdk/aiui-sdk.d.ts</code>.</p>
<p>| Module | Holds |</p>
<p>|---|---|</p>
<p>| <code>sdk/layouts.ts</code> | registration, the active layout, storage keys, feeds |</p>
<p>| <code>sdk/layoutTypes.ts</code> | <code>Feed&lt;S&gt;</code> and the structural feed types; types only, no chat-engine import |</p>
<p>| <code>sdk/manifest.ts</code> | <code>ShellLayoutSpec</code>, <code>ShellLayouts</code>, <code>ShellManifest.layouts?</code>, <code>ShellPage.layouts?/replaces?/pageType?</code>, <code>LAYOUT_ID_PATTERN</code>, <code>CLASSIC_LAYOUT_ID</code> |</p>
<p>| <code>sdk/registry.ts</code> | <code>registerSlot</code> now returns a disposer; <code>toComponent</code> is the shared component-or-loader resolver |</p>
<p><strong>Registration.</strong> <code>registerLayout(id, meta, C | () =&gt; import(...)): () =&gt; void</code>.</p>
<li>An id matches <code>^[a-z][a-z0-9-]{0,39}$</code>, the same rule as the server. <code>classic</code> is reserved.</li>
<li>A loader runs only when the shell first renders that layout, and it is retried after a failed</li>
<p>chunk load.</p>
<li>Registering an id again replaces it and logs a warning; the remover removes only its own</li>
<p>registration.</p>
<li><code>meta</code> is <code>{ title, description?, preview?, chat?: ChatPresentation, approvals?: 'toast' | 'frame' }</code>.</li>
<p>A missing title or a region that is not a loader throws. An unknown enum value (from a newer SDK) is</p>
<p>dropped with a warning, so the default applies.</p>
<li><code>ChatPresentation</code>:</li>
<li><code>sessions</code>: <code>page</code> (default), <code>frame</code>, <code>tabs</code> or <code>none</code>;</li>
<li><code>thread</code>: <code>bubbles</code>, <code>quiet</code>, <code>steps</code> or <code>dense</code> (<code>steps</code> pins an open approval above the composer,</li>
<p>since its turn header owns the turn's steps);</p>
<li><code>approvals</code>: <code>inline</code>, <code>card</code> or <code>keyboard</code>;</li>
<li>the lazy regions <code>aside</code>, <code>turnHeader</code>, <code>turnFooter</code>, <code>empty</code> and <code>composerTool</code> (a tool in the composer's row, e.g. Chat + Canvas's "@"; a <code>RegionLoader</code> each), plus <code>asideLabel</code>.</li>
<p><strong>What a frame receives.</strong> A frame receives <code>LayoutProps</code>:</p>
<li><code>Outlet</code>: the page, with its error boundary, page toolbar slot and Suspense;</li>
<li><code>pageId</code>, <code>page</code>, <code>fullBleed</code>, <code>viewport</code> (<code>phone</code> below 768 px, <code>tablet</code> below 1024 px, else <code>desktop</code>);</li>
<li><code>nav: LayoutNav</code>: <code>primary</code> (at most 7), <code>groups</code> (the rest), <code>footer</code>, <code>activeId</code>, <code>go</code>;</li>
<li><code>chrome: LayoutChrome</code>: site title and logo, <code>openPalette({query})</code> for the one cmdk palette,</li>
<p><code>toggleColorMode</code>, the shell's <code>Slot</code> host, and <code>mainId</code> for the skip link;</p>
<li><code>layout: { id, available, switchTo }</code>.</li>
<p><strong>Which layout is on.</strong></p>
<li><code>useLayout()</code> returns <code>{ id, meta }</code>, or null for the classic frame. It is also null while the</li>
<p>active layout is not registered yet.</p>
<li><code>setLayout(id, { persist = true })</code> writes <code>localStorage['aiui-layout']</code> and clears the tab's</li>
<p>preview. With <code>persist: false</code> it writes <code>sessionStorage['aiui-layout-preview']</code> instead. <code>''</code> and</p>
<p><code>classic</code> both mean the classic frame. It then calls the layout host.</p>
<li>The shell installs that host with <code>provideLayoutHost</code> (not an SDK export). The host re-runs the</li>
<p>selection and reports the result with <code>activateLayout</code>.</p>
<li>Storage that throws is ignored; the switch still happens.</li>
<p><strong>Feeds.</strong> These carry the data a frame shows.</p>
<li><code>provideLayoutData(kind, feed | () =&gt; Promise&lt;feed&gt;): () =&gt; void</code>. A function is always a loader. It</li>
<p>runs the first time a frame reads the kind, and only once.</p>
<li><code>useLayoutData(kind)</code> returns the feed, or null while nothing provides it or it is loading. A frame</li>
<p>must render without the feed: it hides the panel or shows an empty state, and never crashes.</p>
<li>If a loader fails, the failure is logged once and the feed stays null. Calling</li>
<p><code>provideLayoutData</code> again retries.</p>
<li>The core kinds are <code>sessions</code>, <code>chat</code>, <code>approvals</code>, <code>runs</code> and <code>artifacts</code>. <code>LayoutDataMap</code> is open</li>
<p>for declaration merging, so a plugin can add a kind of its own.</p>
<p><strong>Manifest.</strong></p>
<li><code>layouts?: { default, userChoice, available: ShellLayoutSpec[] }</code>. A <code>ShellLayoutSpec</code> has <code>id</code>,</li>
<p><code>title</code>, <code>description</code>, <code>order</code>, <code>source</code>, <code>module</code>, <code>css</code>, <code>integrity</code>, <code>home</code>, <code>primary</code> and <code>options</code>.</p>
<li>If the key is absent (an older server), the shell uses the classic frame. <code>normalizeManifest</code></li>
<p>then leaves the key out.</p>
<li>When <code>normalizeManifest</code> reads the key, it drops invalid and repeated ids, and it maps a <code>default</code></li>
<p>that is not a layout id (or is <code>classic</code>) to <code>''</code>.</p>
<li>Ill-typed page <code>layouts</code>, <code>replaces</code> and <code>pageType</code> fields are dropped.</li>
<h2>R17: layout isolation (new rule)</h2>
<p>1. <strong>One folder and one chunk per unit.</strong></p>
<li>Every layout is <code>app-layouts/&lt;id&gt;/**</code>, emitted as the Vite chunk <code>layout-&lt;id&gt;</code>.</li>
<li>Every layout-specific feature is <code>layout-features/&lt;name&gt;/**</code>, emitted as <code>lf-&lt;name&gt;</code>.</li>
<li>Shared pieces live in <code>app-layouts/kit/**</code> (chunk <code>layout-kit</code>). They are never copied.</li>
<p>2. <strong>Imports.</strong></p>
<li>A layout never imports another layout, or <code>@/shell/**</code>.</li>
<li>A layout reaches <code>layout-features/*</code> only through <code>import()</code>: a <code>RegionLoader</code> or a lazy child.</li>
<li><code>layout-features</code> never import <code>app-layouts/&lt;id&gt;</code>.</li>
<li>Frames and the kit import only <code>@/sdk/*</code>, <code>@/components/ui/*</code>, <code>@/lib/*</code>, <code>@/app-layouts/kit</code></li>
<p>and the light chat-engine modules (<code>store</code>, <code>api</code>, <code>protocol</code>, <code>sessionList</code>, <code>feeds</code>).</p>
<li>They never import <code>Thread</code>, <code>ChatPage</code>, <code>useAiuiRuntime</code> or <code>@assistant-ui</code>.</li>
<p>3. <strong>The core never names a layout.</strong> <code>shell/</code>, <code>sdk/</code>, <code>legacy/</code> and <code>blocks/</code> contain no layout id</p>
<p>literal and import neither folder (<code>shell/core-purity.test.ts</code>).</p>
<p>4. <strong>An inactive layout's code is never downloaded.</strong> A static gate</p>
<p>(<code>scripts/check-layout-isolation.mjs</code>, part of <code>npm run check:closure</code>) and a network e2e</p>
<p>(<code>e2e/specs/layouts-host.spec.ts</code>) enforce this.</p>
<p>5. <strong>Data features gate on layouts.</strong> A record with <code>for_layouts</code> mounts only when a listed layout is</p>
<p>available, or when it is explicitly enabled (<code>builtin.artifacts</code> for <code>chat-canvas</code>,</p>
<p><code>builtin.run-ledger</code> for <code>command</code> and <code>mission</code>). Otherwise its status is <code>disabled</code> with the</p>
<p>reason "no layout needs it".</p>
<p>*Check:* <code>app-layouts/isolation.test.ts</code>, <code>shell/core-purity.test.ts</code>, <code>check-layout-isolation.mjs</code>,</p>
<p><code>e2e/specs/layouts-host.spec.ts</code>, and <code>tests/unit/test_layout_gating.py</code>.</p>
<h2>Configuration surface</h2>
<li><strong>YAML.</strong> <code>LayoutConfig</code> gains <code>default</code>, <code>available</code>, <code>user_choice</code> (alias <code>userChoice</code>, default</li>
<p>true), <code>primary</code> and <code>options</code> (keyed by layout id). <code>mode</code>, <code>width</code> and <code>height</code> are unchanged. A</p>
<p>bare string is shorthand: <code>layout: command</code> means <code>{default: command}</code>.</p>
<li><strong>Python.</strong> <code>aiui.set_layout(default=None, *, available=None, user_choice=None, primary=None, options=None)</code></li>
<p>lives in <code>praisonaiui/layouts.py</code>, which is exported lazily (the 200 ms import budget holds) and</p>
<p>reset by <code>PluginRegistry.reset()</code>.</p>
<li><strong>Environment.</strong> <code>AIUI_LAYOUT=&lt;id&gt;|classic</code>.</li>
<li><strong>Server precedence:</strong> <code>AIUI_LAYOUT</code> &gt; <code>set_layout()</code> &gt; YAML <code>layout</code> &gt; the style default. This</li>
<p>matches <code>AIUI_SHELL</code>.</p>
<li><strong>Browser precedence:</strong> a <code>?layout=</code> preview (copied into sessionStorage, so navigation keeps it)</li>
<p>&gt; the stored user choice (only when <code>userChoice</code>) &gt; the server default &gt; classic.</p>
<li><strong>Validation.</strong></li>
<li>An unknown id after plugin discovery logs one warning and falls back to the first available layout.</li>
<li><code>aiui validate</code> warns with code 5101 on an unknown built-in id.</li>
<li>A layout set while the style is not <code>app</code> warns once ("layout ignored: style is 'dashboard'").</li>
<p>The style is never flipped implicitly.</p>
<li><strong>Per-viewer override.</strong> Settings → Appearance offers a select of the available layouts plus</li>
<p>Classic, and the palette gets "Switch layout: …" commands. v1 keeps the choice per browser;</p>
<p>cross-device sync waits for user profiles.</p>
<h2>Defaults</h2>
<li><strong>The standalone default stays <code>dashboard</code>.</strong> Its output is unchanged (R6):</li>
<li><code>golden_dashboard_html.txt</code> and <code>builtin_pages_snapshot.json</code> do not change;</li>
<li>layout pages are <code>shell_only</code>;</li>
<li>the <code>layouts</code> key appears only in the shell manifest.</li>
<li><strong>The <code>style: app</code> default is <code>chat-canvas</code></strong> (owner decision). Apps that already opt in</li>
<p>to <code>style: app</code> get the chat-canvas frame and a changelog entry; <code>layout: classic</code> restores today's</p>
<p>frame. <code>AIUI_SHELL=legacy</code> remains the kill switch, and a layout is then ignored with a warning.</p>
<li><strong>The classic frame</strong> is the fallback whenever:</li>
<li>the manifest has no <code>layouts</code>;</li>
<li>the chosen id is not available;</li>
<li>the layout is not registered once plugins have settled (with a console warning);</li>
<li>the frame throws, which also raises one toast and fires <code>aiui:plugin-error</code> (R4).</li>
<h2>Budgets (gzip caps; the measured limits are in `.size-limit.mjs`)</h2>
<p>| Budget | Cap |</p>
<p>|---|---|</p>
<p>| Shell boot (host, registry and five descriptors add at most 4 kB) | 150 kB, unchanged |</p>
<p>| Each <code>layout-&lt;id&gt;</code> closure minus boot | 24 kB (mission: 28 kB) |</p>
<p>| <code>layout-kit</code> | 10 kB |</p>
<p>| <code>lf-artifacts</code> / <code>lf-run-inspector</code> / <code>lf-command-bar</code> / <code>lf-step-tracker</code> / <code>lf-mission-board</code> | 30 / 14 / 6 / 6 / 22 kB |</p>
<p>| <code>/chat</code> first screen with the default layout | 270 kB |</p>
<p>| <code>/chat</code> first screen with the classic frame | 252 kB (was 250: the app pages split two icon chunks, and <code>builtin.artifacts</code> joins the boot list) |</p>
<h2>Compatibility</h2>
<li><strong>Everything is additive.</strong></li>
<li>Six exports and three features are appended.</li>
<li><code>registerSlot</code>'s return type was <code>void</code>, and it is now a disposer.</li>
<li>Every manifest key is optional.</li>
<li>YAML <code>layout:</code> keeps its fields.</li>
<li><strong>A plugin that must run on an older shell</strong> checks <code>SDK_FEATURES?.includes('layouts')</code> before it</li>
<p>calls <code>registerLayout</code>.</p>
<li><strong>Older servers</strong> send no <code>layouts</code> key and get the classic frame. A server whose layout plugin</li>
<p>fails to register also falls back to classic.</p>
<h2>Rejected alternatives</h2>
<li><strong>One configurable frame with switches.</strong> Every frame's code would land in the boot chunk, and each</li>
<p>new frame would need core changes. That breaks R1 and R10.</p>
<li><strong>Layouts as pages.</strong> A page cannot own the navigation around itself, and pages would have to know</li>
<p>about each other.</p>
<li><strong>A second registry or a per-kind list in the shell.</strong> This would break R3. Layouts use the SDK</li>
<p>registry pattern, and the manifest already carries records.</p>
<li><strong>A server-side per-user preference store now.</strong> No user profile store exists yet. Browser storage</li>
<p>ships now; sync comes with auth profiles.</p>
<h2>Consequences</h2>
<li>Frames ship and fail alone. A broken layout costs one toast and drops to the classic frame, not</li>
<p>the app.</p>
<li>The chat page reads one presentation object instead of growing one branch per layout.</li>
<li>The data a frame shows (sessions, approvals, runs, artifacts) becomes a feed contract that tests</li>
<p>and plugins can stub.</p>
<li>Contract churn is the main risk. F1 is frozen once merged, and changes after that are append-only.</li>
<h2>Delivery</h2>
<p>Wave 0 is F1 (this contract) plus this ADR. Wave 1 is F2 (Python config and records), F3 (shell host,</p>
<p>classic frame, gates), F4 (Pro tokens), C (chat presentation and feeds) and D (artifacts and run ledger</p>
<p>APIs). Wave 2 is the five layouts, artifacts, page templates and the praisonai-package default. The</p>
<p>full track plan is in <code>.claude/ui-reset/reports/layouts-plan.md</code>.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/adr/selectable-layouts.source.md", "text": "---\nnav_title: 0003 Selectable layouts\n---\n\n# ADR 0003: Selectable layouts, a first-party plugin kind\n\n- **Status:** Accepted (Nov 2026). The browser contract (F1) is frozen. The foundation (F2 Python config and\n  records, F3 shell host and gates, F4 Pro tokens, C chat presentation and feeds, D artifacts and run ledger\n  APIs) is shipped; the five layouts' own designs (wave 2) are **(planned)** and marked so below.\n- **Date:** 2026-11-14\n- **Extends:** [ADR 0002](0002-react-app-shell-and-plugin-sdk.md). It adds one registration kind, which R3 allows through an ADR. It supersedes nothing.\n- **Scope:** `src/frontend/src/{sdk,shell,builtin,app-layouts,layout-features,chat-engine}`,\n  `src/praisonaiui/{layouts.py,plugin_registry.py,builtin,schema,features}`\n- **Related:** `ARCHITECTURE.md` (R1–R16, plus R17 below), `docs/features/plugins.md`, `docs/features/react-shell.md`\n\n## Context\n\n- The app shell (`style: app`) has one frame: the sidebar, header and page area in `shell/ReactShell.tsx`.\n  The product needs several frames over the same pages: a workbench, a keyboard-first command deck,\n  chat with a canvas, a guided mode for newcomers, and a mission-control overview.\n- The frames differ in navigation, in who draws the session list, in how the chat thread and its\n  approvals look, and in the side panels they show (artifacts, run inspector, KPIs). They do not differ\n  in what a page is.\n- Several names were already taken, so this ADR uses new ones:\n  - `src/layouts/` belongs to the legacy React App, so new frames live in **`app-layouts/`**.\n  - Manifest `layout` already holds sidebar and page settings (`layout.default` is the default page),\n    so the new data is a top-level **`layouts`** key.\n  - YAML `layout:` is the existing `LayoutConfig` (chat `mode`, `width`, `height`). It is extended\n    additively, not replaced (R7).\n  - `aiui.layout(...)` is the blocks helper, so the Python setter is **`aiui.set_layout()`**.\n  - A page with the id `chat-canvas` already exists. Layout ids are a separate namespace.\n- The standalone default (`dashboard`) must render byte-for-byte as before (R6).\n\n## Decision\n\n1. **A layout owns the frame; a page owns its content.** The frame is everything around the routed\n   page: navigation, session list, top bar, side panels, status bar and phone chrome. Every manifest\n   page renders inside every layout through the `Outlet` the shell passes in. The current frame becomes\n   the core's own **classic frame** (`shell/ClassicFrame.tsx`). It has no layout id, it\n   is the fallback whenever no layout is selected, registered or able to load, and `classic` is the\n   reserved id that selects it.\n2. **Each built-in layout is three things**:\n   - a Python `BuiltinPlugin` record `builtin.layout-\u003cid\u003e`, which `extensions.disabled` can switch off;\n   - a tiny eager browser descriptor (`builtin/layouts/\u003cid\u003e.ts`, meta plus a loader);\n   - a lazy frame chunk (`app-layouts/\u003cid\u003e/`).\n\n   A third-party layout makes the same SDK call. Its Python plugin declares it with a new `layouts()`\n   hook, and its ESM module is imported only while that layout is active.\n3. **Isolation is a hard rule:** R17, below.\n4. **Layout-specific backend data lives in separate feature modules**:\n   `features/artifacts.py` and `features/run_ledger.py`, each with its own catalog record declaring\n   `for_layouts=(...)`. Such a record mounts only when one of those layouts is available, or when it is\n   named in `extensions.enabled`. Nothing goes in `server.py` (R11).\n5. **Pages a layout owns are ordinary catalog pages** with `shell_only=True` and `layouts=(...)`.\n   `shell_only` keeps them out of `/api/pages` and the dashboard (R6). The manifest carries `layouts`\n   and `replaces` as data, so the core never compares page or layout ids (R1). A page owned by a\n   layout record carries the source `builtin.layout-\u003cid\u003e` (`builtin.\u003cname\u003e` for a data record such as\n   `builtin.artifacts`). Guided's `start` and `templates` and Mission's `ops-overview` arrive with\n   their frames **(planned, wave 2)**.\n6. **Switching is live.** `setLayout` remounts the frame and the page without a reload. Chat state\n   survives because the thread store is module state.\n\n## Frozen contract (F1, shipped)\n\nAdditive under `SDK_VERSION = 1`. `SDK_EXPORTS` appends `registerLayout`, `getLayouts`, `useLayout`,\n`setLayout`, `provideLayoutData` and `useLayoutData`. `SDK_FEATURES` appends `layouts`, `layout-data`\nand `slots.dispose`. Types for plugin authors are in `sdk/aiui-sdk.d.ts`.\n\n| Module | Holds |\n|---|---|\n| `sdk/layouts.ts` | registration, the active layout, storage keys, feeds |\n| `sdk/layoutTypes.ts` | `Feed\u003cS\u003e` and the structural feed types; types only, no chat-engine import |\n| `sdk/manifest.ts` | `ShellLayoutSpec`, `ShellLayouts`, `ShellManifest.layouts?`, `ShellPage.layouts?/replaces?/pageType?`, `LAYOUT_ID_PATTERN`, `CLASSIC_LAYOUT_ID` |\n| `sdk/registry.ts` | `registerSlot` now returns a disposer; `toComponent` is the shared component-or-loader resolver |\n\n**Registration.** `registerLayout(id, meta, C | () =\u003e import(...)): () =\u003e void`.\n- An id matches `^[a-z][a-z0-9-]{0,39}$`, the same rule as the server. `classic` is reserved.\n- A loader runs only when the shell first renders that layout, and it is retried after a failed\n  chunk load.\n- Registering an id again replaces it and logs a warning; the remover removes only its own\n  registration.\n- `meta` is `{ title, description?, preview?, chat?: ChatPresentation, approvals?: 'toast' | 'frame' }`.\n  A missing title or a region that is not a loader throws. An unknown enum value (from a newer SDK) is\n  dropped with a warning, so the default applies.\n- `ChatPresentation`:\n  - `sessions`: `page` (default), `frame`, `tabs` or `none`;\n  - `thread`: `bubbles`, `quiet`, `steps` or `dense` (`steps` pins an open approval above the composer,\n    since its turn header owns the turn's steps);\n  - `approvals`: `inline`, `card` or `keyboard`;\n  - the lazy regions `aside`, `turnHeader`, `turnFooter`, `empty` and `composerTool` (a tool in the composer's row, e.g. Chat + Canvas's \"@\"; a `RegionLoader` each), plus `asideLabel`.\n\n**What a frame receives.** A frame receives `LayoutProps`:\n- `Outlet`: the page, with its error boundary, page toolbar slot and Suspense;\n- `pageId`, `page`, `fullBleed`, `viewport` (`phone` below 768 px, `tablet` below 1024 px, else `desktop`);\n- `nav: LayoutNav`: `primary` (at most 7), `groups` (the rest), `footer`, `activeId`, `go`;\n- `chrome: LayoutChrome`: site title and logo, `openPalette({query})` for the one cmdk palette,\n  `toggleColorMode`, the shell's `Slot` host, and `mainId` for the skip link;\n- `layout: { id, available, switchTo }`.\n\n**Which layout is on.**\n- `useLayout()` returns `{ id, meta }`, or null for the classic frame. It is also null while the\n  active layout is not registered yet.\n- `setLayout(id, { persist = true })` writes `localStorage['aiui-layout']` and clears the tab's\n  preview. With `persist: false` it writes `sessionStorage['aiui-layout-preview']` instead. `''` and\n  `classic` both mean the classic frame. It then calls the layout host.\n- The shell installs that host with `provideLayoutHost` (not an SDK export). The host re-runs the\n  selection and reports the result with `activateLayout`.\n- Storage that throws is ignored; the switch still happens.\n\n**Feeds.** These carry the data a frame shows.\n- `provideLayoutData(kind, feed | () =\u003e Promise\u003cfeed\u003e): () =\u003e void`. A function is always a loader. It\n  runs the first time a frame reads the kind, and only once.\n- `useLayoutData(kind)` returns the feed, or null while nothing provides it or it is loading. A frame\n  must render without the feed: it hides the panel or shows an empty state, and never crashes.\n- If a loader fails, the failure is logged once and the feed stays null. Calling\n  `provideLayoutData` again retries.\n- The core kinds are `sessions`, `chat`, `approvals`, `runs` and `artifacts`. `LayoutDataMap` is open\n  for declaration merging, so a plugin can add a kind of its own.\n\n**Manifest.**\n- `layouts?: { default, userChoice, available: ShellLayoutSpec[] }`. A `ShellLayoutSpec` has `id`,\n  `title`, `description`, `order`, `source`, `module`, `css`, `integrity`, `home`, `primary` and `options`.\n- If the key is absent (an older server), the shell uses the classic frame. `normalizeManifest`\n  then leaves the key out.\n- When `normalizeManifest` reads the key, it drops invalid and repeated ids, and it maps a `default`\n  that is not a layout id (or is `classic`) to `''`.\n- Ill-typed page `layouts`, `replaces` and `pageType` fields are dropped.\n\n## R17: layout isolation (new rule)\n\n1. **One folder and one chunk per unit.**\n   - Every layout is `app-layouts/\u003cid\u003e/**`, emitted as the Vite chunk `layout-\u003cid\u003e`.\n   - Every layout-specific feature is `layout-features/\u003cname\u003e/**`, emitted as `lf-\u003cname\u003e`.\n   - Shared pieces live in `app-layouts/kit/**` (chunk `layout-kit`). They are never copied.\n2. **Imports.**\n   - A layout never imports another layout, or `@/shell/**`.\n   - A layout reaches `layout-features/*` only through `import()`: a `RegionLoader` or a lazy child.\n   - `layout-features` never import `app-layouts/\u003cid\u003e`.\n   - Frames and the kit import only `@/sdk/*`, `@/components/ui/*`, `@/lib/*`, `@/app-layouts/kit`\n     and the light chat-engine modules (`store`, `api`, `protocol`, `sessionList`, `feeds`).\n   - They never import `Thread`, `ChatPage`, `useAiuiRuntime` or `@assistant-ui`.\n3. **The core never names a layout.** `shell/`, `sdk/`, `legacy/` and `blocks/` contain no layout id\n   literal and import neither folder (`shell/core-purity.test.ts`).\n4. **An inactive layout's code is never downloaded.** A static gate\n   (`scripts/check-layout-isolation.mjs`, part of `npm run check:closure`) and a network e2e\n   (`e2e/specs/layouts-host.spec.ts`) enforce this.\n5. **Data features gate on layouts.** A record with `for_layouts` mounts only when a listed layout is\n   available, or when it is explicitly enabled (`builtin.artifacts` for `chat-canvas`,\n   `builtin.run-ledger` for `command` and `mission`). Otherwise its status is `disabled` with the\n   reason \"no layout needs it\".\n\n*Check:* `app-layouts/isolation.test.ts`, `shell/core-purity.test.ts`, `check-layout-isolation.mjs`,\n`e2e/specs/layouts-host.spec.ts`, and `tests/unit/test_layout_gating.py`.\n\n## Configuration surface\n\n- **YAML.** `LayoutConfig` gains `default`, `available`, `user_choice` (alias `userChoice`, default\n  true), `primary` and `options` (keyed by layout id). `mode`, `width` and `height` are unchanged. A\n  bare string is shorthand: `layout: command` means `{default: command}`.\n  ```yaml\n  style: app\n  layout: {default: command, available: [command, chat-canvas, workbench], user_choice: true}\n  ```\n- **Python.** `aiui.set_layout(default=None, *, available=None, user_choice=None, primary=None, options=None)`\n  lives in `praisonaiui/layouts.py`, which is exported lazily (the 200 ms import budget holds) and\n  reset by `PluginRegistry.reset()`.\n- **Environment.** `AIUI_LAYOUT=\u003cid\u003e|classic`.\n- **Server precedence:** `AIUI_LAYOUT` \u003e `set_layout()` \u003e YAML `layout` \u003e the style default. This\n  matches `AIUI_SHELL`.\n- **Browser precedence:** a `?layout=` preview (copied into sessionStorage, so navigation keeps it)\n  \u003e the stored user choice (only when `userChoice`) \u003e the server default \u003e classic.\n- **Validation.**\n  - An unknown id after plugin discovery logs one warning and falls back to the first available layout.\n  - `aiui validate` warns with code 5101 on an unknown built-in id.\n  - A layout set while the style is not `app` warns once (\"layout ignored: style is 'dashboard'\").\n    The style is never flipped implicitly.\n- **Per-viewer override.** Settings → Appearance offers a select of the available layouts plus\n  Classic, and the palette gets \"Switch layout: …\" commands. v1 keeps the choice per browser;\n  cross-device sync waits for user profiles.\n\n## Defaults\n\n- **The standalone default stays `dashboard`.** Its output is unchanged (R6):\n  - `golden_dashboard_html.txt` and `builtin_pages_snapshot.json` do not change;\n  - layout pages are `shell_only`;\n  - the `layouts` key appears only in the shell manifest.\n- **The `style: app` default is `chat-canvas`** (owner decision). Apps that already opt in\n  to `style: app` get the chat-canvas frame and a changelog entry; `layout: classic` restores today's\n  frame. `AIUI_SHELL=legacy` remains the kill switch, and a layout is then ignored with a warning.\n- **The classic frame** is the fallback whenever:\n  - the manifest has no `layouts`;\n  - the chosen id is not available;\n  - the layout is not registered once plugins have settled (with a console warning);\n  - the frame throws, which also raises one toast and fires `aiui:plugin-error` (R4).\n\n## Budgets (gzip caps; the measured limits are in `.size-limit.mjs`)\n\n| Budget | Cap |\n|---|---|\n| Shell boot (host, registry and five descriptors add at most 4 kB) | 150 kB, unchanged |\n| Each `layout-\u003cid\u003e` closure minus boot | 24 kB (mission: 28 kB) |\n| `layout-kit` | 10 kB |\n| `lf-artifacts` / `lf-run-inspector` / `lf-command-bar` / `lf-step-tracker` / `lf-mission-board` | 30 / 14 / 6 / 6 / 22 kB |\n| `/chat` first screen with the default layout | 270 kB |\n| `/chat` first screen with the classic frame | 252 kB (was 250: the app pages split two icon chunks, and `builtin.artifacts` joins the boot list) |\n\n## Compatibility\n\n- **Everything is additive.**\n  - Six exports and three features are appended.\n  - `registerSlot`'s return type was `void`, and it is now a disposer.\n  - Every manifest key is optional.\n  - YAML `layout:` keeps its fields.\n- **A plugin that must run on an older shell** checks `SDK_FEATURES?.includes('layouts')` before it\n  calls `registerLayout`.\n- **Older servers** send no `layouts` key and get the classic frame. A server whose layout plugin\n  fails to register also falls back to classic.\n\n## Rejected alternatives\n\n- **One configurable frame with switches.** Every frame's code would land in the boot chunk, and each\n  new frame would need core changes. That breaks R1 and R10.\n- **Layouts as pages.** A page cannot own the navigation around itself, and pages would have to know\n  about each other.\n- **A second registry or a per-kind list in the shell.** This would break R3. Layouts use the SDK\n  registry pattern, and the manifest already carries records.\n- **A server-side per-user preference store now.** No user profile store exists yet. Browser storage\n  ships now; sync comes with auth profiles.\n\n## Consequences\n\n- Frames ship and fail alone. A broken layout costs one toast and drops to the classic frame, not\n  the app.\n- The chat page reads one presentation object instead of growing one branch per layout.\n- The data a frame shows (sessions, approvals, runs, artifacts) becomes a feed contract that tests\n  and plugins can stub.\n- Contract churn is the main risk. F1 is frozen once merged, and changes after that are append-only.\n\n## Delivery\n\nWave 0 is F1 (this contract) plus this ADR. Wave 1 is F2 (Python config and records), F3 (shell host,\nclassic frame, gates), F4 (Pro tokens), C (chat presentation and feeds) and D (artifacts and run ledger\nAPIs). Wave 2 is the five layouts, artifacts, page templates and the praisonai-package default. The\nfull track plan is in `.claude/ui-reset/reports/layouts-plan.md`.\n"}</script>
