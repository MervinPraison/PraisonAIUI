></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</h1>
<li><strong>Status:</strong> Accepted (Nov 2026)</li>
<li><strong>Date:</strong> 2026-11-12 (decision), shipped in v0.3.154 / v0.3.155</li>
<li><strong>Base:</strong> v0.3.153</li>
<li><strong>Scope:</strong> <code>src/frontend/src/{main.tsx,shell,legacy,chat-engine,markdown,sdk,blocks,builtin,styles}</code>,</li>
<p><code>src/praisonaiui/{server.py,plugin_registry.py,builtin,themes.py}</code>, <code>features/chat.py</code></p>
<li><strong>Related:</strong> <code>ARCHITECTURE.md</code> (code map), <code>docs/features/react-shell.md</code>, <code>docs/features/plugins.md</code>,</li>
<p><code>docs/reports/ui-reset-2026-11.md</code> (project record)</p>
<h2>Context</h2>
<li>The default style was the vanilla-JS <code>dashboard</code>: about 26k lines in</li>
<p><code>templates/frontend/plugins</code> (<code>dashboard.js</code> alone 3,560 lines, plus 41 <code>views/*.js</code>). For</p>
<p>this style the React app rendered nothing and the server skipped the React script.</p>
<li>The React styles (chat, agents, playground, docs, custom) shipped one monolithic entry of</li>
<p>437 KB gzip, over the 250 KB first-screen budget, mostly from eagerly loaded</p>
<p>react-markdown, react-syntax-highlighter and mermaid.</p>
<li>Theming was split three ways: React <code>hsl(var(--x))</code> triples, dashboard <code>--db-*</code> hex</li>
<p>tables, and about twelve feature plugins with hard-coded dark hex.</p>
<li>Vite emitted unhashed chunk names, and CI never checked that the committed bundle</li>
<p>matched a fresh build.</p>
<li>Five spikes (all "works with caveats") de-risked the plan:</li>
<p>1. <strong>chat-runtime</strong>: assistant-ui ExternalStoreRuntime runs over our SSE and WS protocol unchanged.</p>
<p>2. <strong>markdown</strong>: Streamdown replaces react-markdown, the highlighter and mermaid code; entry 437 KB → 166 KB gzip.</p>
<p>3. <strong>legacy-host</strong>: a React shell mounted 41 of 41 legacy pages with 0 page errors; first screen ~130 KB gzip.</p>
<p>4. <strong>design-system</strong>: radix-ui migration plus a seed / color-mix <code>theme.css</code>.</p>
<p>5. <strong>python-plugins</strong>: entry-point registry, shell manifest and import-map externals.</p>
<h2>Decision</h2>
<p>1. <strong>One React shell</strong>, selected by a new style <code>app</code>. Opt-in: <code>style: app</code>,</p>
<p><code>set_style("app")</code>, or <code>AIUI_SHELL=app</code> (alias <code>react</code>). <code>AIUI_SHELL=legacy</code> maps <code>app</code></p>
<p>back to <code>dashboard</code> and is the kill switch after the flip. The <code>dashboard</code> style stays</p>
<p>byte-for-byte the same and stays the default.</p>
<p>2. <strong>One Vite build.</strong> The entry stays <code>assets/index.js</code> (cache-busted with <code>?v=</code>); chunks</p>
<p>become <code>assets/[name]-[hash].js</code> (also needed because Shiki's <code>markdown.js</code> and our</p>
<p><code>Markdown.js</code> collide on case-insensitive filesystems). <code>main.tsx</code> is ~1 KB: with</p>
<p><code>&lt;html data-aiui-shell="react"&gt;</code> it lazy-imports <code>shell/mount</code>, otherwise</p>
<p><code>legacy-app-entry</code> (the previous App, unchanged).</p>
<p>3. <strong>Strangler host.</strong> The shell owns <code>#root</code>, sidebar, header and routing. Page resolution:</p>
<p>1. SDK registry (ported React pages and plugin pages)</p>
<p>2. <code>kind=blocks</code>, rendered by BlockPage</p>
<p>3. <code>LegacyViewHost</code>, which calls <code>dashboard.js</code> <code>mountView()</code> (imported as a runtime only;</p>
<p><code>buildDashboard()</code> never runs)</p>
<p>Nothing users have today disappears.</p>
<p>4. <strong>Chat.</strong> <code>@assistant-ui/react</code> ExternalStoreRuntime behind <code>useAiuiRuntime</code> (the only</p>
<p>file that touches the assistant-ui runtime API). Thread built from assistant-ui primitives</p>
<p>in the AI Elements visual idiom. WebSocket <code>/api/chat/ws</code> is canonical; SSE <code>/run</code> is the</p>
<p>fallback.</p>
<p>5. <strong>Markdown.</strong> One <code>&lt;Markdown variant="chat"|"docs"&gt;</code> on Streamdown, always behind</p>
<p><code>React.lazy</code>, with a curated Shiki plugin (shiki/core, JS regex engine, 28 languages),</p>
<p>lazy Mermaid and KaTeX. MkDocs admonitions and tabs are preprocessed into <code>&lt;aiui-*&gt;</code> tags</p>
<p>allowed by an extended rehype-sanitize schema. <code>rehype-sanitize</code> stays in every rehype</p>
<p>list; never use <code>allowedTags</code> (it corrupts code blocks).</p>
<p>6. <strong>Tokens.</strong> One <code>styles/theme.css</code>: seeds → color-mix tiers → shadcn vars as full colours</p>
<p>(<code>var(--x)</code>, not <code>hsl(var(--x))</code>). The <code>--db-*</code> bridge lives in <code>legacy/bridge.css</code>,</p>
<p>scoped to <code>html[data-aiui-shell='react']</code>. Python emits seeds only</p>
<p>(<code>themes.get_seed_theme_css</code>).</p>
<p>7. <strong>Plugins.</strong> Python entry-point group <code>praisonaiui.plugins</code> (<code>plugin_registry.py</code>,</p>
<p><code>SDK_API_VERSION = 1</code>), YAML <code>extensions:</code>, <code>GET /api/shell/manifest</code>. Browser</p>
<p><code>window.__AIUI_SDK__</code> with React shared through an import map to <code>/_aiui/externals/*.js</code>.</p>
<p>A thin block registry renders <code>{type, props, children}</code> for <code>kind=blocks</code> pages.</p>
<p>8. <strong>Design system.</strong> <code>shadcn migrate radix</code> (unified <code>radix-ui</code>), adding only the components</p>
<p>used. No <code>shadcn add -o</code> refresh. <code>next-themes</code> with <code>storageKey="aiui-theme-preference"</code>,</p>
<p>matching the server's theme bootstrap. Rules live in <code>src/frontend/DESIGN.md</code>.</p>
<h3>Resolved product questions</h3>
<p>| Question | Decision |</p>
<p>|---|---|</p>
<p>| Links in chat markdown | Real <code>&lt;a&gt;</code>; external links get <code>target=_blank rel="noopener noreferrer nofollow"</code> |</p>
<p>| Images in chat markdown | Auto-load only same-origin, <code>data:image/</code>, <code>blob:</code>; others are click-to-load placeholders showing the host (exfiltration guard) |</p>
<p>| Shiki languages | Curated 28; others render as plain code |</p>
<p>| Docs path preloading Streamdown over budget | Accepted, documented exception |</p>
<p>| Legacy hex token pass | New <code>--db-p-*</code> namespace with the original hex as fallback, so the dashboard is pixel-identical |</p>
<p>| Transport | WS canonical; on SSE the ask UI disables input and says a live connection is needed |</p>
<p>| Plugin JS surfaces | Default-deny when auth is required or the host is not loopback |</p>
<p>| Unused markdown deps | Removed once no imports remain |</p>
<p>| <code>dashboard.shell</code> alias | Not added; only <code>style: app</code> and <code>AIUI_SHELL</code> |</p>
<h2>Frozen contracts</h2>
<p>These were frozen before parallel work started. Changing them is a breaking change for</p>
<p>plugins and needs a new ADR or an SDK version bump.</p>
<h3>Shell manifest (`sdk/manifest.ts`, mirrors the server's `_build_shell_manifest()`)</h3>
<h3>Registry (`sdk/registry.ts`)</h3>
<p><code>registerPage(id, component | lazy)</code>, <code>registerBlock(type, component)</code>,</p>
<p><code>registerToolRenderer(toolName, component)</code>, <code>registerSlot(slot, component)</code>, the matching</p>
<p>getters, <code>subscribe(fn)</code> and <code>useRegistryVersion()</code>. The exported name list is</p>
<p><code>SDK_EXPORTS</code>; <code>/_aiui/externals/sdk.js</code> must export exactly these names. Shell services</p>
<p>(<code>navigate</code>, <code>notify</code>, <code>fetchJson</code>, <code>useManifest</code>, <code>registerCommand</code>, <code>onActivate</code>) were added</p>
<p>additively later.</p>
<h3>Module entry points</h3>
<p>| Module | Export |</p>
<p>|---|---|</p>
<p>| <code>legacy/runtime.ts</code> | <code>ensureLegacyRuntime()</code>, <code>preloadLegacyRuntime()</code>, <code>setLegacyNavigator(fn)</code> |</p>
<p>| <code>legacy/LegacyViewHost.tsx</code> | <code>LegacyViewHost({ pageId, page? })</code> |</p>
<p>| <code>markdown/LazyMarkdown.tsx</code> | <code>Markdown({ children, variant?, streaming?, className?, components? })</code>, <code>preloadMarkdown</code> |</p>
<p>| <code>chat-engine/ChatPage.tsx</code> | default <code>ChatPage({ page })</code> |</p>
<p>| <code>shell/mount.tsx</code> | <code>mountShell(el)</code> |</p>
<p>| <code>sdk/install.ts</code> | <code>installSdk()</code>, <code>loadManifestPlugins(manifest)</code> |</p>
<p>| <code>blocks/BlockPage.tsx</code> | default <code>BlockPage({ page })</code> |</p>
<h3>Chat hook and transport</h3>
<p>Wire events map to assistant-ui parts in the chat-engine reducer (text, reasoning,</p>
<p>tool-call upsert by <code>tool_call_id</code>, <code>data-element</code>, <code>data-a2ui</code>, <code>data-references</code>,</p>
<p><code>data-memory</code>, approvals and ask as tool-calls with an approval, finalize / error /</p>
<p>cancelled status). <code>message_element</code> becomes <code>data-element</code>, never <code>image</code>, because</p>
<p>assistant-ui drops non-https/blob/data image URLs. Cancel aborts locally, then calls</p>
<p><code>transport.cancel</code> (SSE <code>POST /cancel</code>, WS <code>chat_abort{run_id}</code>).</p>
<h3>Window and server contracts</h3>
<li><code>window.__AIUI_BUILD__</code> carries the cache-bust string; the legacy runtime uses it for view</li>
<p>imports instead of <code>Date.now()</code>.</p>
<li><code>dashboard.js</code> exports <code>initHostRuntime({ navigate, palette: false, approvalUi: 'event-only' })</code></li>
<p>and <code>mountView</code>. <code>selectPage</code> delegates to the host navigator only when one is set.</p>
<li>Window events are unchanged (<code>aiui:page-change</code>, <code>aiui:session-select</code>,</li>
<p><code>aiui:prefill-composer</code>, <code>aiui:approval-required</code>); new: <code>aiui:view-registered</code>,</p>
<p><code>aiui:locationchange</code>.</p>
<h3>Python plugin contract</h3>
<p><code>AiuiPlugin</code>: <code>name</code>, <code>version?</code>, <code>sdk = 1</code>, and optional <code>pages()</code>, <code>blocks()</code>,</p>
<p><code>tool_renderers()</code>, <code>routes()</code> (mounted at <code>/api/plugins/&lt;name&gt;</code>), <code>static_dir()</code> (served at</p>
<p><code>/_plugins/&lt;name&gt;/</code> with sha384 SRI), <code>features()</code>, <code>cli_commands()</code>, <code>setup(ctx)</code>.</p>
<p>YAML <code>extensions: {enabled: [...], disabled: [...]}</code> (a bare list means enabled; disabled</p>
<p>wins and is never imported). <code>AIUI_DISABLE_PLUGIN_AUTOLOAD=1</code> skips the group. SDK major</p>
<p>mismatch gives status <code>incompatible</code>. Merge precedence: app <code>register_page</code>, built-in,</p>
<p>entry-point plugin, dashboard-plugin folder; a shadowed page logs a warning.</p>
<p><strong>Trust model:</strong> <code>pip install</code> means trust. Plugins run in-process and their JS runs</p>
<p>same-origin, unsandboxed. The <code>iframe</code> kind is the sandboxed option.</p>
<h3>Theme layers</h3>
<p>| Layer | Contents |</p>
<p>|---|---|</p>
<p>| L0 seeds | <code>--seed-accent</code>, <code>--seed-tint</code>, <code>--tint-mix</code>, <code>--accent-mix</code>, mode seeds (ink, paper, sunken, raised), semantic colours, <code>--radius</code>, <code>--density</code>, <code>--font-size-base</code> |</p>
<p>| L1 tiers | <code>--ui-bg-*</code>, <code>--ui-fill-1..4</code>, <code>--ui-stroke-1..4</code>, <code>--ui-text-1..4</code>, all <code>color-mix(in oklab, ...)</code> |</p>
<p>| L2 shadcn vars | Full colours, plus automatic-contrast <code>--primary-foreground</code> under <code>@supports</code> |</p>
<p>| L3 legacy bridge | <code>legacy/bridge.css</code>, 28 <code>--db-*</code> aliases mapped onto L2, only under the app shell |</p>
<p>Neutral presets set <code>--accent-mix: 0%</code>; colour presets seed from <code>PRESET_COLORS</code>.</p>
<p><code>get_theme_css</code> is kept for API back-compat.</p>
<h2>Compatibility</h2>
<p>| Existing API | <code>dashboard</code> (default) | <code>app</code> (opt-in) |</p>
<p>|---|---|---|</p>
<p>| <code>register_page</code> with handler / <code>@aiui.page</code> | unchanged | <code>kind=blocks</code> → BlockPage |</p>
<p>| <code>register_page</code> without handler | unchanged | <code>kind=legacy</code> → custom.js <code>registerView</code> via LegacyViewHost |</p>
<p>| <code>register_page_action</code> | unchanged | <code>actionEndpoint</code> in the manifest |</p>
<p>| <code>set_pages</code>, config <code>pages.enabled/disabled</code> | unchanged | applied to the manifest |</p>
<p>| <code>set_custom_js</code> / <code>set_custom_css</code> | unchanged | still injected; HSL triples in custom CSS warn |</p>
<p>| <code>set_theme</code>, <code>set_brand_color</code>, <code>register_theme</code> | unchanged | converted to seeds |</p>
<p>| dashboard-plugins (kanban, sample-board, video-studio) | unchanged | legacy kind via the runtime |</p>
<p>| docs / chat / agents / playground / custom styles | same App, lazy-loaded, Streamdown, new tokens | n/a |</p>
<p><strong>Breaking:</strong> an HSL triple such as <code>--primary: 221 83% 53%</code> in user CSS is no longer a</p>
<p>valid shadcn variable value (noted in the changelog).</p>
<h2>Quality gates</h2>
<li><code>npx tsc -b &amp;&amp; npm test &amp;&amp; npm run build</code>, eslint on the new frontend directories.</li>
<li><code>npm run size</code> (gzip) budgets: shell boot ≤ 150 KB, chat route ≤ 140 KB, <code>/chat</code> first</li>
<p>screen ≤ 250 KB, Streamdown ≤ 145 KB, shikiPlugin ≤ 55 KB, legacy App path ≤ 250 KB,</p>
<p><code>index.css</code> ≤ 32 KB.</p>
<li><code>check-entry-closure</code>: streamdown, shiki, mermaid, katex and <code>@assistant-ui</code> must not be in</li>
<p>the static closure of <code>index.js</code> or the shell mount chunk.</p>
<li><code>check-bundle-sync</code>: rebuild and diff against <code>templates/frontend/</code>; runs on PRs that touch</li>
<p><code>src/frontend/**</code>.</p>
<li>Playwright: app-shell page sweep with leak deltas, chat over SSE and WS against a mock</li>
<p>provider, markdown in light/dark/390px, legacy dashboard parity against v0.3.153</p>
<p>(screenshot comparison non-blocking until Linux baselines exist).</p>
<li><code>ruff check</code> and <code>pytest tests/unit tests/integration</code>.</li>
<h2>Rollout and flip criteria</h2>
<p>| Phase | Content | Status |</p>
<p>|---|---|---|</p>
<p>| P0 | <code>app</code> opt-in: React chat, legacy host for every other page, tokens, Streamdown, plugin registry, SDK, gates | Shipped (0.3.154 / 0.3.155) |</p>
<p>| P1 | Chat parity backlog, light-mode review, native ports (overview, usage, logs, sessions, agents, config, memory, knowledge, skills), split <code>dashboard.js</code> | Planned |</p>
<p>| P2 | Flip: default <code>_style or "app"</code>; <code>AIUI_SHELL=legacy</code> is the kill switch | Planned |</p>
<p>| P3 | Delete dashboard-shell code; Config v2; Astryx at 1.0 | Planned |</p>
<p><strong>Make <code>style: app</code> the default only when all of these hold:</strong></p>
<p>1. Every <code>/api/pages</code> id renders in the app shell with status ready, 0 page errors and 0 leak</p>
<p>delta (WebSockets, EventSources, intervals, window listeners, body children) in the</p>
<p>Playwright sweep.</p>
<p>2. Chat parity is complete. Still required: message queue, channel messages with unread</p>
<p>dots, context ring and compaction banner, cost chip, memory panel, floating and focus</p>
<p>modes.</p>
<p>3. Light mode is correct on every page, and the owner signs off the light and dark</p>
<p>snapshot set.</p>
<p>4. All gates are green: size budgets, bundle-sync, entry-closure, snapshots, pytest, tsc.</p>
<p>5. <code>set_custom_js</code>, custom.js <code>registerView</code> and the three bundled dashboard-plugins work</p>
<p>under <code>app</code>.</p>
<p>6. One minor release has shipped with <code>app</code> opt-in, plus two weeks with no open P1 from</p>
<p>opt-in users.</p>
<h2>Rejected alternatives</h2>
<p>| Alternative | Why not |</p>
<p>|---|---|</p>
<p>| Separate <code>/_shell</code> Vite build | Two bundles, two Reacts, harder sync; one build with hashed chunks gives the same caching |</p>
<p>| <code>@streamdown/code</code> | Statically imports all of Shiki (440 files, 15.2 MB, wasm) |</p>
<p>| <code>@assistant-ui/react-streamdown</code> | Redundant with our Markdown; type mismatch |</p>
<p>| Vendoring the AI Elements registry | Needs shims and patches, fights the Thread viewport over scroll, ~360 KB gzip; deferred |</p>
<p>| <code>shadcn add -o</code> full refresh | Major bumps (recharts 3, react-day-picker 10) and snapshot churn |</p>
<p>| <code>cn</code> package | +12 KB gzip next to tailwind-merge |</p>
<p>| Stubbing rehype-raw globally | Docs admonitions and tabs need raw HTML |</p>
<p>| <code>use-stick-to-bottom</code> in the Thread | Two scroll owners would fight |</p>
<p>| Legacy views in iframes | Loses the shared runtime, events and auth fetch |</p>
<p>| Big-bang React port of 26k lines | Strangler instead |</p>
<p>| Flipping the default in P0 | Flip criteria not met |</p>
<p>| Astryx now | Deferred to its 1.0 |</p>
<h2>Consequences</h2>
<li>Users see no change unless they opt in; <code>dashboard</code> output is byte-identical (golden</li>
<p>HTML test).</p>
<li>New pages and plugins target one SDK and one manifest; built-in pages and features are</li>
<p>first-party plugin records in <code>praisonaiui/builtin</code> and can be disabled through</p>
<p><code>extensions.disabled</code>.</p>
<li>Two UIs coexist until P3, so <code>dashboard.js</code> changes must keep both the standalone</li>
<p>dashboard and <code>mountView</code> working.</p>
<li>Hashed chunks plus a committed bundle mean every frontend change must be rebuilt and</li>
<p>synced; CI's bundle-sync check enforces it.</p>
<li>Bundle headroom is thin (markdown chunk and chat route near their budgets); new</li>
<p>dependencies in those paths need a budget review.</p>
<li>Known modularity debt (shell page knowledge, <code>server.py</code> size, registration paths) is</li>
<p>tracked in <code>docs/reports/ui-reset-2026-11.md</code>.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/adr/react-app-shell-and-plugin-sdk.source.md", "text": "---\nnav_title: 0002 App shell and plugin SDK\n---\n\n# ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler\n\n- **Status:** Accepted (Nov 2026)\n- **Date:** 2026-11-12 (decision), shipped in v0.3.154 / v0.3.155\n- **Base:** v0.3.153\n- **Scope:** `src/frontend/src/{main.tsx,shell,legacy,chat-engine,markdown,sdk,blocks,builtin,styles}`,\n  `src/praisonaiui/{server.py,plugin_registry.py,builtin,themes.py}`, `features/chat.py`\n- **Related:** `ARCHITECTURE.md` (code map), `docs/features/react-shell.md`, `docs/features/plugins.md`,\n  `docs/reports/ui-reset-2026-11.md` (project record)\n\n## Context\n\n- The default style was the vanilla-JS `dashboard`: about 26k lines in\n  `templates/frontend/plugins` (`dashboard.js` alone 3,560 lines, plus 41 `views/*.js`). For\n  this style the React app rendered nothing and the server skipped the React script.\n- The React styles (chat, agents, playground, docs, custom) shipped one monolithic entry of\n  437 KB gzip, over the 250 KB first-screen budget, mostly from eagerly loaded\n  react-markdown, react-syntax-highlighter and mermaid.\n- Theming was split three ways: React `hsl(var(--x))` triples, dashboard `--db-*` hex\n  tables, and about twelve feature plugins with hard-coded dark hex.\n- Vite emitted unhashed chunk names, and CI never checked that the committed bundle\n  matched a fresh build.\n- Five spikes (all \"works with caveats\") de-risked the plan:\n  1. **chat-runtime**: assistant-ui ExternalStoreRuntime runs over our SSE and WS protocol unchanged.\n  2. **markdown**: Streamdown replaces react-markdown, the highlighter and mermaid code; entry 437 KB → 166 KB gzip.\n  3. **legacy-host**: a React shell mounted 41 of 41 legacy pages with 0 page errors; first screen ~130 KB gzip.\n  4. **design-system**: radix-ui migration plus a seed / color-mix `theme.css`.\n  5. **python-plugins**: entry-point registry, shell manifest and import-map externals.\n\n## Decision\n\n1. **One React shell**, selected by a new style `app`. Opt-in: `style: app`,\n   `set_style(\"app\")`, or `AIUI_SHELL=app` (alias `react`). `AIUI_SHELL=legacy` maps `app`\n   back to `dashboard` and is the kill switch after the flip. The `dashboard` style stays\n   byte-for-byte the same and stays the default.\n2. **One Vite build.** The entry stays `assets/index.js` (cache-busted with `?v=`); chunks\n   become `assets/[name]-[hash].js` (also needed because Shiki's `markdown.js` and our\n   `Markdown.js` collide on case-insensitive filesystems). `main.tsx` is ~1 KB: with\n   `\u003chtml data-aiui-shell=\"react\"\u003e` it lazy-imports `shell/mount`, otherwise\n   `legacy-app-entry` (the previous App, unchanged).\n3. **Strangler host.** The shell owns `#root`, sidebar, header and routing. Page resolution:\n   1. SDK registry (ported React pages and plugin pages)\n   2. `kind=blocks`, rendered by BlockPage\n   3. `LegacyViewHost`, which calls `dashboard.js` `mountView()` (imported as a runtime only;\n      `buildDashboard()` never runs)\n\n   Nothing users have today disappears.\n4. **Chat.** `@assistant-ui/react` ExternalStoreRuntime behind `useAiuiRuntime` (the only\n   file that touches the assistant-ui runtime API). Thread built from assistant-ui primitives\n   in the AI Elements visual idiom. WebSocket `/api/chat/ws` is canonical; SSE `/run` is the\n   fallback.\n5. **Markdown.** One `\u003cMarkdown variant=\"chat\"|\"docs\"\u003e` on Streamdown, always behind\n   `React.lazy`, with a curated Shiki plugin (shiki/core, JS regex engine, 28 languages),\n   lazy Mermaid and KaTeX. MkDocs admonitions and tabs are preprocessed into `\u003caiui-*\u003e` tags\n   allowed by an extended rehype-sanitize schema. `rehype-sanitize` stays in every rehype\n   list; never use `allowedTags` (it corrupts code blocks).\n6. **Tokens.** One `styles/theme.css`: seeds → color-mix tiers → shadcn vars as full colours\n   (`var(--x)`, not `hsl(var(--x))`). The `--db-*` bridge lives in `legacy/bridge.css`,\n   scoped to `html[data-aiui-shell='react']`. Python emits seeds only\n   (`themes.get_seed_theme_css`).\n7. **Plugins.** Python entry-point group `praisonaiui.plugins` (`plugin_registry.py`,\n   `SDK_API_VERSION = 1`), YAML `extensions:`, `GET /api/shell/manifest`. Browser\n   `window.__AIUI_SDK__` with React shared through an import map to `/_aiui/externals/*.js`.\n   A thin block registry renders `{type, props, children}` for `kind=blocks` pages.\n8. **Design system.** `shadcn migrate radix` (unified `radix-ui`), adding only the components\n   used. No `shadcn add -o` refresh. `next-themes` with `storageKey=\"aiui-theme-preference\"`,\n   matching the server's theme bootstrap. Rules live in `src/frontend/DESIGN.md`.\n\n### Resolved product questions\n\n| Question | Decision |\n|---|---|\n| Links in chat markdown | Real `\u003ca\u003e`; external links get `target=_blank rel=\"noopener noreferrer nofollow\"` |\n| Images in chat markdown | Auto-load only same-origin, `data:image/`, `blob:`; others are click-to-load placeholders showing the host (exfiltration guard) |\n| Shiki languages | Curated 28; others render as plain code |\n| Docs path preloading Streamdown over budget | Accepted, documented exception |\n| Legacy hex token pass | New `--db-p-*` namespace with the original hex as fallback, so the dashboard is pixel-identical |\n| Transport | WS canonical; on SSE the ask UI disables input and says a live connection is needed |\n| Plugin JS surfaces | Default-deny when auth is required or the host is not loopback |\n| Unused markdown deps | Removed once no imports remain |\n| `dashboard.shell` alias | Not added; only `style: app` and `AIUI_SHELL` |\n\n## Frozen contracts\n\nThese were frozen before parallel work started. Changing them is a breaking change for\nplugins and needs a new ADR or an SDK version bump.\n\n### Shell manifest (`sdk/manifest.ts`, mirrors the server's `_build_shell_manifest()`)\n\n```ts\ninterface ShellPage { id: string; title: string;\n  kind: 'native' | 'react' | 'blocks' | 'legacy' | 'iframe';\n  icon?; group?; order?; description?; apiEndpoint?; actionEndpoint?;\n  module?; css?; integrity?; layout?; source? }\ninterface ShellManifest { sdk: number; version: string; style: string; site;\n  layout: { sidebar?; pageHeader? }; pages: ShellPage[];\n  blocks: {type, module, integrity?, source}[];\n  toolRenderers: {toolName, module, integrity?, source}[];\n  plugins: {name, version?, status: 'ok'|'error'|'disabled'|'incompatible', error?}[];\n  legacy: { customJs: string | null; viewsBase: string } }\nreadBootManifest()   // inline #aiui-boot JSON\nfetchManifest()      // GET /api/shell/manifest\n```\n\n### Registry (`sdk/registry.ts`)\n\n`registerPage(id, component | lazy)`, `registerBlock(type, component)`,\n`registerToolRenderer(toolName, component)`, `registerSlot(slot, component)`, the matching\ngetters, `subscribe(fn)` and `useRegistryVersion()`. The exported name list is\n`SDK_EXPORTS`; `/_aiui/externals/sdk.js` must export exactly these names. Shell services\n(`navigate`, `notify`, `fetchJson`, `useManifest`, `registerCommand`, `onActivate`) were added\nadditively later.\n\n### Module entry points\n\n| Module | Export |\n|---|---|\n| `legacy/runtime.ts` | `ensureLegacyRuntime()`, `preloadLegacyRuntime()`, `setLegacyNavigator(fn)` |\n| `legacy/LegacyViewHost.tsx` | `LegacyViewHost({ pageId, page? })` |\n| `markdown/LazyMarkdown.tsx` | `Markdown({ children, variant?, streaming?, className?, components? })`, `preloadMarkdown` |\n| `chat-engine/ChatPage.tsx` | default `ChatPage({ page })` |\n| `shell/mount.tsx` | `mountShell(el)` |\n| `sdk/install.ts` | `installSdk()`, `loadManifestPlugins(manifest)` |\n| `blocks/BlockPage.tsx` | default `BlockPage({ page })` |\n\n### Chat hook and transport\n\n```ts\nuseAiuiRuntime({ sessionId, onSessionCreated?, transport?, agentName?, starters?, historyUrl?,\n  sessions?, onSelectSession?, onRenameSession?, onDeleteSession? })\n  =\u003e { runtime, thread, sessionId, transport }\ninterface AiuiTransport { kind: 'sse' | 'ws';\n  send({ sessionId, text, agentName?, attachmentIds?, signal, onEvent }): Promise\u003cvoid\u003e;\n  cancel(sid, runId?): Promise\u003cvoid\u003e; respondAsk(sid, runId, text): Promise\u003cvoid\u003e; status? }\n```\n\nWire events map to assistant-ui parts in the chat-engine reducer (text, reasoning,\ntool-call upsert by `tool_call_id`, `data-element`, `data-a2ui`, `data-references`,\n`data-memory`, approvals and ask as tool-calls with an approval, finalize / error /\ncancelled status). `message_element` becomes `data-element`, never `image`, because\nassistant-ui drops non-https/blob/data image URLs. Cancel aborts locally, then calls\n`transport.cancel` (SSE `POST /cancel`, WS `chat_abort{run_id}`).\n\n### Window and server contracts\n\n- `window.__AIUI_BUILD__` carries the cache-bust string; the legacy runtime uses it for view\n  imports instead of `Date.now()`.\n- `dashboard.js` exports `initHostRuntime({ navigate, palette: false, approvalUi: 'event-only' })`\n  and `mountView`. `selectPage` delegates to the host navigator only when one is set.\n- Window events are unchanged (`aiui:page-change`, `aiui:session-select`,\n  `aiui:prefill-composer`, `aiui:approval-required`); new: `aiui:view-registered`,\n  `aiui:locationchange`.\n\n### Python plugin contract\n\n```toml\n[project.entry-points.\"praisonaiui.plugins\"]\nname = \"pkg:plugin\"        # instance, class or zero-arg factory\n```\n\n`AiuiPlugin`: `name`, `version?`, `sdk = 1`, and optional `pages()`, `blocks()`,\n`tool_renderers()`, `routes()` (mounted at `/api/plugins/\u003cname\u003e`), `static_dir()` (served at\n`/_plugins/\u003cname\u003e/` with sha384 SRI), `features()`, `cli_commands()`, `setup(ctx)`.\nYAML `extensions: {enabled: [...], disabled: [...]}` (a bare list means enabled; disabled\nwins and is never imported). `AIUI_DISABLE_PLUGIN_AUTOLOAD=1` skips the group. SDK major\nmismatch gives status `incompatible`. Merge precedence: app `register_page`, built-in,\nentry-point plugin, dashboard-plugin folder; a shadowed page logs a warning.\n\n**Trust model:** `pip install` means trust. Plugins run in-process and their JS runs\nsame-origin, unsandboxed. The `iframe` kind is the sandboxed option.\n\n### Theme layers\n\n| Layer | Contents |\n|---|---|\n| L0 seeds | `--seed-accent`, `--seed-tint`, `--tint-mix`, `--accent-mix`, mode seeds (ink, paper, sunken, raised), semantic colours, `--radius`, `--density`, `--font-size-base` |\n| L1 tiers | `--ui-bg-*`, `--ui-fill-1..4`, `--ui-stroke-1..4`, `--ui-text-1..4`, all `color-mix(in oklab, ...)` |\n| L2 shadcn vars | Full colours, plus automatic-contrast `--primary-foreground` under `@supports` |\n| L3 legacy bridge | `legacy/bridge.css`, 28 `--db-*` aliases mapped onto L2, only under the app shell |\n\nNeutral presets set `--accent-mix: 0%`; colour presets seed from `PRESET_COLORS`.\n`get_theme_css` is kept for API back-compat.\n\n## Compatibility\n\n| Existing API | `dashboard` (default) | `app` (opt-in) |\n|---|---|---|\n| `register_page` with handler / `@aiui.page` | unchanged | `kind=blocks` → BlockPage |\n| `register_page` without handler | unchanged | `kind=legacy` → custom.js `registerView` via LegacyViewHost |\n| `register_page_action` | unchanged | `actionEndpoint` in the manifest |\n| `set_pages`, config `pages.enabled/disabled` | unchanged | applied to the manifest |\n| `set_custom_js` / `set_custom_css` | unchanged | still injected; HSL triples in custom CSS warn |\n| `set_theme`, `set_brand_color`, `register_theme` | unchanged | converted to seeds |\n| dashboard-plugins (kanban, sample-board, video-studio) | unchanged | legacy kind via the runtime |\n| docs / chat / agents / playground / custom styles | same App, lazy-loaded, Streamdown, new tokens | n/a |\n\n**Breaking:** an HSL triple such as `--primary: 221 83% 53%` in user CSS is no longer a\nvalid shadcn variable value (noted in the changelog).\n\n## Quality gates\n\n- `npx tsc -b \u0026\u0026 npm test \u0026\u0026 npm run build`, eslint on the new frontend directories.\n- `npm run size` (gzip) budgets: shell boot ≤ 150 KB, chat route ≤ 140 KB, `/chat` first\n  screen ≤ 250 KB, Streamdown ≤ 145 KB, shikiPlugin ≤ 55 KB, legacy App path ≤ 250 KB,\n  `index.css` ≤ 32 KB.\n- `check-entry-closure`: streamdown, shiki, mermaid, katex and `@assistant-ui` must not be in\n  the static closure of `index.js` or the shell mount chunk.\n- `check-bundle-sync`: rebuild and diff against `templates/frontend/`; runs on PRs that touch\n  `src/frontend/**`.\n- Playwright: app-shell page sweep with leak deltas, chat over SSE and WS against a mock\n  provider, markdown in light/dark/390px, legacy dashboard parity against v0.3.153\n  (screenshot comparison non-blocking until Linux baselines exist).\n- `ruff check` and `pytest tests/unit tests/integration`.\n\n## Rollout and flip criteria\n\n| Phase | Content | Status |\n|---|---|---|\n| P0 | `app` opt-in: React chat, legacy host for every other page, tokens, Streamdown, plugin registry, SDK, gates | Shipped (0.3.154 / 0.3.155) |\n| P1 | Chat parity backlog, light-mode review, native ports (overview, usage, logs, sessions, agents, config, memory, knowledge, skills), split `dashboard.js` | Planned |\n| P2 | Flip: default `_style or \"app\"`; `AIUI_SHELL=legacy` is the kill switch | Planned |\n| P3 | Delete dashboard-shell code; Config v2; Astryx at 1.0 | Planned |\n\n**Make `style: app` the default only when all of these hold:**\n\n1. Every `/api/pages` id renders in the app shell with status ready, 0 page errors and 0 leak\n   delta (WebSockets, EventSources, intervals, window listeners, body children) in the\n   Playwright sweep.\n2. Chat parity is complete. Still required: message queue, channel messages with unread\n   dots, context ring and compaction banner, cost chip, memory panel, floating and focus\n   modes.\n3. Light mode is correct on every page, and the owner signs off the light and dark\n   snapshot set.\n4. All gates are green: size budgets, bundle-sync, entry-closure, snapshots, pytest, tsc.\n5. `set_custom_js`, custom.js `registerView` and the three bundled dashboard-plugins work\n   under `app`.\n6. One minor release has shipped with `app` opt-in, plus two weeks with no open P1 from\n   opt-in users.\n\n## Rejected alternatives\n\n| Alternative | Why not |\n|---|---|\n| Separate `/_shell` Vite build | Two bundles, two Reacts, harder sync; one build with hashed chunks gives the same caching |\n| `@streamdown/code` | Statically imports all of Shiki (440 files, 15.2 MB, wasm) |\n| `@assistant-ui/react-streamdown` | Redundant with our Markdown; type mismatch |\n| Vendoring the AI Elements registry | Needs shims and patches, fights the Thread viewport over scroll, ~360 KB gzip; deferred |\n| `shadcn add -o` full refresh | Major bumps (recharts 3, react-day-picker 10) and snapshot churn |\n| `cn` package | +12 KB gzip next to tailwind-merge |\n| Stubbing rehype-raw globally | Docs admonitions and tabs need raw HTML |\n| `use-stick-to-bottom` in the Thread | Two scroll owners would fight |\n| Legacy views in iframes | Loses the shared runtime, events and auth fetch |\n| Big-bang React port of 26k lines | Strangler instead |\n| Flipping the default in P0 | Flip criteria not met |\n| Astryx now | Deferred to its 1.0 |\n\n## Consequences\n\n- Users see no change unless they opt in; `dashboard` output is byte-identical (golden\n  HTML test).\n- New pages and plugins target one SDK and one manifest; built-in pages and features are\n  first-party plugin records in `praisonaiui/builtin` and can be disabled through\n  `extensions.disabled`.\n- Two UIs coexist until P3, so `dashboard.js` changes must keep both the standalone\n  dashboard and `mountView` working.\n- Hashed chunks plus a committed bundle mean every frontend change must be rebuilt and\n  synced; CI's bundle-sync check enforces it.\n- Bundle headroom is thin (markdown chunk and chat route near their budgets); new\n  dependencies in those paths need a budget review.\n- Known modularity debt (shell page knowledge, `server.py` size, registration paths) is\n  tracked in `docs/reports/ui-reset-2026-11.md`.\n"}</script>
