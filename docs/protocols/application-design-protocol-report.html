></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Application Design Protocol (ADP) — Research Report</h1>
<p><strong>Version:</strong> 1.0 (draft)</p>
<p><strong>Date:</strong> August 2026</p>
<p><strong>Scope:</strong> UI, layout, navigation, theming — declarative application design from text manifests</p>
<p><strong>Status:</strong> Research and recommendation; not yet a published standard</p>
<p>---</p>
<h2>1. Executive summary</h2>
<p>There is no single existing standard for <strong>designing full application UI from a declarative text file</strong>. Instead, the problem is addressed in fragments:</p>
<li><strong>Docs-site generators</strong> (commercial docs platforms, PraisonAIUI, Hugo) declare navigation and layout in config files.</li>
<li><strong>Form libraries</strong> (JSON Forms, RJSF) declare layout trees from JSON Schema.</li>
<li><strong>Agent UI protocols</strong> (A2UI, AG-UI) declare streaming component surfaces for LLM-generated UI.</li>
<li><strong>Catalog standards</strong> (OpenUI, Backstage) declare component metadata without runtime layout.</li>
<li><strong>Design token standards</strong> (DTCG 2025.10) declare theming without structure.</li>
<p><strong>Recommendation:</strong> Define an <strong>Application Design Protocol (ADP)</strong> that synthesises proven patterns from 45 surveyed standards into a UI-only manifest format.</p>
<p>PraisonAIUI already implements approximately 60% of this model. ADP formalises, extends, and publishes what exists today.</p>
<p>---</p>
<h2>2. Problem statement</h2>
<h3>2.1 What we need</h3>
<p>A protocol that lets a developer (or LLM) describe an application's visual design — pages, navigation, components, themes, routes — in <strong>one or more text files</strong>, without writing application code.</p>
<h3>2.2 What exists today (fragmented)</h3>
<p>| Need | Who solves it | Gap |</p>
<p>|------|---------------|-----|</p>
<p>| Docs site from config | Commercial docs platforms, PraisonAIUI, Docusaurus | No shared spec; some use JSON, others YAML or JS |</p>
<p>| Component catalog | OpenUI, A2UI | No layout or routing |</p>
<p>| Layout trees | JSON Forms uiSchema | Forms only, not app shells |</p>
<p>| Theming | DTCG, Material 3 | Tokens only, no pages |</p>
<p>| Agent-generated UI | A2UI | Runtime streaming, not human-authored static sites |</p>
<p>| Software metadata | Backstage | Catalog entities, not UI composition |</p>
<h3>2.3 Design goals for ADP</h3>
<p>1. <strong>Human-readable</strong> — editable without IDE plugins</p>
<p>2. <strong>LLM-safe</strong> — structural schema rejects unknown fields</p>
<p>3. <strong>Portable</strong> — same manifest renders on any ADP-compliant runtime</p>
<p>4. <strong>Validatable</strong> — fail fast at build time, not in the browser</p>
<p>5. <strong>Extensible</strong> — plugins add catalog entries, not inline code</p>
<p>6. <strong>Accessible</strong> — ARIA hints required in component catalog</p>
<p>---</p>
<h2>3. Standards landscape — 45 protocols in 10 categories</h2>
<p>Each entry describes <strong>how UI/layout/navigation is declared</strong> — the primary comparison dimension.</p>
<h3>Category A: Web platform baseline (5)</h3>
<p>| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |</p>
<p>|----------|--------|--------------------------------------|--------|------------|</p>
<p>| <strong>HTML + CSS</strong> | <code>.html</code> + <code>.css</code> | Semantic elements; CSS Flexbox/Grid; <code>&lt;nav&gt;</code> + links | Living spec grammar | Browser Baseline |</p>
<p>| <strong>Web Components + DSD</strong> | HTML + JS | Custom element tree; slots; Declarative Shadow DOM | DOM IDL | Platform flags |</p>
<p>| <strong>WAI-ARIA + APG</strong> | HTML attributes | Landmarks, widget roles, keyboard patterns | WAI-ARIA 1.2 | Rec track |</p>
<p>| <strong>DTCG Design Tokens</strong> | JSON | Token groups: <code>$value</code>, <code>$type</code>, <code>{alias}</code> refs — <strong>no layout</strong> | DTCG 2025.10 | Date editions |</p>
<p>| <strong>OpenUI</strong> | YAML/JSON | Component catalog: <code>components{id: props}</code> — <strong>no layout tree</strong> | Prop definitions | Per-library version |</p>
<h3>Category B: Schema-driven forms and layout (3)</h3>
<p>| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |</p>
<p>|----------|--------|--------------------------------------|--------|------------|</p>
<p>| <strong>JSON Forms</strong> | JSON Schema + UI Schema | <code>VerticalLayout</code>, <code>Control</code>, <code>Categorization</code> with <code>scope</code> pointers | JSON Schema + uiSchema | Package SemVer |</p>
<p>| <strong>RJSF</strong> | JSON Schema + uiSchema | Schema-tree mirroring; <code>ui:widget</code>, <code>ui:options</code> | React convention | Package SemVer |</p>
<p>| <strong>Google A2UI</strong> | JSONL stream | Flat adjacency-list; <code>createSurface</code>; catalog-constrained types | JSON Schema catalog | v0.9.1 / v1.0 RC |</p>
<h3>Category C: Docs-site generators (5)</h3>
<p>| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |</p>
<p>|----------|--------|--------------------------------------|--------|------------|</p>
<p>| <strong>PraisonAIUI</strong> | YAML | <code>components</code> → <code>templates{layout, slots, zones}</code> → <code>routes</code> | Pydantic (internal) | <code>schemaVersion: 1</code> |</p>
<p>| <strong>Docusaurus</strong> | JS config | <code>themeConfig.navbar</code>, plugin sidebar config | TypeScript types | Package SemVer |</p>
<p>| <strong>Hugo</strong> | TOML/YAML | <code>menu.main[]</code>, theme selection | Hugo schema | Release train |</p>
<p>| <strong>Jekyll</strong> | YAML | Frontmatter per page; <code>_data/</code> nav | Conventions | SemVer |</p>
<p>| <strong>Gatsby</strong> | JS/TS | <code>siteMetadata</code> + <code>plugins[]</code> | JS object | Major versions |</p>
<h3>Category D: Native declarative UI — reference only (5)</h3>
<p>| Standard | Format | Serialised wire format? | Navigation model |</p>
<p>|----------|--------|-------------------------|------------------|</p>
<p>| <strong>Jetpack Compose</strong> | Kotlin | No | <code>NavHost</code> + routes |</p>
<p>| <strong>SwiftUI</strong> | Swift | No | <code>NavigationStack</code> |</p>
<p>| <strong>Flutter</strong> | Dart | No | <code>Router</code> / <code>Navigator</code> |</p>
<p>| <strong>Qt QML</strong> | <code>.qml</code> | Yes | <code>StackView</code>, bindings |</p>
<p>| <strong>XAML</strong> | XML | Yes (dialect-fragmented) | <code>Frame</code>, <code>NavigationView</code> |</p>
<h3>Category E: Design systems (2)</h3>
<p>| Standard | Format | Theming model |</p>
<p>|----------|--------|---------------|</p>
<p>| <strong>Material Design 3</strong> | DTCG JSON | reference → system → component token tiers |</p>
<p>| <strong>Bootstrap 5.3</strong> | SCSS → CSS vars | Sass maps → <code>--bs-*</code> custom properties |</p>
<h3>Category F: Design-to-code bridges — not source-of-truth (3)</h3>
<p>| Standard | Output | Why not ADP source |</p>
<p>|----------|--------|-------------------|</p>
<p>| <strong>Figma MCP</strong> | React+Tailwind context | Proprietary; bridge only |</p>
<p>| <strong>Webflow export</strong> | HTML/CSS/JS ZIP | No schema; paid export |</p>
<p>| <strong>Framer export</strong> | React bundles | Platform lock-in |</p>
<h3>Category G: Component documentation (1)</h3>
<p>| Standard | Format | Navigation |</p>
<p>|----------|--------|------------|</p>
<p>| <strong>Storybook CSF 3</strong> | TS modules | Sidebar via <code>title</code> path hierarchy |</p>
<h3>Category H: Configuration and packaging (12)</h3>
<p>| Standard | Format | Composition mechanism | ADP borrow |</p>
<p>|----------|--------|----------------------|------------|</p>
<p>| <strong>Kubernetes CRD</strong> | YAML | <code>apiVersion/kind/spec</code>; structural OpenAPI | Structural validation |</p>
<p>| <strong>Helm</strong> | YAML + templates | Subcharts; values merge; <code>values.schema.json</code> | Defaults + overrides |</p>
<p>| <strong>Backstage catalog</strong> | YAML | <code>$yaml:</code>/<code>$json:</code> includes; relation graph | Envelope + includes |</p>
<p>| <strong>OpenAPI 3.1</strong> | YAML/JSON | <code>$ref</code>, <code>components</code> registry | JSON Schema foundation |</p>
<p>| <strong>AsyncAPI 3.x</strong> | YAML/JSON | Channels → messages | Future event UI |</p>
<p>| <strong>JSON Schema 2020-12</strong> | JSON | <code>$ref</code>, <code>$defs</code>, conditionals | Validation dialect |</p>
<p>| <strong>CloudEvents</strong> | JSON envelope | Fixed envelope + opaque payload | Future event wrapper |</p>
<p>| <strong>Docker Compose</strong> | YAML | Multi-file merge; profiles | Override stacking |</p>
<p>| <strong>CUE</strong> | CUE | Unify schema + data | Power-user compile layer |</p>
<p>| <strong>Jsonnet</strong> | Jsonnet → JSON | <code>import</code> + merge | Theme variants |</p>
<p>| <strong>Pkl</strong> | <code>.pkl</code> | <code>amends</code>, mixins | Typed config model |</p>
<p>| <strong>OCI Artifact</strong> | JSON manifest | Multi-layer blobs | Bundle packaging |</p>
<h3>Category I: Agent and workflow protocols (7)</h3>
<p>| Standard | Format | UI/state declaration | ADP borrow |</p>
<p>|----------|--------|---------------------|------------|</p>
<p>| <strong>MCP</strong> | JSON-RPC | Tool schemas — no UI layout | Future widget actions |</p>
<p>| <strong>AG-UI</strong> | Streaming JSON | EventType enum; snapshots + deltas | Streaming model |</p>
<p>| <strong>A2A</strong> | Proto → JSON-RPC | Agent Cards | Transport |</p>
<p>| <strong>AWP</strong> | Multi-file YAML | 7 layers; rules R1–R32 | Layer + validation model |</p>
<p>| <strong>LangGraph</strong> | workflow.yaml | Graph nodes + edges | Layout graph |</p>
<p>| <strong>AutoGen</strong> | ComponentModel JSON | <code>{provider, type, version, config}</code> | Pluggable components |</p>
<p>| <strong>CrewAI</strong> | JSONC/YAML | Agent arrays — weak schema | Anti-pattern |</p>
<h3>Category J: Application packaging (2)</h3>
<p>| Standard | Format | Application declaration |</p>
<p>|----------|--------|------------------------|</p>
<p>| <strong>OAM</strong> | YAML | <code>Application</code> with <code>components[]</code>, <code>traits[]</code> |</p>
<p>| <strong>CNAB</strong> | bundle.json | Parameters, credentials, actions |</p>
<p>---</p>
<h2>4. How they do it — mechanism comparison matrix</h2>
<p>| Mechanism | Standards | How it works | ADP |</p>
<p>|-----------|-----------|--------------|-----|</p>
<p>| <strong>Envelope document</strong> | K8s, Backstage, OAM, AWP | <code>apiVersion</code> + <code>kind</code> + <code>metadata</code> + <code>spec</code> | Adopt |</p>
<p>| <strong>Component registry + ref</strong> | PraisonAIUI, OpenUI | Named map; templates use <code>ref:</code> | Adopt |</p>
<p>| <strong>Layout + slots</strong> | PraisonAIUI, JSON Forms | Layout type + named regions | Adopt (unified) |</p>
<p>| <strong>Route → template</strong> | PraisonAIUI, Flutter | URL glob → template | Adopt |</p>
<p>| <strong>Navigation tree</strong> | Docusaurus, Storybook | Hierarchical groups → pages | Adopt |</p>
<p>| <strong>Design token file</strong> | DTCG, Material 3 | Token JSON with aliases | Adopt |</p>
<p>| <strong>Catalog allowlist</strong> | A2UI, OpenUI | Closed component vocabulary | Adopt |</p>
<p>| <strong>Schema + uiSchema split</strong> | JSON Forms, RJSF | Data vs presentation | Partial |</p>
<p>| <strong>Streaming surfaces</strong> | A2UI, AG-UI | Incremental JSON updates | Future |</p>
<p>| <strong>Layered spec</strong> | AWP, Helm | Separate files merged at compile | Adopt |</p>
<p>| <strong>File includes</strong> | Backstage, OpenAPI | <code>$yaml:</code> / <code>$ref</code> external files | Adopt |</p>
<p>| <strong>Structural pruning</strong> | K8s CRD | Reject unknown fields | Adopt |</p>
<p>| <strong>Validation rules R1–Rn</strong> | AWP | Cross-ref beyond JSON Schema | Adopt |</p>
<p>| <strong>JS executable config</strong> | Docusaurus, Gatsby | Code config | Reject |</p>
<p>| <strong>Visual canvas</strong> | Figma, Webflow | Proprietary designer | Reject |</p>
<p>| <strong>Code-only UI</strong> | Compose, SwiftUI | No wire format | Out of scope |</p>
<p>---</p>
<h2>5. Side-by-side: three closest analogues</h2>
<p>| Dimension | PraisonAIUI | A2UI | Backstage |</p>
<p>|-----------|-------------|------|-----------|</p>
<p>| <strong>Authoring format</strong> | YAML | JSON (stream) | YAML |</p>
<p>| <strong>Envelope</strong> | <code>schemaVersion</code> only | Message <code>version</code> | <code>apiVersion/kind/metadata/spec</code> |</p>
<p>| <strong>Navigation</strong> | <code>navigation.tabs[]</code> + filesystem | N/A | N/A (metadata catalog) |</p>
<p>| <strong>Components</strong> | <code>components{id: type, props}</code> | Catalog + adjacency list | Entity kinds |</p>
<p>| <strong>Layout</strong> | <code>templates{layout, slots, zones}</code> | Surfaces | N/A |</p>
<p>| <strong>Routes</strong> | <code>routes{match, template}</code> | N/A | N/A |</p>
<p>| <strong>Schema published</strong> | Pydantic only | JSON Schema catalog | JSON Schema per kind |</p>
<p>| <strong>Runtime</strong> | React SPA | Any renderer | Catalog API |</p>
<p>| <strong>Primary use</strong> | Docs sites | Agent-generated UI | Software inventory |</p>
<p><strong>Synthesis:</strong> ADP combines PraisonAIUI's composition model, the published <code>$schema</code> of commercial docs platforms, A2UI's catalog allowlist, and Backstage's envelope and file includes.</p>
<p>---</p>
<h2>6. YAML vs alternatives — structured debate</h2>
<h3>6.1 The assumption</h3>
<p>YAML is the best authoring format for application design manifests.</p>
<h3>6.2 Counter-evidence</h3>
<p><strong>Commercial docs platforms</strong> — the closest docs-site analogues — use <strong>JSON</strong> config with a published <code>$schema</code> URL for IDE autocomplete. This works well for flat-to-moderately-nested config but becomes verbose for deep layout trees.</p>
<p><strong>A2UI</strong> uses <strong>JSON</strong> as both authoring and wire format because LLMs emit structured JSON reliably and ambiguity is unacceptable at runtime.</p>
<p><strong>Docusaurus and Gatsby</strong> use <strong>JavaScript/TypeScript</strong> config for programmatic power — but this sacrifices portability and LLM generation safety.</p>
<h3>6.3 Format comparison</h3>
<p>| Format | Strengths | Weaknesses for ADP |</p>
<p>|--------|-----------|-------------------|</p>
<p>| <strong>YAML</strong> | Comments; readable nesting; LLM-friendly; PraisonAIUI continuity | Ambiguous typing; merge key footguns; no native DRY |</p>
<p>| <strong>JSON</strong> | Unambiguous; <code>$schema</code> IDE support; proven by commercial docs platforms | No comments; verbose for layout trees |</p>
<p>| <strong>TOML</strong> | Clear flat tables (Hugo) | Poor for nested templates/zones |</p>
<p>| <strong>CUE / Jsonnet / Pkl</strong> | Typed composition without templating | Learning curve; not LLM-default |</p>
<p>| <strong>HCL</strong> | Modules, expressions | Ecosystem-bound; overkill for UI-only |</p>
<p>| <strong>JS/TS</strong> | Full programmatic power | Not portable; not LLM-safe |</p>
<h3>6.4 Recommendation</h3>
<li><strong>Primary authoring:</strong> YAML — best for nested <code>templates</code> / <code>zones</code> trees</li>
<li><strong>Alternate authoring:</strong> JSON — for teams preferring <code>$schema</code> editor tooling</li>
<li><strong>Never at runtime:</strong> YAML — always compile to JSON before serve</li>
<li><strong>Composition:</strong> <code>$yaml:</code> file includes (Backstage), not Helm Go templates</li>
<li><strong>Power users:</strong> Optional CUE/Jsonnet compiles to YAML before validation</li>
<p><strong>Verdict:</strong> YAML remains the recommended default, but ADP MUST accept JSON as an equivalent authoring format with identical semantics.</p>
<p>---</p>
<h2>7. ADP design principles</h2>
<p>1. <strong>Declarative, not executable</strong> — manifests describe intent; runtimes render; no inline code or templating logic in core spec.</p>
<p>2. <strong>Schema-first</strong> — JSON Schema 2020-12 is canonical; YAML is authoring convenience.</p>
<p>3. <strong>Structural strictness</strong> — unknown fields rejected in strict mode (K8s CRD pattern).</p>
<p>4. <strong>Catalog allowlist</strong> — component <code>type</code> must exist in published catalog (A2UI pattern).</p>
<p>5. <strong>Envelope consistency</strong> — every document uses <code>apiVersion</code>, <code>kind</code>, <code>metadata</code>, <code>spec</code>.</p>
<p>6. <strong>Separation of concerns</strong> — theme, navigation, components, templates, routes are distinct spec sections.</p>
<p>7. <strong>Compile, don't interpret</strong> — YAML → validated JSON manifest → static assets at build time.</p>
<p>8. <strong>Accessibility by default</strong> — catalog entries include ARIA role hints (WAI-ARIA pattern).</p>
<p>9. <strong>Versioned protocol</strong> — <code>schemaVersion</code> integer + <code>apiVersion</code> string; breaking changes bump version.</p>
<p>10. <strong>Extension namespace</strong> — <code>x-adp-*</code> prefix reserved; plugins register catalog layers.</p>
<p>11. <strong>File composition</strong> — <code>$yaml:</code> includes for modular configs (Backstage pattern).</p>
<p>12. <strong>Route-driven rendering</strong> — URL resolution selects template; no hardcoded layout in renderer.</p>

<h2>10. Migration path</h2>
<p>Existing <code>aiui.yaml</code> (and <code>aiui.template.yaml</code>) files remain valid. Migration steps:</p>
<p>1. Add <code>apiVersion: adp.io/v1alpha1</code> and <code>kind: Application</code> (optional during transition).</p>
<p>2. Wrap top-level keys under <code>spec:</code> (compiler accepts both shapes during v1alpha1).</p>
<p>3. Rename <code>site</code> fields unchanged; map <code>navigation</code>, <code>templates</code>, <code>routes</code> as-is.</p>
<p>4. Publish catalog; register custom component types via plugin schema layers.</p>
<p>See adp/aiui-mapping.md for field-by-field mapping.</p>

<h2>13. Conclusion</h2>
<p>ADP is feasible and largely prefigured by PraisonAIUI's existing architecture. The research across 45 standards yields a clear synthesis:</p>
<li><strong>Envelope</strong> from Backstage/K8s</li>
<li><strong>Composition</strong> from PraisonAIUI (components → templates → routes)</li>
<li><strong>Catalog</strong> from A2UI/OpenUI</li>
<li><strong>Theming</strong> from DTCG</li>
<li><strong>Validation</strong> from AWP (structural schema + R-rules)</li>
<li><strong>Authoring</strong> in YAML (default) with JSON alternate (published <code>$schema</code> pattern)</li>
<p><strong>Status:</strong> Research draft — see adp/implementation-status.md for implementation gaps.</p>

usaurus | No shared spec; some use JSON, others YAML or JS |\n| Component catalog | OpenUI, A2UI | No layout or routing |\n| Layout trees | JSON Forms uiSchema | Forms only, not app shells |\n| Theming | DTCG, Material 3 | Tokens only, no pages |\n| Agent-generated UI | A2UI | Runtime streaming, not human-authored static sites |\n| Software metadata | Backstage | Catalog entities, not UI composition |\n\n### 2.3 Design goals for ADP\n\n1. **Human-readable** — editable without IDE plugins\n2. **LLM-safe** — structural schema rejects unknown fields\n3. **Portable** — same manifest renders on any ADP-compliant runtime\n4. **Validatable** — fail fast at build time, not in the browser\n5. **Extensible** — plugins add catalog entries, not inline code\n6. **Accessible** — ARIA hints required in component catalog\n\n---\n\n## 3. Standards landscape — 45 protocols in 10 categories\n\nEach entry describes **how UI/layout/navigation is declared** — the primary comparison dimension.\n\n### Category A: Web platform baseline (5)\n\n| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |\n|----------|--------|--------------------------------------|--------|------------|\n| **HTML + CSS** | `.html` + `.css` | Semantic elements; CSS Flexbox/Grid; `\u003cnav\u003e` + links | Living spec grammar | Browser Baseline |\n| **Web Components + DSD** | HTML + JS | Custom element tree; slots; Declarative Shadow DOM | DOM IDL | Platform flags |\n| **WAI-ARIA + APG** | HTML attributes | Landmarks, widget roles, keyboard patterns | WAI-ARIA 1.2 | Rec track |\n| **DTCG Design Tokens** | JSON | Token groups: `$value`, `$type`, `{alias}` refs — **no layout** | DTCG 2025.10 | Date editions |\n| **OpenUI** | YAML/JSON | Component catalog: `components{id: props}` — **no layout tree** | Prop definitions | Per-library version |\n\n### Category B: Schema-driven forms and layout (3)\n\n| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |\n|----------|--------|--------------------------------------|--------|------------|\n| **JSON Forms** | JSON Schema + UI Schema | `VerticalLayout`, `Control`, `Categorization` with `scope` pointers | JSON Schema + uiSchema | Package SemVer |\n| **RJSF** | JSON Schema + uiSchema | Schema-tree mirroring; `ui:widget`, `ui:options` | React convention | Package SemVer |\n| **Google A2UI** | JSONL stream | Flat adjacency-list; `createSurface`; catalog-constrained types | JSON Schema catalog | v0.9.1 / v1.0 RC |\n\n### Category C: Docs-site generators (5)\n\n| Standard | Format | How UI/layout/navigation is declared | Schema | Versioning |\n|----------|--------|--------------------------------------|--------|------------|\n| **PraisonAIUI** | YAML | `components` → `templates{layout, slots, zones}` → `routes` | Pydantic (internal) | `schemaVersion: 1` |\n| **Docusaurus** | JS config | `themeConfig.navbar`, plugin sidebar config | TypeScript types | Package SemVer |\n| **Hugo** | TOML/YAML | `menu.main[]`, theme selection | Hugo schema | Release train |\n| **Jekyll** | YAML | Frontmatter per page; `_data/` nav | Conventions | SemVer |\n| **Gatsby** | JS/TS | `siteMetadata` + `plugins[]` | JS object | Major versions |\n\n### Category D: Native declarative UI — reference only (5)\n\n| Standard | Format | Serialised wire format? | Navigation model |\n|----------|--------|-------------------------|------------------|\n| **Jetpack Compose** | Kotlin | No | `NavHost` + routes |\n| **SwiftUI** | Swift | No | `NavigationStack` |\n| **Flutter** | Dart | No | `Router` / `Navigator` |\n| **Qt QML** | `.qml` | Yes | `StackView`, bindings |\n| **XAML** | XML | Yes (dialect-fragmented) | `Frame`, `NavigationView` |\n\n### Category E: Design systems (2)\n\n| Standard | Format | Theming model |\n|----------|--------|---------------|\n| **Material Design 3** | DTCG JSON | reference → system → component token tiers |\n| **Bootstrap 5.3** | SCSS → CSS vars | Sass maps → `--bs-*` custom properties |\n\n### Category F: Design-to-code bridges — not source-of-truth (3)\n\n| Standard | Output | Why not ADP source |\n|----------|--------|-------------------|\n| **Figma MCP** | React+Tailwind context | Proprietary; bridge only |\n| **Webflow export** | HTML/CSS/JS ZIP | No schema; paid export |\n| **Framer export** | React bundles | Platform lock-in |\n\n### Category G: Component documentation (1)\n\n| Standard | Format | Navigation |\n|----------|--------|------------|\n| **Storybook CSF 3** | TS modules | Sidebar via `title` path hierarchy |\n\n### Category H: Configuration and packaging (12)\n\n| Standard | Format | Composition mechanism | ADP borrow |\n|----------|--------|----------------------|------------|\n| **Kubernetes CRD** | YAML | `apiVersion/kind/spec`; structural OpenAPI | Structural validation |\n| **Helm** | YAML + templates | Subcharts; values merge; `values.schema.json` | Defaults + overrides |\n| **Backstage catalog** | YAML | `$yaml:`/`$json:` includes; relation graph | Envelope + includes |\n| **OpenAPI 3.1** | YAML/JSON | `$ref`, `components` registry | JSON Schema foundation |\n| **AsyncAPI 3.x** | YAML/JSON | Channels → messages | Future event UI |\n| **JSON Schema 2020-12** | JSON | `$ref`, `$defs`, conditionals | Validation dialect |\n| **CloudEvents** | JSON envelope | Fixed envelope + opaque payload | Future event wrapper |\n| **Docker Compose** | YAML | Multi-file merge; profiles | Override stacking |\n| **CUE** | CUE | Unify schema + data | Power-user compile layer |\n| **Jsonnet** | Jsonnet → JSON | `import` + merge | Theme variants |\n| **Pkl** | `.pkl` | `amends`, mixins | Typed config model |\n| **OCI Artifact** | JSON manifest | Multi-layer blobs | Bundle packaging |\n\n### Category I: Agent and workflow protocols (7)\n\n| Standard | Format | UI/state declaration | ADP borrow |\n|----------|--------|---------------------|------------|\n| **MCP** | JSON-RPC | Tool schemas — no UI layout | Future widget actions |\n| **AG-UI** | Streaming JSON | EventType enum; snapshots + deltas | Streaming model |\n| **A2A** | Proto → JSON-RPC | Agent Cards | Transport |\n| **AWP** | Multi-file YAML | 7 layers; rules R1–R32 | Layer + validation model |\n| **LangGraph** | workflow.yaml | Graph nodes + edges | Layout graph |\n| **AutoGen** | ComponentModel JSON | `{provider, type, version, config}` | Pluggable components |\n| **CrewAI** | JSONC/YAML | Agent arrays — weak schema | Anti-pattern |\n\n### Category J: Application packaging (2)\n\n| Standard | Format | Application declaration |\n|----------|--------|------------------------|\n| **OAM** | YAML | `Application` with `components[]`, `traits[]` |\n| **CNAB** | bundle.json | Parameters, credentials, actions |\n\n---\n\n## 4. How they do it — mechanism comparison matrix\n\n| Mechanism | Standards | How it works | ADP |\n|-----------|-----------|--------------|-----|\n| **Envelope document** | K8s, Backstage, OAM, AWP | `apiVersion` + `kind` + `metadata` + `spec` | Adopt |\n| **Component registry + ref** | PraisonAIUI, OpenUI | Named map; templates use `ref:` | Adopt |\n| **Layout + slots** | PraisonAIUI, JSON Forms | Layout type + named regions | Adopt (unified) |\n| **Route → template** | PraisonAIUI, Flutter | URL glob → template | Adopt |\n| **Navigation tree** | Docusaurus, Storybook | Hierarchical groups → pages | Adopt |\n| **Design token file** | DTCG, Material 3 | Token JSON with aliases | Adopt |\n| **Catalog allowlist** | A2UI, OpenUI | Closed component vocabulary | Adopt |\n| **Schema + uiSchema split** | JSON Forms, RJSF | Data vs presentation | Partial |\n| **Streaming surfaces** | A2UI, AG-UI | Incremental JSON updates | Future |\n| **Layered spec** | AWP, Helm | Separate files merged at compile | Adopt |\n| **File includes** | Backstage, OpenAPI | `$yaml:` / `$ref` external files | Adopt |\n| **Structural pruning** | K8s CRD | Reject unknown fields | Adopt |\n| **Validation rules R1–Rn** | AWP | Cross-ref beyond JSON Schema | Adopt |\n| **JS executable config** | Docusaurus, Gatsby | Code config | Reject |\n| **Visual canvas** | Figma, Webflow | Proprietary designer | Reject |\n| **Code-only UI** | Compose, SwiftUI | No wire format | Out of scope |\n\n---\n\n## 5. Side-by-side: three closest analogues\n\n| Dimension | PraisonAIUI | A2UI | Backstage |\n|-----------|-------------|------|-----------|\n| **Authoring format** | YAML | JSON (stream) | YAML |\n| **Envelope** | `schemaVersion` only | Message `version` | `apiVersion/kind/metadata/spec` |\n| **Navigation** | `navigation.tabs[]` + filesystem | N/A | N/A (metadata catalog) |\n| **Components** | `components{id: type, props}` | Catalog + adjacency list | Entity kinds |\n| **Layout** | `templates{layout, slots, zones}` | Surfaces | N/A |\n| **Routes** | `routes{match, template}` | N/A | N/A |\n| **Schema published** | Pydantic only | JSON Schema catalog | JSON Schema per kind |\n| **Runtime** | React SPA | Any renderer | Catalog API |\n| **Primary use** | Docs sites | Agent-generated UI | Software inventory |\n\n**Synthesis:** ADP combines PraisonAIUI's composition model, the published `$schema` of commercial docs platforms, A2UI's catalog allowlist, and Backstage's envelope and file includes.\n\n---\n\n## 6. YAML vs alternatives — structured debate\n\n### 6.1 The assumption\n\nYAML is the best authoring format for application design manifests.\n\n### 6.2 Counter-evidence\n\n**Commercial docs platforms** — the closest docs-site analogues — use **JSON** config with a published `$schema` URL for IDE autocomplete. This works well for flat-to-moderately-nested config but becomes verbose for deep layout trees.\n\n**A2UI** uses **JSON** as both authoring and wire format because LLMs emit structured JSON reliably and ambiguity is unacceptable at runtime.\n\n**Docusaurus and Gatsby** use **JavaScript/TypeScript** config for programmatic power — but this sacrifices portability and LLM generation safety.\n\n### 6.3 Format comparison\n\n| Format | Strengths | Weaknesses for ADP |\n|--------|-----------|-------------------|\n| **YAML** | Comments; readable nesting; LLM-friendly; PraisonAIUI continuity | Ambiguous typing; merge key footguns; no native DRY |\n| **JSON** | Unambiguous; `$schema` IDE support; proven by commercial docs platforms | No comments; verbose for layout trees |\n| **TOML** | Clear flat tables (Hugo) | Poor for nested templates/zones |\n| **CUE / Jsonnet / Pkl** | Typed composition without templating | Learning curve; not LLM-default |\n| **HCL** | Modules, expressions | Ecosystem-bound; overkill for UI-only |\n| **JS/TS** | Full programmatic power | Not portable; not LLM-safe |\n\n### 6.4 Recommendation\n\n```\nAuthor (human/LLM) → YAML (default) or JSON (alternate)\n        ↓\n   ADP compiler/validator (JSON Schema 2020-12)\n        ↓\n   Normalised JSON manifest (runtime)\n        ↓\n   UI renderer (catalog-constrained)\n```\n\n- **Primary authoring:** YAML — best for nested `templates` / `zones` trees\n- **Alternate authoring:** JSON — for teams preferring `$schema` editor tooling\n- **Never at runtime:** YAML — always compile to JSON before serve\n- **Composition:** `$yaml:` file includes (Backstage), not Helm Go templates\n- **Power users:** Optional CUE/Jsonnet compiles to YAML before validation\n\n**Verdict:** YAML remains the recommended default, but ADP MUST accept JSON as an equivalent authoring format with identical semantics.\n\n---\n\n## 7. ADP design principles\n\n1. **Declarative, not executable** — manifests describe intent; runtimes render; no inline code or templating logic in core spec.\n2. **Schema-first** — JSON Schema 2020-12 is canonical; YAML is authoring convenience.\n3. **Structural strictness** — unknown fields rejected in strict mode (K8s CRD pattern).\n4. **Catalog allowlist** — component `type` must exist in published catalog (A2UI pattern).\n5. **Envelope consistency** — every document uses `apiVersion`, `kind`, `metadata`, `spec`.\n6. **Separation of concerns** — theme, navigation, components, templates, routes are distinct spec sections.\n7. **Compile, don't interpret** — YAML → validated JSON manifest → static assets at build time.\n8. **Accessibility by default** — catalog entries include ARIA role hints (WAI-ARIA pattern).\n9. **Versioned protocol** — `schemaVersion` integer + `apiVersion` string; breaking changes bump version.\n10. **Extension namespace** — `x-adp-*` prefix reserved; plugins register catalog layers.\n11. **File composition** — `$yaml:` includes for modular configs (Backstage pattern).\n12. **Route-driven rendering** — URL resolution selects template; no hardcoded layout in renderer.\n\n---\n\n## 8. Proposed ADP document model\n\n```yaml\nschemaVersion: 1\napiVersion: adp.io/v1alpha1\nkind: Application\n\nmetadata:\n  name: my-docs-site\n  version: \"1.0.0\"\n  labels: {}\n\nspec:\n  site:\n    title: \"My Site\"\n    description: \"...\"\n  theme:\n    preset: zinc          # or DTCG token ref\n    radius: md\n    darkMode: true\n  navigation:\n    mode: auto            # auto | manual\n    tabs: [...]\n  components:\n    header_main:\n      type: Header\n      props: { logoText: \"...\" }\n  templates:\n    docs:\n      layout: ThreeColumnLayout\n      slots:\n        header: { ref: header_main }\n        main: { type: DocContent }\n  routes:\n    - match: \"/docs/**\"\n      template: docs\n  content:\n    docs:\n      dir: \"./docs\"\n```\n\n### Data flow\n\n```\napplication.yaml → Parse → JSON Schema validate → Cross-ref rules (R1–R30)\n        → Compile → ui-config.json + route-manifest.json + docs-nav.json\n        → React / static renderer\n```\n\n---\n\n## 9. PraisonAIUI alignment and gaps\n\n### Already aligned\n\n| PraisonAIUI today | ADP equivalent |\n|-------------------|----------------|\n| `schemaVersion: 1` | `schemaVersion` + `apiVersion` |\n| `components` + `ref:` | `spec.components` + slot refs |\n| `templates.layout` + `slots` | `spec.templates` |\n| `routes` | `spec.routes` |\n| `site.theme` | `spec.theme` |\n| Compiler → JSON manifests | ADP compile pipeline |\n| Pydantic validation | JSON Schema + cross-ref rules |\n\n### Gaps to close\n\n| Gap | ADP fix |\n|-----|---------|\n| No published JSON Schema | Publish `application.schema.json` |\n| `navigation.tabs` compiled but not rendered | Mandate runtime consumption in spec |\n| `route-manifest.json` not used for routing | Mandate route-driven template resolution |\n| Dual slots + zones models | Unified: zones = ordered slot arrays |\n| Closed hardcoded component types | Published `component-catalog.schema.json` |\n| No envelope (`kind`, `metadata`) | Add Backstage-style envelope |\n\n---\n\n## 10. Migration path\n\nExisting `aiui.yaml` (and `aiui.template.yaml`) files remain valid. Migration steps:\n\n1. Add `apiVersion: adp.io/v1alpha1` and `kind: Application` (optional during transition).\n2. Wrap top-level keys under `spec:` (compiler accepts both shapes during v1alpha1).\n3. Rename `site` fields unchanged; map `navigation`, `templates`, `routes` as-is.\n4. Publish catalog; register custom component types via plugin schema layers.\n\nSee [adp/aiui-mapping.md](./adp/aiui-mapping.md) for field-by-field mapping.\n\n---\n\n## 11. Open questions\n\n1. **Should ADP standardise layout type names** (`ThreeColumnLayout`) or allow runtime-defined layouts?\n2. **Should navigation support both filesystem-auto and manual tabs** in one spec, or require a mode switch?\n3. **Should agent-driven surfaces (A2UI) be a separate `kind: Surface`** or embedded in Application?\n4. **Should theme reference DTCG token files directly** or use simplified preset shorthand?\n\n---\n\n## 12. Appendix A — Standards index\n\n| # | Standard | URL |\n|---|----------|-----|\n| 1 | A2UI | https://a2ui.org/ |\n| 2 | AG-UI | https://docs.ag-ui.com/ |\n| 3 | AWP | https://github.com/veegee82/agent-workflow-protocol |\n| 4 | AsyncAPI | https://www.asyncapi.com/ |\n| 5 | Backstage catalog | https://backstage.io/docs/features/software-catalog/descriptor-format |\n| 6 | Bootstrap | https://getbootstrap.com/ |\n| 7 | CloudEvents | https://cloudevents.io/ |\n| 8 | CNAB | https://cnab.io/ |\n| 9 | CrewAI | https://docs.crewai.com/ |\n| 10 | CUE | https://cuelang.org/ |\n| 11 | Docusaurus | https://docusaurus.io/ |\n| 12 | DTCG Design Tokens | https://www.designtokens.org/ |\n| 13 | Figma Code Connect | https://developers.figma.com/docs/code-connect/ |\n| 14 | Framer | https://www.framer.com/ |\n| 15 | Gatsby | https://www.gatsbyjs.com/ |\n| 16 | Helm | https://helm.sh/ |\n| 17 | Hugo | https://gohugo.io/ |\n| 18 | Jekyll | https://jekyllrb.com/ |\n| 19 | JSON Forms | https://jsonforms.io/ |\n| 20 | JSON Schema | https://json-schema.org/ |\n| 21 | Kubernetes CRD | https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/ |\n| 22 | LangGraph | https://langchain-ai.github.io/langgraph/ |\n| 23 | Material Design 3 | https://m3.material.io/ |\n| 24 | MCP | https://modelcontextprotocol.io/ |\n| 25 | OAM | https://oam.dev/ |\n| 26 | OCI Artifact | https://opencontainers.org/ |\n| 27 | OpenAPI | https://www.openapis.org/ |\n| 28 | OpenUI | https://openuispec.org/ |\n| 29 | Pkl | https://pkl-lang.org/ |\n| 30 | PraisonAIUI | https://github.com/MervinPraison/PraisonAIUI |\n| 31 | RJSF | https://rjsf-team.github.io/react-jsonschema-form/ |\n| 32 | Storybook CSF | https://storybook.js.org/docs/api/csf |\n| 33 | W3C ARIA APG | https://www.w3.org/WAI/ARIA/apg/ |\n| 34 | Web Components | https://web.dev/articles/declarative-shadow-dom |\n| 35 | Webflow | https://webflow.com/ |\n| 36 | AutoGen | https://microsoft.github.io/autogen/ |\n| 37 | A2A | https://google.github.io/A2A/ |\n| 38 | Jsonnet | https://jsonnet.org/ |\n| 39 | Docker Compose | https://docs.docker.com/compose/ |\n| 40 | Qt QML | https://doc.qt.io/qt-6/qmlapplications.html |\n| 41 | XAML | https://learn.microsoft.com/en-us/windows/apps/develop/platform/xaml/xaml-overview |\n| 42 | Jetpack Compose | https://developer.android.com/develop/ui/compose |\n| 43 | SwiftUI | https://developer.apple.com/xcode/swiftui/ |\n| 44 | HTML + CSS | https://html.spec.whatwg.org/ |\n| 45 | Flutter | https://flutter.dev/ |\n\n---\n\n## 13. Conclusion\n\nADP is feasible and largely prefigured by PraisonAIUI's existing architecture. The research across 45 standards yields a clear synthesis:\n\n- **Envelope** from Backstage/K8s\n- **Composition** from PraisonAIUI (components → templates → routes)\n- **Catalog** from A2UI/OpenUI\n- **Theming** from DTCG\n- **Validation** from AWP (structural schema + R-rules)\n- **Authoring** in YAML (default) with JSON alternate (published `$schema` pattern)\n\n**Status:** Research draft — see [adp/implementation-status.md](./adp/implementation-status.md) for implementation gaps.\n\nThe draft spec, JSON Schema files, and example manifests are published alongside this report in [`docs/protocols/adp/`](adp/README.md).\n"}</script>
