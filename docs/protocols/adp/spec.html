></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Application Design Protocol (ADP) — Normative Specification</h1>
<p><strong>Version:</strong> v1alpha1 (draft)</p>
<p><strong>Status:</strong> Draft — not yet normative</p>
<p><strong>Date:</strong> August 2026</p>
<p>This document uses <a href="https://datatracker.ietf.org/doc/html/rfc2119">RFC 2119</a> keywords: MUST, MUST NOT, SHOULD, MAY.</p>
<p>---</p>
<h2>1. Scope</h2>
<p>ADP defines a declarative format for describing <strong>application UI design</strong>: site metadata, theming, navigation, reusable components, page templates, and URL routing. It does NOT define:</p>
<li>Server-side APIs or data models</li>
<li>Agent orchestration or workflow graphs</li>
<li>Infrastructure or deployment configuration</li>
<li>Executable code or templating logic in manifests</li>
<p>Implementations MUST treat ADP manifests as <strong>data</strong>, not code.</p>
<p>---</p>
<h2>2. Terminology</h2>
<p>| Term | Definition |</p>
<p>|------|------------|</p>
<p>| <strong>Manifest</strong> | A YAML or JSON document conforming to this spec |</p>
<p>| <strong>Application</strong> | The root <code>kind: Application</code> manifest describing a complete UI |</p>
<p>| <strong>Component</strong> | A named, reusable UI block with a <code>type</code> and <code>props</code> |</p>
<p>| <strong>Template</strong> | A layout definition assigning components to slots or zones |</p>
<p>| <strong>Slot</strong> | A named region within a layout (e.g. <code>header</code>, <code>main</code>) |</p>
<p>| <strong>Zone</strong> | An ordered list of widgets in a slot (WordPress-style) |</p>
<p>| <strong>Route</strong> | A URL pattern mapping to a template |</p>
<p>| <strong>Catalog</strong> | Published JSON Schema defining allowed component types |</p>
<p>| <strong>Compiler</strong> | Tool that validates and emits runtime JSON manifests |</p>
<p>| <strong>Renderer</strong> | Runtime that consumes compiled manifests and renders UI |</p>
<p>---</p>
<h2>3. Document envelope</h2>
<p>Every ADP manifest MUST include:</p>
<h3>3.1 Versioning policy</h3>
<li><code>schemaVersion</code> — integer bumped on breaking envelope changes</li>
<li><code>apiVersion</code> — string group/version (e.g. <code>adp.io/v1alpha1</code>, <code>adp.io/v1</code>)</li>
<li><code>metadata.version</code> — application SemVer (independent of protocol version)</li>
<li>Breaking changes MUST increment <code>apiVersion</code> (e.g. v1alpha1 → v1)</li>
<li>Deprecated fields MUST include <code>deprecated: true</code> and SHOULD include <code>x-sunset</code> date</li>
<h3>3.2 Authoring formats</h3>
<p>Manifests MAY be authored as YAML (<code>.application.yaml</code>) or JSON (<code>.application.json</code>). Semantics MUST be identical. Runtimes MUST NOT consume YAML directly; compilers MUST normalise to JSON before validation.</p>
<p>---</p>
<h2>4. Application spec</h2>
<p>An <code>Application</code> spec MUST contain at minimum:</p>
<p>| Field | Required | Description |</p>
<p>|-------|----------|-------------|</p>
<p>| <code>site.title</code> | YES | Application display name |</p>
<p>| <code>templates</code> | YES | At least one template |</p>
<p>| <code>routes</code> | YES | At least one route |</p>
<p>All other fields are OPTIONAL.</p>
<h3>4.1 Site (`spec.site`)</h3>
<h3>4.2 Theme (`spec.theme`)</h3>
<p>Theme MAY use preset shorthand or reference a DTCG token file:</p>
<h3>4.3 Navigation</h3>
<p>ADP separates <strong>top tab bar</strong> from <strong>sidebar source</strong>:</p>
<li><strong><code>navigation.tabs</code></strong> — top-level tab bar with grouped pages</li>
<li><strong><code>content.docs.nav.mode: auto</code></strong> — sidebar generated from filesystem scan</li>
<li><strong><code>content.docs.nav.mode: manual</code></strong> — sidebar driven by <code>navigation.tabs</code> groups</li>
<li>Renderers MUST honour <code>content.docs.nav.mode</code> when building sidebar (R29)</li>
<h3>4.4 Components (`spec.components`)</h3>
<p>Rules:</p>
<li>Component IDs MUST be unique within the manifest</li>
<li><code>type</code> MUST match an entry in the published component catalog</li>
<li><code>props</code> MUST validate against the catalog JSON Schema for that type</li>
<h3>4.5 Templates (`spec.templates`)</h3>
<p>Rules:</p>
<li><code>layout</code> MUST be a known layout type in the catalog</li>
<li>Each slot value MUST be <code>{ ref: id }</code>, <code>{ type: ComponentType }</code>, or <code>null</code></li>
<li>Zones MUST use zone names valid for <code>FlexibleLayout</code></li>
<li>A template MUST declare either <code>slots</code> or <code>zones</code>, not both (R13)</li>
<h3>4.6 Routes (`spec.routes`)</h3>
<p>Rules:</p>
<li>Routes MUST be ordered most-specific-first</li>
<li><code>match</code> MUST be a glob pattern</li>
<li><code>template</code> MUST reference a key in <code>spec.templates</code></li>
<li>Renderers MUST resolve routes at runtime using compiled <code>route-manifest.json</code></li>
<h3>4.7 Content (`spec.content`)</h3>
<p>---</p>
<h2>5. Component catalog</h2>
<p>Implementations MUST publish a <code>component-catalog.schema.json</code> (meta-schema) and a catalog instance such as <code>catalogs/default.catalog.json</code>:</p>
<p>Custom component types MUST be registered via plugin schema layers. Unknown types MUST cause validation failure in strict mode.</p>
<p>---</p>
<h2>6. Compilation pipeline</h2>
<p>A conforming compiler MUST:</p>
<p>1. Parse YAML or JSON manifest</p>
<p>2. Normalise to JSON</p>
<p>3. Validate against <code>application.schema.json</code> (JSON Schema 2020-12)</p>
<p>4. Validate cross-reference rules (see validation-rules.md)</p>
<p>5. Validate component props against catalog schema</p>
<p>6. Emit runtime manifests:</p>
<li><code>ui-config.json</code> — site, components, templates, theme, navigation</li>
<li><code>route-manifest.json</code> — ordered routes with template refs</li>
<li><code>docs-nav.json</code> — filesystem-derived navigation (if mode auto)</li>
<p>---</p>
<h2>7. File composition</h2>
<p>Manifests MAY include external files using Backstage-style placeholders:</p>
<p>Rules:</p>
<li>Paths MUST be relative to the containing manifest</li>
<li>Path traversal (<code>../../</code>) MUST be rejected</li>
<li>Supported placeholders: <code>$yaml:</code>, <code>$json:</code>, <code>$text:</code></li>
<p>---</p>
<h2>8. Extensions</h2>
<p>Vendor extensions MUST use the <code>x-adp-</code> prefix:</p>
<p>Implementations MUST preserve unknown <code>x-adp-*</code> fields. Non-prefixed unknown fields MUST be rejected in strict mode.</p>
<p>---</p>
<h2>9. Conformance</h2>
<p>An implementation is <strong>ADP-conformant</strong> if and only if it:</p>
<p>1. Accepts manifests with <code>apiVersion: adp.io/v1alpha1</code> and <code>kind: Application</code></p>
<p>2. Validates all MUST-level requirements in this spec and validation-rules.md</p>
<p>3. Rejects manifests with unknown fields in strict mode</p>
<p>4. Emits runtime JSON manifests from valid Application specs</p>
<p>5. Resolves routes to templates at render time</p>
<p>---</p>

<li><a href="https://github.com/MervinPraison/PraisonAIUI/tree/main/docs/protocols/adp/examples">Examples</a></li></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/protocols/adp/spec.source.md", "text": "---\nnav_title: Specification\n---\n\n# Application Design Protocol (ADP) — Normative Specification\n\n**Version:** v1alpha1 (draft)  \n**Status:** Draft — not yet normative  \n**Date:** August 2026\n\nThis document uses [RFC 2119](https://datatracker.ietf.org/doc/html/rfc2119) keywords: MUST, MUST NOT, SHOULD, MAY.\n\n---\n\n## 1. Scope\n\nADP defines a declarative format for describing **application UI design**: site metadata, theming, navigation, reusable components, page templates, and URL routing. It does NOT define:\n\n- Server-side APIs or data models\n- Agent orchestration or workflow graphs\n- Infrastructure or deployment configuration\n- Executable code or templating logic in manifests\n\nImplementations MUST treat ADP manifests as **data**, not code.\n\n---\n\n## 2. Terminology\n\n| Term | Definition |\n|------|------------|\n| **Manifest** | A YAML or JSON document conforming to this spec |\n| **Application** | The root `kind: Application` manifest describing a complete UI |\n| **Component** | A named, reusable UI block with a `type` and `props` |\n| **Template** | A layout definition assigning components to slots or zones |\n| **Slot** | A named region within a layout (e.g. `header`, `main`) |\n| **Zone** | An ordered list of widgets in a slot (WordPress-style) |\n| **Route** | A URL pattern mapping to a template |\n| **Catalog** | Published JSON Schema defining allowed component types |\n| **Compiler** | Tool that validates and emits runtime JSON manifests |\n| **Renderer** | Runtime that consumes compiled manifests and renders UI |\n\n---\n\n## 3. Document envelope\n\nEvery ADP manifest MUST include:\n\n```yaml\nschemaVersion: 1          # Integer; ADP envelope version\napiVersion: adp.io/v1alpha1\nkind: Application         # Application | Theme | ComponentCatalog (future)\n\nmetadata:\n  name: string            # Required; unique identifier\n  version: string         # SHOULD use SemVer\n  labels: object          # MAY contain key-value pairs\n  annotations: object     # MAY contain tooling metadata\n\nspec: object              # Required; kind-specific payload\n```\n\n### 3.1 Versioning policy\n\n- `schemaVersion` — integer bumped on breaking envelope changes\n- `apiVersion` — string group/version (e.g. `adp.io/v1alpha1`, `adp.io/v1`)\n- `metadata.version` — application SemVer (independent of protocol version)\n- Breaking changes MUST increment `apiVersion` (e.g. v1alpha1 → v1)\n- Deprecated fields MUST include `deprecated: true` and SHOULD include `x-sunset` date\n\n### 3.2 Authoring formats\n\nManifests MAY be authored as YAML (`.application.yaml`) or JSON (`.application.json`). Semantics MUST be identical. Runtimes MUST NOT consume YAML directly; compilers MUST normalise to JSON before validation.\n\n---\n\n## 4. Application spec\n\nAn `Application` spec MUST contain at minimum:\n\n| Field | Required | Description |\n|-------|----------|-------------|\n| `site.title` | YES | Application display name |\n| `templates` | YES | At least one template |\n| `routes` | YES | At least one route |\n\nAll other fields are OPTIONAL.\n\n### 4.1 Site (`spec.site`)\n\n```yaml\nsite:\n  title: string           # Required\n  description: string     # Optional\n  ui: shadcn              # UI framework hint; default shadcn\n  routeBaseDocs: /docs    # Base path for documentation routes\n```\n\n### 4.2 Theme (`spec.theme`)\n\nTheme MAY use preset shorthand or reference a DTCG token file:\n\n```yaml\ntheme:\n  preset: zinc            # Tailwind-style preset name\n  radius: md              # none | sm | md | lg | xl\n  darkMode: true\n  # OR\n  tokens: $yaml: ./theme.tokens.json   # DTCG 2025.10 file\n```\n\n### 4.3 Navigation\n\nADP separates **top tab bar** from **sidebar source**:\n\n```yaml\nnavigation:\n  tabs:                   # Top tab bar\n    - tab: Documentation\n      groups:\n        - group: Getting Started\n          pages: [index, getting-started/installation]\n\ncontent:\n  docs:\n    dir: ./docs\n    nav:\n      mode: auto           # auto | manual — sidebar source\n      sort: filesystem\n      collapsible: true\n      maxDepth: 4\n```\n\n- **`navigation.tabs`** — top-level tab bar with grouped pages\n- **`content.docs.nav.mode: auto`** — sidebar generated from filesystem scan\n- **`content.docs.nav.mode: manual`** — sidebar driven by `navigation.tabs` groups\n- Renderers MUST honour `content.docs.nav.mode` when building sidebar (R29)\n\n### 4.4 Components (`spec.components`)\n\n```yaml\ncomponents:\n  header_main:\n    type: Header          # MUST exist in component catalog\n    props:\n      logoText: PraisonAIUI\n```\n\nRules:\n- Component IDs MUST be unique within the manifest\n- `type` MUST match an entry in the published component catalog\n- `props` MUST validate against the catalog JSON Schema for that type\n\n### 4.5 Templates (`spec.templates`)\n\n```yaml\ntemplates:\n  docs:\n    layout: ThreeColumnLayout\n    slots:\n      header: { ref: header_main }\n      left: { ref: sidebar_docs }\n      main: { type: DocContent }\n      right: null           # Explicitly hide slot\n\n  landing:\n    layout: FlexibleLayout\n    zones:\n      hero:\n        - type: HeroBanner\n          props: { title: \"Welcome\" }\n```\n\nRules:\n- `layout` MUST be a known layout type in the catalog\n- Each slot value MUST be `{ ref: id }`, `{ type: ComponentType }`, or `null`\n- Zones MUST use zone names valid for `FlexibleLayout`\n- A template MUST declare either `slots` or `zones`, not both (R13)\n\n### 4.6 Routes (`spec.routes`)\n\n```yaml\nroutes:\n  - match: /docs/changelog\n    template: changelog\n    slots:                  # Optional per-route slot overrides\n      right: null\n  - match: /docs/**\n    template: docs\n```\n\nRules:\n- Routes MUST be ordered most-specific-first\n- `match` MUST be a glob pattern\n- `template` MUST reference a key in `spec.templates`\n- Renderers MUST resolve routes at runtime using compiled `route-manifest.json`\n\n### 4.7 Content (`spec.content`)\n\n```yaml\ncontent:\n  docs:\n    dir: ./docs\n    include: [\"**/*.md\", \"**/*.mdx\"]\n    exclude: []\n    nav:\n      mode: auto\n      sort: filesystem\n      collapsible: true\n      maxDepth: 4\n```\n\n---\n\n## 5. Component catalog\n\nImplementations MUST publish a `component-catalog.schema.json` (meta-schema) and a catalog instance such as [`catalogs/default.catalog.json`](./catalogs/default.catalog.json):\n\n```json\n{\n  \"name\": \"adp-default-catalog\",\n  \"version\": \"1.0.0\",\n  \"components\": {\n    \"Header\": {\n      \"description\": \"Site header with logo and navigation\",\n      \"props\": {\n        \"type\": \"object\",\n        \"properties\": { \"logoText\": { \"type\": \"string\" } },\n        \"required\": [\"logoText\"],\n        \"additionalProperties\": false\n      },\n      \"aria\": { \"role\": \"banner\" },\n      \"slots\": [\"header\"]\n    }\n  },\n  \"layouts\": {\n    \"ThreeColumnLayout\": {\n      \"description\": \"Header + sidebar + main + TOC + footer\",\n      \"slots\": [\"header\", \"left\", \"main\", \"right\", \"footer\"]\n    }\n  }\n}\n```\n\nCustom component types MUST be registered via plugin schema layers. Unknown types MUST cause validation failure in strict mode.\n\n---\n\n## 6. Compilation pipeline\n\nA conforming compiler MUST:\n\n1. Parse YAML or JSON manifest\n2. Normalise to JSON\n3. Validate against `application.schema.json` (JSON Schema 2020-12)\n4. Validate cross-reference rules (see [validation-rules.md](./validation-rules.md))\n5. Validate component props against catalog schema\n6. Emit runtime manifests:\n   - `ui-config.json` — site, components, templates, theme, navigation\n   - `route-manifest.json` — ordered routes with template refs\n   - `docs-nav.json` — filesystem-derived navigation (if mode auto)\n\n---\n\n## 7. File composition\n\nManifests MAY include external files using Backstage-style placeholders:\n\n```yaml\ntheme:\n  $yaml: ./theme.yaml\n\nnavigation:\n  $yaml: ./navigation.yaml\n```\n\nRules:\n- Paths MUST be relative to the containing manifest\n- Path traversal (`../../`) MUST be rejected\n- Supported placeholders: `$yaml:`, `$json:`, `$text:`\n\n---\n\n## 8. Extensions\n\nVendor extensions MUST use the `x-adp-` prefix:\n\n```yaml\nspec:\n  site:\n    x-adp-customAnalytics: true\n```\n\nImplementations MUST preserve unknown `x-adp-*` fields. Non-prefixed unknown fields MUST be rejected in strict mode.\n\n---\n\n## 9. Conformance\n\nAn implementation is **ADP-conformant** if and only if it:\n\n1. Accepts manifests with `apiVersion: adp.io/v1alpha1` and `kind: Application`\n2. Validates all MUST-level requirements in this spec and validation-rules.md\n3. Rejects manifests with unknown fields in strict mode\n4. Emits runtime JSON manifests from valid Application specs\n5. Resolves routes to templates at render time\n\n---\n\n## 10. Related documents\n\n- [Research report](../application-design-protocol-report.md)\n- [Implementation status](./implementation-status.md)\n- [PraisonAIUI mapping](./aiui-mapping.md)\n- [JSON Schema: application](./schema/application.schema.json)\n- [JSON Schema: component catalog](./schema/component-catalog.schema.json)\n- [JSON Schema: theme](./schema/theme.schema.json)\n- [Examples](https://github.com/MervinPraison/PraisonAIUI/tree/main/docs/protocols/adp/examples)\n"}</script>
