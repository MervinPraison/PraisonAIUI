<p><strong>Version:</strong> v1alpha1 (draft)</p>
<p><strong>Status:</strong> Draft — not yet normative</p>
<p><strong>Date:</strong> August 2026</p>
<p>This document uses <a href="https://datatracker.ietf.org/doc/html/rfc2119">RFC 2119</a> keywords: MUST, MUST NOT, SHOULD, MAY.</p>
<h2>2. Terminology</h2>
<p>| Term | Definition |</p>
<p>|------|------------|</p>
<p>| <strong>Manifest</strong> | A YAML or JSON document conforming to this spec |</p>
<p>| <strong>Application</strong> | The root <code>kind: Application</code> manifest describing a complete UI |</p>
<p>| <strong>Component</strong> | A named, reusable UI block with a <code>type</code> and <code>props</code> |</p>
<p>| <strong>Template</strong> | A layout definition assigning components to slots or zones |</p>
<p>| <strong>Slot</strong> | A named region within a layout (e.g. <code>header</code>, <code>main</code>) |</p>
<p>| <strong>Zone</strong> | An ordered list of widgets in a slot (WordPress-style) |</p>
<p>| <strong>Route</strong> | A URL pattern mapping to a template |</p>
<p>| <strong>Catalog</strong> | Published JSON Schema defining allowed component types |</p>
<p>| <strong>Compiler</strong> | Tool that validates and emits runtime JSON manifests |</p>
<p>| <strong>Renderer</strong> | Runtime that consumes compiled manifests and renders UI |</p>
<p>---</p>
<h2>3. Document envelope</h2>
<p>Every ADP manifest MUST include:</p>
<h3>3.1 Versioning policy</h3>
<li><code>schemaVersion</code> — integer bumped on breaking envelope changes</li>
<li><code>apiVersion</code> — string group/version (e.g. <code>adp.io/v1alpha1</code>, <code>adp.io/v1</code>)</li>
<li><code>metadata.version</code> — application SemVer (independent of protocol version)</li>
<li>Breaking changes MUST increment <code>apiVersion</code> (e.g. v1alpha1 → v1)</li>
<li>Deprecated fields MUST include <code>deprecated: true</code> and SHOULD include <code>x-sunset</code> date</li>
<h3>3.2 Authoring formats</h3>
<p>Manifests MAY be authored as YAML (<code>.application.yaml</code>) or JSON (<code>.application.json</code>). Semantics MUST be identical. Runtimes MUST NOT consume YAML directly; compilers MUST normalise to JSON before validation.</p>
<p>---</p>
<h2>4. Application spec</h2>
<p>An <code>Application</code> spec MUST contain at minimum:</p>
<p>| Field | Required | Description |</p>
<p>|-------|----------|-------------|</p>
<p>| <code>site.title</code> | YES | Application display name |</p>
<p>| <code>templates</code> | YES | At least one template |</p>
<p>| <code>routes</code> | YES | At least one route |</p>
<p>All other fields are OPTIONAL.</p>
<h3>4.1 Site (`spec.site`)</h3>
<h3>4.2 Theme (`spec.theme`)</h3>
<p>Theme MAY use preset shorthand or reference a DTCG token file:</p>
<h3>4.3 Navigation</h3>
<p>ADP separates <strong>top tab bar</strong> from <strong>sidebar source</strong>:</p>
<li><strong><code>navigation.tabs</code></strong> — top-level tab bar with grouped pages</li>
<li><strong><code>content.docs.nav.mode: auto</code></strong> — sidebar generated from filesystem scan</li>
<li><strong><code>content.docs.nav.mode: manual</code></strong> — sidebar driven by <code>navigation.tabs</code> groups</li>
<li>Renderers MUST honour <code>content.docs.nav.mode</code> when building sidebar (R29)</li>
<h3>4.4 Components (`spec.components`)</h3>
<p>Rules:</p>
<li>Component IDs MUST be unique within the manifest</li>
<li><code>type</code> MUST match an entry in the published component catalog</li>
<li><code>props</code> MUST validate against the catalog JSON Schema for that type</li>
<h3>4.5 Templates (`spec.templates`)</h3>
<p>Rules:</p>
<li><code>layout</code> MUST be a known layout type in the catalog</li>
<li>Each slot value MUST be <code>{ ref: id }</code>, <code>{ type: ComponentType }</code>, or <code>null</code></li>
<li>Zones MUST use zone names valid for <code>FlexibleLayout</code></li>
<li>A template MUST declare either <code>slots</code> or <code>zones</code>, not both (R13)</li>
<h3>4.6 Routes (`spec.routes`)</h3>
<p>Rules:</p>
<li>Routes MUST be ordered most-specific-first</li>
<li><code>match</code> MUST be a glob pattern</li>
<li><code>template</code> MUST reference a key in <code>spec.templates</code></li>
<li>Renderers MUST resolve routes at runtime using compiled <code>route-manifest.json</code></li>
<h3>4.7 Content (`spec.content`)</h3>
<p>---</p>
<h2>5. Component catalog</h2>
<p>Implementations MUST publish a <code>component-catalog.schema.json</code> (meta-schema) and a catalog instance such as <code>catalogs/default.catalog.json</code>:</p>
<p>Custom component types MUST be registered via plugin schema layers. Unknown types MUST cause validation failure in strict mode.</p>
<p>---</p>
<h2>6. Compilation pipeline</h2>
<p>A conforming compiler MUST:</p>
<p>1. Parse YAML or JSON manifest</p>
<p>2. Normalise to JSON</p>
<p>3. Validate against <code>application.schema.json</code> (JSON Schema 2020-12)</p>
<p>4. Validate cross-reference rules (see validation-rules.md)</p>
<p>5. Validate component props against catalog schema</p>
<p>6. Emit runtime manifests:</p>
<li><code>ui-config.json</code> — site, components, templates, theme, navigation</li>
<li><code>route-manifest.json</code> — ordered routes with template refs</li>
<li><code>docs-nav.json</code> — filesystem-derived navigation (if mode auto)</li>
<p>---</p>
<h2>7. File composition</h2>
<p>Manifests MAY include external files using Backstage-style placeholders:</p>
<p>Rules:</p>
<li>Paths MUST be relative to the containing manifest</li>
<li>Path traversal (<code>../../</code>) MUST be rejected</li>
<li>Supported placeholders: <code>$yaml:</code>, <code>$json:</code>, <code>$text:</code></li>
<p>---</p>
<h2>8. Extensions</h2>
<p>Vendor extensions MUST use the <code>x-adp-</code> prefix:</p>
<p>Implementations MUST preserve unknown <code>x-adp-*</code> fields. Non-prefixed unknown fields MUST be rejected in strict mode.</p>
<p>---</p>
<h2>9. Conformance</h2>
<p>An implementation is <strong>ADP-conformant</strong> if and only if it:</p>
<p>1. Accepts manifests with <code>apiVersion: adp.io/v1alpha1</code> and <code>kind: Application</code></p>
<p>2. Validates all MUST-level requirements in this spec and validation-rules.md</p>
<p>3. Rejects manifests with unknown fields in strict mode</p>
<p>4. Emits runtime JSON manifests from valid Application specs</p>
<p>5. Resolves routes to templates at render time</p>
<p>---</p>
