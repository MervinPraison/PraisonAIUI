<p>Honest status of ADP v1alpha1 features against the PraisonAIUI reference implementation.</p>
<p><strong>Last updated:</strong> August 2026</p>
<p>| Feature | Spec reference | Status | Notes |</p>
<p>|---------|----------------|--------|-------|</p>
<p>| JSON Schema validation in CLI | spec §6 | Planned | Schemas published; no <code>aiui validate --adp</code> yet |</p>
<p>| ADP envelope parsing (<code>apiVersion/kind/spec</code>) | spec §3 | Planned | Flat <code>aiui.template.yaml</code> works today |</p>
<p>| Component catalog validation (R6–R7) | spec §5 | Planned | Catalog split to <code>catalogs/default.catalog.json</code> |</p>
<p>| <code>$yaml:</code> / <code>$json:</code> file includes | spec §7 | Planned | Not implemented in compiler |</p>
<p>| Strict mode unknown-field rejection (R4) | validation-rules R4 | Planned | Pydantic allows extra fields on some models |</p>
<p>| Route-driven template resolution (R28) | validation-rules R28 | Gap | Frontend hardcodes <code>templates.docs</code> |</p>
<p>| Sidebar nav mode (R29) | validation-rules R29 | Gap | Filesystem-only sidebar today |</p>
<p>| Catalog ARIA roles at render (R30) | validation-rules R30 | Gap | No catalog-driven a11y in renderer |</p>
<p>| <code>navigation.tabs</code> rendering | spec §4.3 | Gap | Compiled to manifest but not consumed by React |</p>
<p>| DTCG token file validation (R26) | validation-rules R26 | Planned | Preset shorthand works via Tailwind |</p>
<p>| Published <code>$schema</code> URLs | README | Partial | Local schemas only; <code>https://adp.io/</code> is placeholder |</p>
<h2>What works today</h2>
<li>Flat <code>aiui.template.yaml</code> → Pydantic <code>Config</code> → compiler → JSON manifests → React SPA</li>
<li>Components, templates, routes, theme presets, content scanning</li>
<li>ADP example manifests validate against <code>application.schema.json</code> (standalone)</li>
<li>Unit tests in <code>tests/unit/test_adp_schemas.py</code></li>
<h2>Migration path</h2>
<p>1. Add envelope normalisation layer before <code>Config.model_validate</code></p>
<p>2. Wire <code>route-manifest.json</code> into frontend routing (R28)</p>
<p>3. Honour <code>navigation.tabs</code> and <code>content.docs.nav.mode</code> (R29)</p>
<p>4. Add <code>aiui validate --schema adp</code> using published JSON Schema</p>
<p>5. Apply catalog ARIA hints at render time (R30)</p>
<p>See aiui-mapping.md for field-level compatibility.</p></noscript></div>
