<h3>4. Enable GitHub Pages</h3>
<p>1. Go to <strong>Settings → Pages</strong> in your GitHub repo</p>
<p>2. Set <strong>Source</strong> to <code>Deploy from a branch</code></p>

<h2>Project sites (no custom domain)</h2>
<p>A repository other than <code>&lt;user&gt;.github.io</code> is published at</p>
<p><code>https://&lt;user&gt;.github.io/&lt;repo&gt;/</code>, under a path prefix. <code>--base-path auto</code> in</p>
<p>the workflow above handles it: in GitHub Actions it reads the repository name,</p>
<p>so every asset, page, link, search and Markdown URL starts with <code>/&lt;repo&gt;</code>, and</p>
<p>the sitemap, <code>llms.txt</code> and canonical links use</p>
<p><code>https://&lt;user&gt;.github.io/&lt;repo&gt;</code> as the site URL. Nothing else to configure,</p>
<p>and no custom domain needed.</p>
<p><code>auto</code> builds for the root when the repository has a <code>CNAME</code> file, when the</p>
<p>repository is <code>&lt;user&gt;.github.io</code>, when <code>seo.siteUrl</code> is set (its path is the</p>
<p>prefix), and outside GitHub Actions. To set the prefix yourself:</p>
<p>The same works for any host that serves the site under a path, such as</p>
<p><code>example.com/docs</code> behind a reverse proxy (<code>--base-path /docs</code>). Write links in</p>
<p>your Markdown as usual (<code>/docs/guide</code>, <code>../img/x.png</code>): the build and the app</p>
<p>add the prefix. Order of precedence: <code>--base-path</code>, then <code>site.basePath</code>, then</p>
<p>the path of <code>seo.siteUrl</code>. <code>--base-path /</code> builds for the root.</p>
<p>If you deploy with <code>actions/configure-pages</code> (Pages source "GitHub Actions"),</p>
<p>you can pass its output instead, which also knows a custom domain set in the</p>
<p>repository settings: <code>--base-path "${{ steps.pages.outputs.base_path }}"</code>.</p>
<p>Preview a prefixed build locally: <code>aiui serve --base-path /my-repo</code> serves it at</p>
<p><code>http://127.0.0.1:8000/my-repo/</code> (and <code>aiui serve --no-build</code> serves an</p>
<p>existing build under the prefix it was built for).</p>
<p>Under a prefix, the legacy plugins that read the URL themselves</p>
<p>(<code>content-loader</code>, <code>homepage</code>, <code>topnav</code>) are not supported; the default</p>
<p><code>nav-intercept</code> and <code>fetch-retry</code> are.</p>

<p>To use a custom domain (e.g., <code>docs.example.com</code>):</p>
<p>1. Create a <code>CNAME</code> file in your repo root:</p>
<p>2. Configure DNS — add a CNAME record pointing to <code>&lt;username&gt;.github.io</code></p>
<p>3. The workflow above copies <code>CNAME</code> into the build output. The build also</p>

<h2>Migrating from MkDocs</h2>
<p>| MkDocs | AIUI |</p>
<p>|--------|------|</p>
<p>| <code>mkdocs.yml</code> | <code>aiui.yaml</code> |</p>
<p>| <code>mkdocs build</code> → <code>./site/</code> | <code>aiui build --output site</code> → <code>./site/</code> |</p>
<p>| <code>mkdocs serve</code> | <code>aiui dev</code> |</p>
<p>| <code>pip install mkdocs-material</code> | <code>pip install aiui</code> |</p>
<p>What carries over from Material for MkDocs pages:</p>
<li>Admonitions (<code>!!! note "Title"</code>, collapsible <code>???</code>), content tabs</li>
<p>(<code>=== "Tab"</code> with 4-space indented content) and fenced code blocks render.</p>
<li><code>attr_list</code> (<code>{ .class }</code>) is not supported and shows as literal text;</li>
<p><code>:material-*:</code> icon shortcodes do not render as icons; raw HTML blocks are not</p>
<p>styled. Remove them.</p>
<li>The <code>nav:</code> list in <code>mkdocs.yml</code> is not read. Pages are ordered by the</li>
<p>frontmatter <code>order</code> value, then a number prefix in the file name</p>
<p>(<code>01-intro.md</code>), then the file name. See Navigation.</p>
<h3>Migration steps</h3>
<p>1. Create <code>aiui.yaml</code> (see the example above) and run</p>
<p><code>aiui validate --strict</code>.</p>
<p>2. Replace <code>mkdocs build</code> with <code>aiui build --output site --minify</code> in your CI workflow.</p>
<p>3. Check the pages for the unsupported syntax listed above.</p>
<p>4. Push to <code>main</code>.</p>

<h2>Build output</h2>
<p><code>aiui build --output site</code> produces:</p>
<p>With a site URL (<code>seo.siteUrl</code>, or the <code>CNAME</code> file) the build also writes</p>

<h2>How pages load</h2>
<p>Opening a page from the sidebar fetches its <code>.md</code> file. A reader on a lossy</p>
<p>network (Wi-Fi, VPN, a mobile link) sometimes gets one new connection that</p>
<p>hangs for 15 to 30 seconds while every other request is fast. The docs app</p>
<p>keeps one such request from freezing the page:</p>
<li><strong>Time limit and retry.</strong> Each request for a page has 5 seconds to get an</li>
<p>answer from the server. Past that it is cancelled and a fresh request goes</p>
<p>out, which opens a new connection. There are three attempts (5 s, 5 s, then</p>
<p>10 s for a link that is only slow), with a short random pause between them.</p>
<p>A network error or a 5xx answer is retried the same way; a 404 is not.</p>
<li><strong>Stalled downloads.</strong> Once the answer starts, a page whose download sends</li>
<p>nothing for 5 seconds has stalled and is requested again; one that keeps</p>
<p>arriving, however slowly, gets up to 15 seconds.</p>
<li><strong>Prefetch.</strong> Resting the pointer on a sidebar, previous / next or</li>
<p>in-article docs link for 80 ms, focusing it with the keyboard, or pressing</p>
<p>it starts loading that page. Once a page has shown, its previous and next</p>
<p>pages load while the browser is idle.</p>
<li><strong>In-memory cache.</strong> A page loaded or prefetched once shows at once when you</li>
<p>come back to it, without a request, until the tab is reloaded.</p>
<li><strong>The last click wins.</strong> Clicking another link cancels the request for the</li>
<p>page you left, so fast clicking never builds a queue.</p>
<li><strong>No long wait for the renderer.</strong> A fetched page waits at most one second</li>
<p>for the code highlighter and math renderer; after that the text shows and</p>
<p>upgrades when they arrive.</p>
<li><strong>Retry state.</strong> When every attempt fails, the page says "Couldn't load this</li>
<p>page" with a <strong>Retry</strong> button instead of a loading skeleton.</p>
<li><strong>First load.</strong> Every page <code>aiui build</code> writes carries the navigation</li>
<p>(<code>docs-nav.json</code>), the route manifest and the page's own Markdown, so a first</p>
<p>visit asks for none of them; <code>ui-config.json</code> is preloaded with the page (a</p>
<p>live <code>aiui serve</code> adds Ask AI, MCP and feedback to it, so it is not baked in).</p>
<p>The loader's tag names the plugins, so <code>plugins/plugins.json</code> is not</p>
<p>requested either: on this site a first docs page went from five JSON requests</p>
<p>and three plugin scripts to one and two. A file the page does not carry (a</p>
<p>navigation over 100 KB, the navigation of a site with</p>
<p>sign-in, a page served without its content)</p>
<p>loads with the same time limit and retries as a page. If it cannot load, the</p>
<p>page says "Couldn't load the docs" with a <strong>Retry</strong> button instead of</p>
<p>staying blank.</p>
<p>This site, https://ui.praison.ai, is built the same way: see</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/.github/workflows/deploy-pages.yml"><code>.github/workflows/deploy-pages.yml</code></a>.</p>
<h2>Legacy plugins</h2>
<p>The docs app renders code (Shiki), mermaid diagrams, MkDocs tabs and</p>
<p>admonitions, "On this page" and the header tabs itself. By default a build</p>
<p>loads only one of the vanilla plugins in <code>plugins/</code>:</p>
<p>| Plugin | Why it loads |</p>
<p>|---|---|</p>
<p>| <code>nav-intercept</code> | Keeps in-article <code>/docs</code> links on in-app navigation (no full page load) |</p>
<p><code>fetch-retry</code> (retry a failed request for the site manifests) is no longer in</p>
<p>the default list: the app reads the navigation and route manifest from the</p>
<p>page and fetches <code>ui-config.json</code> with its own time limit and retries, which</p>
<p><code>fetch-retry</code> leaves alone. List it under <code>site.plugins</code> to keep it.</p>
<p><code>mermaid</code>, <code>syntax-highlight</code>, <code>code-copy</code>, <code>toc</code>, <code>mkdocs-compat</code>,</p>
<p><code>content-loader</code>, <code>homepage</code> and <code>topnav</code> no longer load by default: they skip</p>
<p>React docs pages, and <code>mermaid</code> and <code>syntax-highlight</code> fetched about 40 files</p>
<p>from cdn.jsdelivr.net and cdnjs.cloudflare.com on every page (each new origin</p>
<p>is another connection that can stall). A site can still list any of them under</p>
<p><code>site.plugins</code> in <code>aiui.yaml</code>.</p>
<p><code>index.html</code> loads <code>plugins/plugin-loader.js?v=&lt;version&gt;</code>, where the version</p>
<p>is a hash of the plugin files in the build (also in <code>plugins/plugins.json</code>),</p>
<p>and names the plugins on the same tag (<code>data-plugins</code>), so the loader does not</p>
<p>fetch <code>plugins.json</code> (a server's pages, which lack it, still do).</p>
<p>The loader imports every plugin with the same <code>?v=</code>, so browsers and the CDN</p>
<p>cache them until a build changes a plugin.</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/getting-started/github-pages.source.md", "text": "# Deploy to GitHub Pages\n\nShip your AIUI docs site to GitHub Pages with one workflow file.\n\n## Quick Start\n\n### 1. Project Structure\n\n```\nmy-project/\n├── aiui.yaml    # Site configuration\n├── docs/                 # Your markdown content\n│   ├── index.md\n│   └── guide.md\n├── CNAME                 # Custom domain (optional)\n└── .github/\n    └── workflows/\n        └── deploy.yml    # GitHub Actions workflow\n```\n\n### 2. Configuration\n\nCreate `aiui.yaml`:\n\n```yaml\nschemaVersion: 1\n\nsite:\n  title: \"My Docs\"\n  description: \"Documentation for my project\"\n  ui: \"shadcn\"\n  theme:\n    preset: \"zinc\"\n    darkMode: true\n\ncontent:\n  docs:\n    dir: \"./docs\"\n    include:\n      - \"**/*.md\"\n\ntemplates:\n  docs:\n    layout: \"ThreeColumnLayout\"\n    slots:\n      header: { ref: \"header_main\" }\n      left: { ref: \"sidebar_docs\" }\n      main: { type: \"DocContent\" }\n      footer: { ref: \"footer_main\" }\n\ncomponents:\n  header_main:\n    type: \"Header\"\n    props:\n      logoText: \"My Docs\"\n  footer_main:\n    type: \"Footer\"\n    props:\n      text: \"© 2026\"\n  sidebar_docs:\n    type: \"DocsSidebar\"\n    props:\n      source: \"docs-nav\"\n\nroutes:\n  - match: \"/docs/**\"\n    template: \"docs\"\n```\n\n### 3. GitHub Actions Workflow\n\nCreate `.github/workflows/deploy.yml`:\n\n```yaml\nname: Deploy Docs\n\non:\n  push:\n    branches: [main]\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n\n    permissions:\n      contents: write\n      pages: write\n      id-token: write\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: \"3.11\"\n\n      - name: Install AIUI\n        run: pip install aiui\n\n      - name: Build\n        run: |\n          # auto: user.github.io/\u003crepo\u003e gets the /\u003crepo\u003e prefix; a CNAME or a\n          # \u003cuser\u003e.github.io repo is served at the root\n          aiui build --output site --minify --base-path auto\n          # Keep the custom domain, if there is one\n          if [ -f CNAME ]; then cp CNAME site/CNAME; fi\n\n      - name: Deploy to GitHub Pages\n        uses: peaceiris/actions-gh-pages@v4\n        with:\n          github_token: ${{ secrets.GITHUB_TOKEN }}\n          publish_dir: ./site\n```\n\n### 4. Enable GitHub Pages\n\n1. Go to **Settings → Pages** in your GitHub repo\n2. Set **Source** to `Deploy from a branch`\n3. Set **Branch** to `gh-pages` / `/ (root)`\n4. Push to `main` — your site deploys automatically\n\n## Project sites (no custom domain)\n\nA repository other than `\u003cuser\u003e.github.io` is published at\n`https://\u003cuser\u003e.github.io/\u003crepo\u003e/`, under a path prefix. `--base-path auto` in\nthe workflow above handles it: in GitHub Actions it reads the repository name,\nso every asset, page, link, search and Markdown URL starts with `/\u003crepo\u003e`, and\nthe sitemap, `llms.txt` and canonical links use\n`https://\u003cuser\u003e.github.io/\u003crepo\u003e` as the site URL. Nothing else to configure,\nand no custom domain needed.\n\n`auto` builds for the root when the repository has a `CNAME` file, when the\nrepository is `\u003cuser\u003e.github.io`, when `seo.siteUrl` is set (its path is the\nprefix), and outside GitHub Actions. To set the prefix yourself:\n\n```yaml\nsite:\n  basePath: /my-repo        # or: aiui build --base-path /my-repo\n```\n\nThe same works for any host that serves the site under a path, such as\n`example.com/docs` behind a reverse proxy (`--base-path /docs`). Write links in\nyour Markdown as usual (`/docs/guide`, `../img/x.png`): the build and the app\nadd the prefix. Order of precedence: `--base-path`, then `site.basePath`, then\nthe path of `seo.siteUrl`. `--base-path /` builds for the root.\n\nIf you deploy with `actions/configure-pages` (Pages source \"GitHub Actions\"),\nyou can pass its output instead, which also knows a custom domain set in the\nrepository settings: `--base-path \"${{ steps.pages.outputs.base_path }}\"`.\n\nPreview a prefixed build locally: `aiui serve --base-path /my-repo` serves it at\n`http://127.0.0.1:8000/my-repo/` (and `aiui serve --no-build` serves an\nexisting build under the prefix it was built for).\n\nUnder a prefix, the legacy plugins that read the URL themselves\n(`content-loader`, `homepage`, `topnav`) are not supported; the default\n`nav-intercept` and `fetch-retry` are.\n\n## Custom Domain\n\nTo use a custom domain (e.g., `docs.example.com`):\n\n1. Create a `CNAME` file in your repo root:\n   ```\n   docs.example.com\n   ```\n2. Configure DNS — add a CNAME record pointing to `\u003cusername\u003e.github.io`\n3. The workflow above copies `CNAME` into the build output. The build also\n   uses it as the site URL for the sitemap and canonical links.\n\n## Migrating from MkDocs\n\n| MkDocs | AIUI |\n|--------|------|\n| `mkdocs.yml` | `aiui.yaml` |\n| `mkdocs build` → `./site/` | `aiui build --output site` → `./site/` |\n| `mkdocs serve` | `aiui dev` |\n| `pip install mkdocs-material` | `pip install aiui` |\n\nWhat carries over from Material for MkDocs pages:\n\n- Admonitions (`!!! note \"Title\"`, collapsible `???`), content tabs\n  (`=== \"Tab\"` with 4-space indented content) and fenced code blocks render.\n- `attr_list` (`{ .class }`) is not supported and shows as literal text;\n  `:material-*:` icon shortcodes do not render as icons; raw HTML blocks are not\n  styled. Remove them.\n- The `nav:` list in `mkdocs.yml` is not read. Pages are ordered by the\n  frontmatter `order` value, then a number prefix in the file name\n  (`01-intro.md`), then the file name. See [Navigation](../features/navigation.md).\n\n### Migration steps\n\n1. Create `aiui.yaml` (see the example above) and run\n   `aiui validate --strict`.\n2. Replace `mkdocs build` with `aiui build --output site --minify` in your CI workflow.\n3. Check the pages for the unsupported syntax listed above.\n4. Push to `main`.\n\n## Local preview\n\n```bash\naiui dev     # build, serve on http://127.0.0.1:8000, reload the browser on save\n```\n\nSee [Hot Reload](../features/hot-reload.md).\n\n## Build output\n\n`aiui build --output site` produces:\n\n```\nsite/\n├── index.html           # single-page app entry\n├── 404.html             # copy of index.html, so GitHub Pages serves deep links\n├── .nojekyll            # tells GitHub Pages not to run Jekyll\n├── assets/              # JS and CSS bundles\n├── aiui-manifest.json   # list of hashed bundle chunks\n├── ui-config.json       # site configuration manifest\n├── docs-nav.json        # navigation tree\n├── route-manifest.json  # route definitions\n├── robots.txt\n├── plugins/             # plugin-loader.js, plugins.json and the enabled legacy plugins\n└── docs/\n    ├── index.html       # one pre-rendered page per document (title, description)\n    ├── index.md         # the Markdown source, loaded by the app\n    └── ...\n```\n\nWith a site URL (`seo.siteUrl`, or the `CNAME` file) the build also writes\n`sitemap.xml`, `llms.txt` and `llms-full.txt`; see [SEO](../features/seo.md).\n\nEverything is static, so GitHub Pages serves it directly.\n\n## How pages load\n\nOpening a page from the sidebar fetches its `.md` file. A reader on a lossy\nnetwork (Wi-Fi, VPN, a mobile link) sometimes gets one new connection that\nhangs for 15 to 30 seconds while every other request is fast. The docs app\nkeeps one such request from freezing the page:\n\n- **Time limit and retry.** Each request for a page has 5 seconds to get an\n  answer from the server. Past that it is cancelled and a fresh request goes\n  out, which opens a new connection. There are three attempts (5 s, 5 s, then\n  10 s for a link that is only slow), with a short random pause between them.\n  A network error or a 5xx answer is retried the same way; a 404 is not.\n- **Stalled downloads.** Once the answer starts, a page whose download sends\n  nothing for 5 seconds has stalled and is requested again; one that keeps\n  arriving, however slowly, gets up to 15 seconds.\n- **Prefetch.** Resting the pointer on a sidebar, previous / next or\n  in-article docs link for 80 ms, focusing it with the keyboard, or pressing\n  it starts loading that page. Once a page has shown, its previous and next\n  pages load while the browser is idle.\n- **In-memory cache.** A page loaded or prefetched once shows at once when you\n  come back to it, without a request, until the tab is reloaded.\n- **The last click wins.** Clicking another link cancels the request for the\n  page you left, so fast clicking never builds a queue.\n- **No long wait for the renderer.** A fetched page waits at most one second\n  for the code highlighter and math renderer; after that the text shows and\n  upgrades when they arrive.\n- **Retry state.** When every attempt fails, the page says \"Couldn't load this\n  page\" with a **Retry** button instead of a loading skeleton.\n- **First load.** Every page `aiui build` writes carries the navigation\n  (`docs-nav.json`), the route manifest and the page's own Markdown, so a first\n  visit asks for none of them; `ui-config.json` is preloaded with the page (a\n  live `aiui serve` adds Ask AI, MCP and feedback to it, so it is not baked in).\n  The loader's tag names the plugins, so `plugins/plugins.json` is not\n  requested either: on this site a first docs page went from five JSON requests\n  and three plugin scripts to one and two. A file the page does not carry (a\n  navigation over 100 KB, the navigation of a site with\n  [sign-in](../features/docs-auth.md), a page served without its content)\n  loads with the same time limit and retries as a page. If it cannot load, the\n  page says \"Couldn't load the docs\" with a **Retry** button instead of\n  staying blank.\n\nThis site, https://ui.praison.ai, is built the same way: see\n[`.github/workflows/deploy-pages.yml`](https://github.com/MervinPraison/PraisonAIUI/blob/main/.github/workflows/deploy-pages.yml).\n\n## Legacy plugins\n\nThe docs app renders code (Shiki), mermaid diagrams, MkDocs tabs and\nadmonitions, \"On this page\" and the header tabs itself. By default a build\nloads only one of the vanilla plugins in `plugins/`:\n\n| Plugin | Why it loads |\n|---|---|\n| `nav-intercept` | Keeps in-article `/docs` links on in-app navigation (no full page load) |\n\n`fetch-retry` (retry a failed request for the site manifests) is no longer in\nthe default list: the app reads the navigation and route manifest from the\npage and fetches `ui-config.json` with its own time limit and retries, which\n`fetch-retry` leaves alone. List it under `site.plugins` to keep it.\n\n`mermaid`, `syntax-highlight`, `code-copy`, `toc`, `mkdocs-compat`,\n`content-loader`, `homepage` and `topnav` no longer load by default: they skip\nReact docs pages, and `mermaid` and `syntax-highlight` fetched about 40 files\nfrom cdn.jsdelivr.net and cdnjs.cloudflare.com on every page (each new origin\nis another connection that can stall). A site can still list any of them under\n`site.plugins` in `aiui.yaml`.\n\n`index.html` loads `plugins/plugin-loader.js?v=\u003cversion\u003e`, where the version\nis a hash of the plugin files in the build (also in `plugins/plugins.json`),\nand names the plugins on the same tag (`data-plugins`), so the loader does not\nfetch `plugins.json` (a server's pages, which lack it, still do).\nThe loader imports every plugin with the same `?v=`, so browsers and the CDN\ncache them until a build changes a plugin.\n"}</script>
