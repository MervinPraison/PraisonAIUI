<p>Complete reference for the <code>aiui</code> command-line interface.</p>
<h2>Core Commands</h2>
<h3>`aiui run`</h3>
<p><strong>The primary command</strong> — run an AI server with your <code>app.py</code> or <code>chat.yaml</code>.</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>FILE</code> | Python file (<code>app.py</code>) or YAML config (<code>chat.yaml</code>) | required |</p>
<p>| <code>--port, -p</code> | Server port | <code>8000</code> |</p>
<p>| <code>--host</code> | Bind address | <code>127.0.0.1</code> |</p>
<p>| <code>--reload</code> | Auto-reload on file changes | <code>false</code> |</p>
<p>| <code>--style, -s</code> | UI style: chat, dashboard, agents, playground, docs, custom | <code>chat</code> |</p>
<p>| <code>--backend</code> | AI backend: <code>praisonai</code>, <code>default</code> | <code>default</code> |</p>
<p>| <code>--workers</code> | Number of workers | <code>1</code> |</p>
<p>| <code>--ssl-certfile</code> | SSL certificate for HTTPS | — |</p>
<p>| <code>--ssl-keyfile</code> | SSL private key for HTTPS | — |</p>
<p><strong>Examples:</strong></p>
<h3>`aiui validate`</h3>
<p>Validate your configuration file.</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>--config, -c</code> | Path to config file | <code>aiui.template.yaml</code> |</p>
<p>| <code>--strict</code> | Enable strict validation | <code>false</code> |</p>
<p>---</p>
<h3>`aiui build`</h3>
<p>Build manifests from configuration (for docs/static site mode).</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>--config, -c</code> | Path to config file | <code>aiui.template.yaml</code> |</p>
<p>| <code>--output, -o</code> | Output directory | <code>aiui</code> |</p>
<p>| <code>--minify</code> | Minify JSON output | <code>false</code> |</p>
<p>---</p>
<h3>`aiui serve`</h3>
<p>Serve the built site locally with a production-ready HTTP server.</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>--config, -c</code> | Path to config file | <code>aiui.template.yaml</code> |</p>
<p>| <code>--port, -p</code> | Server port | <code>8000</code> |</p>
<p>| <code>--host</code> | Bind address | <code>127.0.0.1</code> |</p>
<p>| <code>--reload</code> | Watch for changes and rebuild | <code>false</code> |</p>
<p>| <code>--style, -s</code> | UI style override | auto-detected |</p>
<p>| <code>--ssl-certfile</code> | SSL certificate for HTTPS | — |</p>
<p>| <code>--ssl-keyfile</code> | SSL private key for HTTPS | — |</p>
<p>---</p>
<h3>`aiui dev`</h3>
<p>Development dashboard — switch between examples live.</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>--examples, -e</code> | Directory containing example projects | <code>examples</code> |</p>
<p>| <code>--port, -p</code> | Port for dev server | <code>9000</code> |</p>
<p>---</p>
<h3>`aiui doctor`</h3>
<p>Run structured diagnostics against a running AIUI server.</p>
<p>| Option | Description | Default |</p>
<p>|--------|-------------|---------|</p>
<p>| <code>--server, -s</code> | Server URL to diagnose | <code>http://127.0.0.1:8000</code> |</p>
<p>| <code>--json</code> | Output results as JSON | <code>false</code> |</p>
<p>Checks: health, provider, gateway, features, config, datastore, channels.</p>
<p>---</p>
<h3>`aiui test`</h3>
<p>Run integration tests against a running server.</p>
<p>| Suite | Description |</p>
<p>|-------|-------------|</p>
<p>| <code>chat</code> | Chat WebSocket send/receive |</p>
<p>| <code>memory</code> | Memory CRUD operations |</p>
<p>| <code>sessions</code> | Session management |</p>
<p>| <code>endpoints</code> | API endpoint availability |</p>
<p>| <code>all</code> | Run all test suites |</p>
<p>---</p>
<h2>Management Commands</h2>
<p>All management commands connect to a running server (default <code>http://127.0.0.1:8000</code>). Use <code>--server URL</code> to target a different server.</p>
<h3>`aiui sessions`</h3>
<h3>`aiui memory`</h3>
<h3>`aiui skills`</h3>
<h3>`aiui provider`</h3>
<h3>`aiui config`</h3>
<h3>`aiui schedule`</h3>
<h3>`aiui approval`</h3>
<h3>`aiui workflows`</h3>
<h3>`aiui hooks`</h3>
<h3>`aiui eval`</h3>
<h3>`aiui traces`</h3>
<h3>`aiui pages`</h3>
<h3>`aiui features`</h3>
<h3>`aiui health-check`</h3>
<p>Check server health. Can also be invoked as <code>aiui health</code> for convenience.</p>
<h3>`aiui session-ext`</h3>
<p>Extended session operations:</p>
<p>---</p>
<h2>Exit Codes</h2>
<p>| Code | Meaning |</p>
<p>|------|---------|</p>
<p>| <code>0</code> | Success |</p>
<p>| <code>1</code> | Configuration error |</p>
<p>| <code>2</code> | File not found |</p>
<p>| <code>3</code> | Build error |</p>
<h2>Environment Variables</h2>
<p>| Variable | Description | Default |</p>
<p>|----------|-------------|---------|</p>
<p>| <code>OPENAI_API_KEY</code> | OpenAI API key | — |</p>
<p>| <code>PRAISONAI_MODEL</code> | Default model | <code>gpt-4o-mini</code> |</p>
<p>| <code>AIUI_DATA_DIR</code> | Data directory | <code>~/.praisonaiui</code> |</p>
<p>| <code>AIUI_CONFIG</code> | Config file path | <code>aiui.template.yaml</code> |</p>
<p>| <code>AIUI_OUTPUT</code> | Build output dir | <code>aiui</code> |</p></noscript></div>
