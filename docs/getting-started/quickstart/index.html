></li><li><a href="https://ui.praison.ai/docs/protocols/adp/aiui-mapping">PraisonAIUI → ADP Field Mapping</a></li><li><a href="https://ui.praison.ai/docs/protocols/adp/implementation-status">ADP Implementation Status</a></li><li><a href="https://ui.praison.ai/docs/protocols/application-design-protocol-report">Application Design Protocol (ADP) — Research Report</a></li><li><a href="https://ui.praison.ai/docs/concepts/architecture">Architecture</a></li><li><a href="https://ui.praison.ai/docs/concepts/bootstrap">Bootstrap</a></li><li><a href="https://ui.praison.ai/docs/testing">Testing</a></li><li><a href="https://ui.praison.ai/docs/api/testing">API Testing Guide</a></li><li><a href="https://ui.praison.ai/docs/adr">Architecture decisions</a></li><li><a href="https://ui.praison.ai/docs/adr/replay-view-clean-room">ADR 0001: PraisonAI Replay view, a clean-room design</a></li><li><a href="https://ui.praison.ai/docs/adr/react-app-shell-and-plugin-sdk">ADR 0002: One React app shell and a plugin SDK, migrated from the vanilla dashboard by strangler</a></li><li><a href="https://ui.praison.ai/docs/adr/selectable-layouts">ADR 0003: Selectable layouts, a first-party plugin kind</a></li></ul></nav><h1>Quick Start</h1>
<p>Run a chat app, connect it to a model, then try the other UI styles and layouts.</p>
<h2>Install</h2>
<p>Python 3.10 or higher:</p>
<h2>1. A chat app</h2>
<p>Create <code>app.py</code>:</p>
<p>Run it:</p>
<p>Open http://127.0.0.1:8000 and send a message.</p>
<p>&lt;Tip&gt;</p>
<p>If port 8000 is taken, <code>aiui run</code> picks the next free port and prints the URL</p>
<p>it used.</p>
<p>&lt;/Tip&gt;</p>
<p>An app that only has a <code>@aiui.reply</code> callback opens in the React app shell</p>
<p>(<code>style: app</code>) in its <code>chat</code> layout: the chat, with your conversations and the</p>
<p>other pages in the sidebar. The same app is</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/01-chat/app.py"><code>examples/python/01-chat</code></a>.</p>
<h2>2. Reply with a model</h2>
<p>Stream tokens from any client library with <code>aiui.stream_token()</code>. With OpenAI</p>
<p>(<code>pip install openai</code>), set your key first:</p>
<p>&lt;Tabs&gt;</p>
<p>&lt;Tab title="macOS and Linux"&gt;</p>
<p>&lt;/Tab&gt;</p>
<p>&lt;Tab title="Windows"&gt;</p>
<p>Then open a new terminal.</p>
<p>&lt;/Tab&gt;</p>
<p>&lt;/Tabs&gt;</p>
<p><code>aiui run</code> also reads a <code>.env</code> file in the current folder (and</p>
<p><code>~/.praisonai/.env</code>) without overriding variables already set.</p>
<p><a href="https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/03-chat-with-ai/app.py"><code>examples/python/03-chat-with-ai</code></a></p>
<p>adds conversation history, a welcome message and starters.</p>
<h2>3. Other layouts and the classic chat</h2>
<p>The app shell has selectable layouts. Pick one per run with <code>AIUI_LAYOUT</code>, or</p>
<p>in the app with <code>aiui.set_layout()</code>:</p>
<p>See React app shell and</p>
<p>Layouts for every layout.</p>
<h2>4. Add a dashboard page</h2>
<p>Register a page with <code>@aiui.page</code>. An app with pages opens in the <code>dashboard</code></p>
<p>style, with your page in the sidebar next to the built-in ones:</p>
<p>How the style is chosen: <code>--style</code> on the command line wins, then</p>
<p><code>aiui.set_style()</code> in the app. Without either, <code>aiui run</code> looks at the</p>
<p>callbacks: <code>@aiui.page</code> gives <code>dashboard</code>, <code>@aiui.profiles</code> plus registered</p>
<p>agents gives <code>agents</code>, and anything else the app shell. See</p>
<p>UI Styles.</p>
<h2>5. A chat agent from YAML</h2>
<p>A YAML file can define the agent without Python. It runs on PraisonAI Agents,</p>
<p>so install that first: <code>pip install praisonaiagents</code> (or the full</p>
<p><code>pip install "aiui[praisonai]"</code>), and set <code>OPENAI_API_KEY</code>.</p>
<h2>6. A documentation site</h2>
<p><code>aiui build</code> turns a folder of Markdown into a static site:</p>
<p>Open http://127.0.0.1:8000/docs/. To publish it, see</p>
<p>Deploy to GitHub Pages.</p>
<h2>If something is wrong</h2>
<p>&lt;Warning&gt;</p>
<p>Never paste an API key into <code>app.py</code> or <code>aiui.yaml</code>: read it from the</p>
<p>environment, as above.</p>
<p>&lt;/Warning&gt;</p>

<p>&lt;/CardGroup&gt;</p></noscript></div><script type="application/json" id="aiui-initial-doc">{"url": "/docs/getting-started/quickstart.source.md", "text": "# Quick Start\n\nRun a chat app, connect it to a model, then try the other UI styles and layouts.\n\n## Install\n\nPython 3.10 or higher:\n\n```bash\npip install aiui\n```\n\n## 1. A chat app\n\nCreate `app.py`:\n\n```python title=\"app.py\"\nimport praisonaiui as aiui\n\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}\")\n```\n\nRun it:\n\n```bash\naiui run app.py\n```\n\nOpen http://127.0.0.1:8000 and send a message.\n\n\u003cTip\u003e\nIf port 8000 is taken, `aiui run` picks the next free port and prints the URL\nit used.\n\u003c/Tip\u003e\n\nAn app that only has a `@aiui.reply` callback opens in the React app shell\n(`style: app`) in its `chat` layout: the chat, with your conversations and the\nother pages in the sidebar. The same app is\n[`examples/python/01-chat`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/01-chat/app.py).\n\n## 2. Reply with a model\n\nStream tokens from any client library with `aiui.stream_token()`. With OpenAI\n(`pip install openai`), set your key first:\n\n\u003cTabs\u003e\n\u003cTab title=\"macOS and Linux\"\u003e\n```bash\nexport OPENAI_API_KEY=sk-...\n```\n\u003c/Tab\u003e\n\u003cTab title=\"Windows\"\u003e\n```powershell\nsetx OPENAI_API_KEY sk-...\n```\n\nThen open a new terminal.\n\u003c/Tab\u003e\n\u003c/Tabs\u003e\n\n```python title=\"app.py\" {9,14-16}\nimport praisonaiui as aiui\nfrom openai import AsyncOpenAI\n\nclient = AsyncOpenAI()  # reads OPENAI_API_KEY\n\n\n@aiui.reply\nasync def on_message(message: str):\n    stream = await client.chat.completions.create(\n        model=\"gpt-4o-mini\",\n        messages=[{\"role\": \"user\", \"content\": message}],\n        stream=True,\n    )\n    async for chunk in stream:\n        if chunk.choices and chunk.choices[0].delta.content:\n            await aiui.stream_token(chunk.choices[0].delta.content)\n```\n\n`aiui run` also reads a `.env` file in the current folder (and\n`~/.praisonai/.env`) without overriding variables already set.\n[`examples/python/03-chat-with-ai`](https://github.com/MervinPraison/PraisonAIUI/blob/main/examples/python/03-chat-with-ai/app.py)\nadds conversation history, a welcome message and starters.\n\n## 3. Other layouts and the classic chat\n\nThe app shell has selectable layouts. Pick one per run with `AIUI_LAYOUT`, or\nin the app with `aiui.set_layout()`:\n\n```bash\nAIUI_LAYOUT=chat-canvas aiui run app.py   # the chat beside a canvas of artifacts\nAIUI_LAYOUT=workbench aiui run app.py     # a quiet sidebar of chats\naiui run app.py --style chat              # the classic chat style instead of the app shell\n```\n\nSee [React app shell](../features/react-shell.md) and\n[Layouts](../features/layouts.md) for every layout.\n\n## 4. Add a dashboard page\n\nRegister a page with `@aiui.page`. An app with pages opens in the `dashboard`\nstyle, with your page in the sidebar next to the built-in ones:\n\n```python title=\"app.py\"\nimport praisonaiui as aiui\n\n\n@aiui.reply\nasync def on_message(message: str):\n    await aiui.say(f\"You said: {message}\")\n\n\n@aiui.page(\"metrics\", title=\"Metrics\", icon=\"📊\")\nasync def metrics():\n    return aiui.layout([\n        aiui.columns([\n            aiui.card(\"Users\", value=1234),\n            aiui.card(\"Uptime\", value=\"99.9%\", footer=\"last 30 days\"),\n        ]),\n        aiui.table(headers=[\"Name\", \"Value\"], rows=[[\"Alpha\", 100], [\"Beta\", 200]]),\n    ])\n```\n\nHow the style is chosen: `--style` on the command line wins, then\n`aiui.set_style()` in the app. Without either, `aiui run` looks at the\ncallbacks: `@aiui.page` gives `dashboard`, `@aiui.profiles` plus registered\nagents gives `agents`, and anything else the app shell. See\n[UI Styles](../features/styles.md).\n\n## 5. A chat agent from YAML\n\nA YAML file can define the agent without Python. It runs on PraisonAI Agents,\nso install that first: `pip install praisonaiagents` (or the full\n`pip install \"aiui[praisonai]\"`), and set `OPENAI_API_KEY`.\n\n```yaml title=\"chat.yaml\"\nname: My Assistant\ninstructions: You are a helpful assistant. Be concise.\nmodel: gpt-4o-mini\nwelcome: \"Hi! How can I help you today?\"\nstarters:\n  - label: \"What can you do?\"\n    message: \"Tell me about your capabilities\"\n```\n\n```bash\naiui run chat.yaml\n```\n\n## 6. A documentation site\n\n`aiui build` turns a folder of Markdown into a static site:\n\n```bash\naiui init --template docs        # writes aiui.yaml\nmkdir docs \u0026\u0026 echo \"# Hello\" \u003e docs/index.md\naiui serve                       # builds into ./aiui, then serves it\n```\n\nOpen http://127.0.0.1:8000/docs/. To publish it, see\n[Deploy to GitHub Pages](github-pages.md).\n\n## If something is wrong\n\n\u003cWarning\u003e\nNever paste an API key into `app.py` or `aiui.yaml`: read it from the\nenvironment, as above.\n\u003c/Warning\u003e\n\nWith the server running, in another terminal:\n\n```bash\naiui doctor                    # structured diagnostics\naiui health --detailed         # per-feature health\n```\n\n## Next steps\n\n\u003cCardGroup cols={3}\u003e\n\u003cCard title=\"CLI\" icon=\"terminal\" href=\"cli.md\"\u003e\nThe commands you will use most.\n\u003c/Card\u003e\n\u003cCard title=\"Python API\" icon=\"code\" href=\"../api/python.md\"\u003e\nDecorators, message functions and the `set_*` setters.\n\u003c/Card\u003e\n\u003cCard title=\"Configuration\" icon=\"book-open\" href=\"../concepts/configuration.md\"\u003e\nEverything the YAML file can say.\n\u003c/Card\u003e\n\u003c/CardGroup\u003e\n"}</script>
