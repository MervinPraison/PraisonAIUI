# yaml-language-server: $schema=https://ui.praison.ai/aiui.schema.json
schemaVersion: 1

site:
  title: "PraisonAIUI"
  description: "A web UI for AI agents in Python: streaming chat, an artifacts canvas, selectable layouts, a dashboard and docs sites."
  ui: "shadcn"
  theme:
    # The Paper look of the app's Chat + Canvas screen; light or dark follows the OS.
    preset: "paper"
    radius: "md"
    mode: "system"

seo:
  siteUrl: "https://ui.praison.ai"
  titleTemplate: "%s | %s"
  defaultImage: "/icon.svg"
  robots:
    index: true
    follow: true

# The sidebar is built from these groups, in this order
# (content.docs.nav.mode: manual). A page is named by its route
# ("features/layouts") or its file path without .md ("adr/0001-...").
navigation:
  tabs:
    - tab: "Get Started"
      groups:
        - group: "Start Here"
          icon: rocket
          pages:
            - index
            - getting-started/installation
            - getting-started/quickstart
            - features/styles
            - getting-started/cli
        - group: "Step-by-Step Learning Path"
          icon: graduation-cap
          pages:
            - tutorials/01-first-chat
            - tutorials/02-connect-ai
            - tutorials/03-welcome-and-starters
            - tutorials/04-steps-and-tools
            - tutorials/05-rich-ui-and-pages
            - tutorials/06-theme-auth-deploy
        - group: "Examples"
          icon: code
          pages:
            - examples/basic
            - examples/advanced
    - tab: "Chat UI"
      groups:
        - group: "Core Concepts"
          icon: message-square
          pages:
            - chat-ui/overview
            - chat-ui/lifecycle
            - chat-ui/messages-and-streaming
            - chat-ui/starters-and-profiles
            - features/steps
            - features/sessions
            - features/handler-context
        - group: "Canvas & Rich Media"
          icon: sparkles
          pages:
            - features/a2ui-canvas
            - features/message-elements
            - features/attachments
            - features/image-preview-chat
            - features/media-analysis
        - group: "Agents, Tools & Voice"
          icon: bot
          pages:
            - features/gateway-chat
            - features/approvals
            - features/subagent-tree
            - features/code-execution
            - features/model-fallback
            - features/mcp
            - features/tts
            - features/realtime-voice-input
        - group: "Integrations"
          icon: zap
          pages:
            - concepts/providers
            - features/praisonai-package-integration
            - features/standalone-vs-integrated
            - features/backend-integration
            - features/workflows-and-openai-api
    - tab: "App & Dashboard"
      groups:
        - group: "App Shell & Pages"
          icon: panels-top-left
          pages:
            - app-ui/overview
            - features/react-shell
            - guides/focused-app
            - guides/server-pages
            - features/notifications
            - group: "Layouts"
              pages:
                - features/layouts
                - features/layouts/chat-canvas
                - features/layouts/workbench
                - features/layouts/command
                - features/layouts/guided
                - features/layouts/mission
                - features/layout-data
        - group: "Built-in Dashboard"
          icon: layout-dashboard
          pages:
            - features/dashboard
            - features/agents-memory-skills
            - features/schedules-and-jobs
            - features/observability-and-guardrails
            - features/agent-ui-host
            - features/replay
            - features/video-studio
            - features/browser-automation
            - features/channel-chat-bridge
            - features/device-pairing
            - features/knowledge-embeddings
            - features/config-hot-reload
            - features/pwa
        - group: "Theming & Plugins"
          icon: palette
          pages:
            - features/theming
            - features/theme-system
            - features/dark-mode
            - features/css-architecture
            - features/plugins
            - features/marketplace
            - features/how-to-add-a-feature
        - group: "Deploy & Security"
          icon: shield-check
          pages:
            - features/deployment
            - features/connect
            - health-endpoints
    - tab: "UI Components"
      groups:
        - group: "Component Gallery"
          icon: component
          pages:
            - components/overview
            - components/layout
            - components/data-display
            - components/inputs-and-forms
            - components/feedback-and-notifications
            - components/media-and-content
    - tab: "A2UI"
      groups:
        - group: "Start with A2UI"
          icon: sparkles
          pages:
            - a2ui/overview
            - a2ui/quickstart
        - group: "Building Surfaces"
          icon: layout-grid
          pages:
            - a2ui/components
            - a2ui/data-binding-and-actions
            - a2ui/settings-and-pages
        - group: "Try Everything"
          icon: play
          pages:
            - a2ui/all-in-one-playground
            - features/a2ui-canvas
    - tab: "Docs UI"
      groups:
        - group: "Start Building Docs"
          icon: book-open
          pages:
            - docs-ui/overview
            - features/writing-docs
            - features/content-sources
            - features/navigation
            - getting-started/github-pages
        - group: "Layout & Customization"
          icon: layers
          pages:
            - concepts/templates
            - concepts/slots
            - features/widget-zones
            - features/hot-reload
            - features/i18n
        - group: "API Docs, SEO & Auth"
          icon: globe
          pages:
            - features/openapi
            - features/api-reference-python
            - features/seo
            - features/redirects
            - features/ai-ready-docs
            - features/analytics
            - features/docs-auth
            - features/content-security-policy
    - tab: "Reference"
      groups:
        - group: "Reference"
          icon: terminal
          pages:
            - api/index
            - api/cli
            - api/python
            - concepts/configuration
            - api/components
            - api/features-api
            - features/api-reference
            - api/sessions
            - api/health
        - group: "TypeScript"
          icon: code
          pages:
            - typescript/index
            - typescript/runtime
            - typescript/nextjs
            - typescript/components
            - api/typescript
        - group: "Protocols"
          icon: bot
          pages:
            - features/protocols
            - features/protocol-architecture
            - features/protocol-versioning
            - group: "Application Design Protocol"
              pages:
                - protocols/adp/README
                - protocols/adp/spec
                - protocols/adp/validation-rules
                - protocols/adp/aiui-mapping
                - protocols/adp/implementation-status
                - protocols/application-design-protocol-report
    - tab: "Project"
      groups:
        - group: "Project"
          pages:
            - concepts/architecture
            - concepts/bootstrap
            - testing
            - api/testing
        - group: "Decisions"
          pages:
            - adr/index
            - adr/0001-replay-view-clean-room
            - adr/0002-react-app-shell-and-plugin-sdk
            - adr/0003-selectable-layouts


# Navbar actions
navbar:
  primary:
    type: "button"
    label: "Quick start"
    href: "/docs/getting-started/quickstart"
  links:
    - label: "Changelog"
      href: "https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md"
    - label: "GitHub"
      href: "https://github.com/MervinPraison/PraisonAIUI"

# Footer
footer:
  socials:
    github: "https://github.com/MervinPraison/PraisonAIUI"
    x: "https://x.com/MervinPraison"
    youtube: "https://youtube.com/@MervinPraison"
  links:
    - header: "PraisonAIUI"
      items:
        - label: "GitHub"
          href: "https://github.com/MervinPraison/PraisonAIUI"
        - label: "PyPI"
          href: "https://pypi.org/project/aiui/"
        - label: "Changelog"
          href: "https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md"
    - header: "PraisonAI"
      items:
        - label: "PraisonAI docs"
          href: "https://docs.praison.ai"
        - label: "PraisonAI on GitHub"
          href: "https://github.com/MervinPraison/PraisonAI"
    - header: "Community"
      items:
        - label: "Twitter"
          href: "https://x.com/MervinPraison"
        - label: "YouTube"
          href: "https://youtube.com/@MervinPraison"

# Search
search:
  enabled: true
  provider: "fusejs"

content:
  docs:
    dir: "./docs"
    # The page footer: "Edit this page", the last commit's date and
    # "Was this page helpful?" (a "No" opens an issue; nothing is stored).
    editLink:
      pattern: "https://github.com/MervinPraison/PraisonAIUI/edit/main/docs/:path"
    lastUpdated: true
    feedback:
      issues: "https://github.com/MervinPraison/PraisonAIUI/issues/new"
    include:
      - "**/*.md"
      - "**/*.mdx"
    # Internal analysis and working notes stay in the repository, off the site.
    exclude:
      - "features/gap-analysis.md"
      - "features/comparison-openclaw.md"
      - "features/standardization-verification.md"
      - "features/integration-analysis.md"
      - "features/feature-inventory.md"
      - "features/differentiation.md"
      - "features/beautifului-integration.md"
      - "frontend/*"
      - "reports/*"
    nav:
      mode: manual

templates:
  docs:
    layout: "ThreeColumnLayout"
    slots:
      header: { ref: "header_main" }
      left: { ref: "sidebar_docs" }
      main: { type: "DocContent" }
      footer: { ref: "footer_main" }

components:
  header_main:
    type: "Header"
    props:
      logoText: "PraisonAIUI"

  footer_main:
    type: "Footer"
    props:
      text: "© 2026 PraisonAI"

  sidebar_docs:
    type: "DocsSidebar"
    props:
      source: "docs-nav"

routes:
  - match: "/docs/**"
    template: "docs"
