# yaml-language-server: $schema=https://ui.praison.ai/aiui.schema.json
schemaVersion: 1

site:
  title: "PraisonAIUI"
  description: "A web UI for AI agents in Python: streaming chat, an artifacts canvas, selectable layouts, a dashboard and docs sites."
  ui: "shadcn"
  theme:
    # The Paper look of the app's Chat + Canvas screen; light or dark follows the OS.
    preset: "paper"
    radius: "md"
    mode: "system"

seo:
  siteUrl: "https://ui.praison.ai"
  titleTemplate: "%s | %s"
  defaultImage: "/icon.svg"
  robots:
    index: true
    follow: true

# The sidebar is built from these groups, in this order
# (content.docs.nav.mode: manual). A page is named by its route
# ("features/layouts") or its file path without .md ("adr/0001-...").
navigation:
  tabs:
    - tab: "Get started"
      groups:
        - group: "Get started"
          icon: rocket
          pages:
            - index
            - getting-started/installation
            - getting-started/quickstart
            - getting-started/cli
            - getting-started/github-pages
        - group: "Examples"
          icon: code
          pages:
            - examples/basic
            - examples/advanced
    - tab: "Guides"
      groups:
        - group: "App and layouts"
          icon: panels-top-left
          pages:
            - features/styles
            - features/react-shell
            - group: "Layouts"
              pages:
                - features/layouts
                - features/layouts/chat-canvas
                - features/layouts/workbench
                - features/layouts/command
                - features/layouts/guided
                - features/layouts/mission
                - features/layout-data
        - group: "Chat"
          icon: message-square
          pages:
            - features/gateway-chat
            - features/sessions
            - features/attachments
            - features/message-elements
            - features/image-preview-chat
            - features/steps
            - features/a2ui-canvas
            - features/code-execution
            - features/model-fallback
            - features/subagent-tree
            - features/tts
            - features/media-analysis
        - group: "Theming"
          icon: palette
          pages:
            - features/theming
            - features/theme-system
            - features/dark-mode
            - features/css-architecture
        - group: "Plugins"
          icon: plug
          pages:
            - features/plugins
            - features/marketplace
            - features/how-to-add-a-feature
        - group: "Dashboard"
          icon: layout-dashboard
          pages:
            - features/dashboard
            - features/agent-ui-host
            - features/replay
            - features/video-studio
            - features/browser-automation
            - features/channel-chat-bridge
            - features/device-pairing
            - features/pwa
            - features/config-hot-reload
            - features/knowledge-embeddings
        - group: "Docs sites"
          icon: book-open
          pages:
            - features/writing-docs
            - features/content-sources
            - features/navigation
            - features/openapi
            - concepts/templates
            - concepts/slots
            - features/widget-zones
            - features/seo
            - features/redirects
            - features/ai-ready-docs
            - features/i18n
            - features/hot-reload
        - group: "Integrations"
          icon: zap
          pages:
            - concepts/providers
            - features/praisonai-package-integration
            - features/standalone-vs-integrated
            - features/backend-integration
        - group: "Deployment and security"
          icon: shield-check
          pages:
            - features/deployment
            - health-endpoints
    - tab: "Reference"
      groups:
        - group: "Reference"
          icon: terminal
          pages:
            - api/index
            - api/cli
            - api/python
            - concepts/configuration
            - api/components
            - api/features-api
            - api/sessions
            - api/health
        - group: "TypeScript"
          icon: code
          pages:
            - typescript/index
            - typescript/runtime
            - typescript/nextjs
            - typescript/components
            - api/typescript
        - group: "Protocols"
          icon: bot
          pages:
            - features/protocols
            - features/protocol-architecture
            - features/protocol-versioning
            - group: "Application Design Protocol"
              pages:
                - protocols/adp/README
                - protocols/adp/spec
                - protocols/adp/validation-rules
                - protocols/adp/aiui-mapping
                - protocols/adp/implementation-status
                - protocols/application-design-protocol-report
    - tab: "Project"
      groups:
        - group: "Project"
          pages:
            - concepts/architecture
            - concepts/bootstrap
            - testing
            - api/testing
        - group: "Decisions"
          pages:
            - adr/index
            - adr/0001-replay-view-clean-room
            - adr/0002-react-app-shell-and-plugin-sdk
            - adr/0003-selectable-layouts


# Navbar actions
navbar:
  primary:
    type: "button"
    label: "Quick start"
    href: "/docs/getting-started/quickstart"
  links:
    - label: "Changelog"
      href: "https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md"
    - label: "GitHub"
      href: "https://github.com/MervinPraison/PraisonAIUI"

# Footer
footer:
  socials:
    github: "https://github.com/MervinPraison/PraisonAIUI"
    x: "https://x.com/MervinPraison"
    youtube: "https://youtube.com/@MervinPraison"
  links:
    - header: "PraisonAIUI"
      items:
        - label: "GitHub"
          href: "https://github.com/MervinPraison/PraisonAIUI"
        - label: "PyPI"
          href: "https://pypi.org/project/aiui/"
        - label: "Changelog"
          href: "https://github.com/MervinPraison/PraisonAIUI/blob/main/CHANGELOG.md"
    - header: "PraisonAI"
      items:
        - label: "PraisonAI docs"
          href: "https://docs.praison.ai"
        - label: "PraisonAI on GitHub"
          href: "https://github.com/MervinPraison/PraisonAI"
    - header: "Community"
      items:
        - label: "Twitter"
          href: "https://x.com/MervinPraison"
        - label: "YouTube"
          href: "https://youtube.com/@MervinPraison"

# Search
search:
  enabled: true
  provider: "fusejs"

content:
  docs:
    dir: "./docs"
    # The page footer: "Edit this page", the last commit's date and
    # "Was this page helpful?" (a "No" opens an issue; nothing is stored).
    editLink:
      pattern: "https://github.com/MervinPraison/PraisonAIUI/edit/main/docs/:path"
    lastUpdated: true
    feedback:
      issues: "https://github.com/MervinPraison/PraisonAIUI/issues/new"
    include:
      - "**/*.md"
      - "**/*.mdx"
    # Internal analysis and working notes stay in the repository, off the site.
    exclude:
      - "features/gap-analysis.md"
      - "features/comparison-openclaw.md"
      - "features/standardization-verification.md"
      - "features/integration-analysis.md"
      - "features/feature-inventory.md"
      - "features/differentiation.md"
      - "features/beautifului-integration.md"
      - "frontend/*"
      - "reports/*"
    nav:
      mode: manual

templates:
  docs:
    layout: "ThreeColumnLayout"
    slots:
      header: { ref: "header_main" }
      left: { ref: "sidebar_docs" }
      main: { type: "DocContent" }
      footer: { ref: "footer_main" }

components:
  header_main:
    type: "Header"
    props:
      logoText: "PraisonAIUI"

  footer_main:
    type: "Footer"
    props:
      text: "© 2026 PraisonAI"

  sidebar_docs:
    type: "DocsSidebar"
    props:
      source: "docs-nav"

routes:
  - match: "/docs/**"
    template: "docs"
