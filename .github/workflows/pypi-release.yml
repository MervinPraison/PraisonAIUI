name: PyPI Release

# Requires GitHub Environment "pypi" (manual) or "pypi-auto" (ci/nightly patch).
# Secrets: PYPI_TOKEN (or PYPI_API_TOKEN), GH_TOKEN
#
# Order matters (tests/unit/test_release_workflow.py pins it):
#   1. check out inputs.trigger_sha (or main) and refuse unless it is still
#      origin/main with a green CI run (.github/scripts/release-gate.js verify-sha);
#   2. bump, lock, build;
#   3. push the "Release vX.Y.Z" commit and tag to main (no rebase: if main
#      moved, the push is rejected and nothing is published);
#   4. only then `uv publish`, wait for PyPI, create the GitHub release.
# A failed publish after step 3 leaves main at X.Y.Z without the package:
# re-dispatch with `-f version=X.Y.Z` to publish that version.

# The release gate does not count a dry run as "released today": it looks for
# the "[dry run]" marker (release-gate.js DRY_RUN_MARKER) in this title.
run-name: >-
  ${{ inputs.dry_run && format('PyPI Release [dry run] {0}', inputs.bump)
      || format('PyPI Release {0} ({1})', inputs.bump, inputs.source) }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type for aiui'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Preview versions and steps without publishing or pushing'
        required: false
        default: false
        type: boolean
      version:
        description: 'Override version (empty = auto bump from pyproject.toml)'
        required: false
        default: ''
        type: string
      source:
        description: 'Trigger source (audit trail)'
        required: false
        default: manual
        type: string
      trigger_sha:
        description: 'SHA that triggered this release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: >-
      ${{
        (inputs.source == 'ci' || inputs.source == 'nightly') &&
        inputs.bump == 'patch' &&
        'pypi-auto' || 'pypi'
      }}
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN || secrets.PYPI_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PACKAGE: aiui
    steps:
      - name: Release audit
        run: |
          echo "Source: ${{ inputs.source }}"
          echo "Trigger SHA: ${{ inputs.trigger_sha }}"
          echo "Bump: ${{ inputs.bump }}"
          echo "Environment: ${{ (inputs.source == 'ci' || inputs.source == 'nightly') && inputs.bump == 'patch' && 'pypi-auto' || 'pypi' }}"

      # The gate verified CI on trigger_sha; build exactly that commit, never
      # whatever main became while this run waited in the queue or for approval.
      - name: Checkout the release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.trigger_sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Configure git
        run: |
          git config user.name "MervinPraison"
          git config user.email "454862+MervinPraison@users.noreply.github.com"
          gh auth setup-git

      # Runs on dry runs too, so a preview says whether the release would go.
      - name: Verify the release commit is main with green CI
        env:
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          git fetch -q origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          CI_RUNS_JSON="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
            --commit "${HEAD_SHA}" --event push --limit 5 --json status,conclusion)"
          export HEAD_SHA MAIN_SHA CI_RUNS_JSON
          node .github/scripts/release-gate.js verify-sha

      - name: Compute release version
        id: versions
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          python <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
          bump = os.environ["BUMP"]
          override = os.environ.get("VERSION_OVERRIDE", "").strip()

          def bump_version(version: str) -> str:
              parts = version.split(".")
              if len(parts) != 3:
                  print(f"Invalid version: {version}", file=sys.stderr)
                  sys.exit(1)
              maj, min_, patch = (int(parts[0]), int(parts[1]), int(parts[2]))
              if bump == "major":
                  return f"{maj + 1}.0.0"
              if bump == "minor":
                  return f"{maj}.{min_ + 1}.0"
              return f"{maj}.{min_}.{patch + 1}"

          pyproject = Path("pyproject.toml")
          content = pyproject.read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', content, re.MULTILINE)
          if not match:
              print("Could not read version from pyproject.toml", file=sys.stderr)
              sys.exit(1)
          current = match.group(1)
          if not SEMVER.match(current):
              print(f"Invalid current version: {current}", file=sys.stderr)
              sys.exit(1)
          if override:
              if not SEMVER.match(override):
                  print(f"Invalid version override: {override}", file=sys.stderr)
                  sys.exit(1)
              new_version = override
          else:
              new_version = bump_version(current)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"current_version={current}\n")
              fh.write(f"new_version={new_version}\n")
          print(f"aiui: {current} -> {new_version}")
          PY

      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "Dry run — no publish, commit, or push."
          echo "Package:  ${{ env.PACKAGE }}"
          echo "Version:  ${{ steps.versions.outputs.current_version }} -> ${{ steps.versions.outputs.new_version }}"
          echo "Would: bump pyproject.toml + __version__.py, uv publish, commit, tag, GitHub release"

      - name: Bump version files
        if: inputs.dry_run != true
        env:
          CURRENT: ${{ steps.versions.outputs.current_version }}
          NEW_VERSION: ${{ steps.versions.outputs.new_version }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          import re
          from pathlib import Path

          current = os.environ["CURRENT"]
          new = os.environ["NEW_VERSION"]

          pyproject = Path("pyproject.toml")
          content = pyproject.read_text()
          pyproject.write_text(content.replace(f'version = "{current}"', f'version = "{new}"', 1))

          version_py = Path("src/praisonaiui/__version__.py")
          vcontent = version_py.read_text()
          version_py.write_text(re.sub(
              r'__version__ = "[^"]+"',
              f'__version__ = "{new}"',
              vcontent,
              count=1,
          ))
          PY

      - name: Build aiui
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          rm -rf dist
          uv lock
          uv build

      # Before publishing: if this push fails (main moved, or the token cannot
      # push), PyPI is untouched and pyproject.toml on main still matches it.
      - name: Commit and tag the release on main
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.versions.outputs.new_version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git add pyproject.toml uv.lock src/praisonaiui/__version__.py
          if git diff --cached --quiet; then
            echo "Version files already at ${VERSION} (re-publishing a pushed release)"
          else
            git commit -m "Release ${TAG}"
          fi
          git tag -f "${TAG}"
          # Fast-forward only: never rebase the release onto commits CI has not
          # checked. --atomic: the commit and the tag land together or not at all.
          git push --atomic origin "HEAD:refs/heads/main" "+refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Publish aiui to PyPI
        if: inputs.dry_run != true
        run: uv publish

      - name: Wait for aiui on PyPI
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.new_version }}"
          MAX_WAIT=600
          INTERVAL=30
          START=$(date +%s)

          while true; do
            if curl -fsSL "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json" >/dev/null; then
              echo "✅ ${PACKAGE}==${VERSION} is available on PyPI"
              exit 0
            fi
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "❌ Timeout waiting for ${PACKAGE}==${VERSION} on PyPI"
              exit 1
            fi
            echo "⏳ Waiting for ${PACKAGE}==${VERSION} ($(( MAX_WAIT - ELAPSED ))s remaining...)"
            sleep "$INTERVAL"
          done

      - name: GitHub release
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.versions.outputs.new_version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --title "PraisonAIUI ${TAG}" \
              --notes "Release ${TAG}" \
              --latest
          fi

      - name: Verify release
        if: inputs.dry_run != true
        run: echo "✅ ${{ env.PACKAGE }}==${{ steps.versions.outputs.new_version }}"
