name: Pre-QA check

# Builds this repo's docs with the PR's code, serves them like production
# (max-age=600, ETag, gzip, 404.html) and runs the headless pre-QA tracker
# (tools/preqa). Advisory only: it never blocks a merge. A breach of
# tools/preqa/budgets.json (held, stalled or failed requests, console errors,
# skeleton time, bytes, request counts) shows as a warning annotation and in
# the uploaded report, so issues are seen and fixed early.
# Timing limits use the looser `ci` target.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "aiui.yaml"
      - "tools/preqa/**"
      - ".github/workflows/preqa.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preqa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preqa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIUI_NO_BROWSER: "1"
      BROWSER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/preqa/requirements.txt

      - name: Install aiui and the tracker
        id: pw-ver
        run: |
          pip install -e .
          pip install -r tools/preqa/requirements.txt
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: preqa-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: preqa-playwright-${{ runner.os }}-${{ steps.pw-ver.outputs.version }}

      - name: Install Chromium
        if: steps.preqa-pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.preqa-pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Build the docs site
        run: aiui build --output site --minify

      - name: Serve like production
        run: |
          (cd tools/preqa && python -m preqa serve --site ../../site --host 127.0.0.1 --port 8700 > ../../serve.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8700/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8700/ > /dev/null

      - name: Run the pre-QA tracker (advisory)
        working-directory: tools/preqa
        run: |
          if python -m preqa track --target ci=http://127.0.0.1:8700 \
              --runs 2 --fail-fast --history "" --out preqa-run.json; then
            echo "Pre-QA: PASS"
          else
            echo "::warning title=Pre-QA budget breach::See the preqa-report artifact. Advisory only; this does not block merging."
          fi

      - name: Dead idle connection check (advisory)
        working-directory: tools/preqa
        run: |
          # A page opened after the browser's connection died while idle (python -m preqa netfault).
          if python -m preqa netfault --upstream http://127.0.0.1:8700 --out netfault.json; then
            echo "Netfault: PASS"
          else
            echo "::warning title=Pre-QA dead-connection check::A docs page opened after an idle gap failed or was slow. See netfault.json in the preqa-report artifact. Advisory only."
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preqa-report
          path: |
            tools/preqa/preqa-run.json
            tools/preqa/netfault.json
            serve.log
          retention-days: 14
