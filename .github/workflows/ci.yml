name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check src/praisonaiui

      - name: Test with pytest
        # Unit tests are the primary CI contract; integration smoke validates backends.
        run: pytest tests/unit -v --no-cov --timeout=60

      - name: Integration smoke tests
        run: pytest tests/integration/test_agentic_roundtrip.py tests/test_feature_sdk_backends.py -q --no-cov --timeout=120

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request run checks out the merge commit; its first parent is
          # the base branch, which is what "did this PR touch the frontend" needs.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned: chunk file names are content hashes, and the bundle-sync
          # check compares them with the committed bundle.
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Type-check (app, then the Playwright specs)
        run: |
          npx tsc -b
          npm run typecheck:e2e
        working-directory: src/frontend

      - name: Unit tests
        run: |
          npm test
          npm run test:scripts
        working-directory: src/frontend

      - name: Lint the React shell
        run: npx eslint src/shell src/chat-engine src/markdown src/legacy src/sdk src/blocks src/builtin e2e
        working-directory: src/frontend

      # `npm run build` is the ship path: dist/ is synced to
      # src/praisonaiui/templates/frontend/ (see src/frontend/README.md).
      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Size budgets
        run: npm run size
        working-directory: src/frontend

      - name: Heavy libraries stay out of the first screen
        run: npm run check:closure
        working-directory: src/frontend

      # Only for pull requests that change the frontend source or the committed
      # bundle. Other PRs cannot make the two disagree, and must not fail
      # because an earlier merge did (the bundle-sync job below repairs that).
      - name: Does this pull request touch the frontend?
        id: touched
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^src/(frontend/|praisonaiui/templates/frontend/(assets/|index\.html$|icon\.svg$|aiui-(manifest|externals)\.json$))'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Committed bundle matches the build
        if: steps.touched.outputs.frontend == 'true'
        run: npm run check:bundle
        working-directory: src/frontend

  # Playwright in four parallel shards (playwright.config.ts: fullyParallel and
  # blob reports when CI is set), so the slowest job is about a quarter of the
  # serial run. e2e-report merges the shards' blob reports into one HTML report.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install the package
        run: pip install -e .[dev]

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      # The browser build is keyed by the lockfile (it pins @playwright/test).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/frontend/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: src/frontend

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      # The suites serve dist/ (never the committed bundle) from real servers
      # with a scripted provider. Legacy-parity screenshots compare against
      # e2e/__baseline__/<platform>/ and skip on a platform with no baseline:
      # only macOS baselines are committed so far, so on this runner the
      # screenshot comparison is not enforced yet (the DOM checks are). See
      # src/frontend/e2e/README.md for how to add the Linux baselines.
      - name: Playwright suites (shard ${{ matrix.shard }}/4)
        run: npx playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/4
        working-directory: src/frontend
        env:
          AIUI_E2E_PYTHON: python

      # Python checks the python job has to skip: the runtime leak probe of the
      # legacy views (WP5's gate; needs a browser) and the React-export coverage
      # of the import-map shims (needs src/frontend/node_modules). Once, in shard 1.
      - name: Runtime leak probe and React-export coverage (pytest)
        if: matrix.shard == 1
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium-headless-shell
          pytest tests/unit/test_legacy_view_hygiene.py tests/unit/test_app_shell.py -q --no-cov --timeout=300 -rs
        env:
          RUN_BROWSER_TESTS: "1"

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: src/frontend/e2e/.blob
          retention-days: 3
          # dot-folder: upload-artifact v4 skips hidden paths unless told otherwise
          include-hidden-files: true

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: src/frontend/e2e/.results
          retention-days: 7
          # dot-folder: upload-artifact v4 skips hidden paths unless told otherwise
          include-hidden-files: true

  e2e-report:
    name: e2e report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Download the shard reports
        uses: actions/download-artifact@v4
        with:
          path: src/frontend/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html,list ./e2e/all-blob-reports
        working-directory: src/frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/.report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/e2e/.report
          retention-days: 7
          # dot-folder: upload-artifact v4 skips hidden paths unless told otherwise
          include-hidden-files: true

  # Safety net after a merge: rebuild the bundle on the CI image and, when the
  # committed copy differs, open a pull request with the synced files. Pull
  # requests that do not touch the frontend never have to carry a bundle.
  bundle-sync:
    name: bundle-sync
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: bundle-sync
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build and sync
        run: |
          npm ci
          npm run build
          npm run sync
        working-directory: src/frontend

      - name: Open a pull request when the committed bundle is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- src/praisonaiui/templates/frontend)" ]; then
            echo "The committed bundle matches the build."
            exit 0
          fi
          branch="bot/frontend-bundle-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- src/praisonaiui/templates/frontend
          git commit -m "chore: sync the frontend bundle with src/frontend"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: sync the frontend bundle" \
              --body "Rebuilt from src/frontend at ${GITHUB_SHA} with \`npm run build && npm run sync\`. No source changes."
          fi

  # Docs are built and deployed to GitHub Pages only by deploy-pages.yml (one
  # deployer, with a concurrency guard). A second deployer here raced it on
  # every merge to main and failed CI with a rejected push to gh-pages.
