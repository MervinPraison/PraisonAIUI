# Minimal docs project for e2e/specs/markdown.spec.ts (built with `aiui build`).
schemaVersion: 1
site:
  title: "AIUI e2e docs"
  theme:
    code: { light: github-light, dark: github-dark-dimmed }   # docs-code.spec.ts
    codeLanguages: [grammars/greet.tmLanguage.json]
  components: ./components/index.js   # docs-components.spec.ts
content:
  docs:
    dir: "./docs"
    editLink:
      pattern: "https://github.com/acme/site/edit/main/docs/:path"
    lastUpdated: true
    feedback:
      issues: "https://github.com/acme/site/issues/new"
    include:
      - "**/*.md"
navigation:
  versions:   # docs-versions.spec.ts: docs/v1/ is the older version
    - {version: v2, default: true, tag: Latest}
    - {version: v1, tag: Legacy}
  languages:  # docs-languages.spec.ts: docs/fr/ is the French translation
    - {language: en, default: true}
    - {language: fr}
api:
  openapi: openapi.yaml   # x-hidden endpoint pages (Try it)
components:
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      left:
        ref: sidebar_docs
      main:
        type: DocContent
routes:
  - match: "/docs/**"
    template: docs
redirects:
  - source: /docs/start
    destination: /docs/guide/first
  - source: /docs/old-guide/:slug*
    destination: /docs/guide/:slug*
