<!doctype html>
<!--
  WP6 dev harness for the React shell (style `app`) against the WP0a contract
  stubs. Dev-only: excluded from the build and from Tailwind scanning.

  npm run dev, then open http://localhost:5173/dev/shell-dev.html
  Query flags (read once at boot):
    ?page=<id>      start on a page (the URL becomes /<id>)
    ?sidebar=0      manifest layout.sidebar = false
    ?header=0       manifest layout.pageHeader = false
    ?default=<id>   manifest layout.default = <id> (root redirect target)
    ?partial=1      inline only {sdk, version, style}, as auth-enforcing servers do;
                    the shell then GETs /api/shell/manifest
  The inline manifest mirrors the server's built-in pages, plus one
  kind=blocks page (hello-blocks).
-->
<html lang="en" data-aiui-shell="react">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>AIUI shell (dev)</title>
    <script id="aiui-theme-bootstrap">
      (function(){try{var t=localStorage.getItem('aiui-theme-preference');if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');else if(t==='light')document.documentElement.classList.remove('dark');}catch(e){}})();
    </script>
    <style id="aiui-dev-fallback-tokens">
      /* Before WP0b's styles/theme.css lands, colours come from the server's
         generated theme.css (HSL triples). Stand in for it here, in a cascade
         layer declared before Tailwind's, so the real token layer wins as soon
         as it exists. */
      @layer aiui-dev-fallback {
        :root {
          --radius: 0.5rem;
          --background: 0 0% 100%; --foreground: 240 10% 3.9%;
          --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
          --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
          --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%;
          --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
          --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
          --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
          --destructive: 0 84.2% 60.2%; --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 240 5.9% 10%;
          --sidebar: 0 0% 98%; --sidebar-foreground: 240 5.3% 26.1%;
          --sidebar-primary: 240 5.9% 10%; --sidebar-primary-foreground: 0 0% 98%;
          --sidebar-accent: 240 4.8% 95.9%; --sidebar-accent-foreground: 240 5.9% 10%;
          --sidebar-border: 220 13% 91%; --sidebar-ring: 240 5.9% 10%;
        }
        .dark {
          --background: 240 10% 3.9%; --foreground: 0 0% 98%;
          --card: 240 10% 3.9%; --card-foreground: 0 0% 98%;
          --popover: 240 10% 3.9%; --popover-foreground: 0 0% 98%;
          --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%;
          --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
          --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
          --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
          --destructive: 0 62.8% 30.6%; --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 240 4.9% 83.9%;
          --sidebar: 240 5.9% 10%; --sidebar-foreground: 240 4.8% 95.9%;
          --sidebar-primary: 0 0% 98%; --sidebar-primary-foreground: 240 5.9% 10%;
          --sidebar-accent: 240 3.7% 15.9%; --sidebar-accent-foreground: 240 4.8% 95.9%;
          --sidebar-border: 240 3.7% 15.9%; --sidebar-ring: 240 4.9% 83.9%;
        }
      }
    </style>

    <script>
      window.__AIUI_BUILD__ = 'dev';
      (function () {
        var q = new URLSearchParams(location.search);
        var el = document.getElementById('aiui-boot');
        var m = JSON.parse(el.textContent);
        if (q.get('sidebar') === '0') m.layout.sidebar = false;
        if (q.get('header') === '0') m.layout.pageHeader = false;
        if (q.get('default')) m.layout['default'] = q.get('default');
        if (q.get('partial') === '1') m = { sdk: m.sdk, version: m.version, style: m.style };
        el.textContent = JSON.stringify(m).replace(/<\//g, '<\\/');
        var page = q.get('page');
        if (page) history.replaceState(null, '', '/' + encodeURIComponent(page));
        else if (/\/dev\/shell-dev\.html$/.test(location.pathname)) history.replaceState(null, '', '/' + location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
